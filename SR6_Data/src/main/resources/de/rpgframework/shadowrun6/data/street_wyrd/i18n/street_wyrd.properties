spell.death_touch=Death Touch
spell.death_touch.page=25
spell.death_touch.desc=Please note that Death Touch, Manabolt, and Manaball are all considered Class 5M weapons and require additional documentation of classes or corporate licensing before purchasing. These spells target living organisms and channel magical energy directly, causing massive cellular die off. Damage effects are similar to radiation or necrotizing fasciitis, but faster and without the continuing effects. But still, ick. Manaball is affected by subconscious targeting, which impacts plants, insects, and other visible living creatures within the area. No discrimination.
spell.disrupt=Disrupt
spell.disrupt.page=25
spell.disrupt.desc=Annoyed by young punk street wizards who loaded up on the latest foci and fetishes? Take them down a peg or two by shutting off their toys. These spells divert mana into disruptive force, temporarily damaging the enchanted items by clogging up the flow of magic through them.
spell.ectomagic_pulse=Ectomagic Pulse
spell.ectomagic_pulse.page=25
spell.ectomagic_pulse.desc=Annoyed by young punk street wizards who loaded up on the latest foci and fetishes? Take them down a peg or two by shutting off their toys. These spells divert mana into disruptive force, temporarily damaging the enchanted items by clogging up the flow of magic through them.
spell.knockout=Knockout
spell.knockout.page=25
spell.knockout.desc=Can’t sleep? Are the constant police sirens and gang shoot-outs keeping you up? Try a little a knockout to quiet the neighborhood. Need an extra-strength dose for those insomniac rockers? Stunball is there when you need it.
spell.hellblast=Hellblast
spell.hellblast.page=26
spell.hellblast.desc=Returning from the depths of the vault, we present Hellblast! With bluish hues and reeking of sulfur, this wicked manifestation of hell on earth will induce fear into your enemies—assuming they survive.
spell.napalm=Napalm
spell.napalm.page=26
spell.napalm.desc=Flamestrike and Fireball are so medieval fantasy. Unless you’re wearing a pointy hat and a t-shirt with the words “Hi, I’m a wizard!” on it, I suggest you update your magical arsenal with Napalm. While not the manifestation of the gelling agent and petroleum products that the spell is named after, it is still an effective creation of an exotic, superheated fluid-like material. Napalm is more effective than Flamestrike as it gets into the material and continues to bring on the heat!
spell.thunderstruck=Thunderstruck
spell.thunderstruck.page=26
spell.thunderstruck.desc=A loud and proud stun spell that is sure to attract attention with the sound of thundering cannons. Intensity of the spell can track to over one hundred decibels with a similar concussive force of Clout.
spell.corrode=Corrode
spell.corrode.page=27
spell.corrode.desc=Move over water, because magic has produced an even better universal solvent. Specify the item you want gone from this mortal world and poof! It’s now a puddle of goo that can be washed down the drain. These spells are ninety-nine percent safe for use around people and pets.
spell.melt=Melt
spell.melt.page=27
spell.melt.desc=Move over water, because magic has produced an even better universal solvent. Specify the item you want gone from this mortal world and poof! It’s now a puddle of goo that can be washed down the drain. These spells are ninety-nine percent safe for use around people and pets.
spell.sludge=Sludge
spell.sludge.page=27
spell.sludge.desc=Move over water, because magic has produced an even better universal solvent. Specify the item you want gone from this mortal world and poof! It’s now a puddle of goo that can be washed down the drain. These spells are ninety-nine percent safe for use around people and pets.
spell.ram=Ram
spell.ram.page=27
spell.ram.desc=Move over water, because magic has produced an even better universal solvent. Specify the item you want gone from this mortal world and poof! It’s now a puddle of goo that can be washed down the drain. These spells are ninety-nine percent safe for use around people and pets.
spell.wreck=Wreck
spell.wreck.page=27
spell.wreck.desc=Move over water, because magic has produced an even better universal solvent. Specify the item you want gone from this mortal world and poof! It’s now a puddle of goo that can be washed down the drain. These spells are ninety-nine percent safe for use around people and pets.
spell.demolish=Demolish
spell.demolish.page=27
spell.demolish.desc=Move over water, because magic has produced an even better universal solvent. Specify the item you want gone from this mortal world and poof! It’s now a puddle of goo that can be washed down the drain. These spells are ninety-nine percent safe for use around people and pets.
spell.hose=Hose
spell.hose.page=28
spell.hose.desc=What better way to wash away your problems than these spells? Create a manifestation of naturally sparking, pure H2O to flush out unwanted obstacles and attention. Cleanup is quick and easy as the water simply washes away, assuming you cast it somewhere with drainage! The volume of the water can be focused to take advantage of the uncompressible force (results may vary).
spell.tsunami=Tsunami
spell.tsunami.page=28
spell.tsunami.desc=What better way to wash away your problems than these spells? Create a manifestation of naturally sparking, pure H2O to flush out unwanted obstacles and attention. Cleanup is quick and easy as the water simply washes away, assuming you cast it somewhere with drainage! The volume of the water can be focused to take advantage of the uncompressible force (results may vary).
spell.punch=Punch
spell.punch.page=28
spell.punch.desc=Feel like you have telekinetic powers with Punch, Clout, and Blast spells! Hit like a prize fighter without the skillchip!
spell.slay=Slay
spell.slay.page=29
spell.slay.desc=Slay and Bane are not only classified as 5M weapons, but they carry additional penalties as they target specific metatypes or sentient species. These penalties, depending on jurisdiction, can result in a death sentence. In accordance with Matrix policies, the Digital Grimoire does not sell any formulas relating to Slay and Bane.
spell.bane=Bane
spell.bane.page=29
spell.bane.desc=Slay and Bane are not only classified as 5M weapons, but they carry additional penalties as they target specific metatypes or sentient species. These penalties, depending on jurisdiction, can result in a death sentence. In accordance with Matrix policies, the Digital Grimoire does not sell any formulas relating to Slay and Bane.
spell.anaphylaxis=Anaphylaxis
spell.anaphylaxis.page=29
spell.anaphylaxis.desc=The world is loaded with things that don’t react well to the body; pollution, pollen, bullets, and soon. For the first two, at least, there is a solution to ease the suffering. Magical ephedrine stops the body from overreacting to various allergens. This is temporary relief until the subject can get away from whatever allergen is causing the problem. Anaphylaxis is a Class 4 spell due to the possibility of associated death. Touching the subject causes an immediate allergic reaction, regardless if the subject has a known allergy or not.
spell.ephedrine=Ephedrine
spell.ephedrine.page=29
spell.ephedrine.desc=The world is loaded with things that don’t react well to the body; pollution, pollen, bullets, and soon. For the first two, at least, there is a solution to ease the suffering. Magical ephedrine stops the body from overreacting to various allergens. This is temporary relief until the subject can get away from whatever allergen is causing the problem. Anaphylaxis is a Class 4 spell due to the possibility of associated death. Touching the subject causes an immediate allergic reaction, regardless if the subject has a known allergy or not.
spell.diagnose=Diagnose
spell.diagnose.page=30
spell.diagnose.desc=Street docs! Why deal with expensive technological equipment or wait for corporate labs to return results when Diagnose is here? Keep your business mobile and offer a plethora of services (blood work, X-rays, chakra scans, aura diagnostics, etc.) with Diagnose at your twitchy fingertips.
spell.fast=Fast
spell.fast.page=30
spell.fast.desc=Atkins, Dukan, Keto, Immortal Agrarian, Metagenic Slimworm, even the Paleo diet pale in comparison to the magic of the Fast spell. With Fast, there are no cravings, no bloating, no growling stomach, no thirst — just a sense of fullness even though you haven’t eaten. Actual weight loss may vary.
spell.healty_glow=Healty Glow
spell.healty_glow.page=30
spell.healty_glow.desc=Worried about getting to the office looking like what the cat threw up after a late rave at Dante’s? Trying to get that promotion at work, but your night job as a punching bag is holding you back? Those who burn the candle with a flamethrower, worry no more! Healthy Glow can relieve that stress, just like magic! Healthy Glow brightens the physical appearance of the subject (improves circulation, whitens teeth, reduces wrinkles, blemishes, split ends, bad breath) and improves general health (bruising fades, tan lines blend, and cuts/ scars look more superficial). Warning! Healthy Glow is a cosmetic change and not a Healing spell. Please see your local street shaman if you are looking for healing treatment.
spell.nutrition=Nutrition
spell.nutrition.page=31
spell.nutrition.desc=Hungry? Well, you too can eat like the great martial art masters. Try Nutrition and feast off the energies of the universe. GMO free and mystically organic! Gluten free! Fat free! Hell, free of any kind of physical form!
spell.oxygenate=Oxygenate
spell.oxygenate.page=31
spell.oxygenate.desc=Imagine being able to dive and stay underwater for more than a few minutes and not having to worry about the bends when you come back up. With Oxygenate, “swimming with the fishes” becomes a survivable scenario (Digital Grimoire doesn’t suggest testing this scenario). Oxygenate infuses the body directly with lifesaving, pure oxygen. No processing of earth’s dirty air needed.
spell.icy_veins=Icy Veins
spell.icy_veins.page=31
spell.icy_veins.desc=Are you really cool as a cucumber? Icy Veins puts you one level cooler than that! Chill out, knowing that you won’t show up on thermals when the heat seekers arrive.
spell.preserve=Preserve
spell.preserve.page=32
spell.preserve.desc=Worried that those smuggled apples will perish before getting to Mr. Johnson or that the milk acquired in your run will sour with all that heat? Well, fret no more! With Preserve, that doggy bag of posh goodies will stay as good as the first bite you had. Preserve prevents decay, mold, staleness, melting, and freezer burn.
spell.rot=Rot
spell.rot.page=32
spell.rot.desc=Stop worrying about how the various bits you leave behind could be used against you as material links; the basic use of this spell destroys any biological material you don’t want to carry with you. Rot is also good for composting, breaking down any organic material into simpler components. Warning: Rot is does not discriminate between living and non-living organic material and is considered a class 4M spell formula, meaning it requires the same permits as a combat spell.
spell.sterilize=Sterilize
spell.sterilize.page=32
spell.sterilize.desc=Kills one hundred percent of bacteria, viruses, parasites, and other pathogens in the targeted area. Sterilize is what you need to thoroughly clean a room, useful for the hypochondriac and hippocratic alike. Its area effect gets to all the hard-to-reach places to make sure that mold isn’t coming back! One hundred percent safe for anything living—except microorganisms.
spell.treat=Treat
spell.treat.page=33
spell.treat.desc=Have you been affected by blindness or deafness? Have you accidently fallen into some mysterious toxic goo and are now experiencing a burning, chilling, or dissolving sensation? Use Treat, then seek medical attention. While Heal can take care of wounds, it cannot always help with side effects. Also helps with dizziness, nausea, headaches, and fatigue. If there is a real emergency, please seek your nearest medical facility.
spell.comfort_zone=Comfort Zone
spell.comfort_zone.page=52
spell.comfort_zone.desc=Want to slow down pursuers, or cause chaos on the street? This spell specifically targets rubber, pulling apart tires and making cars more difficult to control. When casting, target a specific tire and make a Sorcery + Magic (3) test. A successful test ruptures the tire; either the driver has to pull over or drive on a ruined wheel, which reduces the Acceleration by 1, the Speed Interval by 5, and the Top Speed by 10. Additionally, each net hit increases the the Handling of the targeted vehicle by 1. If the original Handling is doubled or more, the vehicle must immediately make a Handling test to avoid crashing.
spell.disentangle=Disentangle
spell.disentangle.page=53
spell.disentangle.desc=Slowed down by magic, a critter, or something else? Use Disentangle to keep moving. Touch someone with the Hobbled or Immobilized status and roll Sorcery + Magic, with a threshold of the Magic rating of the being that imposed the status, the Power of a toxin, or the base damage rating of the weapon that inflicted it (if more than one of these apply, select the highest). For targets with the Immobilized or Hobbled status, net hits serve as bonus dice on tests to resist the status or ignore the pain that might impose the status.
spell.astral_window=Astral Window
spell.astral_window.page=33
spell.astral_window.desc=Magic is hard to explain to the mundane, like color to someone blind. It can be hard to explain to another mage sometimes. With Astral Window, you can open up a window to the astral plane, visible even to the mundane. Then they would understand why magic is so nuts.
spell.borrow_sense=Borrow Sense
spell.borrow_sense.page=33
spell.borrow_sense.desc=Literally see through the eyes of a CEO or listen in on their privileged conversations—at least, until a corp mage traces the spell back to you.
spell.passenger=Passenger
spell.passenger.page=33
spell.passenger.desc=Literally see through the eyes of a CEO or listen in on their privileged conversations—at least, until a corp mage traces the spell back to you.
spell.animal_sense=Animal Sense
spell.animal_sense.page=33
spell.animal_sense.desc=Do you want to know where your cat goes? Or what rat or pigeon tastes like? Your pet can share that with you. Do you want to experience flight like an eagle? Now you can by hitching a ride in the mind of your pet or another animal.
spell.eyes_of_the_pack=Eyes of the Pack
spell.eyes_of_the_pack.page=33
spell.eyes_of_the_pack.desc=Become your own SimStar without the technology. Share your POV with friends and family as you tour famous locations like the Needle, or participate in the entertainment such as the Running of the Bulls.
spell.scrutinize=Scrutinize
spell.scrutinize.page=34
spell.scrutinize.desc=Do you have an eye for detail? Do you need one? Look no further than Scrutinize. Scrutinize can be used to appreciate the different shades of blue, the ridges of a natural brush on canvas, and yes, count the number of jellybeans in a jar. If you need help putting the feng back in your shui, Scruitinize’s more powerful relative, Catalog, can help. Bring that sense of balance and harmony to the whole room. Know the right angle and distance of each object down to the millimeter with ease. In no time, you can get the dragon line flowing through the room with Catalog. Warning! Can cause severe OCD or hyperacusis if sustained for more than eight hours.
spell.catalog=Catalog
spell.catalog.page=34
spell.catalog.desc=Do you have an eye for detail? Do you need one? Look no further than Scrutinize. Scrutinize can be used to appreciate the different shades of blue, the ridges of a natural brush on canvas, and yes, count the number of jellybeans in a jar. If you need help putting the feng back in your shui, Scruitinize’s more powerful relative, Catalog, can help. Bring that sense of balance and harmony to the whole room. Know the right angle and distance of each object down to the millimeter with ease. In no time, you can get the dragon line flowing through the room with Catalog. Warning! Can cause severe OCD or hyperacusis if sustained for more than eight hours.
spell.mana_window=Mana Window
spell.mana_window.page=34
spell.mana_window.desc=As with all things magical, wards and barriers will prevent spells, including area spells, from working on the other side. If only there was a spell that could temporarily lift that mystical veil … oh wait, there is! Mana Window temporarily opens up a hole in a mana barrier, wide enough for the magician to perceive and cast spells through.
spell.translate=Translate
spell.translate.page=35
spell.translate.desc=With this spell, you don’t have to worry about having the correct linguasoft or whether the results successfully convey the intended meaning. When someone speaks in their native tongue, you hear the words in your own language. It’s like a weirdly dubbed foreign film.
spell.babble=Babble
spell.babble.page=35
spell.babble.desc=In today’s world, it’s hard to have a private conversation without having someone or something overhearing it. White noise generators are fine but are obvious secret-hiders that can attract the curious. To address a pressing need, we introduce the Babble spell. Anyone who tries to hear your conversation instead hears a boring or not important conversation on weather or chess instead of the actual conversation (unless that’s what you were actually talking about). Babble works against living entities.
spell.thieves_cant=Thieves Cant
spell.thieves_cant.page=35
spell.thieves_cant.desc=In today’s world, it’s hard to have a private conversation without having someone or something overhearing it. White noise generators are fine but are obvious secret-hiders that can attract the curious. To address a pressing need, we introduce the Babble spell. Anyone who tries to hear your conversation instead hears a boring or not important conversation on weather or chess instead of the actual conversation (unless that’s what you were actually talking about). Thieves’ Cant works against cameras and other technology as well as against living entities.
spell.chaff=Chaff
spell.chaff.page=36
spell.chaff.desc=A little low on luck? Chaff provides a barrage of sensory information to level the playing field. Flashes of light, static discharges, and disorienting noises create confusion in the real world and disruptions in the Matrix.
spell.double_image=Double Image
spell.double_image.page=36
spell.double_image.desc=Need someone to talk to, but don’t have any friends around? Confuse your enemy by splitting a party of one! Double Image creates a realistic illusionary duplicate of a touched subject that moves just like them. Targets who fail to see through the illusion will not be able to tell them apart! Now go to the party with your magical plus-one.
spell.dreams=Dreams
spell.dreams.page=37
spell.dreams.desc=Be the crazy hero, battling bugs and riding a dragon across the Chicago landscape, by dreaming big. With Dream, you can share your delusions of grandeur. Be the literal stuff of nightmares to your enemies, all without having real skills or talent.
spell.foreboding=Foreboding
spell.foreboding.page=37
spell.foreboding.desc=Are people ignoring your sign saying “Keep off the grass” and “No solicitors”? Do gophers and rats raid your garden or kitchen, avoiding the usual traps, flaunting their brazenness with a trail of droppings across your floor? The Foreboding spell may be able to help. Any target that crosses the threshold of the spell area will start to feel nervousness and a sense of dread—enough that they’ll want to never darken your doorstep again. Foreboding affects metahumans and sentient beings.
spell.disquiet=Disquiet
spell.disquiet.page=37
spell.disquiet.desc=Are people ignoring your sign saying “Keep off the grass” and “No solicitors”? Do gophers and rats raid your garden or kitchen, avoiding the usual traps, flaunting their brazenness with a trail of droppings across your floor? The Foreboding spell may be able to help. Any target that crosses the threshold of the spell area will start to feel nervousness and a sense of dread—enough that they’ll want to never darken your doorstep again. Disquiet affects only animals.
spell.false_impression=False Impression
spell.false_impression.page=37
spell.false_impression.desc=Bored at a mystical society meeting? Try False Impression. Change your boss’s aura to that of an Insect, or make yours appear multiple initiate ranks higher than normal. Mess with that one guy who’s always assensing his teammates. Loads of laughs in an Awakened community. Trying to hide a magical duel from the authorities? Use Manascape to obscure all magical activity and hide the fact there are any magicians around.
spell.manascape=Manascape
spell.manascape.page=37
spell.manascape.desc=Bored at a mystical society meeting? Try False Impression. Change your boss’s aura to that of an Insect, or make yours appear multiple initiate ranks higher than normal. Mess with that one guy who’s always assensing his teammates. Loads of laughs in an Awakened community. Trying to hide a magical duel from the authorities? Use Manascape to obscure all magical activity and hide the fact there are any magicians around.
spell.hot_potato=Hot Potato
spell.hot_potato.page=38
spell.hot_potato.desc=Always a fun prank—even the most harmless items will feel like they are molten hot! The magicin rolls Sorcery + Willpower vs. Willpower + Intuition. If the target fails to resist the illusion, they must immediately use a Drop Object Minor Action (p. 41, SR6) to drop whatever they are holding, believing that it is causing them pain.
spell.vehicle_mask=Vehicle Mask
spell.vehicle_mask.page=38
spell.vehicle_mask.desc=Why use virtual wallpaper to change your home surroundings based on some hacker’s limited coding options when you can go with your heart’s desire? Change the appearance of your home or office with the illusory features and textures of Phantomscape. Why bring your friends over to your double-wide when it could look like a small keep, an English cottage complete with the scent of a blossoming garden and tea, or even a cabin in the woods (ominous background music optional). The same goes for your POS 5000. You might not be able to afford a Mitsubishi Nightsky, but you can make it look like you drive one with Vehicle Mask.
spell.phantomscape=Phantomscape
spell.phantomscape.page=38
spell.phantomscape.desc=Why use virtual wallpaper to change your home surroundings based on some hacker’s limited coding options when you can go with your heart’s desire? Change the appearance of your home or office with the illusory features and textures of Phantomscape. Why bring your friends over to your double-wide when it could look like a small keep, an English cottage complete with the scent of a blossoming garden and tea, or even a cabin in the woods (ominous background music optional). The same goes for your POS 5000. You might not be able to afford a Mitsubishi Nightsky, but you can make it look like you drive one with Vehicle Mask.
spell.vine=Vine
spell.vine.page=38
spell.vine.desc=Be the envy of every witch or wizard who ever wanted to have a garden. Got a black thumb? No problem—you don’t need thumbs at all with the Rosebush spell. Quickly start any seed or spore (results may vary). And when the kids won’t get off the lawn, let the lawn give them a lesson with Rosebush!
spell.rosebush=Rosebush
spell.rosebush.page=38
spell.rosebush.desc=Be the envy of every witch or wizard who ever wanted to have a garden. Got a black thumb? No problem—you don’t need thumbs at all with the Rosebush spell. Quickly start any seed or spore (results may vary). And when the kids won’t get off the lawn, let the lawn give them a lesson with Rosebush!
spell.fashion=Fashion
spell.fashion.page=39
spell.fashion.desc=When going from combat to social event, or maybe when you forgot to send your suit to the dry cleaner, this spell is the life-saver you need. Are you wearing the same outfit as the hostess? Fashion it! Is a tie required at a formal event? Fashion it! This spell can restore fabric to a just-like-new state, removing wrinkles and stains (even blood and sweat!) and mending small rips and tears. But that’s not all. A true artist with this spell can adjust the cut, color, pattern, and fit of any outfit to suit their needs. Free up that closet space and rent it out as a small room, because one outfit and your imagination is all you’ll ever need!
spell.catfall=Catfall
spell.catfall.page=39
spell.catfall.desc=Gravity can be a harsh mistress. With Catfall, you can dance a little longer with her without crashing too badly at the end. Catfall reduces acceleration due to gravity, so the subject experiences the force of a much shorter fall.
spell.gecko_crawl=Gecko Crawl
spell.gecko_crawl.page=39
spell.gecko_crawl.desc=When you are stuck in a deep hole, what can you do? If flight is not one of your normal modes of transportation, then hopefully you have purchased Gecko Crawl. Gecko Crawl empowers the subject’s hands and feet with ultra-reliable gecko sticky magic that allows climbing along vertical surfaces. Want more? How about the ability to climb horizontally, but upside down!
spell.glue=Glue
spell.glue.page=39
spell.glue.desc=Ran out of duct tape and zip ties? No worries! With Glue, any surface will do to keep a subject from escaping. Also works for keeping bumpers on cars, change in pockets, and hats on heads.
spell.ice_sheet=Ice Sheet
spell.ice_sheet.page=40
spell.ice_sheet.desc=Need an exciting way to get around town? Keep it cool and fun with Ice Sheet, and slide your way to destiny! Have fun surprising your friends, neighbors. or security officers with Ice Sheet. Watch them fall down as you slip away!
spell.looking_glass=Looking Glass
spell.looking_glass.page=40
spell.looking_glass.desc=Transparent aluminum? How about transparent concrete? Yes, folks, this spell changes the opacity of any material to a new magical translucence! It’s so clear, you’d swear it wasn’t even there.
spell.magic_fingers=Magic Fingers
spell.magic_fingers.page=41
spell.magic_fingers.desc=Magic Fingers creates psychokinetic force with enough precision to mimic the movement of hands. Handy for all those hard-to-reach places!
spell.disregard=Disregard
spell.disregard.page=41
spell.disregard.desc=Disregard is a fascinating yet subtle mind-affecting spell. It manipulates and redirects attention, similar to the way people get so hyperfocused on a trideo show that they aren’t aware of anything happening around them. It alters both perception and memory, making designated individuals unimportant to those affected by the spell. For example, a police officer affected by Disregard could show a picture of a suspect to the actual suspect and ask if they’d seen themselves all without recognizing them. The suspect is not invisible—they’re simply not important to the officer and not relevant to the task at hand. When the spell ends, the officer won’t remember any details of their time under its influence.
spell.makeover=Makeover
spell.makeover.page=42
spell.makeover.desc=Can’t have a new wardrobe without a new do! Makeover can help color-coordinate nails, mascara, and hair with today’s outfit. Feel like an autumn this week when you’re actually a winter? Makeover can make the adjustment before you step out the door.
spell.mob_mood=Mob Mood
spell.mob_mood.page=42
spell.mob_mood.desc=Do you want to spread the joy you feel to others? How about animosity toward someone? With Mob Mood, you can adjust the general feelings of the people in an area. With Mob Mind, you can give the same general thought to people in an area. So when you’re happy and you know it, then wave your hands so everyone can show it with Mob Mood and Mob Mind!
spell.mob_mind=Mob Mind
spell.mob_mind.page=42
spell.mob_mind.desc=Do you want to spread the joy you feel to others? How about animosity toward someone? With Mob Mood, you can adjust the general feelings of the people in an area. With Mob Mind, you can give the same general thought to people in an area. So when you’re happy and you know it, then wave your hands so everyone can show it with Mob Mood and Mob Mind!
spell.lokis_musical=Loki's Musical Number
spell.lokis_musical.page=43
spell.lokis_musical.desc=Ever get an earworm that you just can’t get rid of? Try passing it along to others, along with a singalong vibes and dance moves. Loki’s musical number brings a party anywhere you are! Instant Bollywood scene!
spell.stone_fist=Stone Fist
spell.stone_fist.page=53
spell.stone_fist.desc=Casting this spell hardens the target’s fists, making their punches feel like they are made with blocks of solid stone. Raise the Unarmed Combat damage of the target to 3S; if their Strength is 5 or more, make it 4S. Hits on the Spellcasting test increase the Attack Rating of the attack with the fists by 1 per hit.
spell.boil_blood=Boil Blood
spell.boil_blood.page=159
spell.boil_blood.desc=The blood mage calls forth a gout of blood from the target and excites it before hurling it back at them, weakening them as well as doing Fire damage. This spell applies the Burning status with a rating equal to the number of net hits on the Spellcasting test, as well as the Bleeding status for (net hits) combat rounds. Amp Up spell adjustments may be applied.
spell.chilled_claret=Chilled Claret
spell.chilled_claret.page=160
spell.chilled_claret.desc=The blood mage chills the blood running through the target’s veins, slowing the target to allow easier capture as well as inflicting Stun damage. This spell imposes the Hobbled status for (net hits) Combat Rounds. If net hits are greater than Body or Willpower (whichever is higher), the target gains the Dazed status for 1 Combat Round. Amp Up spell adjustments may be applied.
spell.clot=Clot
spell.clot.page=160
spell.clot.desc=The blood magician draws on the power of blood to magically enhance the blood’s ability to clot and reduce injuries. The caster rolls Sorcery + Magic (5 – Essence); net hits on this test are the spell’s maximum duration in combat rounds. When the target takes 2+ boxes of Physical damage, reduce the damage by 1. This spell eliminates (and provides immunity to) the Bleeding status. This spell does not stack with platelet factories bioware and cancels the Anticoagulant spell. Use of this spell can be considered life magic.
spell.anticoagulant=Anticoagulant
spell.anticoagulant.page=160
spell.anticoagulant.desc=The blood mage enchants the blood of the target to increase damage. Caster rolls Sorcery + Magic vs Body + Willpower; net hits count as the maximum duration of the spell in combat rounds; the target gains the Bleeding status while the spell is sustained. When the target takes Physical damage, increase the number of boxes of damage by 1. This spell cancels the Clot spell.
spell.blood_puppet=Blood Puppet
spell.blood_puppet.page=160
spell.blood_puppet.desc=The spellcaster calls out to the blood of the target, bewitching it to obey their commands. The caster may impose statuses on the target with a maximum duration of (net hits) combat rounds; they can switch statuses as the spell continues, though this does not change the duration. The statuses that may be imposed are: Bleeding, Burning 1 (cannot be countered or eliminated by physical means, though magical means may be used), Chilled, Fatigued I, and Panicked.
spell.viscera_web=Viscera Web
spell.viscera_web.page=160
spell.viscera_web.desc=A horrific spell, this causes widespread rupturing across the target’s body as their veins shoot out to adhere to the environment surrounding them, although non-living material—including clothing, gear, and cyberware—is not affected. This incapacitates them with extraordinary damage and pain, plus the fact that their living veins stick to the floor, walls, and ceiling. The caster rolls Sorcery + Magic vs. Willpower + Agility. If successfully cast, this spell applies the Immobilized status; if the caster’s net hits are greater than the target’s Body rank, this becomes the Stilled status instead. The target of this spell may spend a Major Action on their turn to roll Body + Strength to break free, but doing so applies the Bleeding status with a duration equal to the caster’s net hits in combat rounds, and inflicts (net hits) Physical damage (resisted normally). Alternatively, a friend can cut the character away, thus removing Stilled or Immobilized statuses—but doing so also causes the Bleeding status and damage as if the target had broken free. Should an ally use appropriate care to free the target of this spell (succeeding in a Biotech + Logic (4) test), the target suffers no damage and does not gain the Bleeding status. This takes 1 minute and requires medical supplies (such as a medkit).

