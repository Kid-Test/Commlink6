spell.conceal_scent=Conceal Scent
spell.conceal_scent.page=16
spell.conceal_scent.desc=It’s like invisibility for body odor! This spell conceals any source of scent coming from the target, whether this is from poor hygiene, tailored pheromones or chemical objects. This is handy for hunters who don’t want prey picking up their scent, or for fooling olfactory sensors, as this works on both natural and artificial senses. Note that most chem-sniffers designed to detect toxins, propellant (gunpowder), and explosives are unable to detect substances covered by this spell.
spell.reptile_blood=Reptile Blood
spell.reptile_blood.page=16
spell.reptile_blood.desc=This subtle spell subtly modifies the target’s metabolism to make them appear cold-blooded and match their body temperature to the current ambient temperature. This effectively makes the target invisible to thermal and infrared sensors for a short time. If other senses are also at play a Stealth test might still be necessary, in which case the target gains a point of Edge that must be used on the Stealth test or is lost. The magic causes an immediate effect that begins to fade over time, unlike an invisibility spell which must be sustained. The effect lasts for one minute per net hit and can only be detected in the moment the spell is cast. Once in place, the only trace left behind is the astral signature, and it is advisable that you take a moment to clear that up so there are no traces at all.

