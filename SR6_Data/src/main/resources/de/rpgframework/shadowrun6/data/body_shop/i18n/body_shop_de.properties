quality.cyber_singularity_seeker=Auf der Suche nach der Cyber-Singularität
quality.cyber_singularity_seeker.page=177
quality.cyber_singularity_seeker.desc=Du glaubst, dass dich jedes zusätzliche Cyberware-Implantat näher zu einem Zustand vollkommener Harmnoie zwischen Metamensch und Maschine führt. Wenn du dir Gliedmaßen durch Cyberware ersetzen lässt, gibt dir das nicht das Gefühl, einen Teil von dir zu opfern - Im Gegenteil, du fühlst dich vollständiger als zuvor.<br/><br/>\
 <b>• Kosten:</b> 10 Karma<br/>\
 <b>• Auswirkung:</b> Für jedes Paar Cybergliedmaßen (zwei Arme oder zwei Beine), das du dir implantieren lässt, erhältst du einen Bonus von +1 auf Willenskraft, bis zu einem maximalen Bonus von +2 Willenskraft.
quality.drug_tolerant=Drogentoleranz
quality.drug_tolerant.page=178
quality.drug_tolerant.desc=Du bist überdurchschnittlich resistent dagegen, eine Drogenabhängigkeit zu entwickeln. Vielleicht verfügst du über eine genetisch bedingt erhöhte Toleranz, vielleicht bist du auch nur stur wie ein Esel und zäh wie Leder. So oder so hat die Sucht es schwerer, dich in ihre Krallen zu bekommen.<br/><br/>\
 <b>• Kosten:</b> 5 Karma<br/>\
 <b>• Auswirkung:</b> Bei Abhängigkeitsproben erhältst du 1 Punkt situatives Edge.
quality.empathic_retention=Verwurzelte Empathie
quality.empathic_retention.page=178
quality.empathic_retention.desc=Sei es durch natürliches Talent oder intesives Training: Du hast dir dein Gespür für die subtilen nonverbalen Anzeichen bewahrt, die in der Kommunikation zwischen Metamenschen zum Einsatz kommen. Dadurch kannst du die schwindende soziale Empathie, die in der Regel mit Essenzverlust einhergeht, abmildern.<br/><br/>\
 <b>• Kosten:</b> 4 Karma pro Stufe (max. Stufe 2)<br/>\
 <b>• Auswirkung:</b> Für jede Stufe dieses Vorteils kannst du den Malus, den du aufgrund deines Essenzverlusts auf deinen Sozialwert erhalten würdest, um 1 senken. Du kannst durch diesen Vorteil keinen Bonus auf deinen Sozialwert erhalten, sondern lediglich den Malus durch Essenzverlust ausgleichen. Andere Faktoren, die sich negativ auf den Sozialwert auswirken, kommen weiterhin zum Tragen.
quality.redliner=Ausgereizt
quality.redliner.page=177
quality.redliner.desc=Alle deine Cybergliedmaßen sind übertaktet, ihre Sicherheitsbegrenzungen wurden deaktiviert. Dadurch laufen sie mit erhöhter Leistung, aber die zusätzliche Belastung geht nicht spurlos an deinem Körper vorüber.<br/><br/>\
 <b>• Kosten:</b>  10 Karma<br/>\
 <b>• Auswirkung:</b> Für jedes Paar Cybergliedmaßen (zwei Arme oder zwei Beine), das du dir implantieren lässt, erhalten alle deine Cybergliedmaßenpaare einen zusätzlichen Bonus von +1 auf Stärke und Geschicklichkeit, bis zu einem Gesamtbons von +2 pro Attribut. Der maximale Attributsbonus durch Cybergliedmaßen gilt weiterhin. <br/>Die starke Überbeanspruchung deiner Cybergliedmaßen ist jedoch eine Belastung für deinen Körper, so dass die strukturelle Integrität, die Cybergliedmaßen normalerweise verleihen, nicht voll zum Tragen kommt. Dein körperlicher Zustandsmonitor erhöht sich nur um 1 Kästchen pro komplettes Cybergliedmaßen-Paar, nicht wie üblich um 1 Kästchen je Cybergliedmaße.
quality.chronic_dissociation_syndrome=Chronisches Dissoziationssyndrom (CDS)
quality.chronic_dissociation_syndrome.page=179
quality.chronic_dissociation_syndrome.desc=CDS it die häufigste psychologische Störung bei Leuten mit ausgedehnten Modifikationen. Das Hauptsymptom ist ein ausgeprägtes Gefühl der Gleichgültigkeit und Distanz gegenüber der Umwelt, dem sozialen Umfeld und den eigenen Interessen. Selbst ein funktionstüchtiger Induzierter Gedächtnisstimulator kann der mit CDS einhergehenden starken Apathie und Depression keinen Einhalt gebieten.<br/><br/>\
 <b>• Bonus:</b> 10 Karma<br/>\
 <b>• Auswirkung:</b> Um diesen Nachteil wählen zu können, muss deine Essenz geringer als 3 sein. Du erhältst einen Würfelpoolmalus von -3 auf sämtliche Proben, bei denen Willenskraft Teil des Würfelpools ist, mit Ausnahme von Schadenswiderstandsproben und Widerstandsproben gegen Spruchzauberei.
quality.delusion=Wahnvorstellungen
quality.delusion.page=180
quality.delusion.desc=Du trägst eine felsenfeste Überzeugung mit dir herum, die jedoch nicht auf realen Fakten beruht. Egal, mit welchen logischen Argumenten oder mit wie viel betörendem Charm man auf dich einwirkt, von dieser Meinung lässt du dich nicht abbringen.<br/><br/>\
 <b>• Bonus:</b> 10 Karma<br/>\
 <b>• Auswirkung:</b> Die Wahnvorstellung sorgt dafür, dass du in den meisten sozialen Situationen den Stauts <i>Verwirrt 2</i> erhältst. Dieser Nachteil greift auch dann, wenn du durch die Ereignisse während eines Shadowruns direkt mit dem Gegenstand deiner Wahnvorstellung konfrontiert wirst. Wann immer die Realität deiner Wahnvorstellung widerspricht, musst du dir eine Begründung dafür einfallen lassen, warum die Wahnvorstellung in diesem Moment scheinbar nicht zutrifft. Beispiele für Wahnvorstellungen umfassen einen imaginären Freund oder Feind, den Glauben an die Macht eines Glücksbringers oder das Wissen um eine globale Verschwörung der Drachen und Elfen.<br/>\
 Sollte die Wahnvorstellung gewaltsam zerschmettert werden und solltest du nicht imstande sein, dir das verstandesmäßig zu erklären, leidest du unter extremem Stress. Du musst eine Probe auf Selbstbeherrschung (4) ablegen. Misslingt die Probe, erleidest du einen mentalen Zusammmenbruch. Dieser kann zu einer neuen Wahnvorstellung oder einem ähnlichen Nachteil führen, der die alte Wahnvorstellung ersetzt.
quality.emotional_flatline=Emotionslos
quality.emotional_flatline.page=179
quality.emotional_flatline.desc=Du hast so viele Implantate, Dass du eher einer Maschine als einem Metamenschen gleichst. In sozialen Situationen bist du kalt und berechnend, und zwar in einem Maße, dass es andere Personen beunruhigt. Manchmal kann das durchaus von Vorteil sein - zum Beispiel in Situationen, in denen du anderen gezielt Angst einjagen willst.<br/><br/>\
 <b>• Bonus:</b> 5 Karma<br/>\
 <b>• Auswirkung:</b> Wann immer du eine Vergleichende Probe auf Überreden oder Einfluss ablegst (Ausnahme: Einschüchtern), erhält dein Gegner für jede Probe 1 Punkt situatives Edge, da du nicht in der Lage bist, dich auf einer zwischenmenschlichen Ebene auf andere einzulassen. Bei Einschüchtern-Proben erhältst hingege du aufgrund deiner kaltschnäuzigen Gleichgültigkeit gegenüber anderen 1 Punkt situatives Edge.
quality.emotion_leak=Offenes Buch
quality.emotion_leak.page=179
quality.emotion_leak.desc=Bisweilen haben Personen mit zahlreichen Cyberware-Implantaten Schwierigkeiten, ihre Emotionen zu verbergen - andere Metamenschen spüren instinktiv, was ein solcher Charakter gerade fühlt. Beim Verhandeln, Überreden, Glücksspiel oder bei anderen Interaktionen von Angesicht zu Angesicht, für die Täuschung eine Rolle spielt, ist das ein Nachteil.<br/><br/>\
 <b>• Bonus:</b> 10 Karma<br/>\
 <b>• Auswirkung:</b> Bei Einfluss- oder Überreden-Proben kannst du kein Edge einsetzen.
quality.hallucinations=Halluzinationen
quality.hallucinations.page=169
quality.meat_surrogacy=Bioware Inkubator
quality.meat_surrogacy.page=178
quality.meat_surrogacy.desc=Nicht alle Bioware-Implantate können in Tanks gezüchtet werden. Kultivierte Bioware muss oft in einem lebenden Wirt heranwachsen - und du hast dich freiwillig dafür gemeldet. In deinem Körper wächst eine unbekannte, inaktive Bioware vo sich hin, und sobald sie entnommen wird, wirst du damit eine nette Summe Geld verdienen. Da dieses Bioware-Implantat nicht genau auf dich zugeschnitten ist, kostet es deinen Körper einiges an Anstrengung, es mit dir herumzuschleppen. Aber hey, am Ende wird die üppige Bezahlung die Mühen schon wettmachen.<br/><br/>\
 <b>• Bonus:</b>:</b> 2 Karma pro Stufe (max. Stufe 3)<br/>\
 <b>• Auswirkung:</b> Du kannst diesen Nachteil in 3 Stufen erwerben. Jede Stufe kostet dich 1 Punkt Essenz. Bis dieser Nachteil wieder entfernt wird, zählt diese Essenzpunkt als verbraucht. Falls sich die Bioware sechs Monate nach Erhalt dieses Nachteils immer noch in deinem Körper befindet, kannst du Kontakt zu dem Arzt aufnehmen, der sie eingesetzt hat. Das Implantat wird daraufhin wieder entfernt und du erhältst pro Essenzpunkt, der durch diesen Nachteil blockiert wird, 20.000 Nuyen. Nach Abschluss der Prozedur hast du ein Essenzloch in Höhe der Stufe dieses Nachteils. Danach wird dieser Nachteil entfernt.<br/>\
 Es besteht das Risiko, dass die heranwachsende Bioware bereits vorher beschädigt oder gewaltsam entfernt wird. In diesem Fall musst du für die Beschädigungen aufkommen - die Schadensssumme wird am Ende der sechs Monate von deiner Bezahlung abgezogen. Falls du durch einen einzelnen Angriff mehr als 6 Kästchen Körperlichen Schaden erhältst, musst du eine Konstitutionsprobe ablegen, deren Schwellenwert der Stufe dieses Nachteils entspricht. Gelingt die Probe, ist die heranwachsende Bioware unversehrt geblieben. Misslingt die Probe jedoch, wird die Abschlussbezahlung für das ausgewachsene Implantat für jeweils 6 Kästchen Schaden, die durch einen einzelnen Angriff erlitten wurden, um 10 Prozent gesenkt. Sollte die Bioware gewaltsam entfernt werden, erhältst du keine Bezahlung.<br/>\
 Vielleicht entscheidest du dich am Ende, dir die Bioware doch nicht entnehmen zu lassen, wo du sie erhalten hast, vielleicht willst du sie stattdessen auch an eine andere interessierte Partei verkaufen oder den Nachteil durch Ausgeben von Karma entfernen. In diesem Fall erhältst du den Nachteil Gejagt (<i>Schattenkompendium</i>, S. 148). Die Stufe entspricht der Stufe dieses Nachteils, der dadurch entfernt wird.
quality.superhuman_ego=Übermenschenpsychose
quality.superhuman_ego.page=180
quality.superhuman_ego.desc=Wenn man schneller, stärker und zäher als so ziemlich alle anderen Leute sein kann, dann liegt die Schlussfolgerung nicht fern, dass einen das zum Superhelden macht. Runner mit übermenschlichen Fähigkeiten, die sie durch Magie oder Bodytech erhalten haben, gelangen mitunter zu der Überzeugung, mehr wert zu sein als andere Metamenschen.<br/><br/>\
 <b>• Bonus:</b>:</b> 12 Karma<br/>\
 <b>• Auswirkung:</b> Runner mit diesem Nachteil sind der Ansicht, dass normale Metamenschen minderwertig sind. Beim Töten dieser niederen Wesen verspüren sie weder Zögern noch Reue. Auch gegnerische Angriffe bereiten ihnen keine größeren Sorgen, da sie sich unverwundbar fühlen. Bei Verteidigungsproben kannst du kein Edge erhalten. Außerdem kannst du keine Vor- oder Nachteile erhalten, die dafür sorgen, dass du andere Metamenschen nicht bedenkenlos töten oder als irgendetwas anderes als niedere Wesen ansehen würdest (z.B. Hooder oder Ehrenkodex).
quality.tlex=TLE-X
quality.tlex.page=179
quality.uncontrolled_metastasis=Unkontrollierte Metastasen
quality.uncontrolled_metastasis.page=180
quality.uncontrolled_metastasis.desc=Die Medikamente, die verhindern, dass schwer vercyberte Personen ihre Unmengen an Implantaten abstoßen, können nicht nur einen Metamenschen, sondern auch Tumore am Leben halten.<br/><br/>\
 <b>• Bonus:</b>:</b> 10 Karma pro Stufe (max. Stufe 2)<br/>\
 <b>• Auswirkung:</b> Charaktere mit unkontrollierbaren Metastasen tragen zahlreiche Krebstumore mit sich herum. Für 10 Karma wachsen diese Tumore stetig, aber langsam - du musst dich jeden Monat Operationen oder einer Nanotech-Behandlung unterziehen, um die Krebsgeschwüre zu entfernen. Tust du das nicht, wirst du schwerkrank (und bist effektiv handlungsunfähig). Deine Lebensstilkosten steigen durch die notwendigen Behandlungen pro Monat um 1.000 Nuyen. Für 20 Karma lassen sich die Tumore und das Krebsgewebe nicht mehr komplett entfernen (die Operationen sind dennoch notwendig). Die daraus entstehenden körperlichen Deformierungen und Wucherungen sorgen dafür, dass du bei allen sozialen Interaktionen von Angesicht zu Angesicht einen permanenten Würfelpoolmalus von -2 erhältst. Außerdem steigen deine monatlichen Lebensstilkosten um 2.000 Nuyen.
