quality.uncontrolled_metastasis.choice.tempo.slow.desc=Langsames Wachstum
quality.uncontrolled_metastasis.choice.tempo.fast=Schnell
quality.uncontrolled_metastasis.choice.tempo.fast.desc=Schnelles Wachstum

quality.will_to_die=Todessehnsucht
quality.will_to_die.page=180
quality.will_to_die.desc=Personen mit sehr niedriger Essenz balancieren ständig auf dem feinen Grat zwischen Leben und Tod, denn die Verbindung zwischen Körper und Geist ist in diesem Fall nur noch ein dünnes, fragiles Band.<br/><br/>\
 <b>• Bonus:</b>:</b> 10 Karma<br/>\
 <b>• Auswirkung:</b> Um diesen Nachteil wählen zu können, muss deine Essenz kleiner als 2 sein. Du hast 2 Schadenskästchen für überzähligen Schaden weniger als normal.
