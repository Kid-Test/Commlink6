contacttype.free_spirit=Free Spirit
contacttype.free_spirit.page=27
contacttype.free_spirit.desc=Free spirits have become less rare on the physical plane, and many of them commute to Earth from their metaplanar homes, spending time in both places. They offer services in exchange for valuables, Karma, and the more worldly among them acquire nuyen as well. In addition to providing direct assistance by using their powers, a free spirit contact can act as a source of valuable information, a guide to traveling the metaplanes, or even provide access to the metaplanes using their Astral Gateway power.<br/>\
Free spirit contacts can only have one type: Free Spirit. They might take on other roles, duties, and responsibilities, but they are outsiders on the physical plane. A free spirit's Connection rating is often equal to its Force but could vary based on the spirit's behavior.<br/>\
A Free Spirit's Loyalty rating maxes out at 4 at character creation.

