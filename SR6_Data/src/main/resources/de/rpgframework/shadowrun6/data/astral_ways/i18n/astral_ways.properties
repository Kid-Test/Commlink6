spell.metaplanar_stasis=Metaplanar Stasis
spell.metaplanar_stasis.page=173
spell.metaplanar_stasis.desc=Occasionally there may be a reason to stop metaplanar translation from occurring. It could be necessary for bringing back some scientific material for study, carrying true elements safely through a passageway, or preventing some particularly unpleasant attunement, such as when visiting the Hive. While the spell is maintained on an item or person, metaplanar translation does not occur to anything within the Metaplanar Stasis spell’s area of effect. The point where this effect occurs appears to be inside the passageway, moving from one metaplane to another. After arriving at a new metaplane, the spell can be dropped, and the affected material will hold whatever form it had when the spell was first cast, regardless of the current reality paradigm.

