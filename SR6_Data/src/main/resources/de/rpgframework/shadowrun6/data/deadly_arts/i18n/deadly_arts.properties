# Spells
spell.aerial_flare=Aerial Flare
spell.aerial_flare.page=166
spell.aerial_flare.desc=The Aerial Flare provides emergency illumination before or during a combat engagement. Casting magicians can put the flare at an altitude of their choosing up to 200 meters, determine the rate of descent, duration time (up to 60 seconds), and adjust the flare’s area of illumination up to their current Magic rating x 100 meters in diameter. The spellcaster can also increase the flare’s intensity to that of a flash grenade and impart the Blindness status if a target doesn’t have flare compensation or avoids the attack. If used offensively, the spell’s DV increases to 4.
spell.astral_flare=Astral Flare
spell.astral_flare.page=166
spell.astral_flare.desc=Used to detect spirits on the astral plane not yet manifested, spell effects, Awakened, astral projecting magicians, and dual-natured beings in hiding, the Astral Flare spell is operated just like a military flare. Launched into a target area, the Astral Flare sends out a pulse of magical energy that reacts with any of the previously listed entities or beings, causing them to brightly glow for approximately 1 minute. The area of illumination is equal to a two-meter radius sphere, which can be expanded with the Increase Area adjustment. Masking metamagics can defend against this spell; all others must make a Magical Resistance test at –2 dice.
spell.bridge_layer=Bridge Layer
spell.bridge_layer.page=166
spell.bridge_layer.desc=Bridge Layer is used when troops or vehicles need to traverse treacherous ground or across natural obstacles. When cast, the magician shapes the bridge into whatever form is needed or desired. The bridge must be horizontal and connect two solid surfaces to each other. The total bridge area (length and width) is equal to the magician’s Magic rating x 50 meters and can be adjusted to be longer or wider. If insufficient for the task at hand, the magician (or multiple magicians) can cast the spell multiple times and stack them together. These bridges use a form of levitation and can hold up to a total of 100 metric tons, which is enough for low-altitude VTOLs, such as main battle tanks, to work off of. The bridge can be sustained up to a number of minutes equal to the magician’s Magic x 5, at which point the spell ends unless the magician recasts the spell, which restarts the clock.
spell.dead_weight=Dead Weight
spell.dead_weight.page=166
spell.dead_weight.desc=Intended to slow or pin down enemy troops without (intentionally) causing physical damage, the Dead Weight spell targets not the individual, but their gear, armor, and weapons by increasing their weight by several magnitudes. The spell’s area of effect is s two-meter radius, which can be expanded with the Increase Area effect. Its maximum duration is Magic x 5 minutes. Those targeted with this spell can resist with a Reaction + Willpower test or a Reaction + Strength test, whichever is higher (all other resistance rules apply), or by removing and dropping their affected gear and weaponry. Those who successfully resist continue to move normally. Those who don’t are pinned to the ground and are considered grappled. This spell cannot be used against vehicles or large drones.
spell.designate_target=Designate Target
spell.designate_target.page=166
spell.designate_target.desc=Sometimes a person or thing simply needs to stop existing. And sometimes people and even technology need help locating that person or thing that needs to stop existing. To assist in this process of making that person or thing stop existing, there’s the Designate Target spell, also known in military circles as the “Frag That Guy” spell. If successfully cast, the target is painted with a magical beacon that is visible in both the material and astral planes up to (the casting magician’s Magic rating x 100) meters. The beacon persists while sustained, up to a maximum of 5 minutes. This beacon can look like whatever the spellcaster wishes. Popular variations include: a bullseye, a pointing finger (sometimes middle instead of index), an arrow, or a “shoot here!” sign. This beacon follows the target wherever they go and cannot be defeated by any kind of cover or concealment. The only way to defeat the spell is by the initial Body + Willpower resistance test, using Countermagic techniques, or getting out of range before they stop existing.
spell.dirt_wave=Dirt Wave
spell.dirt_wave.page=167
spell.dirt_wave.desc=Originally designed to be employed as a mine and IED sweeping spell, the Dirt Wave spell proved to be equally effective at knocking enemy combatants off their feet. When cast, the spell creates a miniature earthquake and wave-like effect through the ground. This wave is typically enough to set off explosive mines, booby traps, or IEDs; or at the very least uncover them when they’re buried. When used as a sweeper, the spell’s DV is 2. When used offensively, because Dirt Wave is an area effect spell, it can target enemy combatants even if they’re behind cover. The area of this attack is a two-meter radius, which can be expanded with the Increase Area effect. Considered an Indirect Attack, if the targets fail their defense test, they gain both the Dazed and Prone statuses.
spell.earthworks=Earthworks
spell.earthworks.page=167
spell.earthworks.desc=Used to quickly move and reshape the earth, this spell is often used to make everything from small foxholes to large trenches, to tunnels and earthen embankments. When cast, this spell can move up to (the caster’s Magic rating x 10) kilograms of soil per casting. With an additional Minor Action, this displaced soil can be immediately used to create defensive embankments near the newly created hole with a Structure rating of 14.
spell.emergency_stretcher=Emergency Stretcher
spell.emergency_stretcher.page=168
spell.emergency_stretcher.desc=Sometimes an injured or wounded soldier needs to be quickly removed from the battlefield, but there are no means by which to do this. For these situations, the Emergency Stretcher spell can be employed. By using magical construction means, the caster can reshape whatever raw materials are on hand (even dirt or soil) into a makeshift stretcher that can be used by either one or two individuals. This emergency stretcher can remain in use as long as the magician maintains their concentration. Should they lose it for whatever reason, the stretcher falls apart into its material components.
spell.fog_of_war=Fog of War
spell.fog_of_war.page=168
spell.fog_of_war.desc=Used to conceal or deny movement on the battlefield, both offensively and defensively, this powerful illusion spell creates a large area of magical fog that severely limits standard vision, vision enhancement, and visual sensors (treat as thermal smoke, p. 263, SR6). Additionally, sensors of all kinds are hindered (–2 to their ratings), and all Perception tests within this illusionary fog bank are at –3 dice. The downside is that this spell does not discriminate; anyone within the fog suffers the negative penalties. Sonar or any kind of echolocation methods can be used to defeat this spell, as well as any abilities or powers that counter blind fighting.
spell.forced_march=Forced March
spell.forced_march.page=168
spell.forced_march.desc=A controversial spell among most militaries, the Forced March spell not only allows the spellcaster to remove any Fatigue statuses the subjects may be feeling, but it also allows the spellcaster to force those under their spell’s control to continue marching at their normal foot speed, even if they are or become unconscious. The number of subjects the spellcaster is able to control is equal to (their Magic rating x 10). Normally, this spell is cast with compliance from the subjects, but it can be resisted with a Willpower + Intuition test, the threshold being equal to the number of net hits the spellcaster obtained when casting the spell. When using this spell, the magician can only control their walking pace. Any attempt to bypass the foot speed of the slowest member of the group (typically dwarves), going over harsh or uneven terrain, having to traverse obstacles, or break in the spellcasting magician’s concentration will automatically break the spell. Those who are conscious can attempt to break the spell at any time and the magician can drop the spell at any time.
spell.gale_force=Gale Force
spell.gale_force.page=168
spell.gale_force.desc=Turning wind into a weapon, this spell creates an immensely powerful blast of air focused at a single target. Designed to knock these targets off the ground or out of the air, this spell has three levels. Level one is meant for most metahuman-sized and weighted objects (including trolls and up to medium-sized drones). Level two is meant for large-sized drones and small vehicles (such as motorcycles and cars), while level three is meant for larger aircraft such as VTOLs. DV for level one of this spell is 4, level two is 5, and three is 6. When attacked, the target must make a stabilization check. For metahumans and critters, this check is Athletics + Reaction. For anything being piloted, it’s Piloting + Reaction. The threshold for these tests is the net hits of the magician casting the spell. If this test is failed, anything on the ground gains the Dazed and Prone status. Anything airborne (drones or aircraft) is unable to act in the current combat round and in the next round must make another Piloting + Reaction test at –1 or risk crashing.
spell.iff=IFF
spell.iff.page=168
spell.iff.desc=In the chaos of combat, especially when communications are down or disrupted, and visual identification is limited, it’s sometimes difficult to know the difference between friend and foe. Similar to the Detect Enemy spell, the IFF (Identification: Friend or Foe) spell allows the subject to identify those who are friendly and those who are hostile within (the caster’s Magic + net hits) meters. If sustained, this spell also allows the subject to track the movement of those identified as long as they remain in range.
spell.practical_camouflage=Practical Camouflage
spell.practical_camouflage.page=169
spell.practical_camouflage.desc=A simple spell often used in the field when moving from one type of environment to another, Practical Camouflage allows the caster to change the color patterns of a vehicle, object, gear, weapon, and even person. This spell can be done for multiple items at the same time, such as a fully kitted-up soldier. It can also be used to cancel or change a previous pattern. The spell’s effects are not truly permanent and will fade in a number of hours equal to the caster’s Magic rating at time of casting. For those camouflaged by this spell, they gain a +2 to all Stealth (Sneaking) tests while in the appropriate environment. If the subject of the spell leaves the environment they’re camouflaged for and enters a completely different environment, such as desert to arctic, then they will have a –2 dice pool penalty to all Stealth (Sneaking) tests.
spell.pit_trap=Pit Trap
spell.pit_trap.page=169
spell.pit_trap.desc=Pit Trap (Manipulation) RANGE TYPE DURATION DV LOS(A) P I 4, 2 Sometimes disparaged by modern militaries, the Pit Trap spell is often used as a security measure while operating in the field. When cast, this spell creates a pit in natural ground with a radius of two meters, which can be expanded using the Increase Area adjustment. The depth of the pit is the caster’s Magic attribute in meters. At the bottom of the pit are sharp, stalagmite-like spikes that cause 3P damage to anyone who falls in. The trap’s opening can be concealed by local vegetation or by a supplementary spell casting at a lower DV. This cover will not support any weight over approximately 3 kilograms; anything weighing more than this will fall in. A Perception + Intuition test with a threshold equal to the magician’s net hits when casting the spell will detect the trap. An Athletics + Reaction test equal to (the magician’s net hits when casting the spell + 2) will prevent a target from falling in and taking damage.
spell.say_again=Say Again
spell.say_again.page=169
spell.say_again.desc=This spell can be used in two different ways. First, when cast, it allows the subject to immediately recall the last several seconds (caster’s current Magic rating). This is beneficial when receiving a garbled communication or when a message, order, or direction/instruction was misunderstood in the heat of battle. It also allows the subject a chance to replay and reexamine those last few seconds in case they may have missed something, such as overlooking something or someone hidden. This could give them the opportunity to make a necessary Perception test. The second way is to grant the subject a +2 on any Memory test. This spell cannot be used to simply try again on a failed Perception test.
spell.sound_barrier=Sound Barrier
spell.sound_barrier.page=169
spell.sound_barrier.desc=This spell creates a barrier within an area or around an object or people that prevents sound from traveling and therefore being heard. Sounds from one side of the barrier (such as inside) can be heard; they simply don’t travel past or through the barrier. For example, if the spell is cast on a VTOL aircraft, sounds made inside the barrier (such as the crew and passengers talking among themselves) can still be heard inside the barrier. Beyond the barrier, the aircraft or associated noises cannot be heard. This makes this spell ideal for covert operations and insertions. This spell can be a double-edged sword, as those inside the barrier also cannot hear anything from the other side.
spell.starlight_sight=Starlight Sight
spell.starlight_sight.page=169
spell.starlight_sight.desc=Useful when moving in near-dark conditions, this spell grants the subject low-light vision and also provides flare compensation protection. In addition, it gives the subject a +1 on all Perception tests in the dark.
spell.treacherous_path=Treacherous Path
spell.treacherous_path.page=169
spell.treacherous_path.desc=Designed to slow an enemy’s progress or advance, the Treacherous Path spell creates an area that is difficult for those on foot as well as ground vehicles using wheels or tracks. The exact kind of difficulty is determined by the environment. For example, swampy or forested areas become extremely muddy, desert areas clogged with sand or rocks, or arctic areas slick with ice and snow. Regardless of the environment, anyone attempting to travel through the area can only do it at one-half their speed. The effects of this spell can be countered by the Earthworks spell, as any rough areas can be smoothed out or simply removed or by appropriate adept powers.
spell.tyee=Tyee!
spell.tyee.page=170
spell.tyee.desc=Developed by a combat mage while attending UCAS Airborne School, the Tyee! spell is a variation of the Levitation spell designed to help control the direction of their descent, helping prevent them from missing a drop zone because of adverse weather conditions or even mechanical failures. This spell can also be used when making shorter jumps or falls, helping the subject avoid obstacles in their path of descent or those on the ground by offering a limited degree of steering. In game terms, it grants the user a +3 to their appropriate Athletics test. The spell ends when the subject reaches the ground.
spell.death_replay=Death Replay
spell.death_replay.page=182
spell.death_replay.desc=This spell gives the subject information about the immediate cause of death for a recently deceased creature and the circumstances surrounding its demise. Similar to a bad BTL, the caster experiences the last few moments of the victim’s life through blurred visions and visceral sensations, which can be quite unnerving if the victim suffered an unnatural death. The spell must be cast within a number of hours from the time of death equal to the victim’s Essence. Net hits on the casting test determine the information provided, as noted on the Detection Spell Results table (p. 134, SR6). If the victim’s death was particularly violent, the gamemaster may call for a Composure test with a threshold of 3. If they fail, the caster gains the Nauseated status for one hour.
spell.incision=Incision
spell.incision.page=182
spell.incision.desc=This spell alters the cellular structure of a subject’s skin and underlying tissues to create an opening. It’s commonly used for surgical procedures or implantation. It has found increasing popularity among wealthy and Awakened patients, who insist it provides better cosmetic results. The length of the incision is equal to the caster’s Magic rating in centimeters, and the incision closes as soon as the spell is no longer sustained. Use of the spell reduces damage from surgery by 2 DV (p. 57, Body Shop) to a minimum of 1. In addition, any visual Perception tests to detect implants made with the help of this spell receive a –1 penalty. This spell has also gained popularity with drug and other smuggling organizations for obvious reasons.

