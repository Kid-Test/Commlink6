mentorspirit.the_eldest=Der Älteste
mentorspirit.the_eldest.page=131
mentorspirit.the_eldest.disadvantage=Der Älteste sucht nach Heldinnen und Helden, die die Welt vor dem Untergang bewahren – nach jenen, die bereit sind, für die Welt zu kämpfen und wo immer möglich das Leben zu verteidigen.
mentorspirit.fae_godmother=Gute Fee und Bettlerkönig
mentorspirit.fae_godmother.page=133
mentorspirit.fae_godmother.disadvantage=Anhänger dieser Schutzgeister müssen den Armen und Mittellosen stets mit Freundlichkeit begegnen und alle ihre Mitmetamenschen ungeachtet von Status oder Reichtum gleich behandeln.
mentorspirit.goblin_king=Goblinkönig
mentorspirit.goblin_king.page=132
mentorspirit.goblin_king.disadvantage=Alles ist eine Transaktion. Ein Tauschhandel. Umsonst gibt es nichts auf der Welt.
mentorspirit.tripple_goddess=Dreifaltige Göttin
mentorspirit.tripple_goddess.page=131
mentorspirit.tripple_goddess.disadvantage=Allgemein fokussieren sich die Bestimmungen der Dreifaltigen Göttin auf Retrospektive und Selbsterkenntnis, wenngleich je nach Mondphase andere Aspekte in den Vordergrund rücken.
mentorspirit.four_horsemen=Pest, Krieg, Hunger und Verderben
mentorspirit.four_horsemen.page=133
mentorspirit.four_horsemen.disadvantage=Diese Schutzgeister sind davon überzeugt, dass das Ende nah ist, und sehen daher keinen Sinn in der Pflege zwischenmenschlicher Beziehungen. Ebenso wenig messen sie Interessengebieten oder Besitztümern Wert bei, die für ihre apokalyptischen Pläne nicht von Nutzen sind.
mentorspirit.red_bear=Roter Bär
mentorspirit.red_bear.page=134
mentorspirit.red_bear.disadvantage=Der Rote Bär will, dass seine Anhänger bei ihrer Arbeit und allgemein in ihrem Leben die Interessen Russlands im Herzen tragen.
mentorspirit.toxic_red_bear=Toxischer Roter Bär
mentorspirit.toxic_red_bear.page=134
mentorspirit.toxic_red_bear.disadvantage=Wenn du durch einen Gegner verwundet wirst musst Du eine Selbstbeherrschungsprobe (3) ablegen. Misslingt diese, verfällst du - wie 
die Anhänger von Hai (SR6, S. 166) - in einen Berserkerrausch.
mentorspirit.knowledge_seeker=Wissenssucher
mentorspirit.knowledge_seeker.page=134
mentorspirit.knowledge_seeker.disadvantage=Followers must always seek out knowledge in as m Die Anhänger dieses Schutzgeists sind angehalten, stets nach Wissen in so vielen Formen wie möglich zu streben. Ganz egal, wie trivial eine Information erscheinen mag: Man kann nie wissen, wann sie sich noch als hilfreich erweisen wird.

mentorspirit.lemur=Lemur
mentorspirit.lemur.page=150
mentorspirit.lemur.disadvantage=Wenn du dein Revier nicht schützen kannst, fühlst du dich leer und ausgehöhlt. Du erhältst einen Würfelpoolmodifikator von –1 auf alle Handlungen, bis du dein Revier wieder gesichert hast.

mentorspirit.atomic=(Toxisch) Atomar
mentorspirit.atomic.page=170
mentorspirit.atomic.disadvantage=Anhänger von Atomar sind unberechenbar und jähzornig. Sie müssen eine Probe auf Willenskraft + Charisma (3) ablegen, um nicht gewalttätig zu reagieren, wenn sie herausgefordert oder beleidigt werden.
mentorspirit.disease=(Toxisch) Krankheit
mentorspirit.disease.page=170
mentorspirit.disease.disadvantage=Anhänger von Krankheit müssen eine Probe auf Willenskraft + Charisma (3) ablegen, um nicht zu fliehen oder Deckung zu suchen, wenn sie in einer Kampfsituation sind, es sei denn, sie sind der Gegenseite zahlenmäßig überlegen. Selbst wenn sie einen Kampf mit zahlenmäßiger Überlegenheit beginnen, müssen sie eine solche Probe ablegen, um nicht zu fliehen, wenn ihre Seite so dezimiert wird, dass sie der Gegenseite nicht mehr zahlenmäßig überlegen ist.
mentorspirit.doom=(Toxisch) Untergang
mentorspirit.doom.page=170
mentorspirit.doom.disadvantage=Anhänger von Untergang müssen eine Probe auf Willenskraft + Charisma (3) ablegen, um einen Plan zu entwickeln, der Gewalt vermeidet, oder um einen Kampf aufzugeben, sobald er begonnen hat. Misslingt die Probe, müssen sie kämpfen, bis alle Gegner besiegt sind oder fliehen.
mentorspirit.mutation=(Toxisch) Mutation
mentorspirit.mutation.page=170
mentorspirit.mutation.disadvantage=Wenn Anhänger von Mutation sich einem Gegner unterlegen fühlen, weil ihnen ein Angriff oder eine soziale Probe misslingt, erhalten sie einen Würfelpoolmalus von -1 auf alle Handlungen, bis sie ihren Rivalen in diesem Bereich besiegen oder ihre Schwäche auf andere Weise überwinden oder kompensieren (z.B. durch den Erwerb einer neuen Kraft, eines Zaubers oder eines Stücks Bodytech).
mentorspirit.pollution=(Toxisch) Verschmutzung
mentorspirit.pollution.page=171
mentorspirit.pollution.disadvantage=Anhänger von Verschmutzung müssen jeden Tag, an dem sie sich in einem Gebiet aufhalten, das sauberer ist als ihr normaler Lebensraum, eine Probe auf Willenskraft + Charisma (3) ablegen. Misslingt ihnen diese Probe, müssen sie an diesem Tag mindestens acht Stunden damit verbringen, das Land aktiv zu verschmutzen, unabhängig davon, welche anderen Pläne sie für diese Zeit hatten.

