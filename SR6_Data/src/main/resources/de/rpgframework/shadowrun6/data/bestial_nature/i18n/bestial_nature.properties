quality.shifter.choice.type=Type of Shifter
quality.shifter.choice.type.furry=Furry
quality.shifter.choice.type.furry.desc=Canine, leonine, lupine, panthrine, tigrene, ursine, reindeer, vulpine and more. This subcategory is for mammalian shifters. These are typically four-legged and furry, but primates are also an option. Polar bear and reindeer shifters can be found in the Arctic circle. Lupine, great cat, bovine and ursine shifters are found on every continent. Brown bears, black bears, and lupine are the most common North American shifters with some panthrine, coyote, or cougar forms also occurring in the natural animal populations. In Central and South America, shifters of all species are found living in Aztlan and Amazonia sprawls, Ocelot, jaguar, primate, and pantherine are the most common mammalian shifters found in natural animal species. Yakut is home to tens of thousands of shifters of any variety listed. Lupines are found in the wilds of Russia, while vulpines are most common in Japan and China. Tigrine can be found in India, China, Russia, and Yakut, and they have the largest territories of any shifter furry. Canine shifters are found mostly in cities and are likely the most populous of any shifter population due to the large pre-Awakening pet population.
quality.shifter.choice.type.scaly=Scaly
quality.shifter.choice.type.scaly.desc=This sub-category is for reptiles and amphibian shifters, including alligators, crocodiles, anacondas, and other snakes. Some have legs, some don’t. Venomous or aquatic adaptations are also options. Alligator shifters are found naturally in the rivers of the CAS and Amazonia. Crocodile shifters are most common in the Nile River Valley although some have been reported in Australia. Anaconda shifters are known to inhabit South America, and other species of snake shifters have been reported in deserts and rainforests all over the world. A family of cobra shifters has been documented among the Angkor Awakened and the naga community there. A coral snake shifter lives in the Amazonian shifter community after escaping captivity as a pet from the CAS. Rattlesnake shifters are rumored to exist in several NAN states. A community of poisonous tree frogs lives in Amazonia as well.
quality.shifter.choice.type.feathery=Feathery
quality.shifter.choice.type.feathery.desc=Falconine, heron, owl, swan or other birds fall within this subcategory for flying avian shifters. There are no documented flightless avian shifters. Most common and diverse in Europe, several species are found in the wilds as well as urban and rural settings. Eagle featheries can also be found in North America.
quality.shifter.choice.type.fins=Fins
quality.shifter.choice.type.fins.desc=Dolphin, selkie (seal), shark and other aquatic animals fall within the fins subcategory, which includes freshwater or saltwater shifters—though the only known freshwater shifters are river dolphins. The largest fin community is found in Amazonia and sprawls from the Amazon River delta south along the coastline. Every known aquatic adaptation of shifter is found here. The community is mostly land based, but the aquatic shifters have unique architecture built that goes from land to water in many places. Seal shifters can be found along any coastline; the largest mostly seal shifter group is outside of Seattle. Shark shifters are found everywhere sharks are—which is to say any ocean, anywhere. The largest wild grouping of shark shifters can be found off the coast of Australia, although they migrate out to different territories during the year. Ray and orca shifters have also been observed.

