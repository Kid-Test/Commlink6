item.biosculpt_metatype=Metatype change
item.biosculpt_metatype.page=56
item.biosculpt_trollorc=Troll/ork reduction
item.biosculpt_trollorc.page=56
item.clean_metabolism=Clean Metabolism
item.clean_metabolism.page=56
item.clean_metabolism.desc=This piece of bioware improves the exocrine system, especially the pancreas. The clean metabolism bioware also includes an intestinal bacterial infusion that only fails to be a true symbiont implantation due to the permanent adjustment the body makes to the bacteria. The result is a digestive system that's both more efficient and well-mannered, eradicating the majority of body odors, belches, or gas-passing oopsies. It's a common enough modification that “her family has so much money that her sweat doesn't stink” is a well-known expression. This item is quite rare outside of the upper crust and incompatible with other digestive modifications, which means this modification makes it easier to spot a corp kid.<br/>A player with clean metabolism is more difficult to track via scent. Anyone attempting to use scent-based tests against the player cannot use Edge. If the point of Edge is not used on that test, it is lost.<br/>Clean metabolism is not compatible with tailored pheromones.
item.dietware=Dietware
item.dietware.page=56
item.dietware.desc=This somewhat dangerous procedure has largely been replaced by symbionts. Dietware consists of one of several modifications to the stomach or digestive tract that inhibits the digestion and absorption of food, especially carbohydrates and fats. This keeps the user slender against all but the most gluttonous of appetites.
item.hair_growth=Hair Growth
item.hair_growth.page=56
item.hair_growth.desc=The cost of a single treatment is for an area roughly the size of the human head. This is important, as the procedure was designed for battling baldness, then became a new way to try new looks, then was modified by the underground community into a more furry-friendly process that fully embraces the expansion of coverage. The color, length (up to one meter), and texture are chosen before the procedure is begun, allowing the user full modularity in the final product from a pink mohawk to soft white fur to blue dreadlocks. More exotic hair will, of course, cost more.
item.hair_growth.variant.fullbody=Full Body
item.metahuman_glamour=Metahuman Glamor
item.metahuman_glamour.page=A favorite of Nashville starlets and Horizon execs, silky skin is a simple two-stage process that can be completed in a long afternoon and is included in many spa-day packages. This is a very expensive process that takes place in two steps. The first part is the removal of old dermal layers and scars via “soft” laser treatment or, in Renraku facilities, a small cadre of human scrubbers. The patient is then immersed in a tank where the body receives a wide range of minor modifications affecting their muscle, tendons, joints, and vocal cords. The effect is a metahuman who moves with unearthly grace. Their countenance always seems radiant, and their voice has a natural quality that also grabs the attention of those around them. Those they speak to feel moved and inspired.<br/>This is reflected with a bonus of +1 Edge for all social actions taken that are not aggressive.<br/>Those with this quality are particularly memorable, equating to an additional +1 Edge for anyone attempting to make a Memory test to recall the individual or the actions they've taken.
item.perfect_eyes=Perfect Eyes
item.perfect_eyes.page=56
item.perfect_eyes.desc=Laser eye surgery to remove vision problems shy of actual blindness has been perfected over many decades, being quick, painless, and safe, but the interesting properties and abilities of cybernetic eye replacement have made the process somewhat gauche in this day and age. With the recent fear from the “nanopocalypse” and stories of “dangerous technomancers” switching hapless citizens' eyes off at will, virtually every body sculpting clinic in the world has brought back this procedure and has been rewarded with fistfuls of nuyen. The process only takes a few minutes, and after a week of wearing protective lenses and using eyedrops to ensure that there's no damage to vulnerable tissue, the patient can enjoy perfect 20/20 vision that comes with a ten-year assurance. Many clinics include a Sparkle!, which is a package where they also recolor the patient's eyes.
item.skin_pigmentation=Skin Pigmentation
item.skin_pigmentation.page=57
item.skin_pigmentation.desc=Skin pigmentation treatment can be used to paint the higher levels of the patient's skin, giving a color scheme that doesn't sweat away, instead remaining in place for roughly a week until it fades from standard abrasion (though it can be removed quicker with a skin solvent). Some choose to paint up their favorite sports team's colors or logos, others dress up for clubbing, while still others simply follow artistic paths. A permanent treatment is also available, drawing on genetic sub-components to change the body's natural skin color, ensuring that the selected pattern will be repeated from then onward. A second treatment can be undertaken to correct the first.
item.skin_pigmentation.variant.permanent=Permanent

