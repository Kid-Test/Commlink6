item.bark_skin=Bark
item.bark_skin.page=62
item.bark_skin.desc=This process involves harnessing the Epidermodysplasia verruciformis (EV) disease, commonly called the “tree-man disease.” This process is one of the less traumatic dermal alteration processes.<br/> The character's skin takes on the appearance of rough tree bark. This quality provides a +2 Defense Rating bonus, cumulative with armor, but increases the cost of all armor and clothing by ten percent.<br/>Cannot be taken with Rhino.
