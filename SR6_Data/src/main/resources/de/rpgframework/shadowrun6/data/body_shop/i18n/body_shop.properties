dataset.name=Body Shop
dataset.name.short=BS
dataset.desc=BUILD A BETTER YOU<br/><br/>\
 You sculpt your body the same way you sculpt marble—cut away all the wrong parts until what you are left with is purely, utterly you. You, but faster. You, but stronger. You, but smarter.<br/><br/>\
 If you’re going to take on the powers of the Sixth World, you will need to be every bit of yourself that you can muster. Cyberware, bioware, geneware, and more can help you build the self you need to rise to the occasion and be the person who can withstand whatever the world throws at you.<br/><br/>\
 <em>Body Shop</em> is the core augmentation rulebook for Shadowrun, Sixth World.

