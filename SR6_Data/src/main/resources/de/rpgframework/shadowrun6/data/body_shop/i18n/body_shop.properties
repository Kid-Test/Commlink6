quality.cyber_singularity_seeker=Cyber Singularity Seeker
quality.cyber_singularity_seeker.page=168
quality.cyber_singularity_seeker.desc=You believe that implanting more cyberware is bringing you closer to a state of true harmony between man and machine. Instead of feeling like you have sacrificed a portion of yourself, a set of replacement limbs makes you feel unequivocally whole.<br/><br/>\
 <b>• Cost:</b> 10 Karma<br/>\
 <b>• Game Effect:</b> The runner gains +1 Willpower for each pair of cyberlimbs (two arms or two legs) they get implanted, up to a maximum of +2 Willpower.
quality.drug_tolerant=Drug Tolerant
quality.drug_tolerant.page=168
quality.drug_tolerant.desc=You have a higher-than-average tolerance against becoming addicted to drugs. Whether because you are genetically predisposed to tolerance or you just happen to be stubborn as a mule and just that tough, addictions have a harder time taking hold of you.<br/><br/>\
 <b>• Cost:</b> 5 Karma<br/>\
 <b>• Game Effect:</b> You gain a point of Edge when making Addiction tests.
quality.empathic_retention=Empathic Retention
quality.empathic_retention.page=168
quality.empathic_retention.desc=Either through a natural ability or by training and practice, you have maintained your awareness of the subtle non-verbal cues metahumans use when communicating with each other, offsetting the atrophy of social awareness usually caused by Essence loss.<br/><br/>\
 <b>• Cost:</b> 4 Karma per level (max level 2)<br/>\
 <b>• Game Effect:</b> Each level of this quality negates 1 point of negative Social Rating caused by Essence loss. This quality cannot generate a positive Social Rating modifier and only counteracts the negative modifier caused by Essence loss, having no effect on other negative factors.
quality.redliner=Redliner
quality.redliner.page=168
quality.redliner.desc=Any cyberlimbs you have are overclocked and have their safety limits disabled, causing them to run at an increased capacity, but the additional stress takes its toll on your body.<br/><br/>\
 <b>• Cost:</b>  10 Karma<br/>\
 <b>• Game Effect:</b>  For every pair of cyberlimbs installed (two cyberarms or two cyberlegs), your paired limbs receive an additional +1 Strength and +1 Agility, up to a maximum for +2 toward the augmented maximum. <br/>Pushing your cyberlimbs this hard causes strain on your body, and the structural integrity granted by those cyberlimbs is not as effective. You only gain 1 Physical Condition Monitor Box per full pair of cyberlimbs, instead of 1 per limb.
quality.chronic_dissociation_syndrome=Chronic Dissociation Syndrome (CDS)
quality.chronic_dissociation_syndrome.page=169
quality.chronic_dissociation_syndrome.desc=CDS is the most common psychological ailment affecting those with excessive augmentation. The primary symptom is a sense of indifference and detachment toward one’s surroundings, relations, and interests. Even a functional Invoked Memory Stimulator will not stop the intense apathy and depression associated with CDS taking hold.<br/><br/>\
 <b>• Bonus:</b> 10 Karma<br/>\
 <b>• Game Effect:</b> Must have less than 3 Essence. These characters suffer a –3 penalty on any Willpower tests other than Spellcasting and Damage Resistance tests.
quality.delusion=Delusion
quality.delusion.page=169
quality.delusion.desc=The character has a firmly held belief that has no basis in fact. No amount of logical argument or persuasive charm will dissuade the character from this belief.<br/><br/>\
 <b>• Bonus:</b> 10 Karma<br/>\
 <b>• Game Effect:</b> The delusion will result in the character gaining the Confused 2 status in most social situations or during a shadowrun when encountering the subject of the delusion. Anytime they are confronted with reality contradicting their delusion, the character needs to come up with an explanation as to why the delusion appears to be false. Examples of a delusion include an imaginary friend or foe, belief in the power of a lucky charm, or knowledge of a global conspiracy between dragons and elves.<br/>\
 Should this delusion be forcibly broken, the character who is unable to rationalize this is put under extreme stress. They must make a Composure (4) test or suffer a mental breakdown, which may lead to a new delusion or other equivalent negative quality to replace the Delusion.
quality.emotional_flatline=Emotional Flatline
quality.emotional_flatline.page=169
quality.emotional_flatline.desc=All these implants have made you more machine-like. You have become cold and calculating in social situations, so much so that it’s off-putting to others you interact with. This can be an advantage for scaring people.<br/><br/>\
 <b>• Bonus:</b> 5 Karma<br/>\
 <b>• Game Effect:</b> When attempting any opposed Con or Influence test (except for Intimidation), your opponent always generates a point of Edge for each test due to your inability to appeal to them. When attempting to Intimidate, you generate a point of Edge for your callous disregard for your subject.
quality.emotion_leak=Emotion Leak
quality.emotion_leak.page=169
quality.emotion_leak.desc=Sometimes those with large amounts of cyberware have a difficult time containing their emotions; other metahumans know instinctively how these characters feel. This is disadvantageous during negotiations, cons, gambling, and any other face-to-face interactions where deception is important.<br/><br/>\
 <b>• Bonus:</b> 10 Karma<br/>\
 <b>• Game Effect:</b> The runner cannot use Edge on Con tests or Influence tests.
quality.hallucinations=Hallucinations
quality.hallucinations.page=169
quality.hallucinations.desc=The mind can be a fragile thing, and one stressed to the limit can create visions of things that aren’t there.<br/><br/>\
 <b>• Bonus:</b> 10 Karma<br/>\
 <b>• Game Effect:</b> In stressful situations, the character must pass a Willpower + Logic (3) test or be subjected to hallucinatory visions. These visions may come from past experiences, nightmares, or even the media. They may also reflect a failure to observe something that does exist. To the character, these seem every bit as real as the physical world around them and must be addressed appropriately. These visions exist only within the mind of the character. They have no astral or Matrix component. The visions will persist until the character successfully passes another Willpower + Logic (3) test; the gamemaster determines when such tests are made. Another character may assist the hallucinating character by using Influence (Leadership) + Charisma (treat as a teamwork test).
