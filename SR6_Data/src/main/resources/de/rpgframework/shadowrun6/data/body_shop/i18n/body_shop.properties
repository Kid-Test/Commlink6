quality.essence_regrowth=Essence Regrowth
quality.essence_regrowth.page=16
quality.essence_regrowth.desc=our aura is healing or adapting to a significant change. You may only take this quality if you have an Essence hole (see p. 146, Sixth World Companion), whether from a removed implant, damage from an injury or addiction, or having a body divergent from your Essence. This healing represents a natural regrowth, but also the time taken to understand and accept the changes that you are going through. After healing more than a point of Essence, your aura will seem very different to anyone who perceived it before the regrowth happened.</br>\
This quality cannot be taken at character creation.</br></br>\
 <b>Cost:</b> 10 Karma (not subject to doubling)</br>\
 <b>Game effect:</b> At the end of each month, you may spend 1 Karma to regrow 0.05 Essence.<br/>
 • This quality only lasts until the Essence hole is healed, at which time the quality is lost. You may only take this quality with the explicit permission of your gamemaster.


quality.dying_cyberware=Dying Cyberware
quality.dying_cyberware.page=22
quality.dying_cyberware.desc=Your cyberware is just about dead, and nothing can be done with the hardware other than to nurse it along and hope it doesn't fail at a bad time.<br/><br/>\
 <b>Bonus:</b> 5 Karma<br/>\
 <b>Game effect:</b><br/>\
 • Designate an implant that costs one or more Essence. This implant is out of warranty and failing. A good mechanic or cyberdoc can identify problems with visible implants with a visual inspection.<br/>\
 • When using the implant, one die in the roll is replaced by a wild die.<br/>\
 • The runner must make an Edge test each month; if this test glitches, the implant fails and doesn't function. If this would be lethal to the runner, the runner may survive but cannot succeed in any physical or mental test. They can call a friend to come and help them. An implant that has failed this way cannot be repaired, but it can be replaced.<br/>\
 • If the implant is successfully hit by a called shot, it is permanently disabled as if the runner had glitched the monthly Edge check.<br/>\
 • If a runner replaces the implant without buying off the quality, designate another implant as Dying Cyberware.

action.puppet_cyberware=Puppet Cyberware
action.puppet_cyberware.page=30
action.puppet_cyberware.shortdesc=Control someones cyberware - var. grade and rounds
action.puppet_cyberware.desc=If you are successful, you are able to temporarily usurp or interfere with the operations of a cybernetic implant by inflicting a status (pp. 51-53, SR6). Each net hit not counted toward increasing a status level may be used to extend the effect by one combat round. The effects you can force the cyberware to perform depend on the nature of the targeted implant:<br/>\
 <b>Cybereyes:</b> You may cause the user to suffer one level of Blinded # per net hit until the end of the user's next turn.<br/>\
 <b>Cyberears:</b> You may cause the user to suffer one level of Deafened # per net hit until the end of the user's next turn.<br/>\
 <b>Bodyware that gives a bonus to Strength or Agility:</b> You may cause the user to suffer one level of Fatigued # per net hit until the end of the user's next turn.<br/>\
 <b>Bodyware that gives a bonus to Reaction:</b> You may cause the user to suffer Immobilized until the end of the user's next turn or to immediately gain the Prone status.<br/>\
 <b>Cyberarm:</b> You may cause the limb to perform one task that it can accomplish without any help from the rest of the body and takes no more than a single Major Action to accomplish. If the task involves a test, the dice pool for this test is the limb's own attribute, with no skill dice added.<br/>\
 <b>Cyberleg or lower body replacement:</b> You may cause the user to suffer Hobbled until the end of their next turn. Alternatively, if the user has two full cyberlegs and you were able to affect them both with the same puppet cyberware action (e.g., the Fork cyberprogram), then you may cause the user to perform a Move Minor Action immediately. The user may prevent this movement from occurring by succeeding on a Reaction + Willpower test with a threshold equal to the number of the hacker's net hits.<br/>\
 <b>Other cyberware:</b> You may cause the user to suffer one level of Confused # per net hit until the end of the user's next turn.

action.oh_thats_replaceable=Oh, that's replaceable
action.oh_thats_replaceable.page=31
action.oh_thats_replaceable.desc= It turns out the metal took some of the damage in place of your meat! Heal one box of Physical damage. One cybernetic augmentation per box of damage healed that costs at least 0.2 Essence (before modification for grade) is broken and will not function until repaired.<br/>Repairing damaged cyberware is a Build/Repair test using a Biotech(Cybertechnology) + Logic (6, 1 hour) Extended test. The device cannot be used while it is being repaired, and repairs cannot be performed without a toolkit. A critical glitch on a repair test means you messed up good—the device fails totally and can only be harvested for spare parts.
action.oh_thats_replaceable.shortdesc=Avoid damage by breaking cyberware

technique.arm_bar_breaker=Arm Bar Breaker
technique.arm_bar_breaker.page=32
technique.arm_bar_breaker.desc=A cyberlimb uses actuators made of titanium, plasteel, or similarly durable substances. A martial artist may use this technique to unlock an option unavailable to grapplers with organic tendons: simply powering through a joint lock. This technique lets the user avoid the –4 dice penalty for attacks made while being grappled or to resist being restrained (p. 111, SR6)
technique.steel_typhon=Steel Typhoon
technique.steel_typhon.page=32
technique.steel_typhon.desc=Most cyberlimb actuators are manufactured to be used in either right or left limbs. As such, they can usually perform a full 360-degree range of articulation. Traditional martial arts techniques are not equipped to capitalize on the capacity to spin a fist like a drill or an elbow like a windmill, but steel typhoon is a Sixth World technique invented to exploit such possibilities.<br/>To reflect the difficulty in defending against blows that exceed standard biomechanical range of motion, the opponent's cost for Edge boosts while defending against your melee attacks is increased by 1.
technique.soul_breaking=Soul Breaking
technique.soul_breaking.page=32
technique.soul_breaking.desc=Many martial arts incorporate breaking objects into their training. Tameshiwari (p. 105, Firing Squad) involves strengthening one's body, but cyberware offers a bypass on that kind of conditioning. Soul breaking involves leveraging the artificially strong structure of one's bones into this training to literally hammer the target. This technique must involve a perfect form maintained throughout the user's whole body, rendering it incompatible with other martial arts techniques or adept powers that modify DV. When you subject a victim to this kind of unarmed attack, they subtract 2 dice from their damage resistance test.
technique.limb_dropping=Limb Dropping
technique.limb_dropping.page=32
technique.limb_dropping.desc=Autotomy is the technical term for self-amputation and describes the behavior that some critters employ as a survival tactic. Just as many lizards can detach their tail to escape from a predator, a martial artist with a cyberlimb can sacrifice the metal to preserve their meat. When suffering damage from an attack or indirect combat spell, this technique allows the user to forfeit the damage resistance test to ignore all damage entirely by intercepting the hit with their cyberlimb. <br/>The limb becomes nonfunctional and must be repaired using the Biotech (Cybertechnology) skill before it can be used again. Increase the Build/Repair Threshold (p. 95, SR6) by the number of damage boxes averted. If the incoming damage is 6 or more boxes, then only a full replacement limb can be used for limb dropping. If a cyberleg was sacrificed, the user gains the Hobbled status (p. 52, SR6) until the leg is replaced or repaired
technique.plasteel_shirt=Plasteel Shirt
technique.plasteel_shirt.page=33
technique.plasteel_shirt.desc=Many traditional martial arts have techniques to toughen the body against strikes. Plasteel shirt is an update to these ancient secrets, employing cybernetics' components as a protective shell and conduit to harmlessly redirect impact energies. When rolling Body to resist damage from attacks or indirect combat spells, gain +2 dice.
technique.sense_the_breeze=Sense the Breeze
technique.sense_the_breeze.page=33
technique.sense_the_breeze.desc=Martial arts masters are fast, even without the benefit of chipped reflexes. With the benefit of augmentations, they become faster still. After rolling to resist damage following the use of either version of bending of the reed (p. 103, Firing Squad) convert a number of unsoaked Physical damage boxes to Stun damage, equal to the amount of bonus Reaction from augmentations the user has.

item.anti_tamper=Anti Tamper
item.anti_tamper.page=30
item.casemodding=Casemodding
item.casemodding.page=33
item.casemodding.desc=Casemods are to street samurai what yerzing is to riggers. Casemodding began with custom-etching cyberlimbs with infinitely customizable artwork, but the fad rapidly expanded to adding physical and AR bling to any externally visible cyberware. Casemodding adds +2 Social rating (p.50, Firing Squad) for each rating point. The particulars of its appearance are customizable, and this bonus is subject to gamemaster discretion as to whether the “look” is appropriate to impress given the social setting.
item.cosmetic_implants=Cosmetic Implants
item.cosmetic_implants.page=33
item.cosmetic_implants.desc=Some of the very first implants ever created were invented to enhance a user's physical appearance. Gel implants have enhanced breasts, biceps, buttocks, and many other anatomical regions for over one hundred years. Modern cybernetic implants are capable of dialing the physical enhancement of one area of the body up or down as the user desires. In addition to its obvious advantages in getting dates, a cosmetic implant system grants bonus Edge for tests made to disguise oneself, or to impersonate another individual. It takes a Minor Action to alter the physical size of the augmented region or body part.
item.cosmetic_implants.wifi=Gain a bonus Minor Action after spending a Minor Action to alter the augmented body part's size.
item.electrochromatic_hair=Electrochromic Hair
item.electrochromatic_hair.page=33
item.electrochromatic_hair.wifi=Gain a free Minor Action after spending one to perform an alteration or download a new pattern.
item.electrochromatic_hair.desc=The user's hair follicles on the scalp, and optionally the face, are replaced with thousands of receptors that are each mated to a myoelectric fiber optic filament. These filaments can broadcast any color, mix of colors, or even digital imagery in the same manner as the electrochromic clothing feature (p. 265, SR6). The filaments can extend or contract their length by up to fifty percent. It takes a Minor Action to alter the color or style of electrochromic hair, but the change takes two combat rounds to complete. Cost is based on length per ten centimeters (minimum 10 cm, maximum 1 meter).
item.false_face=False Face
item.false_face.page=33
item.false_face.desc=Although it was invented for use in theater, spies and shadowrunners quickly appropriated false face technology. Facial bones are replaced with ceramic plates, gel reservoirs, and cybernetic servos. A false face allows the user to resculpt their facial features to any possible expression for their metatype. It takes one minute of concentration to complete a facial transformation. This augmentation grants +2 dice and bonus Edge for disguise or impersonation tests.
item.false_face.wifi=A false face can match the facial biometrics matched to a given SIN or fake SIN.
item.flex_hands=Flex Hands
item.flex_hands.page=33
item.flex_hands.desc=The bones and connective tissues in the user's
hands are replaced with smart materials that can shift between rigid and flexible states. Flex hands allow the user to unnaturally compress their entire hand and then return it to its normal state without adverse effect or discomfort. They reduce the escape threshold (p. 93, SR6) by 4 (minimum 0) for tests involving squeezing the augmented hand into or out of a tight space, such as handcuffs. Flex hands cannot be implanted in hands that have been cybernetically replaced or have any other bone augmentations.
item.keypad_sequencing_fingers=Keypad Sequencing Fingers
item.keypad_sequencing_fingers.page=34
item.keypad_sequencing_fingers.desc=This implant replaces all four fingers on one of the user's hands with cybernetic digits. When activated, these fingers each split in half, and then each of those then split again, resulting in sixteen independently operating digits controlled by an implanted sequencing processor. When the user touches these digits to a keypad, they tap through possible codes in a blur of motion. The system also broadcasts a short-range RFID signal that spoofs the device into overriding its own timeout functions that would ordinarily prevent rapid-fire code entries. Keypad sequencing fingers make an Opposed test, rolling its rating vs. the maglock's rating; it doesn't require the user to first open the maglock's protective housing. See Maglocks, p. 241, SR6
item.keypad_sequencing_fingers.wifi=Gain a point of Edge when using an implanted maglock sequencer.
item.keypad_sequencing_fingers.overdrive=Gain +2 dice, one of which must be a wild die, on a test made to defeat a keypad maglock.
item.metagenic_cosmetic_alteration=Metagenic Cosmetic Alteration
item.metagenic_cosmetic_alteration.page=34
item.metagenic_cosmetic_alteration.desc=Minor cosmetic alterations such as eye-color changes and bosom enhancements predate cybernetics. A wide variety of subcultures from cosplayers, furry fandom, fetishists, and all manner of sports and music fanatics embrace more extreme SURGE-like enhancements. The following metagenic qualities from Sixth World Companion can be purchased as cybernetic enhancements:<br/>\
 •	 Animal Pelage: Camouflage, Insulating Coat, Quills<br/>\
 •	 Metagenic Morphisms: Bone Spikes<br/>\
 •	 Negative Metagenic Qualities: Striking Skin Pigmentation, Unusual Hair, Feathers, Insectoid Features, Scales<br/>\
 The nuyen cost for these cybernetically gained metagenic qualities is 1,000¥ per point of Karma (bonus or cost), but the quality neither gives nor costs any Karma. The augmentation costs one tenth of this Karma value in Essence. For example, replacing one's hair with artificial feathers costs 4,000¥ and costs 0.4 Essence, and the mechanical effects are as described on p. 129 of Sixth World Companion.
item.morphing_fingerprints=Morphing Fingerprints
item.morphing_fingerprints.page=35
item.morphing_fingerprints.desc=Much like retinal duplication cyberware, morphing fingerprints were designed for use by intelligence services and are always illegal outside of such agencies. Morphing fingerprints replace the fingertips of one hand with lifelike synthetic skin that uses myoelectric fibers to alter the fingerprint patterns. Any fingerprint verification systems roll their rating in an Opposed test against the morphing fingerprints rating to detect the falsified biometrics.
item.morphing_fingerprints.overdrive=Gain +2 dice, one of which must be a wild die, on Opposed tests to fool a fingerprint biometric verification system.
item.morphing_fingerprints.wifi=Morphing fingerprints can adopt a pattern downloaded from the Matrix or a biometric reader
item.sensor_dazzler=Sensor Dazzler
item.sensor_dazzler.page=35
item.sensor_dazzler.desc=A sensor dazzler is a specialized version of the general-purpose jammer (p. 270, SR6) that targets wireless sensor Matrix traffic without interfering with other signals. While the sensor dazzler is active, the user and anyone within two meters of them benefits from Invisible (Improved) 4 (p. 52, SR6) against cameras, millimeter-wave sensors, motion sensors, metal detectors, and chem sniffers that are both wireless and within five meters of the user. Sensors roll Rating + Rating against this threshold, and if they fail they cannot perform their usual detection function while the implanted jammer is in range. Anyone monitoring a jammed camera feed will only see static. Drones and cyberware are not blinded by this sort of jamming. It costs a Minor Action to begin or end the jamming, and each combat round the sensor dazzler is active it consumes one charge. A fully charged sensor dazzler has 10 charges and regains 1 charge per hour when attached to a power source.
item.sensor_dazzler.overdrive=Increase the benefit to Invisible (Improved) 5 until the beginning of your next turn, and the dazzler consumes 2 charges instead of 1.
item.sensor_dazzler.wifi=A sensor dazzler must be wireless enabled to function at all
item.skin_toner=Skin Toner
item.skin_toner.page=35
item.skin_toner.desc=Skin toner involves implanting a lattice of electrochromic polymers under the dermis. This weave produces colors that bleed together through the skin but lacks the granularity to create sharp lines or fine details. The user can change their apparent skin tone, with the tone naturally darkening or lightening as appropriate to the part of the body.<br/>Hues beyond metahuman norms are possible, but the artificial nature of the coloration is immediately apparent. As with other electrochromic technology, it costs a Minor Action to change the current display but it takes two combat rounds for the transformation to complete. <br/>Skin toner cannot be combined with other skin augmentations
item.chameleon_processor=Chameleon Processor
item.chameleon_processor.page=35
item.chameleon_processor.desc=A chameleon processor uses complex algorithms to enhance the coarse coloration. When mated to a chameleon processor, skin toner can broadcast more complex patterns and even use multiple colors rather than gradients of one. Tiger, leopard, zebra, Holstein cow, and many similar skin patterns are possible. The chameleon processor also permits the user to adopt a variety of camouflage patterns. The chameleon processor grants bonus Edge for Stealth tests while the user is camouflaged and most of their skin is visible.
item.chameleon_processor.wifi=Skin toner can download new colors and patterns via the Matrix by spending a Minor Action

item.antennae=Antennae
item.antennae.page=35
item.antennae.desc=Antennae grant their user enhanced Matrix reception and broadcast range. They are implanted as a pair on either side of the head and can retract behind the ears when not in use. They are available in a wide variety of shapes and colors, many of which are branded tie-ins to popular trideo franchises. It takes a Minor Action to deploy or retract the antennae, and while they are deployed, the user reduces the total noise affecting them by 2. A user can only have one set of implanted antennae.
item.antennae.overdrive=Reduce noise by 4 instead of 2 during a single Matrix action. Convert one die to a wild die for that test.
item.antennae.wifi=The antennae must be wireless enabled to function at all.
item.increased_spectrum_hearing=Increased Spectrum Hearing
item.increased_spectrum_hearing.page=36
item.increased_spectrum_hearing.desc=This augmentation expands the user's hearing beyond metahuman capability. The user is capable of hearing infrasonic and ultrasonic frequencies from as low as 5 Hz to as high as 120 kHz. Having access to a wider range of audio frequencies enables the user to hear sounds that are ordinarily drowned out by distance or muffled by intervening barriers. Not only can a user hear dog whistles and ultrasonic motion detectors, they reduce the cost of Edge boosts by 1 (minimum 1) for any audio Perception tests.
item.increased_spectrum_hearing.overdrive=Gain +2 dice, one of which must be a wild die, for an audio Perception test.
item.increased_spectrum_hearing.wifi= Increased spectrum hearing can sync with cyberware that augments the user's voice to permit speech solely in infrasonic or ultrasonic frequencies that cannot be heard by those with standard hearing range.
item.orientation_system=Orientation System
item.orientation_system.page=36
item.orientation_system.desc=An orientation system augments the user's inner ear with a gyroscopic navigation system. The user reduces any Outdoors (Navigation) test thresholds by 3, to a minimum of 1. The system also displays the user's current and prior positions on a mapsoft.
item.orientation_system.overdrive=Add two dice, one of which must be a wild die, to an Outdoors (Navigation) test.
item.orientation_system.wifi=The orientation system connects with commercial global positioning systems, allowing knowledge of the user's location anywhere on the globe. Furthermore, the user's position can be displayed in AR to the entire team PAN or on a mapsoft.
item.perfect_pitch=Perfect Pitch
item.perfect_pitch.page=36
item.perfect_pitch.desc=This audio analytic augmentation is an ear implant that measures pitch and timbre. It is widely used by musicians and sound technicians. Perfect pitch grants a point of Edge for tests involving musical performance.
item.perfect_pitch.wifi=The implant can sync with wireless instruments and sound equipment. This reduces the cost for Edge boosts by 1 (minimum of 1) for musical performances.
item.rolling_audio_recorder=Rolling Audio Recorder
item.rolling_audio_recorder.page=36
item.rolling_audio_recorder.desc=Cyberears can be equipped with a function that digitally records a minute's worth of audio in a self-overwriting perpetual loop. By spending a Minor Action, the user can permanently save the last minute's worth of audio heard by the cyberears.
item.rolling_audio_recorder.wifi=If the user also has a wireless-enabled rolling video recorder, both augmentations can be commanded to save the last minute's worth of data with the same Minor Action.
item.translation_ear=Translation Ear
item.translation_ear.page=36
item.translation_ear.desc=Renraku invented an entire cyberware niche with the release of their trademarked Translat-Ear ten years ago. Shiawase and Evo have since released their competing MoshiMoshiMimi and Babblefish products respectively. No matter the brand, translation ears fundamentally operate the same way: Smart systems detect perceived language and provide a real-time translation. Translation ears effectively allow the user to understand, but not speak, a foreign language. Because this understanding is at the basic skill level (p. 99, SR6), idioms and other figures of speech are translated directly rather than being put into context, so both slang and nuanced conversation can potentially confuse the listener.<br/>If the user also has an image link, this augmentation can translate written text as well
item.translation_ear.wifi=Translation ears must be wirelessly enabled to function at all.
item.vestibular_stabilizer=Vestibular Stabilizer
item.vestibular_stabilizer.page=36
item.vestibular_stabilizer.desc=The inner ear is responsible for sensing motion, but it is vulnerable to false perceptions and thereby causing dizziness or motion sickness. A vestibular stabilizer regulates the biomechanics of the inner ear to nullify such sensations. Acrobats, figure skaters, sailors, and spacers commonly employ this cyberware technology. <br/>The user is immune to the Nauseated status (p. 52, SR6).
item.vestibular_stabilizer.wifi= If the user is being subjected to centrifugal forces, a wireless vestibular stabilizer will inform the user of the number of revolutions per minute for this motion and calculate the distance between the user and the point of rotation.

item.eye_light_system=Eye-Light System
item.eye_light_system.page=36
item.eye_light_system.desc=Eye-lights are miniaturized light emitters that are implanted into the user's inner eye, coupled to a secondary iris and pupil that allow the light to shine outward without interfering with the regular field of view. The light allows persons with low-light vision to see for twenty meters in total darkness. The light can emit any color of light, but red is most common because it best preserves night vision. Ultraviolet, or black light, is also possible. <br/>When emitting ultraviolet, users gain Edge when searching for items or substances that glow in black light (body fluids, many kinds of critters). It takes a Minor Action to activate or deactivate the system, or to change the color of light being emitted.
item.eye_light_system.overdrive=Gain two dice, one of which must be a wild die, when performing a visual Perception test while benefitting from low-light vision, or when using black light to search for appropriate substances.
item.eye_light_system.wifi=Gain a bonus Minor Action after spending a Minor Action to activate, deactivate, or change the color of the light.
item.microscopic_lenses=Microscopic Lenses
item.microscopic_lenses.page=37
item.microscopic_lenses.desc=Microscopic lenses allow the user to focus their vision on tiny details. This augmentation allows up to 1,000X magnification, but the automatic stabilization is not much good beyond canceling out the user's own breathing and other involuntary micromovements of the head and neck. This augmentation is popular with gem experts, including forgers, to read microscopic numbers etched on gemstones. The zoomed-in vision can only be focused on a stable or stationary item within 30 centimeters of the eyes.<br/>It costs a Minor Action to shift into or out of microscopic vision mode. <br/>When in use, microscopic lenses grant bonus Edge to tasks involving very fine detail work such as surgery, repairing circuitry, painting wargame miniatures, and so on.
item.microscopic_lenses.overdrive=The microscopic vision can be applied to a non-stationary subject, such as a gunshot wound while the victim is rolling about in pain. Gain +2 dice for an appropriate test, and one must be a wild die.
item.microscopic_lenses.wifi=The microscopic lenses can sync with online databases when examining scientific, technical, or medical subjects. Gain bonus Edge when attempting to identify such items.
item.rolling_video_recorder=Rolling Video Recorder
item.rolling_video_recorder.page=37
item.rolling_video_recorder.desc=Cybereyes can be equipped with a function that digitally records a minute's worth of video in a self-overwriting perpetual loop. By spending a Minor Action, the user can permanently save the last minute's worth of video seen by the cybereyes.
item.rolling_video_recorder.wifi=If the user also has a wireless-enabled rolling audio recorder, both augmentations can be commanded to save the last minute's worth of data with the same Minor Action.
item.single_cybereye=Single Cybereye
item.single_cybereye.page=37
item.single_cybereye.desc=Cybereye basic systems (p. 285, SR6) are normally sold and implanted in pairs, but not everyone wants to replace a perfectly good eye just because the other one was diseased or damaged. A single eye can be replaced for one half the Essence and nuyen cost, leaving the other biological eye intact.<br/>A single cybereye only has one half the capacity of a matched pair.
item.spider_eyes=Spider Eyes
item.spider_eyes.page=37
item.spider_eyes.desc=Spider eyes walk the evolutionary path forged by animals that employ primitive eyes in clusters. Spider eyes are simple sensors that individually have poor perception for detail or color, but when deployed in number they allow for excellent motion detection. Spider eyes deploy clusters of these basic eyes around the head and neck. They do not replace the user's primary sense of vision; they instead augment it without distraction.<br/>Users with spider eyes reduce the threshold for Surprise tests to 2. If they are not wearing a helmet or other headgear, they also reduce the cost for Edge boosts on Surprise tests by 1, to a minimum cost of 1.<br/>Spider eyes do not consume cybereye capacity, but they can be placed in cyberskulls.
item.spider_eyes.overdrive=Spider eyes grant +2 dice, one of which must be a wild die, on a Defense test.
item.spider_eyes.wifi=The user gains Edge on visual perception test.

item.active_control_rig=Active Control Rig
item.active_control_rig.page=38
item.active_control_rig.desc=Active control rigs are based on EuroWars-era military R&amp;D. Because this early form of control rig does not permit jumping-in remotely or entering VR, it fell out of favor compared to the now-standard form of control rig. This older control rig technology hasn't fallen completely into obsolescence due to its relevance in corporate sponsored and funded motorsports. Motorcyclists do not want to be VR-comatose while competing in combat sports like combat biker or urban brawl, and the inability to remotely pilot is no downside in racing leagues where remote control is prohibited. Naturally, it also sees use in the shadows thanks to go-gangers and wired samurai who also wish to turn a mean wheel.<br/>An active control rig functions as a control rig (p. 283, SR6) but it does not require (or indeed, permit!) the rigger to be in VR to jump-in, and neither does it permit the rigger to remotely jump into a vehicle they are not physically driving. Active control rigs must employ a physical data cable to establish and maintain a direct connection between the implant and the vehicle's control board.
item.active_control_rig.wifi=An active control rig is inherently a throwback device and can never be wirelessly enabled.
item.attention_coprocessor=Attention Coprocessor
item.attention_coprocessor.page=38
item.attention_coprocessor.desc=Implanted tactical computers have been available since the 2050s, and modern systems are more efficient than ever. Cybernetic processors expand the biological brain's capacity for multitasking while sophisticated algorithms parse sensory data fed to the brain for potential threats, warning the user via AR or neural tug. Each rating of an attention co-processor grants +1 die for Defense tests.
item.attention_coprocessor.overdrive=Add the attention coprocessor's rating to a Perception test. One of these dice must be a wild die.
item.attention_coprocessor.wifi=The attention coprocessor also adds its bonus to Surprise tests.
item.cranial_sculpting=Cranial Sculpting
item.cranial_sculpting.page=38
item.cranial_sculpting.desc=Aural Helix Dysmorphia (AHD) is recognized as a metagenic expression, but those who accept this augmentation gain anthropomorphic facial features through cybernetics rather than SURGE. Avian, bovine, canine, caprine, equine, feline, leporine, and vulpine features are all common examples among cosplay and body modification enthusiasts.<br/>Even more extreme sculpts, such as cephalopodan and insectoid features are also possible, but users should be wary of being mistaken for hybrid-form insect spirits.<br/>The unusual anatomy resulting from this augmentation places a ten percent markup on any worn face or headgear (see Using Unadapted Gear, p. 247, SR6).
item.dream_link=Dream Link
item.dream_link.page=38
item.dream_link.desc=A dream link creates simsense records of neural activity associated with thought. This augmentation allows its user to replay and thereby re-experience dreams, which is entertaining for some individuals and useful in psychotherapy for others.<br/>Dream links are sometimes used as an insidious control mechanism. Few people have control over what they dream, so regularly monitored dream links can give prisons, bunraku parlors, and other such equally distasteful institutions intel about the goings-on among their captives such as escape plots, gang affairs, and so on. Dream links can also be employed while awake to journal active thought for later replay. A dream link can store up to eight hours of generated simsense data
item.dream_link.wifi=A dream link can export saved thought to an external device such as a commlink or replay an externally saved recording.
item.infrasound_emitter=Infrasound Emitter
item.infrasound_emitter.page=38
item.infrasound_emitter.desc=Infrasonic sound waves elicit feelings of discomfort or fear on a subconscious level even when they lie outside the afflicted target's audible range. This implant augments the user's vocal tract to broadcast powerful sound waves on these frequencies when performing a low growl.<br/>An infrasound emitter grants the ability to use a non-magical version of the Fear critter power (p. 224, SR6) that affects all other metahumans and vertebrate critters within 5 meters of the user.<br/>The infrasound emitter's rating is used in place of Magic. If a target lacks the ability to hear these frequencies, they do not identify the user as the source of this effect and would instead consider their current location as the source of their fear.<br/>If the user also has a vocal modulator (p. 285, SR6), an infrasound emitter also permits the user to perform regular speech that is imperceptible by those without augmented hearing.
item.infrasound_emitter.overdrive=An infrasound emitter's range is doubled, and its rating is considered 2 higher, ignoring the maximum rating of 4. One of the user's dice for using the Fear critter power is converted to a wild die.
item.infrasound_emitter.wifi=The sound waves can be directed to exclude specific, potential targets.
item.math_spu=Math SPU
item.math_spu.page=38
item.math_spu.desc=An implanted cranial sub-processing unit (SPU) handles complicated mathematical functions so the user doesn't have to, such as converting imperial measurements to metric. A math SPU maintains a mental calendar and tracks multiple timers that may be of interest to the user, such as “how long has my girlfriend been asleep” and “how long until my wife gets home from work.” <br/>A Math SPU lowers the cost of Edge boosts by 1 (to a minimum of 1) for Cracking, Electronics, and Build/Repair Tests (p. 95, SR6)
item.math_spu.overdrive=A Math SPU increases the Edge boost cost reduction to 2 (retaining a minimum cost of 1), and a wild die is added to the test.
item.math_spu.wifi=A Math SPU maintains an internal chronometer synced with global Matrix timekeeping.
item.matrix_visualizer=Matrix Visualizer
item.matrix_visualizer.page=39
item.matrix_visualizer.desc=There are few tools better than a Matrix visualizer for constructing AROs and sculpting VR. This augmentation permits the user to “print” mental images as virtual Matrix iconography. A creation requires the user's full concentration for a period ranging from a single combat round for a basic geometric design, to hours for an immersive landscape or true work of art. When attempting to render details from memory, the user rolls a Memory Test (p. 67, SR6) against an appropriate threshold (see Threshold Guidelines, p. 36, SR6).
item.matrix_visualizer.overdrive=A Matrix visualizer can sync with a wireless printer to create physical 2D or 3D objects.
item.radar_sensor=Radar Sensor
item.radar_sensor.page=39
item.radar_sensor.desc=An implanted radar sensor differs from aviation or military radars by using a shorter wavelength in the terahertz range and transmits in a linear frequency-modulated continuous wave (LFMCW). This type of radar is optimized for high-resolution imagery, low power requirements, and reduced background clutter. An implanted radar sensor functions as an ultrasound sensor (p. 277, SR6) with a sixty-degree field of view originating from the user's forehead and has a maximum range of twenty meters. This form of “sight” has the added functionality of being able to see through any barriers or materials with structure rating 15 or less.<br/>Radar ignores all Invisibility and Silence statuses, but it is susceptible to jamming. The user loses 2 dice for radar-based Perception tests for every point of jamming noise they are subjected to. Radar signals are unsubtle; any Matrix user within fifty meters can triangulate the exact position of an active radar sensor with a successful Cracking (Electronic Warfare) + Logic (3) test.<br/>It takes a Minor Action to activate or deactivate the system.
item.radar_sensor.overdrive=A radar sensor can “see” for fifty meters during one Perception test. Gain two dice, one of which must be a wild die, for that test.
item.radar_sensor.wifi=If the user also has a wirelessly enabled Math SPU, radar targeting data permits ranged attacks at a detected target while ignoring Blindness and Cover statuses, or any other visibility modifiers. Any barriers between user and target will still degrade the damage normally (see Barriers, p. 111, SR6).

item.auto_injector=Auto-Injector
item.auto_injector.page=39
item.auto_injector.desc=The earliest auto-injectors were pre-cybernetic implants that released medication into a person's body. Today, a cybernetic auto-injector releases pharmaceuticals on command rather than over pre-programmed intervals. Of course, nothing stops a user from replacing medicine with something recreational, or even a combat drug. A standard auto-injector stores one dose of a chemical, which is normally refilled via external access port.<br/>If the user also has a chemical gland (see p. 57) then that bioware's output can be stored in this cyberware. Optionally, an auto-injector can have its reservoir expanded to hold more doses before requiring refill. A reservoir cannot mix doses of different kinds of drugs, but multiple auto-injectors can be implanted and loaded with the various components of a juicer's cocktail. It takes a Minor Action to activate an auto-injector, and the drug or toxin effect takes place according to its Speed (p.121, SR6).
item.auto_injector.wifi=An auto-injector can sync with a wireless biomonitor to keep the user updated with information about the drug's effects, including an estimated time they will wear off.
item.auto_injector.variant.expanded=Expanded Reservoir
item.kill_switch=Kill Switch
item.kill_switch.page=39
item.kill_switch.desc=A killswitch is a variant form of auto-injector where the user has no control over the implant. The killswitch dispenses its payload upon preset conditions being met, or upon receipt of a special wireless signal from its true owner.
item.kill_switch.wifi=An auto-injector can sync with a wireless biomonitor to keep the user updated with information about the drug's effects, including an estimated time they will wear off.
item.biomonitor_cyber=Biomonitor
item.biomonitor_cyber.page=39
item.biomonitor_cyber.desc=A cybernetic version of a standard biomonitor (p. 281, SR6) factors other augmentations into its calculations. For instance, it will not mistake an active adrenaline pump as symptoms of shock or cardiac distress.
item.biomonitor_cyber.overdrive=If a biomonitor is wirelessly synchronized with a medkit, the user's Essence is considered 1 point higher (maximum 6.0) while the user is receiving medkit healing (p. 119, SR6). One die on this test is converted to a wild die.
item.biomonitor_cyber.wifi=When a predetermined amount of Physical and Stun damage has been accumulated, a wireless auto-injector can automatically trigger itself, or call DocWagon if the user has a contract.
item.biowaste_storage=Biowaste Storage
item.biowaste_storage.page=40
item.biowaste_storage.desc=Not everyone can “hold it” indefinitely. With biowaste storage, you can! Each rating point allows the user to store a day's worth of solid and liquid waste without needing to excrete. The waste can be removed via the usual methods or directly via an external port. Gloves are recommended.
item.biowaste_storage.wifi=Biowaste storage can communicate to a wireless biomonitor if there are any warning signs of parasites, toxins, or disease in the user's waste.
item.cyberfins=Cyberfins
item.cyberfins.page=40
item.cyberfins.desc=Retractable webs and supporting struts are implanted as a pair into the user's hands or feet. While deployed, the user gains Edge on Athletics (Swimming) Tests and increases the base swimming speed (p. 93, SR6) by 2 meters per round per pair of cyberfins. It takes a Minor Action to deploy or retract a pair of cyberfins, and they cannot be deployed while the user is wearing gloves or footwear on the relevant body parts. Note that deployed cyberfins are rigid and complicate fine motor work. The user cannot gain or spend Edge on any test when the affected body parts are involved in an Agility test other than swimming. This includes attacks made by handheld weapons, running, etc.
item.cyberfins.overdrive=Reduce the threshold for an Athletics (Swimming) test by 1, to a minimum of 0. Convert one die to a wild die.
item.cyberfins.wifi=Gain a bonus Minor Action after spending a Minor Action to deploy or retract a pair of cyberfins.
item.cybergills=Cybergills
item.cybergills.page=40
item.cybergills.desc=Bottled air works as advertised at atmospheric pressures or in shallow water. But once you dive deeper than twenty meters or so, the water pressures require more and more air to supply each lungful, so breathing consumes air more quickly.<br/>Cybergills avoid this problem, as well as other problems such as nitrogen narcosis involved in breathing atmosphere at depth. With this augmentation, the user draws water into the lungs, where oxygen is extracted from the water directly. While breathing water in this way, the lungs and vocal tract are completely full of water, making regular speech impossible. It costs a Minor Action to take water into the lungs and begin breathing it, but it takes a Major Action to forcefully expel all the interior water in a somewhat painful fit of coughing before the user can resume breathing air.
item.cybertails=Cybertail
item.cybertails.page=40
item.cybertails.desc=The state-of-the-art options in the 2080s for adding a tail to one's body lie in bioware and geneware. However, the classic chrome look never goes out of style, and only cyberware can deliver the pastel motif that is all the rage in Harajuku. Cybertails are controlled by processors implanted at the base of the spine and receive input from the user's subconscious mind, often twitching about without the user's awareness. A user with a cybertail pays ten percent extra for any worn or fitted clothing (p. 246, SR6). They are available in four types.
item.cybertails.overdrive=Gain +2 dice on a test made using the cybertail. One of these dice must be a wild die.
item.cybertails.variant.balance=Balance
item.cybertails.variant.desc=A balance tail grants the user the Catlike quality (p. 71, SR6). If they already have this quality, they gain +1 die in addition to the bonus Edge.
item.cybertails.variant.prehensile=Prehensile
item.cybertails.variant.prehensile.desc=A prehensile tail is more invasively connected to the user's nervous system. This allows the user to control the tail as if it were an additional limb, but it has 1 Strength and 1 Agility and cannot perform tasks more complicated than picking up or holding an object. A variant of this augmentation can be installed facially, resulting in a prehensile, elephantine proboscis.
item.cybertails.variant.swimming=Swimming
item.cybertails.variant.swimming.desc=These tails can take the form of a paddle, a long flat crocodilian tail, or a piscine appendage that terminates in a fluke or fin. No matter the form, a swimming tail grants +2 dice for Athletics (Swimming) tests.
item.cybertails.variant.thagomizer=Thagomizer
item.cybertails.variant.thagomizer.desc=Like the prehensile tail, a thagomizer tail is under conscious control. It cannot manipulate or grip objects, but it is powerful, armored, and armed with vicious spikes that can be employed as a weapon. An attack uses the Exotic Weapons (Thagomizer) skill, and the user's own Strength and Agility. It does DV 4P, AR 8/—/—/—/—, and increases the user's Defense Rating by 3.
item.cyberwings=Cyberwings
item.cyberwings.page=40
item.foot_anchor=Foot Anchor
item.foot_anchor.page=41
item.foot_anchor.desc=Gas-driven tungsten spikes are implanted in the user's feet and are designed to punch into the floor the user is standing upon. Each foot may only have one anchor implanted. It takes a Minor Action to fire or retract a single foot anchor. The anchor cannot function on materials with 13 or more Structure Rating (p. 113, SR6). While the user has at least one foot anchor deployed, they gain the Immobilized status (p. 52, SR6) and they cannot gain the Prone status (p. 53, SR6). When making ranged attacks, they do not suffer the –3 dice pool penalty and instead reduce all AR penalties for firing mode attacks by half (p. 108, SR6), rounded down. Note that a foot anchor is not restricted to use on a horizontal surface; if the user has an anchor in each foot they can potentially, and very carefully, walk up a wall.
item.gastric_pulverizer=Gastric Pulverizer
item.gastric_pulverizer.page=41
item.gastric_pulverizer.desc=Need a convenient way to dispose of something? Why not eat it! A gastric pulverizer augments the user's stomach lining to produce and survive using more powerful acids that can even break down inorganic materials. A mechanical diamond-tipped grinder replaces the lower esophageal sphincter, reducing any matter entering the stomach into tiny and more easily dissolved chunks. It also prevents the user from experiencing any acid reflux or even being capable of regurgitation. A gastric pulverizer allows the user to break down and ultimately harmlessly pass any material they can swallow. If the user also has a tough gut (see p. 66), they can even derive nourishment from normally inedible substances.
item.grey_mana_armor=Grey Mana Armor
item.grey_mana_armor.page=41
item.grey_mana_armor.desc=The Grey Brothers' marvel of technology has entered the realm of applied cybernetics. A proprietary blend of orichalcum, rare minerals, and oils is available as an aftermarket runic modification to existing dermal plating. Each rating point of Grey Mana armor grants one boosted spell defense die (p. 143, SR6) against any spell, power, or other magical effect that includes the user as a target. Even beneficial effects are automatically resisted, with the user rolling Body + Willpower + boosted defense dice if no resistance test is given. Any hits on this test deduct the number of hits generated by the caster. Grey Mana armor rating cannot exceed the user's dermal plating rating and must match the same grade as the dermal plating.
item.internal_router=Internal Router
item.internal_router.page=41
item.internal_router.desc=Modern cybernetics rely heavily on wireless communication. Protection against hackers is a major concern on both sides of the law. Ordinarily, the best defense against exploitation is to disable wireless and operate any implants solely via neuro-mechanical control, but this tactic degrades the full effectiveness of one's cyberware. An internal router employs the user's neural network as “hardwired” direct connections so other cyberware do not need to be wireless-enabled to benefit from any wireless bonuses they may have. The internal router must still wirelessly connect to a communications device such as a datajack or commlink. When any of the user's augmentations are targeted by a Matrix action or complex form, add one die equal to the internal router's rating to defend against that attack.
item.magnetic_system=Magnetic System
item.magnetic_system.page=41
item.magnetic_system.desc=Electromagnets anchored to the skeleton generate magnetic fields that allow the user to attach ferrous metals to their body, or vice versa. Each limb is limited to one implanted magnetic system, but the torso can house two: one in the front and one in the back. While a magnetic system is active, the user is virtually incapable of dropping or being pried off of metal objects, and if the user has two or more magnetic systems they can be used sequentially to move along surfaces with iron or steel construction or reinforcement.<br/>While engaged, a magnetic system has Strength 6 for the purposes of how much weight it can bear. Note that this may well end up being more weight than the user can even lift. It takes a Minor Action to activate or deactivate a given magnetic system.
item.magnetic_system.overdrive=The magnetic system's Strength is increased to 8 during one test. Convert one die to a wild die.
item.magnetic_system.wifi=Gain a bonus Minor Action after spending one to engage or disengage a magnetic system.
item.move_by_wire=Move-By-Wire
item.move_by_wire.page=42
item.move_by_wire.desc=Cyberware that deliberately puts its user into a permanent epileptic seizure rightly seems like a radical idea. In fact, move-by-wire systems are among the oldest cybernetic technologies designed to enhance combat reflexes. Originally inspired by hundred-year-old aircraft fly-by-wire systems, move-by-wire has since been supplanted by less radical wired reflex systems. Thousands of computer-directed corrections are issued to the user's nervous system every second, taming the seizure down to a state of small twitches and tremors. However, the cybernetic processors assist rather than dampen movement in the direction the user wishes to perform, resulting in preternaturally quick and graceful fluidity of motion. Each point of move-by-wire rating grants +2 Reaction, +2 Agility, and an additional two Minor Actions per round that can only be spent on actions that involve physical movement. <br/>Move-by-wire is incompatible with other augmentations that modify Reaction. Once implanted, a move-by-wire system cannot be deactivated. If move-by-wire is bricked or otherwise rendered nonfunctional, the user suffers the <i>Stilled</i> status (p. 53, SR6) until the system is repaired.
item.move_by_wire.overdrive=Move-by-wire grants +4 dice to a test involving Agility or Reaction. One of these dice must be a wild die.
item.move_by_wire.wifi=Move-by-wire's bonus to Reaction stacks with reaction enhancers (p. 287, SR6) but is still subject to the usual augmented maximum of +4.
item.nutrition_storage_system=Nutrition Storage System
item.nutrition_storage_system.page=42
item.nutrition_storage_system.desc=Food paste and water are stored in implanted reservoirs that release into the user's stomach and mouth. These storage systems are refilled via external ports. Each rating point allows for a day's worth of food and water to be consumed internally.
item.nutrition_storage_system.wifi=If equipped with DNI or a taste booster, you can experience the taste of the paste being pressed directly into your stomach.
item.retractable_claws=Retractable Climbing Claws
item.retractable_claws.page=42
item.skill_hardwires=Skill Hardwires
item.skill_hardwires.page=42
item.skill_hardwires.desc=Skill hardwires are a cheaper alternative to standard skillwires. This dedicated system is implanted with a hard-coded skillsoft that is already included in the price. The rating of the artificial skill equals the skill hardwire rating. The software cannot be changed, but multiple skill hardwires can be implanted without interfering with each other or with skillwires. Because the system includes the necessary processors, skill hardwires do not require a skilljack. As with standard skillwires, the user cannot gain or spend Edge on tests involving this artificial skill.
item.skill_hardwires.overdrive=Skill hardwire rating increases by +2, ignoring the maximum rating. One of these gained skill dice is converted to a wild die.
item.skill_hardwires.wifi=The user can gain or spend Edge while using skill hardwires.
item.skill_hardwires.choice.skill=Physical skill
item.speed_boster=Speed Booster
item.speed_boster.page=42
item.speed_boster.desc=Speed boosters are a derivative technology developed from research based on the new generation of move-by-wire augmentations. Rather than improving Reaction and Agility, though, all of the cybernetic processors are focused on pure movement. This augmentation does not alter the user's movement rate but allows the user to use the Move and Avoid Incoming Minor Actions an additional time per combat round per rating point.
item.touch_link=Touch Link
item.touch_link.page=43
item.touch_link.desc=Haptic input and response are cornerstone technologies of augmented reality (AR). While AR gloves and other haptic clothing are available, those dedicated to the experience can have a touch link implanted so they've always got the immersive advantage in dating or gaming sims.

item.additional_cyberarm=Additional Cyberarm
item.additional_cyberarm.page=43
item.additional_cyberarm.overdrive=An additional cyberarm's Strength and Agility are increased by 2, ignoring augmented limits for the duration of one test. Convert one die to a wild die for that test.
item.additional_cyberarm.variant.fullarm_synthetic=Synthetic
item.additional_cyberarm.variant.fullarm_obvious=Obvious
item.additional_cyberarm.desc=Standard cyberarms are built to mimic natural biological function, but there are also limbs designed to push the body beyond what evolution designed. Additional cyberarms do not replace the user's natural arms but reinforce the torso to accept more mechanical arms than standard for their metatype. They can be modified in all the same ways as full cyberarms can except as follows: They can be added singularly or in pairs, with a maximum of two additional pairs. Either side of the body cannot have more than one more arm than the other side has. <br/>Due to the difficulty in finding clothes, any fitted gear costs five percent more per additional cyberlimb. Every two additional cyberarms grants the user a bonus Minor Action while not in VR or projecting on the astral plane.
item.articulated_weapon_mount=Articulated Weapon Mount
item.articulated_weapon_mount.page=43
item.articulated_weapon_mount.desc=A common desire among those seeking additional arms is to have more hands that can hold more guns. Articulated weapon mounts serve this niche without the expense and invasiveness of adding full limbs to the user. Little more than a cybernetic smart firing platform mounted on the shoulder, these systems consist of a retractable,  articulated basic arm thirty centimeters in length when fully unfolded. This arm terminates in a weapon rail that can accommodate a firearm no bigger than a shotgun, automatically tracking the weapon in the direction of the user's focus. The user can attack with a mounted weapon as if it were equipped in their hands. It takes a Minor Action to deploy or retract an articulated weapon mount, and it takes an additional Major Action to snap a weapon in or remove it from the mount. The system cannot retract while a weapon is attached. The user can only implant up to two articulated weapon mounts.
item.articulated_weapon_mount.overdrive=>n articulated weapon mount can deploy while the user is wearing sleeved clothing, pushing hard enough to tear through fabric. Armor torn through in this way grants no Defense Rating until repaired (see Build/Repair, p. 95, SR6).
item.articulated_weapon_mount.wifi=Wireless articulated weapon mounts can participate in Link-Fire attacks (p. 143, Double Clutch), augmenting an attack made with another ranged weapon.
item.built-in-medkit=Built-In Medkit
item.built-in-medkit.page=44
item.built-in-medkit.desc=Just as cyberdecks or commlinks can be implanted into a skull, medkits can be built into a full or partial cyberlimb. The limb becomes equipped with useful surgical implements and a smart system to help with diagnoses and treatment. This system only involves the housing and connections for cybernetic control; a medkit (p. 281, SR6) still must be purchased separately for installation.
item.built-in-medkit.wifi=The medkit provides a +1 dice pool modifier to healing tests. Additionally, if the user is in a VR Matrix user mode, they can employ a wireless built-in medkit on their own comatose body.
item.built-in-utilitykit=Built-In Utility Kit
item.built-in-utilitykit.page=44
item.built-in-utilitykit.desc=A cyberlimb can house any assortment of specialty tools. A kit can include tools such as drills, clamps, saws, or virtually anything else required for technical tasks. A built-in utility kit must be selected for a specific skill and functions as a cybernetically controlled tool kit (p. 273, SR6).
item.built-in-utilitykit.wifi=The user's mental control of tools for delicate work is superior to manual manipulation. Reduce the cost of an Edge Boost by 1 (to a minimum of 1) for a test involving the built-in utility kit.
itemmod.bulk_modification=Bulk Modification
itemmod.bulk_modification.page=44
item.custom-fitted_cyberlimb=Custom-Fitted Cyberlimb
item.custom-fitted_cyberlimb.page=44
item.cyberfinger=Cyberfinger
item.cyberfinger.page=45
item.cyberfinger.desc=Someone got your finger? No need to replace the entire hand when you only need to restore a single digit. Alternatively, a cyberfinger can be incorporated into an existing cyberlimb at a capacity cost of [1]. Cyberfingers do not have capacity that can be freely used, but if you want more than minimal functionality, you can incorporate one of the variants:
item.cyberfinger.variant.finger_gun=Gun
item.cyberfinger.variant.finger_gun.desc=No longer just a hand gesture! A finger gun functions as an implanted hold-out pistol (p. 290, SR6). The pistol must be purchased separately.
item.cyberfinger.variant.finger_key=Key
item.cyberfinger.variant.finger_key.desc=The memory-metal fingertip can reshape itself into pre-recorded key configurations or into lockpicking tools for Engineering (Lockpicking) tests.
item.cyberfinger.variant.finger_lighter=Lighter
item.cyberfinger.variant.finger_lighter.desc=Available in electric arc or classic butane cartridge models.
item.cyberfinger.variant.frag_finger=Frag
item.cyberfinger.variant.frag_finger.desc=Why flip them off? Pull your finger off and give them a proper “frag you.” This finger incorporates a HE grenade (p. 263, SR6), but its DV is reduced by 4 at all ranges.
item.cyberfinger.variant.torch_tip=Torch
item.cyberfinger.variant.torch_tip.desc=A simple, small flashlight. Also available in black light, low light, or thermographic models.
