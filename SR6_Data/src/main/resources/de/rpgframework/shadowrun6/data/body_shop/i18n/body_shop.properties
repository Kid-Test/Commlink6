item.carapace_leech=Carapace Leech
item.carapace_leech.page=73
item.carapace_leech.desc=Carapace symbionts possess a natural hardened shell and are implanted subdermally in critical areas (covering the chest and upper limbs), acting as a form of dermal armor (p.71, SR6). Careful clothing can conceal the leech symbionts from view.<br/>This symbiont is incompatible with any other skin modifications.
item.cleaner_leech=Cleaner Leech
item.cleaner_leech.page=73
item.cleaner_leech.desc=For a long time, the only leech symbiont in use was the cleaner, which is simply a modern take on a procedure used thousands of years ago. Flesh-eating insects, usually maggots but sometimes small beetles, are introduced to a wound, where they consume only the dead flesh. They clean the wound in a matter of days far more thoroughly than modern science can with tools. The insects only eat necrotic tissue, avoiding any damage to living flesh whatsoever. As dead flesh has no nerve endings, the procedure doesn't so much as a tickle. Unfortunately, people tend to react badly to the sight, so dressing the wound is vital to the procedure's success.<br/>Cleaners are a temporary symbiont that provides +1 die to natural Healing tests until all damage is removed and +4 dice to resist secondary infection until all wounds are healed.
item.cypher_leech=Cypher Leech
item.cypher_leech.page=73
item.cypher_leech.desc=While most of the symbiont research is fairly old, there are a couple of new avenues that have started to show up. Some Emerged symbiotic leeches were discovered near power substations. When technicians went to perform routine maintenance on the software, they found that the firewalls of the local hosts were bolstered beyond what they should have been. This brought in some researchers from the parent company. With two weeks' training, the leeches will boost the Firewall of a specific Matrix device. For this service, they only require sustenance from their host.<br/>Cyphers are a symbiont that provides +1 to the Firewall rating. If the device it has been trained to protect is ever destroyed or swapped, it takes an additional two weeks to retrain them to protect a new device.
item.glow_leech=Glow Leech
item.glow_leech.page=73
item.glow_leech.desc=This leech symbiont is mana-sensitive, possessing spliced glo-moss genes. Whenever an astral form passes through the host body, the symbiont trembles and visibly glows. Glow symbionts have also been known to light up when passing through mana barriers, a ward, or in the area of a spell. Allow the host to make a Perception + Intuition (2) test, with a +2 dice pool bonus. If the test succeeds, the character feels the symbiont vibrate, and the leech glows.
item.sac_leech=Sac Leech
item.sac_leech.page=73
item.sac_leech.desc=This leech symbiont is essentially a living chemical gland (p. 57), designed to release its compound into the host's system with a neural signal. Each sac leech can only produce a single compound, chosen when purchased, and the selection cannot be changed. These compounds must be non-magical. The sac leech produces a single dose every twenty-four hours and can hold as many as two doses at once.<br/>Note that the implantation of a sac leech in no way provides immunity, or even improved resistance, from the substance for the user. The sac leech keeps the compound from leaking into the body naturally.<br/>\
 The sac leech's cost is the base price of the gland plus an amount equal to the cost of one hundred doses of the chemical compound it produces. The Availability of the sac leech is 6, or equal to the compound created, whichever is higher, and is licensed or illegal if the chemical carries such a flag.<br/>\
 A user may have several sac leeches. The sac leech may be connected to a cybernetic reservoir.
item.endo_booster=Endo-Booster
item.endo_booster.page=74
item.endo_booster.desc=Connecting to the adrenal glands at the top of the kidney, the endo-booster quietly stores excess adrenaline, releasing it into the body during high-stress moments and staving off the onset of exhaustion in the process. They reduce any Fatigue status by two levels, but remaining Fatigue (if any) lingers twice as long as the booster siphons energy to replenish itself.<br/>This is compatible with a synthacardium augmentation (p. 292, SR6).
item.endo_digester=Endo-Digester
item.endo_digester.page=74
item.endo_digester.desc=One of the simplest of endodonts, the digester takes advantage of the inherently inefficient human digestive system. It is attached to the large intestine and feeds off waste material, converting it to assorted proteins that it can easily digest and share with the host. In essence, it acts as a second and stronger stomach, wringing more efficient digestion out of food and other matter. The process allows the host to make more with less and helps process water especially well.<br/>The host may reduce their food intake by fifty percent without harm (reduce the host's Lifestyle cost by ten percent if more advanced lifestyle rules are not being used), and they may double the time that they can go without water.
item.endo_electrocore=Endo-Electrocore
item.endo_electrocore.page=74
item.endo_electrocore.desc=Rumor has it that the endo-electrocore was accidentally discovered in a Shiawase research laboratory built off the coast of Hong Kong. While on lunch, a scientist noticed that a variety of aquatic life was being drawn to the laboratory. She originally thought it could be new forms of technoanimal, and soshe had a team capture specimens for study. The truth was that the animals were the host of an unknown endosymbiotic relationship. The new lifeform was extracted, and new testing began. <br/>When endo-electrocore is injected into a metahuman, they start to sense Matrix activity, such as signal direction and strength, and at times the type of device.<br/>\
 The endo-electrocore functions up to a distance equal to (Body + Intuition) in meters. A Major Action is required to use endo-electrocore, then roll Perception + Intuition and check the hits against the Electrosense Table (p. 68). An endo-electrocore only provides information from the technosense column. This is a passive sense, with no broadcasting noise originating from the individual.
item.endo_electroreceptor=Endo-Electroreceptor
item.endo_electroreceptor.page=74
item.endo_electroreceptor.desc=This lifeform can detect electromagnetic energy within a range of one meter, passing that information to its host as a small buzz in its nervous system. As a side effect, they're always aware of magnetic north.<br/>A simple Perception + Intuition (2) test will reveal magnetic activity within one meter, such as that produced by current-powered devices, other than the host's own gear.
item.endo_gain=Endo-Gain
item.endo_gain.page=74
item.endo_gain.desc=These endodonts attach themselves to muscles and strengthen their resistance to damage. When people undertake physically tasking activities, they cause micro-tears in their muscle fibers. Endo-gain acts as a glue or bandage. The tear still happens, but the muscle doesn't lose effectiveness, allowing a person to lift or carry more than normally possible.<br/>When calculating how much a character can carry (p. 68, SR6), add +1 to Strength. Additionally, if a character makes a Lift/Carry test, they receive +1 situational Edge.
item.endo_halcyon=Endo-Halcyon
item.endo_halcyon.page=74
item.endo_halcyon.desc=This lifeform spends most of its life in a dormant state. It's only when its food source is in abundance that it wakes to gorge itself until falling back into hibernation. It feeds on cortisol, which is the alarm system for individuals' fight-or-flight mechanism. When someone starts to panic, more cortisol is released into the body, awakening the lifeform. It starts eating the cortisol and reduces the chance of someone panicking. It naturally multiplies until it is in harmony with its environment, meaning that it works with any augmentations. The only difference is that someone with, say, an adrenal gland may require more of the life forms within their body to reach that balance.<br/>Endo-halcyon adds +1 situational Edge to defend against any panic-related test. Additionally, endo-halcyon allows anyone with a Phobia (p.130, Firing Squad) to gain and spend Edge while near their subject of phobia.
item.endo_mender=Endo-Mender
item.endo_mender.page=74
item.endo_mender.desc=A mender endosymbiont functions as a kind of living medkit. Its neural link to the user will warn them of any significant trauma. When the host takes Physical damage, the mender moves internally to eat dead skin, promote healing, and secrete antibacterials and coagulants to stop bleeding and prevent infection.<br/>When making a Natural Recovery (p. 120, SR6), the host gains +1 Body for the test.
item.endo_slimworm=Slimworm:
item.endo_slimworm.page=74
item.endo_slimworm.desc=Slimworms were created as a smart anti-obesity medical treatment. They reduce and control weight by suppressing the appetite, increasing the body's metabolism or interfering with the body's ability to absorb specific nutrients in food (e.g., blocking fat breakdown and thus preventing fat absorption) without stressing the host too much by overmedication. As long as the abilities of the symbiont are not overstrained or canceled (by starvation), the host will preserve a certain weight and nutrition level (laid out by the symbiont's design) no matter how much or little they eat. However, if the recipient undereats, they must go on eating binges at regular intervals to keep the slimworm from starving. <br/>Slimworms also provide a +1 modifier to Toxin Resistance tests when resisting ingested toxins.
item.endo_stalwart=Endo-Stalwart
item.endo_stalwart.page=75
item.endo_stalwart.desc=This symbiont secretes a specially tailored neurotransmitter that subtly modifies the host's behavior, making them slightly more resistant to fear. Apply a +1 dice pool modifier to any tests to resist fear or intimidation.<br/>Some hosts have also noticed a slight increase in risk-taking behavior; at the gamemaster's discretion, the character must make a Willpower + Logic (2) test to actively resist taking unnecessary risks or remaining in dangerous situations.

