mentorspirit.the_eldest=The Eldest
mentorspirit.the_eldest.page=131
mentorspirit.the_eldest.disadvantage=The Eldest seeks champions to keep the world from falling apart—those who are willing to fight for the world, protecting life when possible.
mentorspirit.fae_godmother=Fae Godmother and Pauper Lord
mentorspirit.fae_godmother.page=131
mentorspirit.fae_godmother.disadvantage=The character must be kind to those who are less fortunate and treat everyone as equals, regardless of status or wealth. 
mentorspirit.goblin_king=Goblin King
mentorspirit.goblin_king.page=132
mentorspirit.goblin_king.disadvantage=Everything is a transaction; nothing is free.
mentorspirit.tripple_goddess=Triple Goddess
mentorspirit.tripple_goddess.page=132
mentorspirit.tripple_goddess.disadvantage=In general, the triple goddess' tenets revolve around retrospect and consciousness of oneself, though the phase of the moon brings other traits to the surface.
mentorspirit.four_horsemen=Pestilence, War, Famine, And Doom
mentorspirit.four_horsemen.page=133
mentorspirit.four_horsemen.disadvantage=Convinced that the end is nigh, these mentors see no point in maintaining relationships, becoming attached to certain interests, or keeping hold of any possessions that are not of use to their apocalyptic plans.
mentorspirit.red_bear=Red Bear
mentorspirit.red_bear.page=133
mentorspirit.red_bear.disadvantage=The Red Bear wants its followers to have the Russian nation in mind as they work and live.
mentorspirit.toxic_red_bear=Toxic Red Bear
mentorspirit.toxic_red_bear.page=133
mentorspirit.toxic_red_bear.disadvantage=Whenever wounded by an enemy, a follower of Red Bear must make a Composure (3) test or go berserk like followers of Shark (p. 166, SR6
).
mentorspirit.knowledge_seeker=Knowledge-Seeker
mentorspirit.knowledge_seeker.page=134
mentorspirit.knowledge_seeker.disadvantage=Followers must always seek out knowledge in as many forms as possible, no matter how trivial, because one never know what could prove useful.

mentorspirit.lemur=Lemur
mentorspirit.lemur.page=152
mentorspirit.lemur.disadvantage= Failure to protect your home turf leaves you feeling hollow and empty; you take a –1 dice pool modifier to all actions until you return your home turf to safety.

mentorspirit.atomic=(Toxic) Atomic
mentorspirit.atomic.page=169
mentorspirit.atomic.disadvantage=Followers of Atomic are volatile and quick to anger and must make a Charisma + Willpower (3) test not to react violently when challenged or insulted.
mentorspirit.disease=(Toxic) Disease
mentorspirit.disease.page=169
mentorspirit.disease.disadvantage=Followers of Disease must make a Charisma + Willpower (3) Test to not flee or seek cover when ever they're in a combat situation, unless they outnumber their opponents. Even if they begin a fight with superior numbers, they must make a test to avoid fleeing if their side is reduced so that they no longer outnumber their opponents.
mentorspirit.doom=(Toxic) Doom
mentorspirit.doom.page=169
mentorspirit.doom.disadvantage=Followers of Doom must succeed in a Willpower + Charisma (3) Test to create a plan that avoids violence, or to abandon a fight once it has begun. If they fail, they must engage in combat until all opponents are defeated or flee.
mentorspirit.mutation=(Toxic) Mutation
mentorspirit.mutation.page=169
mentorspirit.mutation.disadvantage=If followers of Mutation find themselves inferior to an opponent by failing an attack or social test, they suffer a –1 penalty on all actions until they defeat their rival in that area or overcome or compensate for their weakness in another way (such as acquiring a new power, spell, or augmentation).
mentorspirit.pollution=(Toxic) Pollution
mentorspirit.pollution.page=170
mentorspirit.pollution.disadvantage=Followers of Pollution must make a Willpower + Charisma (3) Test every day they are in an area that's cleaner than their normal habitation. If they fail, they must spend at least eight hours that day actively despoiling the land, regardless of any other plans they had for that time.

