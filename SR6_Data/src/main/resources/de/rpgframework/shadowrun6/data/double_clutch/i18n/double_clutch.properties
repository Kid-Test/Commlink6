item.anti_theft=Anti-theft system
item.anti_theft.page=139
item.anti_theft.variant.rating1=Rating 1
item.anti_theft.variant.rating1.desc=This is the default level of security that every vehicle with a Pilot rating has. If the vehicle's sensors detect an unauthorized intrusion, the pilot alerts the owner with an electronic message and attempts to draw attention to the theft with lights and sounds. <br/>A rating 1 system may be installed on a vehicle without a pilot (such as a trailer); this is the highest-rating system such vehicles can use.
item.anti_theft.variant.rating2=Rating 2
item.anti_theft.variant.rating2.desc=In addition to the simple notice to the owner, this rating incorporates a broadcast of the GPS location of the vehicle and imagery of the vehicle's interior and exterior, as captured by the vehicle sensors. This broadcast can also be transmitted directly to local law enforcement. This rating also includes the ability for the owner to remotely lockdown the vehicle, making it physically impossible to drive until the release code is sent by the owner (or that aspect of security is bypassed).
item.anti_theft.variant.rating3=Rating 3
item.anti_theft.variant.rating3.desc=This level includes all of the previous features and adds the activation of other vehicle systems such as a gas dispersal system equipped with a toxin of choice or a zapper installed on the vehicle.
item.anti_theft.variant.rating4=Rating 4
item.anti_theft.variant.rating4.desc=This is the final word in vehicle protection. It includes all of the features of lower ratings and adds a remote triggered self-destruct option with enough plastic explosives (a rating equal to the vehicle's Armor rating) to reduce the vehicle to medium-to-small component parts.

