item.life_safe_system.desc=In order to protect vehicle occupants from airborne toxins and chemicals, a life safety system may be installed. This system comes in two levels, depending on the need, and can only be added to standard and totally enclosed construction forms.<br/>\
 In a level 1 system, all normal leak points in a vehicle, such as door and window frames, have been made air- and water-tight; air only circulates through the vehicle's ventilation system. The system also includes a variety of filters and purifiers to help prevent airborne toxins and diseases from harming those inside a vehicle. The level 1 system counts as rating 6 chemical protection (p. 266, SR6), adding 6 dice to the occupants' Toxin Resistance test against any airborne drug, toxin, or disease that's in the air around the vehicle.<br/>\
 A level 2 system includes everything from the level 1 system while also allowing all external air intakes to be shut off, making the vehicle completely air and water tight. Additionally, the vehicle is equipped with its own independent air supply, lasting for one hour. The level 2 system counts as a rating 6 chemical seal (p. 266, SR6) for any game situations where that applies.
