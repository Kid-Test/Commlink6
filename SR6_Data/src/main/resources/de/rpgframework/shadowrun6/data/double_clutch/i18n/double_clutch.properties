dataset.name.short=DC
dataset.name=Double Clutch
dataset.desc=<b>Jump In</b><br/><br/>\
 In the Sixth World, you can go from home to work to stores and back home again without touching a steering wheel or pushing a pedal, letting your vehicle and the networks it is hooked into do all your driving for you.<br/><br/>\
 But why would you want to do that?<br/><br/>\
 The accelerating jump of a vehicle when the clutch engages at just the right point, the smell of burning rubber, the sound of a thrumming engine that you can feel in the back of your sternum—those are the sort of things riggers live for—the sort of things they get when jump in to the right vehicle, tuned exactly the way they want it.<br/><br/>\
 <em>Double Clutch</em> gives riggers a host of new options, including all sorts of vehicles and drones, as well as rules for customizing vehicles, making their own vehicles, and customizing their character to be the best rigger around. Everything they want is here.<br/><br/>\
 <em>Double Clutch</em> is the core rigging rulebook for Shadowrun, Sixth World.

