spell.antipathy=Antipathy
spell.antipathy.page=108
spell.antipathy.desc=The targets of this spell are magically infused with a strong opposition to social interactions. The caster rolls a Sorcery + Magic (5 – Essence) test. While under the effects of Antipathy, a target is immune to being Suckered, Smitten, and Misdirected (p. 44) and gains a temporary Edge whenever they are resisting a Social test. However, the gained antipathy also means they cannot gain or spend Edge when initiating a Social test.
spell.arousal=Arousal
spell.arousal.page=108
spell.arousal.desc=This spell causes a target’s aura to emit a vibe that arouses people much like pheromones, but specifically targets the septal region of the limbic system, making the target sexually appealing to people they interact with. The caster rolls a Sorcery + Magic (5 – Essence) test. The target gains a temporary Edge whenever they use the Con or Influence skills to seduce someone. If the net hits of the seduction skill roll are equal to or greater than the victim’s Willpower, they gain the Smitten status (p. 44).
spell.blackout=Blackout
spell.blackout.page=108
spell.blackout.desc=Blackout renders a target unable to remember anything while the spell is in effect. Roll Sorcery + Magic vs. Willpower + Logic; net hits give the maximum duration of the spell in minutes. Targets of the spell behave normally during the du-
spell.charm=Charm
spell.charm.page=108
spell.charm.desc=The Charm spell gives the target a silver tongue. Roll Sorcery + Magic and record the number of hits; those hits are used as a threshold when people try to see through the illusion, which requires a Willpower + Intuition test. While the Charm is in effect, the target gains +4 on all Con and Influence skill tests, and net hits on the Spellcasting test are added to the subject’s Social Rating (p. 50, Firing Squad) as long as the spell is sustained.
spell.clear_thoughts=Clear Thoughts
spell.clear_thoughts.page=108
spell.clear_thoughts.desc=This spell clears the target of the Misdirected status. When casting this spell, roll Sorcery + Magic with a threshold of (5 – Essence).
spell.cold_shower=Cold Shower
spell.cold_shower.page=108
spell.cold_shower.desc=This spell clears the target of the Smitten status. When casting this spell, roll Sorcery + Magic with a threshold of (5 – Essence).
spell.compel_truth=Compel Truth
spell.compel_truth.page=108
spell.compel_truth.desc=Compel Truth forces a target to speak only the truth as they know it. The target can say anything they believe to be true, even if it is not. The subject is not forced to speak, and may withhold information, but cannot directly lie. Roll a Sorcery + Magic vs. Willpower + Logic Opposed test; net hits give the maximum duration of the spell in minutes.
spell.desire=Desire
spell.desire.page=109
spell.desire.desc=The targets of this spell are bombarded with overwhelming feelings of desire. Roll Sorcery + Magic vs. Willpower + Logic; the target gains the Smitten status if they fail to resist.
spell.evil_eye=Evil Eye
spell.evil_eye.page=109
spell.evil_eye.desc=This spell projects feelings of imminent danger, fear, and unease on a target emanating from the caster. Targets simultaneously feel chilled and nervous, as panic begins to set it. Roll a Sorcery + Magic vs. Willpower + Logic Opposed test. Targets who fail to resist the spell gain the Frightened status. If net hits exceed the target’s Willpower, the target gains the Panicked status. Evil Eye is used on one particular target, while Foreboding affects everyone in the area other than the caster.
spell.paranoia=Paranoia
spell.paranoia.page=109
spell.paranoia.desc=This spell projects feelings of imminent danger, fear, and unease on a target emanating from the caster. Targets simultaneously feel chilled and nervous, as panic begins to set it. Roll a Sorcery + Magic vs. Willpower + Logic Opposed test. Targets who fail to resist the spell gain the Frightened status. If net hits exceed the target’s Willpower, the target gains the Panicked status. Evil Eye is used on one particular target, while Foreboding affects everyone in the area other than the caster.
spell.mental_fortitude=Mental Fortitude
spell.mental_fortitude.page=109
spell.mental_fortitude.desc=Targets of this spell are able to shake off supernatural influences. They may add +1 per net hit to any test to resist magical mind control or emotional manipulation, in addition they can make a Composure (2) test to shake off any unwanted social status (p. 44). The caster rolls a Sorcery + Magic (5 – Essence) test. They may choose how many net hits to apply, up to a maximum of +4, with each net hit applied beyond the first adding 1 to the Drain Value.
spell.nudge=Nudge
spell.nudge.page=109
spell.nudge.desc=Similar to Control Thoughts but more subtle and less controlling, this puts the spellcaster inside the head of the target, making them very susceptible to what the spellcaster suggests. Roll Sorcery + Magic vs. Willpower + Logic; net hits give the maximum duration of the spell in minutes. Unlike Control Thoughts, the target’ is often unaware that this spell was used on them. At the gamemaster’s discretion, the target can make a Logic + Intuition test after the spell wears off to recognize the spell’s effect on them with a threshold based on how different from normal their thoughts were made to be. Nudge is also less controlling than Control Thoughts. Instead of absolute control of the target’s thoughts, the spellcaster gains +1 to all Social skill tests per net hit, to a max of +4 while the effect lasts. The target is also prevented from spending Edge to resist these tests.
spell.sideshow=SideShow
spell.sideshow.page=109
spell.sideshow.desc=These spells tap into a target’s subconscious causing a mental diversion. The target sees something that will draw their attention away from the caster. Note that the illusion will be different for each observer in a group, so when used on a group of security guards, one guard sees a short-skirted schoolgirl, another sees a man covered in whipped cream singing opera, and another may just see a dancing bear juggling bowling pins. Roll Sorcery + Magic vs. Willpower + Logic. The target gains the Misdirected (#) status, with the number equaling the net hits on the test for as long as the spell is sustained. If pressed later to recall the encounter, those affected by the spell will recall the illusion, not the caster. SideShow is used on one particular target, while Three Ring Circus affects everyone in the area other than the caster.
spell.three_ring_circus=Three Ring Circus
spell.three_ring_circus.page=109
spell.three_ring_circus.desc=These spells tap into a target’s subconscious causing a mental diversion. The target sees something that will draw their attention away from the caster. Note that the illusion will be different for each observer in a group, so when used on a group of security guards, one guard sees a short-skirted schoolgirl, another sees a man covered in whipped cream singing opera, and another may just see a dancing bear juggling bowling pins. Roll Sorcery + Magic vs. Willpower + Logic. The target gains the Misdirected (#) status, with the number equaling the net hits on the test for as long as the spell is sustained. If pressed later to recall the encounter, those affected by the spell will recall the illusion, not the caster. SideShow is used on one particular target, while Three Ring Circus affects everyone in the area other than the caster.
spell.thought_recognition=Thought Recognition
spell.thought_recognition.page=109
spell.thought_recognition.desc=These spells are a less intrusive form of Mind Probe (p. 135, SR6). The caster gives the subject the ability to scan a target’s surface thoughts for a particular subject (word, phrase, sound, or image chosen when the spell is cast). This spell does not dig through a person’s mind for information, it merely verifies if a target is actively thinking about a particular subject. Roll Sorcery + Magic vs. Willpower + Logic. The spell is often used in conjunction with interrogation or conversations to determine if a target has knowledge related to a particular subject. For example, an investigator could use it to determine if a target knows anything about a murder weapon, or a con artist could use it to determine if a target is reacting. Thought Recognition is used on one particular target, while Area Though Recognition scans the minds of everyone within the area.
spell.area_thought_recognition=Area Thought Recognition
spell.area_thought_recognition.page=109
spell.area_thought_recognition.desc=These spells are a less intrusive form of Mind Probe (p. 135, SR6). The caster gives the subject the ability to scan a target’s surface thoughts for a particular subject (word, phrase, sound, or image chosen when the spell is cast). This spell does not dig through a person’s mind for information, it merely verifies if a target is actively thinking about a particular subject. Roll Sorcery + Magic vs. Willpower + Logic. The spell is often used in conjunction with interrogation or conversations to determine if a target has knowledge related to a particular subject. For example, an investigator could use it to determine if a target knows anything about a murder weapon, or a con artist could use it to determine if a target is reacting. Thought Recognition is used on one particular target, while Area Though Recognition scans the minds of everyone within the area.
spell.wingman=Wingman
spell.wingman.page=110
spell.wingman.desc=Wingman is a specialized form of Mindlink, that allows the caster and subject to read off each other’s intents and emotions without showing any obvious communication. When attempting a social related Teamwork test, the helper gains a temporary Edge to use on their assistance roll, the leader on the test then gains one temporary Edge for each additional die the helper provides to the test. All other limits and conditions of teamwork still apply.

