item.conventional_explosives.desc=A range of explosive compounds, both solid and liquid, are available to the construction industry for all their destructive needs. All explosives are bought as an Explosive Package with a set Rating that encompasses an amalgamation of their power
item.plastic_explosives.desc=These highly stable, moldable, and adhesive explosive compounds are military grade. They're ideal for certain jobs, like breaching walls and are usually color-tinted to indicate the level of current needed to detonate them, from the black of magnetic-field induction to the chalky white of 440-volt industrial explosives. We say usually because some bomb makers like to dye their devices to throw off bomb techs trying to disarm their device.
item.foam_explosives.desc=Plastic explosives with the consistency of shaving cream, stored in an aerosol can. Perfect for spraying into crevices, and detonated the same way as regular plastic explosives.
item.detonator_cap.desc=This detonator is inserted into a mass of explosives and set off either by a programmable timer or radio signal. Setting the timer takes a Major Action.
item.detonator_cap.wifi=You can set the detonator's timer with a Minor Action. You gain a Minor Action Command DNI-linked device Action to detonate the explosive.

