skill.outdoors.skillspec.animal_handling=Animal Handling
skill.perception=Perception
skill.perception.page=96
skill.perception.desc=Is someone sneaking through the smog up ahead? Is there a secret compartment in that executive’s desk? Where’s the light switch? These are some of the questions that can be answered with a Perception test. \nPerception is also used to attempt to see those who do not wish to be seen.\nSometimes Perception is about more than just taking in the details of your surroundings or trying to spot a hidden object. It may be about seeing how different things link to each other, or discerning a pattern in events or movements.\n\nSecondary Linked Attribute: Logic, for pattern recognition.
