item.anti-vehicle.desc=AV rockets/missiles contain a shaped-charge warhead designed to burn or punch its way through a vehicle or barrier. Though the impact causes a blast, it is limited compared to that of a High-Explosive projectile. +2 Attack Rating against vehicles.
item.fragmentation.desc=Used principally against people, the warhead discharges high-speed fragments designed to tear soft targets. These rockets/missiles are very effective against unprotected individuals, but not great against barriers, structures, and vehicles.
item.high_explosive.desc=HE rockets/missiles are designed to do heavy damage to a small area. Their blast pattern is similar to that of a grenade, but slightly larger.
item.gas_rocket.desc=Any chemical or toxin payload can be chosen (Toxins and Drugs, p. 121). The cloud lasts for approximately 10 combat rounds, based on the Gas Attack rules, p. 116.
