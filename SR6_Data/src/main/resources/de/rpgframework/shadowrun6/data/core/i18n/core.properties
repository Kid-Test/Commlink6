item.tear_gas.desc=CS gas is an irritant that affects the eyes, skin, and mucus membranes, causing them to burn and water. It also stimulates a physiological panic response: increased heart rate, shortness of breath, and so forth. Washing thoroughly with soap and water can remove CS from the victim's skin, thus ending the duration of the nausea prematurely. CS gas becomes inert after two minutes of contact with the air.
item.gamma_scopolamine.desc=This particularly nasty agent, derived from nightshade, is a neuromuscular blocking agent that paralyzes its target. It takes effect immediately, causing dizziness, pupil dilation, speech loss, delirium, and paralysis. The full effects last for about an hour. Once the primary effects wear off, the remaining residue in the victim's system acts as a "truth serum” for another hour. Reduce the target's Willpower by 3 (to a minimum of 1) for the remainder of the toxin's duration.
item.narcoject.desc=A common tranquilizer, narcoject is typically used with dart guns. It has no side effects.
item.nausea_gas.desc=Used as a riot control agent, this gas causes nausea and a crippling need to vomit. Nausea gas becomes inert after two minutes of contact with the air.
item.neuro_stun_viii.desc=Neuro-Stun is colorless and odorless. It's the industry standard knockout gas for emergency containment situations and comes in various concentrations. Neuro-Stun VIII becomes completely inert after ten minutes of contact with air.
item.neuro_stun_ix.desc=Neuro-Stun is colorless and odorless. It's the industry standard knockout gas for emergency containment situations and comes in various concentrations. Neuro-Stun IX and X become completely inert after one minute.
item.neuro_stun_x.desc=Neuro-Stun is colorless and odorless. It's the industry standard knockout gas for emergency containment situations and comes in various concentrations. Neuro-Stun IX and X become completely inert after one minute.
item.pepper-punch.desc=Pepper punch is an irritant combining CS and
capsaicin, which is derived from the active ingredient in hot peppers, along with other chemicals. It is typically deployed as a liquid spray for personal defense and deterrence; this agent is often tagged with RFID tags or special dyes to identify victims later. Someone dosed with pepper punch feels an intense burning on any affected skin; this affect is even more pronounced if it gets in the eyes, nose, or mouth. Victims sprayed in the eyes have trouble seeing, and breathing becomes difficult.
item.seven_7.desc=This is another colorless and odorless gas, developed specifically to bypass chemical protection measures. In addition to Physical damage, Seven-7 causes cramping, nausea, and double vision in victims. Seven-7 oxidizes and becomes inert after ten minutes of exposure to air.
item.alcohol.desc=Ranging from wine and beer to pure grain alcohol and mixed up in a variety of ways to taste good going down, alcohol is used across the world, though these days it's usually synthahol, a synthetic alcohol used because fermentation and processing take nuyen.
item.bliss.desc=A tranquilizing narcotic, bliss is an opiate synthesized from poppy plants. It takes its name from the sensations its users feel. Players attempting to roleplay a bliss user may want to focus on the escapist angle, using the drug to block out the chaotic or unsatisfying world.
item.cram.desc=Cram is an extremely popular stimulant. When this drug wears off, users crash and suffer 6 Stun damage (unresisted). Cram users appear hyper-alert, almost to the point of paranoia. They react quickly, often without thought, and they're prone to irrational outbursts. Other common side effects are jitteriness and fidgeting.
item.deepweed.desc=Deepweed is a narcotic derived by Caribbean houngans from an Awakened form of kelp. It's extremely enticing to the Awakened and is sometimes used to dose targets for possession. Deepweed forces any magically active user to astrally perceive, even if the user is an adept without the astral perception ability. Once its effects have worn off, deepweed users suffer a -1 to all dice pools for the same duration as the initial effect. There are dangers inherent in forced astral perception, such as attracting unwanted attention. Role-playing the effects of deepweed may mean portraying someone who seems not completely "present,” since they aren't.
item.jazz.desc=Jazz is a stimulant designed to better the odds for run-of-the-mill law-enforcement officers who run up against augmented street samurai. It's usually taken from a single-dose inhaler (or "popper”). When jazz wears off, the user crashes and is flooded with despondent and miserable emotions, gaining the Dazed status (p. 52) for a duration equal to the duration of the initial effect. Jazz makes people as jumpy and hyper as caffeinated two-year-olds. Role-playing a jazz user means turning it up a notch, portraying someone with too much energy to burn-and too much energy to focus.
item.kamikaze.desc=Kamikaze is a tailored combat stimulant. When kamikaze wears off, the user crashes and suffers -1 Reaction, -1 Willpower, and the Fatigued II status for twice the duration of the drug's Effect. They also suffer 6 Stun damage (unresisted). The repeated use of kamikaze has a destructive effect on the user's metabolism. Large doses can cause excitement, tremors, momentary euphoria, and dilated pupils. Excess doses (bordering on overdose level) cause anxiety, hallucinations, and uncontrolled muscular movements. Even higher dosages lead to death. Kamikaze users are nearcrazed, filled with a feeling of imperviousness and invincibility, exhibiting almost no regard for their own well-being. They can be entertaining to watch, as long as you're not in front of them.
item.long_haul.desc=A combination of synthesized hormones and other brain-regulating chemicals, long haul stimulates the brain and keeps the user awake, obviating the need for sleep. A character dosed on long haul can remain awake for four days without incurring any modifiers from fatigue or weariness. After this time, however, the user immediately passes out and sleeps soundly for 8D6 hours. If the character is kept awake during this period, they suffer from the Fatigued I status (p. 52), as they are afflicted with hallucinations and an inability to concentrate. If a second dose of long haul is taken after the first has worn off, the character can stay awake an additional (1D6 / 2) days but suffers the Fatigued I status. A third dose offers a single day of wakefulness while dealing with the Fatigued II status. A fourth offers one more day with the Fatigued III status. After that, additional doses will have no effect, and the user suffers 12 Stun damage (unresisted) and must crash as detailed above. Long haul cannot keep a character awake past this point, no matter how many additional doses are administered. If forced awake with a stim patch, the Fatigued III state persists until the 8D6 hours of rest (more like a coma, really) have been taken.
item.nitro.desc=A dangerous combination of potent drugs favored by troll gangers, nitro is a powerful stimulant that can easily kill a user. After the drug's effects wear off, the subject takes 9 Stun damage (unresisted) and suffers -2 to all tests (including Damage Resistance) for an equal duration. Nitro users feel infused with energy, suffer a diminished attention span, and talk incessantly (including to themselves).
item.nova_coke.desc=A stimulant derived from coca plants, novacoke is a highly addictive social drug. After the drug wears off, Charisma and Willpower are both reduced to 0 for a duration equal to the duration of the initial effect.
item.psyche.desc=This designer stimulant is especially prized by magicians and technomancers alike. In addition to the effects noted above, Awakened and Emerged users also only suffer a -1 dice pool modifier for each sustained spell or complex form (rather than the standard -2). Psyche users are simultaneously hyper-aware and detached, easily absorbed by detail and obsessive about certain facts or problems.
item.zen.desc=A psychedelic hallucinogen, zen is popular among those looking to escape reality or seeking trance-like states. It won't help you much when you're on a run, unless you dose your opponents with it.

#Armor and Armor Accessories
item.clothing_street=Clothing (Street)
item.clothing_street.page=265
item.clothing_street.desc=Clothing in 2080 has some serious functionality options: commlinks, music players, and other electronic devices can be woven right in, powered by interwoven batteries or special energy-gathering fabrics.<br/>On the other side of the economy, cheap soybased “flats” can be had for ten nuyen a set from vending machines around whatever sprawl you find yourself in. Spend more money, look more chic—simple as that.
item.clothing_squatter=Clothing (Squatter)
item.clothing_squatter.page=265
item.clothing_squatter.desc=Clothing in 2080 has some serious functionality options: commlinks, music players, and other electronic devices can be woven right in, powered by interwoven batteries or special energy-gathering fabrics.<br/>On the other side of the economy, cheap soybased “flats” can be had for ten nuyen a set from vending machines around whatever sprawl you find yourself in. Spend more money, look more chic—simple as that.
