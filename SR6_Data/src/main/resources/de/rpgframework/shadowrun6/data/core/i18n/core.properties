item.scratch_built_junk.desc=The second piece of critical equipment is the rigger command console (RCC), which is sometimes referred to as a captain's chair. It gives the rigger the ability to control more than one drone or vehicle at a time, which is important for riggers who want to wield a drone army. An RCC can have a number of slaved drones equal to its Rating x 3. A rigger can issue a single command to any number of the drones slaved to the RCC as a Major Action. The command issued will then be carried out by the drones when their turn comes up in initiative. Along with allowing the rigger to control multiple drones, the RCC also provides protection to the drones. Any hacking attempts on a drone slaved to an RCC must first gain access to the RCC. In order to resist this, the RCC has its own Data Processing and Firewall ratings. The Data Processing attribute is also used to determine Initiative when running in VR with the RCC.<br/>Along with its defensive capabilities, an RCC can run autosofts and can share them out to all slaved drones. The number of programs and autosofts it can share out is equal to the RCC's Data Processing rating. RCCs also provide noise reduction, reducing noise penalties by their Device Rating. Honestly, they're super useful, and you really should have one.
