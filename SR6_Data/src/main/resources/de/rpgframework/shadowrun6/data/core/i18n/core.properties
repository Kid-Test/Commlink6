skill.conjuring=Conjuring
skill.conjuring.page=94
skill.conjuring.desc=This skill allows you to summon, bind, and banish spirits. For details, see Conjuring, p. 146.<br/><br/><b>Primary Attribute:</b> Magic
skill.conjuring.skillspec.banishing=Banishing
skill.conjuring.skillspec.summoning=Summoning
skill.cracking=Cracking
skill.cracking.page=94
skill.cracking.desc=In the Matrix, there are two basic kinds of actions: legal and illegal. Cracking is what you use for the illegal ones. For details on the uses of Cracking, see Matrix, p. 171.
skill.cracking.skillspec.cybercombat=Cybercombat
skill.cracking.skillspec.electronic_warfare=Electronic Warfare
skill.cracking.skillspec.hacking=Hacking
skill.electronics=Electronics
skill.electronics.page=94
skill.electronics.desc=This is the other side of Matrix work, the legal side. Whether you’re using your commlink, kludging some software, fine-tuning your hardware, or whatever, Electronics is the skill for you. You can find more details about its use in the Matrix chapter, p. 170.\n\nSecondary Linked Attribute: Intuition, for kludge work
skill.electronics.skillspec.computer=Computer
skill.electronics.skillspec.hardware=Hardware
skill.electronics.skillspec.software=Software
skill.electronics.skillspec.complex_forms=Complex Forms
skill.enchanting=Enchanting
skill.enchanting.page=95
skill.enchanting.desc=Enchanting is used to craft—and sometimes demolish—foci, fetishes, and other items imbued with magic. Details about this can be found in the Magic chapter’s Enchanting section, p. 149.
skill.enchanting.skillspec.alchemy=Alchemy
skill.enchanting.skillspec.artificing=Artificing
skill.enchanting.skillspec.disenchanting=Disenchanting
skill.engineering=Engineering
skill.engineering.page=95
skill.engineering.desc=Engineering is about making things do the things you want them to do—making cars move, planes fly, boats float, and machines spin and roar so they can achieve whatever purpose they were built for. As the specializations show, this can cover a wide range of areas, but the skill essentially covers four basic activities: building, repairing, juryrigging, and vehicle gunnery. Building and repairing both follow the same basic process.\nJuryrigging is a Simple test, meant to get something to work in the short term with a quick adjustment or even a swift kick.\nEngineering is also used to pick mechanical locks and maglocks. It is combined with Agility for these tests, with a threshold based on the complexity of the lock.\n\nSecondary Linked Attributes: Intuition, for juryrigging; Agility, for lockpicking
