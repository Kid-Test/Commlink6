item.glue_solvent.desc=This spray can has enough solvent to dissolve about a square meter of fast-drying aerosol superglue.
item.glue_sprayer.desc=This fast-drying aerosol superglue allows you to quickly glue two rigid surfaces together, and it holds enough for about a square meter of glue (enough to glue an exterior door or picture window shut). The glue takes 1 combat round to harden. The glue has Body and Strength Ratings of 5 for the purpose of trying to force it (a Body + Strength Opposed test).
item.thermit_burning_bar.desc=Thermite is an incendiary material that burns at extremely high temperatures. It is applied with the help of a burning bar-a rod of thermite and oxygen mounted on a handle and in a frame-that can be used to melt holes in iron, steel, and even plasteel. The thermite burning bar inflicts Fire Damage with a DV of 10P. It has to be set carefully, so a thermite bar can't be used as a weapon, unless your target is incapacitated somehow, you cruel fragger.
item.thermit_burning_bar.wifi=The burning bar can be activated and deactivated wirelessly.
item.chemsuit.desc=This impermeable coverall is worn over clothes or armor and provides chemical protection (Chemical Protection, p. 266). It is not to be confused with a full hazmat suit, as it is not vacuum sealed.
item.climbing_gear.desc=This is a backpack with 100 meters of rope (400-kilo test), an ascent/descent harness, gloves, carabiners, crampons, pitons, and so forth needed for assisted climbing (see Climbing, p. 93).
item.diving_gear.desc=Underwater diving gear, including a wetsuit, partial facemask with snorkel, breathing regulator, an air tank with two hours of air (additional tanks cost 50¥), and an inflatable vest for surface buoyancy. The regulator and air tank protect against Inhalation toxins just like a gas mask. The wet suit provides rating 2 Cold Resistance (p. 266).
item.flashlight.desc=By 2080, flashlights are long lasting and super bright. Flashlights are also available in low-light and infrared versions, allowing even clearer visibility for low-light and thermographic vision, respectively. A flashlight can also be mounted to a weapon's top or under-barrel mount (Accessories, p. 259).
item.gas_mask.desc=This air-supplied re-breather completely covers your face and gives you immunity to Inhalation-vector toxin attacks (see Toxins and Drugs p. 121). It comes with a one-hour clean-air supply (replacements cost 40 nuyen) and can be attached to larger air tanks. It cannot be combined with a regular respirator.
item.gas_mask.wifi=The gas mask analyzes and gives you information about the surrounding air that you're not breathing.
item.gecko_tape_gloves.desc=The outer layer of these gloves is made of a special dry adhesive that incorporates millions of fine microscopic hairs that bond to other surfaces. Individually, these bonding forces are tiny, but combined they're strong enough to attach a troll, upside down, to the ceiling. Gecko tape gloves come as a set that includes gloves, kneepads, and slip-on-soles. You get to use assisted climbing (p. 93) when you're wearing the set. Gecko tape gloves are useless when they're wet.
item.gecko_tape_gloves.wifi=The adhesive outer layer can be temporarily neutralized with a wireless signal, useful for getting the gloves on and off without getting them stuck to yourself or each other.
item.hazmat_suit.desc=The hazmat suit covers your whole body and includes an internal air tank with four hours of air. It provides you with a chemical seal (p. 266) and protects you from Contact- and Inhalation-vector toxin attacks (see Toxins and Drugs, p. 121). Hazmat suits come standard with a sensor slot, usually used for a Geiger counter (see Sensors, p. 276). The sensor is purchased separately.
item.hazmat_suit.wifi=The suit analyzes and transmits information about the environment that you're not touching or breathing.
item.light_stick.desc=Bend, snap, and shake it to produce three hours of soft chemical illumination that covers a ten-meter radius.
item.magnesium_torch.desc=Strike and activate for five minutes of bright torchlight extending out to 20 meters. Hitting someone with the end causes 3P Fire damage.
item.microflare_launcher.desc=The flare launcher shoots colored flares 200 meters into the air, illuminating an area the size of a city block for a couple of minutes and negating the advantage of poor or low lighting. If you shoot it at someone, it's an untrained skill check; the micro flare deals 3P Fire damage.
item.microflares.desc=Flare for the micro flare launcher.
item.rappelling_gloves.desc=These gloves are made of a special fabric that allows you to get a tighter grip on a grapple line, giving you a bonus Edge on all tests to hold your grip on the line. These gloves are necessary in order to use microwire or stealth rope (p. 280) without gruesomely slicing your hands apart as you slide down it.
item.respirator.desc=A respirator is a filter mask worn over the mouth and nose that protects against Inhalation-vector toxins (see Toxins and Drugs, p. 121). The respirator adds its rating as a dice pool bonus on tests to resist chemicals with an Inhalation vector.
item.survival_kit.desc=A rugged bag full of survival essentials. The bag includes a knife, lighter, matches, compass, string saw, lightweight thermal blanket, seven days' worth of soy ration bars, a water-purification unit, fishing line and a hook, and a smattering of other survival equipment.
item.grapple_gun.desc=This gun shoots a grappling hook and attached rope up to sixty meters or one hundred meters depending on the type of line. The Firearms test threshold to hit your desired target point is (Range in meters/20, rounded up). It comes equipped with an internal winch to retract the grapple or pull up small loads of up to ten kilograms. Micro rope can be fired up to 100 meters and supports a weight of up to 100 kilograms; standard and stealth ropes only reach sixty meters but can support a weight of up to 400 kilos. May be used untrained as a weapon (AR: 1, DV: 1S).
item.grapple_gun.variant.cyberware.desc=This gun shoots a grappling hook and attached rope up to sixty meters or one hundred meters depending on the type of line. The Firearms test threshold to hit your desired target point is (Range in meters/20, rounded up). It comes equipped with an internal winch to retract the grapple or pull up small loads of up to ten kilograms. Micro rope can be fired up to 100 meters and supports a weight of up to 100 kilograms; standard and stealth ropes only reach sixty meters but can support a weight of up to 400 kilos. May be used untrained as a weapon (AR: 1, DV: 1S).
item.microwire.desc=This rope is made of an extremely thin (nearly monofilament) and resilient polymer; a great length of it can be stored in a very small compartment, and it is very difficult to see (Perception threshold 6). The downside is that it can only be grabbed with special protective rappelling gloves without slicing straight through the climber's hands, inflicting 5P damage.
item.myomeric_rope.desc=Made of a special fiber, this rope's movement can be controlled remotely (over a maximum length of thirty meters). For example, the controller can wind it like a snake to reach around an obstacle or tie to a ledge. The rope moves at a rate of two meters per combat round.
item.standard_rope.desc=Standard climbing rope.
item.stealth_rope.desc=When stealth rope is touched with the catalyst stick, the chemical reaction that is triggered crumbles the rope to dust within seconds, leaving almost no trace. The catalyst stick is reusable.
item.catalyst_stick.desc=When stealth rope is touched with the catalyst stick, the chemical reaction that is triggered crumbles the rope to dust within seconds, leaving almost no trace. The catalyst stick is reusable.

