item.clothing_luxury.page=265
item.synthleather_jacket=Synthleather Jacket
item.synthleather_jacket.page=265
item.synthleather_jacket.desc=Synthleather is the norm for street types, and this type of jacket (waist-length to duster) never goes out of style. It even offers a modicum of protection.
item.actioneer_business=Actioneer business clothes
item.actioneer_business.page=265
item.actioneer_business.desc=This is the fancy armored suit popular among Mr. Johnsons, faces, and fixers looking for a little protection coupled with style. It features a concealable holster (see p. 259) in the jacket.
item.armor_clothing=Armor clothing
item.armor_clothing.page=265
item.armor_clothing.desc=Lightweight ballistic weave makes these garments almost impossible to detect as armor. It doesn’t provide as much protection as real armor, but it comes in just about any style you desire.
item.armor_jacket=Armor jacket
item.armor_jacket.page=265
item.armor_jacket.desc=Available in all manner of styles, it offers good protection without catching too much attention. But don’t think of wearing one to a social event or government building.
item.armor_vest=Armor vest
item.armor_vest.page=265
item.armor_vest.desc=A flexible-wrap vest designed to be worn under regular clothing without displaying any bulk.
item.chameleon_suit=Chameleon suit
item.chameleon_suit.page=265
item.chameleon_suit.desc=A head-to-toe suit with a ruthenium polymer coating supported by a sensor suite, allowing it to scan its surroundings and replicate the images at the proper perspectives. You gain a bonus Edge when performing Stealth tests to hide while wearing an active suit.
item.chameleon_suit.wifi=The suit also raises your Defense Rating by 2 thanks to improved hiding ability.
item.full_body_armor=Full body armor
item.full_body_armor.page=265
item.full_body_armor.desc=This armor is worn by military and security personnel around the world for heavy-duty jobs. It is styled for intimidation but includes an array of tactical holsters, pouches, and webbing for deadly efficiency. It’s going to draw attention, just so you know.<br/>\
 The suit can be modified for environmental adaptation (hot or cold environments) or chemically sealed to completely protect the wearer from toxic environments and attacks. The suit comes with a helmet with a Capacity of 6 for vision or audio enhancements.
item.full_body_armor_with_helmet=Depreciated (replace by full body armor and separate helmet)
item.full_body_armor_with_helmet.page=265
item.full_body_armor_with_helmet.desc=This armor is worn by military and security personnel around the world for heavy-duty jobs. It is styled for intimidation but includes an array of tactical holsters, pouches, and webbing for deadly efficiency. It’s going to draw attention, just so you know.<br/>\
 The suit can be modified for environmental adaptation (hot or cold environments) or chemically sealed to completely protect the wearer from toxic environments and attacks. The suit comes with a helmet with a Capacity of 6 for vision or audio enhancements.
item.full_body_armor_helmet=Full body armor helmet
item.full_body_armor_helmet.page=265
item.lined_coat=Lined coat
item.lined_coat.page=265
item.lined_coat.desc=This cowboy-style duster has been consistently popular on the mean streets of the world’s sprawls for the past fifty years. Besides being protective, the armored trenchcoat provides a bonus Edge against tests to spot items hidden underneath.
item.urban_explorer_jumpsuit=Urban Explorer jumpsuit
item.urban_explorer_jumpsuit.page=265
item.urban_explorer_jumpsuit.desc=Designed for couriers, athletes, and freerunners, this is the armored version of “flats” but available

item.feedback_feature=Feedback Feature
item.feedback_feature.page=265
item.feedback_feature.desc=This haptic clothing allows for a tactile component to an augmented reality experience.
item.electrochromic_feature=Electrochromic Feature
item.electrochromic_feature.page=265
item.electrochromic_feature.desc=Electrochromic threads can change color with voltage, letting you alter the color of your clothing or display text, images, or patterns. This is good for fashion, but great for vanishing into a crowd if you need a quick costume change. You can even get armored clothing in electrochromic styles. It takes a Minor Action to change the settings on your electrochromic clothes, but two combat rounds to complete the change.
item.electrochromic_feature.wifi=You gain a free Minor Action during any turn when you change your clothes� settings, and your clothing can display images, text files, or video from your commlink.
item.chemical_protection=Chemical Protection
item.chemical_protection.page=266
item.chemical_protection.desc=This modification protects the wearer against Contact-vector chemical attacks (<b>Toxins and Drugs</b>, p. 121). The special coating neutralizes the Corrosive status for a number of attacks equal to its rating.
item.chemical_seal=Chemical Seal (needs matching helmet)
item.chemical_seal.page=266
item.chemical_seal.desc=Available only with full body armor, the chemical seal is an airtight environmental control that takes a Major Action to activate. It prevents the effects of all statuses connected to Contact- and Inhalation-vector chemicals but can only be used for a total of an hour at a time due to the air supply. It also neutralizes the Corrosive status six times before it’s built in chemical protection is worn away and the armor no longer has chemical seal protection.
item.chemical_seal.wifi=Activating the chemical seal is a Minor Action.
item.cold_resistance=Cold Resistance
item.cold_resistance.page=266
item.cold_resistance.desc=Thermal fibers and heat-retentive materials protect the wearer. The armor cancels the Chilled status a number of times equal to its rating. Once it has resisted the Chilled status a number of times equal to its rating, it is worn away, and the armor no longer has cold resistance.
item.fire_resistance=Fire Resistance
item.fire_resistance.page=266
item.fire_resistance.desc=Fire-retardant, nonflammable materials protect the wearer. The armor cancels the Burning status a number of times equal to its rating. Past that point, it is worn away, and the armor no longer has fire resistance.
item.electricity_resistance=Electricity Resistance
item.electricity_resistance.page=266
item.electricity_resistance.desc=Electrical insulation and non-conductive materials protect the wearer. The armor cancels the Zapped status a number of times equal to its rating. Once it has been Zapped a number of times equal to its rating, it is worn away, and the armor no longer has electricity resistance.

item.helmet=Helmet
item.helmet.page=266
item.helmet.desc=Helmets come in a wide variety of shapes and sizes and protect your noggin from trauma. Helmets have Capacity that is usable for accessories such as trode nets and vision enhancements.
item.ballistic_shield=Ballistic shield
item.ballistic_shield.page=266
item.ballistic_shield.desc=The impressive black shield used by SWAT teams and in urban combat. It features a clear plasteel window and a built-in ladder frame along the inside so that it can be used to climb over short obstacles.
item.ballistic_shield_weapon=Ballistic shield
item.ballistic_shield_weapon.page=266
item.riot_shield=Riot shield
item.riot_shield.page=266
item.riot_shield.desc=The clear plasteel cousin of the ballistic shield, this one adds an electricity attack option. Use the Close Combat skill for the attack and attack characteristics of a Stun Baton. The taser shield holds 10 charges; when attached to a power point, it regains one charge per 10 seconds.
item.riot_shield.wifi=The riot shield recharges by induction, recharging one charge per hour.
item.riot_shield_weapon=Riot shield
item.riot_shield_weapon.page=266

