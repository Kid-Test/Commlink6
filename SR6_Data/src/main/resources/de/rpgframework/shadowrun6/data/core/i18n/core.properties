skill.athletics.skillspec.sprinting=Sprinting
skill.athletics.skillspec.swimming=Swimming
skill.athletics.skillspec.throwing=Throwing
skill.biotech=Biotech
skill.biotech.page=94
skill.biotech.desc=This skill is for characters who know metahuman biology. In the Sixth World, that also means knowing how different augmentations and gear interact with it. This skill is used in First Aid tests (p. 119) and Healing tests (p. 120), and it also can be used when analyzing and repairing cyberware, bioware, and other augmentations. Another use is installing cyberware, but not other kinds of ’ware.<br/><br/><b>Primary Linked Attribute</b>: Logic<br/><b>Secondary Linked Attribute</b>: Intuition (this is rarely used—it is applied when characters try to do something that is not exactly by the books)
skill.biotech.skillspec.biotechnology=Biotechnology
skill.biotech.skillspec.cybertechnology=Cybertechnology
skill.biotech.skillspec.first_aid=First Aid
skill.biotech.skillspec.medicine=Medicine
skill.close_combat=Close Combat
skill.close_combat.page=94
skill.close_combat.desc=Are you near someone? Are you trying to hurt them? Then use this skill! Whether you’re punching, stabbing, clubbing, or whatever, roll Close Combat + Agility vs. Reaction + Intuition (Athletics can be added for Dodge; see p. 43)<br/>Base Unarmed damage is 2S. Full details on Combat are in the Combat chapter (p. 104).<br/><br/><b>Linked Attribute</b>: Agility
