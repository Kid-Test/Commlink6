item.lock.desc=Metal keys, tumblers, and a whole lot of confusion for that hacker holding a sequencer in their hand. Key and combination locks are old-fashioned and used where tech hasn't advanced or the bosses are penny pinchers, and they are a relic of the past kept around because they're cheap. To bypass a key lock, make an Engineering + Agility (Rating) test. They have a rating between 1 and 6.
item.maglock.desc=Maglocks are electronic locks sealed with electromagnets with a variety of access control options, including biometrics, keycards, passcards, and RFIDs. For more information about maglocks and their options, see Maglocks, p. 241. They have a rating between 1 and 9.
item.metal_restraints.desc=Standard metal restraints (Structure 10) come with a mechanical or a wireless-controlled lock (Barriers, p. 111).
item.plasteel_restraints.desc=Modern plasteel restraints (Structure 12) are flash-fused and remain in place until the subject is cut free.
item.plastic_straps.desc=Disposable plastic straps (Structure 6) are lightweight and easy to carry in bundles.
item.containment_manacles.desc=Containment manacles are metal (Structure 10) and attached to a prisoner's wrists and ankles to prevent them from moving faster than a shuffle (two-meter Move, three-meter Sprint) or extending a cyber-implant weapon.
item.keypad.desc=Keypads can be part of maglocks.
item.card_reader.desc=Card readers can be part of maglocks.
item.autopicker.desc=This lockpick gun is a quick and effective way of bypassing mechanical locks. The autopicker lets you add +1 as a dice pool modifier to your test when picking a mechanical lock.
item.cellular_glove_molder.desc=This device will take a finger or palm print and mold a "sleeve” you can wear to mimic the print to fool some biometric locks (see Maglocks, p. 241).
item.chisel.desc=This large sturdy slab of metal doubles your effective Strength when you're forcing a door, lock, or container.
item.keycard_copier.desc=The keycard copier allows the user to copy a keycard in seconds. A new keycard can then be manufactured with an Electronics Kit and an Electronics + Logic (2, 10 minutes) test. The keycard passes for the original, but some security systems may note the unusual usage of duplicate keys, like when "Dr. Scientist” accesses a lab that he just accessed and hasn't left yet.
item.lockpick_set.desc=These mechanical burglary devices have undergone only slight improvements in the last several centuries. They are necessary tools for picking mechanical locks, unless using an autopicker.
item.maglock_passkey.desc=This maglock "skeleton key” can be inserted into any cardreader's maglock, cleverly fooling it into believing that a legitimate passkey has been swiped. See Maglocks, p. 241.
item.maglock_passkey.wifi=The passkey receives a +1 bonus to its rating.
item.miniwelder.desc=This portable device creates a small electric arc to melt metals, either to cut through metal or to weld it together. Its power supply allows it to operate for thirty minutes. While creating an intense heat, the arc is much too small to make a good weapon (it would be like trying to stab someone with a lighter). The miniwelder has a Damage Value of 6 when used to cut through barriers.
item.miniwelder_fuel.desc=Fuel tank for the mini welder.
item.monofilament_chainsaw.desc=The teeth on the chain of this portable motorized saw are topped with monofilament wire. Ideal for cutting through trees, doors, and other immovable objects. A monofilament chainsaw isn't designed to make a good melee weapon, and there is no skill for it. When used against barriers, treat the monofilament chainsaw as having a Damage Value of 8.
item.sequencer.desc=An electronic device required to defeat keypad-maglocks. See Maglocks, p. 241.
item.sequencer.wifi=The sequencer receives a +1 bonus to its Rating.

