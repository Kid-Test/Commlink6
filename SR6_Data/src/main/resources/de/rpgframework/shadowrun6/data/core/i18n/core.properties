item.directional_microphone.desc=This lets you listen in on conversations up to one hundred meters away. The mic needs to be pointed at the desired eavesdropping target, and solid objects or loud sounds along the line of eavesdropping interfere.
item.earbuds.desc=These ergonomic earplugs are hard to spot and harder still to differentiate from the standard kind that comes with every music player and commlink.
item.headphones.desc=A full headset with an adjustable headband strap. Their bulk allows them to pack more Capacity.
item.laser_microphone.desc=This sensor bounces a laser against a thin, solid object like a windowpane, reads the vibrations on the surface, and translates them into the sounds that are occurring on the other side of the surface. Maximum range is one hundred meters.
item.omni_directional_microphone.desc=A standard audio pickup device that is usually incorporated into, connected to, or wirelessly linked with a commlink or other recording device. Micro versions are available at Capacity 1 only and have a maximum range of 5 meters.

item.audio_enhancement.desc=Audio enhancement allows the user to hear a broader spectrum of frequencies, including high and low frequencies outside the normal metahuman audible spectrum. The user also experiences fine discrimination of nuances and can block out distracting background noise. This system gives a +1 dice pool bonus to all aural Perception tests.
item.select_sound_filter.desc=This system blocks out background noise and can focus on specific sounds or patterns of sounds. It even includes speech, word, and sound pattern recognition. The system can load a number of select sounds up to its rating (such as the footsteps of a patrolling guard, a particular word, or the rotors of a distant helicopter). You only actively listen to one group at a time, but you can record the others for later playback or set them to trigger an alert if they are activated. The system can have a rating of 1 to 3.
item.spatial_recognizer.desc=This hearing accessory pinpoints the source of a sound. You get a bonus Edge on your Perception tests to find the source of a specific sound, but if you do not spend the Edge immediately, it goes away.
item.spatial_recognizer.wifi=You get a +1 dice pool modifier to your audio Perception Tests when looking for a sound's source. This can be combined with other dice pool modifiers.

item.audio_enhancement.variant.cyberear.desc=Audio enhancement allows the user to hear a broader spectrum of frequencies, including high and low frequencies outside the normal metahuman audible spectrum. The user also experiences fine discrimination of nuances and can block out distracting background noise. This system gives a +1 dice pool bonus to all aural Perception tests.
item.select_sound_filter.variant.cyberear.desc=This system blocks out background noise and can focus on specific sounds or patterns of sounds. It even includes speech, word, and sound pattern recognition. The system can load a number of select sounds up to its rating (such as the footsteps of a patrolling guard, a particular word, or the rotors of a distant helicopter). You only actively listen to one group at a time, but you can record the others for later playback or set them to trigger an alert if they are activated. The system can have a rating of 1 to 3.
item.spatial_recognizer.variant.cyberear.desc=This hearing accessory pinpoints the source of a sound. You get a bonus Edge on your Perception tests to find the source of a specific sound, but if you do not spend the Edge immediately, it goes away.

item.audio_enhancement.variant.bodyware.desc=Audio enhancement allows the user to hear a broader spectrum of frequencies, including high and low frequencies outside the normal metahuman audible spectrum. The user also experiences fine discrimination of nuances and can block out distracting background noise. This system gives a +1 dice pool bonus to all aural Perception tests.
