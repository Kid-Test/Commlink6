item.credstick_ebony=Credstick Ebony
item.credstick_ebony.page=272
item.credstick_ebony.desc=Untraceable funds for the late twenty-first century. A certified credstick is not registered to any specific person. The funds encoded on it belong to the holder, requiring no special ID or authorization to use, which means they can be stolen, but who’s going to mug a runner? To use them, you have to slot them into a universal data connector to transfer cash onto or off of them. This makes them enduringly popular with shadowrunners and the Mr. Johnsons who love to hire them. <br/>Each color of credstick can only hold up to a certain amount of money. This figure is the maximum amount the stick can be loaded with, not the amount it always has on it. The only external identifier of a type of stick is a narrow band on the case, which is often scraped off on the streets to hide the type of stick during transactions.
item.fake_sin=Fake SIN
item.fake_sin.page=272
item.fake_sin.desc=Getting by without a SIN can be a pain, so most runners settle for the next best thing: a fake. High quality fakes are difficult for the Man to spot; low quality fakes are … less good. The rating of the fake SIN is used in tests against verification systems, and SINs are available in ratings from 1 to 6.<br/>Just like a real SIN, anytime you use a fake SIN for legitimate activity, you leave a datatrail in your wake. The fact that criminal activities can be tracked to fake SINs makes fake SINs inherently disposable. Most runners operate two or more fake SINs at a time—one for legal activity like paying rent and going shopping, another for shadier activity, and possibly a third to be used only when it’s time to get the hell outta Dodge.
item.kit=Kit
item.kit.page=273
item.kit.desc=A kit is portable and contains the basic gear to make standard repairs. Without at least a kit in the field, a skill may not be able to be used actively.
item.shop=Shop
item.shop.page=273
item.shop.desc=A shop is transportable in the back of a van and contains more advanced tools for building and repairing. A shop offers a +1 dice pool modifier for appropriate tests on site. Shops are stocked with standard spare parts.
item.facility=Facility
item.facility.page=273
item.facility.desc=A facility needs a building and is immobile because of the bulky and heavy machines involved, but it can be used for very advanced constructions and modifications. A facility offers the same bonus and parts as a shop, as well as a bonus Edge, and Edge can be used for Extended tests within the appropriate facility.

