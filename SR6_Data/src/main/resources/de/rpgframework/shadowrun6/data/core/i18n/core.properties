item.stun_grenade.desc=Often called flash-bangs, these grenades explode to create a bright, loud, shocking blast that stuns and staggers anyone in their range. Along with the damage, those in the Blast of a Stun grenade suffer the Blinded I, Deafened I, and Dazed Status Effect.
item.fragmentation_grenade.desc=The classic grenade, designed to launch deadly shrapnel over a large area.
item.high_explosive_grenade.desc=These grenades are designed to deliver a powerful blast but over a smaller space.
item.gas_grenade.desc=Any chemical or toxin payload can be chosen (Toxins and Drugs, p. 121). The cloud lasts for approximately 10 combat rounds, based on the Gas Attack rules, p. 116.
item.smoke_grenade.desc=Similar to the gas grenade, a smoke grenade releases a cloud of smoke instead of toxic gas. The cloud obscures vision, inflicting the Blinded I Status for anyone acting through the smoke and Blinded II for anyone trying to act from within the smoke. The cloud lasts for approximately 10 combat rounds based on the Gas Attack rules, p. 116. Normal smoke grenades affect normal vision and low light vision.
item.smoke_grenade_thermal.desc=Similar to the gas grenade, a smoke grenade releases a cloud of smoke instead of toxic gas. The cloud obscures vision, inflicting the Blinded I Status for anyone acting through the smoke and Blinded II for anyone trying to act from within the smoke. The cloud lasts for approximately 10 combat rounds based on the Gas Attack rules, p. 116. Thermal smoke grenades affect normal vision, low light vision and infrared vision.

