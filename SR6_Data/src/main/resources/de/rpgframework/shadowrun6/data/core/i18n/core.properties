mentorspirit.bear.desc=This mentor symbolizes strength and protection. He is a healer and cannot turn down those in need without good reason, and he defends those under his care. Bear also has a fierce side; he is a dedicated protector, disregarding his own safety in combat if wounded or if someone he is protecting is injured.<br/>Similar Archetypes: Strength, Protection<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for tests to resist damage (not including drain)<br/>\
 Magician: Edge Boosts cost 1 less for Health spells, preparations, and Health spell rituals<br/>\
 Adept: 1 free level of Rapid Healing
mentorspirit.bear.disadvantage=You might go berserk when you take Physical damage in combat or if someone under your care is badly injured. Make a <b>Charisma + Willpower Test</b> (wound modifiers apply). You go berserk for 3 combat rounds minus 1 round per hit, so 3 or more hits averts the berserk rage entirely. If you’re already going berserk, increase the duration. When you’re berserk, you go after your attackers without regard for your own safety. If you incapacitate the targets before the time is up, the berserk fury dissipates.
mentorspirit.cat.desc=Cat is honored in cultures around the world. Cat is often seen as the guardian of mystical secrets, including those involving the afterlife. She knows many secrets but rarely shares them, and never with anyone who is not worthy (according to her own definition of worthiness). She is stealthy, sly, and arrogant. Cat toys with her prey—threatening, taunting, and confusing her targets—rather than going directly for the kill.<br/>Similar Archetypes: Mystery, Stealth<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Athletics or Stealth tests (choose one)<br/>\
 Magician: Edge Boosts cost 1 less for spells, preparations, and spell rituals in the Illusion category<br/>\
 Adept: Traceless Walk power for free
mentorspirit.cat.disadvantage=Cat magicians toy with their prey. Unless you succeed in a Willpower + Charisma (3) test at the start of combat, you cannot make an attack that incapacitates your target. If you take any Physical damage, all this playing around stops.
mentorspirit.coyote.desc=Coyote is the master of tricks, the spirit who is never where you are looking for her and always one step ahead of you. Her best tricks are the ones you never knew she pulled, perfect cons where the mark just feels like the victim of bad luck and doesn’t know how badly they got taken. Coyote’s tricks aren’t necessarily malicious, but they also aren’t necessarily innocent. They are what she needs them to be, and her bag of tricks is bottomless.<br/>Similar Archetypes: Deception, Mischief<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Con tests<br/>\
 Magician: Edge Boosts cost 1 less for spells, preparations, and spell rituals in the Manipulation category<br/>\
 Adept: Free Vocal Control power
mentorspirit.coyote.disadvantage=You must make a Willpower + Charisma (3) test to avoid exploiting someone else’s misfortune to your own advantage or to pull a clever trick or prank even if it’s to the disadvantage of your friends.
mentorspirit.dog.desc=Dog is a loyal friend. She fights ferociously to defend her home and those under her protection. Dog protects people from harmful magic and dangerous spirits. Dog is loyal, generous, and helpful to those who show her kindness. She is single-minded, often to the point of stubbornness.<br/>Similar Archetypes: Friendship, Loyalty<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Outdoors tests<br/>\
 Magician: Edge Boosts cost 1 less for Detection spells, preparations, and rituals<br/>\
 Adept: 2 free Improved Sense powers
mentorspirit.dog.disadvantage=A Dog magician is stubbornly loyal. You can never leave someone behind, betray your comrades, or let another sacrifice themselves in your place without making a successful Willpower + Charisma (3) test.
mentorspirit.dragonslayer.desc=This most heroic of mentor spirits is also the most fun-loving. Though she fights to protect her own against all dangers, she loves a good party even more. She is a big sister who takes a friendly interest in everything her family does. Though sometimes na�ve, she makes a staunch friend and a deadly enemy. The dragons she slays have changed with the times: current beasts include crime, pollution, corruption, and of course, actual dragons. Dragonslayer fights hard and plays hard. Once she has given her oath, she never breaks it. A Dragonslayer magician behaves with honor and respect and demands the same from those around them.<br/>Similar Archetypes: Heroism, Adventure<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Influence tests<br/>\
 Magician: Edge Boosts cost 1 less for Combat spells, preparations, and rituals<br/>\
 Adept: Danger Sense power for free
mentorspirit.dragonslayer.disadvantage=If you break a promise, whether by choice or by accident, you take a –1 dice pool modifier to all actions until you make good on your promise.
mentorspirit.eagle.desc=Eagle is a high-flying bird, considered the most noble by many cultures. He is proud and solitary, and he sees everything happening in the world below. Eagles are noble defenders of the purity of nature. They are intolerant of those who do not share their views and have a strong distrust of technology and its tools. Those who damage nature are Eagle's enemies, and Eagle will brave great danger to defeat polluters and other evildoers.<br/>Similar Archetypes: Nature, Warding<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Perception tests<br/>\
 Magician: Edge Boosts cost 1 less for summoning spirits of air<br/>\
 Adept: 1 free level of Combat Sense
mentorspirit.eagle.disadvantage=You get the Allergy (pollutants, mild) quality (p. 74; no bonus Karma for this negative quality).
mentorspirit.firebringer.desc=The Fire-Bringer stole the secret of fire from the heavens and gave it to metahumanity as a gift and a tool. He is a figure of kindness and concern, but his good intentions sometimes get him into trouble and his plans may fail to work out the way he envisions them. He is a shaper and a creator, forming new things from the primal clay and breathing the fiery spark of life into them. Fire-Bringers devote themselves to the betterment of others, even at their own expense. Most followers of Fire-Bringer throw themselves into a particular cause with great zeal.<br/>Similar Archetypes: Invention, Generosity<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Engineering skill tests or Enchanting skill tests (choose one)<br/>\
 Magician: Edge Boosts cost 1 less for spells, preparations, and spell rituals in the Manipulation category<br/>\
 Adept: 1 free level of Improved Ability on a non-combat skill
mentorspirit.firebringer.disadvantage=When someone sincerely asks you for help, you can't refuse without succeeding in a Willpower + Charisma (3) test.
mentorspirit.mountain.desc=Mountain is rooted in the very heart of the Earth but reaches toward lofty heights. She has limitless strength and endurance, but Mountain's inflexible nature limits her. Mountain is a stubborn and unyielding force, and Mountain magicians are difficult to persuade once they have made up their minds about something.<br/>Similar Archetypes: Endurance, Stubbornness<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Outdoors tests<br/>\
 Magician: Edge Boosts cost 1 less for Counterspelling tests and anchored rituals<br/>\
 Adept: 2 free levels of Mystic Armor
mentorspirit.mountain.disadvantage=When a Mountain magician makes a plan, she sticks to it. You must make a Willpower + Charisma (3) test to abandon a planned course of action in favor of a new one. If you fail, you must endeavor to continue with your original plan, even if it means going on alone. Similarly, you must succeed in a Willpower + Charisma (3) test to proceed in anything without a plan.
mentorspirit.rat.desc=Rat is found wherever humans and the things they discard are, for what other bounty can sustain him? Rat is a scavenger, a stealthy thief who takes what he needs to survive. He dislikes working out in the open, preferring to stick to the shadows. Rat avoids fights whenever he can- when he must fight, he fights to kill quickly and move on.<br/>Similar Archetypes: Survival, Scavenging<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Stealth tests<br/>\
 Magician: Edge Boosts cost 1 less for Enchanting tests when harvesting reagents, and you may use reagents of any tradition without penalty<br/>\
 Adept: 1 free level of Pain Resistance
mentorspirit.rat.disadvantage=A Rat magician must make a Willpower + Charisma (3) test to not immediately flee or seek cover whenever caught in a combat situation. If there is nowhere to flee, they are forced to fight.
mentorspirit.sea.desc=Sea is the birthplace of all living creatures. She is unfathomable and moody, tranquil and comforting one moment, fearsome and destructive the next. Though she possesses great wealth, she jealously guards what comes into her hands. Sea can be a powerful ally, but she must be courted with great care.<br/>Similar Archetypes: Chaos, Greed <br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Athletics tests involving swimming, increase base swimming rate by 1 meter/combat round<br/>\
 Magician: Edge Boosts cost 1 less for summoning spirits of water<br/>\
 Adept: 1 free level of Improved Ability for the Athletics skill
mentorspirit.sea.disadvantage=You must make a Willpower + Charisma (3) test to give away something you own or be charitable in some way.
mentorspirit.seducer.desc=The Seducer is the incarnation of desire. He
has many whims and vices that he must frequently satisfy. He encourages jealousy and greed, and he seeks to inflame the wants of others. He avoids direct confrontation but gains pleasure when others fight for his attention or on his behalf. He exists to exploit weaknesses and will not hesitate to sacrifice those who get in his way.<br/>Similar Archetypes: Seductress, Temptation<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Con tests<br/>\
 Magician: Edge Boosts cost 1 less for spells, preparations, and spell rituals in the Illusion category<br/>\
 Adept: 1 free level of Improved Ability for either Con or Influence (choose when mentor spirit is selected)
mentorspirit.seducer.disadvantage=You must succeed in a Willpower + Charisma (3) test to avoid pursuing a vice or indulgence (drugs, BTLs, sex, and so on) when it is made available.
mentorspirit.shark.desc=Shark is a cold and relentless hunter. His power is known to all who live near the sea. When Shark strikes, he does so without mercy, driven into a frenzy by the blood of his prey. Shark magicians tend to be wanderers, always on the move. They are fierce and deadly warriors. A Shark magician believes the only good enemy is a dead enemy. If challenged, he does not waste time with threats or boasts-he strikes to kill.<br/>Similar Archetypes: Hunger, Violence<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Close Combat tests with blades or unarmed<br/>\
 Magician: Edge Boosts cost 1 less for spells, preparations, and spell rituals in the Combat category<br/>\
 Adept: Free Killing Hands power
mentorspirit.shark.disadvantage=You might go berserk when you take Physical damage in combat. Every time it happens, make a Willpower + Charisma test (wound modifiers apply). You go berserk for 3 combat rounds minus 1 turn per hit, so 3 or more hits averts the berserk rage entirely. If you're already berserk, increase the duration. When you're berserk, you go after your attackers without regard for your own safety. If you run out of targets before the time's up, you keep attacking their bodies.
mentorspirit.snake.desc=Snake is wise and knows many secrets. She is a good counselor, but she always exacts a price for her advice. Snake followers fight only to protect themselves and others. They are obsessed with learning secrets and take great risks in order to do so. They trade their knowledge to others for whatever they can get in exchange.<br/>Similar Archetypes: Knowledge, Curiosity<br/>\
 <b>Advantages</b><br/>\
 All: Pick 2 free magic-related Knowledge skills<br/>\
 Magician: Edge Boosts cost 1 less for spells, preparations, and spell rituals in the Detection category<br/>\
 Adept: Free Kinesics power
mentorspirit.snake.disadvantage=You must succeed in a Willpower + Charisma (3) test to avoid pursuing secrets or knowledge that few people know about when you receive hints of its existence.
mentorspirit.thunderbird.desc=Thunderbird is a majestic creature who is storm incarnate. Her wings are dark clouds, her beak and claws lightning, and her cries the clap of thunder. She is a primal force, often savage but necessary to the survival of the land and the continuation of the cycle of life. Thunderbird is a force to be respected and approached with great care, lest her anger be roused.<br/>Similar Archetypes: Anger, War<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Influence tests<br/>\
 Magician: Edge Boosts cost 1 less for summoning spirits of air<br/>\
 Adept: 1 free level of Critical Strike
mentorspirit.thunderbird.disadvantage=A Thunderbird magician must succeed in a Willpower + Charisma (3) test to avoid responding to an insult in kind.
mentorspirit.wise_warrior.desc=The Wise Warrior is skilled in the art of war, for battle is an art to her, an exercise in the powers of the mind as well as the body. She studies the tactics of her foes and overcomes them through a combination of superior strategy and battle prowess. The Wise Warrior does not act out of savagery or battle-lust, but from a position of knowledge and wisdom. Wise Warriors must follow the warrior's code of honor and conduct themselves properly or risk the loss of favor.<br/>Similar Archetypes: Duty, Wisdom<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Influence tests<br/>\
 Magician: Edge Boosts cost 1 less for spells, preparations, and spell rituals in the Combat category<br/>\
 Adept: 1 free level of Improved Ability on a Combat skill
mentorspirit.wise_warrior.disadvantage=If you act dishonorably or without courtesy, whether by choice or by accident, you take a -1 dice pool modifier to all actions until you atone for your behavior.
mentorspirit.wolf.desc=Wolf is recognized as a hunter and warrior worldwide. He is devoted to the other members of his pack. As the ancient saying goes, Wolf wins every fight but one-the one that kills him. Wolf magicians are loyal to friends and family unto death. They do not show cowardice in battle, and their word is their bond.<br/>Similar Archetypes: Fellowship, Hunting<br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Counterspelling tests<br/>\
 Magician: Edge Boosts cost 1 less for spells, preparations, and rituals in the Combat category<br/>\
 Adept: 2 free levels of Attribute Boost (Agility)
mentorspirit.wolf.disadvantage=You must succeed in a Willpower + Charisma (3) test to retreat from a fight.

#Metatypes
metatype.dwarf = Dwarf
metatype.dwarf.page = 53
metatype.dwarf.desc =<b> • Average height:</b> 1.2 meters<br/>\
 <b>• Average weight:</b> 54 kg<br/>\
 <b>• Ears:</b> Slightly pointy<br/>\
 <b>• Known for:</b> Short size; stocky build; perseverance<br/>\
 <b>• Racial qualities:</b> Dwarfs have thermographic vision (p. 73) and toxin resistance (p. 73).<br/><br/>\
 Sixth World dwarfs are often accepted into mainstream society without being fully valued. The taller metatypes seem to be happiest when dwarfs fit the roles they have preconceived for them sidekicks, drivers, mechanics, that sort of thing. It doesn't help that their size helps them squeeze into vehicles that orks, humans, and elves might have difficulty with, ones that trolls couldn’t even consider using. Still, they get work and little direct hate. They’re treated nicely, but they can't help but feel that they’re being, well, overlooked.<br/> \
 Dwarfs across the globe are dedicated to showing that they cannot be ignored. Dwarf deckers, street samurai, covert ops specialists, faces, and more are popping up in the international shadows, and others underestimate them at their peril.<br/> \
 The lack of heightened antipathy against dwarfs helped them assimilate in human communities better than other metatypes. This means that they do not have as many of their own enclaves as some of the other metatypes (it also doesn’t help that they don’t have access to whatever stream of revenue the elves tap into build their kingdoms). With the founding of the dwarf-centric Biloxi Technical Institute, southern Mississippi in the CAS is becoming a dwarf haven. What that will grow into and how that will shape the world is anyone’s guess.
metatype.elf = Elf
metatype.elf.page = 54
metatype.elf.desc = <b>• Average height:</b> 1.9 meters<br/>\
 <b>• Average weight:</b> 80 kg<br/>\
 <b>• Ears:</b> Pointy<br/>\
 <b>• Known for:</b> Slender, lithe build; being attractive and knowing it<br/>\
 <b>• Racial qualities:</b> Elves have low-light vision (p. 72).<br/><br/>\
 Perhaps the most infuriating thing about elves to the other metatypes is that you can resent them like hell, and they just won’t care. They have two prosperous nations—T�r na n�g (formerly known as Ireland) and T�r Tairngire (in the western part of North America)—they have people in some of the most powerful positions in the world, and celebrities whose MeFeed hits are in the billions. They are envied, not looked down on.<br/>\
 But plenty of elves know that this envy does not extend to every elf. If you’re an elf who is not rich, elegant, or graceful, you’re often viewed as a failure, someone who had all the gifts of life handed to them and somehow screwed them up. And it’s not just non-elves who hold this view. Never mind that you might have grown up poor, never mind what obstacles you had to face—people think you automatically had it easy because you’re an elf. But elf society is not easy to survive. The upper crust can be absolutely ruthless about enforcing their status quo, labeling those who don’t fit as malcontents and finding ways to cast them aside. The barrens of the major sprawls of the world have plenty of elves who were thrown out because they wouldn’t cave to what society wanted them to be. Their anger could burn the whole earth.
metatype.human = Human
metatype.human.page = 55
metatype.human.desc = <b>• Average height:</b> 1.75 meters<br/>\
 <b>• Average weight:</b> 78 kg<br/>\
 <b>• Ears:</b> Rounded<br/>\
 <b>• Known for:</b> Average size; average build; freaking out about people who don’t meet their averages<br/>\
 <b>• Racial qualities:</b> Humans have no extra racial qualities.<br/><br/>\
 As the majority of the sentient beings of the world, humans create existing definitions of “normal,” and then some of them set out to abuse those definitions as hard as they can. These humans know that they lack the pure physical strength and social cohesion of some of the other metatypes, so they shape the world in a way that keeps the individuals they don’t like from ever realizing what they can do, and what they can become.<br/>\
 The side effect of this, of course, is that many humans are caught up in the demoralizing machinery that the ruling corporate class has assembled, because they don’t fit into this artificial average. They are grist for the mill, people to be chewed up and spat out in the name of greater wealth and power for the people at the top. Because they’re humans, and there are so many of them, who’s going to notice how they’re ground down, and who is going to miss them when they’re gone?<br/>\
 The shadows are full of humans who could not find a way to be normal or average.
metatype.ork = Ork
metatype.ork.page = 55
metatype.ork.desc = <b>• Average height:</b> 1.9 meters<br/>\
 <b>• Average weight:</b> 128 kg<br/>\
 <b>• Ears:</b> Pointy<br/>\
 <b>• Known for:</b> Big, powerful physique; tusks; constantly being seen as outsiders<br/>\
 <b>• Racial qualities:</b> Orks have low-light vision (p. 72) and the Built Tough (1) quality (see p. 70)<br/><br/>\
 Orks make people nervous, and people don’t like to be nervous. Their tusks, bone structure, and pointed ears mark them as something altogether else, and their strength and size clearly show the damage they could do. As humans have done for centuries, they address the thing they fear by pushing them aside, keeping orks from building collective strength, and crushing them with the sheer force of numbers.<br/>\
 That approach works as long as you can keep fear stoked and have it immobilize the masses. Because if people can move past the fear and start to understand the deliberate injustice that has been forced on some groups, they separate themselves from society’s machine, and the number of people used to enforce oppression gets smaller. Oppressors aren’t especially good at developing new solutions to such problems—they usually just resort to oppressing harder.<br/>\
 So while realization of the injustices they deal with is spreading, orks across the Sixth World are preparing for things to get worse so that they can survive and set about the work of making things better. They already have some enclaves carved out for themselves—Seattle’s Underground, Atlanta’s Sweetwater Creek, Dharavi in the Indian Union—and they hope those locales will be the starting points for societies that include orks instead of fearing them.
metatype.troll = Troll
metatype.troll.page = 56
metatype.troll.desc = <b>• Average height:</b> 2.5 meters<br/>\
<b>• Average weight:</b> 300 kg<br/>\
<b>• Ears:</b> Slightly pointy, often hidden by horns<br/>\
<b>• Known for:</b> Being so big, you guys. Just huge. And horns.<br/>\
<b>• Racial qualities:</b> Trolls have thermographic vision (p. 73), the Built Tough (2) quality (see p. 70), and dermal deposits (which provide +1 to trolls’ Defense Rating).<br/><br/>\
 It’s not easy to live in a society where you look like the walking embodiment of everyone else’s nightmares. Being two to three times as large as everyone else doesn’t help much, either. It’s not a troll’s world, and most of the other residents of the world aren’t inclined to change that fact. Who wants to make space for imposing monsters? Trolls are going to have to force their way into a place in the world—of course, when they force their way in anywhere, they’re inevitably called vandals and destroyers.<br/>\
 A significant number of trolls have looked at the way the deck is stacked against them and decided they don’t need to play the rest of the world’s game anymore. They’ll stand aside and watch the world burn—and maybe throw on an extra match every now and then. The Black Forest Troll Republic is one of the most important troll communities in the world, acting as a beacon and vision for what troll society can be while keeping a certain distance from everyone else. Whether they assimilate or build a higher wall is an open question.<br/>\
 Trolls have the most difficult time adapting to other metatypes because their bodies are so different. It’s more than just the size and the horns— they have dermal deposits all over their bodies that make knobs, bumps, and other formations. They scrape up furniture and clothing, and make some people think twice about giving a troll a big bear hug. Especially since there are few people who can wrap their arms around a whole troll.

#Magic Resonance Choices
mor.mundane=Mundane
mor.mundane.page=65
mor.mundane.desc=Choosing to be mundane means no access to Magic or Resonance. Simple as that. Your special attribute points will have to be spent elsewhere.
mor.adept=Adept
mor.adept.page=66
mor.adept.desc=Adepts focus all of their magic inward, fueling their talents with their innate ability to pull mana in rather than channel it outward. Due to this physical connection to their magic, they cannot astrally project and only gain the ability to astrally perceive through training. Adepts have a pool of points equal to their Magic that they use to purchase adept powers. For more information on adepts, see p. 156.
mor.aspectedmagician=Aspected Magician
mor.aspectedmagician.page=65
mor.aspectedmagician.desc=Aspected magicians are only able to utilize one of the three aspects of magic: spellcasting (Sorcery), summoning (Conjuring), or enchanting (Enchanting). They can access the astral plane with astral perception and projection.
mor.magician=Magician
mor.magician.page=65
mor.magician.desc=Full magicians gain access to the full range of magical abilities, spellcasting, summoning, and enchanting, as well as offering full access to the astral plane with both astral perception (p. 159) and astral projection (p. 160).
mor.mysticadept=Mystic Adept
mor.mysticadept.page=66
mor.mysticadept.desc=Mystic adepts are a blend of inward and outward magic. They are capable of casting spells, summoning spirits, and enchanting items, but they also channel a portion of their magic inward to fuel adept talents. They are not able to astrally project due to the anchoring effect of their adept powers, but they can astrally perceive. They must split their Magic between spells and adept powers.
mor.technomancer=Technomancer
mor.technomancer.page=66
mor.technomancer.desc=Technomancers have a special connection to the Matrix, which is measured in an attribute called Resonance. They have the ability to create programs and sprites on the fly along with the ability to manipulate the energies of the Matrix to bend it to their will.

