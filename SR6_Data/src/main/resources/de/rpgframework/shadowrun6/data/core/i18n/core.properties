focus.alchemical_focus.desc=An alchemical focus adds its Force in dice to Enchanting skill tests to create preparations.
focus.disenchanting_focus.desc=When a disenchanting focus is in contact with another artifact, the magician can add dice equal to its Force to the Disenchanting test.
focus.centering_focus.desc=A centering focus adds its Force to the magician's initiate grade when they use the centering metamagic on Drain Resistance tests.
focus.flexible_signature_focus.desc=A flexible signature focus adds its Force to your grade when increasing the threshold of observers' Assensing (Astral + Intuition) tests.
focus.masking_focus.desc=When resisting someone else's Assensing test, add the Force of this focus to your dice pool. It does not increase the number of bonded foci you can mask.
focus.spell_shaping_focus.desc=Treat your Magic rating as if it was increased by the Force of this focus when determining how much you can shape your spells.
focus.power_focus.desc=Power foci live up to their name. They are very powerful foci that temporarily increase your effective Magic rating. That means they add to your Sorcery dice pools whenever you use that skill, along with any other test where Magic is involved. Power foci can take any form, but for some reason, rings and amulets are quite popular.
focus.qi_focus.desc=Qi (pronounced "chee”) foci only work for adepts. They channel mana into your adept powers. A qi focus can be an object, like other foci, but it can also be worked into a body modification, like tattoos, ritual scarring, and piercings. Each focus is specific to a single adept power at a specific level. While the focus is active, you get the power contained in it, or if you already have the power, the focus' levels are added to your own (if it's a power with levels, that is; otherwise there's no benefit for you). The Force of the focus must be four times the Power Point cost of the power it holds, so a level 1 Improved Ability (Close Combat) qi focus is a Force 4 focus (since it costs 1 Power Points per level), while a Combat Sense focus is Force 2.
focus.counterspelling_focus.desc=Counterspelling foci add dice equal to their Force to any Counterspelling attempt, as long as the countered spell is in the same category as the focus. It also adds its Force as a dice pool bonus when you perform the Boosted Defense form of counterspelling (p. 143).
focus.spellcasting_focus.desc=Spellcasting foci add their Force to your Spellcasting dice pool as long as the spell is in the same category as the focus.
focus.ritualspellcasting_focus.desc=A ritual spellcasting focus adds its Force in dice to your Ritual Spellcasting Tests (whether you're the leader or a participant). If the ritual isn't a spell ritual, this focus can still be used, but if it's a spell ritu
focus.sustaining_focus.desc=When you cast a spell through a sustaining focus, it sustains the spell for you, letting you avoid the dice pool penalty for sustaining a spell. A spell sustained by a sustaining focus cannot have a modified Drain Value (after adding any effects) greater than the Force of the focus, and the spell's category must match the focus's category. If a spell sustained by a focus is disrupted, it ends, but the focus is still active (and still bound to its owner), it's just not sustaining a spell at the moment. A sustaining focus can't be used to sustain a spell ritual.
focus.summoning_focus.desc=A summoning focus adds dice equal to its Force to summoning attempts as long as the targeted spirit is in the same category as the focus.
focus.banishing_focus.desc=The banishing focus gives the character a point of Edge if its Force is higher than the spirit's Force. That point must be used on the Banishing test or it is lost.
focus.weapon_focus.desc=A weapon focus always has, unsurprisingly, the form of a melee weapon (it cannot be a ranged weapon). It adds magical power to the melee attacks you make with it. When used in physical combat, it gives you its Force as a dice-pool bonus on your Attack test. You still rely on your physical attributes and skills in combat; the weapon focus merely makes you more effective. A weapon focus is effective against astral forms too, whether you're using astral perception or projection. It adds its Force to your Astral Combat tests when you're using it, and you can take it along while astrally projecting. The damage of the weapon in astral combat is the same as it is in the physical world, except that you can decide between Stun or Physical damage (Astral Combat, p. 160).

