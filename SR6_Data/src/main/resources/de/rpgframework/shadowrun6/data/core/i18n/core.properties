item.gmc_micromachine.desc=A very sophisticated children's toy, with interchangeable bodies and oversized wheels for self-righting. Tiny, innocuous, and fun to race around a little track.
item.shiawase_kanmushi.desc=This four-legged crawler drone looks like a normal insect at a glance. Great for penetrating secure facilities with its gecko-tipped extremities and light weight. It has the problem of decreased range to minimize transmissions but offsets that with a brighter than average Pilot system. Extremely fragile, a finger or the pulse of a tag eraser will easily render it inoperable.
item.mct-sikorsky-bell_microskimmer_xxs.desc=About the size and shape of a bottlecap, the Microskimmer flies via weak hoverjets. Its larger cousins, the frisbee-sized miniskimmer and trashcan-lid-sized skimmer, have an interesting stacking feature that allow the three to be loaded into a single drone rack slot that holds the largest in the family.
item.mct_gnat.desc=Tiny and slow, but indistinguishable from an insect without a microscope or vision mag, the Gnat is often used in MCT's Zero Zones, where a swarm of them all carry DMSO/Narcoject mini-slap patches on their feet, then land en masse on a target. They're sold in packs of 10.
item.gm-nissan_flip_flop.desc=A tracked drone about the size of an RC car, the Flip-Flop's tracks are larger than the body frame and the frame has a gyroscopic center that rolls to always be upright while the Flip-Flop can tumble and roll. Great for all-terrain environments, it can still get quite a bit of speed on a straight, flat stretch of land.
item.shiawase_inu.desc=A little four-legged friend that comes with a furry suit to make it look and feel more like a real dog.
item.shiawase_inu_better_suit.desc=A little four-legged friend that comes with a furry suit to make it look and feel more like a real dog. Better suits can be bought that make it actually look like a real dog, though its movements are still a bit robotic.
item.horizon_flying_eye.desc=A spherical flying drone about the size of an eyeball, it uses omnidirectional thrust nozzles to stay aloft but can also roll on the ground. Usually used for surveillance, a version with a built-in flash-pak or smoke grenade costs an extra 500¥.
item.horizon_flying_eye.variant.grenade.desc=A spherical flying drone about the size of an eyeball, it uses omnidirectional thrust nozzles to stay aloft but can also roll on the ground. Usually used for surveillance, a version with a built-in flash-pak or smoke grenade costs an extra 500¥. The smoke grenade destroys the drone. The smoke grenade can be swapped with some other kind of grenade as well, obviously destroying the drone upon use.
item.horizon_flying_eye.variant.flash_pak.desc=A spherical flying drone about the size of an eyeball, it uses omnidirectional thrust nozzles to stay aloft but can also roll on the ground. Usually used for surveillance, a version with a built-in flash-pak or smoke grenade costs an extra 500¥. The flash-pak can be recharged as normal.
item.mct_hornet.desc=Thanks to its slightly bulkier form, the Hornet, a kin of the venerable Fly-Spy, can achieve greater altitudes and serve as an eye in the sky for runners trying to keep their intentions low-key, but who also want the option to make someone's life miserable. Usually framed like a tarantula hawk wasp, they carry an injector in the narrow abdomen with a single dose of something unpleasant (purchased separately).
item.mct_hornet.item.mct_hornet_stinger.desc=Injector in the narrow abdomen of the MCT Hornet, with a single dose of something unpleasant (purchased separately).
item.chrysler-nissan_pursuit_v.desc=This wheeled drone's design principles were low, flat, and heavy, all to allow it to run at Formula One speeds, meaning nothing can outrun it. Outdrive it, sure and outgun it, yup, but for pure speed, there is nothing with wheels that matches the Pursuit V.
item.aztechnology_crawler.desc=If you don't have a fear of insects/spiders before you see a Crawler, you will after. Designed for skittering up stairs, across floors, and through the underbrush, the Crawler is a half meter wide, multi-terrain drone with a hearty (and terrifying) design.
item.cyberspace_designs_quadrotor.desc=A small quadcopter designed for aerial surveillance and monitoring, it uses lightweight parts and a patented rotor design to get some of the highest altitude on the market. To keep the weight light, the only weapon mount it can take is an air-powered crossbow.
item.cyberspace_designs_quadrotor_crossbow.desc=Air-powered crossbow for the Cyberspace Designs Quadrotor (Projectile, DV 3P, Attack Ratings 2/10/4/2/-)
item.lockheed_optic_x2.desc=The size of a cyberdeck with its wings folded up for transport, it deploys to the size of a large hawk and launches with a simple arm toss, making it a VSTOL craft, but it can't hover. Designed for surreptitious surveillance, it's hard to track and spot, making it a favorite of shadowrunners and security firms. Design and paint increase the Perception threshold on the Optic-X2 by 1.
item.gm-nissan_dobermann.desc=A tracked perimeter-patrol drone designed for day or night conditions with its solid sensor suite, it is useful but unsuited for stairs. They come with a standard weapon mount.
item.spurs_samurai_oni.desc=Spurs of the Nissan Samurai or Oni drones.
item.nissan_samurai.desc=Two legs are not better than four when talking drone design. The Nissan Shogun first took the niche fame of the Ares Duelist and made a design far superior, though still limited by its metahuman-like frame, but the Samurai and Oni blended metahuman with…well, something else. The Samurai falls in the medium-size category. It is specifically outfitted when ordered from Nissan with a quartet of retractable blades on the arms and heels, and each arm has a standard weapon mount. Each of the Samurai's arms can fit something SMG size or smaller with fifty rounds of ammo. The big design advantage comes in terms of speed, but it sacrifices some combat ability. These designs can bend for four-limbed movement but lose access to all weapons while doing so.
item.mct-nissan_roto_drone.desc=MCT-Nissan got this right so long ago, they have never changed it much. It has a rotor top over a lower body designed for customization and easy repurposing. A camera drone can be swapped into an assault drone in under one minute. Treat its Body as 3 higher than its actual rating for determining how many weapon mounts or customizations it can integrate.
item.federated-boeing_blackhawk.desc=It ain't pretty, but it does its job well, and that job is removing other aerial threats from the area of operations. Popular with Desert Wars teams, the Blackhawk is an attack drone. The small profile limits speed but makes it a hard target to tag. They tend to fly in "packs", orchestrating their fields of fire to leave no escape (count their number as 1.5 times larger for grunt group attacks, and players can use the grunt attack style described on p. 114 against the threat).
item.steel_lynx_combat_drone.desc=This is what people mean when they refer to a "killing machine". The Steel Lynx is armed and armored to the teeth, rolling wheeled death across the field on four telescoping wheeled limbs allowing it to pop and shoot over cover. You gain a bonus Minor Action when using the Take Cover Minor Action.
item.ares_packmule.desc=Jokingly referred to as the "Hauling Ass", the Packmule is a four-legged cargo hauler intended for rough terrain where roads are rare and airspace is dangerous. Spec-ops teams will often ditch a centerline of pack boxes for a gyro arm under an HMG used as a turret by the team's support specialist.
item.cyberspace_designs_dalmatian.desc=Able to be folded down to lawn-mower size, this VTOL recon drone is easy to haul behind enemy lines. It deploys to hang-glider size and is frequently spotted over urban and rural locations that have contracts with Lone Star or Knight Errant, as they use them for patrol and surveillance.
item.ares_black_sky.desc=A black project for the longest time, the Black Sky moved toward full production after field tests during the Boston lockdown were a stellar success. This drone is Ares' latest in stealth air-to-ground support. Able to drop supplies or rain down hell with minimal chance for detection, the Black Sky will definitely be finding its way into the regular rotation for runners and smugglers alike.
item.nissan_oni.desc=Two legs are not better than four when talking drone design. The Nissan Shogun first took the niche fame of the Ares Duelist and made a design far superior, though still limited by its metahuman-like frame, but the Samurai and Oni blended metahuman with…well, something else. The Oni falls in the large-size category. It is specifically outfitted when ordered from Nissan with a quartet of retractable blades on the arms and heels, and each arm has a standard weapon mount. Each of the Oni's arms can hold a rifle and one hundred rounds in each arm. The big design advantage comes in terms of speed, but it sacrifices some combat ability. These designs can bend for four-limbed movement but lose access to all weapons while doing so.

