ammotype.regular.desc=Classic ball or full metal jacket slugs.
ammotype.apds.desc=Armor-piercing discarding sabot is a mouthful, which is why the APDS acronym is used so frequently. The sabot allows for high muzzle velocities pushing an ultra-hard penetrator designed to punch through armor. APDS is rarely made caseless because the sabot shells are left lying around anyway.
ammotype.explosive.desc=These slugs carry a shaped-charge explosive. Explosive rounds misfire whenever you roll a critical glitch. When this happens, the attacker must resist damage equal to the Damage Value done by the weapon (and don't forget the modifier for the explosive rounds). Naturally, the attack misses its intended target, and the weapon firing the bullets is destroyed.
ammotype.flechette.desc=The payload of a flechette (fl) round is made up of tiny, tightly packed fin-stabilized metal slivers or metal balls (depending on the weapon). They have some spread, making them more likely to catch a soft spot, but they're small compared to other ammo, delivering less kinetic energy to the target.
ammotype.gel.desc=These gel-ball rounds look like flattened blueberries on impact. Generally used for riot control or non-lethal subdual, they're great for knocking a target on their hoop, though you shouldn't expect that to work on trolls. Gel rounds inflict Stun damage. A target struck by a gel round must succeed at an immediate Agility (2) or Body (4) test (player's choice) or gain the Prone status (p. 53). Burst Fire and Full Auto increase the threshold to avoid being knocked down by 1.
ammotype.stick_n_shock.desc=Stick-n-Shock rounds make any regular weapon a taser. They deal Stun damage and apply the Zapped status but don't carry the punch of the regular round.

