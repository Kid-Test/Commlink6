item.meta_link.desc=Commlinks are universal communication devices used by virtually everyone all the time. They come in a variety of shapes and styles, with some included in augmentations and articles of clothing. Even the most basic of them include AR Matrix browsing capability, telephone, vidphone, text, music players, micro trid-projectors, touchscreen displays, high-resolution video and still-image cameras, image/text and RFID tag scanners, builtin GPS guidance systems, chip players, credstick
