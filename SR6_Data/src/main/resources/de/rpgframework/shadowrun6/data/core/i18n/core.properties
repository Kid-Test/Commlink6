skill.close_combat.skillspec.clubs=Clubs
skill.close_combat.skillspec.unarmed=Unarmed Combat
skill.close_combat.skillspec.unarmed.short=Unarmed
skill.con=Con
skill.con.page=94
skill.con.desc=The key aspect of this skill is persuasion where you act as someone or something you’re not. Maybe you’re acting like the long-lost heir to a portion of Dunkelzahn’s hoard, or maybe you’re pretending to be a down-on-their-luck business suit looking to make a big score to launch them back to the top. Whatever the case may be, Con is the skill you use to convince other people that you are something you are not.<br/><br/><b>Linked Attribute:</b> Charisma
