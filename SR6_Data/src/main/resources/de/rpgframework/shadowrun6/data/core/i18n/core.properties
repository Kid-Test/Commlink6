item.flash_pak.desc=This is an electronic box, ten centimeters by ten centimeters on its face and two centimeters thick, containing a set of micro-flashes on each side designed to fire in random strobing sequence to confuse opponents. Anyone in the range of a flash-pak and using standard vision receives the Blinded status (p. 51) indicated in the DV chart on all tests that include vision due to the strobe effect. Using low-light causes the status to shift up one level. Flare compensation drops the status down one level. The flash-pak has ten charges and uses one charge per combat round. Plugged in, it recharges one charge every ten seconds.
item.flash_pak.wifi=The strobe sequence can avoid directing strong flashes at the subscribed character, preventing any Status Effect for them. The device can recharge by induction, regaining one charge per hour.

