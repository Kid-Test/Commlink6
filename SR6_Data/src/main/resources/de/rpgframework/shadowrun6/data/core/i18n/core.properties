item.biomonitor.desc=This small device constantly measures heart rate, blood pressure, and body temperature. It can also analyze blood, sweat, and skin samples. Used by medical services and patients who need to monitor their own health, biomonitors can be worn as an armband or wristband or integrated into clothing or commlinks.
item.biomonitor.wifi=The biomonitor shares information with other wireless devices you designate and can auto-alert DocWagon or another ambulance service if your life signs reach certain thresholds.
item.docwagon_contract.desc=Don't leave home without it! DocWagon offers first-class emergency medical care on a twenty-four-hour basis, and they come to you! Four contract service levels are available: basic, gold, platinum, and super-platinum. A DocWagon contract requires the filing of tissue samples (held in a secure vault staffed by bonded guards, spiders, and mages) and comes with a biomonitor RFID tag implant or wristband that can be activated to call for help and then to serve as a homing beacon for DocWagon ambulances and fast-response choppers in the area. Breaking the band will also alert DocWagon representatives.
item.docwagon_contract.variant.monthly.desc=DocWagon Contract (1 Month)
item.docwagon_contract.variant.yearly.desc=DocWagon Contract (1 Year)
item.docwagon_basic_year.desc=Don't leave home without it! DocWagon offers first-class emergency medical care on a twenty-four-hour basis, and they come to you! Four contract service levels are available: basic, gold, platinum, and super-platinum. A DocWagon contract requires the filing of tissue samples (held in a secure vault staffed by bonded guards, spiders, and mages) and comes with a biomonitor RFID tag implant or wristband that can be activated to call for help and then to serve as a homing beacon for DocWagon ambulances and fast-response choppers in the area. Breaking the band will also alert DocWagon representatives.
item.docwagon_gold_year.desc=Gold service includes one free resuscitation per year, a fifty percent reduction on HTR service charges, and a ten percent discount on extended care.
item.docwagon_platinum_year.desc=Platinum service includes four free resuscitations per year and a fifty percent discount on extended care; there is no charge for HTR services, but employee death compensation still applies.
item.docwagon_superplatinum_year.desc=Super-platinum subscribers are entitled to five free resuscitations a year and do not have to pay for HTR services or death compensation.
item.disposable_syringe.desc=Made of plastic with a metal needle, syringes are intended for a single use. Syringes can be used to apply Injection-vector toxins. An uncooperative victim might need to be immobilized or at least grappled first.
item.first_aid_kit.desc=Kit of basic medical supplies needed to use the skill First Aid (p. 119).
item.medkit.desc=The medkit includes drug supplies, bandages, tools, and a (talkative) doctor expert system that can advise the user on techniques to handle most typical medical emergencies (including fractures, gunshot wounds, chemical wounds, and poisoning, as well as offering advice for the treatment of shock, handling blood loss, and of course performing resuscitations). The medkit counts as Kit for Biotech tests. For rules on using a medkit, see p. 119.
item.medkit.wifi=The medkit provides a +1 dice pool modifier to healing tests.
item.medkit_supplies.desc=Medkit supplies need to be purchased after each use or extras can be purchased. Up to five sets of supplies can be stored in the medkit's case; sets beyond that will need to be carried elsewhere.
item.antidote_patch.desc=The antidote patch cancels or negates the Poisoned Status for a broad range of toxins. If a specific toxin or drug is extremely rare, the gamemaster may require a specific Antidote patch just for that substance (see Toxins and Drugs, p. 121).
item.chem_patch.desc=This is a "blank” patch. You can add one dose of a chemical or toxin (p. 121) to it, and then apply it later to a patient (or yourself).
item.stim_patch.desc=This patch removes a number of boxes of Stun damage equal to its rating and cancels the Dazed Status Effect. The effect lasts for (rating x 10) minutes-after that period of time, the patient takes (rating + 1) unresisted Stun damage (which may well become Overflow by that point). While a stimulant patch is in effect, the character is unable to rest.
item.tranq_patch.desc=This patch inflicts Stun damage equal to its rating, resisted with only Body.
item.trauma_patch.desc=When applied, the patient heals 1d6 + 1 Overflow Damage immediately. These patches are always wireless and connect to the Matrix the moment they are applied.

#Cyberware
item.commlink=Commlink
item.commlink.page=283
item.commlink.variant.bodyware=Headware
item.commlink.desc=The implanted version of the commlink (p. 267) comes with a sim module at no additional cost. An integral headware commlink is popular with corporate operatives, company men, and sararimen on the go. Generally speaking, commlinks with a Device Rating of less than 5 are not installed inside your skull, for security reasons. A bricked headware commlink causes 6P damage resisted by Body.
item.commlink.variant.bodyware.desc=The implanted version of the commlink (p. 267) comes with a sim module at no additional cost. An integral headware commlink is popular with corporate operatives, company men, and sararimen on the go. Generally speaking, commlinks with a Device Rating of less than 5 are not installed inside your skull, for security reasons. A bricked headware commlink causes 6P damage resisted by Body.
item.control_rig=Control Rig
item.control_rig.page=283
item.control_rig.desc=This implant harnesses the raw data-coordinating and synchronization power of the middle brain for the express purpose of directly manipulating rigged vehicles and drones (and other devices with rigger interface, like turrets). It has a built-in sim module, allowing DNI with other devices. It also comes with a universal data connector and about a meter of retractable cable that functions like a datajack.<br/>When you’re jumped in it provides its rating as a dice pool bonus on and reduction in threshold to all tests involving the operation of vehicle, and a bonus point of Edge.
item.control_rig.variant.echo_machine_mind=Echo Machine Mind
item.control_rig.variant.echo_machine_mind.desc=You gain the benefits of a Rating 1 Control Rig (p. 283). This Echo is only selected once. When you’re jumped in it provides 1 dice pool bonus on and 1 reduction in threshold to all tests involving the operation of vehicle, and a bonus point of Edge.
item.control_rig.variant.quality_pilot_origin=Pilot Origins
item.control_rig.variant.quality_pilot_origin.desc=An AI with this quality likely evolved from a drone pilot program and retained its abilities. The AI may jump into drones and vehicles, controlling them like a rigger. Each level of this quality grants the bonus of a control rig of an equal rating. The AI is also capable of loading, converting, and using drone autosofts equal to its Data Processing (AI-driven drones use the attributes, skills, and Matrix Initiative of the AI). As a side note, this is piloting by pure calculation and data processing; it does not include the simsense processing ability of the Control Rig Integration codemod. The two methods are incompatible and do not stack with each other or with any Resonant echoes.
item.control_rig.variant.control_rig_codemod=Control Rig Integration
item.control_rig.variant.control_rig_codemod.desc=This rather invasive codemod is designed to let an AI accept the real-time, full-spectrum simsense input from a rigger interface and emulate the sections of the metahuman brain that handle full-body sensory input, motor control, and real-world spatial navigation. This set of input filters and emulators allows for the same level of vehicle and drone control typically labeled "rigging." When an AI uses Control Rig Integration to jump in, it provides the codemod's rating as a dice pool bonus on all tests involving the operation of a vehicle, plus a bonus point of Edge. This codemod is incompatible with, and does not stack with, either Pilot Origins or any Resonant Echoes. Any level of Control Rig Integration allows an AI to fully experience the sensory feed of standard simsense entertainment recording, or even a BTL, an experience most AIs consider equally exhilarating and horrifying.
item.cortex_kink_bomb=Cortex kink bomb
item.cortex_kink_bomb.page=283
item.cortex_kink_bomb.desc=Kink bombs are designed to damage only part of the victim’s head, either rendering specific headware useless or damaging the brain to cause blindness, stuttering, hearing loss, or some other trauma (5P, resisted with Body; status as appropriate). Of course, sometimes when something in your head explodes, things don’t go exactly as planned and the result is a bit … much.<br/>\
 The bombs can be remote- or time-detonated, or even set to discharge by sound recognition. If installed in cyberlimbs, these bombs are designed to destroy specific components.
item.cortex_microbomb=Cortex microbomb
item.cortex_microbomb.page=283
item.cortex_microbomb.desc=The microbomb version is just powerful enough to kill the unfortunate bearer (18P, resisted with Body).<br/>\
 The bombs can be remote- or time-detonated, or even set to discharge by sound recognition. If installed in cyberlimbs, these bombs are designed to destroy the entire limb.
item.cortex_area_bomb=Cortex area bomb
item.cortex_area_bomb.page=283
item.cortex_area_bomb.desc=Area cranial bombs kill the victim (microbomb damage to victim), and they also affect a blast area exactly like a fragmentation grenade (p. 263) resisted separately from the initial microbomb damage.<br/>\
 The bombs can be remote- or time-detonated, or even set to discharge by sound recognition. If installed in cyberlimbs, these bombs are designed tob last the area and damage the bearer.
item.cyberdeck=Cyberdeck
item.cyberdeck.variant.bodyware=Headware
item.cyberdeck.page=283
item.cyberdeck.desc=Simply put, you’ve got a deck in your body. This is very convenient for the hacker on the go and is often sported by G-men and military deckers. Bricking a headware deck causes 8P damage resisted with Body.
item.cyberdeck.variant.bodyware.desc=Simply put, you’ve got a deck in your body. This is very convenient for the hacker on the go and is often sported by G-men and military deckers. Bricking a headware deck causes 8P damage resisted with Body.
item.cyberjack=Cyberjack
item.cyberjack.page=283
item.cyberjack.desc=As the Matrix protocols have become stiffer and stiffer, work has raced forward to keep hackers operating. The latest tool that has advanced quickly from neat to necessary is the cyberjack, which represents one of those times when shadowrunners turned the tables on the corps. Based on corporate research on technomancers, the cyberjack harnesses the immense processing power of the brain to take on Matrix protocols and encryption schemes. It happened rapidly, but it now seems that a decker without a cyberjack is about as effective as one without a cyberdeck. <br/>The cyberjack provides a decker’s primary defense against hacking, offering Data Processing and Firewall ratings that cyberdecks no longer possess, and they also function as a standard datajack. <br/>Cyberjacks also allow special Matrix Edge Actions (p. 175).
item.datajack=Datajack
item.datajack.page=283
item.datajack.desc=A datajack gives you a direct neural interface. It also comes with a retractable spool of micro-cable (a meter long) that lets you directly interface with any electronic device via a universal access cable. Datajacks are equipped with their own cache of storage memory for downloading or saving files.<br/>Two datajack users can string a fiberoptic cable between themselves to conduct a private mental communication immune to radio interception or eavesdropping.
item.datalock=Datalock
item.datalock.page=283
item.datalock.desc=This special datajack is popular with couriers, spies, diplomatic aids, and executive liaisons. Effectively, it turns the character in whom it is installed into a walking data safe. The datalock has a Device Rating equal to its own rating, and it protects the data from anyone not authorized to access it (possibly including you). Datalocks are not wireless enabled; they can only be accessed via universal data connector. In fact, the bearer of the implant doesn’t have mental access to the data— they’re only a carrier.
item.olfactory_booster=Olfactory booster
item.olfactory_booster.page=283
item.olfactory_booster.wifi=Add the booster�s rating as a dice pool modifier to your scent-based Perception tests.
item.olfactory_booster.desc=This cybersnout enhances, identifies, and records smells, and can play them back later. The massively enhanced olfactory capabilities of a sniffer open up a whole new world of sensory data to you—you’ll be able to sense things that ordinarily only a scenthound would. You can smell people’s emotions in their sweat (and if applicable, the maker’s mark of their tailored pheromones), traces of ammunition propellant, explosives, or biological and chemical warfare compounds—the list goes on and on. A cut-off function allows you to completely ignore intense odors, possibly the most convenient feature for use in your daily life.<br/>The olfactory booster can even be used in VR to create an even more immersive experience. The user gains a bonus Edge for all scent-based Perception tests, but it goes away if they do not use it on that test.
item.olfactory_booster.wifi=Add the booster’s rating as a dice pool modifier to your scent-based Perception tests.
item.skilljack=Skilljack
item.skilljack.page=284
item.skilljack.wifi=The extra boost from the Matrix increases the total Rating limit to the skilljack’s rating x 4, and Edge can be used in associated tests.
item.skilljack.desc=This headware interprets knowsofts and linguasofts for your brain so you can use them as though they were your own. It can also run activesofts, but they only act as Knowledge Skills unless you have skillwires (p. 287). The total of all skills running on a skilljack cannot exceed its rating x 2, and the maximum rating for a single skill is the skilljack’s rating. Starting skills from storage and stopping skills doesn’t require an action. <br/>You can’t use Edge with skills you have through a skilljack.
item.skilljack.wifi=The extra boost from the Matrix increases the total Rating limit to the skilljack’s rating x 4, and Edge can be used in associated tests.
item.taste_booster=Taste booster
item.taste_booster.page=284
item.taste_booster.desc=The taste booster performs the same function as the olfactory booster, except that it enhances your taste buds. The taste booster also lets you experience gustatory data in AR and VR environments with a “taste track”—caveat emptor on that one, chummer. The user gains a bonus Edge for all taste-based Perception tests, but it goes away if they do not use it on that test.
item.taste_booster.wifi=Add the booster’s rating as a dice pool modifier to your taste-based Perception tests.
item.tooth_compartment=Tooth compartment
item.tooth_compartment.page=284
item.tooth_compartment.desc=The oldest cyberware on the market, these hollow teeth come in storage and breakable models.<br/>The storage model is used to smuggle really, really tiny contraband, no larger than five millimeters on a side. Items can be removed with a wireless signal or hidden catch. <br/>The breakable model triggers a linked effect (such as starting a tracking signal or releasing deadly poison into your mouth—make sure you remember which is which!) with a wireless signal, or it may trigger when you bite down hard on the tooth.
item.ultrasound_sensor=Ultrasound sensor
item.ultrasound_sensor.page=284
item.ultrasound_sensor.desc=This cyberware is exactly like the ultrasound sensor. When active, it replaces your normal vision. It can be switched between active sonar, passive sonar, and off with a Minor Action.
item.voice_modulator=Voice modulator
item.voice_modulator.page=285
item.voice_modulator.desc=This implant gives you perfect pitch and enormous vocal flexibility and distortion capabilities. You can speak with an increased volume (up to one hundred decibels) without strain, shift your pitch to make perfect bird calls or mellifluous singing, and most importantly, uncanny vocal impressions. The modulator can also play back (and more or less perfectly imitate) a recorded or captured voice. The user gains a bonus Edge for sound-based Con skill tests.
item.voice_modulator.wifi=Add the rating of the modulator to your dice pool for sound based Con skill tests.
item.cybereye=Cybereyes
item.cybereye.page=285
item.cybereye.desc=The basic cybereyes system features 20/20 vision for both eyes, an image link, and a built-in camera, as well as Capacity for vision enhancements.
item.ocular_drone=Ocular drone
item.ocular_drone.page=285
item.ocular_drone.desc=This enhancement only affects one eyeball per purchase. A small drone (treat it as a Horizon Flying Eye, p. 299) is placed in your ocular cavity. The spyball functions as a normal cybereye (with all the relevant enhancements) until you remove it and control it as though it were a drone. When it’s out, you have only one eye and suffer the Blindness I Status effect for all tasks. If you replace both eyes with drones, you gain the Blindness III Status Effect while those drones are operating apart from you. An ocular drone is obviously a fake eye.
item.retinal_duplication=Retinal duplication
item.retinal_duplication.page=285
item.retinal_duplication.desc=This highly illegal modification can be loaded with a recording of someone else’s retina to create an almost perfect reproduction. Make an Opposed test between the retinal duplication rating and the retinal scanner rating (Sensors and Scanners, p. 241). The system can actively store a number of retinas equal to its rating.<br/>Changing retinal patterns requires 1 minute.
item.cyberears=Cyberears
item.cyberears.page=286
item.cyberears.desc=Ordinarily, cyberears replace only the inner ear, although the whole thing can be replaced as well if you like. Cyberears offer hearing within normal ranges (like an omnidirectional microphone), a sound link, and Capacity for modifications and enhancements. All cyberears provide a bonus Edge vs. a target who has something interfering with their hearing, but the Edge point is lost if it is not used immediately.
item.balance_augmenter=Balance Augmenter
item.balance_augmenter.page=286
item.balance_augmenter.desc=The balance augmenter enhances the inner ear’s natural balance mechanism. You receive one bonus die on all tests involving balance, such as climbing, walking across a narrow platform, landing after a jump, and so on.
item.damper=Damper
item.damper.page=286
item.damper.desc=This implant protects the user from sudden increases in sound as well as damaging sound levels. The damper diminishes the Deafened status by 1 level for any instance in which it is inflicted.
item.soundlink=Soundlink
item.soundlink.page=286
item.soundlink.desc=The audio equivalent of image link, sound link can play audio (recordings, movie soundtracks, music, etc.) from linked sources within the user’s PAN (or headware memory, or datajack) directly into the user’s cyberears. A sound link is a common component of immersive AR environments, adding a sonic component.
item.soundlink.variant.cybereye=Cyberear install
item.soundlink.variant.bodyware=Bodyware
item.bone_lacing=Bone lacing
item.bone_lacing.page=286
item.bone_lacing.desc=Your bones are laced with lattice chains of reinforcing plastics or metals, improving their integrity and tensile strength. Bone lacing comes in three types: plastic, aluminum, and titanium—you can only have one installed at a time. It gives you extra Body when resisting physical damage, changes your unarmed combat damage to Physical, and adds a few useful bonuses, all listed in the Bone Lacing table. Bone lacing is incompatible with other augmentations that add to or alter your bones (such as bone density augmentation).
item.bone_lacing.variant.plastic=Plastic
item.bone_lacing.variant.aluminium=Aluminium
item.bone_lacing.variant.titanium=Titanium
item.bone_lacing.variant.plastic.desc=Your bones are laced with lattice chains of reinforcing plastics or metals, improving their integrity and tensile strength. It gives you extra Body when resisting physical damage, changes your unarmed combat damage to Physical, and adds a few useful bonuses, all listed in the Bone Lacing table. Bone lacing is incompatible with other augmentations that add to or alter your bones (such as bone density augmentation).
item.bone_lacing.variant.aluminium.desc=Your bones are laced with lattice chains of reinforcing plastics or metals, improving their integrity and tensile strength. It gives you extra Body when resisting physical damage, changes your unarmed combat damage to Physical, and adds a few useful bonuses, all listed in the Bone Lacing table. Bone lacing is incompatible with other augmentations that add to or alter your bones (such as bone density augmentation).
item.bone_lacing.variant.titanium.desc=Your bones are laced with lattice chains of reinforcing plastics or metals, improving their integrity and tensile strength. It gives you extra Body when resisting physical damage, changes your unarmed combat damage to Physical, and adds a few useful bonuses, all listed in the Bone Lacing table. Bone lacing is incompatible with other augmentations that add to or alter your bones (such as bone density augmentation).
item.dermal_plating=Dermal Plating
item.dermal_plating.page=286
item.dermal_plating.desc=Hard plastic and ceramic fiber plates are bonded to the user’s skin. The plates are clearly visible, and are even more obvious to the touch, but they can be cosmetically stylized for color and surface texture. Dermal plating gives you a Defense Rating bonus equal to its rating. Dermal plating cannot be combined with other augmentations to the skin that provide a Defense Rating bonus, including orthoskin.
item.fingertip_compartment=Fingertip compartment
item.fingertip_compartment.page=287
item.fingertip_compartment.wifi=Inserting or removing an item in a fingertip compartment takes a Minor Action, including spooling up a monofilament whip.
item.fingertip_compartment.desc=This compartment is hidden in the hollowed-out last joint of one finger, with a catch that allows the fingernail to be lifted up as an access panel, or the entire fingertip removed. A fingertip compartment allows the storage of micro-sized items, like a micro-drone, RFID tag, or datachip. Inserting or removing an object takes a Major Action. Items held within are completely concealed, and the compartment itself has a Concealability threshold of 8. One popular trick is to use a fingertip compartment to hold a monofilament whip (p. 249), with the fingertip acting as control weight. Extending a monofilament whip from a fingertip compartment takes a Minor Action, while spooling it back up requires a Major Action.
item.internal_air_tank=Internal air tank
item.internal_air_tank.page=287
item.internal_air_tank.wifi=You gain an extra Minor Action during any turn when you activate or deactivate the tank. You’re always aware of the tank’s exact air level and purity.
item.internal_air_tank.desc=The internal air tank replaces part of one lung with a pressurized internal air reserve that allows you to hold your breath for up to (rating) hours. This allows extended underwater operations and complete protection from Inhalation-vector toxin attacks as long as you’re holding your breath. Activating or deactivating the tank is a Minor Action.<br/>Refilling the air tank with pressurized air through an intake valve (located under your ribcage) takes five minutes, or you can refill it through six hours of normal breathing.
item.muscle_replacement=Muscle replacement
item.muscle_replacement.page=287
item.muscle_replacement.desc=Vat-grown synthetic muscles replace or augment your own, and calcium treatments and skeletal reinforcement contribute to your overall strength. It increases both your Strength and Agility attributes by its rating. It cannot be combined with other augmentations to the muscles, including muscle augmentation or muscle toner bioware.
item.reaction_enhancers=Reaction enhancers
item.reaction_enhancers.page=287
item.reaction_enhancers.wifi=Reaction enhancers are compatible with a wireless wired reflexes system.
item.reaction_enhancers.desc=By replacing specific, isolated vertebrae of your spinal column with segments of superconducting material, your reactions to events become quicker. Add the rating of reaction enhancers to your Reaction attribute (and remember to adjust your Initiative Score accordingly).<br/>Reaction enhancers are incompatible with all other enhancements to Reaction, including wired reflexes.
item.skillwires=Skillwires
item.skillwires.page=287
item.skillwires.wifi=With the skillwire’s memory cache expanded, all the skills you use with it receive a +1 dice pool modifier.
item.skillwires.desc=Skillwires are a system of neuromuscular controllers that overlay the body’s natural nervous system; they are capable of aiding or completely overriding muscular movement, controlled by the muscle memory played through a skilljack (p. 284).<br/>This system allows you to use activesofts with a rating up to your skillwire’s rating, but only if that activesoft is running on your implanted skilljack.
item.smuggling_compartment=Smuggling compartment
item.smuggling_compartment.page=287
item.smuggling_compartment.desc=For items that won’t fit in a fingertip but you still can’t afford to have found, smuggling compartments can be placed in parts of the body that can be easily hollowed out/replaced. This includes ribs and the space between them, hip bones, shoulder blades, and so forth. These compartments allow the storage of small and miniature items (nothing bigger than a light pistol typically; your gamemaster will let you know if something’s too big). The compartment has a Concealability threshold of 8. <br/>Inserting or retrieving an object requires a Major Action.
item.smuggling_compartment.wifi=Inserting or retrieving an object takes a Minor Action.
item.smuggling_compartment.variant.cyberlimb=Implanted
item.smuggling_compartment.variant.cyberlimb.page=290
item.smuggling_compartment.variant.cyberlimb.desc=This functions like the smuggling compartment listed on p. 287 but is installed in a cyberlimb.
item.wired_reflexes=Wired reflexes
item.wired_reflexes.page=287
item.wired_reflexes.desc=This highly invasive, painful, life-changing operation adds a multitude of neural boosters and adrenaline stimulators in strategic locations throughout your body to catapult you into a whole new world where everything around you seems to move in slow motion. The system includes both manual and wireless triggers to turn the wired reflexes on and off; activating or deactivating the trigger manually requires a Major Action, while doing so wirelessly is a Minor Action. When activated, each rating point of wired reflexes gives you +1 Reaction (with accompanying bonus to your Initiative Score) and 1 additional Initiative Die (with accompanying Minor Action).<br/>Wired reflexes are incompatible with augmentations that affect Reaction or Initiative.
item.wired_reflexes.wifi=The system is compatible with wireless reaction enhancers, and activation or deactivation of the system requires a Minor Action.

item.cyberskull=Cyberskull
item.cyberskull.page=288
item.cyberskull.desc=The skull replaces the bones and muscles of the head, face, and neck. Having a cyberskull means you also have a cyberjaw that can deliver a powerful bite.
item.cyberskull.variant.synthetic=Synthetic
item.cyberskull.variant.obvious=Obvious
item.cyberskull.variant.synthetic.desc=The skull replaces the bones and muscles of the head, face, and neck. Having a cyberskull means you also have a cyberjaw that can deliver a powerful bite.
item.cyberskull.variant.obvious.desc=The skull replaces the bones and muscles of the head, face, and neck. Having a cyberskull means you also have a cyberjaw that can deliver a powerful bite.
item.cybertorso=Cybertorso
item.cybertorso.page=288
item.cybertorso.desc=The torso replaces the bones and muscles of the body’s core below the neck to the genital region. Obvious torsos remove genitalia and genital function with the exception of excretion. Internal organs are not replaced, but they are all protected in individual compartments. Synthetic torso design does its best to appear natural in every way. Some recipients choose to avoid the sculpted look and go for a slim, toned appearance; others go for an “average” body type to help them blend in with the masses.
item.cybertorso.variant.synthetic=Synthetic
item.cybertorso.variant.obvious=Obvious
item.cybertorso.variant.synthetic.desc=The torso replaces the bones and muscles of the body’s core below the neck to the genital region. Internal organs are not replaced, but they are all protected in individual compartments. Synthetic torso design does its best to appear natural in every way. Some recipients choose to avoid the sculpted look and go for a slim, toned appearance; others go for an “average” body type to help them blend in with the masses.
item.cybertorso.variant.obvious.desc=The torso replaces the bones and muscles of the body’s core below the neck to the genital region. Obvious torsos remove genitalia and genital function with the exception of excretion. Internal organs are not replaced, but they are all protected in individual compartments. Some recipients choose to avoid the sculpted look and go for a slim, toned appearance; others go for an “average” body type to help them blend in with the masses.
item.cyberarm=Cyberarm
item.cyberarm.page=288
item.cyberarm.desc=Basic arm replacement takes everything from the shoulder joint down, but partial replacement of the forearm or just the hand is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberarm.variant.fullarm_synthetic=Full, synthetic
item.cyberarm.variant.fullarm_obvious=Full, obvious
item.cyberarm.variant.forearm_synthetic=Forearm, synthetic
item.cyberarm.variant.forearm_obvious= Forearm, obvious
item.cyberarm.variant.hand_synthetic=Hand, synthetic
item.cyberarm.variant.hand_obvious=Hand, obvious
item.cyberarm.variant.fullarm_synthetic.desc=Basic arm replacement takes everything from the shoulder joint down, but partial replacement of the forearm or just the hand is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberarm.variant.fullarm_obvious.desc=Basic arm replacement takes everything from the shoulder joint down, but partial replacement of the forearm or just the hand is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberarm.variant.forearm_synthetic.desc=Basic arm replacement takes everything from the shoulder joint down, but partial replacement of the forearm or just the hand is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberarm.variant.forearm_obvious.desc=Basic arm replacement takes everything from the shoulder joint down, but partial replacement of the forearm or just the hand is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberarm.variant.hand_synthetic.desc=Basic arm replacement takes everything from the shoulder joint down, but partial replacement of the forearm or just the hand is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberarm.variant.hand_obvious.desc=Basic arm replacement takes everything from the shoulder joint down, but partial replacement of the forearm or just the hand is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberleg=Cyberleg
item.cyberleg.page=288
item.cyberleg.desc=Basic leg replacement takes everything from the hip joint down, but partial replacement of the lower leg below the knee or just the foot is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberleg.variant.fullleg_synthetic=Full, synthetic
item.cyberleg.variant.fullleg_obvious=Full, obvious
item.cyberleg.variant.lowerleg_synthetic=Lower Leg, synthetic
item.cyberleg.variant.lowerleg_obvious=Lower Leg, obvious
item.cyberleg.variant.foot_synthetic=Foot, synthetic
item.cyberleg.variant.foot_obvious=Foot, obvious
item.cyberleg.variant.fullleg_synthetic.desc=Basic leg replacement takes everything from the hip joint down, but partial replacement of the lower leg below the knee or just the foot is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberleg.variant.fullleg_obvious.desc=Basic leg replacement takes everything from the hip joint down, but partial replacement of the lower leg below the knee or just the foot is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberleg.variant.lowerleg_synthetic.desc=Basic leg replacement takes everything from the hip joint down, but partial replacement of the lower leg below the knee or just the foot is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberleg.variant.lowerleg_obvious.desc=Basic leg replacement takes everything from the hip joint down, but partial replacement of the lower leg below the knee or just the foot is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberleg.variant.foot_synthetic.desc=Basic leg replacement takes everything from the hip joint down, but partial replacement of the lower leg below the knee or just the foot is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.
item.cyberleg.variant.foot_obvious.desc=Basic leg replacement takes everything from the hip joint down, but partial replacement of the lower leg below the knee or just the foot is available. Partial limb replacements must have attributes equal to the rest of the limb or greater.

item.attribute_increase=Attribute Increase
item.attribute_increase.page=288
item.attribute_increase.desc=Cyberlimbs can be used to add to either Agility, Armor, or Strength of the user. The maximum augmented increase of 4 is in place here, so don’t buy an attribute increase that would increase one of your attributes higher than 4, as it would be a waste.<br/>\
 Increases to Armor increase your Defense Ratings at all times—it is part of your overall protection, which is what Defense Rating represents. Increases to Agility and Strength only apply when the limb is used in some way in the process. For example, if a cyberarm has an increase to the user’s Strength, that would increase their damage when doing an unarmed attack with that arm, but not when kicking. If an activity could reasonably be interpreted to use the whole body in some way (e.g., sprinting, climbing, swimming), then the cyberlimb increase would not apply.<br/>Note that Strength and Agility increases have no effect when they are included in a cyberskull.
item.armor_increase=Armor increase
item.armor_increase.page=288
item.armor_increase.desc=Cyberlimbs can be used to add to either Agility, Armor, or Strength of the user. The maximum augmented increase of 4 is in place here, so don’t buy an attribute increase that would increase one of your attributes higher than 4, as it would be a waste.<br/>\
 Increases to Armor increase your Defense Ratings at all times—it is part of your overall protection, which is what Defense Rating represents. Increases to Agility and Strength only apply when the limb is used in some way in the process. For example, if a cyberarm has an increase to the user’s Strength, that would increase their damage when doing an unarmed attack with that arm, but not when kicking. If an activity could reasonably be interpreted to use the whole body in some way (e.g., sprinting, climbing, swimming), then the cyberlimb increase would not apply.<br/>Note that Strength and Agility increases have no effect when they are included in a cyberskull.
item.cyber_holdout=Implanted Hold-out pistol
item.cyber_holdout.page=290
item.cyber_holdout.desc=The implant only makes the space, and the firearm has to be purchased separately. All forms of pistols increase their Concealability by 2 when they are implanted.
item.cyber_light_pistol=Implanted Light Pistol
item.cyber_light_pistol.page=290
item.cyber_light_pistol.desc=The implant only makes the space, and the firearm has to be purchased separately. All forms of pistols increase their Concealability by 2 when they are implanted.
item.cyber_machine_pistol=Implanted Machine Pistol
item.cyber_machine_pistol.page=290
item.cyber_machine_pistol.desc=The implant only makes the space, and the firearm has to be purchased separately. All forms of pistols increase their Concealability by 2 when they are implanted.
item.cyber_heavy_pistol=Implanted Heavy Pistol
item.cyber_heavy_pistol.page=290
item.cyber_heavy_pistol.desc=The implant only makes the space, and the firearm has to be purchased separately. All forms of pistols increase their Concealability by 2 when they are implanted.
item.cyber_smg=Implanted Submachine Gun
item.cyber_smg.page=290
item.cyber_smg.desc=The implant only makes the space, and the firearm has to be purchased separately. Larger guns receive no change to Concealability, as they are still pretty noticeable, even when they're implanted.
item.cyber_shotgun=Implanted Shotgun
item.cyber_shotgun.page=290
item.cyber_shotgun.desc=The implant only makes the space, and the firearm has to be purchased separately. Larger guns receive no change to Concealability, as they are still pretty noticeable, even when they're implanted.
item.cyber_launcher=Implanted Launcher
item.cyber_launcher.page=290
item.cyber_launcher.cyber_launcher_weapon=Implanted Launcher
item.cyber_launcher.item.cyber_launcher_weapon=Implanted Launcher
item.cyber_launcher.item.cyber_launcher_weapon.page=290
item.cyber_slide=Embedded Slide
item.cyber_slide.page=290
item.cyber_slide.desc=This functions the same as a hidden arm slide, p. 260.
item.cyber_holster=Embedded Holster
item.cyber_holster.page=290
item.cyber_holster.desc=It holds a weapon-for convenience, not concealment. The holster should be reasonably appropriate to the size of the limb.
item.external_clip_port=External Clip Port
item.external_clip_port.page=290
item.external_clip_port.desc=External access to implanted weapon clip.
item.hydraulic_jacks=Hydraulic jacks
item.hydraulic_jacks.page=290
item.hydraulic_jacks.desc=For these to function properly, you need two of them, one in each leg, and they need to have identical ratings. The user can make Jumping tests (Athletics + Strength) and add the rating of the jacks to the dice pool of the test. Each hit adds 0.1 meter to a vertical leap and 0.2 meters to a horizontal leap.
item.cyberjaw=Cyberjaw
item.cyberjaw.page=291
item.cyberjaw.desc=This adds extra biting power for those who like a special, close-in form of violence.
item.cyberjaw_augment=Cyberjaw
item.cyberjaw_augment.page=291
item.hardening=Hardening
item.hardening.page=291
item.hardening.desc=Through this process, the skin/limb is hardened to make it more club-like and damaging. When attacking unarmed, the user has a DV of 3P (increase to 4P if Strength is 7 or greater) and a Close Attack Rating of 6.
item.shock_limb=Shock Limb
item.shock_limb.page=291
item.shock_limb.desc=This limb has electrodes built in at strategic points that can deliver a taser-like jolt to targets. Hands are customarily used, but some fighters have grown fond of the shock kick, and stories proliferate of fighters engaging in street head butts.
item.handblade=Handblade
item.handblade.page=291
item.handblade.variant.retractable=Retractable
item.handblade.desc=Non retractable handblade, which is a simple blade built into the hand, placed opposite the thumb so it can be used with a swinging cut.
item.handblade.variant.retractable.desc=Retractable model of the handblade, which is a simple blade built into the hand, placed opposite the thumb so it can be used with a swinging cut. When retracted, it has a Concealabil-ity threshold of 8.
item.handrazors=Handrazors
item.handrazors.page=291
item.handrazors.variant.retractable=Retractable
item.handrazors.desc=Hand razors go under the fingernails or just replace them, all the better for clawing.
item.handrazors.variant.retractable.desc=Hand razors go under the fingernails or just replace them, all the better for clawing. As with handblades, the retractable model has a Concealability threshold of 8.
item.spurs=Spurs
item.spurs.page=291
item.spurs.variant.retractable=Retractable
item.spurs.desc=These are spikes placed on the wrist or the back of knuckles, designed to give a stabbing puncture to a punch or slap.
item.spurs.variant.retractable.desc=These are spikes placed on the wrist or the back of knuckles, designed to give a stabbing puncture to a punch or slap. The retractable model has a Concealability threshold of 8.

