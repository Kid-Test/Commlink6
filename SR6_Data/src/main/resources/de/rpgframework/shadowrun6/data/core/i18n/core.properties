item.binoculars.desc=Typically handheld, binoculars come with built-in vision magnification. Binoculars are available in optical (which can only take the image link enhancement) and electronic versions (which can take a variety of vision enhancements). Spellcasters can use optical binoculars for casting spells at distant targets.
item.binoculars.variant.electronic.desc=Typically handheld, binoculars come with built-in vision magnification. Electronic binoculars can take a variety of vision enhancements.
item.binoculars.variant.optical.desc=Typically handheld, binoculars come with built-in vision magnification. Optical binoculars can only take the image link enhancement. Spellcasters can use optical binoculars for casting spells at distant targets.
item.camera.desc=Remarkably common, cameras can capture still photos, video, and trideo. Cameras may also be upgraded with vision enhancements and audio enhancements.
item.microcamera.desc=Remarkably common, cameras can capture still photos, video, and trideo. Cameras may also be upgraded with vision enhancements and audio enhancements. A microcamera has Capacity 1.
item.contacts.desc=Worn directly on the eyes, they are nearly undetectable but offer little space for enhancements. Contacts have to be wireless.
item.endoscope.desc=This fiber-optic cable is at least one meter long, with the first twenty centimeters on either side made up of myomeric rope (p. 281) and an optical lens. It allows the user to look around corners, under door slits, or into narrow spaces. It is available in any number of lengths, although longer segments can be unwieldy.
item.glasses.desc=Glasses are lenses contained in lightweight frames worn on the bridge of the nose and include numerous cosmetic styles. Vision enhancement-equipped glasses are hard to distinguish from prescription glasses or sunglasses at a glance.
item.goggles.desc=Relatively large and bulky, goggles are strapped to the head, making them difficult to dislodge. Goggles have the potential to install a wide array of vision enhancements due to their size.
item.imaging_scope_single.desc=These are vision enhancers and display devices that are usually top-mounted on weapons (see Accessories, p. 259).
item.monocle.desc=A monocle is worn on a headband or helmet with a flip-down arm, or (for the old-fashioned look) on a chain. The chain version has a smart adhesive so you don't have to squint all the time to hold it in place.
item.mage-sight-goggles.desc=These heavy goggles are connected to a myomeric rope (p. 281) wrapped around a fiber-optic cable that ends in an optical lens. The rope is available in lengths of 10, 20, or 30 meters and allows spellcasters to gain line of sight while still out of sight.

item.flare_compensation.desc=This protects you from blinding flashes of light as well as simple glare. This modification offers a bonus Edge if the opposition doesn't have a vision enhancement to mitigate glare and reduces the penalty from flashing lights, like from a flash-pak.
item.image_link.desc=This lets you display visual information (text, pictures, movies, the current time, etc.) in your field of vision. This is usually done with AROs, but you can display pretty much whatever you want on it. You and your team can use it to share tactical and situational info in real time. An image link is what you need to truly "see” AR and participate in the modern world.
item.low_light_vision.desc=This accessory allows you to see normally in light levels as low as starlight. It doesn't help in total darkness, though. This modification offers a bonus Edge if the opposition doesn't have a vision enhancement to mitigate limited light.
item.smartlink.desc=This is the vision accessory side of the smartgun system (p. 260). The smartlink receives the range to various targets, ammunition level (and type), and offers a targeting dot wherever the gun is pointed if within the visual field of the user.
item.thermographic_vision.desc=This enhancement enables vision in the infrared spectrum, enabling you to see heat patterns. It's a very practical way to spot living beings in areas of total darkness, to check if a motor or machine has been running lately, and so on. This modification offers a bonus Edge if the opposition doesn't have a vision enhancement to mitigate limited light and even total darkness.
item.ultrasound_link.desc=This is the visual overlay system for an ultrasound accessory. See Ultrasound (p. 277) for rules.
item.vision_enhancement.desc=This sharpens a character's vision at all ranges, providing visual acuity closer to that of the average hawk than that of the average metahuman. This system gives a +1 dice pool bonus to all visual Perception tests.
item.vision_magnification.desc=This zoom function digitally magnifies vision by up to fifty times, allowing distant targets to be seen clearly. Attack Ratings for Medium, Far, and Extreme ranges are increased by 2, assuming the attack being used has a non-zero Attack Rating in those categories.

item.flare_compensation.variant.cybereye.desc=This protects you from blinding flashes of light as well as simple glare. This modification offers a bonus Edge if the opposition doesn't have a vision enhancement to mitigate glare and reduces the penalty from flashing lights, like from a flash-pak.
