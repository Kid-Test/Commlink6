skill.piloting=Piloting
skill.piloting.page=97
skill.piloting.desc=When you want a vehicle to move in a tricky way, this is the skill to use (riggers live or die by this skill). This is generally a Simple Test with a threshold based on the difficulty of the maneuver they are attempting. Sometimes a Piloting roll is about trying to avoid a tail, or tail someone else, or some other multi-vehicle action.
skill.piloting.skillspec.ground_craft=Ground Craft
skill.piloting.skillspec.aircraft=Aircraft
skill.piloting.skillspec.watercraft=Watercraft
skill.sorcery=Sorcery
skill.sorcery.page=97
skill.sorcery.desc=The uses of Sorcery are numerous—too numerous to cover here! Instead, look at the Magic chapter for information on Spells (p. 130), Counterspelling (p. 143), and other uses.
skill.sorcery.skillspec.counterspelling=Counterspelling
skill.sorcery.skillspec.ritual_spellcasting=Ritual Spellcasting
skill.sorcery.skillspec.spellcasting=Spellcasting
skill.stealth=Stealth
skill.stealth.page=97
skill.stealth.desc=Shadowrunning isn’t supposed to be obvious, as you should be able to guess by the name, so Stealth is a very valuable skill. Stealth covers all the activities characters perform that they do not want others to notice—sneaking into a research facility, slipping a credstick out from under a Mafia don’s nose, blending into a crowd of Lone Star officers, and so on.\nIn some circumstances, but not all, the size of a character may play a role in how stealthy they can be.
skill.stealth.skillspec.camouflage=Camouflage
skill.stealth.skillspec.disguise=Disguise
skill.stealth.skillspec.palming=Palming
skill.stealth.skillspec.sneaking=Sneaking
skill.tasking=Tasking
skill.tasking.page=97
skill.tasking.desc=This is the skill technomancers use to do various technomancer activities. More information about these activities can be found in the Technomancers section (p. 187).
skill.tasking.skillspec.compiling=Compiling
skill.tasking.skillspec.decompiling=Decompiling
skill.tasking.skillspec.registering=Registering
skill.language=Language
skill.language.page=99
skill.language.desc=Language skills are Knowledge skills with specialization ranks. That means they have four levels, like so:<br/>\
 • Sperethiel<br/>\
 • Sperethiel (Specialist)<br/>\
 • Sperethiel (Expert)<br/>\
 • Sperethiel (Native)<br/>\
 At the first level, you gain the ability to use Perception tests to understand things in that language, which you could not have done before. This functions the same as other Knowledge skills. At the second level, you gain 2 dice on tests related to understanding the language. At the third level, the dice pool bonus on tests to understand the language increases to 3. Native speakers do not have to roll a test to understand that language.
skill.knowledge=Knowledge
skill.knowledge.page=98
skill.knowledge.desc=Knowledge skills do not have ranks, because they are not used directly in skill tests. Instead, they are used to provide opportunities to gain knowledge connected to other tests. For example, if a character has Security Systems knowledge and performs a Perception test to look over a corporate facility exterior, their test might give them a chance to see where cameras are located and when patrols go by. If they have the Seattle Gangs knowledge skill, a successful Perception test might help them know that the people walking up to them are members of the Halloweeners gang. The Seattle Streets Knowledge skill would help them when making Outdoors tests in the Seattle area. Players may also make Memory tests (p. 67) to see if they can recall certain facts about areas where they have a Knowledge skill.<br/>\
 By definition, Knowledge skills cannot be used untrained.

