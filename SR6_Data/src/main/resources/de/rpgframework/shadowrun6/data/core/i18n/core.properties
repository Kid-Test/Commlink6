item.atmosphere_sensor.desc=Weather forecasts suck thanks to pollution, the Awakening, and how many dragons are currently flapping their wings and belching, but atmospheric sensors can keep you from getting caught in the rain with up-to-the-second analysis of what's happening in the air around you.
item.cyberware_scanner.desc=This millimeter-wave scanner is intended to detect cyber-implants but can be used to identify other contraband as well. It identifies location but not what system or item it is. The maximum range is fifteen meters.
item.geiger_counter.desc=This sensor picks up the amount of radioactivity surrounding it. The faster it clicks, the closer to screwed you are.
item.laser_range_finder.desc=This sensor emits a laser beam that is reflected off a target and picked up by a detector to calculate the distance to the target.
item.mad_scanner.desc=The MAD (Magnetic Anomaly Detection) scanner is used to detect weapons and concentrations of metal. It has a maximum range of five meters.
item.motion_sensor.desc=This sensor uses a mix of ultrasound and low-power infrared to detect motion and drastic changes in the ambient temperature. Maximum range is twenty-five meters.
item.olfactory_sensor.desc=The olfactory sensor picks up and analyzes molecules in the air. It works in the same way as the olfactory booster cyberware (p. 283).
item.ultrasound.desc=The ultrasound accessory consists of an emitter that sends out continuous ultrasonic pulses and a receiver that picks up the echoes of these pulses to create a topographic ultrasound map. Ultrasound is perfect to get textures, calculate distances between objects, and pick up things otherwise invisible to the naked eye (take that, Invisibility spell!). It can't determine colors or brightness but operates in total darkness perfectly. It also can't penetrate materials like glass that would be transparent to optical sensors. You can set it to a passive mode, where it doesn't emit ultrasonic pulses but still picks up ultrasound from outside sources, such as motion sensors or someone else's ultrasound sensors on active mode (or bats). <br/>Using the ultrasound sensor in dim light or total darkness offers a bonus Edge if opponents can't see, offers a bonus Edge against targets who are invisible, and provides the ability to navigate in complete darkness by expending an extra Minor Action for movement.
item.camera_function.desc=Remarkably common, cameras can capture still photos, video, and trideo. Cameras may also be upgraded with vision enhancements and audio enhancements.
item.directional_microphone_function.desc=This lets you listen in on conversations up to one hundred meters away. The mic needs to be pointed at the desired eavesdropping target, and solid objects or loud sounds along the line of eavesdropping interfere.
item.laser_microphone_function.desc=This sensor bounces a laser against a thin, solid object like a windowpane, reads the vibrations on the surface, and translates them into the sounds that are occurring on the other side of the surface. Maximum range is one hundred meters.
item.omni_directional_microphone_function.desc=A standard audio pickup device that is usually incorporated into, connected to, or wirelessly linked with a commlink or other recording device. Micro versions are available at Capacity 1 only and have a maximum range of 5 meters.
item.matrix_signal_scanner.desc=The Signal Detector displays the Matrix signal strength of whatever you're aiming at.

