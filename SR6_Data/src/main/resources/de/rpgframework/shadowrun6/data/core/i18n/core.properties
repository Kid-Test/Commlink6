spellfeature.area.desc=LOS(A) means the spell has a line of sight range and also has an area effect, which starts at a two-meter-radius sphere; LOS, meaning the caster needs a physical sight line to the target (optical lenses such as binoculars count as physical line of sight; magical effects and digitized images such as thermographic goggles do not)
spellfeature.direct.desc=Direct Combat spells are when you shape mana in a way that it directly pummels the opposition-the magic is the damage. When you cast a Direct Combat spell, roll Sorcery + Magic opposed by the Willpower + Intuition of the target. Net hits become damage and are added to any Amp Up damage the character chose. Damage from Direct Combat spells is not resisted.
spellfeature.indirect.desc=Rather than having the magic do the pummeling, Indirect Combat spells create an effect that causes the damage-igniting a fireball, say, or sparking a lightning bolt. To cast an Indirect Combat spell, roll Sorcery + Magic vs. Reaction + Willpower. Damage is caster's Magic divided by two (rounded up) + net hits + Amp Up damage. Targets roll their Body to resist this damage, as they would in physical combat. Indirect Combat spells frequently come with elemental effects (see p. 109).
spellfeature.sense_single.desc=Single Sense means an illusion that affects only one sense.
spellfeature.sense_multi.desc=Multi-Sense means an illusion that affects multiple senses.

tradition.hermetic.page = 128
tradition.hermetic = Hermeticism
tradition.hermetic.desc=The interpretations of hermeticism have varied somewhat over the centuries, but Sixth World hermetic beliefs are centered on a single key point: That while magic is not yet fully understood, it is understandable. Hermeticists take a scientific approach to magic, rigorously staging trial after trial, lab test after lab test to build a better understanding of the underpinnings of logic. It should not be surprising that the faculties of the most prominent thaumaturgical universities in the world are heavily staffed by hermetic mages.<br/><br/>\
 Hermeticists see themselves as part of a long, proud tradition of striving to understand the laws undergirding the world and manipulate them. They are more than happy to point out that Isaac Newton’s alchemical studies took up more of his time than his work on physics, and that people like John Dee and Aleister Crowley, who were pushed to the margins of academia, had their reputations dramatically upgraded after the Awakening. Since hermeticists feel they understand magic, they think that puts them ahead of any other branch of academia, since others’ understanding is rooted in this world only. This strongly contributes to their reputation for snobbery and arrogance, a reputation they tend to embrace through the concept that it’s not arrogance if you can back it up.
tradition.shaman.page = 128
tradition.shaman = Shamanism
tradition.shaman.desc=Shamanism has a point it would like to make with regard to hermeticism, and that point is often made with the middle finger. Shamanistic practitioners find hermeticists’ desires to fit everything into some sort of cold, calculated order alternately amusing and infuriating. They slightly adapt an old saying when they claim that writing about magic is like dancing about architecture. Magic is meant to be felt and experienced, not studied in austere labs and boring classrooms. They point out that the very concept of different traditions shows that there is an individualistic bent to magic, and they say the cold equations of hermeticism cannot account for the variety and power they see in different magic expressions.<br/>\
 Followers of the shamanic tradition believe magic is to be experienced and performed, not put under glass. If that occasionally leads to inconsistent results or accidental injury, well, that’s what happens in art, in love, and in so many other parts of life, so why should magic be any different?<br/>\
 Hermeticists tend to see shamans as sloppy and undisciplined, and that’s exactly the way shamans like it.

