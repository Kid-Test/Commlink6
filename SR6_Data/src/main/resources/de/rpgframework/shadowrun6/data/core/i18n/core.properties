item.handheld_housing.desc=Sensors need to be placed in a housing or case of some sort or built into another device. Wall-mounted and handheld sensor housings are also available for your technological perception needs. Not every type of sensor package is capable of holding every sensor. The Sensor Packages table (p. 277) tells you the maximum sensor rating any particular package can hold.
item.wall-mounted_housing.desc=Sensors need to be placed in a housing or case of some sort or built into another device. Wall-mounted and handheld sensor housings are also available for your technological perception needs. Not every type of sensor package is capable of holding every sensor. The Sensor Packages table (p. 277) tells you the maximum sensor rating any particular package can hold.
item.sensor_array.desc=This sensor package includes up to its rating in functions from the Sensor Functions options. Each option is purchased separately when purchasing the array. Sensor arrays have a rating from 2 to 8.
item.single_sensor.desc=This is a sensor that can do only one function listed under Sensor Functions (p. 277). Sensors have a rating from 1 to 8.

