npc.goon.desc=These are the brutes who grew up relying on their size or their anger in order to intimidate others for money or a cause. They typify the standard “angry mob” that gathers at protests to rile one side or the other into violence. Often garbed in the street-scum style of Humanis, or the everyperson-casual of TerraFirst!, they only stay tough until someone gets tough back. Any real combatant, even a decker with a little street time behind him, can usually break these goobers.
npc.shaman.desc=These are the brutes who grew up relying on their size or their anger in order to intimidate others for money or a cause. They typify the standard “angry mob” that gathers at protests to rile one side or the other into violence. Often garbed in the street-scum style of Humanis, or the everyperson-casual of TerraFirst!, they only stay tough until someone gets tough back. Any real combatant, even a decker with a little street time behind him, can usually break these goobers.
npc.go_ganger.desc=Eye-Fivers. Rock Lobsters. Brain Eaters. Red Rovers. Street gangs and go-gangs alike have a rep for working together, but they’re still just gangers.<br/>They’re a step above an angry mob, but not much better. Knee breakers and debt collectors for crime syndicates aren’t much better. They have a rep, they follow orders, and they’ve got some weight behind them pushing them to succeed.
npc.go_ganger.item.gang_leathers.desc=Leather jacket in gang colors.
npc.debt_collector.desc=Eye-Fivers. Rock Lobsters. Brain Eaters. Red Rovers. Street gangs and go-gangs alike have a rep for working together, but they’re still just gangers.<br/>They’re a step above an angry mob, but not much better. Knee breakers and debt collectors for crime syndicates aren’t much better. They have a rep, they follow orders, and they’ve got some weight behind them pushing them to succeed.
npc.brute.desc=Ancients. Cutters. Sons of Sauron. Halloweeners. These are names feared for something more than just random violence (well, maybe that’s exactly why the Halloweeners are feared). They are professional gangs and organizations designed to be the more militant arm of nicer policlubs.<br/>They’ve gotten more time under fire, but they’re still not pros, and they all have enough ego and rep that they push themselves a little harder to keep in the fight.
npc.data_harvester.desc=Ancients. Cutters. Sons of Sauron. Halloweeners. These are names feared for something more than just random violence (well, maybe that’s exactly why the Halloweeners are feared). They are professional gangs and organizations designed to be the more militant arm of nicer policlubs.<br/>They’ve gotten more time under fire, but they’re still not pros, and they all have enough ego and rep that they push themselves a little harder to keep in the fight.
