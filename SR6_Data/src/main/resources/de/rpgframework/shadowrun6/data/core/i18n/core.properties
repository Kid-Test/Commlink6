#Electronic Accessories
item.ar_gloves=AR gloves
item.ar_gloves.page=268
item.ar_gloves.desc=These hand coverings come in a myriad of styles and allow you to manually interact with the Matrix in Augmented Reality (AR) mode, letting you “touch” and “hold” AROs and receiving tactile force-feedback. AR gloves can provide the exact weight and temperature of touched or held objects.
item.ar_gloves.wifi=The gloves offer a chemical analysis feature that will identify the composition of a held object.
item.biometric_reader=Biometric reader
item.biometric_reader.page=268
item.biometric_reader.desc=This handheld device can be used for fingerprints, retina scans, voice patterns, and tongue prints. You can use it to lock your electronics so only you (or one of your body parts) can unlock it.
item.electronic_paper=Electronic paper
item.electronic_paper.page=268
item.electronic_paper.desc=A thin electronic sheet ranging from sticky note to poster sized that can be folded or rolled up. It displays images, text, data, and video and can act as a touchscreen. It’s basically an ultrathin monitor. All electronic paper is wireless and can be written on or erased wirelessly.
item.printer=Printer
item.printer.page=268
item.printer.desc=In case you need something in hardcopy, this full-color printer comes attached to a paper supply.
item.satellite_link=Satellite link
item.satellite_link.page=268
item.satellite_link.desc=This allows the user to uplink to communication satellites in low-Earth orbit, connecting to the Matrix from places where no local wireless networks exist (which is rare but unfortunately extant). This link limits noise due to distance to a maximum –5 penalty. Includes a portable satellite dish.
item.sim_module=SIM module
item.sim_module.page=268
item.sim_module.desc=This internal upgrade gives you the full simsense experience. It allows you to directly experience simsense programs, full-sensory augmented reality, and virtual reality. A sim module must be accessed via a direct neural interface, be it trodes, a datajack, or an implanted commlink. Sim modules can be modified for hot-sim, which opens up the full range of VR experiences at the risk of frying your brain.
item.sim_module_hot=SIM module (hot)
item.sim_module_hot.page=268
item.sim_module_hot.desc=This internal upgrade gives you the full simsense experience. It allows you to directly experience simsense programs, full-sensory augmented reality, and virtual reality. A sim module must be accessed via a direct neural interface, be it trodes, a datajack, or an implanted commlink. <br/>Sim modules can be modified for hot-sim, which opens up the full range of VR experiences at the risk of frying your brain.
item.simrig=Simrig
item.simrig.page=268
item.simrig.desc=This simsense recorder can record experience data (sensory and emotive) from you or whoever is wearing it. Simrig rigs are used to make most of the simsense chips sold on the market. You’ll need to have a working sim module (with the DNI interface) to make a recording.
item.simrig.variant.cyberware=Implanted
item.simrig.variant.cyberware.desc=This simsense recorder can record experience data (sensory and emotive) from you or whoever is wearing it. Simrig rigs are used to make most of the simsense chips sold on the market. You’ll need to have a working sim module (with the DNI interface) to make a recording.
item.trid_projector=Trid projector
item.trid_projector.page=268
item.trid_projector.desc=This device projects a 3-D hologram into a five-meter cube next to or above the device. The hologram can be made to look realistic, but unless you’re really artistic about it, it will be obvious it’s just trid.
item.subvocal_microphone=Subvocal microphone
item.subvocal_microphone.page=268
item.subvocal_microphone.desc=A skin-colored patch with a microphone attached with adhesive to your throat. It lets you communicate via subvocalized speech. Those attempting to overhear your conversation can neither gain nor spend Edge on their Perception test.
item.trodes=Trodes
item.trodes.page=268
item.trodes.desc=This electrode-and-ultrasound net gives you a DNI, or direct neural interface, connection. It can be any style of headband, hat, or headware, along with being able to integrate into existing headware, like a helmet or stylish fedora.
item.standard_tag=Standard RFID Tag (10x)
item.standard_tag.desc=These tiny computer chips, commonly called arfids, are stuffed into every product commercially available in the Sixth World. Tags integrated into many products—bullets, for example—are microscopic, but commercially available tags range from two-millimeter squares to three-centimeter squares. They have a stick-to-anything adhesive backing, and the truly small ones can be tricky to spot. Tags are used for geo-tagging locations and objects, leaving a virtual AR message for anyone who comes by, employee tracking, access control, owner-contact information for everything from vehicles to pets, vehicle and weapon registration, and so on. They can also be used as tracking devices, periodically transmitting GPS data to the Matrix.<br/>\
 RFID tags are devices that can hold one or more files, but not much else. The physical location of a tag can be found via the Matrix (Trace Icon, p. 184). Tag data can be erased with a tag eraser (p. 270) or programmed with an Edit File action (p. 181). RFID tags have owners like all other devices, but unlike other devices a tag’s owner can be changed to “nobody.”
item.standard_tag.page=269
item.datachip=Datachip
item.datachip.page=269
item.datachip.desc=Used to store data offline, a single datachip can hold an enormous quantity of data in a two-centimeter-by-six-centimeter chip. Datachips have no wireless capability, so you need to plug them into a universal data connector (found on any device) if you want to read or write to them.
item.security_tag=Security tag
item.security_tag.page=269
item.security_tag.desc=Used to track people and things, security tags are usually implanted under the skin. Megacorps use them to track citizens for good or ill (but, you know, mostly ill), prison corps use them to track incarcerated and paroled criminals, and parents and schools also use them to track students. Security tags cannot be erased with a tag eraser due to EMP hardening. If a tag is implanted under the skin, a Biotech + Logic (10, 1 minute) Extended test is needed to remove it.
item.security_tag.variant.stealth_tag=Stealth
item.security_tag.variant.stealth_tag.desc=The stealth tag variant always runs silent (p.178), rolling 10 dice in the opposed Matrix Perception test. They only transmit their data at preset times in a quick burst. They are often disguised as other objects or hidden in them.
item.sensor_tag=Sensor Tag
item.sensor_tag.page=269
item.sensor_tag.desc=Used to record twenty-four hours of data from a single sensor (sold separately) of up to rating 2 (Sensors, p. 276). After twenty-four hours, it will either shut off or overwrite data older than twenty-four hours, depending on how you programmed it. Retrieving the information can be done only within a meter of the tag unless its wireless functionality is enabled.
item.sensor_tag-wifi=You can monitor the data in real time, if you’re the tag’s owner. The tag’s recordings can be transferred to another means of storage.
item.bug_scanner=Bug Scanner
item.bug_scanner.page=269
item.bug_scanner.desc=This device locates wireless devices within twenty meters. The scanner measures a signal’s strength to pinpoint its location. To operate a bug scanner, roll Electronics + Logic as an Opposed Matrix Perception test. If you get any net hits at all, you find the device.
item.bug_scanner.wifi=You gain 2 free hits on the test and only need to tie the Opposed test, not achieve a net hit.
item.data_tap=Data tap
item.data_tap.page=269
item.data_tap.desc=Connect this hacking tool to a data cable and you get a direct connection with the devices on either end of the cable and vice versa. Noise is no longer a factor—as long as you stay attached. The tap can be removed without damaging the cable.
item.data_tap.wifi=The data tap can be wirelessly commanded to self-destruct as a Minor Action, immediately and instantly severing the direct connection. The user can choose whether this damages the cable and breaks the wired connection between the devices or leaves the cable intact and simply severs their connection to the devices, leaving only a black dust behind.
item.headjammer=Headjammer
item.headjammer.desc=The headjammer is used to neutralize implanted commlinks and cyberdecks. Once attached to the location of the device, it works in the same way as any other jammer but limits its effect to your implanted device. <br/>Removing a headjammer from someone without the proper key requires an Electronics + Logic or an Engineering + Agility (10, 1 Major Action) Extended test. Removing a headjammer from yourself is an Athletics + Agility (5) test, requiring a Major Action. Failure to succeed in any of these actions could activate any additional anti-tamper devices this jammer may be attached to.<br/>Headjammers are available with ratings from 1 to 6.
item.headjammer.page=269
item.jammer=Jammer
item.jammer.page=270
item.jammer.desc=This device floods the airwaves with electromagnetic jamming signals to block out wireless and radio communication. The jammer generates noise equal to its Device Rating. The area jammer affects a spherical area—its rating is reduced by 1 for every 10 meters from the center. The directional jammer affects a conical area with a thirty-degree spread—its rating is reduced by 1 for every 30 meters from the center. The jammer only affects devices that are within the jamming area, but it affects all of them. Walls and other obstacles may prevent the jamming signal from spreading or reduce its effect (gamemaster’s discretion).
item.jammer.wifi=You can set your jammer to not interfere with devices and personas you designate.
item.jammer.variant.area=Area
item.jammer.variant.direct=Directional
item.jammer.variant.area.desc=This device floods the airwaves with electromagnetic jamming signals to block out wireless and radio communication. The jammer generates noise equal to its Device Rating. The area jammer affects a spherical area—its rating is reduced by 1 for every 10 meters from the center.The jammer only affects devices that are within the jamming area, but it affects all of them. Walls and other obstacles may prevent the jamming signal from spreading or reduce its effect (gamemaster’s discretion).
item.jammer.variant.direct.desc=This device floods the airwaves with electromagnetic jamming signals to block out wireless and radio communication. The jammer generates noise equal to its Device Rating. The directional jammer affects a conical area with a thirty-degree spread—its rating is reduced by 1 for every 30 meters from the center. The jammer only affects devices that are within the jamming area, but it affects all of them. Walls and other obstacles may prevent the jamming signal from spreading or reduce its effect (gamemaster’s discretion).
item.micro-transceiver=Micro-transceiver
item.micro-transceiver.page=270
item.micro-transceiver.desc=This short-range communicator doesn’t do anything special—it just lets you communicate by voice with other micro-transceivers and commlinks that you link together, within a kilometer. The micro-transceiver consists of an earbud and an adhesive subvocal microphone (p. 268). <br/>A micro-tranceiver has a Device Rating of 2 and is best used slaved to a better device when used for secure communications.
item.tag_eraser=Tag eraser
item.tag_eraser.page=270
item.tag_eraser.desc=This handheld device creates an electromagnetic pulse for burning out RFID tags and other unshielded electronics. To use it, bring the eraser within five millimeters of any electronic device and push the button, instantly delivering 10 boxes of Matrix damage (resisted normally). The short range makes it impossible to use on targets such as vehicles, most drones, maglocks, and cyberware. The tag eraser has one charge but can be fully recharged in ten seconds if plugged in.
item.tag_eraser.wifi=The tag eraser recharges fully in an hour by induction.
item.white_noise_generator=White noise generator
item.white_noise_generator.page=270
item.white_noise_generator.desc=This device creates a field of random noise that inhibits audio surveillance. All Perception tests to overhear a conversation within (rating) meters of a white noise generator receive a negative dice pool modifier equal to the generator’s rating. If more than one generator is in use, only count the highest rating. A white noise generator is redundant in a noisy environment (such as a nightclub or a firefight).
item.white_noise_generator.wifi=As the device scans and chirps out local noise, the white noise generator’s effective radius is tripled.

#Software
item.datasoft=Datasoft
item.datasoft.page=271
item.datasoft.desc=Datasofts are like mini-library sections. Each holds a database on a specific subject (i.e., a Knowledge skill). An appropriate datasoft provides you with a narrow version of a Knowledge skill—for example, since Seattle Gangs is a Knowledge skill, a datasoft might cover the Ancients or the Halloweeners, or might just focus on Puyallup gangs. The datasoft is then used the same as a Knowledge skill (p. 97).
item.mapsoft=Mapsoft
item.mapsoft.page=271
item.mapsoft.desc=Mapsofts are downloaded data featuring detailed information about a single specific area approximately 5,000 square kilometers. It includes everything: streets, business/residential listings, topographical, census, GPS, and environmental data. An interactive interface allows you to quickly determine the best routes and directions, locate the nearest spot of your choice, or create your own customized maps.<br/>If a wireless link is maintained, the map automatically self-updates with the latest data from GridGuide. Of course, this feature also means that the mapsoft can be used to track your location. Mapsofts add a +1 dice pool bonus on any test to find directions.
item.shopsoft=Shopsoft
item.shopsoft.page=271
item.shopsoft.desc=Shopping programs like Clothes Horse, Caveat Emptor, and Guns Near Me provide pricing breakdowns and user reviews for comparison shopping purposes for standard goods. An appropriate shopsoft—one exists for each type of product like electronics, firearms, melee weapons, armor, etc.—provides a +1 dice pool bonus to Matrix Search tests you make to buy and sell items.
item.knowsoft=Knowsofts
item.knowsoft.page=272
item.knowsoft.desc=Knowsofts replicate Knowledge skills, actively overwriting the user’s knowledge with their own data. Knowsofts must be accessed with a skilljack, and the number you can use at once is limited by the skilljack rating. Knowsofts, like Knowledge skills, do not have ratings.
item.linguasoft=Linguasoft
item.linguasoft.page=272
item.linguasoft.desc=Linguasofts replicate language skills, allowing a user to speak a foreign language. Linguasofts must be accessed with a skilljack, and the number you can use at once is limited by the skilljack rating. Linguasoft ratings are equal to Language skill abilities as follows: 1 = basic language facility, 2 = language specialist, 3 = language expert, 4 = language expert. Linguasofts cannot go above rating 4.
item.tutorsoft=Tutorsoft
item.tutorsoft.page=272
item.tutorsoft.desc=These virtual private tutors aid you in learning a specific skill. The tutorsoft makes Instruction tests with a dice pool equal to its rating x 2. Tutorsofts cannot teach skills based on Magic or Resonance, and they are available in ratings from 1 to 6.
item.activesoft=Activesoft
item.activesoft.page=272
item.activesoft.desc=Activesofts replace physical active skills, basically every active skill that isn’t based on Magic or Resonance. A skillwire system (p. 287) is needed to translate the muscle memory data properly. The limit to the number of skills you can use at once is based on the skillwire’s rating.

#IDs, Creds and Tools
item.credstick_standard=Credstick Standard
item.credstick_standard.page=272
item.credstick_standard.desc=Untraceable funds for the late twenty-first century. A certified credstick is not registered to any specific person. The funds encoded on it belong to the holder, requiring no special ID or authorization to use, which means they can be stolen, but who’s going to mug a runner? To use them, you have to slot them into a universal data connector to transfer cash onto or off of them. This makes them enduringly popular with shadowrunners and the Mr. Johnsons who love to hire them. <br/>Each color of credstick can only hold up to a certain amount of money. This figure is the maximum amount the stick can be loaded with, not the amount it always has on it. The only external identifier of a type of stick is a narrow band on the case, which is often scraped off on the streets to hide the type of stick during transactions.
item.credstick_silver=Credstick Silver
item.credstick_silver.page=272
item.credstick_silver.desc=Untraceable funds for the late twenty-first century. A certified credstick is not registered to any specific person. The funds encoded on it belong to the holder, requiring no special ID or authorization to use, which means they can be stolen, but who’s going to mug a runner? To use them, you have to slot them into a universal data connector to transfer cash onto or off of them. This makes them enduringly popular with shadowrunners and the Mr. Johnsons who love to hire them. <br/>Each color of credstick can only hold up to a certain amount of money. This figure is the maximum amount the stick can be loaded with, not the amount it always has on it. The only external identifier of a type of stick is a narrow band on the case, which is often scraped off on the streets to hide the type of stick during transactions.
