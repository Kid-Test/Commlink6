action.assist.desc=You can become a helper on a Teamwork test, working to help one of your teammates on some task (see Teamwork Tests, p. 36).
action.astral_projection.desc=A character capable of Astral Projection (full magician or aspected magician) may shift their consciousness to or from the astral plane as a Major Action. The process is complete the moment the action is declared and therefore places them on the astral plane immediately, including for the remainder of the current combat round.
action.attack.desc=A character may perform one of a variety of forms of attack with this Major Action. See the Combat chapter (p. 104) for more details.
action.banish_spirit.desc=Any character may attempt a Banishing on with a spirit as a Major Action (see Banishing, p. 147).
action.cast_spell.desc=A character may cast a spell as a Major Action. For details on how, see Spells (p. 130).
action.cleanse.desc=Awakened characters use this action to erase traces of their magic activity (see p. 160).
action.full_defense.desc=A character can add their Willpower to all Defense tests until their next combat round.
action.manifest.desc=Characters who are astrally projecting use this action to appear as a ghostly form (see p. 160).
action.observe_in_detail.desc=A character may make a detailed observation by
taking a Major Action. This action allows a Perception test (see Perception, p. 96) or Assensing test (p. 159). This action is intended for determining details that may be obscured due to the pace and rigors of combat. It is assumed that everyone engaged in a combat is aware of the presence of everyone else, barring the use of Stealth or obscuring magic, but not necessarily details of their gear or equipment, and in some particularly hectic or rushed circumstances, the identity of individuals. In the midst of a hectic gunfight/brawl in the dark, the winner of the brawl, who is now sprinting toward your character, may not be identifiable without an Observe in Detail action.
action.pick_updown.desc=A character may pick up an object within reach or put down one that they were holding as a Major Action. This action means care is taken to put the object down or pick it up. If the picked-up object is a weapon, this counts as readying the weapon.
action.ready_weapon.desc=A character may ready a weapon by using this action. This includes drawing and readying a firearm; pulling a melee weapon from a sheath or pocket; taking out and readying a grenade or throwing knife; or any other kind of weapon preparation. Almost all weapons require this action before they are ready for use, though many times it occurs before combat even starts. <br/>Small weapons such as throwing knives and shuriken can be readied in bunches, with a total number equal to the character's Agility attribute pulled into the character's off-hand with a single Ready Weapon action.
action.reload_weapon.desc=Weapons without a smartlink, or weapons where the smartlink is currently disengaged, require a Major Action to reload. Reloading a weapon refills the weapon to its maximum capacity as long as the character has sufficient ammunition to do so.
action.rigger_jump_in.desc=A character with a vehicle control rig (VCR) and rigger-adapted vehicle or drone or a rigger command console (RCC) may jump in to control the vehicle or operate the RCC with a Major Action.
action.sprint.desc=A character may move at a Sprint with this Major Action. Movement starts at 15 meters and is increased by 1 meter per hit on an Athletics + Agility Test. Only one Sprint Action is allowed per player turn, and it cannot be performed in the same turn as a Move action or Avoid Incoming action.
action.summon_spirit.desc=A character capable of summoning may use a Major Action to summon a spirit to assist them. A spirit that is already summoned is controlled using the Command Spirit Minor Action.
action.use_simple.desc=A character can use any simple device with a Major Action. Simple devices are those that are activated with a simple movement like a thumb trigger, pressing a single key, or tapping a single icon. It takes longer to interact with more complex devices, with required time being up to the gamemaster or listed with the description of specific gear. Remember, a device connected via a DNI-enabled system uses the Minor Action.
action.use_skill.desc=A character may use an appropriate skill by using a Major Action (see Skills, p. 92).
action.boosted_defense.desc=This is the pre-emptive defense, where spellcasters try to block an incoming spell. To use it, characters take a Counterspell Major Action and roll a Sorcery + Magic test. At its base, the action affects a sphere in the caster's LOS with a two-meter radius (the radius can be increased by 1 meter per dram of reagents spent). Net hits on the test are added to the dice pool of anyone in the area to defend against any spells. This boost lasts for a number of combat rounds equal to the Magic of the spellcaster.
action.dispelling.desc=This is for use against spells that are sustained or otherwise have ongoing effects. The character chooses the Counterspell action and then rolls Sorcery + Magic vs. Drain Value of the spell x 2 (including any adjustments made to the spell when it was cast). Net hits on this test cancel net hits on the spell on a one-to-one basis; when net hits reach zero, the spell is completely dispelled.

