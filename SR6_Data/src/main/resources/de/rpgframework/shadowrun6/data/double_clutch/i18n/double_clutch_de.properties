item.road_strip.desc=Sperrbänder gibt es in verschiedenen Ausführungen.
item.road_strip.variant.spikes.desc=Dieses Sperrband ist am weitesten verbreitet und besteht aus spitzen Nägeln, die die Reifen eines darüberfahrenden Fahrzeugs beschädigen sollen. Die Reifen werden sofort platt, wenn sie keine Notlaufreifen sind (s. Notlaufreifen). Der Fahrer muss sofort eine Crashprobe ablegen, um einen Unfall zu vermeiden. Auch wenn der Unfall vermieden wird, erhöhen platte Reifen das Handling eines Bodenfahrzeugs um 3.
item.road_strip.variant.tracking.desc=Das Verfolgungssperrband ist ein durchsichtiges, schwer zu entdeckendes Band (der Schwellenwert für Wahrnehmungsproben beträgt 5) mit einer Reihe kleiner Explosivkapseln, die Spionage-Chips (SR6, S. 270) enthalten. Wenn ein Fahrzeug über dieses Sperrband fährt, detoniert eine Kapsel und schleudert einen Klacks Kleber mit einem Spionage-Chip gegen den Unterboden des Fahrzeugs. Ein Verfolgungssperrband enthält ausreichend Kapseln und Chips, um die ersten zehn Fahrzeuge zu treffen, die darüberfahren.
item.road_strip.variant.zapper.desc=Dieses Sperrband besitzt Hunderte winzige „Fühler“, die nach oben abstehen und über den Boden eines darüberfahrenden Fahrzeugs streichen. Wenn das geschieht, gibt das Band einen kräftigen elektrischen Impuls an das Fahrzeug ab. Ein Fahrzeug, das über ein Schockersperrband fährt, erleidet 8 Kästchen Elektrizitätsschaden. Ein Schockersperrband kann zehn Impulse abgeben, bevor es nachgeladen werden muss.
item.emergency_lightbars.desc= Wenn du willst, dass alle Zivilisten aus dem Weg gehen, oder wenn du dich als DocWagon oder Lone Star ausgeben willst, oder wenn diese Pizza einfach dringend rechtzeitig geliefert werden muss, brauchst du das hier.  Diese Fahrzeugausstattung enthält ausfahrbare Lichtbalken, ein verstecktes Martinshorn, einen AR-Sender und einen Schleierchip, der das GridGuide-System dazu bringt, dich für ein echtes Einsatzfahrzeug zu halten.
item.distinctive_features.desc=Die expressivste Ausstattung, die man haben kann. Besitzer verändern ihre Fahrzeuge oft aus rein kosmetischen Gründen und bauen radikale Modifikationen ein, die keinem praktischen Zweck dienen. Auffällige Merkmale gewähren 1 Edge bei sozialen Proben, bei denen allerdings einer der Würfel durch den Schicksalswürfel ersetzt werden muss. Außerdem erhält ein Beobachter dadurch 1 Edge, wenn er versucht, sich an das Fahrzeug zu erinnern.
item.oil_slick_sprayer.desc=(Nur Bodenfahrzeuge) Das Aktivieren des Ölsprühers erfordert eine Nebenhandlung. Danach erhalten verfolgende Bodenfahrzeuge +3 auf ihr Handling, wenn sie der Ölspur nicht ausweichen. Der Ölspur kann mit einer Crashprobe (SR6, S. 200) ausgewichen werden. Der Ölsprüher hat sechs Ladungen und kann für 50 Nuyen vollständig mit handelsüblichen Schmiermitteln nachgefüllt werden.
item.road_strip_ejector.desc=(Nur Bodenfahrzeuge) Straßensperrbänder sind Myomerbänder, die sich nach dem Auswerfen über etwa vier Fahrspuren ausdehnen und je nach ihrer Art bei Fahrzeugen, die darüberfahren, verschiedene Wirkungen auslösen. Der Sperrbandwerfer verwendet einen einfachen Auswurfmechanismus, der mit einer Nebenhandlung ausgelöst wird. Er kann sechs einzelne Sperrbänder aufnehmen und mit beliebigen Kombinationen aus Sperrbändern bestückt werden. Einzelne Sperrbänder können mit einer Nebenhandlung auch manuell abgeworfen und per WiFi ausgelöst werden.
item.searchlight.desc=Ein Suchscheinwerfer ist ein lichtstarker Strahler, der außen am Fahrzeug angebracht ist. Er kann an dem Punkt, an dem er montiert ist, um 360 Grad gedreht werden. Er kann ferngesteuert oder, wenn er physisch erreichbar ist, manuell bedient werden. Sein Lichtkegel reicht dreimal so weit wie der einer gewöhnlichen Taschenlampe.
item.searchlight.variant.regular.desc=Ein Suchscheinwerfer ist ein lichtstarker Strahler, der außen am Fahrzeug angebracht ist. Er kann an dem Punkt, an dem er montiert ist, um 360 Grad gedreht werden. Er kann ferngesteuert oder, wenn er physisch erreichbar ist, manuell bedient werden. Sein Lichtkegel reicht dreimal so weit wie der einer gewöhnlichen Taschenlampe.
item.searchlight.variant.low.desc=Ein Suchscheinwerfer ist ein lichtstarker Restlicht-Strahler, der außen am Fahrzeug angebracht ist. Er kann an dem Punkt, an dem er montiert ist, um 360 Grad gedreht werden. Er kann ferngesteuert oder, wenn er physisch erreichbar ist, manuell bedient werden. Sein Lichtkegel reicht dreimal so weit wie der einer gewöhnlichen Restlicht-Taschenlampe.
item.searchlight.variant.thermo.desc=Ein Suchscheinwerfer ist ein lichtstarker Infrarot-Strahler, der außen am Fahrzeug angebracht ist. Er kann an dem Punkt, an dem er montiert ist, um 360 Grad gedreht werden. Er kann ferngesteuert oder, wenn er physisch erreichbar ist, manuell bedient werden. Sein Lichtkegel reicht dreimal so weit wie der einer gewöhnlichen IR-Taschenlampe.
item.smoke_projector.desc=Ein oder zwei Kanister mit Aerosolsprühdüse werden am Fahrzeug angebracht. Sie werden mit einer Nebenhandlung aktiviert und geben eine riesige Wolke aus dichtem Rauch ab. Diese Wolke behindert die Sicht und verursacht bei jedem, der durch den Rauch hindurch handelt, den Status Geblendet I, und für jeden, der von innerhalb des Rauchs zu handeln versucht, den Status Geblendet II. Wenn das Fahrzeug stationär bleibt oder sich langsam bewegt, hat die Wolke Radius 5 (s. Gasangriffe, SR6, S. 120). Wenn sich das Fahrzeug mit Straßengeschwindigkeit bewegt, wird die Wolke länger, sodass sie nur 5 Meter breit ist, sich aber bis zu 100 Meter weit hinter dem Fahrzeug erstreckt. Jeder Kanister kann 10 Minuten lang Rauch spucken, bevor er nachgefüllt werden muss.
item.smoke_projector.variant.regular.desc=Ein oder zwei Kanister mit Aerosolsprühdüse werden am Fahrzeug angebracht. Sie werden mit einer Nebenhandlung aktiviert und geben eine riesige Wolke aus dichtem Rauch ab. Diese Wolke behindert die Sicht und verursacht bei jedem, der durch den Rauch hindurch handelt, den Status Geblendet I, und für jeden, der von innerhalb des Rauchs zu handeln versucht, den Status Geblendet II. Wenn das Fahrzeug stationär bleibt oder sich langsam bewegt, hat die Wolke Radius 5 (s. Gasangriffe, SR6, S. 120). Wenn sich das Fahrzeug mit Straßengeschwindigkeit bewegt, wird die Wolke länger, sodass sie nur 5 Meter breit ist, sich aber bis zu 100 Meter weit hinter dem Fahrzeug erstreckt. Jeder Kanister kann 10 Minuten lang Rauch spucken, bevor er nachgefüllt werden muss.
item.smoke_projector.variant.thermo.desc=Ein oder zwei Kanister mit Aerosolsprühdüse werden am Fahrzeug angebracht. Sie werden mit einer Nebenhandlung aktiviert und geben eine riesige Wolke aus dichtem Rauch ab. Diese Wolke behindert die Sicht und verursacht bei jedem, der durch den Rauch hindurch handelt, den Status Geblendet I, und für jeden, der von innerhalb des Rauchs zu handeln versucht, den Status Geblendet II. Wenn das Fahrzeug stationär bleibt oder sich langsam bewegt, hat die Wolke Radius 5 (s. Gasangriffe, SR6, S. 120). Wenn sich das Fahrzeug mit Straßengeschwindigkeit bewegt, wird die Wolke länger, sodass sie nur 5 Meter breit ist, sich aber bis zu 100 Meter weit hinter dem Fahrzeug erstreckt. Jeder Kanister kann 10 Minuten lang Rauch spucken, bevor er nachgefüllt werden muss.
item.gas_dispersal.desc=Toxine brauchen stärker spezialisierte Lager- und Abgabemethoden als die bei Rauchgeneratoren eingesetzten Gase. Dieses System kann bis zu 20 Dosen eines Toxins enthalten. Wenn es aktiviert wird, setzt es 5 Dosen frei und erzeugt damit eine Gaswolke mit Radius 2 (s. Gasangriffe, SR6, S. 120). Das Auslösen des Systems erfordert eine Nebenhandlung. Man kann auch eine Diebstahlsicherung Stufe 3 dazu benutzen, dieses System im Fall eines Alarms zu aktivieren.
item.spoof_kit.desc=Das Täuschungskit mit seinem Smart-Nummernschild, seinem Schleierchip und dem ID-nachahmenden Algorithmus ist für einen Runner genauso wichtig wie eine gute gefälschte SIN. Es ahmt das normale Identifikationssignal eines Fahrzeugs nach, indem es einen Zufallswert generiert, der authentisch wirkt, und das Kennzeichen verändert sich passend zu der falschen Identität. Das System hält einer aktiven Überprüfung nicht stand, aber es ist besser, als eine mit der eigenen (echten oder gefälschten) SIN verbundene Datenspur in den Verkehrssensoren zu hinterlassen. Man kann die vorgetäuschte Identität jederzeit mit einer Nebenhandlung verändern oder das Kit so einstellen, dass es das in regelmäßigen Abständen selbst tut. Ein Täuschungskit kann nicht für mehrere Fahrzeuge oder Drohnen gleichzeitig genutzt werden.

item.tires_small.desc=Spezialreifen (Drone/Motorrad)
item.tires_large.desc=Spezialreifen (PKW)
item.tires_small.variant.offroad.desc=Wenn diese Reifen aufgezogen sind und im Gelände benutzt werden, verbessern sie die Beschleunigung um +5 und das Geschwindigkeitsintervall um +10. Das Unangenehme ist, dass sich diese Veränderung beim Fahren auf der Straße umkehrt (Beschleunigung -5 und Geschwindigkeitsintervall -10).
item.tires_small.variant.offroad_runflat.desc=Wenn diese Reifen aufgezogen sind und im Gelände benutzt werden, verbessern sie die Beschleunigung um +5 und das Geschwindigkeitsintervall um +10. Das Unangenehme ist, dass sich diese Veränderung beim Fahren auf der Straße umkehrt (Beschleunigung -5 und Geschwindigkeitsintervall -10). Diese verbesserte Version der Reifen funktioniert auch nach einem Druckverlust weiter.
item.tires_small.variant.racing.desc=Wenn diese Reifen aufgezogen sind und auf der Straße benutzt werden, verbessern sie die Beschleunigung um +5 und das Geschwindigkeitsintervall um +10. Im Gelände kehrt sich diese Veränderung um (Beschleunigung -5 und Geschwindigkeitsintervall -10).
item.tires_small.variant.racing_runflat.desc=Wenn diese Reifen aufgezogen sind und auf der Straße benutzt werden, verbessern sie die Beschleunigung um +5 und das Geschwindigkeitsintervall um +10. Im Gelände kehrt sich diese Veränderung um (Beschleunigung -5 und Geschwindigkeitsintervall -10).
item.tires_small.variant.runflat.desc=Diese bei Shadowrunnern weit verbreiteten Reifen sind Allzweckreifen, die auf und abseits der Straße gleich gut funktionieren. Sie sind eine verbesserte Version der Standardreifen und funktionieren auch nach einem Druckverlust weiter.
item.tires_small.variant.smart.desc=Smartreifen nutzen ein Nanotech-Material, das den Reifen an die herrschenden Fahrbedingungen anpasst. Im Geländemodus werden die Reifen breiter und die Profile tiefer, sodass dieselbe Wirkung wie bei Geländereifen eintritt, auf der Straße hingegen werden die Reifen glatter und steifer und entwickeln die Wirkung von Rennreifen. Alle Smartreifen sind bis zu einem gewissen Grad selbstreparierend, was ihnen wie Notlaufreifen ein weiteres Funktionieren nach einem Druckverlust ermöglicht.
item.tires_small.variant.shredders.desc=Draußen in den Barrens verdienst du damit vielleicht ein paar Stilpunkte, aber überall sonst sind sie illegal. Warum? Vor allem weil Schredder nach dem Ring scharfer Metallklingen oder Spitzen benannt sind, der in ihre Flanken eingebaut ist. Diese Reifen addieren das Rumpf-Attribut des Fahrzeugs zum Angriffswert, wenn ein Nicht-Fahrzeug gerammt wird, und die Hälfte des Rumpf-Attributs, wenn ein anderes Fahrzeug gerammt wird.
item.tires_large.variant.offroad.desc=Wenn diese Reifen aufgezogen sind und im Gelände benutzt werden, verbessern sie die Beschleunigung um +5 und das Geschwindigkeitsintervall um +10. Das Unangenehme ist, dass sich diese Veränderung beim Fahren auf der Straße umkehrt (Beschleunigung -5 und Geschwindigkeitsintervall -10).
item.tires_large.variant.offroad_runflat.desc=Wenn diese Reifen aufgezogen sind und im Gelände benutzt werden, verbessern sie die Beschleunigung um +5 und das Geschwindigkeitsintervall um +10. Das Unangenehme ist, dass sich diese Veränderung beim Fahren auf der Straße umkehrt (Beschleunigung -5 und Geschwindigkeitsintervall -10). Diese verbesserte Version der Reifen funktioniert auch nach einem Druckverlust weiter.
item.tires_large.variant.racing.desc=Wenn diese Reifen aufgezogen sind und auf der Straße benutzt werden, verbessern sie die Beschleunigung um +5 und das Geschwindigkeitsintervall um +10. Im Gelände kehrt sich diese Veränderung um (Beschleunigung -5 und Geschwindigkeitsintervall -10).
item.tires_large.variant.racing_runflat.desc=Wenn diese Reifen aufgezogen sind und auf der Straße benutzt werden, verbessern sie die Beschleunigung um +5 und das Geschwindigkeitsintervall um +10. Im Gelände kehrt sich diese Veränderung um (Beschleunigung -5 und Geschwindigkeitsintervall -10). Diese verbesserte Version der Reifen funktioniert auch nach einem Druckverlust weiter.
item.tires_large.variant.runflat.desc=Diese bei Shadowrunnern weit verbreiteten Reifen sind Allzweckreifen, die auf und abseits der Straße gleich gut funktionieren. Sie sind eine verbesserte Version der Standardreifen und funktionieren auch nach einem Druckverlust weiter.
item.tires_large.variant.smart.desc=Smartreifen nutzen ein Nanotech-Material, das den Reifen an die herrschenden Fahrbedingungen anpasst. Im Geländemodus werden die Reifen breiter und die Profile tiefer, sodass dieselbe Wirkung wie bei Geländereifen eintritt, auf der Straße hingegen werden die Reifen glatter und steifer und entwickeln die Wirkung von Rennreifen. Alle Smartreifen sind bis zu einem gewissen Grad selbstreparierend, was ihnen wie Notlaufreifen ein weiteres Funktionieren nach einem Druckverlust ermöglicht.
item.tires_large.variant.shredders.desc=Draußen in den Barrens verdienst du damit vielleicht ein paar Stilpunkte, aber überall sonst sind sie illegal. Warum? Vor allem weil Schredder nach dem Ring scharfer Metallklingen oder Spitzen benannt sind, der in ihre Flanken eingebaut ist. Diese Reifen addieren das Rumpf-Attribut des Fahrzeugs zum Angriffswert, wenn ein Nicht-Fahrzeug gerammt wird, und die Hälfte des Rumpf-Attributs, wenn ein anderes Fahrzeug gerammt wird.
item.modslot_chassis_to_elec.desc=Verfügbare Modifikationsslots für Chassis, Antrieb und Elektronik können im Verhältnis 2:1 dauerhaft in eine andere Kategorie übertragen werden. Man erhält also für jeweils 2 Slots der Ursprungskategorie 1 Slot der Zielkategorie.
item.modslot_chassis_to_pp.desc=Verfügbare Modifikationsslots für Chassis, Antrieb und Elektronik können im Verhältnis 2:1 dauerhaft in eine andere Kategorie übertragen werden. Man erhält also für jeweils 2 Slots der Ursprungskategorie 1 Slot der Zielkategorie.


item.easy_assembly.desc=Fahrzeuge können in ein handliches Paket gefaltet oder in einige kleinere, leichtere Pakete zerlegt werden, die man mitnehmen und an einem anderen Ort wieder zusammenbauen kann. Wenn in einer gesicherten Anlage nach unerwünschten Geräten wie kleinen Überwachungsdrohnen gesucht wird, kannst du das umgehen, indem du eine Minidrohne in ein paar nicht identifizierbare Teile zerlegst, die du einzeln reinschmuggelst.  Das Zerlegen bzw. Zusammenbauen eines Fahrzeugs erfordert eine Ausgedehnte Probe auf Mechanik + Logik (modifiziertes Rumpf-Attribut des Fahrzeugs, 1 Minute). Wenn Mikrodrohnen oder Minidrohnen zerlegt werden, sind die Einzelteile ohne eine passende Wissensfertigkeit extrem schwer zu erkennen.
item.easy_assembly_micro.desc=Fahrzeuge können in ein handliches Paket gefaltet oder in einige kleinere, leichtere Pakete zerlegt werden, die man mitnehmen und an einem anderen Ort wieder zusammenbauen kann. Wenn in einer gesicherten Anlage nach unerwünschten Geräten wie kleinen Überwachungsdrohnen gesucht wird, kannst du das umgehen, indem du eine Minidrohne in ein paar nicht identifizierbare Teile zerlegst, die du einzeln reinschmuggelst.  Das Zerlegen bzw. Zusammenbauen eines Fahrzeugs erfordert eine Ausgedehnte Probe auf Mechanik + Logik (modifiziertes Rumpf-Attribut des Fahrzeugs, 1 Minute). Wenn Mikrodrohnen oder Minidrohnen zerlegt werden, sind die Einzelteile ohne eine passende Wissensfertigkeit extrem schwer zu erkennen.
item.extra_entry_points.desc=(Nicht für Drohnen) Diese Modifikation führt dazu, dass man von jedem Insassen annehmen kann, dass er jederzeit einen leicht erreichbaren Aus- oder Einstieg hat, egal, wie der Zustand des Fahrzeugs ist (auch auf dem Dach liegend), oder wie man versucht, hineinzukommen (auch von unten oder über das Dach).
item.extreme_environment.desc=Extremumgebungsmodifikationen  schützen  ein Fahrzeug jeweils vor einer bestimmten Art von Umgebungsgefahr wie extremer Kälte, Hitze, Höhe oder Wasserdruck. Jede Art von Schutz ist eine eigene Modifikation. Wenn du willst, dass dein Fahrzeug in einer zweiten Extremumgebung funktioniert, musst du eine zweite Extremumgebungsmodifikation zusätzlich zur ersten installieren.
item.gun_ports.desc=Eine Schießscharte bietet eine Schussposition aus einem Fahrzeug heraus, durch die ein Passagier eine mit der Hand bediente Waffe abfeuern und dabei von der Fahrzeugpanzerung geschützt bleiben kann. Durch sie kann ein einzelner Passagier aus dem Fahrzeug in die Richtung zu schießen, in die die Schießscharte weist. Wenn mehrere Passagiere gleichzeitig in dieselbe Richtung schießen sollen, muss mehr als eine Schießscharte installiert werden.
item.hardpoint_small.desc=Für Leichte Waffenhalterung, Mikro-/Minidrohnenhalterung, kleiner mechanischer Arm (bis Stärke 2) oder andere kleine mechanische Geräte mit bis zu 2 Liter Volumen.
item.hardpoint_standard.desc=Für Leichte Waffenhalterung (Turm), Standard-Waffenhalterung, kleine Drohnenhalterung, mittlerer mechanischer Arm (bis Stärke 5), Beiwagenkupplung, Anhängerkupplung, Rammbock, Seilwinde oder andere mechanische Geräte mit bis zu 25 Liter Volumen.
item.hardpoint_large.desc=Für Standard-Waffenhalterung (Turm), große Waffenhalterung, mittlere Drohnenhalterung, großer mechanischer Arm (bis Stärke 10), Drehschemel (für Sattelauflieger), Leiter, Hebebühne oder andere große mechanische Geräte mit bis zu 250 Liter Volumen.
item.hardpoint_huge.desc=Für Große Waffenhalterung (Turm), große Drohnenhalterung, riesiger mechanischer Arm(bis Stärke 20) oder andere schwere Baustellenausrüstung (Baggerschaufel, Räumschild, Materialkran usw.) oder andere sehr große mechanische Geräte mit bis zu 2.500 Liter Volumen.
item.increased_integrity.desc=Jede Stufe dieser Modifikation steigert das Rumpf-Attribut des Fahrzeugs um 1. Dadurch erhöht sich allerdings nicht die Anzahl der Modifikationsslots. Die Obergrenze der Stufe dieser Modifikation ist gleich der Hälfte des unmodifizierten Rumpf-Attributs des Fahrzeugs (aufgerundet). Zum Beispiel könnte ein Motorrad mit Rumpf 4 höchstens eine verbesserte strukturelle Integrität von 2 erhalten, wodurch es einen neuen effektiven Rumpfwert von 6 erhielte.
item.increased_integrity_installed.desc=Jede Stufe dieser Modifikation steigert das Rumpf-Attribut des Fahrzeugs um 1. Dadurch erhöht sich allerdings nicht die Anzahl der Modifikationsslots. Die Obergrenze der Stufe dieser Modifikation ist gleich der Hälfte des unmodifizierten Rumpf-Attributs des Fahrzeugs (aufgerundet). Zum Beispiel könnte ein Motorrad mit Rumpf 4 höchstens eine verbesserte strukturelle Integrität von 2 erhalten, wodurch es einen neuen effektiven Rumpfwert von 6 erhielte.
item.medevac.desc=(Nur für mittlere und grössere Drohnen) Medevac-Modifikationen bieten eine Menge Sicherheitsvorkehrungen und Chassisanpassungen, mit denen eine Drohne einen Metamenschen sicher und relativ komfortabel transportieren kann. Wenn diese Systeme aktiviert sind und das Gewicht des Patienten noch dazukommt, wird die Einsatzzeit der Drohne drastisch reduziert. Wenn die Drohne einen Passagier transportiert, braucht sie viermal so viel Energie, was die Einsatzzeit bei voller Ladung von 6 auf 1,5 Stunden senkt; bei teilweiser Aufladung geschieht das im selben Verhältnis. Das betrifft auch zusätzliche Einsatzzeit durch die Modifikation Erhöhte Reichweite, die ebenfalls auf ein Viertel sinkt.
item.powered_breakdown.desc=(Nur für mittlere und kleinere Drohnen) Diese Modifikation ist eine Variante der Modifikation Leicht Zerlegbar und verleiht der Drohne eine besonders geformte Außenoberfläche und zahlreiche Servo-Gliedmaßen, die es ihr gestatten, sich zu einer einzelnen, kompakten, unauffälligen Form zusammenzufalten – meistens ist das ein kleiner Quader mit einem Tragegriff. Die gefaltete Drohne kann auch wie ein weitverbreiteter Gegenstand, zum Beispiel ein Kommlink, ein Aktenkoffer oder eine Werkzeugkiste, gestaltet sein; die Stufe gibt die Qualität dieser Tarnung an. Entfalten kann mit einem WiFi-Kommando ausgelöst werden und dauert 2 Kampfrunden. Um zu erkennen, was eine gefaltete Drohne in Wirklichkeit ist, muss eine Probe auf Wahrnehmung + Intuition (Stufe der Modifikation + 1) gelingen.

item.improved_handling.desc=Indem man die Aufhängung und Stabilisierung eines Fahrzeugs verbessert und die Steuersysteme anpasst, kann ein Fahrzeug besser auf die Steuerung des Fahrers ansprechen. Verbessertes Handling senkt den Handling-Wert des Fahrzeugs um seine Stufe und wirkt kumulativ mit allen anderen Senkungen des Handling-Werts, abgesehen von Pilot-by-Wire, weil diese beiden Systeme viele sehr ähnliche Anpassungen verwenden. Verbessertes Handling gilt bei Bodenfahrzeugen gleichermaßen für den Handling-Wert auf der Straße und im Gelände.
item.pilot_by_wire.desc= Pilot-by-Wire gibt es in zwei Versionen, und beide verbessern Aufhängung und Stabilität des Fahrzeugs. Diese Modifikation setzt voraus, dass das Pilot-Attribut des Fahrzeugs mindestens doppelt so hoch ist wie die Pilot-by-Wire-Stufe. Beide Versionen dieses Systems senken den Handling-Wert des Fahrzeugs um ihre Stufe. Ein zusätzlicher Vorzug des Pilot-by-Wire der Stufe 1 ist, dass es dem Fahrer einen Würfelpoolbonus von +2 auf Steuern-Proben verleiht. Pilot-by-Wire der Stufe 2 ist fortschrittlicher und verleiht neben dem Bonus auf Steuern-Proben noch 1 Punkt Edge für Steuern-Proben. Diese Vorteile wirken nicht kumulativ mit einer Riggerkontrolle. Diese Modifikation wirkt kumulativ mit anderen Senkungen des Handling-Werts, außer mit Verbessertem Handling, weil diese beiden Systeme viele sehr ähnliche Anpassungen verwenden. Pilot-by-Wire gilt bei Bodenfahrzeugen gleichermaßen für den Handling-Wert auf der Straße und im Gelände.
item.removed_manuals.desc=Mit dieser Modifikation entfernt der Besitzer ganz einfach die manuelle Steuerung, sodass nur noch die AR-Steuerung übrig bleibt. Diese Modifikation setzt einen Chassis-Modifikationsslot frei und entfernt den Malus für Zwerge und Trolle für nicht angepasste Ausrüstung, weil AR-Steuerung alle gleich behandelt.
item.multi_terrain_static.desc=(Nur für Bodenfahrzeuge)  Jede Stufe dieser Modifikation senkt permanent das Gelände-Handling des Fahrzeugs um 1 und erhöht gleichzeitig permanent sein Straßen-Handling um 1. Der Handling-Wert im Gelände kann nicht besser werden als der ursprüngliche Handling-Wert auf der Straße. Fahrzeuge, die im Gelände und auf der Straße bereits denselben Handling-Wert besitzen, können von dieser Modifikation nicht profitieren, weil eine Version davon bereits ab Werk installiert ist.
item.multi_terrain_active.desc=(Nur für Bodenfahrzeuge) Diese Modifikation funktioniert genauso wie die statische Geländeaufhängung, nur bestehen die Veränderungen am Fahrwerk aus aktiven Elementen. Die Veränderung des Handling-Werts ist vorübergehend und kann mit einem WiFi-Kommando (das eine Nebenhandlung benötigt) aktiviert oder deaktiviert werden. Es dauert 2 Kampfrunden, um die Punkte für Handling zwischen Gelände und Straße oder umgekehrt zu transferieren. Alle Punkte, die übertragen werden sollen (von 1 bis zum möglichen Maximum), werden gleichzeitig – gemäß den Regeln für die statische Geländeaufhängung – übertragen.
item.amenities.desc=Innenausstattung
item.amenities.variant.street.desc=Schlimmer als öffentliche Verkehrsmittel.
item.amenities.variant.squatter.desc=Andererseits kann man die Innenausstattung auch zu Squatter verschlechtern (entspricht einem öffentlichen Verkehrsmittel).
item.amenities.variant.low.desc=Ein normales Fahrzeug bietet mit seiner Innenausstattung einen Komfort wie der Lebensstil Unterschicht.
item.amenities.variant.middle.desc=Mit Innenausstattung der Mittelschicht bekommt das Fahrzeug bequeme Sitze, eine gute Ergonomie und ein paar grundlegende Unterhaltungsoptionen.
item.amenities.variant.high.desc=Innenausstattung der Oberschicht bietet Sitze aus edlen Materialien, Erfrischungsoptionen und eine vollständige Unterhaltungsausstattung, die alle Passagiere stundenlang beschäftigen kann.
item.amenities.variant.luxury.desc=Mit Luxus-Innenausstattung ist jeder Aspekt des Inneren mit den luxuriösesten Optionen verbessert, die zu haben sind.
item.meta_adjust_pilot.desc=Zwerge oder Trolle, die ein Fahrzeug komfortabel benutzen wollen, müssen Sitze einbauen, die zu ihrer besonderen Physiologie passen.
item.meta_adjust_pilot.variant.passenger.desc=Zwerge oder Trolle, die ein Fahrzeug komfortabel benutzen wollen, müssen Sitze einbauen, die zu ihrer besonderen Physiologie passen.

item.ejection_seat.desc=Für Fahrzeuge mit offener Bauform ist diese Modifikation ohne weitere Anpassungen zu haben. Andere Fahrzeuge benötigen die Modifikation Zusätzliche Ein-/Ausstiege, sonst reißt der Schleudersitz nach dem Auslösen ein Loch in die Außenhülle. Mithilfe eines per WiFi aktivierten Antriebssystems mit expandierendem Gas kann jeder Sitz im Fahrzeug, auch ein Riggerkokon oder ein Valkyrie-Modul, mitsamt der Person im Sitz aus dem Fahrzeug geschleudert werden.
item.ejection_seat.variant.parachute.desc==Für Fahrzeuge mit offener Bauform ist diese Modifikation ohne weitere Anpassungen zu haben. Andere Fahrzeuge benötigen die Modifikation Zusätzliche Ein-/Ausstiege, sonst reißt der Schleudersitz nach dem Auslösen ein Loch in die Außenhülle. Mithilfe eines per WiFi aktivierten Antriebssystems mit expandierendem Gas kann jeder Sitz im Fahrzeug, auch ein Riggerkokon oder ein Valkyrie-Modul, mitsamt der Person im Sitz aus dem Fahrzeug geschleudert werden. Diese Variante ist mit Fallschirmen oder Bremsraketen ausgestattet – wenn man möchte, dass der Ausgeworfene sicher landet.
item.electromag_shielding.desc=Bitte als Stufe angeben, wie viele LE geschützt werden sollen. \n Dieses System isoliert einen Teil des Laderaums, indem dieser mit einer leitenden Barriere versehen wird, die alle WiFi-Signale streut, die sie durchdringen. Das macht diesen Teil des Laderaums de facto zu einem Faradayschen Käfig. Diese Modifikation kann allein oder zusammen mit einem Schmuggelfrachtraum (S. 128) eingebaut werden. Eine Datenwanze oder ein anderes Gerät, das in physischen Kontakt mit der isolierenden Barriere kommt, kann den Effekt des Faradayschen Käfigs überwinden und die Abschirmung umgehen.
item.internal_security_gas.desc=Die Gegenmaßnahme kann per Fernsteuerung durch den Besitzer aktiviert oder an eine Diebstahlsicherung (S. 137) der Stufe 3 gekoppelt sein.  Diese Version kann mit einem Toxin nach Wahl bestückt werden (separat erhältlich) und bietet eine Konzentration für den Gasangriff gleich der Anzahl an abgegebenen Dosen. Das Reservoir kann bis zu 5 Dosen eines Toxins enthalten und eine beliebige Anzahl davon mit einem Angriff freisetzen.
item.internal_security_zapper.desc=Die Gegenmaßnahme kann per Fernsteuerung durch den Besitzer aktiviert oder an eine Diebstahlsicherung (S. 137) der Stufe 3 gekoppelt sein. Diese Version gibt über spezielle leitende Oberflächen im Inneren des Fahrzeugs eine elektrische Entladung ab, die Personen darin ausschalten soll. Das System verursacht einen Schaden von 6B(e) an allen Personen, die Kontakt mit dem Fahrzeuginneren haben, und wer dem Schaden nicht widersteht, erhält den Status Gebrutzelt (SR6, S. 54) für eine Anzahl von Runden gleich dem Schaden, dem nicht widerstanden wurde. Das System hat ausreichend Ladungen, um viermal ausgelöst zu werden; es lädt sich mit einer Ladung pro 5 Minuten wieder auf, während das Fahrzeug läuft oder an eine Energiequelle angeschlossen ist.
item.integrated_cyberarm.desc=Anders als beim größeren mechanischen Arm wird hier ein offensichtlicher Cyberarm an einer Drohne oder einem Fahrzeug montiert. Er verfügt über feinmotorische Fähigkeiten und kann auch Werkzeuge ergreifen und benutzen. Ein Rigger, der in das Fahrzeug hineingesprungen ist, kann mit diesem Cyberarm seine technischen Fertigkeiten verwenden. Es können allerdings Malusse entstehen, wenn die Aufgabe den Einsatz zweier Arme voraussetzt, aber nur ein Arm am Fahrzeug ist. Grundstärke und -geschicklichkeit des Arms betragen jeweils 2, er hat eine Kapazität von 15 und kann wie ein gewöhnlicher Cyberarm modifiziert werden (siehe dazu auch den Kasten Beine und Arme von Anthroform-Drohnen). Diese Art von Arm kann einen Nahkampfangriff gegen ein Ziel innerhalb seiner Reichweite ausführen, wenn das Fahrzeug die Autosoft Zielerfassung (Nahkampf) besitzt. Der Grundschaden beträgt 2B.
item.life_safety_system.desc=Es kann nur in Fahrzeuge mit Standard- oder geschützter Bauform eingebaut werden. \n Alle für gewöhnlich undichten Stellen eines Fahrzeugs, wie zum Beispiel Türen und Fenster, sind luft- und wasserdicht. Luft kann nur durch das Lüftungssystem des Fahrzeugs zirkulieren. Dieses System bietet verschiedene Reiniger und Filter, die Toxine und Pathogene aus der Umgebungsluft davon abhalten, den Passagieren zu schaden.
item.life_safety_system.variant.level1.desc=Es kann nur in Fahrzeuge mit Standard- oder geschützter Bauform eingebaut werden. \n Alle für gewöhnlich undichten Stellen eines Fahrzeugs, wie zum Beispiel Türen und Fenster, sind luft- und wasserdicht. Luft kann nur durch das Lüftungssystem des Fahrzeugs zirkulieren. Dieses System bietet verschiedene Reiniger und Filter, die Toxine und Pathogene aus der Umgebungsluft davon abhalten, den Passagieren zu schaden. Das System der Stufe 1 verleiht den Insassen 6 Würfel zum Widerstand gegen Drogen, Toxine und Pathogene in der Luft um das Fahrzeug.
item.life_safety_system.variant.level2.desc=Es kann nur in Fahrzeuge mit Standard- oder geschützter Bauform eingebaut werden. \n Auf Stufe 2 besteht neben diesen Maßnahmen zusätzlich zu Stufe 1 die Möglichkeit, das Fahrzeug komplett von der Außenluft abzuschotten, was es völlig wasser- und luftdicht macht. Außerdem hat das Fahrzeug eine eigene unabhängige Luftversorgung, die für 1 Stunde ausreicht. Das System der Stufe 2 zählt als Chemische Versiegelung (SR6, S. 266), wenn eine Spielsituation eine solche verlangt.
item.passenger_prot_system.desc=Das Fahrgastsicherheitssystem dient dazu, das Leben der Insassen bei einem Unfall zu schützen. Es bietet  Vierpunktgurte,  gepolsterte  Oberflächen, schnellöffnende Airbags und schnellausbreitenden Fixierschaum. Es kann die Stufen 1 bis 6 haben, wobei die Stufe als Würfelpoolbonus für Schadenswiderstandsproben der Insassen bei Unfällen oder einem anderen Fahrzeugaufprall gilt. Bei Angriffen durch Waffen hat das System keine Wirkung.
item.increase_cargo_space.desc=Diese Modifikation des Fahrzeugs vergrößert die Menge an benutzbarem Innenraum über das hinaus, was von Klasse und Art des Fahrzeugs vorgegeben ist. Dieser Raum kann Laderaum sein (und damit mehr Platz für LE-Modifikationen bieten) oder für zusätzliche Sitze genutzt werden. Typische Beispiele wären der Umbau eines Vans zum Lieferwagen mit großer Ladefläche oder einer Limousine zur Stretch-Limousine, die zusätzliche Sitze und verbesserte Innenausstattung bietet.
item.reduce_cargo_space.desc=Diese Modifikation des Fahrzeugs verringert die Menge an benutzbarem Innenraum relativ zu dem, was von Klasse und Art des Fahrzeugs vorgegeben ist. Beispiele wären das Entfernen der hinteren Sitzbank und der Einbau eines Elektronikkabinetts an ihrer Stelle oder das Benutzen des Kofferraums als Drohnenlager (weil diese zweite Steel Lynx einfach nicht auf dem Beifahrersitz mitfahren kann).
item.increase_seating.desc=(LE-Modifikation) Diese Modifikation hat alles, was man zum Transport von Personen braucht, integriert die Sitze in die Sicherheitssysteme des Fahrzeugs und passt sie der Stufe der momentanen Innenausstattung an. Pro Anwendung dieser Modifikation wird die Passagierkapazität des Fahrzeugs um 1 Sitz erhöht, was die Ladekapazität um 1 LE senkt (für Troll-Sitze um 2 LE).
item.reduce_seating.desc=(LE-Modifikation) Die Entfernung eines Sitzes gibt die durch diesen Sitz blockierte LE frei.
item.living_space.desc=(LE-Modifikation) Diese Modifikation sorgt nicht einfach nur für Innenausstattung – sie verwandelt LE in eine echte Unterkunft. Squatter entspricht zum Beispiel einer spartanischen Koje in einem Frachter. Mittelschicht entspricht einem Campingwagen und Luxus entspricht den feinsten Quartieren in einer Jacht.
item.portable_facility_install.desc=(LE-Modifikation) Dies sind die Installationskosten einer Mobilen Werkstatt, welche durch Selbsteinbau reduziert werden können. \n Ein Fahrzeug mit ausreichend Platz im Inneren kann in eine mobile Werkstatt verwandelt werden. Ein Fahrzeug, das auf diese Weise modifiziert wird, gilt als Werkstatt (SR6, S. 274), aber wegen des beschränkten Platzangebots muss die Werkstatt auf eine Spezialisierung einer Aktionsfertigkeit konzentriert sein, wie etwa Biotech (Medizin), Elektronik (Hardware) oder Mechanik (Fahrzeugmechanik). Diese Spezialisierung muss beim Einbau der Modifikation ausgewählt werden und kann danach nicht mehr verändert werden.
item.portable_facility.desc=(LE-Modifikation) Dies sind die Fixkosten der Mobilen Werkstatt, welche durch Selbsteinbau NICHT reduziert werden können. \n Ein Fahrzeug mit ausreichend Platz im Inneren kann in eine mobile Werkstatt verwandelt werden. Ein Fahrzeug, das auf diese Weise modifiziert wird, gilt als Werkstatt (SR6, S. 274), aber wegen des beschränkten Platzangebots muss die Werkstatt auf eine Spezialisierung einer Aktionsfertigkeit konzentriert sein, wie etwa Biotech (Medizin), Elektronik (Hardware) oder Mechanik (Fahrzeugmechanik). Diese Spezialisierung muss beim Einbau der Modifikation ausgewählt werden und kann danach nicht mehr verändert werden.
item.rigger_cocoon.desc=(LE-Modifikation) Meistens ersetzt der Riggerkokon den Fahrersitz eines Fahrzeugs, er kann aber tatsächlich 1 LE irgendwo im Fahrzeug verwenden. Sein einziger Zweck besteht darin, jemandem, dessen Bewusstsein gerade nicht in seinem Körper ist, Komfort und Sicherheit zu gewähren. Der Kokon dient dem Schutz während der extremsten Fahrzeugmanöver und sogar im Fall einer Kollision. Er ist feuerfest, hat eine eigene Sauerstoffversorgung und biomedizinische Sensoren, die den Zustand des Insassen überwachen. Es dauert 2 Kampfrunden, in einen Riggerkokon zu klettern, aber man kann ihn per Schnellausstieg mit einer Nebenhandlung verlassen. Der Riggerkokon gilt als Fahrgastsicherheitssystem (S. 126) der Stufe 6 mit Feuerresistenz 2, einem integrierten Vitalmonitor und einem Lebenserhaltungssystem (S. 127) der Stufe 2 mit 4 Stunden Sauerstoff (all das gilt nur für den Insassen der Schutzblase). Ein Riggerkokon kann nicht in einer Drohne installiert werden.
item.smuggling_compartment_vehicle.desc=(LE-Modifikation) Diese Option modifiziert zwischen 1 und 4 LE Laderaum und schafft ein verstecktes Lagerfach innerhalb des Fahrzeugs. Ein Schmuggelfrachtraum kann nicht entdeckt werden, wenn man nicht explizit nach versteckten Räumen sucht oder ein Fahrzeug eingehend durchsucht. Selbst in diesem Fall muss zum Entdecken des Fachs eine Probe auf Wahrnehmung + Intuition (8 – LE des Schmuggelfrachtraums) gelingen. Die Suche mit Sensoren senkt den Schwellenwert um 1 pro Methode, die über das Optische hinaus eingesetzt wird (akustisch, chemisch, Infrarot usw.), bis zu einem Minimum von 1.
item.smuggling_compartment_shielding.desc=Bitte als Stufe die Größe des Schmuggelfrachtraums angeben, der geschützt werden soll. \n Schmuggelfrachträume können mit elektromagnetischer Abschirmung und anderen Arten der Abschirmung versehen werden. Jede Art der Abschirmung, die installiert ist, negiert die Veränderung des Schwellenwerts durch den betreffenden Sensor. Die Abschirmungen eines Schmuggelfrachtraums können mehrmals, jeweils für bestimmte Sensorarten (akustisch, chemisch, Infrarot usw.), installiert werden.
item.valkyrie_module.desc=(LE-Modifikation) Das Valkyrie-Modul ist mehr als nur ein hochstufiges Medkit – es ist eine kleine, mobile, automatisierte Notaufnahme. Das Modul ersetzt zwei Sitze und bietet eine Liege mit transparenter Abdeckung und viel ausgeklügelte medizinische Ausrüstung. Die Software des Autodoc-Systems stellt für Biotech-Proben eine Logik von 4 zur Verfügung. Die Systeme eines Valkyrie-Moduls entsprechen einem Medkit der Stufe 6 und bieten dieselbe Funktionalität. Wenn die beiden Systeme zusammen eingesetzt werden, haben sie 10 Würfel für die Heilung mit Medkit (s. SR6, S. 122). Das Modul kann als ferngesteuertes OP-Bett benutzt werden. Wenn es so eingesetzt wird, nimmt es an einer Biotech-Teamworkprobe zur Unterstützung des Arztes teil. Wenn es als Helfer wirkt, erhält der Arzt neben der üblichen Verbesserung des Würfelpools (s. SR6, S. 38) auch 1 Edge.
item.valkyrie_module.variant.regular.desc=(LE-Modifikation) Das Valkyrie-Modul ist mehr als nur ein hochstufiges Medkit – es ist eine kleine, mobile, automatisierte Notaufnahme. Das Modul ersetzt zwei Sitze und bietet eine Liege mit transparenter Abdeckung und viel ausgeklügelte medizinische Ausrüstung. Die Software des Autodoc-Systems stellt für Biotech-Proben eine Logik von 4 zur Verfügung. Die Systeme eines Valkyrie-Moduls entsprechen einem Medkit der Stufe 6 und bieten dieselbe Funktionalität. Wenn die beiden Systeme zusammen eingesetzt werden, haben sie 10 Würfel für die Heilung mit Medkit (s. SR6, S. 122). Das Modul kann als ferngesteuertes OP-Bett benutzt werden. Wenn es so eingesetzt wird, nimmt es an einer Biotech-Teamworkprobe zur Unterstützung des Arztes teil. Wenn es als Helfer wirkt, erhält der Arzt neben der üblichen Verbesserung des Würfelpools (s. SR6, S. 38) auch 1 Edge.
item.valkyrie_module.variant.drone.desc=(LE-Modifikation) Das Valkyrie-Modul ist mehr als nur ein hochstufiges Medkit – es ist eine kleine, mobile, automatisierte Notaufnahme. Das Modul ersetzt zwei Sitze und bietet eine Liege mit transparenter Abdeckung und viel ausgeklügelte medizinische Ausrüstung. Die Software des Autodoc-Systems stellt für Biotech-Proben eine Logik von 4 zur Verfügung. Die Systeme eines Valkyrie-Moduls entsprechen einem Medkit der Stufe 6 und bieten dieselbe Funktionalität. Wenn die beiden Systeme zusammen eingesetzt werden, haben sie 10 Würfel für die Heilung mit Medkit (s. SR6, S. 122). Das Modul kann als ferngesteuertes OP-Bett benutzt werden. Wenn es so eingesetzt wird, nimmt es an einer Biotech-Teamworkprobe zur Unterstützung des Arztes teil. Wenn es als Helfer wirkt, erhält der Arzt neben der üblichen Verbesserung des Würfelpools (s. SR6, S. 38) auch 1 Edge. Wenn das Valkyrie-Modul in einer Drohne installiert ist, sediert es den Patient automatisch, damit er den Transport durch seine eigenen Bewegungen nicht unnötig erschwert. Ein Valkyrie-Modul kann nur in große Drohne mit der Medevac-Modifikation eingebaut werden, auch wenn eine kleinere Drohne vielleicht ausreichend LE böte. Das heißt, mittlere Drohnen können zwar eine Medevac-Modifikation aufnehmen, um Patienten schnell zur nächsten Behandlung zu befördern, bieten aber nicht den Platz, um die Dienste eines Valkyrie-Moduls anbieten zu können.
item.form_stripping.desc=Indem man ein wenig von der Karosserie entfernt und für die Veränderung zur offenen Bauform bezahlt, kann  jedes  Fahrzeug  diese  erhalten. Diese Veränderung macht bei Standard-Bauformen 1 Chassis-Modifikationsslot und bei geschützten Bauformen 2 Chassis-Modifikationsslots frei.
item.form_stripping.variant.standard_to_open.desc=Änderung der Bauform von Standard zu Offen
item.form_stripping.variant.enclosed_to_standard.desc=Änderung der Bauform von Geschützt zu Standard
item.form_stripping.variant.enclosed_to_open.desc=Änderung der Bauform von Geschützt zu Offen
item.form_increasing.desc=Ein Fahrzeug mit offener Bauform kann für 1 Chassis-Modifikationsslot zu einem Fahrzeug mit Standard-Bauform umgewandelt werden. Dafür muss die Panzerung des Fahrzeugs mindestens so hoch sein wie sein Rumpf-Attribut. Für insgesamt 2 Chassis-Modifikationsslots kann man aus einer offenen Bauform eine geschützte Bauform machen, sofern die Panzerung mindestens 1,5-mal so hoch wie das Rumpf-Attribut des Fahrzeugs ist.
item.form_increasing.variant.open_to_standard.desc=Änderung der Bauform von Offen zu Standard
item.form_increasing.variant.standard_to_enclosed.desc=Änderung der Bauform von Standard zu Geschützt
item.form_increasing.variant.open_to_enclosed.desc=Änderung der Bauform von Offen zu Geschützt
item.realistic_features.desc=Die Karosserie jedes Fahrzeugs (meistens aber einer Drohne) kann geformt und mit synthetischem Material überzogen werden, das Felle, Federn oder sogar metamenschliche Haut nachahmt. Das realistische Aussehen kann ein einfacher Überzug mit lebensecht wirkender Haut bis hin zu lebendem Gewebe sein, das von einem künstlichen Gefäßsystem erhalten wird – samt Geräten, die Organe simulieren. Diese Modifikation ist in den Stufen 1 bis 4 erhältlich. Die Stufe gibt den Schwellenwert für eine Probe auf Wahrnehmung + Intuition an, um die Maschine als künstlich zu erkennen. Das wahre Wesen des Fahrzeugs ist immer sofort zu erkennen, wenn man die Aura mit der Fertigkeit Astral überprüft – es entpuppt sich sofort als unbelebtes Objekt.

item.armor_standard.desc=Die Polymerplatte ist die Standardpanzerung für fast alle kommerziell hergestellten Fahrzeuge. Die Dicke des Unterbaus aus Polymerplatten zu erhöhen (oder zu reduzieren) verändert das Panzerungs-Attribut eines Fahrzeugs im Verhältnis 1:1. Zusätzliche Schichten Standardpanzerung verbrauchen keine Modifikationsslots und können ohne eine Überarbeitung der bestehenden Panzerung angebracht werden, also muss man nur Geld dafür bezahlen. Das Maximum an Panzerung, das ein Fahrzeug erhalten kann, ist gleich dem Doppelten seines unmodifizierten Rumpf-Attributs (abzüglich eventuell schon vorhandener Panzerung). Außerdem darf durch die zusätzliche Panzerung die Höchstgeschwindigkeit des Fahrzeugs nicht auf null (bei Flugzeugen nicht auf die Hälfte oder weniger) sinken.
item.armor_ceramic.desc= Wenn ein Fahrzeug mit Keramikplatten versehen wird, gewähren jeweils 4 volle Stufen Panzerung einen Würfelpoolbonus von +1 bei Schadenswiderstandsproben des Fahrzeugs. Keramikplatten bilden eine zusätzliche Schicht, die in die Polymerplatten integriert wird; sie sind kein eigenständiges Panzerungssystem. Sie sind zwar weniger offensichtlich als Militär-Panzerplatten, aber man kann sie leicht erkennen, wenn man weiß, wonach man sucht. Keramik-Plattenpanzerung hat keine eigene Stufe – Preis und benötigte Modifikationsslots hängen immer vom Panzerungs-Attribut des Fahrzeugs ab.
item.armor_milspec.desc=Diese Panzerung ist nur in schweren Platten zu haben und verleiht der Karosserie das klobige, eckige Aussehen, das man mit Militärfahrzeugen assoziiert. Sie kann nicht getarnt werden, und ihr Zweck ist für jeden offensichtlich, der sie sieht. Sie hat außerdem eine extrem hohe Dichte und verändert die Massenverteilung ungünstig, wenn sie in massenproduzierten Fahrzeugen eingesetzt wird. Militär-Plattenpanzerung gibt es in drei Stufen, unabhängig von der Dicke der Panzerung, in die sie eingearbeitet ist. Dieses Material senkt den Schadenswert jedes Angriffs um 1 pro Stufe. Das Geschwindigkeitsintervall des Fahrzeugs sinkt um 5 pro Stufe.

item.elemental_hardening.desc=Diese Gruppe ähnlicher Karosseriemodifikationen kann Schutz vor bestimmten Energien oder Umgebungen bieten. Elementarhärtung ist zu den Panzerungsmodifikationen ( SR6, S. 266) äquivalent. Resistenzen gegen chemischen, Kälte-, Feuer- und Elektrizitätsschaden können bei Fahrzeugen und Drohnen eingebaut werden.
item.ram_plating.desc=Es werden Schichten aus funkabsorbierendem Material eingebaut, die den Rauschenwert für das erfassende System/Fahrzeug steigern, wenn man der Handlung Sensorerfassung oder Radarüberwachungssystemen ausweichen oder die Handlung Erfassung unterbrechen (S. 137) durchführen will. Das System gewährt außerdem 1 Edge bei Heimlichkeitsproben mit dem Fahrzeug.
item.grey_mana_integration.desc=Diese Modifikation gewährt pro Stufe einen Würfelpoolbonus von +1 auf Widerstandsproben gegen magische Effekte, die gegen das Fahrzeug oder die Insassen wirken. Der Nachteil ist, dass alle Magieproben von innerhalb des Fahrzeugs pro Stufe einen Würfelpoolmalus von -1 erleiden, ausgenommen Entzugswiderstandsproben.
item.grey_mana_integration.variant.warding.desc==Bei Fahrzeugen mit geschützter Bauweise kann die Modifikation zur Grey Manaabschirmung erweitert werden. Diese Technologie wirkt ähnlich wie eine Manabarriere und behindert neben der oben genannten Wirkung auch die astrale Bewegung. Die Grey Manaabschirmung eines Fahrzeugs erzeugt um den Innenraum des Fahrzeugs herum eine permanente duale Manabarriere mit einer Stufe gleich der Stufe der Modifikation. Diese Barriere kann nicht gebannt werden (weil sie physischer Natur ist), aber man kann sie wie gewohnt umgehen (s. SR6, S. 163). Weil sie keinen Besitzer hat, betrifft sie jeden und alles gleichermaßen.
item.modslot_pp_to_chassis.desc=Verfügbare Modifikationsslots für Chassis, Antrieb und Elektronik können im Verhältnis 2:1 dauerhaft in eine andere Kategorie übertragen werden. Man erhält also für jeweils 2 Slots der Ursprungskategorie 1 Slot der Zielkategorie.
item.modslot_pp_to_elec.desc=Verfügbare Modifikationsslots für Chassis, Antrieb und Elektronik können im Verhältnis 2:1 dauerhaft in eine andere Kategorie übertragen werden. Man erhält also für jeweils 2 Slots der Ursprungskategorie 1 Slot der Zielkategorie.
item.improved_acceleration.desc=Ein höheres Drehmoment und mehr Bremskraft sind für jedes Fahrzeug nützlich, das sich öfter Verfolgungsjagden liefert oder mit dem man einfach nur den Gegner an der Ampel stehen lassen will. Jede Stufe dieser Modifikation erhöht die Beschleunigung des Fahrzeugs um (aufgerundet) 30 Prozent des unmodifizierten Grundwerts. Diese Verbesserung wirkt auf das Bremsen ebenso wie das Beschleunigen.
item.nitro_boost.desc=Verbrennungsmotoren kommen nur noch in wenigen modernen Fahrzeugen zum Einsatz, aber „Nitro“ wird unter Freizeitrennfahrern immer noch als vorübergehender Boost für die Beschleunigung verstanden, auch wenn es sich in Wirklichkeit um einen Hochleistungskondensator handelt. Wenn der Nitrobooster mit einer Nebenhandlung ausgelöst wird, wird die Beschleunigung des Fahrzeugs für 1W6 Kampfrunden verdoppelt. Der Booster braucht 5 Minuten an einer Stromquelle, um sich für die nächste Benutzung aufzuladen. Bei Steuern-Proben während dieser Wirkungsdauer wird einer der Würfel durch einen Schicksalswürfel ersetzt. Diese Verbesserung wirkt auf das Bremsen ebenso wie das Beschleunigen.
item.gecko_tips.desc=Wenn man ein System ähnlich dem von Geckotape-Handschuhen (s. SR6, S. 281) an den Teilen des Fahrzeugs anbringt, die es bewegen, kann man es buchstäblich Wände hochklettern lassen. Ein Fahrzeug mit Rädern, Ketten oder Beinen, die mit Geckofüßen versehen sind, kann sich auf Oberflächen mit ansonsten unüberwindlichen Steigungen bewegen – auch an senkrechten Flächen und über Kopf. Flugzeuge können diese Modifikation einsetzen, um an senkrechten Oberflächen oder über Kopf zu landen, sie können diese aber nicht überqueren.
item.gecko_tips.variant.size1.desc=Wenn man ein System ähnlich dem von Geckotape-Handschuhen (s. SR6, S. 281) an den Teilen des Fahrzeugs anbringt, die es bewegen, kann man es buchstäblich Wände hochklettern lassen. Ein Fahrzeug mit Rädern, Ketten oder Beinen, die mit Geckofüßen versehen sind, kann sich auf Oberflächen mit ansonsten unüberwindlichen Steigungen bewegen – auch an senkrechten Flächen und über Kopf. Flugzeuge können diese Modifikation einsetzen, um an senkrechten Oberflächen oder über Kopf zu landen, sie können diese aber nicht überqueren.
item.gecko_tips.variant.size2.desc==Wenn man ein System ähnlich dem von Geckotape-Handschuhen (s. SR6, S. 281) an den Teilen des Fahrzeugs anbringt, die es bewegen, kann man es buchstäblich Wände hochklettern lassen. Ein Fahrzeug mit Rädern, Ketten oder Beinen, die mit Geckofüßen versehen sind, kann sich auf Oberflächen mit ansonsten unüberwindlichen Steigungen bewegen – auch an senkrechten Flächen und über Kopf. Flugzeuge können diese Modifikation einsetzen, um an senkrechten Oberflächen oder über Kopf zu landen, sie können diese aber nicht überqueren.
item.gecko_tips.variant.size3.desc=Wenn man ein System ähnlich dem von Geckotape-Handschuhen (s. SR6, S. 281) an den Teilen des Fahrzeugs anbringt, die es bewegen, kann man es buchstäblich Wände hochklettern lassen. Ein Fahrzeug mit Rädern, Ketten oder Beinen, die mit Geckofüßen versehen sind, kann sich auf Oberflächen mit ansonsten unüberwindlichen Steigungen bewegen – auch an senkrechten Flächen und über Kopf. Flugzeuge können diese Modifikation einsetzen, um an senkrechten Oberflächen oder über Kopf zu landen, sie können diese aber nicht überqueren.
item.gecko_tips.variant.size4.desc=Wenn man ein System ähnlich dem von Geckotape-Handschuhen (s. SR6, S. 281) an den Teilen des Fahrzeugs anbringt, die es bewegen, kann man es buchstäblich Wände hochklettern lassen. Ein Fahrzeug mit Rädern, Ketten oder Beinen, die mit Geckofüßen versehen sind, kann sich auf Oberflächen mit ansonsten unüberwindlichen Steigungen bewegen – auch an senkrechten Flächen und über Kopf. Flugzeuge können diese Modifikation einsetzen, um an senkrechten Oberflächen oder über Kopf zu landen, sie können diese aber nicht überqueren.
item.gridlink.desc=Wenn ein gewöhnliches Elektrofahrzeug mit dem GridGuide-System verbunden ist, ist seine Einsatzzeit praktisch unbegrenzt. GridLink ist bei allen modernen Fahrzeugen Standard, die GridGuide nutzen. Falls ein Fahrzeug ab Werk keine GridLink-Einheit hat, kann man sie einfach nachrüsten.
item.fuel_converter.desc=Ein kleiner Plasmaofen wird im Energiesystem installiert, der alle Kohlenwasserstoffe in ihre Grundbestandteile – vor allem Methan und Ethan – zerlegt. Dann wird der Motor des Fahrzeugs so verändert, dass er das Material aus dem Plasmaofen als Treibstoff benutzen kann. Dadurch kann man praktisch beliebige organische Materialien als Treibstoff verwenden. Wenn ein Fahrzeug einen reinen Elektroantrieb hat, wird ein kleiner Verbrennungsmotor mit angeschlossenem Generator in das System eingebaut.
item.improved_economy.desc=Das sind eigentlich zwei Methoden, um dasselbe Ergebnis zu erreichen: eine Verlängerung der Einsatzzeit des Fahrzeugs. Mit dieser Modifikation wird entweder der Treibstoffverbrauch eines Fahrzeugs gesenkt oder seine Energiekapazität durch einen größeren Tank oder größere Batterien erhöht (oder vielleicht beides). Unabhängig davon, was man tut, verlängert diese Modifikation die Einsatzzeit des Fahrzeugs pro Stufe um ein Drittel ihres Grundwerts (also normalerweise um 2 Stunden). Modifikationen, die zu einem höheren Verbrauch führen, senken die erhöhte Reichweite im selben Maße.
item.suncell_power.desc=Mit dieser Modifikation kann ein Fahrzeug alle Energie erzeugen, die es braucht, wenn es an einem klaren Tag in der Sonne steht. Es kann Elektrizität oder flüssigen Treibstoff produzieren. Fahrzeuge mit Solarzellen können die Zeit, während der sie sich in der Sonne befinden, für die Berechnung ihrer Einsatzzeit ignorieren; nur Bewölkung oder Nacht wirken sich auf den Energievorrat aus.
item.improved_stability.desc=Verbesserte Stabilität verbessert die Steuerung eines Fahrzeugs, wenn es schneller wird, und wirkt dem Effekt hoher Geschwindigkeit entgegen. Jede Stufe dieser Modifikation senkt den Würfelpoolmalus durch das Geschwindigkeitsintervall um 1, sodass das Fahrzeug höhere Geschwindigkeiten erreichen kann, bevor der Malus zum Tragen kommt. Die Modifikation verleiht keine Würfelpoolboni.
item.suspension_racing.desc= Die Rennaufhängung begrenzt den möglichen Würfelpoolmalus durch das Geschwindigkeitsintervall, sodass er maximal so hoch sein kann wie der Handlingwert des Fahrzeugs. Eine Rennaufhängung ist nicht mit den Modifikationen Verbesserte Stabilität oder Abgestimmte Aufhängung kompatibel.
item.tuned_suspension.desc=Bei einer abgestimmten Aufhängung wird das Fahrwerk des Fahrzeugs so modifiziert, dass die Aufhängung auf einen bestimmten Untergrund abgestimmt ist. Dadurch verbessert sich die Leistung auf diesem Untergrund, verschlechtert sich aber in anderer Umgebung. Eine abgestimmte Aufhängung senkt je nach Einstellung auf der Straße oder im Gelände den Würfelpoolmalus durch das Geschwindigkeitsintervall auf die aufgerundete Hälfte. Wenn der Pilot auf einem Untergrund unterwegs ist, auf den sein Fahrzeug nicht abgestimmt ist, kann er kein Edge erhalten.
item.tuned_suspension.variant.onroad.desc=Bei einer abgestimmten Aufhängung wird das Fahrwerk des Fahrzeugs so modifiziert, dass die Aufhängung auf einen bestimmten Untergrund abgestimmt ist. Dadurch verbessert sich die Leistung auf diesem Untergrund, verschlechtert sich aber in anderer Umgebung. Eine abgestimmte Aufhängung senkt je nach Einstellung auf der Straße oder im Gelände den Würfelpoolmalus durch das Geschwindigkeitsintervall auf die aufgerundete Hälfte. Wenn der Pilot auf einem Untergrund unterwegs ist, auf den sein Fahrzeug nicht abgestimmt ist, kann er kein Edge erhalten.
item.tuned_suspension.variant.offroad.desc=Bei einer abgestimmten Aufhängung wird das Fahrwerk des Fahrzeugs so modifiziert, dass die Aufhängung auf einen bestimmten Untergrund abgestimmt ist. Dadurch verbessert sich die Leistung auf diesem Untergrund, verschlechtert sich aber in anderer Umgebung. Eine abgestimmte Aufhängung senkt je nach Einstellung auf der Straße oder im Gelände den Würfelpoolmalus durch das Geschwindigkeitsintervall auf die aufgerundete Hälfte. Wenn der Pilot auf einem Untergrund unterwegs ist, auf den sein Fahrzeug nicht abgestimmt ist, kann er kein Edge erhalten.
item.improved_topspeed.desc=Pro Stufe dieser Modifikation steigt die Höchstgeschwindigkeit um 20 Prozent ihres unmodifizierten Grundwertes. Das bedeutet zum Beispiel, dass sie mit zwei Stufen bei einer Harley-Davidson Scorpion von 200 auf 280 steigt.
item.modslot_elec_to_chassis.desc=Verfügbare Modifikationsslots für Chassis, Antrieb und Elektronik können im Verhältnis 2:1 dauerhaft in eine andere Kategorie übertragen werden. Man erhält also für jeweils 2 Slots der Ursprungskategorie 1 Slot der Zielkategorie.
item.modslot_elec_to_pp.desc=Verfügbare Modifikationsslots für Chassis, Antrieb und Elektronik können im Verhältnis 2:1 dauerhaft in eine andere Kategorie übertragen werden. Man erhält also für jeweils 2 Slots der Ursprungskategorie 1 Slot der Zielkategorie.
item.chameleon_coating.desc=Wenn das System aktiv ist, zeigen die Polymere die Umgebung jenseits des Fahrzeugs. Das verleiht dem Fahrzeug den Status Unsichtbar (Verbessert) (SR6, S. 55) mit einem Wert gleich der Stufe der Modifikation. Schnelle Bewegung überfordert allerdings selbst die modernsten Prozessoren, und die Qualität der Täuschung sinkt mit zunehmender Geschwindigkeit, bis schließlich ein sehr auffälliges Flimmern entsteht. Der Status Unsichtbar (Verbessert) geht verloren, sobald das Fahrzeug ins zweite Geschwindigkeitsintervall eintritt. Die Aktivierung bzw. Deaktivierung des Systems benötigt eine Nebenhandlung.
item.chameleon_coating.variant.huge.desc=Wenn das System aktiv ist, zeigen die Polymere die Umgebung jenseits des Fahrzeugs. Das verleiht dem Fahrzeug den Status Unsichtbar (Verbessert) (SR6, S. 55) mit einem Wert gleich der Stufe der Modifikation. Schnelle Bewegung überfordert allerdings selbst die modernsten Prozessoren, und die Qualität der Täuschung sinkt mit zunehmender Geschwindigkeit, bis schließlich ein sehr auffälliges Flimmern entsteht. Der Status Unsichtbar (Verbessert) geht verloren, sobald das Fahrzeug ins zweite Geschwindigkeitsintervall eintritt. Die Aktivierung bzw. Deaktivierung des Systems benötigt eine Nebenhandlung.
item.electrochromatic_paint.desc=Diese Modifikation entspricht einer elektrochromen Modifikation (SR6, S. 265) für die Außenhülle eines Fahrzeugs oder einer Drohne. Sie kann keine überzeugende Tarnung bieten, aber das Verändern von Farben oder Mustern braucht nur eine Nebenhandlung zur Aktivierung.
item.passive_stealth.desc= Mit diesen Merkmalen steigt der Schwellenwert für einen Beobachter zum Entdecken des Fahrzeugs um 1. Wenn der Fahrer des Fahrzeugs stattdessen eine Heimlichkeitsprobe als Vergleichende Probe ablegt, erhält er 1 automatischen Erfolg zusätzlich.
item.suncell_electr.desc=Mit dieser Modifikation kann ein Fahrzeug alle Energie erzeugen, die es braucht, wenn es an einem klaren Tag in der Sonne steht. Es kann Elektrizität oder flüssigen Treibstoff produzieren. Fahrzeuge mit Solarzellen können die Zeit, während der sie sich in der Sonne befinden, für die Berechnung ihrer Einsatzzeit ignorieren; nur Bewölkung oder Nacht wirken sich auf den Energievorrat aus.
item.zapper.desc=Das System kann vom Fahrer aktiv gesteuert oder mit einer Diebstahlsicherung (Stufe 3 oder besser) verbunden werden. Es verursacht 6B(e) Schaden an allen Personen, die Kontakt mit der Hülle haben. Wer dem Schaden nicht vollständig widersteht, erhält den Status Gebrutzelt (SR6, S. 54) für eine Anzahl von Runden gleich dem Schaden, dem nicht widerstanden wurde. Das System kann viermal ausgelöst werden, bevor es aufgeladen werden muss. Es lädt sich mit einer Ladung pro 5 Minuten wieder auf, während das Fahrzeug läuft oder an eine Energiequelle angeschlossen ist.

item.anti_theft.desc=Diebstahlsicherung, für Details siehe die Beschreibung der verschiedenen Stufen.
item.anti_theft.variant.rating1.desc=Die Standardsicherheit, die jedes Fahrzeug mit einem Pilot-Attribut über 0 serienmäßig bietet. Wenn die Sensoren des Fahrzeugs einen unbefugten Zugriff erkennen, alarmiert der Autopilot den Besitzer mit einer elektronischen Nachricht und versucht, Aufmerksamkeit mit Lichtern und Geräuschen zu erzeugen. Man kann ein System der Stufe 1 auch in einem Fahrzeug ohne Pilot (wie einen Anhänger) installieren; das ist die höchste Stufe, die bei solchen Fahrzeugen eingesetzt werden kann.
item.anti_theft.variant.rating2.desc=Neben der einfachen Benachrichtigung des Besitzers wie Stufe 1 schließt diese Stufe auch eine Meldung der GPS-Koordinaten des Fahrzeugs und Bildaufzeichnungen des Fahrzeuginneren und der Umgebung ein, wie sie von den Sensoren erfasst werden. Diese Übertragung kann auch direkt an die örtliche Polizei geschickt werden. Diese Stufe gestattet dem Besitzer außerdem, das Fahrzeug ferngesteuert abzuschalten, wodurch es physisch unmöglich wird, damit zu fahren, bis der Besitzer es mit einem Code entsperrt (oder diese Sperre geknackt wird).
item.anti_theft.variant.rating3.desc=Diese Stufe bietet alle für Stufe 1 und 2 genannten Optionen und zudem die Aktivierung anderer Fahrzeugsysteme wie Gasdüsen mit Toxinen nach Wahl oder Schockern (siehe S. 136).
item.anti_theft.variant.rating4.desc=Alle Möglichkeiten der Stufen 1-3 und außerdem eine Selbstzerstörung per Fernsteuerung mit genügend Plastiksprengstoff (mit einer Stufe gleich der Panzerung des Fahrzeugs), um das Fahrzeug in kleine bis mittlere Komponenten zu zerlegen.
item.command_control.desc=Eine K3-Einheit ist ein System, das für die gleichzeitige Verwaltung einer gewaltigen Anzahl an Kommunikationskanälen gedacht ist. Die Koordination übernimmt  ein  ausgeklügeltes  Steuerprogramm, was es einem einzelnen Metamenschen erlaubt, das Netzwerk effektiv zu managen. Wenn in einem PAN eine K3-Einheit vorhanden ist, kann dieses PAN eine beliebige Anzahl von Geräten (nach Maßgabe der Spielleitung) schützen.
item.electronic_control_lockout.desc= Ein physischer Knopf oder Schalter aktiviert oder unterbricht die Verbindungen. Wenn die elektronische Steuerung deaktiviert ist, ist es nicht möglich, ein Fahrzeug mit AR, VR, hineingesprungen oder per GridGuide zu steuern oder Autosofts zu benutzen. Das System kann nur physisch innerhalb des Fahrzeugs (mit einer Nebenhandlung) aktiviert oder deaktiviert werden – meistens vom Fahrersitz aus.
item.electronic_countermeasures.desc=Durch diese Modifikation erhält das Fahrzeug elektronische  Gegenmaßnahmen  (electronic  counter measures; ECM). Dadurch wirkt es wie ein zielgerichteter oder Bereichsstörsender (SR6, S. 271) mit der doppelten Reichweite des Handgeräts. Um den Störsender zu aktivieren oder zu deaktivieren oder zwischen gerichtetem oder Bereichsmodus umzuschalten, benötigt man eine Nebenhandlung.
item.integrated_matrix_device.desc=Diese Modifikation kann auch als Port oder als mehrere Ports erworben werden, wodurch Standardgeräte physisch mit den Fahrzeugsystemen verbunden werden können, aber trotzdem leicht zu entfernen bleiben. Geräte können dem PAN des Fahrzeugs auch per WiFi ohne zusätzliche Modifikationen hinzugefügt werden, aber integrierte oder über Ports angeschlossene Geräte haben den Vorteil, dass sie nicht gegen das Maximum an Geräten innerhalb des PANs zählen.
item.nanomaintenance_repair.desc=Bei dieser Modifikation werden einige spezialisierte Nanitenbrüter im Fahrzeug installiert, um Rumpf und Systeme des Fahrzeugs zu warten und zu reparieren. Das umfasst das Ausbeulen von Karosserieteilen und Ausbessern von Löchern, die Reinigung wichtiger Systeme und sogar den Neubau/Umbau von Teilen in kleinerem Ausmaß. Wenn das System die Reparatur autonom durchführt, legt es eine Probe mit seiner Stufe als Würfelpool ab. Je Erfolg wird 1 Kästchen Schaden am Fahrzeug repariert; der gesamte Vorgang dauert eine Stunde. Der Besitzer kann die Reparatur aber auch selbst ausführen und sich dabei vom System unterstützen lassen. In diesem Fall legt er die übliche Reparatur-Probe (S. 164) ab, wobei er einen Würfelpoolbonus in Höhe der Stufe des Nano-Wartungssystems erhält. Jeder Schaden muss mit einer der beiden Varianten repariert werden – man kann nicht zwei Reparaturen (einmal autonom, einmal mit dem System als Bonus) beim selben Schaden versuchen.
item.retrans_unit.desc=Die Relaiseinheit verwendet ein spezialisiertes System für Signalempfang und algorithmische Rekonstruktion, um ein bestimmtes Signal wiederaufzubauen und erneut zu senden und sämtliches Rauschen, das dieses Signal bisher gestört hatte, zu eliminieren. Dadurch verhält sich das Signal, als hätte es die Relaiseinheit als Ausgangspunkt. Ein Fahrzeug, das mit einer Relaiseinheit ausgestattet und Teil eines Gerätenetzwerks ist, kann verwendet werden, um sämtliche Signalübertragungen im Netzwerk erneut zu senden.
item.rigger_interface.desc=Das  Riggerinterface  erlaubt  dem  Rigger,  in  ein Fahrzeug hineinzuspringen und damit sozusagen zum Fahrzeug zu werden. Alle Drohnen besitzen serienmäßig ein Riggerinterface, aber bei bemannten Fahrzeugen ist das nicht der Standard. Ohne Riggerinterface kann ein Rigger ein Fahrzeug nur manuell oder per Fernsteuerung lenken, ohne hineinzuspringen.
item.xguide_override.desc=Wenn die Modifikation aktiviert ist, scheint das Fahrzeug normal mit dem System zu interagieren, aber der Pilot behält die Kontrolle über Situationen wie das Überschreiten der Höchstgeschwindigkeit oder das Fahren auf der falschen Spur. Außerdem kann das Fahrzeug nicht mehr per Fernsteuerung abgeschaltet werden. Die xGuide-Überbrückung verändert außerdem in zufälligen Abständen die Identifikationssignale des Fahrzeugs, sodass es nicht über längere Zeit verfolgt werden kann. Das Fahrzeug erhält aber nach wie vor Antriebsenergie vom GridLink-System, solange dieser Teil des Systems nutzbar ist.
item.improved_pilot.desc=Pilotprogramme von Fahrzeugen bieten die ausgeklügeltste Hardware und Software auf dem Markt; manche kommen sogar an einfache KIs heran. Die Verbesserung der Stufe des Pilot-Attributs bedeutet mehr als nur das Laden eines neuen Programms. Hardware wird ersetzt und verbessert, Kommunikationskanäle werden verstärkt, und die Steuerungssysteme des Fahrzeugs werden überholt. Das Pilot-Attribut kann eine Stufe von 1 bis 9 haben.
item.network_sharing.desc=Die Stufe des Systems gibt die Anzahl an Riggern an, die innerhalb davon operieren können. Die Modifikation erlaubt nicht mehr als einer Person gleichzeitig, in ein einzelnes Gerät/Fahrzeug hineinzuspringen, aber ein Team, das ein größeres Fahrzeug oder eine Anlage betreibt, kann einer Person das Steuern überlassen, während andere Teammitglieder Waffen, Sensoren oder andere integrierte Modifikationen bedienen. Der „Kapitän“ bestimmt, welche Fahrzeugfunktionen von anderen Teammitgliedern übernommen werden können. Andere Teilnehmer können ausgewählte Subsysteme bedienen, als wären diese einzelne Geräte, und können mit dem Kapitän zusammen Teamworkproben ablegen.
item.enhanced_sensors.desc=Das Sensornetz eines Fahrzeugs ist ein komplizierter, hochintegrierter Teil seines Elektroniksystems. Durch diese Modifikation werden zusätzliche Sensorarten eingebaut und existierende durch bessere Komponenten ersetzt. Das Sensor-Attribut gilt als Sensorarray (s. SR6, S. 277) mit einer Kapazität gleich seiner Stufe. Das Maximum an Gerätesensoren, die in ein Gehäuse installiert werden können, basiert auf der Größe des Fahrzeugs oder der Drohne (s. SR6, S. 278, Fahrzeug 7, Motorrad 6, Große Drohne 5, Mittlere Drohne 4, Kleinere Drohnen 3). Sensoren können eine Stufe zwischen 1 und 9 haben.

item.weapon_mount_small.desc=Waffenhalterungen sind mehr als nur ein Punkt, an dem man eine Waffe anschraubt – sie bieten einen Richtbereich von +/-45 Grad (horizontal und vertikal), und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann MPs oder kleinere Feuerwaffen aufnehmen, und der Munitionsvorrat verändert sich durch ein großes Kastenmagazin zu 100(s).
item.weapon_mount_small.variant.manual.desc=Waffenhalterungen sind mehr als nur ein Punkt, an dem man eine Waffe anschraubt – sie bieten einen Richtbereich von +/-45 Grad (horizontal und vertikal), und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann MPs oder kleinere Feuerwaffen aufnehmen, und der Munitionsvorrat verändert sich durch ein großes Kastenmagazin zu 100(s) und kann alternativ manuell gesteuert werden.
item.weapon_turret_small.desc=Ein Turm hat einen horizontalen Schusswinkel von 360 Grad und den üblichen Richtbereich von +/-45 Grad vertikal, und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann MPs oder kleinere Feuerwaffen aufnehmen, und der Munitionsvorrat verändert sich durch ein großes Kastenmagazin zu 100(s).
item.weapon_turret_small.variant.manual.desc=Ein Turm hat einen horizontalen Schusswinkel von 360 Grad und den üblichen Richtbereich von +/-45 Grad vertikal, und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann MPs oder kleinere Feuerwaffen aufnehmen, und der Munitionsvorrat verändert sich durch ein großes Kastenmagazin zu 100(s) und kann alternativ manuell gesteuert werden.
item.weapon_mount_standard.desc=Waffenhalterungen sind mehr als nur ein Punkt, an dem man eine Waffe anschraubt – sie bieten einen Richtbereich von +/-45 Grad (horizontal und vertikal), und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann Sturmgewehre oder kleinere Feuerwaffen aufnehmen, und der Munitionsvorrat verändert sich durch ein großes Kastenmagazin zu 250(s).
item.weapon_turret_standard.variant.manual.desc=Waffenhalterungen sind mehr als nur ein Punkt, an dem man eine Waffe anschraubt – sie bieten einen Richtbereich von +/-45 Grad (horizontal und vertikal), und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann Sturmgewehre oder kleinere Feuerwaffen aufnehmen, und der Munitionsvorrat verändert sich durch ein großes Kastenmagazin zu 250(s) und kann alternativ manuell gesteuert werden.
item.weapon_turret_standard.desc=Ein Turm hat einen horizontalen Schusswinkel von 360 Grad und den üblichen Richtbereich von +/-45 Grad vertikal, und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann Sturmgewehre oder kleinere Feuerwaffen aufnehmen, und der Munitionsvorrat verändert sich durch ein großes Kastenmagazin zu 250(s).
item.weapon_turret_standard.variant.manual.desc=Ein Turm hat einen horizontalen Schusswinkel von 360 Grad und den üblichen Richtbereich von +/-45 Grad vertikal, und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann Sturmgewehre oder kleinere Feuerwaffen aufnehmen, und der Munitionsvorrat verändert sich durch ein großes Kastenmagazin zu 250(s) und kann alternativ manuell gesteuert werden.
item.weapon_mount_heavy.desc=Waffenhalterungen sind mehr als nur ein Punkt, an dem man eine Waffe anschraubt – sie bieten einen Richtbereich von +/-45 Grad (horizontal und vertikal), und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann jede tragbare Waffe aufnehmen, meistens aber solche, die größer als ein Sturmgewehr sind. Der Munitionsvorrat verändert sich zu 500(g) oder einer Anzahl von (Lenk-)Raketen gleich dem Rumpf-Attribut des Fahrzeugs.
item.weapon_turret_heavy.variant.manual.desc=Waffenhalterungen sind mehr als nur ein Punkt, an dem man eine Waffe anschraubt – sie bieten einen Richtbereich von +/-45 Grad (horizontal und vertikal), und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann jede tragbare Waffe aufnehmen, meistens aber solche, die größer als ein Sturmgewehr sind. Der Munitionsvorrat verändert sich zu 500(g) oder einer Anzahl von (Lenk-)Raketen gleich dem Rumpf-Attribut des Fahrzeugs und kann alternativ manuell gesteuert werden.
item.weapon_turret_heavy.desc=Ein Turm hat einen horizontalen Schusswinkel von 360 Grad und den üblichen Richtbereich von +/-45 Grad vertikal, und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann jede tragbare Waffe aufnehmen, meistens aber solche, die größer als ein Sturmgewehr sind. Der Munitionsvorrat verändert sich zu 500(g) oder einer Anzahl von (Lenk-)Raketen gleich dem Rumpf-Attribut des Fahrzeugs.
item.weapon_turret_heavy.variant.manual.desc=Ein Turm hat einen horizontalen Schusswinkel von 360 Grad und den üblichen Richtbereich von +/-45 Grad vertikal, und alle Halterungen sind grundsätzlich ferngesteuert. Zur Abbildung der zusätzlichen Rückstoßkompensation erhalten Waffen in jeder Art von Halterung einen um 2 erhöhten Angriffswert in allen Reichweitenkategorien, in denen sie einen Angriffswert haben, und der Angriffswertmalus durch Schießen im Salvenmodus und Vollautomatischen Modus (s. SR6, S. 112) wird halbiert. Diese Halterung kann jede tragbare Waffe aufnehmen, meistens aber solche, die größer als ein Sturmgewehr sind. Der Munitionsvorrat verändert sich zu 500(g) oder einer Anzahl von (Lenk-)Raketen gleich dem Rumpf-Attribut des Fahrzeugs und kann alternativ manuell gesteuert werden.
item.hardpoint_concealment.variant.blow_away_panels.desc=Alte Variante, bitte löschen und neu hinzufügen.
item.blow_away_panels.desc=Diese einfachen Abdeckungen sind dazu gedacht, direkt vor dem Feuern mit der Waffe von der Halterung abgeworfen zu werden. Das Abwerfen wird mit einer Nebenhandlung ausgelöst, und die verborgene Waffe ist sofort einsatzbereit. Danach ist die Waffe enthüllt und offen sichtbar, aber die Methode ist einfach und billig. Einwegabdeckungen fügen sich nicht sehr gut in die Silhouette der meisten Fahrzeuge ein und sind eher auffällig. Eine erfolgreiche Probe auf Wahrnehmung + Intuition (2) deckt auf, dass etwas verdeckt wird, aber nicht, was es ist (manchmal kann es allerdings leicht zu erraten sein). Die Stufe einer Einwegabdeckung entspricht der Größe des verdeckten Befestigungspunkts: von 1 (klein) bis 4 (riesig).
item.hardpoint_concealment.desc=Hiermit kann eine Waffenhalterung außer Sicht unter der Außenhaut eines Fahrzeugs verborgen werden.
item.hardpoint_concealment.variant.small.desc=Hiermit kann eine Waffenhalterung außer Sicht unter der Außenhaut eines Fahrzeugs verborgen werden. Die entsprechende Waffenhalterung samt Waffe kann auf Befehl mit einer Nebenhandlung aus- bzw. eingefahren werden. Ausfahrbare Abdeckungen sind viel schwerer zu entdecken als Einwegabdeckungen. Es ist eine erfolgreiche Probe auf Wahrnehmung + Intuition (4) erforderlich, um auf die Idee zu kommen, dass etwas unter der Hülle des Fahrzeugs verborgen ist. Diese Abdeckungen sind wiederbenutzbar, aber die Mechanismen sind sperrig und teuer – das System benötigt dieselbe Anzahl an Modifikationsslots wie der entsprechende Befestigungspunkt.
item.hardpoint_concealment.variant.standard.desc=Hiermit kann eine Waffenhalterung außer Sicht unter der Außenhaut eines Fahrzeugs verborgen werden. Die entsprechende Waffenhalterung samt Waffe kann auf Befehl mit einer Nebenhandlung aus- bzw. eingefahren werden. Ausfahrbare Abdeckungen sind viel schwerer zu entdecken als Einwegabdeckungen. Es ist eine erfolgreiche Probe auf Wahrnehmung + Intuition (4) erforderlich, um auf die Idee zu kommen, dass etwas unter der Hülle des Fahrzeugs verborgen ist. Diese Abdeckungen sind wiederbenutzbar, aber die Mechanismen sind sperrig und teuer – das System benötigt dieselbe Anzahl an Modifikationsslots wie der entsprechende Befestigungspunkt.
item.hardpoint_concealment.variant.large.desc=Hiermit kann eine Waffenhalterung außer Sicht unter der Außenhaut eines Fahrzeugs verborgen werden. Die entsprechende Waffenhalterung samt Waffe kann auf Befehl mit einer Nebenhandlung aus- bzw. eingefahren werden. Ausfahrbare Abdeckungen sind viel schwerer zu entdecken als Einwegabdeckungen. Es ist eine erfolgreiche Probe auf Wahrnehmung + Intuition (4) erforderlich, um auf die Idee zu kommen, dass etwas unter der Hülle des Fahrzeugs verborgen ist. Diese Abdeckungen sind wiederbenutzbar, aber die Mechanismen sind sperrig und teuer – das System benötigt dieselbe Anzahl an Modifikationsslots wie der entsprechende Befestigungspunkt.
item.hardpoint_concealment.variant.huge.desc=Hiermit kann eine Waffenhalterung außer Sicht unter der Außenhaut eines Fahrzeugs verborgen werden. Die entsprechende Waffenhalterung samt Waffe kann auf Befehl mit einer Nebenhandlung aus- bzw. eingefahren werden. Ausfahrbare Abdeckungen sind viel schwerer zu entdecken als Einwegabdeckungen. Es ist eine erfolgreiche Probe auf Wahrnehmung + Intuition (4) erforderlich, um auf die Idee zu kommen, dass etwas unter der Hülle des Fahrzeugs verborgen ist. Diese Abdeckungen sind wiederbenutzbar, aber die Mechanismen sind sperrig und teuer – das System benötigt dieselbe Anzahl an Modifikationsslots wie der entsprechende Befestigungspunkt.
item.expanded_ammo.desc=Jeder dieser Behälter verdoppelt die Munitionskapazität einer Waffenhalterung. Sie können eine Stufe von 1 bis 3 haben, was äquivalent zu den Behältern für Leichte, Standard- und Schwere Waffenhalterungen (S. 140) ist.

item.drone_rack.desc=Drohnenhalterungen sind über Befestigungspunkte mit einem Fahrzeug verbunden und dienen der Aufbewahrung, dem Transport und dem schnellen Einsatz einer Drohne (in manchen Fällen auch mehrerer). Sie werden nach der Drohnenklasse kategorisiert, für die sie ausgelegt sind, befinden sich meistens innerhalb der Hülle des Fahrzeugs und weisen eine Klappe oder Schiebeabdeckung auf.
item.drone_rack.variant.micromini.desc=Für bis zu fünf Mini- oder Mikrodrohnen. Drohnenhalterungen sind über Befestigungspunkte mit einem Fahrzeug verbunden und dienen der Aufbewahrung, dem Transport und dem schnellen Einsatz einer Drohne (in manchen Fällen auch mehrerer). Sie werden nach der Drohnenklasse kategorisiert, für die sie ausgelegt sind, befinden sich meistens innerhalb der Hülle des Fahrzeugs und weisen eine Klappe oder Schiebeabdeckung auf.
item.drone_rack.variant.small.desc=Für bis zu drei Kleine Drohnen. Drohnenhalterungen sind über Befestigungspunkte mit einem Fahrzeug verbunden und dienen der Aufbewahrung, dem Transport und dem schnellen Einsatz einer Drohne (in manchen Fällen auch mehrerer). Sie werden nach der Drohnenklasse kategorisiert, für die sie ausgelegt sind, befinden sich meistens innerhalb der Hülle des Fahrzeugs und weisen eine Klappe oder Schiebeabdeckung auf.
item.drone_rack.variant.medium.desc=Für eine Mittlere Drohne. Drohnenhalterungen sind über Befestigungspunkte mit einem Fahrzeug verbunden und dienen der Aufbewahrung, dem Transport und dem schnellen Einsatz einer Drohne (in manchen Fällen auch mehrerer). Sie werden nach der Drohnenklasse kategorisiert, für die sie ausgelegt sind, befinden sich meistens innerhalb der Hülle des Fahrzeugs und weisen eine Klappe oder Schiebeabdeckung auf.
item.drone_rack.variant.large.desc=Für eine Große Drohne. Drohnenhalterungen sind über Befestigungspunkte mit einem Fahrzeug verbunden und dienen der Aufbewahrung, dem Transport und dem schnellen Einsatz einer Drohne (in manchen Fällen auch mehrerer). Sie werden nach der Drohnenklasse kategorisiert, für die sie ausgelegt sind, befinden sich meistens innerhalb der Hülle des Fahrzeugs und weisen eine Klappe oder Schiebeabdeckung auf.
item.expanded_drone_storage.desc=Zusätzlicher Stauraum für Drohnen kann bei jeder Drohnenhalterung angebracht werden, kann aber nur den Stauraum für Drohnen der zur Halterung passenden Größe vergrößern.
item.expanded_drone_storage.variant.micromini.desc=Für bis zu fünf weitere Mini- oder Mikrodrohnen. Zusätzlicher Stauraum für Drohnen kann bei jeder Drohnenhalterung angebracht werden, kann aber nur den Stauraum für Drohnen der zur Halterung passenden Größe vergrößern.
item.expanded_drone_storage.variant.small.desc=Für bis zu drei weitere Kleine Drohnen. Zusätzlicher Stauraum für Drohnen kann bei jeder Drohnenhalterung angebracht werden, kann aber nur den Stauraum für Drohnen der zur Halterung passenden Größe vergrößern.
item.expanded_drone_storage.variant.medium.desc=Für eine weitere Mittlere Drohne. Zusätzlicher Stauraum für Drohnen kann bei jeder Drohnenhalterung angebracht werden, kann aber nur den Stauraum für Drohnen der zur Halterung passenden Größe vergrößern.
item.expanded_drone_storage.variant.large.desc=Für eine weitere Große Drohne. Zusätzlicher Stauraum für Drohnen kann bei jeder Drohnenhalterung angebracht werden, kann aber nur den Stauraum für Drohnen der zur Halterung passenden Größe vergrößern.

item.mechanical_arm.desc=Dies ist die Art von Armen, die man täglich an Nutzfahrzeugen und Baudrohnen sieht, von Müllwagen über Rettungsdrohnen bis hin zu Forschungs-U-Booten. Diese Arme können sich nur eingeschränkt bewegen und sind nur für einfache Tätigkeiten wie das Bewegen von Kisten in einem Lagerhaus oder Steine auf einer Baustelle zu gebrauchen. Wenn man versucht, einen mechanischen Arm für eine Aufgabe einzusetzen, die Feinmotorik verlangt, wird das Attribut des Benutzers, das er zum Steuern verwendet, halbiert. Die maximale Länge beträgt [Rumpf x 20] Zentimeter. Der Arm hat eine Stärke in Höhe des halben Rumpf-Attributs (aufgerundet), und die Stärke gibt die Größenklasse des Arms vor. Ein mechanischer Arm kann einen Nahkampfangriff (Angriffswert = Sensor + Stärke des Arms) gegen ein Ziel innerhalb seiner Reichweite ausführen, wenn er ferngesteuert ist oder das Fahrzeug die Autosoft Zielerfassung (Nahkampf) besitzt.
item.mechanical_arm.variant.small.desc=Bis Stärke 2, Nahkampf 2K. \n Dies ist die Art von Armen, die man täglich an Nutzfahrzeugen und Baudrohnen sieht, von Müllwagen über Rettungsdrohnen bis hin zu Forschungs-U-Booten. Diese Arme können sich nur eingeschränkt bewegen und sind nur für einfache Tätigkeiten wie das Bewegen von Kisten in einem Lagerhaus oder Steine auf einer Baustelle zu gebrauchen. Wenn man versucht, einen mechanischen Arm für eine Aufgabe einzusetzen, die Feinmotorik verlangt, wird das Attribut des Benutzers, das er zum Steuern verwendet, halbiert. Die maximale Länge beträgt [Rumpf x 20] Zentimeter. Der Arm hat eine Stärke in Höhe des halben Rumpf-Attributs (aufgerundet), und die Stärke gibt die Größenklasse des Arms vor. Ein mechanischer Arm kann einen Nahkampfangriff (Angriffswert = Sensor + Stärke des Arms) gegen ein Ziel innerhalb seiner Reichweite ausführen, wenn er ferngesteuert ist oder das Fahrzeug die Autosoft Zielerfassung (Nahkampf) besitzt.
item.mechanical_arm.variant.medium.desc=Ab Rumpf 6, bis Stärke 5, Nahkampf 3K. \n Dies ist die Art von Armen, die man täglich an Nutzfahrzeugen und Baudrohnen sieht, von Müllwagen über Rettungsdrohnen bis hin zu Forschungs-U-Booten. Diese Arme können sich nur eingeschränkt bewegen und sind nur für einfache Tätigkeiten wie das Bewegen von Kisten in einem Lagerhaus oder Steine auf einer Baustelle zu gebrauchen. Wenn man versucht, einen mechanischen Arm für eine Aufgabe einzusetzen, die Feinmotorik verlangt, wird das Attribut des Benutzers, das er zum Steuern verwendet, halbiert. Die maximale Länge beträgt [Rumpf x 20] Zentimeter. Der Arm hat eine Stärke in Höhe des halben Rumpf-Attributs (aufgerundet), und die Stärke gibt die Größenklasse des Arms vor. Ein mechanischer Arm kann einen Nahkampfangriff (Angriffswert = Sensor + Stärke des Arms) gegen ein Ziel innerhalb seiner Reichweite ausführen, wenn er ferngesteuert ist oder das Fahrzeug die Autosoft Zielerfassung (Nahkampf) besitzt.
item.mechanical_arm.variant.large.desc=Ab Rumpf 12, bis Stärke 10, Nahkampf 4K. \n Dies ist die Art von Armen, die man täglich an Nutzfahrzeugen und Baudrohnen sieht, von Müllwagen über Rettungsdrohnen bis hin zu Forschungs-U-Booten. Diese Arme können sich nur eingeschränkt bewegen und sind nur für einfache Tätigkeiten wie das Bewegen von Kisten in einem Lagerhaus oder Steine auf einer Baustelle zu gebrauchen. Wenn man versucht, einen mechanischen Arm für eine Aufgabe einzusetzen, die Feinmotorik verlangt, wird das Attribut des Benutzers, das er zum Steuern verwendet, halbiert. Die maximale Länge beträgt [Rumpf x 20] Zentimeter. Der Arm hat eine Stärke in Höhe des halben Rumpf-Attributs (aufgerundet), und die Stärke gibt die Größenklasse des Arms vor. Ein mechanischer Arm kann einen Nahkampfangriff (Angriffswert = Sensor + Stärke des Arms) gegen ein Ziel innerhalb seiner Reichweite ausführen, wenn er ferngesteuert ist oder das Fahrzeug die Autosoft Zielerfassung (Nahkampf) besitzt.
item.mechanical_arm.variant.huge.desc=Ab Rumpf 22, bis Stärke 20, Nahkampf 5K. \n Dies ist die Art von Armen, die man täglich an Nutzfahrzeugen und Baudrohnen sieht, von Müllwagen über Rettungsdrohnen bis hin zu Forschungs-U-Booten. Diese Arme können sich nur eingeschränkt bewegen und sind nur für einfache Tätigkeiten wie das Bewegen von Kisten in einem Lagerhaus oder Steine auf einer Baustelle zu gebrauchen. Wenn man versucht, einen mechanischen Arm für eine Aufgabe einzusetzen, die Feinmotorik verlangt, wird das Attribut des Benutzers, das er zum Steuern verwendet, halbiert. Die maximale Länge beträgt [Rumpf x 20] Zentimeter. Der Arm hat eine Stärke in Höhe des halben Rumpf-Attributs (aufgerundet), und die Stärke gibt die Größenklasse des Arms vor. Ein mechanischer Arm kann einen Nahkampfangriff (Angriffswert = Sensor + Stärke des Arms) gegen ein Ziel innerhalb seiner Reichweite ausführen, wenn er ferngesteuert ist oder das Fahrzeug die Autosoft Zielerfassung (Nahkampf) besitzt.
item.ram_plate.desc=Rammböcke gibt es in verschiedenen Formen und Größen, und sie müssen an einem Standard-Befestigungspunkt montiert werden. Bei einem Rammangriff (SR6, S. 200) mit dem Rammbock wird das Rumpf-Attribut des Fahrzeugs zum Angriffswert des Angriffs addiert, und der Schaden, dem das rammende Fahrzeug bei der Kollision widerstehen muss, wird halbiert.
item.winch.desc=Eine einfache Winde der Stufe 1 hat ein Stahlseil, das um eine angetriebene Trommel gewunden ist und in einem Abschlepphaken endet. Sie hat etwa 100 Meter Seil und kann bis zu 10 Tonnen ziehen, wenn das Fahrzeug selbst schwer genug dafür ist. Bei aktiviertem WiFi kann der Haken per Fernsteuerung losgemacht werden. Eine verbesserte Seilwinde der Stufe 2 wird eher in der Industrie oder bei Rettungsfahrzeugen eingesetzt. Hier ist statt des Hakens ein fortschrittliches Haltesystem montiert, das sich mit einer Kombination aus Geckogriff und Magnet an jeder Oberfläche des Zielobjekts selbstständig befestigen kann, ohne dass man manuell einen Haken anbringen müsste. Das System kann per WiFi mit einem Kommando aktiviert oder deaktiviert werden, was jeweils eine Nebenhandlung kostet.
item.push_bar.desc=DV 4P, AR 8
item.gmc_forge.item.tow_assembly.desc= Wenn man eine Reparatur nicht im Feld ausführen kann, kommt das einziehbare Abschleppsystem zum Einsatz, das mit Fahrzeugen bis zur Größe eines Sattelschleppers fertigwird.(Stärke für Heben/ Ziehen: 12)
item.tool_storage.desc=Werkzeugfach oder Werkzeughalterung

item.secondary_propulsion_system.desc=Sekundärantrieb
item.secondary_propulsion_system.variant.submarine.desc=Durch eine versiegelte Druckkabine mit eigenem Luftvorrat, eine wasserdichte Energieerzeugung und Ballasttanks zur Tiefensteuerung kann ein Fahrzeug mit dieser Modifikation tauchen und kurze Zeit unter Wasser fahren. Die maximale Einsatzzeit unter Wasser beträgt 30 Minuten.
item.secondary_propulsion_system.variant.boat.desc=Diese Modifikation verwendet eine wasserdichte Konstruktion und eingebaute Schwimmer, um das Fahrzeug zu einem Boot zu machen, wenn auch zu keinem besonders guten. Wasserflugzeuge und andere Luftfahrzeuge nutzen Pontons, um die tragenden Oberflächen außerhalb des Wassers zu halten.
item.secondary_propulsion_system.variant.glide.desc=Dieses System verwendet Fallschirme und eine Reihe kleiner Düsen, um eine eingeschränkte Mobilität beim Absinken zu ermöglichen. Das Fahrzeug kann sich für jeden Meter, den es sinkt, drei Meter vorwärtsbewegen. Das ist besser als ein freier Fall bis zum Boden, aber nicht viel besser: Die „Landung“ gilt als Crash mit einer Geschwindigkeit von 20 Metern pro Kampfrunde. Das Gleitsystem benötigt 1 Kampfrunde, bis es einsatzbereit ist.
item.secondary_propulsion_system.variant.hovercraft.desc=Selbstaufblasende Luftschürzen um das Fahrzeug herum für den Auftrieb und gelenkter Vektorschub zur Fortbewegung verwandeln ein Fahrzeug in ein Hovercraft, das Wasser und weiche Oberflächen wie Sümpfe überqueren kann.
item.secondary_propulsion_system.variant.rocket.desc=Diese extreme Modifikation gibt dem Fahrzeug ein zusätzliches Raketenantriebssystem, mit dem es kurze Sprünge über Geländemerkmale oder Hindernisse machen kann. Ein Raketenantrieb beeinflusst den Primärantrieb nicht, wenn er einsatzbereit, aber nicht aktiv ist. Nach dem Herstellen der Einsatzbereitschaft benötigt er zur Aktivierung nur eine Nebenhandlung. Der Raketenantrieb kann 3 Kampfrunden lang laufen, dann ist der Treibstoff aufgebraucht
item.secondary_propulsion_system.variant.rotor.desc=Ein Sekundärantrieb mit Rotor besteht aus Rotoren im Dach des Fahrzeugs, die sich falten und partiell zurückziehen können. Außerdem wird eine Heckflosse mit stabilisierendem Rotor angebracht, die sich in, neben oder unter das Fahrzeug zurückziehen kann. Das System funktioniert – das Fahrzeug kann jetzt fliegen, obwohl es das vorher nicht konnte –, aber es fliegt sich wie eine Scheune mit Rotoren.
item.secondary_propulsion_system.variant.tracked.desc=Der Kettenmodus ist perfekt für das Überqueren von schwierigem Gelände.
item.secondary_propulsion_system.variant.vector_thrust.desc=Mit genug Schub können sogar Ziegelsteine fliegen. Durch das Beste auf dem Gebiet moderner Gyrostabilisierung und einen maximierten Bodeneffekt kannst du endlich ein fliegendes Auto haben! Es kommt bloß nicht sehr hoch vom Boden weg.
item.secondary_propulsion_system.variant.walker.desc=Für extrem schwieriges oder außergewöhnliches Gelände installieren einige Rigger ein Läufersystem. Es kann eine variable Anzahl (vier bis acht) einziehbarer mechanischer Beine eingebaut werden.
item.secondary_propulsion_system.variant.wheeled.desc=Eigentlich gibt es dieses System bereits bei fast allen Flugzeugen. Es ist so weit verbreitet, dass es als Standard gilt. Bei anderen Fahrzeugen, die eigentlich keine Räder haben, ist es weniger verbreitet – wie zum Beispiel bei Wasserfahrzeugen, die kurzzeitig an Land eingesetzt werden.
item.secondary_propulsion_system.variant.winged.desc=Dein Fahrzeug kann sich buchstäblich Flügel wachsen lassen! Einziehbare Tragflächen falten sich aus dem Dach aus, und der Schub wird von Turbo-Mantelpropellern erzeugt.

item.control_rig_DC.desc=Riggerkontrolle
item.medullan_processors.desc=Diese Cyberware erweitert den Hirnstamm um zusätzliche Schaltungen und Nanoprozessoren. Sie muss zusammen mit einer Riggerkontrolle verwendet werden (SR6, S. 285). Jede Stufe dieser Cyberware gewährt einen zusätzlichen Initiativewürfel, was kumulativ mit kaltem und heißem Sim ist. Die zusätzlichen Würfel gelten nur, wenn der Nutzer hineingesprungen ist.
item.simsense_overdrive.desc=Diese Cyberware besteht aus parallelen Simsinn-Prozessoren im Gehirn, die die Reflexe und damit verbundenen Funktionen verbessern. Jede Stufe dieser Cyberware steigert die Intuition des Charakters um 1. Weil die Bodytech auf Simsinn-Input angewiesen ist, wirkt diese Verbesserung nur, wenn sich der Nutzer in der VR befindet. Simsinn-Booster funktionieren nur im Zusammenspiel mit einer Riggerkontrolle, also nur beim Riggen.
item.soft_language.desc=Sprache (Anfänger: Stufe 1, Spezialist: Stufe 3, Experte: Stufe 5)
item.soft_knowledge.desc=Wissensfertigkeiten (immer als Autosoft der Stufe 3 erworben)
item.soft_biotech.desc=Fertigkeit Biotech. Gewisse Fertigkeiten sind ohne Gliedmaßen nicht nutzbar.
item.soft_con_performance.desc=Fertigkeit Überreden (Schauspielern). Gewisse Fertigkeiten sind ohne Gliedmaßen nicht nutzbar.
item.soft_close_combat.desc=Fertigkeit Nahkampf. Gewisse Fertigkeiten sind ohne Gliedmaßen nicht nutzbar.
item.soft_cracking.desc=Fertigkeit Cracken (Elektronische Kriegsführung)
item.soft_electronics_hardware.desc=Fertigkeit Elektronik (Hardware)
item.soft_engineering.desc=Fertigkeit Mechanik (nach Spezialisierung). Gewisse Fertigkeiten sind ohne Gliedmaßen nicht nutzbar.
item.soft_freefall.desc=Fertigkeit Athletik (Freier Fall)
item.soft_influence.desc=Fertigkeit Einfluss (Unterrichten)
item.soft_navigation.desc=Fertigkeit  Natur (Navigation)
item.soft_tracking.desc=Fertigkeit Natur (Spurenlesen)
item.crash_burn.desc= Diese E-Soft erlaubt den Einsatz der Matrixhandlung Datenspike, aber nur, wenn Icons von Fahrzeugen oder Drohnen das Ziel sind. Wenn die entsprechende Probe abgelegt wird, gewährt die E-Soft ein virtuelles Angriffs-Attribut gleich ihrer Stufe. Das Programm zählt hinsichtlich des Overwatch-Werts als Hackingprogramm.
item.emergency_override.desc= Damit wird bei der Matrixhandlung Befehl vortäuschen die Stufe der E-Soft zur Erhöhung des Angriffswerts eingesetzt. Das gilt allerdings nur, wenn das Ziel der Handlung ein Gerät ist, das mit Fahrzeugen und/oder Drohnen interagieren soll – wie etwa Ampeln, Schranken, einziehbare Poller usw. Das Programm zählt hinsichtlich des Overwatch-Werts als Hackingprogramm.
item.reroute.desc=Diese E-Soft gewährt ein virtuelles Schleicher-Attribut gleich ihrer Stufe. Es kommt allerdings nur bei der Verteidigung gegen die Matrixhandlung Icon aufspüren zum Einsatz.
item.run_silent.desc= Diese E-Soft gewährt ein virtuelles Schleicher-Attribut gleich ihrer Stufe, wenn das PAN der Riggerkonsole auf Schleichfahrt läuft. Dieses Attribut kann nur zur Verteidigung gegen Matrix-Wahrnehmungsproben gegen das PAN benutzt werden.
item.slim_jim.desc=Diese E-Soft erlaubt den Einsatz der Matrixhandlungen Brute Force und Gerät steuern, aber nur, wenn Icons von Fahrzeugen oder Drohnen das Ziel sind. Bei der Probe auf Brute Force gewährt die E-Soft auch ein virtuelles Angriffs-Attribut gleich ihrer Stufe. Das Programm zählt hinsichtlich des Overwatch-Werts als Hackingprogramm.
item.smart_rig.desc=Wenn dieses Programm über eine Riggerkonsole mit den Drohnen geteilt wird, erhalten alle Drohnen den Vorteil einer Sensorerfassung (S. 137), die von einer teilnehmenden Drohne ausgelöst wird.
item.swarm_rig.desc=Drohnen können wie alles andere als Gruppe angreifen (s. Schergen-Gruppen, SR6, S. 117). Wenn dieses Programm über eine Riggerkonsole mit den Drohnen geteilt wird, zählt jede Drohne nach der ersten als zwei Teilnehmer.
item.soft_assist_kit.desc=Automatische Assistenzsoftware (AAS), die in Werkzeugkisten installiert ist, stellt während einer Reparatur in Echtzeit Analysen zur Verfügung und generiert damit 1 Edge für alle Reparierenproben, die mit den betreffenden Werkzeugen durchgeführt werden. Automatische Assistenzsoftware in einer Werkzeugkiste verfügt über Datenverarbeitung 3 und Firewall 4.
item.soft_assist_shop.desc=Automatische Assistenzsoftware (AAS), die in Läden installiert ist, stellt während einer Reparatur in Echtzeit Analysen zur Verfügung und generiert damit 1 Edge für alle Reparierenproben, die mit den betreffenden Werkzeugen durchgeführt werden. In einem Laden installierte AAS erlaubt es einem Runner zudem, in einer Runde mehr Edge zu erhalten, als normalerweise zulässig wäre – so, als wäre der Laden bzw. die Werkstatt ein unabhängiger Charakter mit einem eigenen Edgeattribut. Läden können bis zu 4 Edge speichern.  Automatische Assistenzsoftware in einem Laden verfügt über Datenverarbeitung 4 und Firewall 5.
item.soft_assist_facility.desc=Automatische Assistenzsoftware (AAS), die in Werkstätten installiert ist, stellt während einer Reparatur in Echtzeit Analysen zur Verfügung und generiert damit 1 Edge für alle Reparierenproben, die mit den betreffenden Werkzeugen durchgeführt werden. In einer Werkstatt installierte AAS erlaubt es einem Runner zudem, in einer Runde mehr Edge zu erhalten, als normalerweise zulässig wäre – so, als wäre der Laden bzw. die Werkstatt ein unabhängiger Charakter mit einem eigenen Edgeattribut. Werkstätten bis zu 7 Edge speichern.  Automatische Assistenzsoftware in einer Werkstatt verfügt über Datenverarbeitung 5 und Firewall 6.
item.nanoforge_case.desc=Die Rückkehr der Nanosinter-Technologie brachte eine Vielzahl neuer Optionen mit sich. Wenn du diese in eurer Spielrunde einsetzen möchtest, behalte im Hinterkopf, dass Nano-Sinteranlagen und auch alle anderen Nanotechnologien nicht in der Lage sind, Materie zu manipulieren und Dinge aus dem Nichts zu erschaffen. Sie brauchen Rohmaterial, um Teile zu produzieren, und sie brauchen Programme. Mit „Programmen“ sind die Baupläne gemeint, die bereits an anderer Stelle erwähnt wurden. Wie zuvor erläutert (S. 160) verfügt jede Klasse von Nano-Sinteranlagen über Größenparameter, die bestimmen, was hergestellt werden kann und wie viel Platz die Anlage benötigt. Fahrzeug-Ersatzteile werden meist mit Stand-Sinteranlagen produziert – diese müssen zwar auf einer ausreichend großen, stabilen Fläche aufgebaut werden, sind jedoch klein genug, um sich zusammen mit einem Laden in einen Van verladen zu lassen.
item.virtual_garage.desc=Eine virtuelle Garage ist ein nützliches Werkzeug, das in eine Werkstatt integriert werden kann. Indem du mit einem AR-Modell arbeitest, kannst du nach Belieben herumexperimentieren, ohne Angst haben zu müssen, permanente Schäden anzurichten. Wenn du während des Entwurfsprozesses eine virtuelle Garage verwendest, erhältst du bei jedem Würfelwurf der Ausgedehnten Probe 1 Edge.

