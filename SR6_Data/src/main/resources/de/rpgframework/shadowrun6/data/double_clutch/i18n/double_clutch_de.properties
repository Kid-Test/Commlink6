designopt.improved_body.desc=Die grundlegende strukturelle Integrität des Chassis wird verbessert. Jede Stufe erhöht das Rumpfattribut des Fahrzeugs um 1. Maximalstufe: 4
designopt.improved_armor.desc=Überall im Fahrzeug werden zusätzliche Panzerplatten und andere schützende Strukturen eingebaut, um die Panzerung um 1 pro Stufe zu erhöhen. Maximalstufe: Rumpf x 2
designopt.improved_handling.desc=Indem die Aufhängung und/oder das Steuerungssystem angepasst werden, kann erreicht werden, dass ein Fahrzeug besser auf manuelle oder elektronische Steuerimpulse anspricht. Das Handling kann bis zu dreimal verbessert werden. Jede Stufe senkt den Handlingwert um 1. Maximalstufe: 3
designopt.improved_handling_offroad.desc=Indem die Aufhängung und/oder das Steuerungssystem angepasst werden, kann erreicht werden, dass ein Fahrzeug besser auf manuelle oder elektronische Steuerimpulse anspricht. Das Handling kann bis zu dreimal verbessert werden. Jede Stufe senkt den Handlingwert um 1. Maximalstufe: 3
designopt.improved_handling_onroad.desc=Indem die Aufhängung und/oder das Steuerungssystem angepasst werden, kann erreicht werden, dass ein Fahrzeug besser auf manuelle oder elektronische Steuerimpulse anspricht. Das Handling kann bis zu dreimal verbessert werden. Jede Stufe senkt den Handlingwert um 1. Maximalstufe: 3
designopt.improved_seating.desc=Ein Fahrzeug mit einer größeren Anzahl von Sitzen kann mehr Passagiere befördern. Ohne die Größenklasse des Fahrzeugs zu erhöhen, kann nur eine begrenzte Anzahl von zusätzlichen Sitzen eingebaut werden. Maximalzahl: 50 % des ursprünglichen Sitzattributs
designopt.improved_size.desc=Für jede Stufe Vergrößerung erhöhen sich die Größenklasse des Fahrzeugs um 1, der Rumpf um 2 und die Sitze um 50 Prozent. Für die Steigerung gibt es keine Maximalstufe, Fahrzeuge können jedoch maximal Größenklasse 20 erreichen. Soll die Größenklasse gesenkt werden, darf diese Option maximal zweimal gewählt werden. Drohnen sind ein Sonderfall, da sich mit der Änderung der Größenklasse auch ihr Chassis-Typ ändert (sofern nicht die Größenklasse einer großen Drohne weiter erhöht wird). Maximalstufe: 2 (nur bei Senkung)
designopt.improved_acceleration.desc=Mithilfe einer Vielzahl von Methoden wie beispielsweise Einspritzung, Turboladern, optimierter Luftansaugung, Nachbrennern oder einer Tragflügelbauweise bei Booten wird die Beschleunigung des Fahrzeugs verbessert. Aufgrund der gegebenen Einschränkungen durch das Fahrzeugdesign kann die Beschleunigung nicht beliebig oft verbessert werden. Aber am Ende gibt es nichts Besseres, als aus dem Stand so schnell zu beschleunigen, dass man schon weg ist, bevor die Gegenseite das Feuer eröffnet hat. Jede Stufe erhöht die Beschleunigung um 5. Maximalstufe: 2
designopt.improved_speed_interval.desc=Indem Dinge wie die Aerodynamik des Rumpfs, der Radstand, Teile der Aufhängung und die Steuerflächen angepasst werden, wird das Fahrzeug bei höheren Geschwindigkeiten besser steuerbar. Jede Stufe erhöht das Geschwindigkeitsintervall um 5. Maximalstufe: 3
designopt.improved_top_speed.desc=Dramatischere Verbesserungen der Höchstgeschwindigkeit erfordern umfassendere Anpassungen des Fahrzeugs, das dabei weit über sein ursprüngliches Design und dessen Grenzen hinaus getrieben wird. Manche Designs stoßen dabei früher an ihr Limit als andere. Dennoch: Vielleicht kommt irgendwann der Moment, in dem dir die zusätzliche Höchstgeschwindigkeit den Hintern retten wird. Jede Stufe erhöht die Höchstgeschwindigkeit um 25. Maximalstufe: 3
designopt.improved_cargo_space.desc=Ähnlich wie die Option Zusätzliche Sitze verschafft diese Designoption dem Fahrzeug mehr Laderaum, indem entsprechende Segmente eingebaut werden. Auch hier besteht das Problem, dass nur eine begrenzte Menge an Laderaum hinzugefügt werden kann, ohne die Größenklasse des Fahrzeugs zu erhöhen. Jede Stufe gewährt 2 zusätzliche LE. Maximalstufe: Doppelte Start-LE oder 3 (der niedrigere der beiden Werte)
designopt.easily_modified.desc=Du fokussierst dich auf eine Konstruktion, die in ihren Grundzügen ausgesprochen modular ausgelegt ist. So erhältst du ein Fahrzeug, das die perfekte Ausgangsbasis für nachträgliche Modifikationen ist. Pro Stufe erhältst du 2 universelle Modifikationsslots, die du nach Belieben über die drei Slot-Kategorien verteilen kannst.Maximalstufe: Ursprüngliches Rumpfattribut des Fahrzeugs oder 4 (der niedrigere der beiden Werte)


designmod.mass_transit.desc=Beim Massenverkehr geht es darum, Leute von A nach B zu bringen. Dies deckt Transportmittel wie Stadtbusse, Züge, Linienflugzeuge oder sogar Kreuzfahrtschiffe ab. Die Sitze des Fahrzeugs werden verdreifacht.
designmod.multi_engine.desc=Ab und zu braucht man mehr Leistung, als ein einzelnes Triebwerk liefern kann. Diese Modifikation findet man am häufigsten bei Luftfahrzeugen und Schiffen. Multipliziere die finale Beschleunigung und Höchstgeschwindigkeit mit 1,5.
designmod.off_road_chassis.desc=Manchmal braucht man ein Fahrzeug, das für Orte gebaut ist, an die keine Straße mehr führt. Senke das Straßenhandling um 1 und erhöhe das Geländehandling um 1. Außerdem wird die Höchstgeschwindigkeit um 10 gesenkt.
designmod.underpowered.desc=Egal, ob du dir Arbeit oder Geld sparen wolltest oder einfach nur begrenzte Mittel zur Verfügung hattest - irgendwie hast du in deinem Fahrzeug einen Motor verbaut, der seinen Aufgaben nur gerade so gewachsen ist. Die Höchstgeschwindigkeit wird halbiert.
designmod.cargo_hauler.desc=Diese Modifikation verdoppelt den Laderaum und halbiert die zur Verfügung stehenden Sitze bis hin zu einem Minimum von 2. Außerdem wird bei der Ermittlung des Geschwindigkeitsmodifikators nur die Hälfte der Panzerung (abgerundet) berücksichtigt (S. 153, nicht kumulativ mit der Designmodifikation Integrierte Panzerung). Frachttransporter zählen bei der Ermittlung der Anhängerkapazität (S. 126) zudem als 2 Größenklassen größer. Durch die Modifikationen Hochleistungsmotor und Mehrmotorig erhalten sie nur die halben Boni.
designmod.heavy_duty.desc=Fahrzeuge mit der Designmodifikation Extrem Belastbar sind robust gebaut und können einiges einstecken, wodurch ihr Rumpfattribut um 50 % steigt.
designmod.light_weight.desc=Fahrzeuge in Leichtbauweise müssen vorsichtig behandelt werden. Ihr Rumpfattribut sinkt um 50 %.
designmod.high_performance_engines.desc=Hochleistungsmotoren sind das, was man in den meisten legalen Sportwagen findet. Und sie sind genau das, was der Name vermuten lässt: Motoren, die dafür gebaut sind, auch noch das letzte bisschen Leistung aus dem Triebwerk herauszukitzeln. Erhöhe die Beschleunigung um 3 und die Höchstgeschwindigkeit um 50.
designmod.racing_engines.desc=Rennmotoren sind die leistungsfähigsten Motoren überhaupt und oft nicht mehr legal erhältlich. Erhöhe die Beschleunigung um 6 und die Höchstgeschwindigkeit um 100.
designmod.economy_engines.desc=Preisgünstige Motoren hingegen sollen vor allem Geld sparen, was zu Lasten der Leistung geht. Senke die Beschleunigung um 3 und die Höchstgeschwindigkeit um 50.
designmod.integrated_armor.desc=Integrierte Panzerung findet man am häufigsten in Sicherheits- und Militärfahrzeugen. Das Chassis ist so gebaut, dass sich das Gewicht der Panzerung weniger stark auf die Leistungsfähigkeit des Fahrzeugs auswirkt. Bei der Berechnung des Geschwindigkeitsmodifikators wird nur die halbe Panzerungsstufe angerechnet.

qualityfactor.anthropomorphic.desc=Anthropomorphe Fahrzeuge – bei denen es sich in der Regel um Drohnen handelt – funktionieren etwas anders als die meisten anderen Läufer. Zum einen sind sie mit zwei Drohnenarmen und zwei Drohnenbeinen ausgestattet, bei denen es sich üblicherweise um offensichtliche, manchmal aber auch um synthetische Cybergliedmaßen handelt. Wenn die Drohne maximal eine Größenklasse von 4 hat, kann sie alle Orte erreichen, die auch für einen Metamenschen erreichbar wären, da sie über ähnliche Gliedmaßen und einen ähnlichen Körperbau verfügt. Die Drohne kann sogar metamenschliche Ausrüstung wie beispielsweise Kleidung, Waffen und Werkzeuge verwenden.
qualityfactor.cutting_edge.desc=Ab und zu erfindet jemand eine neue Technologie, die alles verändert. Ja, ihr seid gemeint, GTI! Fahrzeuge, die diese Tech verbaut haben, sind in der Regel extrem teuer, bis die anderen Wettbewerber am Markt ebenfalls dahintergekommen sind und gelernt haben, sie zu reproduzieren.
qualityfactor.drone.desc=Da Drohnen von Natur aus auf viele der Merkmale verzichten können, die bei Fahrzeugen für einen höheren Preis sorgen, kann man einiges an Komponenten weglassen. Damit sind Drohnen preisgünstiger und leichter zu konstruieren.
qualityfactor.environmental_adaptation.desc=Alle Fahrzeuge, egal welchen Typs, sind auf den Betrieb in relativ gemäßigten Umweltbedingungen ausgelegt. Dieser Qualitätsfaktor erlaubt es dir, eine extreme Umgebung zu wählen, an die das Fahrzeug eigens angepasst ist. In dieser Umgebung funktioniert das Fahrzeug normal und erhält keine Malus. Gleichzeitig stellt es seinen Passagieren eine grundlegende Lebenserhaltung zur Verfügung. Zu den wählbaren Umwelttypen zählen Unterwasser, arktisch, vulkanisch, große Höhen und Weltraum. Dieser Qualitätsfaktor kann nur einmal erworben werden.
qualityfactor.mass_produced.desc=Ein Konzern, der über die dafür nötigen Großfabriken verfügt, kann Fahrzeuge wesentlich schneller und billiger produzieren als jeder Mechaniker, und wenn dieser über eine noch so gute Werkstatt verfügt.
qualityfactor.one-off_custom.desc=Ein wahrhaft einzigartiger Entwurf, von Grund auf neu konstruiert – ein solches komplett individuelles Fahrzeug ist der Traum jedes wahren Ingenieurs. Auch wenn du Teile und Komponenten von anderen Herstellern und Modellen nutzt: Der Großteil dieses Designs ist selbst erdacht und wahrhaft einzigartig.
qualityfactor.junkyard_frankenstein.desc=Das Gegenteil des Unikats, aber ebenso unverwechselbar: Der Schrottplatz-Frankenstein ist selten das hübscheste Mädchen auf dem Ball, aber auf jeden Fall ein unvergesslicher Anblick. Da es aus allen übrig gebliebenen Schrottteilen zusammengebaut wurde, die du finden konntest, kostet das Fahrzeug weniger. Solange du weißt, was du tust, tut das seiner Funktion keinen Abbruch.
qualityfactor.specialized_function.desc=Fahrzeuge mit einer Spezialfunktion erhalten kostenfrei sämtliche für die Ausübung dieser Funktion erforderlichen Modifikationen. Üblicherweise läuft das auf die Modifikation Mobile Werkstatt hinaus, aber es kann sich auch um andere Dinge wie spezielle Modifikationen der Waffenhalterungen, Wohnräume oder spezialisierte Frachtabteile handeln. Typische Spezialfunktionen sind beispielsweise Krankenwagen, Feuerwehrfahrzeuge, Notarztfahrzeuge, Abschleppfahrzeuge, Baustellenfahrzeuge, Freizeitfahrzeuge, Schwerlasthelikopter und Forschungsfahrzeuge.
qualityfactor.luxury.desc=Das Fahrzeug-Äquivalent von High Fashion. Fahrzeuge mit dem Qualitätsmerkmal Luxus haben standardmäßig eine Innenausstattung (Oberschicht). Alles an diesen Fahrzeugen strahlt Geld, Komfort und Glamour aus.
qualityfactor.security.desc=Sicherheitsfahrzeuge sind die Spielzeuge, die die meisten Konzerne lieber für sich selbst behalten – aber für uns Shadowrunner ist es nicht allzu schwer, sie in die Finger zu bekommen. Sicherheitsfahrzeuge sind standardmäßig mit Keramik-Plattenpanzerung ausgestattet und verfügen in der Regel mindestens über eine Experten-Konsole.
qualityfactor.military.desc=Meistens wirst du eher gegen diese bösen Jungs kämpfen, anstatt sie selbst einzusetzen. Militärfahrzeuge sind standardmäßig mit Militär-Plattenpanzerung ausgestattet und verfügen in der Regel mindestens über eine Experten-Konsole.
qualityfactor.superstructure.desc=Dieses Fahrzeug ist so gewaltig und massiv, dass es eher einem mobilen Gebäude als einem Fahrzeug gleicht. Solange es nicht explizit mit Anti-Fahrzeug-Waffen angegriffen wird, erhält es eine Strukturstufe von Rumpf + Panzerung, um zu ermitteln, ob der Angriff überhaupt ein Loch in das Fahrzeug schlägt. Und selbst in diesem Fall muss der Angriff ein Loch mit einer Fläche von mindestens 1 Quadratmeter verursachen, bevor das Fahrzeug 1 Kästchen Schaden auf seinem Zustandsmonitor erhält. Das Fahrzeug muss mindestens Größenklasse 15 haben.

quality.affinity_for_transit.desc=Wähle eine Art von Massenverkehrsmittel (Linienflüge, Zug, U-Bahn, Straßenbahn usw.), wenn du diesen Vorteil erwirbst. Einmal pro Tag kannst du mit einer erfolgreichen Probe auf Überreden + Charisma (4) eine der folgenden Optionen wählen: 1) Ein kostenloses Upgrade deiner Ticketklasse für das jeweilige Transportmittel. 2) Zugriff auf Mittelschicht-Lebensstil für 12 Stunden (beispielsweise kostenlose Essens- oder Getränkegutscheine, VIP-Lounge, Unterbringung im Hotel). 3) Die Möglichkeit, einen illegalen oder anderweitig verbotenen persönlichen Gegenstand ohne Probleme in das jeweilige Transportmittel zu schmuggeln, den du am Ziel deiner Reise wieder an dich nehmen kannst. Der Gegenstand darf nicht größer sein als eine kleine Drohne. Wenn du 1 Edge ausgibst, hast du auch innerhalb des Transportmittels Zugriff auf den Gegenstand.
quality.always_ready.desc=Wenn du Zugriff auf deinen Verfolgungspool (S. 177) erhältst, ist dieser schon von Beginn an mit 1 Edge gefüllt. Du kannst diesen Vorteil mehrfach erwerben, um das Start-Edge deines Verfolgungspools weiter und bis zu dessen Maximum zu erhöhen.
quality.attribute_mastery.desc=Wähle eines der folgenden Attribute: Konstitution, Geschicklichkeit, Reaktion, Stärke, Willenskraft, Intuition oder Charisma. Wann immer du eine Probe ablegst, die auf diesem Attribut basiert, erhältst du 1 Edge, sofern du bei dieser Probe nicht bereits Edge durch deinen Angriffswert erhältst. Wenn du dieses Edge nicht sofort für diese Probe ausgibst, verfällt es. Dieser Vorteil kann nur ein einziges Mal erworben werden. Er ist nicht kompatibel mit dem Vorteil Analytischer Geist (SR6, S. 74).
quality.determination.desc=Bevor du eine Steuern-Probe ablegst, kannst du einen Edge-Boost oder eine Edge-Handlung ansagen. Du kannst Nebenhandlungen ausgeben, um die Kosten sämtlicher Edge-Boosts oder -Handlungen bei Steuern-Proben um 1 pro investierter Nebenhandlung zu senken, bis zu einem Minimum von 1 Edge. Falls die Nebenhandlungen nicht direkt von einer Steuern-Probe gefolgt werden, verfällt der Effekt.
quality.driving_style_combat_ace.desc=Die Kosten der folgende Anwendungsmöglichkeiten von Edge sind für dich halbiert (die neuen Kosten sind in Klammern angegeben): Automatische Zielhilfe (3 Edge), Angriffsmanöver (2 Edge), Jetzt erst recht (1, 2 oder 3 Edge, nur bei Proben auf Mechanik [Geschütze]), Kreuzfeuer (3 Edge)
quality.driving_style_getaway_driver.desc=Die Kosten der folgende Anwendungsmöglichkeiten von Edge sind für dich halbiert (die neuen Kosten sind in Klammern angegeben): Ausweichmanöver (2 Edge), Entkommen! (2 Edge), Jetzt erst recht (1, 2 oder 3 Edge, nur bei Verteidigungsproben, während du ein Fahrzeug steuerst), Verfolger abschütteln (2 oder 4 Edge)
quality.driving_style_interceptor.desc=Die Kosten der folgende Anwendungsmöglichkeiten von Edge sind für dich halbiert (die neuen Kosten sind in Klammern angegeben): Absolute Konzentration (1 Edge), Am Limit (2 Edge), In der Zone (2 Edge), Jetzt erst recht (1, 2 oder 3 Edge bei allen Proben zum Verfolgen oder Beschatten eines Ziels)
quality.driving_style_reckless_driver.desc=Die Kosten der folgende Anwendungsmöglichkeiten von Edge sind für dich halbiert (die neuen Kosten sind in Klammern angegeben): Einsatz erhöhen (1, 2 oder 3 Edge), Gleiche Bedingungen (1 Edge), Jetzt erst recht (1, 2 oder 3 Edge, nur bei Steuern-Proben), Wer zuerst ausweicht (3 Edge)
quality.driving_style_stunt_driver.desc=Die Kosten der folgende Anwendungsmöglichkeiten von Edge sind für dich halbiert (die neuen Kosten sind in Klammern angegeben): Einsteigen bitte (1 Edge), Notausstieg (3 Edge), Schmugglerwende (1 Edge), Tokio-Drift (2 Edge)
quality.grease_monkey.desc=Wähle eine Mechanik-Spezialisierung. Wenn du diesen Vorteil für 4 Karma erwirbst, sinkt die Basisdauer für Reparaturen um 10 Minuten. Für 8 Karma sinkt der Basis-Schwellenwert zusätzlich um 1.
quality.junkyard_king.desc=Dir stehen mehr Optionen offen, wenn es darum geht, deine Drohnen oder Fahrzeuge mit suboptimalen Teilen zu reparieren oder zu individualisieren. Für 4 Karma sinkt die Verfügbarkeit von Ersatzteilen um 1, wenn du auf der Suche nach gebrauchten Teilen bist (siehe S. 163). Für 8 Karma kannst du die Schwellenwert-Erhöhung bei der Reparierenprobe durch die Verwendung von gebrauchten Teilen (siehe S. 163) um 1 senken.
quality.motorpool.desc=Stufe 1: Gratisfahrt. Du findest immer einen Weg, von A nach B zu kommen. Einmal pro Tag kannst du mit einer erfolgreichen Probe auf Einfluss + Charisma (4) eine Freifahrt mit einem Transportmittel (öffentlicher Nahverkehr, Fahrt per Anhalter, Partybus usw.) erhalten, die dich in die Nähe deines Zielorts bringt. Anmerkung: Wenn du ein Fahrzeug beschädigt zurückgibst, musst du für die Reparaturkosten aufkommen oder es selbst reparieren. Unter Umständen kann die Schuld auch in Form von Gefallen bezahlt werden. Alle Rigger-Netzwerk-Vorteile sind kumulativ. \nStufe2: Ersatzfahrzeug. Du erhältst den Vorteil Gratisfahrt, kannst aber nicht nur mitfahren, sondern optional 2 Edge ausgeben, um eine Standardversion deines üblichen Fahrzeugs zu erhalten, das du kostenfrei einen Tag lang nutzen kannst. Anmerkung: Wenn du ein Fahrzeug beschädigt zurückgibst, musst du für die Reparaturkosten aufkommen oder es selbst reparieren. Unter Umständen kann die Schuld auch in Form von Gefallen bezahlt werden. Alle Rigger-Netzwerk-Vorteile sind kumulativ. \nStufe3: Alternatives Transportmittel. Mit einer erfolgreichen Probe auf Einfluss + Charisma (4) kannst du 4 Edge ausgeben, um Zugang zu speziellen Transportmitteln (Flugzeug, Schiff, U-Boot) zu erhalten und sie einen Tag lang frei zu nutzen. Die Spielleiterin entscheidet, was genau dir zur Verfügung steht. Anmerkung: Wenn du ein Fahrzeug beschädigt zurückgibst, musst du für die Reparaturkosten aufkommen oder es selbst reparieren. Unter Umständen kann die Schuld auch in Form von Gefallen bezahlt werden. Alle Rigger-Netzwerk-Vorteile sind kumulativ.
quality.signature_maneuver.desc= Lege eine Kombination aus zwei Edge-Boosts oder -Handlungen sowie entweder eine Fertigkeit oder eine Verteidigungsprobe fest. Überleg dir einen Namen und eine Beschreibung für dein Markenzeichen-Manöver, beispielsweise „Irrer Iwan“ oder „Teufelsrattenboogie“. Du kannst die zwei gewählten Edge-Anwendungsmöglichkeiten in einer einzelnen Probe kombinieren (wobei für beide Edge-Anwendungen die vollen Kosten fällig werden), allerdings nur dann, wenn du die Probe auf die festgelegte Fertigkeit ablegst. Du kannst trotzdem noch Edge-Boosts oder -Handlungen einsetzen, die normalerweise erst nach der Probe gewählt werden würden, musst sie jedoch bereits vor der Probe festlegen.
quality.silver_lining.desc=Wann immer du einen Patzer erzielst, erhältst du 1 Edge. Wenn du einen Kritischen Patzer erzielst, wird dein Edgepool bis zu seinem Maximum von 7 aufgefüllt. Der Patzer oder Kritische Patzer kommt dennoch normal zum Tragen. Wenn der Patzer auf irgendeine Art und Weise verhindert wird, erhältst du durch diesen Vorteil kein Edge.
quality.speed_racer.desc=Wenn  du  dir  eine Verfolgungsjagd lieferst oder ein Rennen fährst, erhält du zu Beginn jeder Runde 1 Edge. Dieses Edge kann nur für deinen Verfolgungspool (S. 177) genutzt werden.
quality.underdog.desc=Wann immer jemand anderes in einer Verfolgungsjagd dir gegenüber einen Positionsvorteil hat (siehe S. 177), erhältst du einen Schicksalswürfel für alle deine Steuern-Proben.
quality.vehicle_empathy.desc=Wenn du ein zu der gewählten Spezialisierung passendes Fahrzeug steuerst, steigen dessen Beschleunigung und Geschwindigkeitsintervall um je 2. Für 4 Karma kannst du von diesem Vorteil nur profitieren, wenn du das Fahrzeug manuell steuerst. Für 8 Karma kannst du diesen Vorteil nutzen, solange du physisch mit dem Fahrzeug verbunden bist (manuelle Steuerung oder eingestöpselt).

quality.accident_prone.desc=Wenn du einen Patzer oder Kritischen Patzer erzielst, kannst du das Ergebnis nicht durch den Einsatz von Edge beeinflussen.
quality.bermuda_gremlins.desc= Wann immer du ein Fahrzeug steuerst, würfle mit 2W6. Wenn einer davon eine 1 zeigt, haben die Gremlins dich irgendwo entlang der Fahrtstrecke in die Irre geleitet, und du hast eine Abbiegung verpasst. Jetzt bist du spät dran und versuchst, einen anderen Weg ans Ziel zu finden. Würfle mit 1W6 und bestimme anhand der folgenden Angaben, wie sehr du dich verspätest: 1–2: 10–20 Minuten Verspätung. 3–4: 30–60 Minuten Verspätung. 5: 1–2 Stunden Verspätung. 6: Mehr als 2 Stunden Verspätung, aber du hast ein kleines neues Restaurant entdeckt.
quality.dead_stick.desc=Du erhältst einen Würfelpoolmalus von -2 auf alle Crashproben.
quality.drone_animosity.desc=Wenn Drohnen im Kampf die Wahl zwischen mehreren Zielen haben, entscheiden sie sich in der Regel für dich. Ganz egal, wie oft du ihren Bordcomputer zurücksetzt, deine Drohnen verhalten sich widerspenstig. Wenn du nicht in eine Drohne hineingesprungen bist, kannst du kein Edge ausgeben, wenn du sie steuerst oder wenn sie dich unterstützt (z. B., wenn du Hilfe durch eine Boxencrew oder eine Werkzeugkiste bekommst, siehe S. 165). Auch alle anderen Drohnen haben nur etwas gegen dich, niemand anderen – was es schwer macht, den Effekt zu beweisen oder konkret an etwas festzumachen (die Spielleiterin entscheidet, wie genau sich das im Spiel auswirkt).
quality.easy_mark.desc=Du kannst bei Wahrnehmungsproben gegen Heimlichkeitsproben kein Edge erhalten oder ausgeben.
quality.fuzz_magnet.desc=Wann immer du besonders tollkühn oder unberechenbar fährst (die Spielleiterin entscheidet, wann diese Bedingung erfüllt ist), würfle mit 2W6. Wenn beide Würfel Erfolge sind, fällst du der lokalen Verkehrspolizei auf.
quality.motion_sickness.desc=Wann immer du dich länger als 30 Minuten in einem sich bewegenden Fahrzeug befindest, erhältst du den Status Übelkeit (SR6, S. 55). Dieser Status verschwindet erst 10 Minuten, nachdem das Fahrzeug angehalten hat. Die Probe auf Konstitution + Willenskraft (2) zur Erholung bringt – solange das Fahrzeug noch fährt – nur temporäre Linderung, die [Nettoerfolge] Minuten anhält.
quality.perforated_firewall.desc=Wann immer du eine Probe ablegen musst, bei der die Firewall eines Geräts verwendet wird, erhält dein Gegner 1 Edge.
quality.remote_pilot.desc= Wenn du ein Fahrzeug steuerst, kannst du kein Edge erhalten oder ausgeben, es sei denn, du befindest dich physisch außerhalb des Fahrzeugs.
quality.road_rage.desc=Wenn das Fahrzeug oder die Drohne, die du gerade steuerst, Schaden nimmt, kannst du nur noch dann Edge erhalten oder einsetzen, wenn du Vergleichende Proben gegen denjenigen ablegst, der für die Beschädigung verantwortlich ist. Dieser Effekt hält an, bis entweder die Begegnung endet oder das Ziel besiegt wurde.
quality.sore_thumb.desc=Du kannst bei Heimlichkeitsproben kein Edge erhalten oder ausgeben.
quality.specialist.desc=Wähle eine deiner Fertigkeiten. Wenn du diese Fertigkeit auf irgendeine Art und Weise einsetzt, die nicht durch eine Spezialisierung oder Expertise abgedeckt ist, kannst du dabei kein Edge erhalten oder einsetzen.
quality.target_fixation.desc=Wenn du angreifst, kannst du für den Rest der Runde bei Verteidigungsproben weder Edge erhalten noch einsetzen, sofern es sich nicht um eine Verteidigungsprobe gegen dein Angriffsziel handelt.

action.backseat_driver.desc=Wie kan man sich als Mitfahrer nützlich machen, während die Kugeln fliegen und die Fahrer ihre Fahrzeuge steuern? Leg eine Probe auf Natur, Wahrnehmung, Einfluss oder MEchanik ab, mit der du eine beliebige Nicht-Kampfhandlung durchführst, und beschreibe, wie du den Piloten deines Fahrzeuges unterstützt. Der Schwellenwert dieser Probe ist gleich dem derzeit im Verfolgungspool des Piloten befindlichen Edge +2. Gelingt die Probe, wird dem Verfolgungspool 1 Edge hinzugefügt. Für jeweils 2 Nettoerfolge wird 1 weiteres Edge für den Verfolgungspool generiert, bis zum Maximalwert des Pools. Wenn der Pilot des Fahrzeugs, in dem du dich befindest, nicht über einen Verfolgungspool verfügt, beträgt der Schwellenwert dieser Probe 5. Gelingt die Probe, erhält der Pilot 1 Edge.
action.double_down.desc=Füge deiner Probe Schicksalswürfel hinzu. Du kannst sie sowohl vor als auch nach deinem Wurf hinzufügen - in dem vollen Bewusstsein, dass die Schicksalswürfel dir vielleicht helfen, die Lage aber auch schlimmer machen könnten. Wenn mindestens einer der Schicksalswürfel eine 1 zeigt, werden alle 5en ignoriert, darunter auch 5en auf den anderen Schicksalswürfeln.
action.evasive_action.desc=Addiere deinen Fertigkeitswert in Stuern zum Würfelpool einer Verteidigungsprobe für ein Fahrzeug, das du steuerst.
action.aimbot.desc=Nutze die Steuerung und Werkzeuge an Bord zu deinem Vorteil. Wenn du bei einem Angriff mit einer fahrzeugmontierten Waffe mindestens einen Nettoerfolg erzielst, erhälst du zusätzliche Nettoerfolge in Höhe der Sensorstufe deines Fahrzeuges.
action.attack_run.desc=Wenn du ein Fahrzeug steuerst, kombiniere diese Edge-Handlung mit einer Haupthandlung für Mechanik (Geschütze), um deinen Fertigkeitswert in Steuern zum Würfelpool für einen Angriff mit einer fahrzeugmontierten Waffe oder einen Rammen-Angriff zu addieren. Für alle Angriffe, die für den Rest der Kampfrunde gegen dein Fahrzeug durchgeführt werden, erhalten die Angreifer 1 Edge.
action.crossfire.desc=Diese Edge-Handlung muss angesagt werden, bevor du eine Verteidigungsprobe ablegst, um einem Angriff gegen das von dir gesteuerte Fahrzeug zu entgehen. Du lenkst den Beschuss auf ein anderes Ziel, während du um Haaresbreite einem Angriff gegen dich selbst entrinnst. Wähle ein anderes Ziel in Sehr Naher oder Naher Distanz zu deinem Fahrzeug. Alle Nettoerfolge bei deiner Verteidigungsprobe zählen als Erfolge gegen das gewählte Ziel. Das Ziel darf eine Verteidigungsprobe ablegen, um dem eingehenden Beschuss zu entgehen, darf dabei jedoch weder Edge erhalten oder ausgeben. Der Grundschaden des Angriffs entspricht dem des Angriffs gegen dich. Gleiches gilt für begleitende Effekte des Angriffs. Beispiel: Johnny Redline wird von einigen Go-Gangern verfolgt. Zwei von ihnen haben sich direkt hinter ihn gesetzt und befinden sich in Sehr Naher Distanz. Einer greift Johnny mit dem vorn auf seinem Motorrad montierten Flammenwerfer an, aber Johnny hat noch jede Menge Edge übrig. Er beschließt, die Edge-Handlung Kreuzfeuer durchzuführen, und wählt den anderen Ganger in Sehr Naher Distanz als sein Ziel. Für die Handlung gibt er 6 Edge aus. Bei seiner Verteidigungsprobe erzielt er 3 Nettoerfolge - als er also auf die Bremse tritt und zur Seite wegtaucht, um dem Flammenstrahl zu entgehen, gelingt es ihm, das auf ihn gerichtete Feuer in Richtung des anderen Gangers zu dirigieren. Der überraschte Ganger erzielt bei seiner Verteidigungsprobe nur 2 Erfolge, womit 1 Nettoerfolg übrig bleibt. Statt dass Johnnys Fahrzeug in Flammen aufgeht, bekommt nun einer seiner Gegner eine feurige Abreibung verpasst. Der Ganger erhält Schaden durch den Flammenwerfer, der aufgrund des Nettoerfolgs um 1 erhöht wird.
action.the_exit.desc=Mit einer erfolgreichen Steuern-Probe bremst du so weit ab, dass du dein Fahrzeug mit einer zusätzlichen Nebenhandlung sicher verlassen kannst. Bei 5+ Erfolgen kommt das Fahrzeug komplett zum Stillstand, ohne einen Crash zu erleiden. Andernfalls muss der Autopilot eine Crashprobe ablegen.
action.greaser.desc=Wenn du deinen Ölsprüher gegen ein einzelnes Ziel einsetzt, das sich in Sehr Naher oder Naher Distanz hinter dir befindet, darf dieses Ziel bei seiner Crashprobe weder Edge erhalten noch Edge ausgeben.
action.in_the_zone.desc=Du spürst den Fluss der Bewegungen deines Fahrzeugs und weißt, wie du es dazu bringen kannst, genau das zu tun, was du willst - zumindest für den Moment. Ignoriere für diese Probe alle Malusse, die sich auf das Handling deines Fahrzeugs auswirken.
action.pickup.desc=Hierbei handelt es sich um ein schwieriges Manöver, bei dem der Pilot sein Fahrzeug in Richtung einer Zielperson rutschen lässt und diese aufnimmt, ohne anzuhalten. Das Fahrzeug muss über eine ausreichend große Offnung verfügen, durch die die Zielperson einsteigen kann - in den meisten Fällen eine geöffnete Tür oder ein freier offener Sitzplatz wie auf einem Motorrad. Gelingt das Manöver, gilt die Zielperson als innerhalb oder auf dem Fahrzeug. Bei einem erfolgreichen Manöver erleidet der neue Passagier SB Schaden (dem er nicht widerstehen kann). Je Nettoerfolg sinkt der Schaden um 1. Misslingt die Probe, siehe Crashs, SR6, S. 200.
action.point_defense.desc=Diese Edge-Handlung erlaubt es dir, mit einer Haupthandlung einen Angriff gegen eine eingehende Rakete, einen Torpedo oder eine abgeschossene Granate durchzuführen. Du kannst diese Edge-Handlung nur einsetzen, wenn du das direkte Ziel des Angriffs bist oder du dich innerhalb eines angegriffenen Fahrzeugs befindest. Außerdem musst du über eine Fernkampfwaffe verfügen, die geladen und feuerbereit ist. Der Schwellenwert für den Schuss beträgt 5. Gelingt die Probe, bringt dein Schuss das Geschoss zur Explosion, bevor es sein Ziel erreicht. Wenn dir die Probe für diese Edge-Handlung misslingt, kannst du bei deiner Verteidigungsprobe gegen den entsprechenden Angriff weder Edge erhalten noch ausgeben.
action.riggers_advantage.desc=Rigger haben das Gefühl, dass die Art, wie sie ihre Fahrzeuge und Drohnen steuern, ihnen einen gewissen, schwer greifbaren Vorteil gegenüber anderen verschafft. Mit dieser Handlung kannst du zeigen, dass das der Wahrheit entspricht. Addiere die Stufe deiner Riggerkontrolle zu den bei dieser Probe erzielten Erfolgen.
action.smoke_screen.desc=Du manövrierst so, dass du den Rauch aus dem Rauchgenerator deines Fahrzeugs optimal ausnutzen kannst. Du erhälst Deckung, allerdings nur gegen Angriffe aus deinem Rücken.
action.bootleg_turn.desc=Um diese Edge-Handlung auszuführen, musst du das Verfolgungsziel sein. Du vollführst eine plötzliche scharfe Kurve, nach der du in die Gegenrichtung fährst. Anschließend darfst du die Position aller Verfolgungsteilnehmer um eine Distanzkategorie (näher oder weiter entfernt von dir) anpassen.
action.change_environment.desc=Du nutzt deine Ortskenntnis, um das Spielfeld zu wechseln und dich in eine Umgebung zu bewegen, die dir gelegener kommt. Mit Beginn der nächsten Kampfrunde kannst du die Umgebung auf offen, eingeschränkt oder beengt ändern.
action.chicken.desc=Wähle ein Zielfahrzeug, das sich mit dir in einer Verfolgungsjagd befindet. Am Ende dieser Runde muss derjenige von euch, der bei seiner Steuern-Probe weniger Nettoerfolge erzielt hat, eine Crashprobe ablegen, um einen Crash zu verhindern. Du kannst diese Edge-Handlung nicht in einer offenen Umgebung einsetzen.
action.dead_stop.desc=Wenn du in einer Verfolgungsjagd der Verfolger bist, lege eine Vergleichende Probe auf Natur (Navigation) + Intuition gegen Natur (Navigation) + Intuition des Verfolgungsziels ab. Wenn du die Probe für dich entscheidest, beurteilt das Verfolgungsziel die Umgebung falsch, biegt falsch ab und landet in einer Sackgasse oder an einem anderen Hindernis. Damit endet die Verfolgungsjagd. Es muss mindestens eine Kampfrunde vergehen, bevor eine neue Verfolgungsjagd initiiert werden kann.
action.drafting.desc=Wenn sich mindestens ein weiterer Teilnehmer der Verfolgungsjagd in Sehr Naher oder Naher Distanz vor dir befindet, bewege dich relativ zum Verfolgungsziel um eine Distanzkategorie nach vorn.
action.equalizer.desc=Egal, ob deine Steuern oder Athletik-Probe erfolgreich ist: Für den Rest der Kampfrunde verlieren alle Beteiligten ihren Positionsvorteil.
action.escape.desc=Wenn du das Verfolgungsziel bist und alle Verfolger sich in Sehr weiter Distanz (Fahrzeugverfolgung) oder Mittlerer Distanz (Verfolgung zu Fuß) befinden, hast du die Chance, ihnen zu entkommen. Die Verfolger müssen bei ihrer Steuern-Probe mindestens so viele Nettoerfolge wie du bei deiner entsprechenden Probe erzielen - schaffen sie das nicht, scheiden sie aus der Verfolgungsjagd aus, weil sie entweder anhalten oder in die falsche Richtung fahren.
action.evade_pursuit.desc=Setz dich vor alle Verfolger und häng sie ab. Erhöhe die Distanzkategorien aller anderen Verfolgungsteilnehmer relativ zu dir. Verfolger, die sich bereits in Sehr weiter Distanz befanden, verbleiben in dieser Distanzkategorie. Zudem erhältst du einen Positionsvorteil gegenüber allen Verfolgern.
action.focus.desc=Für diese Steuern-Probe gilt das Handling deines Fahrzeugs als um 1 geringer. Im Fall einer Athletik-Probe sinkt der Schwellenwert um 1.
action.hit_the_brakes.desc=Wenn du das Verfolgungsziel bist, bremst du abrupt ab. Die Position aller anderen Verfolgungsteilnehmer wird angepasst, sodass sie sich eine Distanzkategorie näher an deiner Position befinden.
action.redline.desc=Wenn du in einer Fahrzeug-Verfolgungsjagd deine Position veränderst, kannst du dich relativ zum Verfolgungsziel um bis zu 2 Distanzkategorien bewegen. Dabei erhält dein Fahrzeug 4 Kästchen Schaden, gegen die kein Widerstand geleistet werden kann. Wenn du selbst das Verfolgungsziel bist, verhinderst du stattdessen für den Rest der Kampfrunde, dass einer der Verfolger näher an dich herankommt.
action.subtle_pilot.desc=Du erhältst für eine einzelne Heimlichkeits-Probe einen Würfelpoolbonus in Höhe deines Steuern-Fertigkeitswerts, allerdings nur, wenn du ein Fahrzeug oder eine Drohne steuerst.
action.tokyo_drift.desc=Wenn du das Verfolgungsziel bist, kannst du mit einer erfolgreichen Driften-Handlung verhindern, dass Irgendjemand anders seine Position verändern darf, wenn er bei seiner Steuern-Probe nicht mindestens so viele Nettoerfolge wie du erzielt hat.
action.up_the_ante.desc=Du beschließt, einen herausfordernderen Weg zu nehmen und herauszufinden, ob die anderen mithalten können. Du darfst diese Edge-Handlung nur ausführen, wenn du das Verfolgungsziel bist und dich in einer beengten Umgebung befindest. Du erhältst einen Handlingmalus. Alle Verfolger müssen diesen Malus ebenfalls auf sich nehmen - wer das nicht tut, scheidet aus der Verfolgung aus und verliert dich aus den Augen.
action.assembled_with_love.desc=Wenn du mithilfe von Improvisieren eine Modifikation an einem Fahrzeug oder einer Drohne vornimmst, hält diese [Nettoerfolge] Stunden, sofern die Probe gelingt. Sobald der reparierte Gegenstand nicht mehr funktioniert, kann er nicht erneut repariert werden, sondern muss komplett neu gebaut werden. Pro Fahrzeug kann immer nur eine improvisierte Modifikation gleichzeitig aktiv sein.
action.black_thumb.desc=Du kannst die Regeln für Eilaufträge (S. 166) anwenden, um zu versuchen, ein Fahrzeug während der Fahrt zu reparieren. Es gelten weiterhin die entsprechenden Regeln für Erschöpfung.
