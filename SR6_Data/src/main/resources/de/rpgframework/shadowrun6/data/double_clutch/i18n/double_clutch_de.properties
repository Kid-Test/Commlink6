item.evo_stiletto.desc=(Rennmotorrad) Ein ultraleichter Rahmen in Verbindung mit einem übermäßig starken Vor-TecX-Motor verleiht der Stiletto die besten Beschleunigungswerte aller Motorräder auf dem Markt. Leider hat all diese Leistung ihren Preis. Die Stiletto ist nur und ausschließlich ein Straßenrenner. Auf der Straße ist ihr Handling selbst bei hohen Geschwindigkeiten unübertroffen, aber fahrt mit ihr ins Gelände, und sie wird extrem schwer zu steuern.

item.harley_centaur.desc=(Combatbike) Die Centaur wurde speziell fürs Combatbiking entworfen und wird als das „ultimative Combatbike“ vermarktet. Und diesmal stimmt der Hype. Ein eigens entwickeltes DNI/AR-Steuersystem lässt den Fahrer freihändig fahren und dadurch ungehindert seine Handwaffen einsetzen. Mit ihrem leichten, aber widerstandsfähigen Rahmen aus Mischlegierungen und den gegossenen Panzerplatten kann die Centaur unglaublich viel einstecken und trotzdem noch dann weiterfahren, wenn andere Maschinen längst aufgeben würden.

item.honda_viking.desc=(Chopper) Diese klassische Straßenbestie feierte letztes Jahr ihr Comeback. Die Viking ist einer der größten Chopper, die im Moment hergestellt werden, und wurde speziell für größere Metamenschen (also für Trolle) entworfen. Tatsächlich ist alles an diesem Bike schwer - vom Rahmen über die Aufhängung bis hin zur Panzerung. Die Viking macht ihrem Namen als eine der zähesten Straßenmaschinen alle Ehre.

item.suzuki_transit.desc=(Rennmotorrad) Suzuki hat zwar den Ruf, hochklassige Rennmaschinen zu bauen, aber das Unternehmen entschloss sich mit der Transit für eine andere Richtung. Diesmal produzierte es die Art von Bike, die verlässlich und in jeder Hinsicht komplett durchschnittlich ist. Die Baugruppen und Komponenten der Transit sind fast komplett modular aufgebaut, und dadurch sind Teile und Systeme leicht zugänglich und austauschbar. Reparaturen und Modifikationen können in ungefähr der halben Zeit wie bei den meisten anderen Bikes erledigt werden. \n Alle Schwellenwerte, um die Transit zu modifizieren oder reparieren, sind um 1 gesenkt.

item.yamaha_kaburaya.desc=(Rennmotorrad) Die Kaburaya wurde vor vier Jahren vorgestellt, brach schnell alle Rekorde und wurde zu der Rennmaschine, die man auf legalen Rennstrecken und bei Untergrundveranstaltungen schlagen musste. Sie hat am Vorderrad eine einarmige Gabel, eine niedrige Silhouette, einen ultraleichten Rahmen und einen Turbomotor – die Kaburaya trägt im Moment den Titel als schnellstes gegenwärtig produziertes Rennmotorrad.

item.yamaha_nodachi.desc=(Combatbike) Nachdem die Nodachi vor nur vier Jahren für das Combatbiking vorgestellt worden war, wurde sie schnell zu einem der beliebtesten Motorräder für diesen Sport. Sie wurde sogar so beliebt, dass sie fast alle anderen Modelle verdrängte, und das mit gutem Grund. Die Nodachi ist eine hervorragende Mischung aus Zähigkeit, Wendigkeit und Kraft. Sie hat ab Werk sogar einige gepanzerte Verkleidungsteile.

item.honda_rough_rider.desc=(Schweres Quad) Hondas neueste Modell ist das Rough Rider, ein Quad mittlerer Größe, das auch als Geländefahrzeug nutzbar ist. Die Schwerlastaufhängung lässt es in fast jedem Gelände glänzen, egal ob in der Stadt oder auf dem Land (auf dem Land am besten mit Smartreifen).

item.nissan_constellation.desc=(ATV) Das Constellation ist im Moment eines der populärsten ATVs auf dem Markt und auf dem Land häufiger zu sehen als in Städten. Dieses Arbeitstier kann auf Basis seines vierrädrigen Chassis mit Elektromotor für viele verschiedene Aufgaben adaptiert und in fast jeder Umgebung eingesetzt werden. Das Fahrzeug hat Platz für vier Personen durchschnittlicher Größe, und die kleine Ladefläche kann entfernt werden, um eine rückwärts gerichtete Sitzbank aufzufalten, die weiteren zwei Personen Platz bietet. \n Alle Schwellenwerte, um das Constellation akustisch zu entdecken, sind um 1 erhöht.



item.bmw_tsarina.desc=(Coupé) Der Tsarina II ist eine verbesserte Version des Originals, behält aber die grundlegende Ästhetik bei - besonders die Sitzanordnung hintereinander, wobei (jetzt zwei) Passagiere vorne und der Fahrer hinter ihnen leicht erhöht im Zentrum des Fahrzeugs sitzen. Der Tsarina II wurde (erstmals für diesen Wagen) als Hochleistungsfahrzeug entwickelt; wahrscheinlich erwiesen die Designer damit seiner unerwarteten Popularität bei Straßenrennen Reverenz. Leider geht ein Großteil dieser Leistung auf Kosten des Komforts. Die Fahrerposition bietet wegen ihrer Platzierung ausreichend Platz, aber die Passagiersitze sind sogar für durchschnittliche Metamenschen eher beengt.

item.eurocar_northstar.desc=(Luxus-SUV) Der Northstar 2.0 ist einer jener Wagen, die zwar schick sind, aber auch die Leistung bringen, die man für so viel Geld erwarten kann. Er kann ohne große Leistungseinbußen zwischen Straße und Gelände wechseln, hat eine Höchstgeschwindigkeit, die einigen Straßenrennern das Wasser reichen kann, und ist dabei extrem geräumig und komfortabel. Ohne Drek: Der 2.0 bringt vier Personen vorne und hinten in richtigen Sitzen unter, statt eine beengte Rückbank zu bieten, die nur versucht, etwas Sitzkomfort zu bieten. Der Laderaum hinten hat zwar eine kleine Klappbank, wenn man wirklich darauf angewiesen ist – aber schnell kommt man von dort aus nicht aus dem Fahrzeug raus.

item.mitsubishi_runabout.desc=(Coupé) Dieser Elektro-Zweisitzer war dazu gedacht, mit dem Jackrabbit und ähnlichen Fahrzeugen auf dem Gebiet der sparsamen Autos ohne Schnickschnack zu konkurrieren. Die aktuellen Modelle haben die Platzprobleme beseitigt, die es bei früheren Modellen gab, und der Runabout ist eine gute Wahl für Leute, die nur ein einfaches Auto brauchen. Versucht nur nicht, damit im Gelände rumzufahren.

item.saab_javelin.desc=(Sportwagen) Der Javelin hat sehr ähnliche Leistungsdaten wie der Gladius (aber nicht dessen Höchstgeschwindigkeit), und man wird nicht ganz so bankrott, wenn man ihn kauft (obwohl er immer noch mehr kostet als die meisten Autos vergleichbarer Größe). Und während es beim Gladius um die schnellste Höchstgeschwindigkeit aller Serienautos der Welt geht, geht es beim Javelin mehr um die Wendigkeit und enge Kurven.

item.saab_gladius.desc=(Sportwagen) Bis vor etwa fünf Jahren war der Saab, den man mit ungezügelter Geschwindigkeit assoziierte, der Dynamit 778TI, der Herrscher der Highways, bis der Gladius 998TI rauskam und zum neuen Monster wurde, das man schlagen musste. Beim Gladius geht es um die schnellste Höchstgeschwindigkeit aller Serienautos der Welt.

item.toyota_daytripper.desc=(SUV) Der Daytripper ist klobig, hat ein niedriges Dach, versucht, familienfreundlich zu sein und dabei wenigstens ein bisschen sportwagenartig auszusehen, und ist in jeder Hinsicht unauffällig, aber adäquat. Diese Art von Fahrzeug wird in aller Welt gefahren - und verschwindet leicht im Verkehr. Der Daytripper bietet ein spezielles Sicherheitssystem, das die Insassen bei einem Unfall schützen soll. Alle Sitze und Gurte bieten zusätzlichen Schutz, und der Fahrgastraum ist ein verstärkter, integrierter Überrollkäfig. Dazu kommt optional das Protecto-Foam-System, dessen Schaum den Innenraum füllt, um während eines Unfalls zusätzlich Verletzungen zu verhindern. \n Der Überrollkäfig verleiht allen Insassen einen Bonus von +2 auf den Verteidigungswert.

item.toyota_ultra_elite.desc=(Limousine) Neben einem exzellenten Handling, einer starken Beschleunigung und einer schweren Panzerung ist das wichtigste Argument für den UE das integrierte Sicherheitsmodul im Rahmen des Fahrzeugs. Im Notfall kann der Fahrgastraum vollkommen abgeschottet werden, wenn das Fahrzeug nicht mehr funktioniert oder bewegungsunfähig ist und unmittelbar Gefahr droht. Toyota nennt das den „Panikraummodus“ (PRM). Dieses Modul ist vollkommen luftdicht, resistent gegen Hitze und Kälte, nicht elektrisch leitend und bietet einen Sauerstoffvorrat für mindestens acht Stunden (für Metamenschen durchschnittlicher Größe). Ein PanicButton-Notsignal wird mit dem Auslösen des PRM automatisch aktiviert, und das Modul hat hervorragende Matrix-Firewalls, um Störsender und Hacker abzuwehren. Der PRM kann nur von innen durch die Insassen beendet werden, oder indem man einen verschlüsselten, biometrisch gesicherten Zugangscode an der verborgenen Bedienfläche des Moduls außen eingibt. \n Wenn der Panikraummodus aktiviert ist, erhält der Fahrgastraum 3 automatische Erfolge gegen Hackingversuche. Der Fahrgastraum hat für Zwecke des Hackens eine Gerätestufe von 6. Das Modul hat die Panzerungsmodifikationen Elektrische Isolierung, Feuerresistenz und Kälteresistenz jeweils mit Stufe 6 sowie die Panzerungsmodifikation Chemische Versiegelung.

item.dodge_rampart.desc=(SUV) Der Rampart wurde als zähes, zuverlässiges SUV für den Wochenendabenteurer entwickelt, das mit den Straßen eines Sprawls fertig wird und dank des neuen Hemi-7-Motors trotzdem moderate Geländefahrten besteht. Vorne sind gewöhnliche Einzelsitze eingebaut, hinten kann man entweder zwei Einzelsitze oder eine Sitzbank für drei Personen montieren.

item.dodge_rampart.variant.lev.desc=(SUV) Die Sicherheits-/Polizeiversion LEV (Law Enforcement Vehicle) ist etwas ganz anderes. Das Fahrzeug baut auf demselben Rahmen und Chassis wie die Zivilversion auf, hat aber eine verbesserte Aufhängung, einen stärkeren Motor und bessere Leistung im Gelände. Der Fond wurde für den Transport und die Sicherung Verdächtiger umgebaut und besitzt zum Fahrerbereich hin eine Trennscheibe aus Stahldraht und kugelsicherem Kunststoff. Zusätzlich kann man die Türen abnehmen und im Notfall als improvisierte ballistische Schilde einsetzen. Schließlich hat der Rampart LEV vorne noch eine Ramm-Stoßstange, falls jemand einen sanften Hinweis braucht, um aus den Weg zu gehen. \n Um die abnehmbaren ballistischen Türen zu tragen, braucht man mindestens Stärke 4, sonst erleidet man nach einer Kampfrunde den Status Erschöpft I. Die Stufe des Status steigt in jeder folgenden Kampfrunde um eins und nimmt mit derselben Geschwindigkeit wieder ab, wenn die Tür nicht mehr getragen wird. Das Abnehmen der Türen ist eine Nebenhandlung.

item.ford_dasher.desc=(Limousine) Der zivile Ford Dasher ist eine herausragende Straßenmaschine.

item.ford_dasher.variant.interceptor.desc=(Patrouillenfahrzeug) Beim Interceptor wurde das Chassis verstärkt, er bekam einen V-12-Turbomotor und dazu Getriebe und Bremssystem eines professionellen Rennwagens. Würzt das Ganze noch mit einem Riggerinterface, einer Waffenhalterung auf dem Dach und einer kleinen Drohnenhalterung, und ihr bekommt etwas, das in den richtigen Händen für jeden Rigger oder Runner eine echte Gefahr sein kann, der das Pech hat, ihm zu begegnen.

item.gaz_p183.desc=(Pick-up) Das aktuelle Modell P-183 setzt diese Tradition fort und verkauft sich seit seiner Einführung 2076 verlässlich gut. Wie also kann ein so sehr geschmähtes Fahrzeug weiter so beliebt sein? Erstens ist es ein günstiges Arbeitstier, das einiges einstecken und weiter funktionieren kann. Zweitens - und noch wichtiger - ist die Geräumigkeit der Fahrerkabine ein echtes Argument. Man muss nur die Sitze austauschen, um den Wagen für größere Metatypen bequemer zu machen.

item.gmc_grizzly.desc=(Pick-up) Der Grizzly bietet mehr oder weniger alles, was man von einem einfachen Pick-up fürs Grobe erwarten würde. Er ist groß, hat einen starken Motor, eine große Ladefläche zum Transport von allem möglichen Drek und eine gute Zugkraft.

item.gmc_grizzly.variant.extended_cab.desc=(Pick-up) Der Grizzly bietet mehr oder weniger alles, was man von einem einfachen Pick-up fürs Grobe erwarten würde. Er ist groß, hat einen starken Motor, eine große Ladefläche zum Transport von allem möglichen Drek und eine gute Zugkraft. Mit der vergrößerten Kabine hat er auch ein brauchbares Platzangebot für Passagiere.

item.jeep_trailblazer.desc=(Geländewagen) Der Trailblazer hat den wohlverdienten Ruf, ein widerstandsfähiges, zuverlässiges und sogar stylisches Fahrzeug zu sein. Wie beim Vorgänger sind Türen und Dach abnehmbar, damit man „den Wind im Haar spürt, wenn man über Highways oder Nebenstraßen saust“. Außerdem kann man beim Trailblazer die Windschutzscheibe nach vorne runterklappen – wie damals beim Wrangler.

item.tata_hotspur.desc=(Gelände-Rennlastwagen) Dieser vierrädrige Geländewagen (der wegen seines Gewichts als Lastwagen gesehen wird) gilt vielen als das beste Geländerennfahrzeug auf dem Markt. Der Turbomotor gibt ihm eine Geschwindigkeit und Beschleunigung, wie man sie sonst nur bei den schnellsten Straßenrennwagen sieht. Was den Hotspur aber wirklich von der Konkurrenz abhebt, ist die Hochleistungs-Einzelradaufhängung, die ihm über einen Meter Bodenfreiheit bei der Fahrt über schwieriges Terrain verleiht.

item.tata_hotspur.variant.cocoon.desc=(Gelände-Rennlastwagen) Dieser vierrädrige Geländewagen (der wegen seines Gewichts als Lastwagen gesehen wird) gilt vielen als das beste Geländerennfahrzeug auf dem Markt. Der Turbomotor gibt ihm eine Geschwindigkeit und Beschleunigung, wie man sie sonst nur bei den schnellsten Straßenrennwagen sieht. Was den Hotspur aber wirklich von der Konkurrenz abhebt, ist die Hochleistungs-Einzelradaufhängung, die ihm über einen Meter Bodenfreiheit bei der Fahrt über schwieriges Terrain verleiht. \n Diese Variante hat einen Rigger-Kokon statt Fahrersitz.

item.ford_bison.desc=(Lieferwagen/Wohnmobil) Der Bison III ist ein großes Lastfahrzeug, das größer als die meisten Lieferwagen, aber etwas kleiner als ein durchschnittliches Wohnmobil ist. Er hat eine große Kabine mit sechs Sitzplätzen und dennoch sehr viel Laderaum. Aber beim Bison III wurden noch weitere Upgrades durchgeführt, zum Beispiel ein stärkerer Motor, eine bessere Aufhängung und hinten ein breiterer Radstand, der das Handling verbessert. Für ein Fahrzeug seiner Größe ist der Bison III ab Werk ziemlich schnell, wendig und auf den Straßen der Sprawls genauso brauchbar wie auf dem Land.

item.ford_lifeline.desc=(Schwerer Rettungswagen) Der Lifeline wurde vor drei Jahren vorgestellt und ist ein schwerer Rettungswagen, der den Höhepunkt der Notfall-Einsatztechnologie darstellt. Ein gewaltiger Multifuel-Hybrid-Motor verleiht dem Lifeline hohes Tempo und große Reichweite sowie ein gewaltiges Drehmoment. Dieser Antrieb bewegt Smartreifen an einer verstärkten Einzelradaufhängung. In Verbindung mit dem Pilot-by-Wire-System kann der Lifeline mit jeder Art von hinterhältigen Oberflächen und schwierigem Gelände locker fertigwerden. Und damit der Spaß nicht zu kurz kommt, gibt es beim Lifeline die verstärkte Ramm-Stoßstange Ram Horn™, mit der er sich an den meisten Hindernissen vorbeidrängen kann, auch an den Unglücklichen, die ihm im Weg stehen. Der Wagen besitzt außerdem einige externe Aufbewahrungsboxen, die medizinische und Rettungs-Ausrüstung aufnehmen können, ein Windensystem hinten und vorne (in der Stoßstange) und zwei kleine Halterungen für Bodendrohnen an den Seiten. Auf dem flachen Dach befindet sich eine modulare Drohnenhalterung für vier kleine oder zwei mittlere Luftdrohnen. Die Grundausstattung wird durch eine Waffenhalterung, schwere Panzerung und ein Passagierabteil für vier Personen komplettiert – wenn jemand mitfahren soll, der mehr als nur gute Absichten zum Schutz anbieten kann. Die echte Attraktion ist allerdings der medizinische Arbeitsplatz hinten. Ein Team von vier Sanitätern hat in diesem großzügigen Raum Zugang zu drei Valkyrie-II-Modulen, zwei Liegen- (oder Drohnenliegen-)Halterungen, einer Sitzbank, einer integrierten Trauma-/Defibrillator-Station und einem kompletten AR-Kommunikationssystem, über das Ärzte bei der Notversorgung helfen können. \n Die Trauma-/Defibrillatorstation des Fahrzeugs gilt als Medkit der Stufe 5. Der Lifeline hat keine Modifikationsslots mehr übrig. Er kann nur dann zusätzliche Modifikationen aufnehmen, wenn man vorher andere Modifikationen ausbaut und so Modifikationsslots freimacht. Sitze: Ein Fahrer/Rigger, ein Passagier vorne, vier Passagiere in der Mitte, bis zu vier Personen medizinisches Personal hinten.

item.gmc_forge.desc=(Reparaturfahrzeug) Der Wagen basiert auf einem großen Lieferwagen-Chassis und ist etwa so groß wie ein großes Wohnmobil. Im vorderen Drittel befindet sich der Passagierraum mit Innenausstattung (ein kleines Klappbett, Speisekammer, Küche und ein Mikro-Badezimmer), in der Mitte sind Werkzeug, Material und Reparaturausrüstung untergebracht. Der Rest des Forge ist eine Reparaturbucht, in der Motorräder und große Drohnen leicht unterzubringen sind. Für Fahrzeuge bis zur Größe eines mittleren Lieferwagens kann sich der Reparaturbereich ausklappen und trotzdem abgeschottet bleiben. Bei noch größeren Aufgaben kann die Reparaturbucht abgekoppelt werden, und die Wände können sich noch weiter öffnen, aber dann ist der Mechaniker den Elementen ausgesetzt. Wenn man eine Reparatur nicht im Feld ausführen kann, kommt das einziehbare Abschleppsystem zum Einsatz, das mit Fahrzeugen bis zur Größe eines Sattelschleppers fertig wird. \n Das Öffnen oder Schließen der Reparaturbucht oder das Fixieren eines Fahrzeugs am Abschleppsystem benötigen eine Haupthandlung.

item.nissan_strider.desc=(Lieferwagen) Der Nissan Strider wird als „widerstandsfähiges, anpassungsfähiges Mehrzweckfahrzeug“ vermarktet, ist aber in Wirklichkeit ein Hochleistungs-Van, der mit einem Rennwagen genauso viel gemein hat wie mit einem Lieferwagen. Auch wenn er etwas kleiner ist und weniger Laderaum bietet als die meisten Vans, machen ihn seine Leistung und Vielseitigkeit bei vielen Kunden - gesetzestreuen und anderen - höchst populär. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.suzuki_sporter.desc=(Minivan) Suzuki nahm das Konzept seines Motorradmodells Transit wieder auf und brachte den Sporter als seinen ersten Minivan auf den Markt. Oberflächlich betrachtet sieht der Sporter in jeder Hinsicht vollkommen durchschnittlich und unauffällig aus. Und wie die Transit ist er aus modularen Systemen und Teilen konstruiert, die Wartung und Reparatur (und Modifikationen) stark vereinfachen. Die anderen wichtigen Argumente für den Sporter sind seine großzügige Sitzkapazität und der große Laderaum im Heck. \n Alle Schwellenwerte, um den Sporter zu modifizieren oder reparieren, sind um 1 gesenkt.

item.toyota_adventure.desc=(Van) Das Fahrzeug wurde vor ungefähr drei Jahren mit dem Slogan „der perfekte Wagen für ein Abenteuer“ vorgestellt, und sein Hauptmerkmal ist die modulare Sitzkonfiguration, die dafür sorgt, dass man viele verschiedene Passagiere in verschiedener Anzahl transportieren kann. Ab Werk hat der Adventure sechs Einzelsitze und hinten zwei seitliche Klapp-Sitzbänke für vier zusätzliche Passagiere, was insgesamt zehn Sitze ergibt. Das einzige Problem, wenn die Sitzbänke benutzt werden, ist, dass der Laderaum dramatisch kleiner wird. \n Alternative Konfiguration mit 6 Sitzen verfügbar.

item.volkswagen_superkombi.desc=(Mehrzweck-Van) Der Superkombi ist ein weitverbreitetes Arbeitsfahrzeug in den Sprawls und auf den Straßen Europas und des Nahen Ostens sowie in Teilen Nordafrikas und Nordamerikas. Mechaniker, Techniker – und ja, auch Runner – modifizieren den Wagen für verschiedenste Einsätze in vielen Umgebungen. Diese Praxis der Modifizierung hat zu einem der auffälligsten Merkmale des Superkombi geführt: Das Marketing von Volkswagen weist gezielt darauf hin, dass der neue Superkombi speziell für das Anpassen und Modifizieren entworfen wurde. Alle Komponenten und Systeme sind leicht zugänglich, was die Arbeitszeit und Wartungsnotwendigkeit drastisch reduziert. Die sechs Einzelsitze im hinteren Teil sind modular und können einfach durch das Öffnen einiger Verschlüsse ausgebaut werden. \n Alle Schwellenwerte, um den Superkombi zu modifizieren oder reparieren, sind um 1 gesenkt.

item.volkswagen_krime.desc=(Mehrzweck-Van) Ein VW Superkombi IV bei dem die beiden Vordersitze entfernt wurden, um Trollen als Fahrer mehr Bequemlichkeit zu bieten.

item.bmw_demon.desc=(Luftkissenmotorrad) Der Demon basiert auf dem Chassis der beliebten Blitzen und besitzt vier Propeller für den Auftrieb, die vorne und hinten zu einer „X“-Formation angeordnet sind. Sie werden auch zum Steuern genutzt, und zwei Mikro-Turbinen (wie sie oft bei schweren Luftdrohnen eingesetzt werden) sind am Heck montiert und sorgen für Schub. Und weil es sich um ein Hovercraft handelt, kann das Fahrzeug in fast jedem Gelände eingesetzt werden. \n Bei allen Steuern-Proben wird einer der Probenwürfel durch den Schicksalswürfel ersetzt.

item.chrysler_g12c.desc=(Hovercraft) Die Fahrzeuge der G12-Serie sind im Grunde Hover-Pick-ups, und das schon seit fast vierzig Jahren. Und dafür gibt es einen guten Grund. Neben dem offensichtlichen Vorteil, dass man mit dem G12 sowohl über Wasser als auch über Land fahren kann, ist das G12 auch leicht zu modifizieren. Das neueste Modell, das G12C, hat zwei Sitze und die traditionelle Ladefläche hinten, die eine zusätzliche Sitzbank oder einfach Ladung oder Ausrüstung aufnehmen kann. \n Wenn der Motor oder die Propeller beschädigt werden, steigt der Schwellenwert für Steuern-Proben nur um 1.

item.essy_blue_raptor.desc=(Hovercraft) Das Blue Raptor ist das, was herauskommt, wenn man einen Hochleistungssportwagen in ein Hovercraft verwandelt. Unter der Schürze nutzt das Raptor ein Vektorschub-System ähnlich dem eines T-Bird. Und wenn es nur ein bisschen mehr Kraft hätte, wäre es ein T-Bird. Es lässt sich an Land genauso gut steuern wie über dem Wasser. Aber einfach ist es nicht. Nur wenn man wirklich gut ist, sollte man darüber nachdenken, wirklich Gas zu geben. \n Bei allen Steuern-Proben wird einer der Probenwürfel durch den Schicksalswürfel ersetzt.

item.gmc_vacationer.desc=(Hovercraft) Das Vacationer III ist ein Allzweck-Hovercraft und gehört zu den stabilsten auf dem Markt. Es ist besonders bei Naturfreunden als Campingfahrzeug beliebt. Dieses Luftkissenfahrzeug bietet vier Personen Platz und hat hinten eine relativ komfortable Mikro-Schlafkabine für zwei samt Mikro-Kühlschrank und Nahrungsbereiter.

item.gmc_patroller.desc=(Hovercraft) Unter dem Namen Patroller wird der Vacationer III häufig für Patrouillen auf dem Wasser benutzt. Zwar hat das Patroller ähnliche Leistungsdaten wie das Vacationer, bietet aber eine leicht höhere Endgeschwindigkeit und ein besseres Handling sowie ab Werk ein Riggerinterface und eine schwere Waffenhalterung. Innen hat das Patroller dieselbe Sitzausstattung, aber die Passagiersitze sind mit eingebauten Fixierungsvorrichtungen versehen.

item.ares_army_master.desc=(Schützenpanzer) Der neueste Verkaufshit heißt Army-Master und ist ein Schützenpanzer im Stil eines Halbkettenfahrzeugs, das an Sicherheits-, Söldner- und Militäreinheiten verkauft wird. Der Army-Master kann bis zu zwanzig voll ausgerüstete Soldaten befördern und wird mit ein paar Modifikationen im Feld mit fast jedem Klima und Gelände fertig. Ab Werk hat er eine schwere Panzerung, die das meiste Feuer aus Kleinwaffen abhält, und abgeschrägte Panzerplatten im Unterboden leiten die zerstörerische Energie eines Beschusses von unten oder einer Explosion ab. Drei gepanzerte Türen (links, rechts, hinten) sorgen für schnellen Ein- und Ausstieg. Die hintere Tür ist beidseitig angeschlagen, kann also nach links oder nach rechts geöffnet werden, was beim Ausstieg noch ein bisschen mehr Schutz gewährt. Wenn die Passagiere sich am Kampf beteiligen müssen, können dafür sechs verschließbare Schießscharten benutzt werden. \n Alternative Konfiguration mit 3 Sitzen verfügbar.

item.bae_centurion.desc=(Kampfpanzer) Der ursprüngliche Centurion galt als einer der wichtigsten Kampfpanzer, der in den letzten dreißig Jahren herauskam, war der Haupt-Kampfpanzer der meisten europäischen Panzertruppen und wurde schließlich nach einem Lizenzvertrag auch exportiert. Wie der Vorgänger kann der Centurion II mehrere Rollen auf dem modernen Schlachtfeld erfüllen, wie zum Beispiel als Drohnenleitstelle, für Frontangriffe, direkte Feuerunterstützung und Infanterieunterstützung oder -bekämpfung. Um das zu leisten, besitzt der Centurion II mehrere Waffenhalterungen, drei mittlere Drohnenhalterungen und eine starke Panzerung.

item.ferrari_appaloosa.desc=(Leichter Spähpanzer) Dank einer Kombination aus verstärktem, aber leichtem Kompositrahmen und einem gewaltigen, eigens konstruierten Motor namens F245 kann der A-04 auf ebener Strecke Geschwindigkeiten erreichen, die mit Straßenrennern mithalten können. Und dank der schweren Militär-Aufhängung kann er auch mit Geländewagen wie dem Morgan oder Hotspur mithalten. Dann ist da die Widerstandsfähigkeit. Das aktuelle Modell hat eine reaktive Komposit-Panzerung, die es Kleinwaffenfeuer ignorieren lässt – nur schwere Waffen brauchen es überhaupt zu versuchen. Selbst wenn die Panzerung durchschlagen wird, erlauben redundante Systeme dem Chassis, noch viel mehr einzustecken, bevor es (endlich) nachgibt. Beim normalen A-04 sind es drei: ein Kommandant/Schütze und Beobachter/Schütze, die in der Hauptkabine den Turm und die hintere Waffe bedienen, während sich der Fahrer um das kümmert, was vorne ist. Dank kleinerer und effizienterer Komponenten bietet der A-04 hinten jetzt Platz für vier vollständig ausgerüstete Soldaten.

item.gd_macarthur.desc=(Kampfpanzer) Alles am MacArthur ist hochmodern, von den VR/AR-Steuersystemen über Elektronik und Sensoren bis hin zur Kommunikation. Vier Schubmotoren vom Typ AC339 Turbo-Vec zusammen mit nicht weniger als acht Vektorschub-Düsen erlauben dem MacArthur, für schnelle Angriffe und Reaktionen hohe Geschwindigkeiten zu erreichen und gleichzeitig beeindruckend widerstandsfähig zu sein. Er kann bis zur Hälfte seiner Steuerturbinen verlieren, bevor die Leistung sinkt, weil die verfügbare Schubkraft auf unbeschädigte Einheiten umgelenkt werden kann. Damit und mit der schweren Kompositpanzerung ist der MacArthur extrem schwer abzuschießen. Zwei flügelartige Strukturen an beiden Seiten besitzen jeweils zwei Raketenwerfer (insgesamt vier Werfer). Jeder Werfer hat sein eigenes Magazin (jeweils vier Raketen) und kann mit einer Mischung aus Panzerabwehr-, Anti-Personen-, Luftabwehr- oder Mehrzweck-Raketen bestückt werden.

item.gd_flyer.desc=(Fahrzeug für Spezialeinsätze) Im Kern ist der Flyer-90 ein aufgemotzter Strandbuggy – ein ultraleichter Rahmen mit starkem Elektromotor, was zu exzellenter Geschwindigkeit, Wendigkeit und Geländetauglichkeit führt. Er hat ein niedriges, kantiges Design ohne jede Finesse. Aber er muss auch nicht gut aussehen – er muss für Sonderkommandos oder Späher Transport und Feuerunterstützung bieten. Der Flyer-90 hat zwei wichtige Merkmale. Das erste ist die Fähigkeit, Dach und Rahmen zu falten, wodurch das Fahrzeug kompakter und leichter von Flugzeugen ins Kampfgebiet zu bringen ist. Das zweite wichtige Merkmal ist ein komplett modulares Design. Außer dem Motor, der manuellen Steuerung, den Standardsensoren und der Kraftübertragung (gerade genug, dass sich das verdammte Ding überhaupt bewegt) werden alle Teile des Fahrzeugs nach den Zielen und Missionsparametern ausgewählt. Das allgemeine Layout enthält eine Kabine mit Platz für einen Fahrer und einen Beifahrer/Navigator. Hinter dem Fahrer und Navigator gibt es Sitze für zwei Passagiere. Ein manuell bedienter schwerer Waffenturm (oft mit Sitz) ist ebenfalls aus diesem Bereich zugänglich, und eine leichte Waffenhalterung kann vor dem Navigator montiert werden. \n Alle Schwellenwerte, um den Flyer 90 zu modifizieren oder reparieren, sind um 1 gesenkt. Alle Schwellenwerte, um den Flyer 90 akustisch zu entdecken, sind um 3 erhöht.

item.gmc_chariot.desc=(Gepanzerter Drohnenträger) Der Chariot wurde als bodengestützter Drohnenträger und Drohnenkommandohub entworfen, der bei kleinen und großen Operationen auch als Feldwerkstatt dienen kann. Er ist nicht für den direkten Fronteinsatz gedacht, sondern als Kräfteverstärker hinter den Linien. Ästhetisch betrachtet sieht er wie eine gepanzerte Box auf acht Rädern aus, die mit Luken und Kommunikationseinrichtungen bedeckt ist. Die vordere Hauptkabine beherbergt sechs „Pilotenstationen“ für einzelne Rigger, komplett mit eigenen Riggerkonsolen. In der Mitte gibt es eine kleine Reparaturstation und Waffenkammer, und das hintere Drittel ist ausschließlich für Drohnenhalterungen für Boden- und Luftdrohnen reserviert. \n Mindestens 50 % aller Chassis-Modifikationsslots sind für Drohnenhalterungen und -stauraum vorgesehen. Die Riggerkonsolen sind nicht im Fahrzeugpreis inbegriffen.

item.gmc_trooper.desc=(Militärfahrzeug) Anders als andere Zivilfahrzeuge, die später für Kampf- oder Unterstützungszwecke modifiziert wurden, kommt der Trooper (laut GMC-Marketing) „vom Fließband direkt aufs Schlachtfeld“ und hat ab Werk ein Riggerinterface, eine Waffenhalterung, Solarzellen und verbesserte Sensoren. Der Wagen ist vielseitig anpassbar und wird in verschiedenen Rollen eingesetzt – meistens für Aufklärung, Patrouillen, Feuerleitung, Feuerunterstützung und leichte Angriffe. Die gepanzerten Seiten können einiges wegstecken, aber am besten nutzt man Geschwindigkeit und Wendigkeit des Troopers, um schwere Kampfhandlungen zu vermeiden.

item.honda_diamondback.desc=(Militär-/Sicherheitsfahrzeug) Die Diamondback wurde als „leicht gepanzertes Sturm- und Spähfahrzeug“ entworfen und ist im Grunde das, was bei der Kombination der DNA eines schweren Motorrads und eines Panzers herauskommt. In der Theorie klingt das verrückt, aber die Ingenieure bei Honda-GM machten es möglich. Die Diamondback bietet all die schönen Dinge, die man erwarten würde: Hochleistungs-Einzelradaufhängung, Komposit-Rahmen, eine ultramoderne VR/AR-Steuerung (mit manueller Redundanz), gepanzerte Smartreifen und eine ablative Panzerung, die brauchbaren (wenn auch nicht spektakulären) Schutz bietet. Der Turm hat die neue Zielfindungssoftware „Dead-Eye“, die das Fahrzeug im Prinzip zu einer Drohne auf einem Fahrgestell macht. Das System erlaubt dem Fahrer und dem Pilotsystem, nach Belieben zwischen Fahren und Schießen zu wechseln.

item.thundercloud_morgan_v1.desc=(Militär-/Sicherheitsfahrzeug) Der Morgan V1 ist ein vierrädriger Geländewagen für zwei Personen, der Riggern, Runnern und Schmugglern in dieser Region seit seiner Einführung gewaltig auf die Nerven geht. Er bietet die Ausstattung, die man erwarten würde: starker Motor, starke Aufhängung und damit Höchstleistung auch in extrem schwierigem Gelände. Der Fahrer sitzt mittig vorne, der Beifahrer erhöht hinter ihm in einer Schützenstellung, in der alle möglichen schweren Waffen montiert werden können. Außerdem hat der V1 nur manuelle Steuerung, sodass das Fahrzeug gegenüber Hacking unempfindlich ist.

item.thundercloud_morgan_v2.desc=(Militär-/Sicherheitsfahrzeug) Der Morgan V2 gilt als der größere Bruder des V1. Dieses sechsrädrige Modell läuft seit drei Jahren vom Band und hat einen ähnlichen Aufbau, aber Chassis und Rahmen wurden verbreitert, um einem zusätzlichen Beifahrer Platz zu bieten. Der Schütze sitzt weiter hinten erhöht, aber auch der hintere Teil wurde vergrößert, um einem vierten Sitz oder einer mittleren Drohnenhalterung (oder mehreren kleineren) Platz zu bieten, außerdem vergrößert sich dadurch der Laderaum. Anders als beim V1 gibt es im Fahrerbereich eine Halterung für einen Riggerkokon, und der V2 besitzt ein Riggerinterface.

item.bmw_super_bug.desc=(Experimenteller Gyro-Wagen) Der SuperBug sieht aus wie eine kugelförmige Kabine für zwei Personen mit Gyrostabilisator, die an mehreren stabilisierenden Ringen befestigt ist. Diese Ringe sind an vier Gelenken an einem anderen Ring befestigt, die in Haltestangen enden (und meistens Beine genannt werden). Jedes Bein kann eine eigene Energieversorgung haben oder an einen gemeinsamen Motor samt Kraftübertragung angeschlossen sein und Räder, Ketten oder sogar Ski haben. Andere Steuer- und Aufhängungssysteme können je nach Bedarf montiert werden. Um die Produktion etwas zu vereinfachen, setzte man auf vier unabhängige Mini-Elektromotoren an den Beinen, die unabhängig die Räder antreiben. In Bewegung kreist und dreht sich der Rahmen je nach Untergrund um die Kabine. Dadurch kann der SB schnell die Richtung ändern, indem sich der ganze Rahmen um die Kabine dreht. In manchen Situationen kann sich das Fahrwerk um fast neunzig Grad an Wänden oder über Hindernisse kippen. Die gesamte Koordination und Steuersynchronisierung wird durch eine spezielle AR- oder DNI-Steuerung ermöglicht, die von einem fortschrittlichen Pilot-by-Wire-System unterstützt wird. Es gibt keine Option für manuelle Steuerung. \n Bei Ausweichmanövern wird einer der Probenwürfel durch den Schicksalswürfel ersetzt. Was Modifikationen betrifft, gilt der SB als normales Auto.

item.spinrad_street_rocket.desc=(Jet-Skateboard) Das „Street Rocket EX“ (EX natürlich für EXTREME!) ist ein Titanbrett von etwa 75 Zentimetern Länge und 25 Zentimetern Breite. Zwei Mikro-Jets sind hinten montiert und sorgen für ausreichend Schub. Das Fahrgestell ist modular, sodass der Nutzer entweder traditionelle Skateboard-Räder, Mini-Ketten oder die speziellen Räder namens „EX Sphere“ (Titankugeln, die mit vulkanisiertem Reifengummi überzogen sind) montieren kann. Die Steuerung funktioniert über AR und kann mit einem Kommlink und AR-Handschuhen verbunden werden. Das System ist auch mit Riggerkontrollen (ich empfehle, nur den AR-Modus zu nutzen) und Riggerkonsolen kompatibel. Um den Fahrer auf dem Dreks-Board zu halten, bietet das Street Rocket Geckogriff-Platten mit besonderer Haftkraft. Ansonsten kann man auch abnehmbare Fußhalter anbringen.



item.mitsubishi_waterbug.desc=(Jetski) Ich habe von diesem kleinen Ein-Personen-Jetskis gehört, sie seien „verflucht witzig“ und sogar süß. Und das stimmt. Der Fünffach-Jetantrieb (ein Jet im
Heck für den Antrieb und zwei Paare an den Seiten), den diese kleinen Dinger verwenden, ermöglicht eine extreme Wendigkeit. SIN-Menschen benutzen sie als Sportgeräte, und Sicherheitspatrouillen setzen sie ebenfalls gerne ein.

item.mitsubishi_waveskipper.desc=(Jetski) Der Waveskipper hatte sein Debüt 2079 mit einem Siebenfach-Jetantrieb. Er ist größer als der Vorgänger und kann zwei Personen bequem, im Notfall auch drei transportieren. Nicht so wendig wie der kleinere Bruder, aber die Verkaufszahlen sind so hoch, dass es monatelange Wartelisten gibt.

item.kawasaki_stingray.desc=(Schnellboot) Diese Fahrzeuge sind hervorragend dafür geeignet, wenn man wirklich den Wind im Haar spüren will, aber weil sie richtige Boote mit richtigem Rumpf sind, hat man mehr Modifikationsoptionen als bei den Jetskis, und sie sind auch noch bequemer. Außerdem sind sie bei geringer Geschwindigkeit stabiler und besser einsetzbar (was für heimliche Aktionen hilfreich ist).

item.kawasaki_manta_ray.desc=(Schnellboot) Diese Fahrzeuge sind hervorragend dafür geeignet, wenn man wirklich den Wind im Haar spüren will, aber weil sie richtige Boote mit richtigem Rumpf sind, hat man mehr Modifikationsoptionen als bei den Jetskis, und sie sind auch noch bequemer. Außerdem sind sie bei geringer Geschwindigkeit stabiler und besser einsetzbar (was für heimliche Aktionen hilfreich ist). Der Manta Ray ist der etwas größere Bruder des Stingray.

item.zodiac_whisper.desc=(Schlauchboot) Diese kleinen Schlauchboote sieht man überall auf der Welt – vom Freizeitbereich bis hin zu kleinen Militär- und Sicherheitsoperationen. Sie sind oft nur ein paar Meter lang, können im nicht aufgeblasenen Zustand sehr leicht verstaut werden und sind leicht genug, dass zwei Metamenschen (oder ein Straßensamurai/Ork) sie tragen können. Sie werden von einem Außenbordmotor angetrieben – meistens einem Elektromotor, aber Langlebigkeit und Nützlichkeit dieser Fahrzeuge führen dazu, dass man hier noch viel mehr Verbrennungsmotoren als überall sonst sieht. Mit Elektromotor oder mit Rudern sind die Dinger so leise, wie ihr Name andeutet. \n Das Fahrzeug kann nur Antriebsmodifikationen aufnehmen und keine WiFi-Vorteile erhalten. Werte wenn das Boot gerudert wird: Handling 5, Beschleunigung 5, Geschwindigkeitsintervall 5, Höchstgeschwindigkeit 10.

item.zodiac_whisper_mil.desc=(Schlauchboot) Diese kleinen Schlauchboote sieht man überall auf der Welt – vom Freizeitbereich bis hin zu kleinen Militär- und Sicherheitsoperationen. Sie sind oft nur ein paar Meter lang, können im nicht aufgeblasenen Zustand sehr leicht verstaut werden und sind leicht genug, dass zwei Metamenschen (oder ein Straßensamurai/Ork) sie tragen können. Sie werden von einem Außenbordmotor angetrieben – meistens einem Elektromotor, aber Langlebigkeit und Nützlichkeit dieser Fahrzeuge führen dazu, dass man hier noch viel mehr Verbrennungsmotoren als überall sonst sieht. Mit Elektromotor oder mit Rudern sind die Dinger so leise, wie ihr Name andeutet. \n Das Fahrzeug kann nur Antriebsmodifikationen aufnehmen und keine WiFi-Vorteile erhalten. Werte wenn das Boot gerudert wird: Handling 5, Beschleunigung 5, Geschwindigkeitsintervall 5, Höchstgeschwindigkeit 10.

item.bae_atlantic.desc=(Festrumpfschlauchboot) Die meisten Leute kennen Zodiac als Anbieter von Festrumpfschlauchbooten, aber der andere große Name ist der eigentliche Erfinder: BAE Systems (eine Tochter von Saeder-Krupp). Diese Boote gibt es für gewöhnlich in vier bis neun Metern Länge, aber man kennt auch noch wesentliche größere, die bis zu zwanzig Meter lang werden können. Das Atlantic hat Außenbordmotoren, meistens elektrische Jetantriebe, aber es gibt auch noch alte Dieselmaschinen.

item.bae_pacific.desc=(Festrumpfschlauchboot) Die meisten Leute kennen Zodiac als Anbieter von Festrumpfschlauchbooten, aber der andere große Name ist der eigentliche Erfinder: BAE Systems (eine Tochter von Saeder-Krupp). Diese Boote gibt es für gewöhnlich in vier bis neun Metern Länge, aber man kennt auch noch wesentliche größere, die bis zu zwanzig Meter lang werden können. Das Pacific hat einen Innenbord-Jetantrieb.

item.sea_ray_cottonmouth.desc=(Rennboot) Diese verflucht schnellen 14-Meter-Rennboote sind fragil und viel zu leicht erhältlich. Ab Werk gibt es zwei Waffenhalterungen vorne und zwei hinten, was diese Rennbestie zu etwas macht, wovor sich die meisten Boote in Acht nehmen sollten. Das Cottonmouth verwischt auch die Grenze zwischen Schnellboot und Motorjacht, weil es zwar eindeutig ein Schnellboot ist, aber eine geschlossene Kajüte mit etwas Einrichtung (einschließlich zweier kleiner Kojen) besitzt.

item.horizon_freedom.desc=(Segeljolle) Die Boote der Freedom-Reihe von Horizon sind wenig mehr als große Jollen, die (je nach Größe) eine Handvoll Leute transportieren können. Hervorragend für Kinder und Segelanfänger, die das Handwerk lernen und ein Gefühl für die See bekommen wollen; und dafür, die Freude zu erleben, übers Wasser zu sausen und nur ein Segel und Tauwerk zu brauchen, um voranzukommen. Ein wundervolles Gefühl; etwas, wovon jeder Segler träumt.

item.horizon_freedom_motor.desc=(Segeljolle) Die Boote der Freedom-Reihe von Horizon sind wenig mehr als große Jollen, die (je nach Größe) eine Handvoll Leute transportieren können. Hervorragend für Kinder und Segelanfänger, die das Handwerk lernen und ein Gefühl für die See bekommen wollen; und dafür, die Freude zu erleben, übers Wasser zu sausen und nur ein Segel und Tauwerk zu brauchen, um voranzukommen. Ein wundervolles Gefühl; etwas, wovon jeder Segler träumt. Mit Mini-Außenbordmotor kann Höchstgeschwindigkeit 8 erreicht werden.

item.corsair_elysium.desc=(Segelboot) Dieses Einrumpfboot sieht mit seinem einzelnen Mast anderen Segelbooten seiner Größe sehr ähnlich. Die Besonderheit, wegen der ich es hier erwähne, ist, dass das Corsair etwas Kajüt- und Laderaum eingespart hat, um Platz für einen wesentlich größeren Motor zu schaffen, als man ihn bei einem Segelboot dieser Größe erwarten würde. Das Elysium hat meistens selbst aufrollende Segel und ist so konstruiert, dass es von einem einzelnen Segler bei jedem Wetter außer schwersten Stürmen auf See gefahren werden kann – aber diese Segelvariante gilt immer noch als Extra. \n Werte beim Segeln: Handling 3, Beschleunigung 10, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 20.

item.corsair_ellipse.desc=(Segelboot) Das Ellipse ist viel eher ein typisches Segelboot: Der Innenbordmotor ist viel kleiner als beim Elysium und dient nur zum Manövrieren im Hafen und als Sicherheitsmaßnahme für Schlechtwetter. \n Werte beim Segeln: Handling 3, Beschleunigung 10, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 20.

item.corsair_panther.desc=(Katamaran) Das Panther ist dem Elysium recht ähnlich, ebenfalls mit einem Mast, aber als traditioneller Katamaran ausgeführt. Dadurch ist das Fahrzeug auf dem Wasser schneller, weil Katamarane am Bug mehr Auftrieb haben und hydrodynamisch generell effizienter sind. Außerdem gibt es zwei Innenbordmotoren, die allerdings etwas kleiner sind als beim Elysium. Die Gesamtmotorleistung ist dennoch um zwanzig Prozent größer, was zusammen mit dem effizienteren Rumpfdesign zu einem wesentlich schnelleren Boot führt. \n Werte beim Segeln: Handling 5, Beschleunigung 10, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 30.

item.corsair_puma.desc=(Katamaran) Wie beim Elysium verlangten viele Leute nach einem günstigeren, traditionelleren Segelboot, und auch hier hörte Corsair auf den Ruf der Massen und brachte das Puma heraus. Beide haben dieselben Kajüten- und Wohnarrangements und können acht Personen für einige Monate auf See bequem unterbringen; dazu gibt es noch Solarzellen, um die Batterien in gutem Ladezustand zu halten. Beide Modelle haben auch das verbesserte Batteriesystem des ursprünglichen Panther. \n Werte beim Segeln: Handling 3, Beschleunigung 10, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 30.

item.corsair_trident.desc=(Trimaran) Dieses Angebot von Corsair ist aktuell eines der schnellsten Segelboote auf dem Wasser: der Einmaster-Trimaran Trident. Wie bei den Einrumpfbooten und Katamaranen enthalten die drei Rümpfe viel größere Maschinen, als man von einem Segelboot erwarten würde (eigentlich sind es zwei im zentralen Rumpf), was dieses bereits schnelle Wasserfahrzeug noch schneller macht. Der zentrale Rumpf ist breiter als üblich und bietet überraschend geräumige Quartiere für die Acht-Personen-Crew. \n Werte beim Segeln: Handling 3, Beschleunigung 10, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 30.

item.corsair_triton.desc=(Trimaran) Das Triton ist der Trimaran mit einem eher konventionellen Einzelmotor und ist bei erfahrenen Seglern und Neulingen sehr beliebt. Der zentrale Rumpf ist breiter als üblich und bietet überraschend geräumige Quartiere für die Acht-Personen-Crew. \n Werte beim Segeln: Handling 3, Beschleunigung 10, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 30.

item.evo_waterking.desc=(Motorjacht) Ein sehr vernünftiges Fahrzeug – fast schon der Americar der Seen und Flüsse der Sechsten Welt. Mit achtzehn Metern Länge ist das Waterking ein eher großes Boot, aber nicht allzu schwierig für jemanden, der eine etwas mehr als nur oberflächliche Vertrautheit mit dem Steuern von Booten hat. Das Arrangement ist typisch für solche Motorjachten: im Oberdeck ein Sitzbereich im Heck über dem Motor, eine Kabine vorn mit Kombüse/Speiseraum und eine Toilette mit Dusche und zwei Kabinen mit je zwei Kojen; im Unterdeck eine weitere Toilette und vier weitere Kabinen mit je zwei Kojen und der Laderaum.

item.evo_aquavida_1.desc=(Hausboot) Mit neun Metern Länge hat dieses ehrwürdige Hausboot eine eher normale Länge für Motorboote, wie man sie auf den Flüssen, Seen und (mit ein bisschen Mut) Meeren der Welt erwarten würde. Im Hauptdeck liegen Wohnraum und Kabine mit einem kleinen Badezimmer und Kombüse. Über dem Hauptdeck liegt ein Steuerhaus mit zusätzlichen Sitzplätzen, was perfekt zum Essen unter freiem Himmel ist. Das Boot hat ein Zimmer für zwei Personen und einen Sitzbereich im vorderen Bereich des Hauptdecks.

item.evo_aquavida_2.desc=(Hausboot) Mit neun Metern Länge hat dieses ehrwürdige Hausboot eine eher normale Länge für Motorboote, wie man sie auf den Flüssen, Seen und (mit ein bisschen Mut) Meeren der Welt erwarten würde. Im Hauptdeck liegen Wohnraum und Kabine mit einem kleinen Badezimmer und Kombüse. Über dem Hauptdeck liegt ein Steuerhaus mit zusätzlichen Sitzplätzen, was perfekt zum Essen unter freiem Himmel ist. Das Boot hat zwei Zimmer für insgesamt vier Personen.

item.maersk_wavecutter.desc=(Patrouillenboot) Das Wavecutter ist mit 28 Metern Länge für viele Seeleute zu klein, um als Schiff zu gelten, und wird daher als Motorboot bezeichnet. Es ist vielleicht das erste hochseetaugliche Sicherheits- und Militärfahrzeug und fühlt sich in vielen verschiedenen Rollen zu Hause: Kanonenboot, Patrouillenboot, Minenräumer, Unterstützungsfahrzeug für Spezialtruppen und so weiter. Dann kommt noch ein Elektromotor dazu, der dem Wavecutter noch mehr Geschwindigkeit und Wendigkeit verleiht. Man kann auch nur den Elektromotor verwenden, wodurch das Boot bei geringer Geschwindigkeit sehr schwer zu entdecken ist und die Reichweite beträchtlich steigt. \n Die Kleinbootrampe kann ein (Festrumpf-)Schlauchboot oder zwei Kleinfahrzeuge aufnehmen. Das Starten eines Kleinboots erfordert eine Haupthandlung des Piloten/Riggers und eine Haupthandlung des Piloten des Kleinboots. Um das Kleinboot zu bergen, sind jeweils 3 Haupthandlungen erforderlich.

item.cutty_sark.desc=(Segelschiff) Die Cutty Sark II ist 85 Meter lang, 11 Meter breit, hat einen Tiefgang von 6 Metern und ist ein vollständig aufgetakelter Klipper. Das bedeutet, dass sie drei Masten mit Rahsegeln hat (ich bin sicher, wir alle haben die Bilder gesehen). Sie ist heutzutage nicht das schnellste Schiff, aber sie ist einfach ein majestätisches Ding, das auf dem Wasser zu Hause ist. Weil sie so authentisch wie möglich sein soll, hat die Cutty Sark II keinerlei moderne Elektronik. Sie hat kein Matrix-Icon, keine Sensoren und schon gar kein Spatzenhirn. Und keinen Antrieb außer dem Wind.Sie segelt mit einer Dauerbesatzung von 30, hat aber Kojen für 12 weitere Personen – meistens Studenten oder zahlende Passagiere. \n Für je 5 Crewmitglieder, die nicht beim Segeln helfen können, steigt das Handling um 1 und sinken Beschleunigung und Geschwindigkeitsintervall um je 1.

item.pseidons_endeavour.desc=(Segelschiff) Dieses Segelschiff ist das genaue Gegenteil der Cutty Sark II, weil sie so modern ist, wie es geht. Die Poseidon's Endeavour ist die Erste ihrer Art. Den Anfang macht ein beeindruckender Rumpf mit den neuesten modernen Materialien, dazu kommt ein vollautomatisches Steuerungssystem mit revolutionären Starrsegeln an jedem der drei Masten. Das bedeutet, dass dieses technologische Wunder Geschwindigkeiten erreichen kann, die für ein Segelschiff bisher unerreicht waren. Ihre Reichweite ist ebenfalls unglaublich, weil die moderne Technologie bedeutet, dass sie eine vollelektrische Energieversorgung und all die fortschrittlichen Systeme besitzt, die dadurch ermöglicht werden. Das Erstaunlichste an der Poseidon's Endeavour ist jedoch, dass sie von nur einer Person gefahren werden kann. Ja, einer. Ein einzelner Rigger mit ausreichenden Fähigkeiten kann dieses Schiff bedienen, ohne es zu gefährden oder ein Schifffahrtshindernis darzustellen. Für Wartung und Reparatur des Schiffs braucht man natürlich eine größere Besatzung, und das Anlanden im Hafen mit nur einem Rigger ist eine Herausforderung, aber machbar. Die Poseidon's Endeavour ist 103 Meter lang und 18 Meter breit bei einem Tiefgang von 9 Metern. Jeder ihrer drei Masten hat ein „Segel“, das eher wie der vertikal montierte Flügel eines Flugzeugs aussieht.

item.cipactli_corvette.desc=(Korvette) Kriegsschiffe gibt es in vielen Formen und Größen, aber es gibt eingeführte Begriffe, die eine bestimmte Erwartung in Bezug auf Größe und Fähigkeiten mit sich bringen. „Korvette“ ist der Begriff für die kleinste dieser Schiffsarten, und damit haben wir es hier zu tun. Die Cipactli-Klasse, benannt nach dem mythischen Seeungeheuer der aztekischen Legende, würde in den meisten Marinen als Allzweck-Kriegsschiff bezeichnet werden. Sie ist gleichermaßen bei der Bekämpfung von Schiffen, U-Booten und Fluggeräten effektiv, bildet den Kern der Küstenstreitkräfte von Aztlan/Aztechnology und wird auch auf hoher See eingesetzt. Neben drei Raketenbatterien verfügt die Cipactli-Klasse über eine einzelne 115-mm-Schiffskanone in einem Turm am Bug. Diese Kanone wird in erster Linie zur Feuerunterstützung von Aztech-Konzernsicherheit benutzt, kann aber auch zum Abfeuern vieler verschiedener Munitionstypen verwendet werden und daher auch eine Bedrohung für Boote und sogar kleine Schiffe sein. Die Crew einer Korvette der Cipactli-Klasse umfasst 15 Offiziere und 80 Besatzungsmitglieder. Das scheint eine kleine Zahl für ein Schiff dieser Größe, aber normalerweise sind mindestens vier Rigger für verschiedene Zwecke im Einsatz – Ruder, elektronische Kriegsführung, zwei Waffenoffiziere –, was bedeutet, dass das Schiff nicht so viele Besatzungsmitglieder benötigt wie frühere Generationen von Kriegsschiffen, um im Kampf effektiv zu sein.

item.lurssen_mobius.desc=(Luxusjacht) Wenn ihr es aushaltet, einem reichen Scheißer, der euch vielleicht wie Leibeigene (oder schlimmer) behandelt, zu Diensten zu sein, könnt ihr auf diesem 140 Meter langen, ultraluxuriösen Palast auf dem Meer leben und arbeiten. Die Möbius wurde für die Bedienung durch eine einzige Person entwickelt – mit Unterstützung eines Trupps von dreißig Drohnen, die alle Dienste erledigen können, die die Passagiere brauchen: von der gewöhnlichen Reinigung und Essenszubereitung bis zum Steuern des Schiffes. Die Möbius hat fünf Decks: Unterdeck, Virtuelles Deck, Wohndeck, Unterhaltungsdeck und Sonnendeck. Im Wohndeck gibt es zehn Kabinen, die Suite des Besitzers, die Kabine des Steuermanns, zwei Kombüsen und vier Speiseräume. Von den dreißig Dienstdrohnen sind mindestens acht Anthroform-Modelle, die als Sicherheitskräfte an Bord dienen können, um Enterkommandos abzuwehren, und die Möbius hat auch zwei Mini-Luftschiffe und zehn Roto-Drohnen, die das Schiff aus der Luft im Auge behalten. Lürssen bietet auch die Möglichkeit, verdeckte Ladestationen für acht robuste Bodenkampfdrohnen, meistens Steel Lynx, anzubringen.

item.ranger_battlecruiser.desc=(Schlachtkreuzer) Dass man die Ranger-Klasse allgemein als Schlachtkreuzer bezeichnet, liegt an der hochmodernen Energieerzeugung. Jedes der Schiffe besitzt zwei Miniatur-Kernfusionskraftwerke, die jeweils den gesamten Energiebedarf des Schiffs – von der Elektronik bis zum Antrieb und allem anderen – decken können. Die Reaktoren sind vergleichsweise leicht und klein, was der Ranger-Klasse durch die vier Impeller für den Hauptantrieb und angeblich acht Strahlruder zur Verbesserung der Wendegeschwindigkeit eine sehr respektable Höchstgeschwindigkeit von 45 Knoten (84 km/h) verleiht. Man nimmt aber an, dass die Ranger-Klasse drei Geschütztürme (zwei vorne und einen hinten) haben wird, die jeweils ein Paar der schwersten Schiffsrailguns enthalten, die jemals auf dem Wasser eingesetzt wurden. Der Deckraum, auf dem sich normalerweise der vierte Turm befindet (direkt hinter den Aufbauten), ist sowohl für gerichtete als auch für vertikal gestartete Raketenbatterien vorgesehen, die SAMs oder Anti-Schiff-Raketen abfeuern können. Wenn die Gerüchte über das Feuerleitsystem stimmen, wird die Ranger-Klasse mehr als zwanzig große Überwasserschiffe gleichzeitig bekämpfen können und dank eines halben Dutzends Nahbereichsverteidigungssystemen der nächsten Generation und vier Sekundärtürmen eine beeindruckende Flugabwehr haben.

item.tranquility_princess.desc=(Kreuzfahrtschiff) Die Tranquility Princess ist das neueste Schiff der State-Klasse von Princess Cruises. Sie wurde mit besonderem Augenmerk auf Komfort und eine größere Anzahl an Kabinen und Suiten für (etwas) günstigere Tickets entworfen, bietet aber genauso viel Komfort und Service, wie man von jedem anderen Kreuzfahrtschiff erwarten würde. Einige Decks sind extrem opulent, andere nur nett, aber alle Tickets sind All-Inclusive (inklusive der üblichen Dienstleistungen und Substanzen, die juristisch eher zweifelhaft sind), und jedem Passagier ist ein Abend im prunkvollen Gala-Ballsaal garantiert. Mit 412 Metern Länge, 48 Metern Breite und einem Tiefgang von 9,5 Metern gehört die Tranquility Princess zu den zwölf größten Kreuzfahrtschiffen, die heute die Ozeane befahren. Sie kann 5.490 Passagiere und 1.211 Besatzungsmitglieder transportieren und gleitet (dank ihrer vier Schrauben, die von einem Mikro-Kernreaktor angetrieben werden) mit einer majestätischen Höchstgeschwindigkeit von 26 Knoten durchs Wasser.

item.maersk_uhcs.desc=(Ultra-Riesiges Frachtschiff) Frachtschiffe der UHCS-Klasse (Ultra-Huge Cargo Ship) sind die neueste Generation des Massengüterverkehrs auf See, und die Schiffe der Double-L-Klasse von Mærsk sind ein gutes Beispiel dafür. Von den 98 Schiffen dieser Klasse (Nummer 100 soll im Sommer 2082 vom Stapel gelassen werden) werden die allermeisten als Containerschiffe eingesetzt, einige aber auch für den Rohöl-, Erdgas- und Schüttguttransport. Der Mega-Max-Standard bedeutet, dass die Schiffe der Double-L-Klasse eine Gesamtlänge von 625 Metern und eine Breite von 72 Metern haben, bei voller Beladung mit einem maximalen Tiefgang von 26 Metern. Die Energie wird von zwei kleinen Fusionsreaktoren erzeugt und durch Solarzellentechnologie ergänzt. Man braucht einen Steuermann mit ruhiger Hand und Synapsen aus Plasstahl, um ein so großes Schiff zu steuern, besonders wenn es seitlich an einem Frachtterminal entlangkriecht, aber Mærsk und den anderen Kons scheint es nicht an erfahrenen Steuerleuten zu mangeln.

item.factory_ship.desc=(Fabrikschiff) Der echte Preis eines Fabrikschiffs ist 7 Milliarden, außerhalb der Möglichkeiten von Genesis. Sie sind über einen Kilometer lang und bis zu 400 Meter breit und fahren auf verwirrenden Routen wie die strategischen U-Boote von vor dem Ersten Crash. Sie agieren meistens weit außerhalb der Sichtweite von Küsten und Hauptschifffahrtsrouten, und sie sind oft mit einer Technologie ausgestattet, die ihnen ein wenig Tarnung ermöglicht – ein kilometerlanges Schiff wäre eigentlich nicht so schwer zu entdecken. Soweit ich weiß, hat jedes Schiff zwei (oder mehr) Fusionsreaktoren, wie man sie in einer Großstadt finden würde. Und diese Dinger sind genau das: Fabriken, die eine breite Palette von Gütern ungefähr so schnell produzieren können wie zwei durchschnittliche Fabriken an Land. Die meisten sind vollautomatisiert und brauchen nur ein paar Dutzend Besatzungsmitglieder, um die Drohnen und anderen automatischen Systeme zu warten.

item.aquadyne_basic.desc=(Tauchscooter) Ein Tauchscooter ist weniger ein Fahrzeug als ein Zubehör; das sind diese kleinen Motoren mit Handgriffen, die man manchmal bei Tauchern und Schnorchlern sieht. Sie haben ungefähr die Größe eines Schuhkartons oder Brotkorbs, sind leicht zu transportieren und günstig genug, um immer eines zur Hand zu haben. \n Batteriekapazität 6 Stunden.

item.aquadyne_sport.desc=(Tauchscooter) Ein Tauchscooter ist weniger ein Fahrzeug als ein Zubehör; das sind diese kleinen Motoren mit Handgriffen. Das Sportmodell ist größer – fast doppelt so lang wie das Standardmodell –, viel schneller und bietet auch eine bessere Beschleunigung. \n Batteriekapazität 4 Stunden.

item.aquadyne_hunter.desc=(Tauchscooter) Ein Tauchscooter ist weniger ein Fahrzeug als ein Zubehör; das sind diese kleinen Motoren mit Handgriffen. Das Jagdmodell liegt in der Länge zwischen dem Standard- und dem Sportmodell. Für diese zusätzliche Größe kriegt man einen viel leiseren Motor, eine viel leisere Schraube und eine Stelle zum Anbringen einer Harpune. \n Batteriekapazität 5 Stunden.

item.maersk_riptide.desc=(Swimmer Delivery Vehicle) Das Mærsk Shipyards Riptide ist ein viersitziges Swimmer Delivery Vehicle, das mehr als genug Ausrüstung oder Ladung transportieren kann, um die eingeschifften Spezialtruppen mehrere Wochen hinter den feindlichen Linien überleben lassen können. Riptides sind leicht zu zerlegen und zusammenzubauen, weil nicht alle U-Boote über die passenden Andockmöglichkeiten verfügen, um etwas von der Größe eines großen Betts für Orks zu Wasser zu lassen und/oder vollständig zusammengebaut zu bergen. Die Batterie speist zwei Jetantriebe, was dem Riptide eine hohe Wendigkeit und eine reduzierte akustische Signatur verleiht und Schäden an den Propellern im flachen Wasser oder in der Nähe des Meeresbodens nahezu komplett verhindert. \n Batteriekapazität 16 Stunden.

item.proteus_marianas.desc=(Tiefseetauchboot) Das Proteus Marianas ist eines der größten Trockentauchboote, das den Grund des Marianengrabens im Pazifischen Ozean erreichen kann – des tiefsten Teils des Ozeans, den wir kennen. Es ist für einen längeren Aufenthalt mit einer Besatzung von 6 Personen (normalerweise ein Steuermann, ein Ingenieur und vier Passagiere) konzipiert, um den Meeresboden zu erkunden, nach neuen Mineralvorkommen zu suchen, die einzigartigen und erstaunlichen Lebensformen zu erforschen, die in diesen Tiefen leben, und vielleicht den Meeresboden zu kartieren und potenzielle Standorte für neue Aquakologien zu finden. Das Marianas besitzt zwei integrierte Cyberarme, sodass der Pilot oder ein anderes Crewmitglied mit Riggerkontrolle komplexe Aufgaben ausführen kann. \n Batterie-/Luftkapazität 56 Stunden; Maximaltiefe 11.000m.

item.proteus_cargo_sub.desc=(Fracht-U-Boot) Die Fracht-U-Boote der Sea-Klasse von Proteus sind sind nicht mehr die allergrößten – Wuxing holte sich diesen Titel 2079, als es die ersten Boote der T718-Klasse vom Stapel ließ –, aber sie sind für ein U-Boot immer noch sehr groß. Die Energie stammt aus zwei kleinen Fusionsreaktoren, die Jets antreiben, was die Sea-Klasse zu einem überraschend wendigen Fahrzeug macht. Wenn man bedenkt, dass sie an Unterwasser-Frachtterminals andocken und auch normale Hafenterminals benutzen müssen, ist das auch wirklich nötig. Mit 280 Metern Länge, 28 Metern Breite und einem (aufgetauchten) Tiefgang von 11 Metern liegen diese U-Boote sehr hoch im Wasser (um den Panamax-Standard zu erfüllen), was sie wirklich seltsam aussehen lässt. \n Werte wenn das U-Boot aufgetaucht ist: Handling 6, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 30; Maximaltiefe 1.600m.

item.japan_navy_shio.desc=(Jagd-U-Boot) Der echte Preis des Shio ist 4,9 Milliarden, außerhalb der Möglichkeiten von Genesis. Janes Fighting Ships klassifiziert diese U-Boote als SSI, wobei das I für Fusion steht (keine Ahnung warum, ich habe es mir nicht ausgedacht!), da ihr Antrieb darauf basiert. Der Reaktor speist einen einzelnen elektrischen Wasserstrahlantrieb im Heck, der es diesen kleinen schwarzen Schiffen erlaubt, sich mit bis zu 52 Knoten zu bewegen. Und das Schlimmste ist, dass sie dabei fast lautlos sind! Mit einer Länge von 100 Metern, einer Breite von 11,5 Metern, einem Tiefgang von 10,5 Metern und der klassischen schwarzen Zigarrenform ähnelt die Shio-Klasse optisch den meisten SSI. Diese U-Boote sind mit sechs 533-mm-Torpedorohren bewaffnet, die natürlich Anti-Schiff-Torpedos, aber auch Marschflugkörper und sogar Luftabwehrraketen abfeuern können. Und das alles mit einer Crew von nur 65 Personen. \n Werte wenn das U-Boot aufgetaucht ist: Handling 6, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 40; Maximaltiefe 900m.



item.ai_jetpack.desc=(Jetpack) Das AI PPS, auf den Straßen auch „Weintraube“ genannt, ist im Grunde ein Jetpack. Ein Viererpack Schubdüsen liefert Schub und Kontrolle. Jede der Düsen ist eine eiförmige Kugel, die mit dem zentralen Tank verbunden ist. Die Streben, die aus dem Tank in die Düsen ragen, haben für den Spitznamen „Weintraube“ gesorgt, weil sie wie ein paar Weintrauben aussehen. Das System ermöglicht normalen Flug, Schweben und sogar eine „Sprungoption“, die beim Start zusätzlichen Schub gibt und bei der Landung einen kurzen Stoß abgibt, um die Aufsetzgeschwindigkeit zu reduzieren und Beinverletzungen zu verhindern. Ein Sprung kann direkt in den nächsten großen Satz oder erst einmal in einen kurzen Sprint bis zum nächsten Sprung übergehen.

item.ai_jetpack_glider.desc=(Jetpack) Ein AI PPS mit zusätzlichem PFS Gleiter. Ein Viererpack Schubdüsen liefert Schub und Kontrolle. Jede der Düsen ist eine eiförmige Kugel, die mit dem zentralen Tank verbunden ist. Die Streben, die aus dem Tank in die Düsen ragen, haben für den Spitznamen „Weintraube“ gesorgt, weil sie wie ein paar Weintrauben aussehen. Beim PFS handelt es sich im Grunde um ein riesiges System aus Flügel und Stabilisator, das einer Person den Gleitflug ermöglicht.

item.krime_jetpack.desc=(Jetpack) Die Troll-Version des AI PPS. Ein Viererpack Schubdüsen liefert Schub und Kontrolle. Jede der Düsen ist eine eiförmige Kugel, die mit dem zentralen Tank verbunden ist. Die Streben, die aus dem Tank in die Düsen ragen, haben für den Spitznamen „Weintraube“ gesorgt, weil sie wie ein paar Weintrauben aussehen. Das System ermöglicht normalen Flug, Schweben und sogar eine „Sprungoption“, die beim Start zusätzlichen Schub gibt und bei der Landung einen kurzen Stoß abgibt, um die Aufsetzgeschwindigkeit zu reduzieren und Beinverletzungen zu verhindern. Ein Sprung kann direkt in den nächsten großen Satz oder erst einmal in einen kurzen Sprint bis zum nächsten Sprung übergehen.

item.ai_glider.desc=(Gleiter) Hierbei handelt es sich im Grunde um ein riesiges System aus Flügel und Stabilisator, das einer Person den Gleitflug ermöglicht. Im zusammengepackten Zustand ist es ein dicker Rucksack mit einem Gurtsystem für Brust und Beine. Es ist als Alternative fürs Fallschirm- oder Klippenspringen gedacht, aber es erfordert einiges an Können, damit zu landen, ohne sich irgendetwas zu brechen.

item.ares_dakota.desc=(Starrflügler) Als Frachttransporter sind sie ganz ordentlich, auch wenn sie sich in der Luft extrem langsam bewegen. Am Boden haben sie einen vernünftigen Leistungsüberschuss, der größere Zuladung und Starts auf kurzen Pisten erlaubt. Daher werden sie gern in entlegenen Gebieten eingesetzt, was auch der Grund für ihr klobiges Fahrwerk ist. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.ares_dakota_war.desc=(Starrflügler) Es gibt keinen Moment, in dem man sich mächtiger fühlt, als wenn man eine langsame Kurve über ein gegnerisches Flugfeld fliegt, während der Feindbeschuss von allen wichtigen Teilen des eigenen Flugzeugs abprallt und man dann die Seitentür einer modifizierten Dakota öffnet und die Hölle herabregnen lässt. Ihr panzert die Triebwerke, die Steuerflächen und das Cockpit, ebenso die Kabelkanäle. Danach kann die Dakota War-Eagle (da das kein offiziell produziertes Modell ist, hat sie den Spitznamen von den Piloten bekommen) komplett zersiebt werden und trotzdem ganz normal weiterfliegen. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.ares_tr_cargo.desc=(Kippflügler) Mit dem klassischen Kipprotor-Design der TRs liegt ihr immer richtig. In jedem Sprawl in Nordamerika und in den meisten Gegenden Asiens sieht man diese Dinger jeden Tag am Himmel. Exec-Shuttles mit einer Mischung aus Wow-Effekt und Feuerkraft flitzen zwischen den Konzerntürmen umher. Personentransporter mit Angestellten aus dem mittleren Management und Arbeitern an Bord fliegen zu entlegenen Orten. Frachttransport-Modelle hieven ihre Ladung auf gewaltige Arkologien oder setzen sie hinter den schützenden Zäunen der Forschungslabore in den Z-Zonen ab. Angriffsversionen mit Markierungen von KonSec oder Nationalstaaten schwirren auf Übungseinsätzen oder als Nahbereichs-Luftunterstützung umher. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.ares_tr_atk.desc=(Kippflügler) Mit dem klassischen Kipprotor-Design der TRs liegt ihr immer richtig. In jedem Sprawl in Nordamerika und in den meisten Gegenden Asiens sieht man diese Dinger jeden Tag am Himmel. Exec-Shuttles mit einer Mischung aus Wow-Effekt und Feuerkraft flitzen zwischen den Konzerntürmen umher. Personentransporter mit Angestellten aus dem mittleren Management und Arbeitern an Bord fliegen zu entlegenen Orten. Frachttransport-Modelle hieven ihre Ladung auf gewaltige Arkologien oder setzen sie hinter den schützenden Zäunen der Forschungslabore in den Z-Zonen ab. Angriffsversionen mit Markierungen von KonSec oder Nationalstaaten schwirren auf Übungseinsätzen oder als Nahbereichs-Luftunterstützung umher.

item.ares_tr_transport.desc=(Kippflügler) Mit dem klassischen Kipprotor-Design der TRs liegt ihr immer richtig. In jedem Sprawl in Nordamerika und in den meisten Gegenden Asiens sieht man diese Dinger jeden Tag am Himmel. Exec-Shuttles mit einer Mischung aus Wow-Effekt und Feuerkraft flitzen zwischen den Konzerntürmen umher. Personentransporter mit Angestellten aus dem mittleren Management und Arbeitern an Bord fliegen zu entlegenen Orten. Frachttransport-Modelle hieven ihre Ladung auf gewaltige Arkologien oder setzen sie hinter den schützenden Zäunen der Forschungslabore in den Z-Zonen ab. Angriffsversionen mit Markierungen von KonSec oder Nationalstaaten schwirren auf Übungseinsätzen oder als Nahbereichs-Luftunterstützung umher. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.aztech_aguilar.desc=(Kampfhubschrauber) In diesem riesigen Angriffshubschrauber hatte ich sowohl Geschwindigkeit als auch Feuerkraftum ein Gebiet in Grund und Boden bomben können, aber nötig war es nie. Oft reichte schon unsere Silhouette, um die Gegenwehr zu zerschlagen.

item.aztech_aguilar_3at.desc=(Kampfhubschrauber) In diesem riesigen Angriffshubschrauber musste ein Teil der Feuerkraft Panzerung oder ein paar Soldaten weichen. Mit den Waffen, die wir dabeihatten, hätte ich noch immer ein Gebiet in Grund und Boden bomben können, um meine lebende Fracht abzusetzen, aber nötig war es nie.

item.casa_raven.desc=(Motorsegler) Anfangs fühlte ich mich beleidigt, dass ich im Grunde einen zweimotorigen Motorsegler fliegen sollte. Danach allerdings habe ich mich nie wieder in einen Jet gesetzt. Als Kampfflugzeug boten sich mit der Raven mehrere starke Varianten. Ich konnte in großer Entfernung Höhe aufbauen, dann die Triebwerke abstellen, ins Angriffsgebiet gleiten, das Ziel in einem steilen Sturzflug attackieren, dann die Motoren starten und mich vom Acker machen – und alles bis auf das Geballere, die Explosionen und die Triebwerke beim Abhauen ohne ein einziges Geräusch. Ich konnte die Deckung durch das Terrain ausnutzen und mich im tiefen Gleitflug annähern, ohne dass irgendwer mich kommen hörte – und wenn irgendwann Gegenfeuer als Reaktion kam, war ich schon auf dem Rückweg, immer noch im Konturenflug.

item.casa_heron.desc=(Motorsegler) Casa Heron ist die zivile Version des militärischen Motorseglers Casa Raven.

item.cessna_airrider.desc=(Segelflugzeug) Sie ist ein schöner Einsitzer, mit dem ein guter Pilot theoretisch unendlich lange auf der Thermik dahingleiten kann. Die AirRider hat keinerlei Wärmesignatur und taucht mit den standardmäßig verbauten Materialien auch auf dem Radar kaum auf.

item.cessna_airrider_xl.desc=(Segelflugzeug) Gebaut für Trolle (die deutlich mehr Masse mitbringen als ihr kleineren Mitbürger), verfügt sie über das Doppelte an Flügelfläche (ergibt sich aus größerer Spannweite und Flügeltiefe) und im Innenraum über viermal so viel Platz.

item.docwagon_crt.desc=(VTOL) Da er ursprünglich entworfen wurde, um mehrere Patienten gleichzeitig aufzunehmen und Raum für mehrere Sanitäter zu bieten, ist er keine beengte Sardinenbüchse ohne ausreichend Platz zum Arbeiten. D-Wag setzt sie überall auf der Welt ein, und der interne Kampf gegen den Osprey II ist eröffnet. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.docwagon_osprey.desc=(VTOL) Der DW Osprey II verfügt über all die großartigen Innovationen seines Basismodells und Namensgebers, hat jedoch mehr als zehn Jahre der Individualisierung und Innovation für Schnelleingreif- und Bergungseinheiten hinter sich. Integrierte Valkyrie-Pods, mehrstufige medizinische Stationen und integrierte Lagermöglichkeiten ermöglichen maximale Effizienz ab Werk, ohne irgendwelche Zusatzteile draufklatschen zu müssen. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.euro_tiger.desc=(Kampfhubschrauber) Ich mag den Tiger, weil ich überall auf der Welt auf einen beliebigen Flugzeugschrottplatz gehen kann und dort die Teile finde, die ich für die meisten Reparaturen brauche. Er ist außerdem noch immer ein schlagkräftiger Kampfhubschrauber, wenn er gegen Bodentruppen oder einige der Helikopter mit Mischprofil wie den Wasp oder den Yellowjacket eingesetzt wird.

item.boeing_catalina.desc=(Flugboot) Ich bin ein großer Fan der Freiheit, an Orten zu landen, an denen es gar kein Land gibt. Mir gefallen Landebahnen, die 73 Prozent der Erdoberfläche bedecken. Das ist der erste Grund. Und ich liebe Geschichte, insbesondere die Geschichte der Luftfahrt. Zu einem der Flugzeuge rüberzulaufen, die ich aus den Annalen der Luftfahrt kenne, und zu wissen, dass ich einsteigen und mit ihr eine Runde drehen würde – dieser Ritt in einer Zeitmaschine ist der zweite Grund. Geschichte ist gut und schön, aber eins dieser alten mechanischen Monster tatsächlich zu fliegen war schwer, und damit ist der dritte Grund, dass sich hinter den historisch korrekten Panels und Instrumenten der Catalina II moderne Avionik verbirgt. In der Luft ist sie ein Traum. Durch ihre große Flügelfläche hat sie eine gute Gleitzahl, was wiederum bedeutet, dass sie auch mit minimalem Schub fliegen kann. In der Praxis bedeutet das, die Zielhöhe zu erreichen und dann einen Motor abzuschalten, um den Treibstoffverbrauch zu minimieren und ihre Reichweite damit nahezu zu verdoppeln. Ich habe ihr volles Potenzial noch nie ausgeschöpft, aber selbst bei kürzeren Flügen weiß ich die Kostenersparnis zu schätzen.

item.fokker_cloud9.desc=(Amphibienflugzeug) Freiheit. Darum fliegen wir. Nicht nur die Freiheit des Himmels, wo wir an einem Ort, der nicht für die Menschheit bestimmt ist, mit den Vögeln fliegen, sondern auch die Freiheit, zu gehen, wohin wir wollen, wann wir es wollen und wie wir wollen. Die Cloud Nine kann überall landen, und das bedeutete, dass ich auch abgelegene Gebiete erkunden konnte, solange es irgendwo ein kleines Gewässer zum Landen gab. Ich habe die Welt mit der Cloud Nine und mit Mærsk-Frachtern bereist, und Ersteres würde ich nicht gegen alles Gold in Fort Knox tauschen.

item.gmc_gryphon.desc=(T-Bird) Diese Teile sind echte trideogamewürdige Kampfpanzer. Ich dachte ernsthaft, dass die Anzeigen mich verarschen, als ich die Munitionsanzeige der Waffensysteme sah. Natürlich wurde ich entdeckt, und als der andere Gryphon mich angriff, war Krieg! Weil wir hier von MCT sprechen und ich für etwas unspezifische Rache immer zu haben bin (danke, Kane), verpasste ich ihren Citymastern die Nullzonen-Therapie, als wären sie aus Pappmaché, während ich tänzelnd dem anderen Gryphon auswich. Sobald nur noch sie und ich übrig waren (das Callsign der anderen Pilotin war Siren, also ein echtes Girls-Match), machte ich es so wie sie. Es war klobig, aber geschmeidig. Ganz ehrlich, ich war unterlegen. Meine Gegnerin war vermutlich hineingesprungen, aber ich hatte meinen Spaß und wurde immerhin nicht abgeschossen, und ich konnte sogar ein paar liebevolle Klapse durchbringen. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.goodyear_commuter.desc=(Luftschiff) Ich weiß, ich weiß. Langweilig. Aber lasst mich ausreden. Er ist supereffizient. Er ist alltäglich. Man sieht ihn regelmäßig sowohl in Stadtgebieten als auch auf dem Land. Er ist nicht besonders teuer. Klar, er wird keine Rennen gewinnen oder irgendwelche verrückten Kunstflugstunts hinlegen, aber wenn ihr ein Transportmittel von A nach B braucht, dann verdient dieser mittelgroße Zeppelin einen Platz in eurem Hangar. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.gti_benevolent.desc=Alias CrashCart Raphael (Gravantrieb) Was diesen topmodernen neuen VTOL angeht: Er funktioniert mit GravDrive-Technologie und wurde speziell für CrashCart gebaut, um den Konzern auf dem Rettungsfahrzeug-Markt an DocWagon vorbeiziehen zu lassen. In dieser Klasse gibt es da draußen nichts, was mit dem Handling und der Geschwindigkeit dieses neuen Wunderwerks mithalten kann. Und bei Anflug und Landung entfällt der übliche Abwind – es setzt mit der Maximalgeschwindigkeit auf dem Erdboden auf, die seine Passagiere verkraften. Es sind bereits verbesserte Modelle in Arbeit, bei denen ein Teil der Gravitationskontrolltechnik auch innerhalb des Fahrzeugs zum Einsatz kommt. Sie sind noch nicht fertig, aber das wäre das Sahnehäubchen auf der Soytorte. Der Raphael ist die Krankenwagen-Variante. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.gti_malevolent.desc=Alias CrashCart Azrael (Gravantrieb) Was diesen topmodernen neuen VTOL angeht: Er funktioniert mit GravDrive-Technologie und wurde speziell für CrashCart gebaut, um den Konzern auf dem Rettungsfahrzeug-Markt an DocWagon vorbeiziehen zu lassen. In dieser Klasse gibt es da draußen nichts, was mit dem Handling und der Geschwindigkeit dieses neuen Wunderwerks mithalten kann. Und bei Anflug und Landung entfällt der übliche Abwind – es setzt mit der Maximalgeschwindigkeit auf dem Erdboden auf, die seine Passagiere verkraften. Es sind bereits verbesserte Modelle in Arbeit, bei denen ein Teil der Gravitationskontrolltechnik auch innerhalb des Fahrzeugs zum Einsatz kommt. Sie sind noch nicht fertig, aber das wäre das Sahnehäubchen auf der Soytorte. Azrael ist das HTR-Unterstützungsmodell. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.gti_devotee.desc=Alias Skycarrier (Gravantrieb) Der echte Preis des Devotee ist 2,3 Milliarden, außerhalb der Möglichkeiten von Genesis. Der Devotee basiert auf derselben Gravitationstech wie die anderen GTI-Fahrzeuge, wurde aber parallel zum Devout als Träger für diese Modelle und als Unterbringung für Piloten und Unterstützungspersonal konzipiert. Das zentrale Wohnquartier ist nichts Besonderes, bietet aber alles, was eine komplette Crew zum Leben braucht, darunter die 32 Piloten der 32 Devouts, die dieses Ding transportieren kann, und eine 18-köpfige Unterstützungsmannschaft.

item.gti_devout.desc=(Gravantrieb) Das Konzept hinter dieser nächsten Generation (na ja, vielleicht ist „neue Ära“ der bessere Begriff) von Kampfflugzeugen ist interessant und schlägt einen anderen Weg ein als die Prinzipien hinter früheren Jets, die für Dogfights und mit einem Blick auf Schub entworfen wurden. Der Devout besteht aus einer zentralen Kapsel und einem Außenring, und anstatt nur über vorwärts gerichtete Waffensysteme zu verfügen, ist der Ring auf den ganzen 360 Grad bewaffnet. In einem Dogfight gibt es keinen Winkel, aus dem man sich gefahrlos annähern kann, keine Einschränkungen für die Feuerrichtung bei einem Vorbeiflug, und das alles bei einem Flugsystem, das nicht auf traditionellen Auftrieb angewiesen ist. Man kann ihn nicht mal im Sturzflug sicher attackieren, weil er sich einfach drehen kann, zu einem fliegenden Rad wird und vertikal feuern kann, ohne dabei Höhe zu verlieren.

item.gti_evocative.desc=(Gravantrieb) Etwas, das die Fantasie beflügelt.Der erste Blick auf dieses Luftfahrzeug einer neuen Ära raubte mir den Atem. Das kunstvolle Ensemble aus harten Kanten und abgerundeten Akzenten erinnerte mich an die Zeichnungen eines begabten Kindes, das alles rund um die Luftfahrt liebt, dessen Gespür für Kunst jedoch noch nicht durch die Notwendigkeiten der Aerodynamik beschnitten ist. Und dann sah ich es. Es schwebte. Es stand nicht auf Rädern, Füßen oder Kufen, sondern schwebte einfach ein paar Zentimeter über dem Boden. Kein Abwind, der den drum herum gelegten dunkelvioletten Teppich oder die strahlend weißen Tischdecken, die im Raum drapiert waren, wegwehte.  Im Inneren fand sich ein Raum, wie man ihn in einem Vergnügungsanwesen eines Milliardärs erwarten würde, mit Plüschsesseln, die sich schon im Moment des Hinsetzens an die Biometrik der Sitzenden anpassten. Auch die Tische stellten sich individuell auf den Nutzer ein und fuhren in perfekt verborgene Fächer zurück, wenn sie nicht gebraucht wurden, was den Raum noch offener wirken ließ. Echte Holzvertäfelung, verziert mit Diamantintarsien und eingefasst in Platin. Wo immer sie bei der Herstellung Geld in die Hand nehmen konnten, hatten sie es auch getan. Ich war beeindruckt. Und dann hoben wir ab. Ich bemerkte es kaum. Eine subtile Verschiebung, und schon beschleunigten wir flüssig aus dem Hangar hinaus. Eine zweite, und wir stiegen. Und das alles, während der Großteil der Gäste stand. Es war nicht ruppiger als an einem windstillen Tag auf einem großen Kreuzfahrtschiff. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.gti_revolution.desc=(Gravantrieb) Stellt euch einen T-Bird ohne die donnernden Turbinen vor. Alles, was ihr hört, bevor er an euch vorbeifegt, ist ein tiefes Summen. Das ist der Revolution. Der Revolution ist ungefähr so groß wie der etwas standardmäßigere Banshee. Der Unterschied ist, dass er keine riesigen Triebwerke mehr braucht, die die absurde Menge an Schub generieren, die normale T-Birds zum Fliegen brauchen. Auch die klobige Elektronik des Fly-by-Wire-Systems ist nicht mehr erforderlich. Der so frei gewordene Platz wird für erhöhte Frachtkapazität und zusätzliche Systeme für Angriff und Verteidigung genutzt. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.huges_clydesdale.desc=(Frachthubschrauber) Der Rumpf hat sich stilistisch teils am Stallion orientiert, aber an den entsprechenden Stellen am Rahmen etwas zugelegt, um sechs Rotoren in einem Sanduhrmuster unterzubringen. Der sichtbare „Rumpf“ ist modular. Die meisten Clydesdales lassen ihn beim Heben schwerer Fracht weg und nutzen ihn nur zum Transport lebender Güter und ihrer Werkzeuge.  Das Rumpfmodul ist direkt mit dem Cockpit verbunden, und ich lasse die Tür immer auf. Normalerweise hole ich sogar einige Typen nach vorn, denn das Cockpit ist für vier Mann ausgelegt, falls man auf dem Land unterwegs ist und Sitzplätze für den Decker, den Frachtrigger und den Baustellenleiter braucht. In der Stadt hocken die anderswo in irgendeinem Büro, aber draußen in der Wildnis hängen sie meist lieber im Heli ab. \n Alternative Konfiguration mit 4 Sitzen verfügbar.

item.lear_platinum.desc=(Starrflügler) Ich liebe diesen Klassiker. Auch wenn mein Exemplar weniger ein Klassiker als eine Hommage an das Original in „Schläfer-Form“ ist. Ich würde ja gerne sagen, dass ich etwas Besonderes bin, aber so gut wie jeder, der noch eine P1 im Hangar stehen hat, hat einen Umbau auf diese Spezifikation vorgenommen. Die größten Unterschiede liegen in den schicken Paintjobs auf dem nadelspitz zulaufenden Rumpf dieser Vögel. Sie bringen nicht alle Features und Upgrades der neuesten Muster mit, aber ich befördere meine Passagiere dennoch in gut geschütztem Luxus.

item.lear_platinum_x.desc=(Starrflügler) Mit dem klassischen Namen und einem generell ähnlichen Aufbau trägt die Platinum X ihr ehrwürdiges Erbe unverkennbar und würdig weiter. Ich bin kein Rennpilot oder Runner, aber ich genieße das Privileg, regelmäßig eine Platinum X fliegen zu dürfen. Modernste Avionik, Abwehrmaßnahmen der nächsten Generation, erstklassiger Luxus und eine ganze Reihe weiterer Top-Annehmlichkeiten.

item.lear_rover.desc=(Propellerflugzeug)  Wir alle lieben diese kleinen Flugzeuge. Wir sind mit dieser Liebe aufgewachsen, und man findet die Rover wirklich überall. Wenn ihr euch mal etwas Nostalgie geben wollt, könnt ihr sie sogar an zahlreichen kleinen Flugplätzen chartern.

item.zeppelin_2079.desc=(Luftschiff) Der Zeppelin 2079 war ein Redesign des altehrwürdigen 2049ers – dreißig Jahre, nachdem der letzte seiner Vorgänger die Werft verlassen hatte. Sofort gingen erste Bestellungen von Wuxing und Mærsk ein – teils, um Teile ihrer in die Jahre kommenden Flotte zu ersetzen, aber hauptsächlich in Vorbereitung auf einen bevorstehenden Krieg im langsamen Luftfrachttransport gegen Evos Kunden und Tochtergesellschaften, die Evos Hightech-Ersatz für Luftschiffe im Zeppelinstil im Einsatz haben. Tatsächlich ist der 2079 in dieser Hinsicht eine große Verbesserung gegenüber dem 49er: Er verfügt über insgesamt 28 Luftkammern – vier zentrale, acht sekundäre und sechzehn äußere. Er kann bis zu zwanzig davon verlieren und trotzdem weiterfliegen. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.mk_sperber.desc=(Kampfhubschrauber) Der Sperber ist robust gebaut und leicht für eine Vielzahl von Einsatzzwecken zu bewaffnen, aber es waren die frühen, verpflichtenden Wartungsverträge, die dafür sorgten, dass diese Vögel ausreichend gut in Form blieben, um dem Zahn der Zeit zu trotzen. Mit der Zeit kamen viele andere Muster auf den Markt, aber der Sperber konnte sich als speziell für diesen Zweck konstruierter taktischer Hubschrauber immer behaupten. Er wurde nicht an den Kampf angepasst – er wurde für ihn gebaut.

item.moonlight_avenger.desc=(Starrflügler)  Leicht, schnell, manövrierfähig und in der Lage, überall zu starten und zu landen – diese Vögel im Arsenal zu haben war ein Traum, selbst wenn sie nicht die hübschesten oder schnellsten Flieger waren. Sie wurden mit so wenig Metall und radarreflektierendem Material wie möglich gebaut, das Motordesign sorgte dafür, dass die Hitze nur an den Flanken sichtbar war, und mit einem fähigen Piloten am Steuerknüppel waren die meisten Zielaufschaltungen rasch abgeschüttelt.

item.northrup_hornet.desc=(Kampfhubschrauber) Der Hornet ist der garstige große Bruder des Wasp und des Yellowjacket. Dieses Monstrum ist ein ausgewachsener Kampfhubschrauber und nicht nur ein Verfolgungsheli oder ein Möchtegern-Angriffshubschrauber. Sein ästhetisches Designkonzept ähnelt dem der anderen Northrup-Muster, aber dennoch ist der Hornet unverwechselbar. Er ist massiv und waffenstarrend. Die „Feuerluken“ sind ein Wunderwerk der fokussierten Feuerkraft, und das jüngste Upgrade, das eine ausfahrbare Feuerplattform auf einem runden Drehgelenk mitbringt, ist ein wahres Geniestück der Techniker und ein echter Albtraum für alle, die geglaubt haben, dass sie ihren Arsch retten können, indem sie sich unter diesen Kampfheli bewegen, um dort außerhalb seines Feuerbereichs zu sein. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.northrup_yellowjacket.desc=(Angriffshubschrauber) Die lokalen Gesetzeshüter und das Sicherheits-Fußvolk dürfen ihre kleinen Wasps gern behalten, aber ich würde mich immer für den bulligen Yellowjacket entscheiden. Beide Muster mögen auf dem gleichen Basischassis aufbauen, aber das Miltech-Designteam hat wirklich alle Register gezogen, um aus diesem Heli eine gute militärische Option für leichte Angriffseinsätze zu machen. Er kann mal einen Treffer einstecken, anders als die Wasps, bei denen ich schon erlebt habe, wie sie von Gangern mit Automatikpistolen vom Himmel geholt wurden.

item.omnistar_valkyrie2_1.desc=(Kippflügler) Es handelt sich um einen Kippflügler, der jedoch eine Kombination aus verzahnten Mantelstromtriebwerken und Propellerturbinen an den Flügeln sowie für die Schuberzeugung zwei Propellerturbinen am Heck einsetzt. Die Propeller werden zur Landung auf weichem Untergrund eingesetzt, während die Strahltriebwerke einen effizienteren schnellen Anflug dort ermöglichen, wo keine Sachschäden durch heiße Abwinde zu befürchten sind. Der Vorwärtsschub wird durch die Heckturbinen erzeugt, und vernünftig konfiguriert kann dieser Vogel richtig abgehen.  Der Mk. 1 setzt auf Wendigkeit und Geschwindigkeit und begnügt sich daher mit leichter Bewaffnung und Panzerung. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.omnistar_valkyrie2_2.desc=(Kippflügler) Es handelt sich um einen Kippflügler, der jedoch eine Kombination aus verzahnten Mantelstromtriebwerken und Propellerturbinen an den Flügeln sowie für die Schuberzeugung zwei Propellerturbinen am Heck einsetzt. Die Propeller werden zur Landung auf weichem Untergrund eingesetzt, während die Strahltriebwerke einen effizienteren schnellen Anflug dort ermöglichen, wo keine Sachschäden durch heiße Abwinde zu befürchten sind. Der Vorwärtsschub wird durch die Heckturbinen erzeugt, und vernünftig konfiguriert kann dieser Vogel richtig abgehen.  Der Mk. 2 ist langsam und träge, verfügt aber über genug Feuerkraft und Panzerung, um eigenhändig einen ganzen Infanteriezug auszuschalten.  Und wenn man dann noch die Unterpanzerung aus Titan dazunimmt, versteht man, wieso sie noch nie einen davon verloren haben. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.omnistar_valkyrie4.desc=(Kippflügler) Es handelt sich um einen Kippflügler, der jedoch eine Kombination aus verzahnten Mantelstromtriebwerken und Propellerturbinen an den Flügeln sowie für die Schuberzeugung zwei Propellerturbinen am Heck einsetzt. Die Propeller werden zur Landung auf weichem Untergrund eingesetzt, während die Strahltriebwerke einen effizienteren schnellen Anflug dort ermöglichen, wo keine Sachschäden durch heiße Abwinde zu befürchten sind. Der Vorwärtsschub wird durch die Heckturbinen erzeugt, und vernünftig konfiguriert kann dieser Vogel richtig abgehen. Wir stopfen den IV mit so viel schwerer Ausrüstung wie möglich voll. Die seltenste Variante für Platin-Einsätze verfügt über vier einzelne Valkyrie-Module im Inneren, falls es mal zu einem der seltenen Vorfälle kommt, bei dem mehrere Execs in Gefahr sind. \n Alternative Konfiguration mit 2 Sitzen verfügbar.

item.renegade_mothership.desc=(Luftschiff) Es handelt sich hier nicht um ein normales Luftfahrzeug, sondern um einen Reisebegleiter in Luftschiffform. Es ist wie ein Frachttransporter, der auf eine ganz spezielle Art von Fracht zugeschnitten ist: T-Birds. Aber ich habe gute Neuigkeiten für alle von euch, die keine T-Bird-Besitzer sind: Wir hier bei Renegade Works haben Transportsysteme mit vielfältigen Anpassungsmöglichkeiten entwickelt, sodass ihr das Mothership so konfigurieren könnt, dass es nicht nur eurem sprithungrigen T-Bird dabei hilft, lange Strecken zurückzulegen, ohne das Budget zu sprengen, sondern dass ihr auch euer Segelflugzeug, eure Cessna oder sogar euren Jet dranhängen und aus einer sicheren Höhe starten könnt. Oder ladet euren Transporttruck, euren Wohnwagen oder eure mobile Kommandozentrale ein und setzt sie weit jenseits aller Straßen wieder ab. Das Mothership mag seine Karriere als Nischen-Transporter begonnen haben, aber mittlerweile ist es die ultimative Lieferausrüstung für alle Lebenslagen und Fuhrparks!

item.sukhoi_fixer.desc=(Kampfjet)  Der Fixer ist oldschool und war ein ebenbürtiger Rivale des ehrwürdigen Eurofighters. Er bringt Geschwindigkeit, Manövrierfähigkeit, ein ernst zu nehmendes Waffenarsenal und vernünftige ECM-Systeme mit, und all das sorgt dafür, dass er selbst ein halbes Jahrhundert, nachdem die ersten Exemplare im Herzen Russlands vom Band gerollt sind, noch im Rennen ist.

item.kanyuk_interceptor.desc=(Kampfjet) Als das hier noch der YNT Kanyuk war, stand Evo hinter diesem Kampfjet der achten Generation und Konkurrenten zu Dassaults Zeta Bravo.  Die Drohnenproduktion war präzise bis auf den Mikrometer, und das spürt man, wenn man praktisch ohne Rütteln Mach 1 überschreitet.

item.dsec_i.desc=(Raumschiff) Der echte Preis des DESC ist 23 Milliarden, außerhalb der Möglichkeiten von Genesis.  Die Tech liegt jenseits des Verständnisses der meisten heutigen Ingenieure, also wäre es sinnlos, auf die genauen Details einzugehen – aber sie bewegt sich wie Seide und kann auch Treffer durch verirrte Weltraumobjekte mit einem Lächeln wegstecken. Sie ist keine Weltraumtänzerin, aber sie ist in der Lage, die Metamenschheit hinaus zu den Sternen zu tragen und Erkundung und Kolonisierung zu ermöglichen. In Wahrheit erwähne ich das hier, um euch einen Blick in die Zukunft zu gewähren. Die DSEC ist kein kleines Schiff. Vom Antrieb bis zum Trümmerschild maß sie am Ende 318 Meter und bestand aus fünf Haupt-Wohnringen und vier kleineren Laborringen. Bei ihrem Start waren zwischen diesen Ringen zusätzlich acht kleinere Raumschiffe angedockt.



item.aztech_gcr.desc=(Mini-Raddrohne) Die GCR-68A ist das Nachfolgermodell der GCR-65-Serie: eine preisgünstige Aufklärungsdrohne für den Einsatz mit Militär- oder Sicherheitseinheiten. Sie hat einen für eine Drohne starken Elektromotor, und ihre Größe und die Mikro-Smartreifen sorgen dafür, dass sie mit fast jedem Gelände leicht fertig wird und dabei mit der Infanterie mithalten kann. Außerdem bietet die Außenhülle der GCR-68A eine programmierbare Tarnung, was ihr einen leichten Vorteil bei Geheimoperationen verschafft.

item.roller_bomb.desc=(Mini-Kugeldrohne) Wie der Name schon andeutet, sind diese kleinen Einwegdrohnen im Prinzip ferngesteuerte Granaten. Man setzt sie in eine bestimmte Richtung in Bewegung oder befiehlt ihnen den Angriff auf ein bestimmtes Ziel und lässt sie dann detonieren. Die Roller-Bomb hat ungefähr die Größe eines Baseballs und gerade so viel Rechenleistung und Sensorausstattung, dass sie ihre Aufgabe erfüllen kann – sonst nichts. Man kann Manövrier-Autosofts benutzen, um die Erfolgsaussichten zu verbessern, aber die Autosofts kosten fast so viel wie die Drohnen selbst – wenn nicht mehr. Um die Fortbewegung zu verbessern, ist die Roller-Bomb komplett von einem weichen Neo-Gummi-Gehäuse umgeben, das an den meisten Oberflächen eine gute Haftung ermöglicht. Jede Roller-Bomb kann mit denselben Wirkungen wie jede Granate ausgestattet werden, die im Moment auf dem Markt ist. \n Schaden/Werte je nach verwendeter Granate. Diese Drohne kann keinerlei Modifikationen aufnehmen.

item.tunnel_rat.desc=(Kleine Raddrohne) Wie es sich für eine Drohne mit diesem Name gehört, wird die Tunnel Rat oft in Umgebungen eingesetzt, die sehr beengt oder unwegsam sind. Dabei kommen ihr ihr vielgelenkiger Aufbau und ihre verschiedenen Fortbewegungsmöglichkeiten zugute. Um ein zentrales Gyrogelenk herum kann sich der Rahmen der Tunnel Rat auf mehrere Arten verbiegen (und dabei seine Länge knapp halbieren) oder sich verlängern (wodurch sich seine Breite um bis zu 75 Prozent verringert). Die wichtigen Sensoren und Systeme liegen in einem kleinen Kopf vorne an der Drohne, der zwei unabhängige rotierende, einziehbare Mikro-Sensorschirmchen besitzt. Die Haupt-Kommunikationsantenne sitzt am Ende der Drohne und wird oft als Schwanz bezeichnet. Die Tunnel Rat kann zwar keine glatten Wände erklettern, besitzt aber ein Paar kleiner, einziehbarer Kletterarme neben den Vorderrädern, mit denen sie sich an den meisten Oberflächen nach oben bewegen kann, solange die Arme einen Halt finden. \n Die Arme verleihen der Drohne einen Würfelpoolbonus von +2 für Kletternproben. Die Antenne bewirkt, dass sämtliche Rauschenmodifikatoren und Störeffekte um 1 gesenkt werden. Die Drohne kann keine zusätzliche Panzerung erhalten.

item.tunnel_rat.variant.tamodachi.desc= Cyberspace Designs produziert auch eine vereinfachte Version namens Tamodachi für den Massenmarkt. Diese Version hat weniger fortschrittliche Sensoren, ist aber ansonsten mit der Tunnel Rat identisch. \n Die Arme verleihen der Drohne einen Würfelpoolbonus von +2 für Kletternproben. Die Antenne bewirkt, dass sämtliche Rauschenmodifikatoren und Störeffekte um 1 gesenkt werden. Die Drohne kann keine zusätzliche Panzerung erhalten.

item.evo_proletarian.desc=(Kleine Raddrohne) Wie das erste Modell hat sie ein einfaches, dreirädriges, kugelförmiges Design mit einem Arm. Allerdings bietet dieses Modell verbesserte Reparatursoftware und Systeme, die eine deutlich höhere Leistung als beim Vorgängermodell erlauben. Besonders auffällig ist das verstärkte und verbreiterte Fahrwerk der Proletarian III. Es ermöglicht zusammen mit der erhöhten Stärke von Hand und Arm der Drohne schwierigere Reparaturaufgaben und das Heben von schwereren Lasten und Ausrüstungsteilen.
item.maser_beach_ball.desc=(Kleine Kugeldrohne) Die „Beach Ball“ ist eine kugelförmige Kameradrohne, die für die Zusammenarbeit mit schnellen taktischen Einsatzteams in dynamischen Kampfsituationen gedacht ist. Wenn sie nicht im Einsatz ist, hat sie ungefähr die Größe eines übergroßen Softballs. Bei Gebrauch dehnen sich die Paneele des Balls aus, und zwischen ihnen liegende Blasen füllen sich mit Stickstoff. Dadurch verdoppelt sich die Größe der Drohne, und sie kann gut abspringen und wenn nötig auch schwimmen. Ein internes Gyro-Kontrollsystem sorgt für eine gewisse Beweglichkeit und den Vortrieb.  Eine typische Einsatzform für den Ball ist, dass der Nutzer ihn an einen Ort wirft, wo er wichtige Daten überträgt, kurz bevor ein Team mit dem Zugriff beginnt. Jedes der Paneele des Balls enthält Sensorrelais und Bilderfassungssysteme, die dreidimensionale 360-Grad-Aufzeichnungen ermöglichen.
item.vulcan_utility_one.desc=(Kleine Spezialdrohne) Die U1 hat ungefähr die Größe einer gewöhnlichen Werkzeugkiste, enthält Werkzeug und andere kleine Ausrüstungsteile und kann je nach Bedarf am Gürtel, an der Schulter oder am Oberschenkel getragen werden. Die Drohne kann ein bestimmtes Werkzeug oder Ausrüstungsteil auf ein mentales oder Stimmkommando hin anreichen oder verstauen. Sie sieht aus wie eine kleine quaderförmige Box mit ein paar Werkzeugtaschen daran und besitzt vier einziehbare Beine mit kleinen Klauen und Geckogriff-Pads zur Fortbewegung. \n Integrierte Cyberarme haben Stärke 2.
item.ares_regulator.desc=(Mittlere Kettendrohne)  Die Regulator hat ein ziemlich einfaches, schnörkelloses Design und ist eine preisgünstige Kettendrohne mit ausreichender (wenn auch nicht spektakulärer) Leistung und einem Waffenturm. Durch leicht verfügbare Teile und Komponenten ist die Regulator einfach zu warten und zu modifizieren. \n Die Schwellenwerte aller Reparieren-Proben werden um 1 gesenkt.
item.ares_responder.desc=(Mittlere Raddrohne)  Das Kernkonzept hinter der Drohne ist die Verbindung eines verkleinerten Valkyrie-Moduls mit einer motorisierten Krankentrage, die mit allen gegenwärtig im Einsatz befindlichen Rettungsfahrzeugen kompatibel ist. Mit ihren Smartreifen für jedes Gelände und dem starken Elektromotor kann die First Responder in fast jedem Gelände operieren. Sie hat außerdem einige Befestigungspunkte für spezielle Rettungsausrüstung (zum Beispiel für eine kleine Seilwinde und für Feinmotorik-Arme für den Einsatz von Werkzeug und Instrumenten). Die obere Hälfte der Drohne kann auseinandergezogen werden, um Patienten jeder Größe aufzunehmen. \n  Die medizinische Ausrüstung an Bord entspricht einem Medkit der Stufe 6 mit drei verbleibenden Anwendungen. Die Panzerung gilt auch für den Patienten an Bord, wenn die Panzerungshülle benutzt wird, und wirkt kumulativ mit seiner Panzerung. Die Tastsensoren gewähren einen Würfelpoolbonus von +2 auf Biotech-Proben für Erste Hilfe, wenn die AR/VR-Steuerung benutzt wird.
item.ares_gunslinger.desc=(Mittlere Raddrohne) Die GS-01 ist ein Dreirad mit zwei kleineren Vorderrädern und einem größeren Hinterrad, das für den Großteil der Antriebsleistung verantwortlich ist. Das Wichtigste an der Drohne sind die beiden Waffentürme – einer befindet sich über und leicht hinter den Vorderrädern, der andere ist erhöht direkt über dem Fahrwerksschacht des Hinterrads montiert. Beide Türme haben einen Höhenrichtbereich von +45 Grad, allerdings bietet der vordere Turm nur einen Seitenrichtbereich von 270 Grad. Er kann Waffen bis zur Größe einer Schrotflinte aufnehmen. Der hintere Turm bietet die vollen 360 Grad Seitenrichtbereich und kann Waffen bis zur Größe eines leichten Maschinengewehrs tragen.
item.esprit_foxhound.desc=(Mittlere Kettendrohne) Version mit Waffenhalterung. Die Foxhound hat die stärksten Sensoren, die beste Audio- und Videoerfassung und die besten Kommunikations- und Verschlüsselungssysteme aller im Moment hergestellten Drohnen. Ihre Hauptaufgabe ist die vorgeschobene Aufklärung bei Militäreinsätzen, wobei sie ihre Sensoren benutzt, um Feindeinheiten zu lokalisieren und die Daten schnell (und sicher) an Kommandostellen zu übertragen. Der Rumpf hat ein eckiges, aber effizientes Design und wird von vier unabhängigen dreieckigen Laufketten getragen. Diese Ketten können an ihren Achsen unabhängig rotieren, sodass die Foxhound die meisten Geländearten mit beachtlicher Geschwindigkeit überwinden kann. Die Hauptsensoren und die Aufnahmegeräte sind an einem vielgliedrigen Arm angebracht, der bis zu zwei Meter weit ausgefahren werden und sich um natürliche oder künstliche Hindernisse biegen kann, die so als Deckung dienen. \n  Das Kommunikationssystem gilt als Störsender der Stufe 5 und gewährt einen Würfelpoolbonus von +2 auf alle Proben zur elektronischen Kriegsführung.
item.esprit_foxhound.variant.drones.desc=(Mittlere Kettendrohne) Version mit Drohnenracks. Die Foxhound hat die stärksten Sensoren, die beste Audio- und Videoerfassung und die besten Kommunikations- und Verschlüsselungssysteme aller im Moment hergestellten Drohnen. Ihre Hauptaufgabe ist die vorgeschobene Aufklärung bei Militäreinsätzen, wobei sie ihre Sensoren benutzt, um Feindeinheiten zu lokalisieren und die Daten schnell (und sicher) an Kommandostellen zu übertragen. Der Rumpf hat ein eckiges, aber effizientes Design und wird von vier unabhängigen dreieckigen Laufketten getragen. Diese Ketten können an ihren Achsen unabhängig rotieren, sodass die Foxhound die meisten Geländearten mit beachtlicher Geschwindigkeit überwinden kann. Die Hauptsensoren und die Aufnahmegeräte sind an einem vielgliedrigen Arm angebracht, der bis zu zwei Meter weit ausgefahren werden und sich um natürliche oder künstliche Hindernisse biegen kann, die so als Deckung dienen. \n  Das Kommunikationssystem gilt als Störsender der Stufe 5 und gewährt einen Würfelpoolbonus von +2 auf alle Proben zur elektronischen Kriegsführung.
item.esprit_bernard.desc=(Mittlere Kettendrohne) Die Zivilversion der Foxhound ist die St. Bernard. Sie kommt als Such- und Rettungseinheit zum Einsatz und hat dieselben grundlegenden Einsatzfähigkeiten wie die Foxhound. Statt der Waffenhalterung verfügt sie allerdings über ein abnehmbares Medkit und ein Notfall-Vorratspaket. Wenn die St. Bernard eine Person in Not lokalisiert, kann diese (ohne Hilfestellung durch die Drohne) die Notfallausrüstung benutzen, bis Hilfe kommt.
item.shiawase_vendx.desc=(Mittlere Ketten-/Spezialdrohne)  Einige Sicherheitsdrohnen sind eindeutig erkennbar, andere sollen sich unauffällig in die Umgebung einfügen. Shiawase machte aus dem zweiten Konzept etwas … Interessantes, weil die Vend-X nicht nur wie ein Verkaufsautomat aussieht, sondern auch tatsächlich einer ist. Nein, der letzte Satz ist kein Tippfehler oder Scherz. Die Verkaufskomponente der Vend-X macht sie insgesamt größer, aber die Drohne selbst gehört eigentlich zur mittleren Größenklasse. Ohne die Außenhülle ist sie eine mittlere Kettendrohne mit zylindrischem Rumpf und zwei Waffenturm-Armen. Ein kleiner kuppelförmiger Kopf auf einem ausfahrbaren Hals vervollständigt den Grundentwurf. Die Drohne kann sich aber nötigenfalls auch von der Hinterseite ihrer Verkaufskomponente abkoppeln. Und ja: Das ganze Ding kann auch fahren, wenn beide Komponenten gekoppelt sind. \n Spezialangriff: Inhalt auswerfen [Schaden Speziell, 10/7/–/–/–]; Schaden: Nach einem erfolgreichen Angriff erhält das Ziel (nach Maßgabe der Spielleitung) einen der folgenden Status: Brennend, Geblendet I, Humpelnd, Liegend oder Nass. Nach Maßgabe der Spielleitung kann die Drohne durch ihre Größe auch Deckung bis zum Status Deckung II gewähren.
item.garage_warthog.desc=(Mittlere Raddrohne)  Dieser Begriff steht für eine Raddrohne, die verstärkt und schwer gepanzert ist, einen leistungsstarken Motor hat und damit für den Zweck optimiert ist, andere ähnliche Fahrzeuge zu rammen. Aussehen, Karosserien, Fahrwerke und einige Leistungsdaten können sich leicht unterscheiden.  Der Hauptzweck eines Warzenschweins ist es, als Hochgeschwindigkeitsrammbock zu dienen. \n Würfelpoolbonus von +2 für alle Ramm-Angriffe und Schadenswiderstandsproben an der Vorderseite. Panzerung an der Vorderseit = 12.
item.vulcan_opossum_i.desc=(Mittlere Läuferdrohne) Die Opossum Mk. I ist eine mittlere (fast schon große) Drohne mit vier Beinen, die zwei kleine und zusätzlich entweder vier Mini- oder acht Mikrodrohnen tragen kann. Außerdem hat sie spezielle Fächer für Drohnen-Reparaturkits und eine kleinere Menge an Ersatzteilen. \n Abnehmbare Drohnenbatterien (jeweils eine pro eingesetzter Drohne), Ladestationen.
item.vulcan_opossum_ii.desc=(Kleine Läuferdrohne) Die Opossum Mk. II ist ebenfalls eine vierbeinige Drohne, gehört allerdings zur kleinen Größenklasse und kann nur die vier Mini- oder acht Mikrodrohnen tragen. Was die beiden neben ihrer Größe unterscheidet, ist die Fähigkeit der Mk. II, ihre Beine so umzukonfigurieren, dass sie an gewöhnlicher Kampfpanzerung befestigt oder als Rucksack getragen werden kann. \n Abnehmbare Drohnenbatterien (jeweils eine pro eingesetzter Drohne), Ladestationen.
item.ares_gunrunner.desc=(Grosse Kettendrohne) Ihre Geschwindigkeit, Mobilität und Panzerung sind vergleichbar mit anderen Drohnen dieser Klasse, und sie ist ebenso als Dreirad ausgelegt wie die GS-01, hat allerdings vorne schwere Ketten statt Rädern. Außerdem hat sie drei Waffentürme statt der zwei der GS-01. Der schwere Turm hinten bleibt unverändert, aber vorne rechts und links sind zwei sekundäre Türme direkt über den gepanzerten Kettengehäusen montiert. Der Primärturm kann alle schweren Waffen aufnehmen, die Sekundärtürme Waffen bis zur Größe eines Sturmgewehrs oder einer Schrotflinte. Jeder Turm hat einen Höhenrichtbereich von +80 Grad bis -20 Grad sowie einen Seitenrichtbereich von 360 Grad, was eine maximale Überlappung ermöglicht. Das integrierte Freund-Feind-Erkennungssystem verhindert, dass die GR-02 sich selbst oder eigene Truppen beschießt. Außerdem bietet der hintere Turm ein kleines ausklappbares Trittbrett und eine manuelle und AR-Steuerung für einen Schützen. Dadurch kann der Rigger die Kontrolle des Primärturms abgeben und sich auf andere Waffen konzentrieren. Zusätzliche Feuerkraft verspricht eine nach vorne gerichtete Waffenhalterung im Rumpf vor dem Primärturm und zwischen den Sekundärtürmen. Sie kann zwar schwere Feuerwaffen aufnehmen, aber häufiger sind Raketen- oder Granatwerfer.
item.ares_gunrunner.item.safe_targeting.desc=Das integrierte Freund-Feind-Erkennungssystem verhindert, dass die GR-02 sich selbst oder eigene Truppen beschießt.
item.bae_ajax.desc=(Grosse Vektorschubpanzer-Drohne) Von vielen wird die Ajax für die beste Kampfdrohne für den Fronteinsatz gehalten, die im Moment hergestellt wird. Sie ist die verkleinerte Drohnenversion eines Kampfpanzers. Die Ajax ist leicht an ihrer charakteristischen Gestalt in Form einer gespaltenen Pfeilspitze zu erkennen und wurde nach ihrer Markteinführung 2076 schnell zum Standardgerät bei europäischen und nahöstlichen Heeren und Söldnereinheiten. Durch ihre dicke Panzerhülle kann die Ajax sehr viel einstecken und bleibt von Leichtwaffenfeuer meistens unbeeindruckt. Wirklich eindrucksvoll aber ist ihre Bewaffnung. Die Hauptwaffe liegt im hinteren Teil der Drohne in einem speziellen (proprietären) geteilten Turm. Die obere Hälfte ist für kleine Waffen gedacht und kann alles bis zu einem leichten Maschinengewehr aufnehmen. Die untere ist für die schwere Hauptwaffe gedacht. Beide Teile können sich unabhängig voneinander bewegen, haben einen Seitenrichtbereich von 360 Grad und einen Höhenrichtbereich von +45 Grad. Die Standardbewaffnung wird von sechs Raketenabschussrohren vervollständigt, von denen vier nach vorne und zwei nach hinten gerichtet sind.
item.esprit_scorpion.desc=(Grosse Kettendrohne) Trotz des furchterregenden Namens handelt es sich hier eigentlich um eine Pionierdrohne, die aber auch für leichte Kampfeinsätze oder andere Unterstützungsleistungen  modifiziert  werden  kann.  Diese große Kettendrohne hat (wie der Name schon sagt) die Form eines Skorpions. Der große Kopf enthält viele Sensoren, Audio- und Videoaufnahmegeräte und sogar Chemsniffer. Das verschafft dem Benutzer ein breites Spektrum an Informationsquellen, mit denen er arbeiten kann. Die beiden Scherenhände können benutzt werden, um Objekte zu greifen und zu handhaben, aber sie enthalten auch einige optionale Werkzeuge (Sägen, Klingen, Schweißbrenner, Scheren, kleinere Zangengriffe, Sperrhaken usw.) oder Feinmotorik-Hände.  Jedes der sechs gepanzerten Beine endet in einer dreieckigen Kette, was für hohe Mobilität und Manövrierfähigkeit sorgt. Wie an den Scheren können auch am gepanzerten Schwanz des Iron Scorpion verschiedenste Werkzeuge montiert werden. Er ist außerdem in alle Richtungen beweglich, erreicht voll ausgefahren eine Länge von drei Metern und kann wie die Klauen bis zu 275 Kilogramm heben. \n Die Tastsensoren gewähren einen Würfelpoolbonus von +2 auf alle Mechanik-Proben.
item.essy_interceptor.desc=(Grosse Raddrohne) Auf den ersten Blick sieht die Interceptor aus wie eine Tourenmaschine, die für Trolle vergrößert wurde, genauer gesagt wie eine modernisierte Version der Harley-Davidson Electra Glide, aber mit einem aerodynamisch geformten Turm, der dort montiert ist, wo sonst der Fahrer sitzen würde. Die Interceptor hat ab Werk einen Turbomotor und Gyroskop-Stabilisierung, wodurch sie mit allen außer den schnellsten Bodenfahrzeugen mithalten und Kurven fahren kann, die fast alle metamenschlichen Fahrer aus dem Sattel werfen würden. Der Turm, der oben auf dem Rahmen montiert ist, hat zwei Waffenhalterungen für Waffen bis zur Größe eines Sturmgewehrs oder einer Schrotflinte.
item.vulcan_hollenfaust.desc=(Grosse Kettendrohne) Die Höllenfaust ist eine gemeinsame Entwicklung von Vulcan Systems und Krupp Munitions: eine gepanzerte Kampfmaschine für die Front. Sie ist eigens dafür gedacht, ins schwerste Kampfgetümmel zu rollen und Schaden zu verursachen. Sie ist um ihre Hauptbewaffnung herum gebaut: Die brandneue Kanone vom Typ Krupp KrE-25 ist eine Railgun, die 40-mm-Projektile verschießt und durch die kinetische Energie Schaden und Durchschlagskraft eines doppelt so großen Projektils erreicht. Die KrE-25 kann Ziele mit direktem und indirektem Feuer bekämpfen, ist extrem präzise und höchst effektiv gegen gepanzerte Ziele und Fahrzeuge. Das innere Layout der Drohne, das notwendig war, um Energieversorgung und Lademechanismus unterzubringen, beschränkt den Seitenrichtbereich der Waffe auf 270 Grad – sie kann nicht direkt nach hinten schießen.  Vier unabhängige Ketten erlauben der Höllenfaust, fast jedes schwere Gelände zu durchqueren und dabei die maximale Kampfgeschwindigkeit beizubehalten. \n Die Anti-Infanteriewaffen verwenden die Werte von Splittergranaten (SR6, S. 263). Der Schwellenwert aller Proben zum Austausch der Hauptwaffe ist um 3 erhöht.
item.evo_splatter.desc=(Mikro-Insektendrohne) Evos Splatter-Serie basiert auf einem einfachen, aber effektiven Ansatz: Eine billige Einwegdrohne bringt ihre Ladung zum Einsatz, indem sie ein Ziel rammt. Diese Drohnen sehen aus und funktionieren wie gewöhnliche Fluginsekten (aber ungefähr in Hornissengröße) und haben gerade genug Systeme, um genau das und buchstäblich nichts anderes zu schaffen. \n Kann keinem Schaden widerstehen; jeder Schaden führt automatisch zur Zerstörung. Schaden und Auswirkungen je nach Droge/Toxin. Diese Drohne kann keinerlei Modifikationen aufnehmen und mit keiner anderen Autosoft als Manövrieren ausgestattet werden.
item.aero_screamer.desc=(Mini-Ballondrohne) Die Screamer ist eine theoretisch mehrfach verwendbare Drohne, die meistens von Flugzeugbesatzungen als Unterstützung der eigenen ECM-Systeme benutzt wird. Beim Einsatz wird die Drohne ihrem Namen gerecht und nutzt ihre starken Störsysteme, um Kommunikations-, WiFi- und Radarsignale in einem Umkreis von bis zu 500 Metern zu stören (verliert aber alle 100 Meter ein wenig an Effektivität). Die Screamer besteht aus drei Hauptkomponenten: einem Mikroraketenmotor, der sie aus einem Rohr oder von einer Abschusseinrichtung startet, dem Störsender in der Mitte und einem Ballon, der sie nach dem Start in der Luft hält. \n Der Störsender bleibt 1 Stunde lang aktiv.
item.cyberspace_dragonfly.desc=(Mini-Rotordrohne) Die Dragonfly-Alpha ist etwas größer als die Vorgängerversion (fast schon eine kleine Drohne) und hat dasselbe Quadrokopter-Design mit derselben Rotorenanordnung. Der kleine Schnabel, mit dem die Vorgängerversion den Zieldrohnen Flügel oder wichtige Teile abscherte, ist noch vorhanden, wurde aber durch mehrere Reihen von Monofilament-Zähnen verstärkt, die den Schaden und die panzerbrechende Wirkung erhöhen. Außerdem hat die Dragonfly-Alpha ein Paar Lande-/Greifklauen, mit denen die Zieldrohne festgehalten werden kann, was Angriffe viel einfacher macht. Das wichtigste Upgrade ist das Ergebnis eines Deals mit Remington, der das Anbringen einer modifizierten Remington Roomsweeper für den Fernkampf ermöglichte.
item.cyberspace_halo.desc=(Kleine Kameradrohne) Die Halo ist eine fliegende Kamera- und Sensorplattform, die bei Nachrichtenagenturen und unabhängigen Reportern beliebt ist. Ihren Namen hat sie wahrscheinlich von ihrem runden Heberotor, der oben auf dem kugelförmigen Rumpf angebracht ist. Innerhalb des Rumpfs liegen viele hochmoderne Aufzeichnungssysteme für Ton und Bild und eine starke Sendeanlage, die mit den meisten niedrigen Rauschenniveaus fertig wird.  Die Halo hat außerdem vier ausfahrbare Beine mit Mikro-Greifklauen, mit denen sie sich an Oberflächen oder am Körper des Nutzers festhalten kann. \n Würfelpoolbonus von +1 auf alle Steuern-Proben mit VR-Steuerung. Sensor-Upgrades bis Stufe 3 sind ohne Probe möglich. Das Kommunikationssystem der Drohne ignoriert eine Stufe Rauschen.
item.boing_sky_commander.desc=(Kleine Überwachungsdrohne) Die Form der Sky Commander ist die eines alten Nurflüglers aus dem späten 20. und frühen 21. Jahrhundert. Die Flügel nutzen eine variable Geometrie und können sich für mehr Auftrieb verbreitern, um besser über einem Operationsgebiet zu schweben und Energie zu sparen. Im Notfall können sie sich zurückfalten und der Drohne mehr Geschwindigkeit und Wendigkeit verleihen. \n Mit verbreiterten Flügeln: Beschleunigung 10, Höchstgeschwindigkeit 160. Für den Bereichsstörsender kann die Stufe zwischen 1 und 5 gewählt werden. Für den gerichteten Störsender beträgt die Maximalstufe 6. Das Stealth-Design erhöht den Schwellenwert für elektronische Entdeckung um 2; wenn externe Waffen oder Ausrüstung angebracht werden, geht jeder Vorteil dieses Designs verloren.
item.hawker_bat.desc=(Kleine Überwachungsdrohne) Der Name kommt von dem Flügelpaar, das am Rumpf angebracht ist. In diesen Flügeln sind starke, schwenkbare Mikrorotoren untergebracht, die die Drohne mit angemessener Geschwindigkeit vorantreiben. Die Bat kann mit den Flügeln konventionell fliegen oder wenn nötig gleiten, und sie kann mit den Mikrorotoren (ähnlich wie die meisten Kipprotor-Flugzeuge) auch schweben. Neben den überdurchschnittlichen Sensoren und Aufzeichnungsgeräten besitzt die Bat auch zwei „Landekrallen“, mit denen sie sich an Oberflächen festhalten kann, um Energie zu sparen, während sie eine Überwachungsmission durchführt. Außerdem kann sie sich mit den Krallen auch unbeholfen fortbewegen, wenn sie nicht fliegt. \n Alle Schwellenwerte für die akustische Entdeckung dieser Drohne sind um 2 erhöht.
item.whispering_death.desc=(Kleine Kampfdrohne) Whispering Death hat ein einfaches Design, das auf der Sikorsky-Bell Microskimmer basiert. Die eine Hälfte des Namens kommt von dem schallgedämpften Mantelpropeller, der den Schub erzeugt. Das Fluggeräusch der Whispering Death ist fünfzig Prozent leiser als das der Drohne, auf der sie basiert. Aber was sie so berüchtigt macht, ist das eingebaute Waffensystem. Wenn die Drohne ein Ziel angreift, rotiert ihr Rumpf mit hoher Geschwindigkeit, und vier Monodrähte mit Gewichten an den Enden fahren aus und erhöhen die Stabilität. Diese Monodrähte können bis zu 122 Zentimeter weit ausfahren und verursachen denselben Schaden wie Monofilamentpeitschen. \n Würfelpoolbonus von +2 auf alle Heimlichkeitsproben.
item.aerodesign_condor.desc=(Mittlere Luftschiffdrohne) Die LDSD-64 kann im Notfall ihren Ballon und die Solarpaneele abwerfen (Ersatz dafür kann man als Zubehör für jeweils 100 Nuyen kaufen). Dann fahren ein Paar einziehbarer Flügel mit Mikro-Jetantrieb aus, sodass die Drohne aus der Gefahrenzone fliehen kann. Anders als ihre Vorgänger ist die LDSD-64 nicht nur zur Beobachtung geeignet – sie dient auch als mobiler Kommunikationsknoten (komplett mit Satellitenverbindung und Relaiseinheit) und als Plattform für elektronische Kriegsführung. Sie hat außerdem ein Paar kleiner Abschussrohre, aus denen zwei Mini-Drohnen vom Typ AEW-03 Screamer abgefeuert werden können, die entweder als Ablenkung oder zur elektronischen Kriegsführung dienen können. \n Im Notfallflug Beschleunigung 20, Geschwindigkeitsintervall 25, Höchstgeschwindigkeit 130. Die Screamer-Mikrodrohnen sind nicht im Preis inbegriffen. Die Condor hat im Notfallflug nur 10 Minuten Flugzeit, bevor ihr der Strom ausgeht.
item.hawker_harrier.desc=(Mittlere Kipprotordrohne) Wenn die Drohne in den vertikalen Flug übergeht oder schwebt, bewegen sich die Flügel um etwa sechzig Grad nach vorne, und die Turbopropeller an den Flügelspitzen werden gekippt, um Auftrieb zu erzeugen. An der Unterseite und am Heck sitzen zwei kleinere Turbopropeller, die zur Unterstützung ebenfalls kippen. Wenn die Harrier wieder in den Horizontalflug übergeht, schwingen die Flügel wieder in die normale Neunzig-Grad-Position.  Sie ist eine vielseitige Plattform und schneller als die Roto-Drohne. Weil sie eher flugzeugartig ist, kann sie größere Entfernungen viel schneller und effizienter zurücklegen, und wegen der Befestigungspunkte kann sie insgesamt mehr Bewaffnung tragen. \n Schwebeflug: Handling 5. Benötigt eine Nebenhandlung für den Wechsel zwischen horizontalem und vertikalem oder Schwebeflug.
item.vulcan_jump_master.desc=(Mittlere Spezialdrohne) Die Jump Master ist eine weitere Wearable-Drohne von Vulcan und soll für Fallschirmsprünge oder Luftlandemissionen benutzt werden. Sie hat ab Werk spezielle Manövrier- und Freifall-Autosofts und kann einem versierten Springer bei seinem Sprung mit fortschrittlicher AR-Steuerung (wenn nötig von einem Kommlink aus) helfen. Ein weniger fähiger Springer kann von ihr auch selbstständig sicher auf den Boden gebracht werden; wenn gewünscht, kann auch ein Rigger in voller VR den Springer als Passagier runterbringen. Die Jump Master kann entweder mit einem Gleitschirm oder einem gewöhnlichen Fallschirm ausgestattet werden. \n  Die Autosofts sind proprietär und können nicht deinstalliert oder kopiert werden. Würfelpoolbonus von +2 für Athletikproben (ggf. mit Spezialisierung Freier Fall), wenn ein Charakter mit der Drohne abspringt. Bei Steuern-Proben für einen Tandemsprung wird einer der Würfel durch einen Schicksalswürfel ersetzt. Die Drohne kann außer Pilot-Upgrades keine weiteren Modifikationen aufnehmen. Die Handling-, Geschwindigkeits- und Beschleunigungswerte gelten nur, wenn die Drohne alleine fliegt. Ansonsten werden Proben auf Athletik (Freier Fall) verwendet (entweder durch die Drohne über die Autosoft oder durch den springenden Charakter).
item.dassault_peregrine.desc=(Grosse Flugzeugdrohne)  Beschleunigung und Höchstgeschwindigkeit der Peregrine sind mit ähnlichen Luftdrohnen auf dem Markt vergleichbar, in der Wendigkeit und Bewaffnung übertrifft sie diese allerdings deutlich. Mit den neuen Flügeln mit variabler Geometrie und dem Vektorschubsystem ist diese Drohne enorm wendig und kann extrem enge Kurven fliegen. Aber wirklich brillant an der Peregrine sind die Bewaffnung und die Zielfindungssysteme. In der Nase befindet sich eine interne Waffenhalterung für ballistische Waffen, die die Stealth-Eigenschaften der Drohne nicht beeinträchtigt, in den Flügeln gibt es jeweils eine interne Waffenhalterung für Raketen und in der Mitte einen Schacht, der vier weitere Raketen aufnehmen kann.
item.boeing_unicorn.desc=(Grosse Starrflügeldrohne) Die Unicorn ist ein wichtiger Teil mehrerer Konzern- und Staatsarmeen und gilt als das beste unbemannte Luftangriffsfahrzeug des letzten Jahrzehnts. In vielen Ländern, zum Beispiel den UCAS, ist sie immer noch eine Schlüsselkomponente der Nuklearkapazität. Diese besonderen Modelle werden von den Vereinten Nationen und dem Konzerngerichtshof streng reglementiert, aber Unicorns mit konventioneller Bewaffnung gehören zu den Bestsellern auf dem Rüstungsmarkt. In geringer Höhe sind sie extrem wendig. Außerdem besitzen sie eine fortschrittliche Gefahrenanalyse- und Pilotsoftware, wodurch sie sich sehr gut eignen, um allein zu operieren und Gefahren zu vermeiden.
item.hawker_rescue.desc=(Grosse Kipprotor-Drohne)Das grundlegende Design ist dasselbe wie bei der kleineren Harrier, aber die Motoren sind größer und stärker, und das Sensorsystem für den Tiefflug und die Entdeckung/Lokalisierung von Patienten ist besser. Was die Rescue Harrier wirklich auszeichnet, ist das System aus Seilwinde und Bergungstrage, das sie mitführt. Die Drohne ist groß und leistungsstark genug, um einen Troll sicher zu tragen, und wird vor allem für Rettungs- und Bergungseinsätze über kurze Distanz oder dann, wenn größere Luftfahrzeuge nicht zum Bergungsort vorrücken können, eingesetzt. \n Schwebeflug: Handling 4. Benötigt eine Nebenhandlung für den Wechsel zwischen horizontalem und vertikalem oder Schwebeflug. Die Seilwinde hat eine Stärke von 10.
item.hawker_thunderbolt.desc=(Grosse T-Bird-Drohne) Die Thunderbolt ist eine Kampfdrohne, die den Zweck hat, Feuer von oben regnen zu lassen und ein Ziel rücksichtslos zu vernichten. Sogar für eine Drohne ihrer Klasse ist sie groß und hat ein ziemlich einfaches, aber effektives Design. Die Thunderbolt hat eine ähnliche Flügelkonfiguration wie ein traditionelles Kipprotor-Flugzeug, allerdings mit Vektorschub-Motoren mit variablem Flügelprofil und Mikro-Schubdüsen statt der traditionelleren Turbopropeller- oder Rotorsysteme. Zusammen mit einem zweiten Motor im Schwanz ermöglicht diese Konfiguration eine hervorragende Wendigkeit bei geringen Geschwindigkeiten und Höhen. Sie hat ab Werk nicht weniger als fünf Halterungen und Befestigungspunkte für Waffen: eine in der Nase und vier weitere Befestigungspunkte an den kleinen Sekundärflügeln unter den Tragflächen. An der Nase sitzt ein schwerer Turm, der einen Seitenrichtbereich von 360 Grad und einen Höhenrichtbereich von +50 Grad bis -90 Grad aufweist. \n Schwebeflug: Handling 5. Die Sekundärflügel sind darauf ausgelegt, jeweils bis zu eine schwere Waffe oder zwei Raketen zu tragen.
item.saeder_blitz.desc=(Grosse Starrflügeldrohne) Die Blitz Mk. II ist im Moment das schnellste unbemannte Luftfahrzeug, das es gibt, und ist ein preisgünstiger Abfangjäger, der Streitkräften mit Geldknappheit zumindest etwas Luftverteidigung verschafft.  Einfach ausgedrückt ist die Blitz Mk. II dafür gedacht, ein Ziel anzufliegen, zu bekämpfen und (hoffentlich) zur Basis zurückzukehren. Ihr Flugwerk ist einfach nicht für Luftmanöver gemacht. Mit einer verbesserten Supercruise-Fähigkeit kann die Blitz II ohne Nachbrenner Überschallgeschwindigkeit erreichen und hat eine Höchstgeschwindigkeit von Mach 3.
item.marine_sea_snake.desc=(Kleine Tauchdrohne) Die Sea Snake wurde zusammen mit einer anderen Aztech-Tochter (Hawker-Siddeley) entwickelt und ist eine Unterwasserangriffsdrohne, die etwa die Maße einer nordamerikanischen Wassermokassinotter hat. Sie besitzt Reihen von Injektorzähnen in ihrem mechanischen Gebiss, die mit einem Toxinreservoir verbunden sind, das mit allen möglichen chemischen Mixturen zum Einsatz gegen metamenschliche Ziele gefüllt werden kann. \n  Würgeangriffe funktionieren wie Ringenangriffe mit der Option Schaden zufügen, s. SR6, S. 114. Für den Angriff legt die Drohne eine Probe auf Manövrieren + Pilot ab, für den Schaden eine Probe auf Manövrieren + Stärke. Für diese Zwecke hat die Drohne Stärke 4.
item.proteus_krake.desc=(Kleine Tauchdrohne) Die Krake hat die Form eines kleinen Tintenfisches und benutzt ihre Gliedmaßen als Antrieb, wie es ihre tierischen Vorbilder tun. Das war zwar effektiv, aber die Ingenieure von Proteus hatten nicht bedacht, dass sich die mechanischen Tentakel trotz moderner Materialien verfrüht abnutzen könnten. Proteus entwickelte schnell eine relativ kostengünstige Lösung, indem einziehbare Mikro-Hydrojets am Körper angebracht wurden, die die Bewegung über weite Entfernungen vereinfachten. Das verringerte die Abnutzung der Tentakel und erhöhte die insgesamt mögliche Einsatzdauer um über fünfzig Prozent. Neben Schneidwerkzeugen, die an den Gliedmaßen angebracht werden können, hat die Krake II als Bewaffnung wie das Vorgängermodell das Mikrotorpedorohr mit vier Schuss und den Tintenbeutel als ECM. Die Tinte erschafft nicht nur eine dunkle Wolke unter Wasser, die die optische Wahrnehmung hemmt, sondern enthält auch sonar- und signalstörende Materialien, die bis zu fünf Meter Umkreis abdecken.
item.proteus_devil_ray.desc=(Mittlere Tauchdrohne)Diese Allzwecktauchdrohne hat die gleiche Form wie ein gewöhnlicher Stachelrochen, ist aber ungefähr doppelt so groß. Die Flossen der Drohne sind mehrgliedrig und mit einem flexiblen Kevlar-Gummi-Material überzogen, das ihnen gestattet, sich sehr ähnlich wie die Brustflossen des Tiers zu bewegen, auf dem das Design der Drohne beruht.  Wenn die Teufelsrochen nicht auf Patrouille ist, kann sie von bis zu zwei Schwimmern über kurze Distanzen als Transportmittel benutzt werden, indem diese sich an den Handgriffen an den Seiten der Drohne festhalten. \n Bei den "Sitzen" handelt es sich eigentlich nicht um Sitze, sondern nur um Haltegriffe, mit deren Hilfe sich Taucher unter Wasser ziehen lassen können.
item.marine_silent_hunter.desc=(Grosse Tauch-/Oberflächendrohne) Wie ihr größeres Vorbild hat die Drohne hochmoderne Geräuschdämpfungs- und Täuschsysteme, die eine völlig geräuschlose Fahrt oder das Imitieren verschiedenster Meerestiergeräusche erlauben, wenn sie mit normaler Geschwindigkeit fährt. Wenn es nötig ist, kann die Silent Hunter Wassertragflächen und Hydrojets ausfahren, mit denen sie sich über Wasser genauso schnell bewegen kann wie so manches Rennboot. \n Unter Wasser: Handling 2, Beschleunigung 10, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 70. Die Stealth-Systeme erhöhen den Schwellenwert für Proben, um die Drohne zu entdecken, um 3.
item.mostrans_wavecutter.desc=(Grosse Schiffsdrohne) Die Wavecutter wird alleine oder als Begleitung eines größeren Schiffs oder einer Flotte als Patrouillen- und Abfangfahrzeug eingesetzt und ist im Grunde ein Kampfschiff in Drohnengröße.  Vor der Brücke befindet sich ein gepanzerter Turm mit schwerer Waffenhalterung. Vor diesem liegt eine interne Raketenbucht, aus der Geschosse in einem Winkel von 45 Grad abgefeuert werden. Die Bewaffnung wird durch zwei Türme am Heck vervollständigt, die oft mit Maschinengewehren oder Miniguns für den Nahkampf bestückt werden.
item.yamatetsu_deep_six.desc=(Grosse Tauchdrohne) Die Deep Six begann ihre Existenz als bemanntes Tiefseetauchboot, aber nach der Einführung von WiFi und VR-/AR-Steuerung wurde sie schnell in eine Drohne umgewandelt. Ihre Form entspricht einem umgekehrten L. Die Front der Drohne beherbergt zahlreiche Sensoren und Aufzeichnungsgeräte mit einer großen Sensorkuppel oben und dazu vier Arbeitsarme mit modularen Enden, an denen verschiedenste Werkzeuge montiert werden können. Mit einer schweren Greifklaue hinten kann sie sich an Schiffswracks festhalten, große Teile verlorener Ausrüstung oder Schrott greifen und ähnliche Aufgaben erfüllen.
item.mitsuhama_bustamove.desc=(Kleine Anthroform-Drohne) Bei ihrer Einführung vor fast einem Jahrzehnt war die erste Bust-A-Move eines der frühesten Beispiele für Anthroform-Drohnen. Die Drohne war damals höchst modern und eigentlich nur als teures Kinderspielzeug gedacht. Die neue Serie namens „Bust-A-Move and Friends Super Adventure Hour“ hat „Busta“ (den hippen Durchschnittsbürger) als Hauptdarsteller, der in die fiktionale Stadt Rainbow City umzieht und dort viele neue Freunde findet, mit denen er Abenteuer in seiner neuen Heimat erlebt. Zu den neuen Charakteren gehören Nachbarin Mumsy (eine Mumie als Gärtnerin, die all ihren Freunden Blumen schenkt), Rokko (ein liebenswertes, kräftiges Nashorn, das nicht allzu schlau ist und gerne Karaoke singt – ein kaum verhohlenes Troll-Klischee), Z-Dude (ein Roboter, der von metamenschlichem Verhalten verwirrt ist und für die Lacher sorgen soll), Lil Muffin (ein sprechender Blaubeer-Muffin, der Umarmungen liebt), Tumbla (eine athletische, sportfanatische Bärin, für die ein romantisches Interesse von Bustas Seite angedeutet wird), Posey (ein scheuer Waschbär, der ein extrem ehrgeiziger Gamer ist), Panda Brown (ein brauner Panda, der sehr „straßenmäßig“ auftritt – Ork-Stereotyp und nomineller Antagonist), Lexington (eine Art Dinosaurier oder Echse – ein Genie, das den Kindern „lehrreiche Dinge“ vermittelt) und Angerface (ein rotes, kantiges, humanoides Wesen mit aggressivem Temperament – die rechte Hand von Panda Brown; will eigentlich nur akzeptiert werden). Die neue Drohnenserie, die in diesem Jahr herauskam, hat durchgehend dasselbe Chassis und dieselben Leistungsdaten, aber unterschiedliche Überzüge für die verschiedenen Charaktere. Die Unterschiede werden vor allem durch ein „Persönlichkeitsprogramm“ abgebildet, das mit Nutzern interagiert und auf den Persönlichkeiten der Seriencharaktere basiert. /n Die Gliedmaßen der Bust-A-Move haben Stärke 1 (s. Kasten Beine und Arme von Anthroformen, S. 127).
item.shiawase_bd_butler.desc=(Mittlere Anthroform-Drohne) Diese mittlere Anthroform-Drohne hat eine spezielle Software, durch die sie viele verschiedene Aufgaben erfüllen kann. Und wie alle anderen Drohnen kann auch sie ferngesteuert werden. Und sie ist auch wie alle anderen Drohnen kein Genie. Sie kann nur Aufgaben erfüllen, die man ihr gibt, und wenn diese erfüllt sind, wartet sie einfach auf den nächsten Befehl. Die Drohne ist für Alltagsaufgaben brauchbar, aber langsam und nicht gepanzert, was sie für den Kampf eher unnütz macht. \n Die Gliedmaßen der Bi-Drone Butler haben Stärke 2 (s. Kasten Beine und Arme von Anthroformen, S. 127).
item.shiawase_bd_man_at_arms.desc=(Mittlere Anthroform-Drohne) Die Man-at-Arms basiert auf der Butler und ist deren Sicherheits-/Kampfversion. Sie hat etwa die Größe eines durchschnittlichen Menschen (1,7 Meter) und ist eine eher traditionelle Drohne. Die Außenhülle ist vollständig veränderbar und kann nach den Wünschen und ästhetischen Vorstellungen des Kunden gestaltet werden. Unter der Hülle hat die Man-at-Arms einen verstärkten Rahmen und gepanzerte Kevlarplatten um die wichtigen Systeme und Gelenke, außerdem kann zusätzliche Panzerung angebracht werden.  Die Man-at-Arms hat zwar feinmotorische Hände, die allerdings ungeeignet sind, um Waffen zu halten, geschweige denn zu benutzen. Am rechten Arm befindet sich eine Waffenhalterung, die eine Waffe bis zur Größe eines LMG tragen kann. \n  Die Gliedmaßen der Bi-Drone Man-at-Arms  haben Stärke 3 (s. Kasten Beine und Arme von Anthroformen, S. 127).
item.shiawase_bd_silverback.desc=(Große Anthroform-Drohne) Die  Silverback  ist  eine  vor  Kurzem  vorgestellte Anthrodrohne von 3,5 Metern Höhe und fast derselben Breite, die Körperbau und Aussehen eines übergroßen Roboter-Silberrückengorillas hat. Sie wird als schwere Such- und Rettungsdrohne eingesetzt, wobei besonderer Wert auf die Rettung gelegt wird. Die Silverback benutzt ihre mächtigen Arme (unterstützt durch ihre Beine), um Gebäude und Oberflächen zu erklimmen, wenn Rad- oder Flugdrohnen (oder metamenschliche Rettungskräfte) nicht sinnvoll einzusetzen sind. Die Arme haben eine Magnethydraulik, die gewaltige Hebekräfte freisetzt und auch die nötige Stärke mitbringt, um die meisten Standardfahrzeuge und sogar manche verstärkten Türen einfach aufzureißen. Diese Arme können auch verschiedene Schneidewerkzeuge aufnehmen, um bei solchen Rettungsoperationen zu helfen. \n  Die Arme der Bi-Drone Silverback haben Stärke 10, die Beine Stärke 3 (s. Kasten Beine und Arme von Anthroformen, S. 127).

