item.pack_upgrade_dirty=Upgrades-Dirty Tricks
item.pack_upgrade_dirty.page=71
item.pack_upgrade_dirty.desc=These upgrade PACKs include vehicle modifications and upgrades from Double Clutch. They may be applied to any vehicle with room for them. Each PACK lists the requirements for any vehicle that may take them.

