quality.critter_spook=Critter Spook
quality.critter_spook.page=127
quality.critter_spook.desc=Something about the character's presence or smell threatens animals and paranormal critters. Any such creatures within five meters of the individual react with fear and hostility; apply a –2 dice pool modifier to attempts to control, soothe, or pacify them. If drawn into combat, a critter will go out of its way to attack this character first.
quality.bioluminescence=Bioluminescence
quality.bioluminescence.page=128
quality.bioluminescence.desc=The individual generates light from various parts of their bodies, often with more than sixty percent of the body and hair doing so. The light is too weak to see in normal light; it is only visible in partial light and full darkness. The level of light produced negates up to two hits from any physical illusion that is attempting to obscure them, including Improved Invisibility. In low light conditions or total darkness, the individual can be attacked normally by others, regardless of their vision capabilities. On the good side, the light being emitted is enough to allow others with low light vision to see normally in spaces within five meters of the character.
quality.mad_eyes=Mad Eyes
quality.mad_eyes.page=128
quality.mad_eyes.desc=
quality.mood_hair=Mood Hair
quality.mood_hair.page=128
quality.mood_hair.desc=
quality.striking_skin=Striking Skin Pigmentation
quality.striking_skin.page=128
quality.striking_skin.desc=
quality.symbiosis=Symbiosis
quality.symbiosis.page=128
quality.symbiosis.desc=Very similar in nature to the Home Ground quality (p. 72, SR6) but with a more sinister potential. In addition to the benefits of having Home Ground, the connection between the individual and the location grows stronger in time, becoming something near-mystical in nature. The health of the individual becomes tied to their territory, waxing and waning as the area grows or declines in social and environmental health.<br/><br/>In game terms, the individual’s biomechanics reflect that nature. When the neighborhood is healthy, the character feels better, able to shrug off mild depression with ease or face personal fears more directly (+1 dice pool bonus for resisting Manipulation and Illusion spells that attempt to impart these feelings) and even recovering faster (+1 dice pool modifier for all healing and recovery tests, including those involving magic). When the neighborhood is sickly, rundown, or becoming blighted, the individual finds it more difficult to be optimistic, falling prey to their inner demons, becoming slower to recover from mental fatigue and stress (–2 dice pool penalty to all natural and augmented recovery tests and when resisting Illusion or Manipulation spells that prey on these same emotions). More insidiously, the individual finds themselves increasingly resistant to leaving their area, requiring a Composure (3) test to venture beyond their comfort zone. Remaining away from their home for any length of time requires daily Composure tests, with the threshold increasing by +1 for every week away, with failure meaning they will become irritated and emotionally uncertain, registering as a –2 dice pool penalty on any test involving Willpower. Changes in the neighborhood’s social environments, such as disruptive gang activity or a home burning down, result in psychosomatic responses and mood swings; the degree of those is left up to the gamemaster.
