dataset.name.short=6WC
dataset.name=Sixth World Companion
dataset.desc=<b>Dream it, be it</b><br/><br/>\
 The Sixth World is wild and weird, but it doesn’t have to be wilder or weirder than you.<br/><br/>\
 If you can dream it, the Sixth World Companion helps you play it. With alternate character creation methods, new metatypes, a whole slew of qualities, and even some rules variations, <em>Sixth World Companion</em> brings dozens of options to your game table for you to build your vision of what your runner should be.<br/><br/>\
 <em>Sixth World Companion</em> is the core player resource book for Shadowrun, Sixth World.

