qpath.favored_weapon=Favored Weapon
qpath.favored_weapon.page=141
qpath.favored_weapon.desc=Note: The Karma costs for this quality path are not doubled, as none of these qualities can be taken at character creation.
qpath.favored_weapon.step.favored_weapon_extension=An Extension of Yourself
qpath.favored_weapon.step.favored_weapon_extension.page=141
qpath.favored_weapon.step.favored_weapon_extension.desc=You have become accustomed to using one special weapon, and it is now a core part of your identity. <br/>Game Effect: Choose a specific weapon for which you have a related expertise. You must have earned at least 10 Karma in missions where you have had this weapon. Gain +1 die on all skill tests made with the weapon, and all of its Attack Ratings increase by +2 when it is wielded by you.
qpath.favored_weapon.step.favored_weapon_customization=Unique Customization
qpath.favored_weapon.step.favored_weapon_customization.page=141
qpath.favored_weapon.step.favored_weapon_customization.desc=Your weapon is special, but it could become more special. In this step, you make it even more your own. <br/>Game Effect: With access to an Armorer tool shop, you may improve your favored weapon with an Engineering (Armorer) + Logic (6, 1 week) Extended test. You may customize your weapon up to three times, but the threshold for the Extended test increases to 12 for the second customization, and 18 for the third. The customizations are more related to your own mindset and familiarity with your favored weapon rather than purely technical modifications. They only apply when you are wielding the weapon, and may not be changed once selected. Anyone else using your customized weapon don't receive the bonuses, and may not gain or spend Edge on attacks made with it.
qpath.favored_weapon.step.favored_weapon_attachment=Unhealthy Attachment
qpath.favored_weapon.step.favored_weapon_attachment.page=141
qpath.favored_weapon.step.favored_weapon_attachment.desc=If you choose, you may take one level of Unique Customization at no Karma cost if you also select the Unhealthy Attachment quality for that weapon. <br/>Game Effect: When using any weapon that requires the same skill as your favored weapon, you may not gain or spend Edge on attacks.
qpath.favored_weapon.step.favored_weapon_lost=Lost!
qpath.favored_weapon.step.favored_weapon_lost.page=141
qpath.favored_weapon.step.favored_weapon_lost.desc=If your favored weapon is lost, you may not replace it for at least one month. If you choose to not favor another weapon, your Unhealthy Attachment quality penalty will apply until you buy it off for 10 Karma. If you choose a new favored weapon, you must transfer your Unhealthy Attachment to it. If you do not have an Unhealthy Attachment, you must take it at this time. There is no Karma cost for choosing a new favored weapon, though all Unique Customizations must be purchased individually.
quality.favored_weapon_extension=An Extension of Yourself
quality.favored_weapon_extension.page=141
quality.favored_weapon_extension.desc=You have become accustomed to using one special weapon, and it is now a core part of your identity. <br/>Game Effect: Choose a specific weapon for which you have a related expertise. You must have earned at least 10 Karma in missions where you have had this weapon. Gain +1 die on all skill tests made with the weapon, and all of its Attack Ratings increase by +2 when it is wielded by you.
