item.pack_magical_targeting=Sensor-Magical Targeting Kit
item.pack_magical_targeting.page=59
item.pack_magical_targeting.desc=Unless your senses are naturally, magically, or cybernetically enhanced, it's a good idea to pick up something that lets you see in the dark and around corners, use smartgun-ready weapons, see and hear with incredible sensitivity, or detect things you don't otherwise have senses for.

