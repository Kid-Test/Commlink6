qpath.vendetta=Vendetta
qpath.vendetta.page=141
qpath.vendetta.desc=When your Heat level reaches 15 or higher, you may begin this quality path. You must either take Bounty (p. 136) or 2 levels of Hunted (p. 137). You do not initially gain any Karma in return for these qualities.
qpath.vendetta.step.vendetta_start=Vendetta
qpath.vendetta.step.vendetta_start.page=141
qpath.vendetta.step.vendetta_start.desc=After the first time you suffer the consequences for Bounty or Hunted, choose one of the following options:
qpath.vendetta.step.vendetta_lielow=Lie Low
qpath.vendetta.step.vendetta_lielow.page=141
qpath.vendetta.step.vendetta_lielow.desc=Will you lie low and hope the special attention blows over? If so, your way out is to reduce your personal Heat to zero using whatever methods are available to you. You will suffer the effects of the Bounty or Hunted quality every session until your Heat reaches zero. Once your Heat reaches zero, the Bounty or Hunted quality goes away.You may then purchase one positive quality at its regular Karma cost (instead of double, per usual character advancement costs). The path ends here.
qpath.vendetta.step.vendetta_shutdown=Shut It Down
qpath.vendetta.step.vendetta_shutdown.page=142
qpath.vendetta.step.vendetta_shutdown.desc=Do you track down who's got your number? Finding out who is after you will require the help of your contacts, with a bribe of at least 1,000 nuyen. Once you know who is after you, you must decide whether to try to make a deal, or make them back down. This would likely require the focus of a session or two, rather than the usual shadowrun. If you are attempting to appease your pursuer, you must perform a run for them (for free), or pay them 1,000 nuyen for every point of Heat you have. If you force your pursuer to back down, you must perform a run to gain leverage over them, intimidate them, or take them down. If the run fails, you gain either Bounty or 2 levels of Hunted (whichever you didn't already have). If you already have both qualities, increase the Hunted quality to level 3. If the run succeeds, your Bounty or Hunted quality goes away, and the personal Heat of every runner involved in the run is reduced by 5. The path ends here.
qpath.vendetta.step.vendetta_fine=This Is Fine?
qpath.vendetta.step.vendetta_fine.page=142
qpath.vendetta.step.vendetta_fine.desc=Do you accept this situation as just part of your new normal? If so, the quality becomes permanent unless you buy it off later for 20 Karma. However, you gain 10 points of Karma that you may use to purchase a single positive quality or buy off one of your negative qualities at its unmodified Karma cost (instead of double). Any Karma not spent on a quality is lost. The path ends here.

qpath.sinners_path=SINner’s path
qpath.sinners_path.page=142
qpath.sinners_path.desc=You may begin this quality path if you took the SINner quality at character creation. If your personal Heat ever reaches 10, you gain the quality Records on File.
qpath.sinners_path.step.sinners_path_record=Records on File
qpath.sinners_path.step.sinners_path_record.page=142
qpath.sinners_path.step.sinners_path_record.desc=Unfortunately for you, some evidence of your crimes is being collected to create a profile in a criminal database. <br/>Game Effect: Whenever you attempt to use a fake SIN or license, treat the rating as if it were one lower. Whenever you gain Heat, you gain one extra (max +1 heat per session). If your heat ever reaches 17, the authorities have gathered enough information to identify you with your crimes. Your SINner quality becomes a Criminal SIN.Gain 5 Karma, which you may save or spend as you wish.
qpath.sinners_path.step.sinners_path_criminal=Criminal SIN
qpath.sinners_path.step.sinners_path_criminal.page=142
qpath.sinners_path.step.sinners_path_criminal.desc=Either your original SIN has been flagged for your criminal acts, or you were issued one after being charged with a crime. <br/>Game Effect: Whenever you use a fake SIN or license, it is much more likely to be identified against your criminal SIN and burned. All of your fake IDs function at half their rating (rounded up), and you may not gain or spend Edge to influence a SIN check. If the Heat roll at the end of a run results in no Heat gained, you gain 1 personal Heat anyway. Records on File does not apply in this instance.
qpath.sinners_path.step.sinners_path_shadows=Into the Shadows
qpath.sinners_path.step.sinners_path_shadows.page=142
qpath.sinners_path.step.sinners_path_shadows.desc=Your SIN weighs heavily on you, and so you're going to need to find a way to disappear into the shadows. This part of the path is initiated by the gamemaster, but it should be in response to the player wanting to finally do something about the mounting pressure. <br/>Game Effect: A fixer or ID manufacturer contact will require 10,000 nuyen plus 1,000 nuyen for every point of personal Heat to arrange for your original identity to be carefully purged from the Matrix. Reduce your personal Heat by half. You may buy off your SINner or Criminal SIN quality for 8 Karma. At any point after this, you may buy off Records on File for 10 Karma. The path ends here.
quality.sinners_path_record=Records on File
quality.sinners_path_record.page=142
quality.sinners_path_record.desc=Unfortunately for you, some evidence of your crimes is being collected to create a profile in a criminal database. <br/>Game Effect: Whenever you attempt to use a fake SIN or license, treat the rating as if it were one lower. Whenever you gain Heat, you gain one extra (max +1 heat per session). If your heat ever reaches 17, the authorities have gathered enough information to identify you with your crimes. Your SINner quality becomes a Criminal SIN.Gain 5 Karma, which you may save or spend as you wish.
