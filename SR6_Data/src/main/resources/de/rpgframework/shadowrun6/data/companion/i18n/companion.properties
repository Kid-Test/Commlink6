#Contacts

contacttype.academic=Academic
contacttype.academic.page=160
contacttype.academic.desc=Includes all sorts of instructors, researchers, and intellectuals, as well as professionals like lawyers and accounts. Typically, you call on this type of contact to see what they know, not necessarily what they can do—unless you need a lawyer.
contacttype.corporate=Corporate
contacttype.corporate.page=160
contacttype.corporate.desc=These may be employees of one of the Big Ten, or they could work for a smaller local corporation. Either way, they will have the scoop on the corporate world. In addition to information, this type of contact may have access to a pipeline for grey-market products, or they might be able to provide certain corporate services.
contacttype.criminal=Criminal
contacttype.criminal.page=161
contacttype.criminal.desc=They could be Mafia, Triad, Yakuza, Vory or even the larger nationwide gangs—their connection to a criminal organization separates this contact from common street criminals. Criminal types can be a good source for black-market goods as well as information on their competitors.
contacttype.engineering=Engineering
contacttype.engineering.page=161
contacttype.engineering.desc=This type covers anyone who works with or operates vehicles or drones as well as other applied mechanical technologies. Chop-shop mechanics, taxi drivers, drone dealers, VTOL/LAV pilots, and junkyard operators fall into this type, along with locksmiths, construction workers, and even demolition experts. This is who you call to get a ride, buy a new machine, get something built, install some mods, have some repairs done, or even blow something up.
contacttype.government=Government
contacttype.government.page=161
contacttype.government.desc=While police and city services are all run by corporations these days, they still count as working for the government, as do the military and actual government employees. Government contacts are uniquely positioned to reduce the amount of heat on a team and provide info about what’s on their record—or anyone else’s record.
contacttype.magic=Magic
contacttype.magic.page=161
contacttype.magic.desc=Arcanists, talismongers, enchantersplus anyone else providing a magical service are in this type. This is who can get your reagents, alchemical preps, foci and spell formulas. This type also includes contacts that are only made possible by magic—free spirits, shapeshifters, ghouls, and other Infected
contacttype.matrix=Matrix
contacttype.matrix.page=161
contacttype.matrix.desc=Deckmeisters, techs, programmers, sysops of the various shadow BBSs, and the bartender at your favorite matrix nightclub all fall into Matrix contacts. They can pass along the latest in Matrix gossip as well as being a source of the hottest tech.
contacttype.media=Media
contacttype.media.page=161
contacttype.media.desc=Not just news reporters, editors, and pirate media broadcasters, but everyone that makes a living in the spotlight such as athletes, rockers, and sim-stars are in this category. Typically, they are called on for what they know or what they can find out.
contacttype.medical=Medical
contacttype.medical.desc=Paramedics, street docs, pharmacy workers and cyber-surgeons are who you call when you need medical services or you’re looking for some new ’ware.
contacttype.medical.page=161
contacttype.street=Street
contacttype.street.page=161
contacttype.street.desc=All sorts of SINless living on the fringe of society fall into this group. Smugglers, gangers, coyotes, drug dealers, hustlers, petty criminals, squatters, prostitutes and other down-and-outs, including most of the other shadowrunners that you know.

#Metagenetic Collectives

set.general=No collective
set.general.page=118
set.general.desc=Not all changelings fall neatly into one of the recognized collectives. Many expressions appear to be entirely random. In such instances, roll a D6 to determine whether the quality is positive (odd) or negative (even), then roll a second D6 to determine which category the metagenic trait expresses from.
set.monolith=Monolith
set.monolith.page=117
set.monolith.desc=Often found in the European Alps and the South American Andes, monoliths appear to have been shaped and crafted out of stone, and can be up to half a meter taller than their base metatype.
set.raptor=Raptor
set.raptor.page=117
set.raptor.desc=Raptors have stumped the world by combining features of condors and harpy eagles. Their wings replace their arms, similar to bats or feathered serpents, leaving thumbs at the wrist joint.
set.humboldt=Humboldt
set.humboldt.page=117
set.humboldt.desc=These changelings express throughout the major water bodies of the world, predominantly in areas of reduced pollution. <br/>Humboldts SURGE in tropical or deep saltwater bodies.
set.merfolk=Merfolk
set.merfolk.page=117
set.merfolk.desc=These changelings express throughout the major water bodies of the world, predominantly in areas of reduced pollution. <br/>Merfolk changelings have appeared in the North American Great Lakes and in the Lake Baikal region of Russia/Yakut.
set.shellback=Shellback
set.shellback.page=117
set.shellback.desc=No description
set.anubis=Anubis
set.anubis.page=117
set.anubis.desc=These changelings appear along the entirety of the Nile River basin, including the Blue and White Nile.
set.bastet=Bastet
set.bastet.page=117
set.bastet.desc=These changelings appear along the entirety of the Nile River basin, including the Blue and White Nile.
set.sobek=Sobek
set.sobek.page=117
set.sobek.desc=These changelings appear along the entirety of the Nile River basin, including the Blue and White Nile.
set.ganesh=Ganesh
set.ganesh.page=117
set.ganesh.desc=These normally take place in the southern Indian subcontinent but have been witnessed in several of the neighboring nations and as far away as the South China Sea. These collectives have names taken from Hindu divinities.
set.kali_ani=Kali-Ani
set.kali_ani.page=117
set.kali_ani.desc=These normally take place in the southern Indian subcontinent but have been witnessed in several of the neighboring nations and as far away as the South China Sea. These collectives have names taken from Hindu divinities.
set.rakshasa=Rakshasa
set.rakshasa.page=117
set.rakshasa.desc=These normally take place in the southern Indian subcontinent but have been witnessed in several of the neighboring nations and as far away as the South China Sea. These collectives have names taken from Hindu divinities.
