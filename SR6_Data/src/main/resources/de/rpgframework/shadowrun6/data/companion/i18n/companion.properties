item.pack_actioneer=Armor-Actioneer Business Clothes
item.pack_actioneer.page=58
item.pack_actioneer.desc=No shadowrunner leaves home without their armor, and only gutter punks and wagesl 	aves wear armor that hasn't been upgraded with additional protection against being frozen, zapped, or burned. These PACKs include the protective upgrades you're going to want.

