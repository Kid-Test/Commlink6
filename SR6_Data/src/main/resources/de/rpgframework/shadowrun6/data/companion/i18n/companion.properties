item.pack_rifle_ak97.page=58
item.pack_rifle_ak97.desc=These are the workhorses of the combat-heavy kits. The AK-97 and FN-HAR are ideal for their firepower, while the Ares Alpha and Yamaha Raiden come stock with grenade launchers and other goodies.

