lifemod.ganger=Ganger
lifemod.ganger.page=39
lifemod.ganger.desc=Whether for mutual survival, profit through crime, or just the thrill of it, joining a gang is not an uncommon choice in the Sixth World. You made that choice for one of those reasons. Plus, it’s always nice to know that you’ve got chummers who will watch your back. It would have been nice for you if that had been true.
