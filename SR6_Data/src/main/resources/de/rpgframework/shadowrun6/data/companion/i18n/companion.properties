# Other Packs
# packs-other.xml
item.pack_id_cheap=Fake ID-Cheap
item.pack_id_cheap.page=59
item.pack_id_cheap.desc=Operating without a SIN can be very difficult in some places. Every runner needs at least one decent fake ID, and most own several. Yeah, they're expensive and can easily get burned, but the benefit of being able to blend in with the SINners is almost always worth the expense and risk.

item.pack_id_risky=Fake ID-Risky
item.pack_id_risky.page=59
item.pack_id_risky.desc=Operating without a SIN can be very difficult in some places. Every runner needs at least one decent fake ID, and most own several. Yeah, they're expensive and can easily get burned, but the benefit of being able to blend in with the SINners is almost always worth the expense and risk.

