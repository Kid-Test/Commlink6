item.pack_striker=Launchers-Aztechnology Striker
item.pack_striker.page=58
item.pack_striker.desc=Grenades and rockets are useful as area-effect weapons and distractions, but if you can manage to catch your target within the ground zero, the damage output is extreme. Just don't even think about using them on a stealth op - except maybe as a distraction. No missiles are included among these, just rockets, due to the incredible added cost for minimal benefit. Keep in mind that ammunition for these weapons is expensive: Over 2,000 nuyen per rocket. Make your shots count!

item.pack_interceptor=Launchers-Aztechnology StrikerOnotari Interceptor
item.pack_interceptor.page=58
item.pack_interceptor.desc=Grenades and rockets are useful as area-effect weapons and distractions, but if you can manage to catch your target within the ground zero, the damage output is extreme. Just don't even think about using them on a stealth op - except maybe as a distraction. No missiles are included among these, just rockets, due to the incredible added cost for minimal benefit. Keep in mind that ammunition for these weapons is expensive: Over 2,000 nuyen per rocket. Make your shots count!

