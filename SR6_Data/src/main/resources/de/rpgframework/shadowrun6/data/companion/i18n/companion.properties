item.pack_mgl6=Launchers-ArmTech MGL-6
item.pack_mgl6.page=58
item.pack_mgl6.desc=Grenades and rockets are useful as area-effect weapons and distractions, but if you can manage to catch your target within the ground zero, the damage output is extreme. Just don't even think about using them on a stealth op - except maybe as a distraction. Keep in mind that ammunition for these weapons is expensive: 150 nuyen for most grenades. Make your shots count!

