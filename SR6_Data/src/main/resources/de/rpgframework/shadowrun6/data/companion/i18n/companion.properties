item.pack_valiant.page=58
item.pack_valiant.desc=There's not much to say about these big guns. A bit more ammo is included in these PACKs due to the rapid pace that you're likely to burn through it. With the exception of the Panther cannon, of course, which uses assault cannon rounds.

