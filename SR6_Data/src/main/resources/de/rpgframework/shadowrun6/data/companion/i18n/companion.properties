quality.sinners_path_criminal.page=142
quality.sinners_path_criminal.desc=Either your original SIN has been flagged for your criminal acts, or you were issued one after being charged with a crime. <br/>Game Effect: Whenever you use a fake SIN or license, it is much more likely to be identified against your criminal SIN and burned. All of your fake IDs function at half their rating (rounded up), and you may not gain or spend Edge to influence a SIN check. If the Heat roll at the end of a run results in no Heat gained, you gain 1 personal Heat anyway. Records on File does not apply in this instance.
quality.sinners_path_shadows=Into the Shadows
quality.sinners_path_shadows.page=142
quality.sinners_path_shadows.desc=Your SIN weighs heavily on you, and so you're going to need to find a way to disappear into the shadows. This part of the path is initiated by the gamemaster, but it should be in response to the player wanting to finally do something about the mounting pressure. <br/>Game Effect: A fixer or ID manufacturer contact will require 10,000 nuyen plus 1,000 nuyen for every point of personal Heat to arrange for your original identity to be carefully purged from the Matrix. Reduce your personal Heat by half. You may buy off your SINner or Criminal SIN quality for 8 Karma. At any point after this, you may buy off Records on File for 10 Karma. The path ends here.

#Metaechos

metaecho.transhumanism=Transhumanism
metaecho.transhumanism.page=146
metaecho.transhumanism.desc=Use this rule to afford mundanes the same opportunity for potentially unlimited accumulation of powers that magicians enjoy, via being able to take more and more augmentations. <br/>Game Effect:Under this optional rule, characters may train themselves to accept more body modifications than an untrained mind will incorporate. This process takes a week and is a mundane analogue for becoming an initiate, also measured in grades. The karma cost to become or advance a transhumanist grade is 10 + next grade. A transhumanist gains or expands an Essence hole (see sidebar) by 1.0 Essence with each grade, without having to remove any augmentations. Note that the expanded Essence capacity does not allow the character to take more than two arms, two legs, one head, and one torso (unless they are a metatype that already allows more limbs).

