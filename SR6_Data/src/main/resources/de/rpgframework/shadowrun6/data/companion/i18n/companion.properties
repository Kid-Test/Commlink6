item.pack_surveillance=Surveillance Kit
item.pack_surveillance.page=59
item.pack_surveillance.desc=All you need to spy everywhere.

item.pack_cyberprograms=Cyberprogram Everything Pack
item.pack_cyberprograms.page=60
item.pack_cyberprograms.desc=With the exception of agents (the one in this PACK accounts for 9,000 nuyen), cyberprograms are dirt cheap. Why not just buy them all? They all come in handy from time to time.

# Augmentation Packs
# packs-augments.xml
item.pack_hacker_a=Hacker Pack A
item.pack_hacker_a.page=60
item.pack_hacker_a.desc=This is the ultimate starting character hardware for a decker, all installed as cyberware so you can't be separated from your most important tools by anything short of undergoing involuntary surgery. Just don't go bragging about it, because the only reason you can afford a cyberjack of that level is by purchasing used.

item.pack_hacker_b=Hacker Pack B
item.pack_hacker_b.page=60
item.pack_hacker_b.desc=If you're gearing up to be a serious hacker but at a more reasonable price, this PACK is almost as good as PACK A for over a hundred thousand less nuyen.

item.pack_hacker_c=Hacker Pack C
item.pack_hacker_c.page=60
item.pack_hacker_c.desc=PACK C is a bargain, providing admirable hardware for far less nuyen than many hackers feel the need to invest. If you're making a more well-rounded hacker character, or a character that doubles up in more than one skillset, this PACK is a great option. This PACK is the lowest tier recommended for a serious hacker.

item.pack_hacker_d=Hacker Pack D
item.pack_hacker_d.page=60
item.pack_hacker_d.desc=PACK D is for when you're really tight on Essence and nuyen, but you want to make sure that you have what you need for a hacker. You're much better off if you can afford PACK C instead, which does not cost much more nuyen and Essence, but if you can't, this PACK will get you by.

item.pack_hacker_e=Hacker Pack E
item.pack_hacker_e.page=60
item.pack_hacker_e.desc=PACK E might get you by, and it's one of the most inexpensive kits for a hacker to start out with. It's also a good option if hacking is a secondary skillset for you.

item.pack_hacker_f=Hacker Pack F
item.pack_hacker_f.page=60
item.pack_hacker_f.desc=Okay, this technically enables you to hack, but don't try anything too fancy with it. This PACK is about the cheapest you can go and still have a reasonable shot at hacking. If you've got the skills to back it up, you just might be able to make it work. Even so, you're probably going to want to upgrade this sooner rather than later.

item.pack_cybereye_a=Cybereyes Pack A
item.pack_cybereye_a.page=60
item.pack_cybereye_a.desc=This is the “works” of cybereyes, with just about every option packed within them. If you want the best eyes nuyen can buy, this is probably what you're looking for.

item.pack_cybereye_b=Cybereyes Pack B
item.pack_cybereye_b.page=61
item.pack_cybereye_b.desc=If you're looking for cybereyes with plenty of optical options, but you don't want a smartlink, this PACK is for you.

item.pack_cybereye_c=Cybereyes Pack C
item.pack_cybereye_c.page=61
item.pack_cybereye_c.desc=If you need smartlink-equipped cybereyes with a modest suite of additional capabilities, choose this PACK.

item.pack_cybereye_d=Cybereyes Pack D
item.pack_cybereye_d.page=61
item.pack_cybereye_d.desc=Just the smartlink, please. And the flare compensation, for good measure. You'll rely on contacts, glasses, or goggles to provide you with any enhanced vision capabilities.

item.pack_cybereye_e=Cybereyes Pack E
item.pack_cybereye_e.page=61
item.pack_cybereye_e.desc=This PACK is for those who want something a little bit better than basic replacement cybereyes, adding both low-light and thermographic vision.

item.pack_cyberear_a=Cyberears Pack A
item.pack_cyberear_a.page=61
item.pack_cyberear_a.desc=This is the spare-no-expense PACK for any character who needs the most advanced and capable cyberears you can throw a credstick at. Besides advanced hearing improvements that allow you to isolate, locate, and enhance specific noises, you also have improved balance and damper.

item.pack_cyberear_b=Cyberears Pack B
item.pack_cyberear_b.page=61
item.pack_cyberear_b.desc=If you care more about having the most powerful select sound filter than you do about a balance augmenter, this PACK fits what you're looking for.

item.pack_cyberear_c=Cyberears Pack C
item.pack_cyberear_c.page=61
item.pack_cyberear_c.desc=This PACK is for those who are interested in enhanced hearing capabilities but don't mind the lack of a balance augmenter. These cyberears provide unmatched directional hearing, as well as a sound filter and protective damper.

item.pack_cyberear_d=Cyberears Pack D
item.pack_cyberear_d.page=62
item.pack_cyberear_d.desc=The athlete's cyberears do not include expensive sound filters, but they provide improved balance as well as enhanced directional hearing.

item.pack_cyberear_e=Cyberears Pack E
item.pack_cyberear_e.page=62
item.pack_cyberear_e.desc=Even the cheapest cyberears PACK includes enhanced directional hearing and hearing protection.

item.pack_skill_a=Skill Rig Pack A
item.pack_skill_a.page=62
item.pack_skill_a.desc=Yes, this 'ware is expensive as can be, and it's going to cost you 30,000 more nuyen for every additional active skill that takes full advantage of its capabilities, but if you want to have the best cybernetic skillwire system possible, settle for nothing less. You can run up to two rating 6 activesofts at once, but this PACK only starts you out with one. You are capable of running knowsofts and linguasofts along with activesofts. Sold separately.

item.pack_skill_b=Skill Rig Pack B
item.pack_skill_b.page=62
item.pack_skill_b.desc=Still prohibitively expensive to most, this skilljack/skillwire array is almost as effective as the best. It allows you to run any knowsoft or linguasoft, and up to two rating 5 activesofts at once. Only one rating 5 activesoft is included. Additional rating 5 activesofts are 25,000 nuyen each.

item.pack_skill_c=Skill Rig
item.pack_skill_c.page=62
item.pack_skill_c.desc=You don't rely on skillwires for your most critical skills, but being able to slot anything else you might need to know how to do is a considerable advantage. You can run knowsofts and linguasofts, and up to two rating 4 activesofts. One rating 4 activesoft is included, and additional ones cost 20,000 nuyen each.

item.pack_reflexes=All in the Reflexes
item.pack_reflexes.page=62
item.pack_reflexes.desc=This wired reflexes and reaction enhancers PACK is standard for street samurai and elite corporate security alike. It brings you to your augmented maximum for Reaction, which greatly improves your defense pools and initiative, but it also provides you with a total of four Minor Actions, which you may swap out for a second Major Action. You now have the option of whether to make multiple attacks, or save your extra Minor Actions for things like moving, taking cover, dodging, and blocking.

item.pack_skull=Skull Thick
item.pack_skull.page=63
item.pack_skull.desc=This cyberskull serves one purpose, which is to provide your head with subtle protection. It provides a bonus of +2 to your Defense rating and an extra box to your Physical condition monitor, and it looks completely natural.

item.pack_dome=Skull Chrome Dome
item.pack_dome.page=63
item.pack_dome.desc=For not much more nuyen, you can have even more armor on your head. Most people aren't willing to go with an obvious cyberskull, though.

item.pack_torso_stealth=Torso Stealth
item.pack_torso_stealth.page=63
item.pack_torso_stealth.desc=This PACK is a favorite with discreet couriers and smugglers, but any shadowrunner might find it handy to have a smuggling compartment in their torso. Adding an extra box to your Physical condition monitor is a nice bonus. If you just want a hiding spot for small objects, a bioware skin pocket might be a more economical choice. You can carry a lot more in a torso compartment than a skin pocket, though!

item.pack_torso_armor=Torso Hidden Armor
item.pack_torso_armor.page=63
item.pack_torso_armor.desc=Much like the Thick Skull PACK, this unobtrusive cybertorso serves the purpose of providing you with an extra box on your Physical condition monitor, and a subtle but impressive boost of +5 to your Defense rating.

item.pack_torso_cyborg=Torso Cyborg
item.pack_torso_cyborg.page=63
item.pack_torso_cyborg.desc=This cybertorso PACK makes it obvious that you have an armored torso, but it also includes a smuggling compartment.

item.pack_arm_excellence=Cyberarm Excellence
item.pack_arm_excellence.page=63
item.pack_arm_excellence.desc=This PACK is for those who want a cyberarm with excellent attributes and a natural appearance. Even if you aren't very agile or strong, this arm can make up for it. Or if you're already a badass, it can keep up with the rest of you.

item.pack_arm_secret=Cyberarm Secret Handshake
item.pack_arm_secret.page=63
item.pack_arm_secret.desc=This cyberarm PACK has the advantage of a smuggling compartment and a shock hand, all while appearing perfectly natural.

item.pack_arm_assasin=Cyberarm Assassin
item.pack_arm_assasin.page=64
item.pack_arm_assasin.desc=The Assassin cyberarm PACK provides high Agility to make sure you have the dice to take full advantage of a retractable cyberspur.

item.pack_arm_firearm=Cyberarm Firearm
item.pack_arm_firearm.page=64
item.pack_arm_firearm.desc=While it might be obvious that your arm is a cybernetic replacement, what isn't obvious is that you have a gun installed in it. Well, except for when you're shooting someone, or slot a clip into your arm. Then it's pretty obvious.

item.pack_arm_heavy_arm=Cyberarm Heavily Armed
item.pack_arm_heavy_arm.page=64
item.pack_arm_heavy_arm.desc=This cyberarm PACK is for anyone who prefers to throw as much lead at their enemies as quickly as possible. It's got the Strength enhancement to allow you to handle heavier weapons and the Agility to make sure you can fire them accurately, but the real draw here is a gyromount system that negates all recoil penalties. Rock and roll!

item.pack_leg_hollow=Cyberleg Hollow Boot
item.pack_leg_hollow.page=64
item.pack_leg_hollow.desc=It's always handy to have a smuggling compartment, on top of a DR bonus of +3 and an extra box for your Physical condition monitor.

item.pack_leg_springjack=Cyberleg Springheel Jack
item.pack_leg_springjack.page=64
item.pack_leg_springjack.desc=These cyberlegs are obvious, sure, but they are also obviously awesome! You can run fast, kick hard, and jump far, and get two more boxes on your Physical condition monitor. What more could you want?

item.pack_leg_springjugger=Cyberleg Springheel Juggernaut
item.pack_leg_springjugger.page=64
item.pack_leg_springjugger.desc=What more could you want? Armor plating, of course! These legs are just as capable as the unarmored version, but provide you with a total of +12 to your Defense rating. All it costs you is a lot more nuyen!

# Vehicle Packs
# packs-vehicles.xml
item.pack_veh_harley=Bikes-Armed Harley-Davidson Scorpion
item.pack_veh_harley.page=64
item.pack_veh_harley.desc=This chopper mounts a huge cannon on the front. Go big or go home!

item.pack_veh_growler=Bikes-Armed Yamaha Growler
item.pack_veh_growler.page=64
item.pack_veh_growler.desc=This off-road trike is equipped with a suppressed heavy machinegun. Even with a suppressor, the RPK is going to make some noise.

item.pack_veh_mirage=Bikes-Armed Suzuki Mirage
item.pack_veh_mirage.page=65
item.pack_veh_mirage.desc=This super-fast motorcycle is also armed to the teeth with an assault rifle/grenade launcher/shotgun combo. Note: The Yamaha Raiden is a silenced assault rifle with an underbarrel shotgun/grenade launcher. The weapon mount's ammunition bin can feed rounds to the assault rifle, but the underbarrel weapons must be reloaded by hand.

item.pack_veh_shin_hyung=Cars-Armed Hyundai Shin-Hyung
item.pack_veh_shin_hyung.page=65
item.pack_veh_shin_hyung.desc=The Hyundai Shin-Hyung is inexpensive, fast, and has excellent on-road handling. The drawback is that its light frame is not resistant to damage. So don't get shot.

item.pack_veh_americar=Cars-Armed Ford Americar
item.pack_veh_americar.page=65
item.pack_veh_americar.desc=The Ford Americar is a ubiquitous sedan, making it a useful tool for when you want to blend in. So why not install a nasty surprise, like a Panther cannon mounted in the trunk? The hardest part of owning one is resisting the temptation to use it on every fragger who rides your bumper in traffic.

item.pack_veh_westwind=Cars-Armed Eurocar Westwind
item.pack_veh_westwind.page=66
item.pack_veh_westwind.desc=This pack is fragging expensive, but it's also the most badass sports car on the market, made deadly by installing a rocket launcher mount. Ammunition reloads are very expensive, so make sure the target is worth spending one on. That said, this car is designed for speed, not combat durability. Blowing something up before it can shoot at you might be vitally important. This thing also comes with a reasonably competent pilot, so it's not too bad at driving itself. Note: The Pilot can only run two autosofts simultaneously. You may reconfigure which autosofts are loaded with a Minor Action.

item.pack_veh_bulldog=Vans-Armed GMC Bulldog
item.pack_veh_bulldog.page=66
item.pack_veh_bulldog.desc=The Bulldog step van is as common as the Ford Americar. It's also big, tough, and comes stock with a lot of armor. It's not very fast, and doesn't handle sudden maneuvers very well, on or off-road. This one has a pop-up turret with a big-ass machine gun. Perfect for hauling a team of runners around, and capable of taking as well as dishing out plenty of damage, and it's relatively inexpensive.

item.pack_veh_rover=Vans-Armed Range Rover
item.pack_veh_rover.page=66
item.pack_veh_rover.desc=The natural upgrade from the Bulldog van is the Range Rover Model 2080. This more expensive vehicle is tough, but also has the style and grace the Bulldog lacks. Better in almost every way-except for the price tag, of course. One of its benefits is a fairly competent pilot rating, allowing it to drive itself when needed. This PACK is armed to the teeth, with three weapon mounts: a rocket launcher, Panther cannon, and assault rifle. Note: The Pilot can only run two autosofts simultaneously. You may reconfigure which autosofts are loaded with a Minor Action.

item.pack_veh_roadmaster=Vans-Armed Ares Roadmaster
item.pack_veh_roadmaster.page=66
item.pack_veh_roadmaster.desc=A huge, heavily armored cargo truck, armed with the biggest machine gun on the market. Just don't expect to outrun much else. But hey, that's what the armor and weapon mount are for!

item.pack_veh_otter=Boats-Armed Samuvani Criscraft Otter
item.pack_veh_otter.page=66
item.pack_veh_otter.desc=This small motorboat is perfect for quick runs on the open water, whether that be an ocean, lake, river, or canal. If you run into trouble, you probably won't be able to stand up to any serious damage. That's why we added a rocket launcher. If that doesn't solve your problem, you'd better get the frag out of there!

item.pack_veh_nightrunner=Boats-Armed Aztechnology Nightrunner
item.pack_veh_nightrunner.page=66
item.pack_veh_nightrunner.desc=The Nightrunner is the ultimate smuggler's motorboat. Because you won't want to draw attention, a very powerful but silenced sniper rifle is the weapon of choice.

item.pack_veh_riverine=Boats-Armed GMC Riverine
item.pack_veh_riverine.page=67
item.pack_veh_riverine.desc=The Riverine is a heavy patrol boat, often used by security forces and coast guards, as well as runners, pirates, and smugglers. The Pilot rating is decent, allowing you to focus on other things while the craft takes its own helm. This boat is also heavily armed, with a rocket launcher and machine gun. It even has the durability to survive a light amount of incoming fire. Note: The Pilot can only run two autosofts simultaneously. You may reconfigure which autosofts are loaded with a Minor Action.

item.pack_veh_delfin=Subs-Armed YMC Delfin
item.pack_veh_delfin.page=67
item.pack_veh_delfin.desc=This small, consumer-grade submarine sees some use by smugglers and runners. And unlike the stock version, this one is capable of defending itself. By default, the rocket launcher operates only underwater as a torpedo launcher. If you choose, an above-water rocket launcher may be mounted instead, but it's of no use to you underwater. Note: You must choose whether or not the launcher is designed for underwater torpedoes or standard rockets. Torpedoes function just like rockets but can only be fired underwater. The submarine must surface in order to fire standard rockets.

item.pack_veh_pursuit=Drones, Small-Armed Wheeled
item.pack_veh_pursuit.page=67
item.pack_veh_pursuit.desc=These drones are so much fun to drive, and they come in a wide variety of models that make them look like miniature versions of various popular full-size cars. This one isn't designed for drone racing, though. A weapon mount with a silenced flechette pistol turns it into a stealthy combat drone. Just be careful not to get stepped on!

item.pack_veh_crawler=Drones, Small-Armed Walker
item.pack_veh_crawler.page=67
item.pack_veh_crawler.desc=The Aztechnology Crawler is a four-legged walker drone that is popular with security forces as an inexpensive patrol drone. This one mounts a heavy pistol with a silencer and plenty of ammo, making it a very useful tool for more delicate operations where a larger drone with a bigger gun might draw too much attention.

item.pack_veh_quadrotor=Drones, Small-Armed Rotor
item.pack_veh_quadrotor.page=67
item.pack_veh_quadrotor.desc=This quadcopter drone comes stock with an air-powered crossbow, which isn't a terribly effective weapon in most circumstances. Armed with Narcoject injection bolts and piloted by a skilled rigger, it becomes incredibly dangerous.

item.pack_veh_doberman_stealthy=Drones, Medium-Wheeled Stealthy
item.pack_veh_doberman_stealthy.page=67
item.pack_veh_doberman_stealthy.desc=The inexpensive Doberman is widely popular among security forces as well as shadowrunners. If you're looking to go in with as little noise as possible, an Ingram Smartgun submachine gun with an integral silencer and smartgun system is the perfect choice for its weapon mount.

item.pack_veh_doberman_loud=Drones, Medium-Wheeled Loud
item.pack_veh_doberman_loud.page=68
item.pack_veh_doberman_loud.desc=Security forces are much more likely to mount a bigger gun, like a Mossberg CMDT combat shotgun, on a Doberman. That weapon is dangerous and inexpensive, so why not follow suit?

item.pack_veh_nissan_samurai=Drones, Medium-Anthro
item.pack_veh_nissan_samurai.page=68
item.pack_veh_nissan_samurai.desc=The Nissan Samurai is a fragging human-sized robot with katana arms that mount a submachinegun in each hand. They're also dirt cheap, so don't be surprised if a security response team sends a wave of these after you the next time you set off an alarm. Don't panic, though. They aren't very tough. That said, they're cheap enough that a wily rigger might be able to use them for a distraction.

item.pack_veh_nissan_oni=Drones, Large-Anthro
item.pack_veh_nissan_oni.page=68
item.pack_veh_nissan_oni.desc=The Nissan Oni is the heavier version of the Samurai, with assault rifles and katanas for hands, and durable enough to make it a serious threat. Its relatively inexpensive price tag makes it a popular choice with security forces as well as gangers and runners.

item.pack_veh_roto_assault=Drones, Medium-Roto Assault
item.pack_veh_roto_assault.page=68
item.pack_veh_roto_assault.desc=The MCT-Nissan Roto-Drone is one of the most popular aerial combat drones of all time. It's inexpensive and capable of mounting heavier weapons than you'd expect. This PACK includes a weapon mount with a combat shotgun, useful at many ranges. This is a particularly popular option for security drones.

item.pack_veh_roto_support=Drones, Medium-Roto Fire Support
item.pack_veh_roto_support.page=68
item.pack_veh_roto_support.desc=Another variant of the Roto-Drone, this one is armed with a suppressed assault rifle, making it useful for long-range fire support and sniper roles.

item.pack_veh_roto_rocket=Drones, Medium-Roto Rocket Launcher
item.pack_veh_roto_rocket.page=68
item.pack_veh_roto_rocket.desc=This one is for when you want to make a big boom and have nuyen to burn. It's expensive, but you can mount a rocket launcher on one of these. The best part is always the look on their faces when they see the rocket on the way.

item.pack_veh_roto_grenade=Drones, Medium-Roto Grenade Barrage
item.pack_veh_roto_grenade.page=68
item.pack_veh_roto_grenade.desc=If you like the idea of launching rockets from a roto-drone, but don't have that much nuyen to burn, I suggest you turn your attention to grenade launchers! They have the added benefit of being able to use smoke and stun grenades, instead of only being able to blow things to pieces. They can do that too, though!

item.pack_veh_blackhawk=Drones, Medium-Airstrike
item.pack_veh_blackhawk.page=69
item.pack_veh_blackhawk.desc=All you need is a low profile drone with eight rockets.

item.pack_veh_lynx_ultimate=Drones, Large-Ultimate Combat
item.pack_veh_lynx_ultimate.page=69
item.pack_veh_lynx_ultimate.desc=The Steel Lynx is like a small tank but with legs that have wheels at the end of them. So much armor, and so very tough-it also is capable of mounting a ridiculous amount of firepower. It might be expensive, but it's worth it to have a heavy machine gun and a grenade launcher at your disposal.

item.pack_veh_lynx_budget=Drones, Large-Budget Heavy Combat
item.pack_veh_lynx_budget.page=69
item.pack_veh_lynx_budget.desc=If you want your own mini-tank but the idea of spending so much nuyen on one drone makes you uncomfortable, go with this PACK. It mounts an Ares Alpha assault rifle that comes with its own underbarrel grenade launcher. Sure, you have to manually reload the grenades, but if you need more than six grenades in one fight, maybe you ought to spring for the more expensive version.

item.pack_veh_lynx_crowd=Drones, Large-Crowd Control Steel Lynx
item.pack_veh_lynx_crowd.page=69
item.pack_veh_lynx_crowd.desc=This Steel Lynx variant is popular with security forces, with a combat shotgun usually loaded with gel rounds, a Narcoject-squirting gun, and a grenade launcher loaded with smoke and stun rounds.

item.pack_veh_dalmatian=Drones, Large-Sky Patrol Dalmatian
item.pack_veh_dalmatian.page=69
item.pack_veh_dalmatian.desc=This drone is often used as air support for crowd control security forces.

item.pack_veh_blacksky=Drones, Large-Elite Airstrike
item.pack_veh_blacksky.page=69
item.pack_veh_blacksky.desc=The Ares Black Sky is kind of like your own private fighter jet. When you need to call in an air strike, this is something that could make that happen. Just keep the drone moving for quick hit-and-run strikes. It's too expensive and fragile for heavy combat.

item.pack_rcc_backup=RCCs-Backup
item.pack_rcc_backup.page=69
item.pack_rcc_backup.desc=This rigger command console is for hobbyists rather than serious riggers. It's better than nothing if you need a backup or replacement console, and you're hard up for cash, or if you're mainly a driver that just dabbles in drones. Otherwise, invest more nuyen for something with a higher Firewall that's capable of running more software. Note: The Dronemaster can run up to three programs at once, counting autosofts and cyberprograms. You can slave up to nine drones to it.

item.pack_rcc_basic=RCCs-Basic
item.pack_rcc_basic.page=70
item.pack_rcc_basic.desc=The Spider is a fairly inexpensive RCC with decent capabilities for the nuyen. A serious drone rigger will spring for something better, but if drones are secondary for you, it's a solid choice. It's also very popular among gangs and lower-grade security forces. Note: The Dronemaster can run up to four programs at once, counting autosofts and cyberprograms. You can slave up to twelve drones to it.

item.pack_rcc_professional=RCCs-Professional
item.pack_rcc_professional.page=70
item.pack_rcc_professional.desc=This RCC PACK is what most serious drone riggers would consider. It's expensive, but not so expensive that you don't have money left over to buy drones, which is important! Note: The Poseidon can run up to five programs at once, counting autosofts and cyberprograms. You can slave up to fifteen drones to it.

item.pack_rcc_elite=RCCs-Elite
item.pack_rcc_elite.page=70
item.pack_rcc_elite.desc=The Ares Red Dog is one of the best investments a drone rigger can make. Its high Firewall makes your drones very resistant to hackers, and it's capable of running many programs at once. If running an army of drones is your main thing, you won't regret spending the extra nuyen on this PACK. Note: The Red Dog can run up to six programs at once, counting autosofts and cyberprograms. You can slave up to eighteen drones to it.

item.pack_autosoft_recon2=Autosofts-Recon 2
item.pack_autosoft_recon2.page=
item.pack_autosoft_recon2.desc=The Recon autosoft PACKs are designed for drones that are used to stealthily observe an area or target. They're usually smaller, airborne drones.

item.pack_autosoft_recon3=Autosofts-Recon 3
item.pack_autosoft_recon3.page=70
item.pack_autosoft_recon3.desc=The Recon autosoft PACKs are designed for drones that are used to stealthily observe an area or target. They're usually smaller, airborne drones.

