item.evo_landtreader=Evo Landtreader
item.evo_landtreader.page=88
item.evo_landtreader.desc=Built with a durable electrical engine and a modified chassis style reminiscent of the many Segway designs of old, the Landtreader is a three-wheeled design that supports an upright lounge apparatus with a water-renewal system for water-breathers who wish to travel onto land for extended lengths of time. The refresher system can function for nearly twenty-four hours without the need for refreshing the contents and filters.

#Metatypes
#metatypes.xml
metatype.duende=Duende
metatype.duende.page=75
metatype.duende.desc=<b> • Average height:</b> 1.1 meters<br/>\
 <b>• Average weight:</b> 55 kg<br/>\
 They are part of the pumilionis subspecies, and the name duende has been assigned to them. The largest population of this metavariant originated in the Philippines, but other communities have been confirmed in the African nations of Mali-Foso and Niger and in Peru on the South American continent. Noted for their nearly ebon-black smooth skin, almost bleached white or blonde hair, and penetrating purple eyes, the duende are pumilionis stock who have suffered significant genetic modification. Originally identified by Purinsu Ribon, a transgenics subsidiary of Shiawase that focused on DNA research and the Metahuman Genomic Project, the duende have recombinant RNA that resembles the HMHVV variant found in goblins (Infected dwarfs).<br/>\
 Duende possess solar urticaria, or sun sickness, to an extremely dangerous level, which prevents them venturing out in daylight except during heavy cloud coverage. They possess the same resistance to toxins of their pumilionis parent, as well as visual acumen that both stretches into the thermographic spectrum and gives them low-light vision. They are also exceptionally fast, not only in general movement, but in reaction times as well. That detail has cost many antagonists a decent share of broken bones and busted jaws. The duende also have a driving hunger for meat protein: beef, poultry, fish, etc.<br/>\
 What stands out among their traits is that they have some natural immunity to all known forms of the human-metahuman vampiric virus, including the Krieger strain that creates Ghouls.
metatype.gnome=Gnome
metatype.gnome.page=75
metatype.gnome.desc=<b> • Average height:</b> 0.8 meters<br/>\
 <b>• Average weight:</b> 37 kg<br/>\
 Gnomes are shorter than dwarfs and have much less body hair, but they share the thermographic vision of their species relatives. Perhaps their most compelling characteristic is their inherent resis- tance to most forms of magic.<br/>\
 Gnomes are widely scattered across the world, with significant numbers in Central Europe and Asia Minor. Their lack of concentrated populations means that gnomes often don’t form their own culture, but rather adopt the customs of the areas where they are born.
metatype.hanuman=Hanuman
metatype.hanuman.page=77
metatype.hanuman.desc=<b> • Average height:</b> 1.2 meters<br/>\
 <b>• Average weight:</b> 49 kg<br/>\
 When first encountered, hanumans were wrongly codified as a type of Awakened monkey (Macaca mulatta; the rhesus macaque) principally in the Indian subcontinent. Later studies confirmed them as a variant on the pumilionis metatype. <br/>\
 Hanumans possess the thermographic vision and decreased height of dwarfs but vary greatly beyond that. They are named for the Hindu god Hanuman and possess several monkey-like characteristics, such as elongated limbs, feet and hands; profuse lower-body hair; a lack of facial hair; an expanded aural helix (face); and a prehensile tail. These all combine to make an agile species, often adept at climbing and acrobatics.<br/>\
 Hanuman populations of the world have begun to spread beyond their small collectives. Many hanumans have started entering the megacorporate world thanks to not only Evo but also Regency Megamedia and Horizon.
metatype.koborokuru=Koborukuru
metatype.koborokuru.page=77
metatype.koborokuru.desc=<b> • Average height:</b> 1.1 meters<br/>\
 <b>• Average weight:</b> 42 kg<br/>\
 The koborokuru variant maintains the thermographic vision, decrease in height, sharply featured angular faces, and toxin resistance of mainline dwarfs. They express more diversly in eyes, body hair, and overall musculature. Their eyes are commonly almond-shaped, and their body and facial hair are less than other pumilionis types, which is often reflected in fewer or shorter beards and shorter or sparser hair. Muscle density is lower than the common dwarf, as is their overall bulk. They possess a slimmer, more muscular tone and a higher metabolic rate.<br/>\n
 The koborokuru metavariant is most common in Japan, especially among the Ainu peoples of Hokkaido. They have had trouble finding acceptance in Japan, so many are moving to more accepting countries, such as the NAN, CalFree State, India, Yakut, Ecuador, Amazonia, and Vatican City. The latter’s status connects to the sanctuary provided to koborokuru children shortly after the Awakening.
metatype.menehune=Menehune
metatype.menehune.page=77
metatype.menehune.desc=<b> • Average height:</b> 1.1 meters<br/>\
 <b>• Average weight:</b> 42 kg<br/>\
 This metavariant possesses thermographic vision, comparable height to the main dwarf line, and a slightly pointed face. They are more profuse in their body hair, with their thick, full eyebrows being particularly notable. Their nasal protrusions are generally broad and flat, possessing a muscular flap within the nostrils that closes, preventing water from entering. They have long, webbed feet with additional dermal layers that make them a lot like swim fins. Their overall muscle density is less than to the baseline pumilionis variant, and they have an additional thin layer of insulating fat across their bodies. All this, combined with nictating membranes over their eyes, makes the species extremely well adapted to aquatic life.<br/>\
 Originally believed to be native to the Kingdom of Hawaii’s surrounding waters, they actually come from transoceanic coastlines, and they are now seen throughout the world. Many communities of menehune share their territories with other sapient marine lifeforms such as merrow, meistersingers, sea drakes, and several rumors say they serve as spies and structural engineers within the Sea Dragon’s sponsored locales.
metatype.dalakitnon=Dalakitnon
metatype.dalakitnon.page=78
metatype.dalakitnon.desc=<b> • Average height:</b> 1.7 meters<br/>\
 <b>• Average weight:</b> 80 kg<br/>\
 Dalakitnon stem originally from the Philippine Islands, resembling characters of local legends. They are fair-skinned, nearly to the point of albinism, with blonde or white hair and no philtrum on their upper lips. They also possess an unusual allergy to spices, primarily garlic, mustard, sage and cinnamon.<br/>\
 Dalakitnon possess a unique quality that has not been discovered in any of the other metahuman and metavariants species. This is gender transmorphism, which means they can change their outer gender expression at various times.
metatype.dryad=Dryad
metatype.dryad.page=78
metatype.dryad.desc=<b> • Average height:</b> 1.75 meters<br/>\
 <b>• Average weight:</b> 63 kg<br/>\
 This <i>nobilis</i> metavariant appears remarkably similar to the parent line, having a slight decrease in height, as well as being more slender and fair-haired. The ability to accurately identify, study, and understand them was impeded for years due to their supernatural glamour properties, which they used frequently to interfere with observers. These obstacles were changed when grants from the Apep Consortium enabled teams to reach out and engage populations of dryads in the Papua-New Guinea isles.<br/>\
 Dryads often possess strong supernatural prowess. Because of their strong symbiotic nature, they often keep close association to natural environments, which they strongly defend. A few dryads have begun to venture forth farther and farther abroad into the world, though all eventually return to their home territories.
metatype.nocturna=Nocturna
metatype.nocturna.page=78
metatype.nocturna.desc=<b> • Average height:</b> 1.9 meters<br/>\
 <b>• Average weight:</b> 80 kg<br/>\
 The Night Ones. Blackhearts. Dark elves. This metavariant of the nobilis subspecies has suffered greatly among many societies, especially those of a more superstitious leaning. Nocturna exhibit mostly the same expressions of the nobilis parent, with increased body hair growth, slightly reduced auditory sensitivity, and strong hypersensitivity to bright lights. That last leads most nocturna to be, well, nocturnal. Their body hair is a layer of short, dark fur covering that usually covers their face. The same hair is not found on their palms, bottoms of their feet, eyelids, and genitalia. This body fur is often black, sometimes it is violet or deep purple. Even less common colors include deep burnt orange, dark green, and tarnished bronze.<br/>\
 Nocturna biorhythms are directly tied to the night/day cycle, and they prefer nighttime activities. The reasons for this are still being pursued, but even genetic therapies have been unsuccessful in changing this for a sustained period. When by necessity or choice they are awake during daytime hours, they suffer in much the same manner than other individuals might if they stayed up too late, showing increasing fatigue and stress.
metatype.wakyambi=Wakyambi
metatype.wakyambi.page=79
metatype.wakyambi.desc=<b> • Average height:</b> 2.3 meters<br/>\
 <b>• Average weight:</b> 145 kg<br/>\
 Wakayambi were perhaps the most isolated metavariant at one point. They possess the same low-light vision as elves, and the longevity as well, but they are notable for their height—wakayambi hit the same three-meter heights as trolls. Most have the dark skin and tightly curled hair common in Africa, though there are now two confirmed individuals with albinism.<br/>\
 Wakyambi are more disposed to magic abilities than most metatypes. Most individuals continue to dwell in tight-knit communities in Azania, with many of their youth venturing out into the world during their “Dreamwalk,” which normally lasts about five years. The Evo Metaergonomics agreement with the Zulu nation, combined with greater understandings that come with time and patience, have encouraged wakayambi tribes to slowly integrate with some elements while developing and adopting green technologies such as solar and wind generators and newer water reclamation technologies. They use no combustible fuels and produce no toxic waste sites.
metatype.xapiri_thepe=Xapiri Thëpë
metatype.xapiri_thepe.page=79
metatype.xapiri_thepe.desc=<b> • Average height:</b> 1.7 meters<br/>\
 <b>• Average weight:</b> 57 kg<br/>\
 This metavariant of the nobilis subspecies remains the most self-isolating of all. They possess the same low-light vision, longevity, and fair hair as their nobilis parent, and their skin is their most striking feature. It produces chlorophyll within patches of chloroplast-containing cells, allowing them to produce energy through photosynthesis. The dermis layers begin with these patches around the aural, cranial, and posterior portions of their bodies, expanding as they get older, with those reaching full maturity (roughly forty-five years of age) having the patches across their entire body.<br/>\
 Xapiri thëpë have been working to maintain their isolation with greater zeal due to the discovery that their skins are detectable in certain wavelengths of ultraviolet light, which generates a photoreactive response in them. They decided if they can be more easily detected, they should put in extra effort to remain out of sight.
metatype.nartaki=Nartaki
metatype.nartaki.page=81
metatype.nartaki.desc=<b> • Average height:</b> 1.75 meters<br/>\
 <b>• Average weight:</b> 86 kg<br/>\
 The earliest known metavariant of the H. sapiens sapiens documented at this time was first confirmed in the Indian Union during the years leading up to and during the passing of Halley’s Comet in 2061 and then again in 2077 with the McNaught Comet. There was an additional surge within the Ganges River that was attributed to an additional five hundred individuals abruptly expressing as nartaki, with all of these being female during the Holi celebrations in 2076.<br/>\
 Nartakis are readily identified by their extra arms—they have one or more extra pairs. This, combined with varying skin colors and tones, make the nartaki stand-out in nearly any crowd. The additional sets of appendages set nartakis apart as one of the few six- or eight-limbed mammals in nature. Nartakis have also been discovered to possess greater-than-average strength, stemming from a variety of factors including adapted muscular, skeletal, and even hematological support within their body.<br/>\
 Additional groupings of nartakis were discovered to be living in the Arabian Caliphate and within the uncontacted tribes of the deep Amazon. This latter information was found through growing communications from the Kawahiva and Yanomami peoples, as part of the FUNAI organization.
metatype.nartaki2=Nartaki 2
metatype.nartaki2.page=81
metatype.nartaki2.desc=<b> • Average height:</b> 1.75 meters<br/>\
 <b>• Average weight:</b> 86 kg<br/>\
 The earliest known metavariant of the H. sapiens sapiens documented at this time was first confirmed in the Indian Union during the years leading up to and during the passing of Halley’s Comet in 2061 and then again in 2077 with the McNaught Comet. There was an additional surge within the Ganges River that was attributed to an additional five hundred individuals abruptly expressing as nartaki, with all of these being female during the Holi celebrations in 2076.<br/>\
 Nartakis are readily identified by their extra arms—they have one or more extra pairs. This, combined with varying skin colors and tones, make the nartaki stand-out in nearly any crowd. The additional sets of appendages set nartakis apart as one of the few six- or eight-limbed mammals in nature. Nartakis have also been discovered to possess greater-than-average strength, stemming from a variety of factors including adapted muscular, skeletal, and even hematological support within their body.<br/>\
 Additional groupings of nartakis were discovered to be living in the Arabian Caliphate and within the uncontacted tribes of the deep Amazon. This latter information was found through growing communications from the Kawahiva and Yanomami peoples, as part of the FUNAI organization.
metatype.valkyrie=Valkyrie
metatype.valkyrie.page=81
metatype.valkyrie.desc=<b> • Average height:</b> 1.76 meters<br/>\
 <b>• Average weight:</b> 115 kg<br/>\
 So yes, everyone, we have “angels” among us. These are not individuals with vestigial wings, but fully functional wings that, when combined with innate magical abilities, enable actual flight. In India and the SAW they are known not as valkyries but as Garuda ke Santaan (Child of Garuda) or just “<b>garudan</b>.”<br/>\
 On average, valkyries are normal human height from toe to cranium, with their wings rising another half to full meter above them. Female valkyries have light colors and shades on their wings, ranging from white to wheat and sometimes oranges and reds, like what one might witness during a sunset. Males tend toward grey and include deep violet, blue, and even a raven-like black. Non-binary individuals can match either of those appearances, a blend of the two, or their own thing, with some deep greens seen on their wings. Observation of individuals in the Scand Union and the Indian Union show that valkyrie reproduction is essentially the same as H. sapiens sapiens. Unlike the raptors, valkyries do not suffer from alterations to their bone formation or density. They possess a thumb-claw at the vertex of their wings that is capable of inflicting significant damage.
metatype.hobgoblin=Hobgoblin
metatype.hobgoblin.page=82
metatype.hobgoblin.desc=<b> • Average height:</b> 1.8 meters<br/>\
 <b>• Average weight:</b> 98 kg<br/>\
 Hobgoblins share the low-light vision trait of the H. sapiens robustus line but little else. They exhibit green skin hues tone ranging from a dull ocher to vibrant forest green. They possess a slighter build and a reduction in musculature. Their jaw structure differs, too, lacking the enlarged lower canines. Instead, they have sharpened teeth throughout their narrower jawline. Their eyes are completely black, lacking distinctive separation of the sclera, pupil, and cornea. The final distinction is the reduced propensity for body hair.<br/>\
 Hobgoblins are among the more inherently fierce and determined of all the metavariants. Once it was discovered that their tempers and mood swings were linked to frequent shifts in their hormonal expressions, options to help members of this metavariant with treatments were pursued. And while many of the community and clan representatives utilize these medications when interacting with outsiders, among themselves it considered a matter of pride and honor to simply be, in all their emotive and expressive glory.
metatype.ogre=Ogre
metatype.ogre.page=83
metatype.ogre.desc=<b> • Average height:</b> 1.7 meters<br/>\
 <b>• Average weight:</b> 101 kg<br/>\
 Ogres possess much of the same physical characteristics of their H. sapiens robustus stock, including low-light vision, muscular bulk, enlarged lower canines, and the pointed aural helix of their primary subspecies. This expression, originally documented in larger numbers throughout Europe and central Asia, are somewhat shorter than orks in nature, with smoother skin along with a protruding jaw and a wider mouth. They have a stronger digestive tract, which enables them to consume non-standard food sources such as tin cans and other refuse (though this provides very little in actual nutritional value). They were accused of cannibalism in the 2040s, but that has been disproven.<br/>\
 In the decades following the clarifications of their digestive natures, ogres have been making inroads toward a greater degree of social ostracization, but many still find obstacles in populated areas with mindsets steeped in the older stories. They’re helped by the fact that they are not far off from human appearance, though their muscular build often leads to them to physical labor.<br/>\
 Ogres make up a growing percentage of European ork populations and have taken their oft-encountered bias in stride.
metatype.oni=Oni
metatype.oni.page=83
metatype.oni.desc=<b> • Average height:</b> 1.9 meters<br/>\
 <b>• Average weight:</b> 128 kg<br/>\
 Along with the koborokuru, the oni were first encountered in Imperial Japan. As a variant of the robustus classification, they were the target of hatred, fear, and even genocide during the years of their expression. During the initial years of goblinization, having an individual suddenly and violently express into an oni metavariant was indeed shocking. They share the enhanced vision and muscular development of the robustus subspecies, but similarities pretty much end there. The skin tone of an oni comes in three vibrant shades: bright red, blue, and orange. When combined with a sharply angular eye structure, they gain a fierce and often unforgettable visage. Their ears are prominent, which some observers think gives them an elvish cast. All this cranial composition is then made even more pronounced with horns that rise from an individual’s temples.<br/>\
 To this day, oni are only expressed within those of Japanese heritage, having no other variants documented anywhere upon the planet. They are numerous on the Japanese mainland, which of course also means they are the predominant ork subspecies on Yomi Island. The word oni has Japanese roots, referring to demons found in Japanese folklore.
metatype.satyr=Satyr
metatype.satyr.page=83
metatype.satyr.desc=<b> • Average height:</b> 1.6 meters<br/>\
 <b>• Average weight:</b> 69 kg<br/>\
 Satyrs are perhaps the most striking and socially memorable robustus subspecies. Satyrs have the low-light vision and some additional muscular bulk, and they vary in facial shape, leg structure, and overall body mass. They also have short horns that are often swept back, extending from above the temples, though a variety of forms have ram- and bull-like horns. Satyrs have elongated jaws, with slender nasal features and cheekbones, along with smaller lower canines than other robustus expressions.
metatype.cyclops=Cyclops
metatype.cyclops.page=85
metatype.cyclops.desc=<b> • Average height:</b> 2.7 meters<br/>\
 <b>• Average weight:</b> 421 kg<br/>\
 A metavariant that was first seen populating the Aegean Sea and its many islands, cyclops are even bulkier than trolls and have little body hair, even on top of their head. They are most famous for their large, single eye placed near the middle of their head. Their original Mediterranean heritage gifted them with deeply bronzed skin, they lack their parent subspecies’ dermal deposits. They typically have a singular horn, when they have horns at all. A few rare individuals have multiple horns, placed irregularly in their heads. The inconvenience of those horns led some cyclops to remove them. Some medical specialists thought that implanted eyes could give cyclops binocular vision, but that didn’t work. Even when they have the ocular structures, they don’t have the neural capacity to interpret signals from two eyes. Rather than giving them better vision, a second eye just gives them headaches. Due to its large size, their single eye provides reasonable depth perception.
metatype.fomorian=Fomorian
metatype.fomorian.page=86
metatype.fomorian.desc=<b> • Average height:</b> 2.35 meters<br/>\
 <b>• Average weight:</b> 224 kg<br/>\
 This metavariant possesses the same visual abilities, heavy musculature, pronounced horns, and enlarged lower canines as the primary ingentis metatype. Where they differ from most of their genetic peers is in their shorter stature and reduced dermal deposits. Their horns are slimmer than those of most trolls, and that helps ease the prejudice other trolls frequently face. An unusual quality of the fomori is that when reaching adulthood, they all hit a similar height, usually within ten centimeters of each other.
metatype.giant=Giant
metatype.giant.page=86
metatype.giant.desc=<b> • Average height:</b> 3.0 meters<br/>\
 <b>• Average weight:</b> 467 kg<br/>\
 Where most people think trolls are big, there is one metavariant that quite literally stands heads above the others. Giants average a full three meters in height, with a handful of individuals documented at between three-and-a-half to four.<br/>\
 Lacking the horns and dermal bone deposits of trolls while sharing the heavy-set physique and musculature, giants enjoy luxurious facial hair in the males and bak-like, leathery skin adding to their rugged, outdoorsy look. Because of their height, their musculature is spread out more, giving them a more slender appearance that most other members of the ingentis subspecies. Giants are also one of the metavariants who have an uncommon genetic reversion—one in four of their female offspring will randomly express to human (H. sapiens sapiens). This odd genetic reversion occurs most frequently during the teen years, but it has been observed in one individual who was in her late thirties. The reasons for this are still being explored, with research thus far not indicating external stimuli such as geography, ambient aetheric under-exposure (i.e., mana ebbs or voids), or a parentally associated revertant being relevant factors.
metatype.minotaur=Minotaur
metatype.minotaur.page=86
metatype.minotaur.desc=<b> • Average height:</b> 2.4 meters<br/>\
 <b>• Average weight:</b> 285 kg<br/>\
 Minotaurs have no bull DNA in them, but they have horns, wide-set eyes, and wide, flat noses that look bovine. That’s how they got their name. Their build, shorter and stockier than other trolls, doesn’t make them any less bull-like.<br/>\
 Minotaurs first appeared in the Greek Islands and parts of the Aegean Sea, with second generations expressing as far as Istanbul (Constantinople), the Isle of Cyprus, and Barcelona. While their common name might make people think they are great at spelunking through cavern systems, they are in fact finding a strong foothold in shipping and maritime profession, with many gaining corporate citizenship with Maersk, along with their kindred, the giants. SpIn, Saeder-Krupp, and Evo (of course) have also opened their doors to the citizenship and employment opportunities for minotaurs.
metatype.centaur=Centaurs
metatype.centaur.page=87
metatype.centaur.desc=<b> • Average height:</b> 2.1 meters<br/>\
 <b>• Average weight:</b> 435 kg<br/>\
 Originally found almost exclusively in the Grecian highlands, and later discovered in the great plains of North America and the pampas of South America, these beings come in considerable variety. They typically have a horse body (though variants of other quadrupeds have appeared) and metahuman torso, head, and arms. Usually the torso is human, though ork and elf variants are known.
metatype.merrow=Merrow
metatype.merrow.page=87
metatype.merrow.desc=<b> • Average height:</b> 2.85 meters<br/>\
 <b>• Average weight:</b> 375 kg<br/>\
 Merrow are a marine species with a somewhat ork-like upper torso, often with ornate fins and ridges along their aural crest and running down their back, sometimes reaching their lower half of their bodies, which are that of a scaled cetacean.<br/>\
 Their eyes are larger than a metahumans by nearly fifty percent. When combined with their increased proportions of rods and cones, they receive a wide visual spectrum, extending even to the ultraviolet spectrum. Their entire cranial shape has a pronounced jawline that contains thirty-eight teeth, six more than human/metahuman skulls contain, and elongated nasal passages that along with their gill slits of the upper chest, sometimes give them a seahorse-like appearance. They are capable of speech and other complex vocalizations—they kept this a secret for nearly as long as the naga did in order for them to get a better understanding of surface dwellers and our many idiosyncrasies without the bother of having to respond to us.<br/>
 Their body colors are similar tones and shades of their aquatic dwellings, likely for camouflage purposes. During times of high stress or courtship rituals, their secondary and pectoral fins often change color and flare out in incredible displays.
metatype.naga=Naga
metatype.naga.page=88
metatype.naga.desc=<b> • Average height:</b> 6.9 meters<br/>\
 <b>• Average weight:</b> 245 kg<br/>\
 Physically, the naga look like large serpents with physical variations that resemble the more mundane forms of snakes, kraits, vipers, constrictors and even cobras. Nagas frequently possess active magical prowess on par with or even higher than most metahumans. Their infiltration into the corporate aspects of our world has progressed to the point that within the ever-open arms of Evo, a naga now sits as the current CEO. They average ten meters in length and just under a meter in girth, though the “naga lords” of Amazonia, seemingly based on anaconda snakes, have been known to get as large as thirteen to fourteen meters long with a meter and half or more in girth.<br/>\
 In combat, nagas fall back to their natural strengths—speed for some of them, strength for others. Many of the population have the venom found in mundane species but of a stronger potency, thanks to their inherent magic.
metatype.naga.item.bite=Bite
metatype.naga.item.bite.page=90
metatype.naga.item.bite.desc=Natural Weapon (Bite: DV 3P, 8/-/-/-/-)
metatype.pixie=Pixie
metatype.pixie.page=89
metatype.pixie.desc=<b> • Average height:</b> 0.6 meters<br/>\
 <b>• Average weight:</b> 19 kg<br/>\
 Pixies are generally believed to have fae heritage, which has made proper classification of them difficult. Their odd habit of vanishing upon death has also puzzled scholars. Recently, select anthropologists and parabiologists were permitted to travel to the Seelie Court in a quest to learn more about the massive diversity of metaplanar beings. And while neither vivisections nor dissections were allowed or performed, with various tools and support from the Courts, a workable taxonomy was completed over two years in conjunction with Renraku’s Australian Institute of Magical Research and Genecraft subsidiaries.<br/>\
 One outcome of the research is the discovery of methods for certain cybernetic implants using methods found in beta and delta clinics. This has allowed pixies to permeate more parts of the world. Amazingly, these techniques do not push the individual to the brink of actual death, but they still approach the threshold. What remains unclear is what happens to a pixie’s body when they die. No one at the Seelie Courts or the Korrigan Circles have the answer.
metatype.sasquatch=Sasquatch
metatype.sasquatch.page=90
metatype.sasquatch.desc=<b> • Average height:</b> 2.4 meters<br/>\
 <b>• Average weight:</b> 244 kg<br/>\
 Sasquatches possess many secrets, including where and how they were hiding before the Sixth World. While sasquatch is the common name for the species, they have geographic variations, such as the yeti of the Himalayas, the skunk ape of the CAS, and the yowie of Australia’s Kakadu territories and Papua New Guinea. Normally standing a full three meters in height, with a body covered in vast, rich hair in colors usually adapted from their indigenous territories, running a gamut from dark browns and black to tan and blondes all the way to thick russet red and the ivory whites of the Himalayas.<br/>\
 Sasquatch communicate using sign language due to vocal limitations, though they have some ability to emit high-pitched sounds, often imitating birds if their native regions.<br/>\
 While most sasquatches are formally uneducated, they can study and adapt. Their communication abilities can be enhanced with virtual sign translation gear, gloves that convert sign language to text or aural words.
metatype.sasquatch.item.kick=Claws
metatype.sasquatch.item.kick.page=90
metatype.sasquatch.item.kick.desc=Natural Weapon (Claws: DV 3P, 10/-/-/-/-)

critterpower.vanishing=Vanishing
critterpower.vanishing.page=89
critterpower.vanishing.desc=This ability is most often associated with beings and creatures from the fae metaplanes. This allows beings to literally disappear from the terrestrial world without any trace. When the beings vanish, so does any their personal gear they have upon their self or immediately in their grip (the gamemaster has the final say on what vanishes). In most cases, Vanishing is triggered upon the fae's death. In some instances, this can be done intentionally, but re-entry to the terrestrial world can only be done at places of strong fae nature (again, gamemaster discretion).

