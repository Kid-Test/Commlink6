# Lifemods
lifemod.it_support=IT Support
lifemod.it_support.page=40
lifemod.it_support.desc=This life module should be preceded by the Technical School life module. Technical difficulties cost megacorps a staggering amount of nuyen, so it's no surprise that highly trained professionals are widely employed for the express purpose of resolving these difficulties as soon as they are discovered.<br/>You further developed your Matrix expertise and made good money as you did.
