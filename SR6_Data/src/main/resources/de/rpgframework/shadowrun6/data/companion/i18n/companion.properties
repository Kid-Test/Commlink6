item.pack_shot_defiance1=Shotgun-Defiance T-250
item.pack_shot_defiance1.page=57
item.pack_shot_defiance1.desc=Shotguns are powerful and generally inexpensive assault weapons with high attack ratings and lots of range. With the exception of the short-barrel Defiance T-250 and Remington Roomsweeper, concealing them is not an option. And all of them are going to be loud.

