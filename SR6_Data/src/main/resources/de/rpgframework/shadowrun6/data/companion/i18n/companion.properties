item.pack_cross_light=Crossbow-Light
item.pack_cross_light.page=56
item.pack_cross_light.desc=Crossbows are especially effective when equipped with injection bolts. They're also quite silent. Also, the Athletics skill is used to fire them, which makes them a perfect backup weapon for a character with no other combat skills.

