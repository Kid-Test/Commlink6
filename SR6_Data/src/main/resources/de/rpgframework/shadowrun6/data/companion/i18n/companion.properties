item.pack_mp_crusader=Machine Pistol-Ares Crusader II
item.pack_mp_crusader.page=57
item.pack_mp_crusader.desc=The Ares Crusader is an incredible deal, with integrated smartgun and gas-vent systems for a very low price. All come with concealable holsters.

item.pack_mp_scorpion1=Machine Pistol-Ceska Black Scorpion Smart
item.pack_mp_scorpion1.page=57
item.pack_mp_scorpion1.desc=Two variants of the Ceska Black Scorpion are presented here; the difference between these two PACKs based on the same machine pistol is the smartgun system versus a laser sight. Most runners tend to prefer smartlinks, but a laser sight is a lot harder for enemy hackers to mess with and requires no extra gear to utilize. All come with concealable holsters.

item.pack_mp_scorpion2=Machine Pistol-Ceska Black Scorpion
item.pack_mp_scorpion2.page=57
item.pack_mp_scorpion2.desc=Two variants of the Ceska Black Scorpion are presented here; the difference between these two PACKs based on the same machine pistol is the smartgun system versus a laser sight. Most runners tend to prefer smartlinks, but a laser sight is a lot harder for enemy hackers to mess with and requires no extra gear to utilize. All come with concealable holsters.

item.pack_mp_tmp=Machine Pistol-Steyr TMP
item.pack_mp_tmp.page=57
item.pack_mp_tmp.desc=The Steyr TMP's claim to fame is a full-auto firing mode. All come with concealable holsters.

item.pack_heavy_predator1=Heavy Pistol-Ares Predator VI
item.pack_heavy_predator1.page=57
item.pack_heavy_predator1.desc=These PACKs include several variations of accessories and modifications for some of the most popular pistols on the market. Some take full advantage of modern technological upgrades, while others are modified as throwbacks so that it becomes impossible to hack them, with the drawback of no smartlink.

