#Quality Paths

qpath.critter_bond=Critter Bond
qpath.critter_bond.page=138
qpath.critter_bond.desc=This path is about forming a relationship with a critter, looking at how that relationship can affect a shadowrunner and their emotions. <br/>Game Effect: The path starts when you form a close bond with a single critter. Maybe it’s a stray dog you started to feed and then didn’t go away. Or maybe it’s your trusty horse. Or a devil rat who would hang out in the same sewers you would, and eventually you just kind of accepted each other and got used to being in the same space. Whatever the case, there is a critter that you view as yours, and you have grown to care about it.<br/>You must have the Critter Trainer (p. 133) quality in order to start this quality path. Once you have taught one of your critters its maximum number of commands, you may choose to form a bond with it. Spend one week bonding with the critter and make a training test. Once the bond is formed, the maximum number of commands the critter may learn is increased by your ranks in Influence. When you spend a Minor Action to command your bonded critter, you may issue up to two commands at once. Whenever your critter takes an action at your command, gain a point of Edge that must be used on the critter's test, or it is lost. You may also spend your own Edge on the critter's tests, but only when they are acting on your commands.
qpath.critter_bond.step.critter_initial_bond=Initial Bond
qpath.critter_bond.step.critter_initial_bond.page=139
qpath.critter_bond.step.critter_initial_bond.desc=The path starts when you form a close bond with a single critter. Maybe it's a stray dog you started to feed and then didn't go away. Or maybe it's your trusty horse. Or a devil rat who would hang out in the same sewers you would, and eventually you just kind of accepted each other and got used to being in the same space. Whatever the case, there is a critter that you view as yours, and you have grown to care about it.
qpath.critter_bond.step.critter_greater_bond=Greater Bond
qpath.critter_bond.step.critter_greater_bond.page=139
qpath.critter_bond.step.critter_greater_bond.desc=Bonds tend to deepen over time, and Greater Bond shows a closer relationship between the runner and their animal friend.<br/>Game Effect: Once your bonded critter has learned its maximum number of commands (counting the extra ones from your Influence ranks), your bond deepens. You become eligible to spend the Karma cost to deepen the critter bond. Once the Greater Bond has been formed, you are no longer required to use pre-defined commands. You may spend a Minor Action to give your critter any instructions you choose, and it will understand and obey to the best of its abilities. Any Edge actions or boosts you use on behalf of your bonded critter cost fifty percent less Edge (rounded up).
qpath.critter_bond.step.critter_improvement=Permanent Improvement
qpath.critter_bond.step.critter_improvement.page=139
qpath.critter_bond.step.critter_improvement.desc=The training of a critter can improve what the critter can do, building their skills and capabilities.
qpath.critter_bond.step.critter_lost=Lost
qpath.critter_bond.step.critter_lost.page=139
qpath.critter_bond.step.critter_lost.desc=Your critter is lost! At some point, the character and their critter might become separated. The critter may wander away, or be taken, or otherwise be separated from the player. The good news is, there's a chance that they're still alive, and that you might be able to find them.
qpath.critter_bond.step.critter_broken=Broken Trust
qpath.critter_bond.step.critter_broken.page=139
qpath.critter_bond.step.critter_broken.desc=Sometimes a relationship goes awry, especially when one party pushes the other too hard and ignores important boundaries. This quality takes effect if the PC does something to horribly mistreat their critter (gamemaster discretion as to where that boundary lies).<br/>Game Effect: When the relationship with a critter moves to this quality, your critter will no longer respond to your commands. At the gamemaster's discretion, it may even attack you or run away. It's possible that this broken trust will lead to a permanent severing of the relationship; if you and your critter stay away from each other for more than a month, move on to the Saying Goodbye quality. If you wish to restore your bond, you must spend at least one week training with your critter and succeed at a training test. However, you may not gain or spend Edge on the training test, and you only get one chance. If you succeed, the bond is restored, and this quality is eliminated. If you ever trigger this quality again, though, you may not attempt to restore the bond-it is broken forever. You gain the Critter Dominator quality (p. 132) with no expenditure of Karma, but all qualities associated with this path are lost. If you choose to bond another critter, all Karma costs are doubled.
qpath.critter_bond.step.critter_goodbye=Saying Goodbye
qpath.critter_bond.step.critter_goodbye.page=139
qpath.critter_bond.step.critter_goodbye.desc=At some point, the bond between character and critter ends. Whether it's death, distance, or some other factor that causes the separation, the connection between the two is permanently severed.
step.critter_initial_bond.choice.crittertype=Critter Type
step.critter_initial_bond.choice.crittertype.mundane_herbivore=Mundane Herbivore
step.critter_initial_bond.choice.crittertype.mundane_herbivore.desc=Dependents quality (p. 75, SR6) at level 1 for a mundane herbivore or omnivore.
step.critter_initial_bond.choice.crittertype.mundane_carnivore=Mundane Carnivore
step.critter_initial_bond.choice.crittertype.mundane_carnivore.desc=Dependents quality (p. 75, SR6) at level 2 for a mundane carnivore.
step.critter_initial_bond.choice.crittertype.awakened_emerged=Emerged or Awakened
step.critter_initial_bond.choice.crittertype.awakened_emerged.desc=Dependents quality (p. 75, SR6) at level 3 for an Awakened or emerged critter.
quality.critter_initial_bond=Initial Bond
quality.critter_initial_bond.page=139
quality.critter_initial_bond.desc=The path starts when you form a close bond with a single critter. Maybe it's a stray dog you started to feed and then didn't go away. Or maybe it's your trusty horse. Or a devil rat who would hang out in the same sewers you would, and eventually you just kind of accepted each other and got used to being in the same space. Whatever the case, there is a critter that you view as yours, and you have grown to care about it.<br/>Game Effect: You must have the Critter Trainer (p. 133) quality in order to start this quality path. Once you have taught one of your critters its maximum number of commands, you may choose to form a bond with it. Spend one week bonding with the critter and make a training test. Once the bond is formed, the maximum number of commands the critter may learn is increased by your ranks in Influence. When you spend a Minor Action to command your bonded critter, you may issue up to two commands at once. Whenever your critter takes an action at your command, gain a point of Edge that must be used on the critter's test, or it is lost. You may also spend your own Edge on the critter's tests, but only when they are acting on your commands. <br/>As part of this quality, you gain the Dependents quality (p. 75, SR6) at level 1 for a mundane herbivore or omnivore, level 2 for a mundane carnivore, or level 3 for an Awakened or emerged critter.
quality.critter_greater_bond=Greater Bond
quality.critter_greater_bond.page=139
quality.critter_greater_bond.desc=Bonds tend to deepen over time, and Greater Bond shows a closer relationship between the runner and their animal friend.<br/>Game Effect: Once your bonded critter has learned its maximum number of commands (counting the extra ones from your Influence ranks), your bond deepens. You become eligible to spend the Karma cost to deepen the critter bond. Once the Greater Bond has been formed, you are no longer required to use pre-defined commands. You may spend a Minor Action to give your critter any instructions you choose, and it will understand and obey to the best of its abilities. Any Edge actions or boosts you use on behalf of your bonded critter cost fifty percent less Edge (rounded up).
quality.critter_improvement=Permanent Improvement
quality.critter_improvement.page=139
quality.critter_improvement.desc=The training of a critter can improve what the critter can do, building their skills and capabilities.<br/>Game Effect: To gain this quality, spend a month training your critter, followed by a training test. If you succeed, you may spend your own Karma to improve one of the critter's attributes or skills, or purchase a quality. Any skill or quality must fit the critter's nature and capabilities. There's just no teaching barghests to play the saxophone.
quality.critter_lost=Lost
quality.critter_lost.page=139
quality.critter_lost.desc=Your critter is lost! At some point, the character and their critter might become separated. The critter may wander away, or be taken, or otherwise be separated from the player. The good news is, there's a chance that they're still alive, and that you might be able to find them.<br/>Game Effect: This quality takes effect when twenty-four hours have passed since the last time the PC saw the critter, and they don't know where the critter currently is. The separation takes a toll-you are in a bad state and will do whatever you can to recover your best friend. During the time of separation, gain a point of Edge on any direct action that you take in an effort to locate and recover your bonded critter. However, any Edge boosts or actions that aren't directly part of that effort cost 1 more Edge. The quality is removed when the critter is reunited with the character.
quality.critter_broken=Broken Trust
quality.critter_broken.page=139
quality.critter_broken.desc=Sometimes a relationship goes awry, especially when one party pushes the other too hard and ignores important boundaries. This quality takes effect if the PC does something to horribly mistreat their critter (gamemaster discretion as to where that boundary lies).<br/>Game Effect: When the relationship with a critter moves to this quality, your critter will no longer respond to your commands. At the gamemaster's discretion, it may even attack you or run away. It's possible that this broken trust will lead to a permanent severing of the relationship; if you and your critter stay away from each other for more than a month, move on to the Saying Goodbye quality. If you wish to restore your bond, you must spend at least one week training with your critter and succeed at a training test. However, you may not gain or spend Edge on the training test, and you only get one chance. If you succeed, the bond is restored, and this quality is eliminated. If you ever trigger this quality again, though, you may not attempt to restore the bond-it is broken forever. You gain the Critter Dominator quality (p. 132) with no expenditure of Karma, but all qualities associated with this path are lost. If you choose to bond another critter, all Karma costs are doubled.
quality.critter_goodbye=Saying Goodbye
quality.critter_goodbye.page=139
quality.critter_goodbye.desc=At some point, the bond between character and critter ends. Whether it's death, distance, or some other factor that causes the separation, the connection between the two is permanently severed.<br/>Game Effect: If your bonded critter has been lost for at least a month, you may give up hope and move on. Or, if your bonded critter dies, at least one month must pass before you may attempt to form a new bond with another critter. During this month, you may not gain or spend Edge on Composure tests. The Karma costs for your next critter's Initial Bond and Greater Bond are reduced by fifty percent (rounded up). Any qualities you had in this path are removed, with no Karma expenditures or rewards.

qpath.obsession=Obsession
qpath.obsession.page=140
qpath.obsession.desc=Shadowrunners, like any other people, may become overly invested in a particular goal or concept. This quality path charts a path through their obsession.
qpath.obsession.step.obsession_consumed=Consumed
qpath.obsession.step.obsession_consumed.page=140
qpath.obsession.step.obsession_consumed.desc=One personal goal is the most important thing in the world to you. You can't stop thinking about it, and every moment spent not working toward that goal is a torment. <br/>Game Effect:Choose a specific goal with your gamemaster's input and approval. This should be a difficult, costly, or dangerous goal, but it must also be achievable. The goal should generally require three or more sessions to accomplish. You do not receive any bonus Karma for this quality until you accomplish this goal. Whenever you aren't actively pursuing your goal, you may not gain or spend Edge on any tests. If you achieve your goal, move on to Fulfilled. If your goal becomes unachievable, or if you choose to give up on it, move on to Momentous Misfortune. No additional Karma for the player should be rewarded for activities related to completing the obsession, though other characters who are assisting them may gain Karma.
qpath.obsession.step.obsession_fulfilled=Fulfilled
qpath.obsession.step.obsession_fulfilled.page=140
qpath.obsession.step.obsession_fulfilled.desc=You achieved the focus of your obsession, but was it satisfying? Do you feel better now? What are you going to do with the rest of your life, now that you have obtained what you wanted so badly? <br/>Game Effect:Once you achieve the goal of your obsession, you gain the 15 bonus Karma from the Consumed quality. You can stop there and step off the Obsession quality path. Alternately, you may choose to move on to Obsessive Tendencies or Goal-Oriented.
qpath.obsession.step.obsession_obsessive=Obsessive Tendencies
qpath.obsession.step.obsession_obsessive.page=140
qpath.obsession.step.obsession_obsessive.desc=Either you got what you wanted and it didn't make things right, or you failed and don't know what to do next. Either way, you're desperate to find a new focus that will bring meaning back to your life. <br/>If this is your first time through this path, you may freely save or spend the bonus Karma from the Compulsion quality. Until you choose a new goal to become obsessed with, you may not gain or spend Edge. Once you have chosen your next goal, you may gain and spend Edge again, but only while you are actively pursuing that goal. The cycle continues, but you gain no further Karma from this quality path. You may gain Karma achieving objectives as your gamemaster sees fit.
qpath.obsession.step.obsession_goal=Goal-Oriented
qpath.obsession.step.obsession_goal.page=140
qpath.obsession.step.obsession_goal.desc=You completed your goal, and have developed healthier ways to channel your ambitions. You may purchase the Focused Ambition quality at the discounted cost of 8 Karma (normally it would be twice its normal cost, or 12 Karma), which may come from the bonus Karma for fulfilling your compulsion. The path then ends here.
qpath.obsession.step.obsession_misfortune=Momentous Misfortune
qpath.obsession.step.obsession_misfortune.page=140
qpath.obsession.step.obsession_misfortune.desc=This quality replaces others on this path at a point when your goal has become unattainable. Whether due to cruel fate or your own failings, you have given up all hope of obtaining that with which you were so obsessed. You do not collect any bonus Karma from the Consumed quality. Your self-confidence is crushed. This quality replaces any others on the path you may have had. Your dissatisfaction affects your mindset, so the threshold of any Composure tests you take is increased by 1. You may buy it off for 25 Karma at any time. The path ends here.
quality.obsession_consumed=Consumed
quality.obsession_consumed.page=140
quality.obsession_consumed.desc=One personal goal is the most important thing in the world to you. You can't stop thinking about it, and every moment spent not working toward that goal is a torment. <br/>Game Effect: Choose a specific goal with your gamemaster's input and approval. This should be a difficult, costly, or dangerous goal, but it must also be achievable. The goal should generally require three or more sessions to accomplish. You do not receive any bonus Karma for this quality until you accomplish this goal. Whenever you aren't actively pursuing your goal, you may not gain or spend Edge on any tests. If you achieve your goal, move on to Fulfilled. If your goal becomes unachievable, or if you choose to give up on it, move on to Momentous Misfortune. No additional Karma for the player should be rewarded for activities related to completing the obsession, though other characters who are assisting them may gain Karma.
