quality.webbed_digits=Webbed Digits
quality.webbed_digits.page=126
quality.webbed_digits.desc=
quality.avian=Avian Skull
quality.avian.page=126
quality.avian.desc=Also known as irregular cranial or skull configurations, AHD normally manifests as significant physical diversion from standard metahuman structure and appearance. These can be in nearly any form of such, often fitting in with features that are found among other species of the world. The difference in these appearances is they are principally cosmetic for the purposes of game mechanics.<br/><br/>\
 These individuals have had their cranial/aural properties adjusted to appear like those of common avians, including pronounced narrow jaw lines (but not into full beaks), widened or enlarged optical cavities, and similar traits.
quality.canine_feline=Canine/Feline Skull
quality.canine_feline.page=126
quality.canine_feline.desc=Also known as irregular cranial or skull configurations, AHD normally manifests as significant physical diversion from standard metahuman structure and appearance. These can be in nearly any form of such, often fitting in with features that are found among other species of the world. The difference in these appearances is they are principally cosmetic for the purposes of game mechanics.<br/><br/>\
 This is a very common trait, with an assortment of canine and feline variations. It provides pronounced jawlines, slight changes to teeth (not enough to use them as weapons), and even shifts in the position of the ears.
quality.cephalopod=Cephalod Skull
quality.cephalopod.page=127
quality.cephalopod.desc=Also known as irregular cranial or skull configurations, AHD normally manifests as significant physical diversion from standard metahuman structure and appearance. These can be in nearly any form of such, often fitting in with features that are found among other species of the world. The difference in these appearances is they are principally cosmetic for the purposes of game mechanics.<br/><br/>\
 This quality provides a dramatic change in appearance, a kraken-like skull including a nacre-like substance instead of bone and soft epidermis, with tiny tentacles that cover the shoulders and upper thoracic region. Skull and upper torso are softer, which imposes a –2 dice pool modifier when resisting damage in this region.
quality.pachy=Pachy
quality.pachy.page=127
quality.pachy.desc=Also known as irregular cranial or skull configurations, AHD normally manifests as significant physical diversion from standard metahuman structure and appearance. These can be in nearly any form of such, often fitting in with features that are found among other species of the world. The difference in these appearances is they are principally cosmetic for the purposes of game mechanics.<br/><br/>\
 Individuals have widened upper aural helices, often with some adjustment to the position of ears. They also display vestigial horns (rhino), proboscis (elephantine), or widened jaws with distally placed teeth (hippo). Appearances are often leathery along the cranial and upper torso.
