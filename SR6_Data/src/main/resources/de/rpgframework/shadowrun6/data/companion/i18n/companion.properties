quality.favored_weapon_custom.choice.variant=Option
quality.favored_weapon_custom.choice.variant.fav_weapon_kill=Kill Streak
quality.favored_weapon_custom.choice.variant.fav_weapon_kill.desc=Gain one point of Edge whenever you defeat a target with this weapon.
quality.favored_weapon_custom.choice.variant.fav_weapon_sighted=Sighted In
quality.favored_weapon_custom.choice.variant.fav_weapon_sighted.desc=Add +2 to this weapon's Attack Rating at a range category of your choice.
quality.favored_weapon_custom.choice.variant.fav_weapon_deadly=Deadly
quality.favored_weapon_custom.choice.variant.fav_weapon_deadly.desc=This weapon's DV is increased by 1.
quality.favored_weapon_custom.choice.variant.fav_weapon_extra_mod=Extra Modification (melee)
quality.favored_weapon_custom.choice.variant.fav_weapon_extra_mod.desc=This weapon may accept up to three modifications.
quality.favored_weapon_custom.choice.variant.fav_weapon_extra_acc=Extra Accessories (ranged)
quality.favored_weapon_custom.choice.variant.fav_weapon_extra_acc.desc=Choose a weapon mount location (top, barrel, underbarrel). That mount may support two accessories.
quality.favored_weapon_custom.choice.variant.fav_weapon_defensive=Defensive Balance (melee)
