# Augmentation Packs
# packs-augments.xml
item.pack_hacker_a=Hackerpaket A
item.pack_hacker_a.page=62
item.pack_hacker_a.desc=Dies ist die ultimative Anfangshardware für einen Decker. Sie ist komplett als Cyberware implantiert, sodass du nicht von deinen wichtigsten Werkzeugen getrennt werden kannst – außer vielleicht durch eine unfreiwillige Operation. Aber gib nicht damit an, denn du kannst dir eine so gute Cyberbuchse nur leisten, weil du sie gebraucht gekauft hast.

item.pack_hacker_b=Hackerpaket B
item.pack_hacker_b.page=62
item.pack_hacker_b.desc=Wenn du die Ausrüstung eines ernsthaften Hackers zu einem vernünftigeren Preis haben willst, ist dieses Paket fast so gut wie Paket A, kostet aber über siebzigtausend Nuyen weniger.

item.pack_hacker_c=Hackerpaket C
item.pack_hacker_c.page=62
item.pack_hacker_c.desc=Paket C ist ein Schnäppchen. Es bietet erstaunliche Hardware für viel weniger Nuyen, als die meisten Hacker denken, dass sie investieren müssen. Wenn du einen vielseitigeren Hackercharakter oder einen Charakter erschaffst, der in mehr als einem Bereich gut sein soll, ist dieses Paket eine gute Option. Dieses Paket ist der empfohlene Mindeststandard für einen ernsthaften Hacker.

item.pack_hacker_d=Hackerpaket D
item.pack_hacker_d.page=62
item.pack_hacker_d.desc=Nimm Paket D, wenn du wenig Essenz und Nuyen übrig hast, aber sicherstellen willst, dass du alles hast, was du als Hacker brauchst. Noch besser wäre es, Paket C zu nehmen, das nicht viel mehr Nuyen und Essenz kostet, aber wenn das nicht möglich ist, dann kommst du auch mit diesem Paket klar.

item.pack_hacker_e=Hackerpaket E
item.pack_hacker_e.page=63
item.pack_hacker_e.desc=Mit Paket E kommst du vielleicht über die Runden, und es ist eines der günstigsten Pakete, mit denen ein Hacker beginnen kann. Es ist auch eine gute Option, wenn Hacken nicht dein Hauptbetätigungsfeld ist.

item.pack_hacker_f=Hackerpaket F
item.pack_hacker_f.page=63
item.pack_hacker_f.desc=Okay, technisch gesehen kannst du damit hacken, aber versuch bloß nichts zu Ausgefallenes. Dieses Paket ist so ungefähr das Billigste, was du nehmen kannst, ohne beim Hacken total chancenlos zu sein. Wenn du die Fähigkeiten hast, um damit umzugehen, könnte es sogar funktionieren. Trotzdem wirst du es eher früher als später upgraden wollen.

item.pack_cybereye_a=Cyberaugenpaket A
item.pack_cybereye_a.page=63
item.pack_cybereye_a.desc=Das ist das Komplettpaket, was Cyberaugen angeht, mit so ungefähr jeder möglichen Option. Wen du die besten Augen willst, die man mit Nuyen kaufen kann, ist das hier wahrscheinlich das Richtige für dich.

item.pack_cybereye_b=Cyberaugenpaket B
item.pack_cybereye_b.page=63
item.pack_cybereye_b.desc=Wenn du nach Cyberaugen mit vielen optischen Optionen suchst, aber kein Smartlink willst, ist dies das richtige Paket für dich.

item.pack_cybereye_c=Cyberaugenpaket C
item.pack_cybereye_c.page=63
item.pack_cybereye_c.desc=Wenn du mit Smartlink ausgestattete Cyberaugen mit einem einfachen Set zusätzlicher Optionen brauchst, nimm dieses Paket.

item.pack_cybereye_d=Cyberaugenpaket D
item.pack_cybereye_d.page=63
item.pack_cybereye_d.desc=Nur das Smartlink, bitte. Und zur Sicherheit die Blitzkompensation. Du verlässt dich auf Kontaktlinsen, eine Brille oder ein Sichtgerät, falls du verbesserte Sicht brauchst.

item.pack_cybereye_e=Cyberaugenpaket E
item.pack_cybereye_e.page=63
item.pack_cybereye_e.desc=Dieses Paket ist für Leute, die etwas wollen, das ein wenig besser ist als ein einfacher Cyberaugenersatz. Es enthält sowohl Infrarotsicht als auch Restlichtverstärkung.

item.pack_cyberear_a=Cyberohrenpaket A
item.pack_cyberear_a.page=63
item.pack_cyberear_a.desc=Das ist das Paket für jeden Charakter, der keine Kosten scheut und die besten Cyberohren braucht, die man mit einem Credstick kaufen kann. Abgesehen von fortschrittlichen Gehörverbesserungen, mit denen du Geräusche isolieren, lokalisieren und verstärken kannst, hast du auch einen verbesserten Gleichgewichtssinn und einen Dämpfer.

item.pack_cyberear_b=Cyberohrenpaket B
item.pack_cyberear_b.page=64
item.pack_cyberear_b.desc=Wenn dir der stärkste selektive Geräuschfilter wichtiger ist als ein Balanceverstärker, dann ist dieses Paket das Richtige für dich.

item.pack_cyberear_c=Cyberohrenpaket C
item.pack_cyberear_c.page=64
item.pack_cyberear_c.desc=Dieses Paket ist für Charaktere, die an verbesserten Hörfähigkeiten interessiert sind und denen das Fehlen eines Balanceverstärkers egal ist. Diese Cyberohren bieten unübertroffenes gerichtetes Hören sowie einen Geräuschfilter und einen schützenden Dämpfer.

item.pack_cyberear_d=Cyberohrenpaket D
item.pack_cyberear_d.page=64
item.pack_cyberear_d.desc=Die Cyberohren für Athleten enthalten keine teuren Geräuschfilter, dafür aber einen verbesserten Gleichgewichtssinn und verbessertes gerichtetes Hören.

item.pack_cyberear_e=Cyberohrenpaket E
item.pack_cyberear_e.page=64
item.pack_cyberear_e.desc=Selbst das billigste Cyberohrenpaket enthält verbessertes gerichtetes Hören und einen Gehörschutz.

item.pack_skill_a=Talentpaket A
item.pack_skill_a.page=64
item.pack_skill_a.desc=Ja, diese Cyberware ist so teuer, wie es nur geht, und dazu kommen noch 30.000 Nuyen für jede zusätzliche Aktionsfertigkeit, die ihre Fähigkeiten voll ausnutzt, aber wenn du das bestmögliche kybernetische Talentleitungssystem haben willst, dann gib dich nicht mit etwas Schlechterem zufrieden. Du kannst bis zu zwei Aktionssofts der Stufe 6 gleichzeitig laufen lassen, aber dieses Paket enthält nur eine. Du kannst zusammen mit den Aktionssofts auch noch Wissens- und Linguasofts (separat erhältlich) laufen lassen.

item.pack_skill_b=Talentpaket B
item.pack_skill_b.page=64
item.pack_skill_b.desc=Diese Kombination aus Talentbuchse und Talentleitungen ist fast so effektiv wie Talentpaket A, aber für die meisten immer noch unerschwinglich. Du kannst jede Wissens- oder Linguasoft laufen lassen, und bis zu zwei Aktionssofts der Stufe 5 gleichzeitig. Nur eine Aktionssoft der Stufe 5 ist in dem Paket enthalten. Zusätzliche Aktionssofts der Stufe 5 kosten jeweils 25.000 Nuyen.

item.pack_skill_c=Talentpaket C
item.pack_skill_c.page=65
item.pack_skill_c.desc=Du verlässt dich bei deinen wichtigsten Fertigkeiten nicht auf Talentleitungen, aber sich alles andere einzuwerfen, was du vielleicht können musst, ist ein beträchtlicher Vorteil. Du kannst Wissens- und Linguasofts und bis zu zwei Aktionssofts der Stufe 4 gleichzeitig laufen lassen. Eine Aktionssoft der Stufe 4 ist im Paket enthalten, zusätzliche kosten jeweils 20.000 Nuyen.

item.pack_reflexes=Reflexpaket
item.pack_reflexes.page=65
item.pack_reflexes.desc=Dieses Paket aus Reflexbooster und Reaktionsverbesserung ist der Standard für Straßensamurais und Elite-Konzernsicherheitsgardisten. Es bringt erhöht deine Reaktion und damit deinen Verteidigungspool und deine Initiative enorm, und es gewährt dir außerdem insgesamt vier Nebenhandlungen, die du gegen eine zweite Haupthandlung tauschen kannst. Du hast jetzt die Wahl, ob du mehrfach angreifen oder die zusätzlichen Nebenhandlungen für Dinge wie Bewegung, Deckung, Ausweichen oder Blocken aufsparen willst.

item.pack_skull=Schädel Dick
item.pack_skull.page=65
item.pack_skull.desc=Dieser Cyberschädel dient nur einem Zweck: deinen Kopf unauffällig zu schützen. Er gewährt einen Bonus von +2 auf deinen Verteidigungswert und ein zusätzliches Kästchen auf deinem Körperlichen Zustandsmonitor, und er sieht absolut natürlich aus.

item.pack_dome=Schädel Chrombirne
item.pack_dome.page=65
item.pack_dome.desc=Für nur wenig mehr Nuyen kannst du deinen Kopf sogar noch besser panzern. Die meisten Leute sind allerdings nicht für einen offensichtlichen Cyberschädel bereit.

item.pack_torso_stealth=Torso Unauffällig
item.pack_torso_stealth.page=65
item.pack_torso_stealth.desc=Dieses Paket ist bei diskreten Kurieren und Schmugglern beliebt, aber für jeden Shadowrunner kann es nützlich sein, einen Schmuggelbehälter in seinem Körper zu haben. Ein zusätzliches Kästchen auf dem Körperlichen Zustandsmonitor ist ebenfalls ein netter Bonus. Wenn du nur ein Versteck für kleine Gegenstände willst, ist eine Bioware-Hauttasche vielleicht die günstigere Wahl. Allerdings kannst du in einem Torsofach viel mehr tragen als in einer Hauttasche.

item.pack_torso_armor=Torso Unauffällig gepanzert
item.pack_torso_armor.page=65
item.pack_torso_armor.desc=Ähnlich wie das Dickschädel-Paket dient dieser unauf-fällige Cybertorso dazu, dir ein zusätzliches Kästchen auf dem Körperlichen Zustandsmonitor und einen unaufdringlichen, aber beeindruckenden Bonus von +5 auf deinen Verteidigungswert zu geben.

item.pack_torso_cyborg=Torso Cyborg
item.pack_torso_cyborg.page=65
item.pack_torso_cyborg.desc=Dieses Cybertorso-Paket macht offensichtlich, dass du einen gepanzerten Torso hast, enthält aber auch einen Schmuggelbehälter.

item.pack_arm_excellence=Cyberarm Spitzenleistung
item.pack_arm_excellence.page=66
item.pack_arm_excellence.desc=Dieses Paket ist für Charaktere, die einen Cyberarm mit hervorragenden Attributen und einem natürlichen Aussehen haben wollen. Selbst wenn du nicht besonders geschickt oder stark bist, kann dieser Arm das ausgleichen – oder mit dem Rest von dir mithalten, wenn du bereits ein so krasser Typ bist.

item.pack_arm_secret=Cyberarm Heimlicher Handschlag
item.pack_arm_secret.page=66
item.pack_arm_secret.desc=Dieses Cyberarm-Paket enthält einen Schmuggelbehälter und eine Schockhand und sieht dabei komplett natürlich aus.

item.pack_arm_assasin=Cyberarm Assassine
item.pack_arm_assasin.page=66
item.pack_arm_assasin.desc=Dieses Cyberarm-Paket bietet eine hohe Geschicklichkeit, um dafür zu sorgen, dass du die Würfel hast, um den vollen Nutzen aus einem einziehbaren Sporn zu ziehen.

item.pack_arm_firearm=Cyberarm Feuerwaffe
item.pack_arm_firearm.page=66
item.pack_arm_firearm.desc=Es ist vielleicht offensichtlich, dass dein Arm ein kybernetischer Ersatz ist, aber was nicht offensichtlich ist, ist die darin eingebaute Pistole. Außer natürlich, du schießt auf jemanden oder schiebst ein Magazin in deinen Arm. Dann ist es ziemlich offensichtlich.

item.pack_arm_heavy_arm=Cyberarm Schwer bewaffnet
item.pack_arm_heavy_arm.page=67
item.pack_arm_heavy_arm.desc=Dieses Cyberarm-Paket ist für jeden, der seine Feinde so schnell wie möglich mit so viel Blei wie möglich eindecken will. Es hat die Stärkeverbesserung, damit du schwerere Waffen führen kannst, und die Geschicklichkeit, damit du sie präzise abfeuern kannst, aber das Beste ist ein Gyrostabilisator, der alle Rückstoßmodifikatoren ausgleicht. Rock and roll!

item.pack_leg_hollow=Cyberbein Hohler Stiefel
item.pack_leg_hollow.page=67
item.pack_leg_hollow.desc=Es ist immer nützlich, einen Schmuggelbehälter zu haben, zusätzlich zu einem Verteidigungswertbonus von +3 und einem zusätzlichen Kästchen auf dem Körperlichen Zustandsmonitor.

item.pack_leg_springjack=Cyberbein Springteufel
item.pack_leg_springjack.page=67
item.pack_leg_springjack.desc=Klar sind diese Cyberbeine offensichtlich, aber sie sind auch offensichtlich großartig! Du kannst schnell rennen, hart zutreten und weit springen, und du erhältst zwei zusätzliche Kästchen auf deinem Körperlichen Zustands-monitor. Was will man mehr?

item.pack_leg_springjugger=Cyberbein Springmonster
item.pack_leg_springjugger.page=67
item.pack_leg_springjugger.desc=Was man mehr will? Panzerplatten natürlich! Diese Beine sind genauso fähig wie die ungepanzerte Version, bieten dir aber einen Bonus von insgesamt +12 auf deinen Verteidigungswert. Es kostet dich nur noch mehr Nuyen!

# Vehicle Packs
# packs-vehicles.xml
item.pack_veh_harley=Motorrad-Bewaffnete Harley-Davidson Scorpion
item.pack_veh_harley.page=67
item.pack_veh_harley.desc=Dieser Chopper hat vorne eine riesige Kanone. Ganz oder gar nicht!

item.pack_veh_growler=Motorrad-Bewaffnete Yamaha Growler
item.pack_veh_growler.page=67
item.pack_veh_growler.desc=Dieses Geländemotorrad ist mit einem schallgedämpften schweren Maschinengewehr ausgestattet. Aber selbst mit einem Schalldämpfer wird das RPK etwas Lärm machen.

item.pack_veh_mirage=Motorrad-Bewaffnete Suzuki Mirage
item.pack_veh_mirage.page=67
item.pack_veh_mirage.desc=Dieses superschnelle Motorrad ist mit einer Kombination aus Sturmgewehr, Granatwerfer und Schrotflinte bis an die Zähne bewaffnet.

item.pack_veh_shin_hyung=Auto-Bewaffneter Hyundai Shin-Hyung
item.pack_veh_shin_hyung.page=68
item.pack_veh_shin_hyung.desc=Der Hyundai Shin-Hyung ist günstig, schnell und hat ein hervorragendes Straßenhandling. Der Nachteil ist, dass sein leichtes Chassis nicht besonders widerstandsfähig ist. Also sorg dafür, dass man nicht auf dich schießt.

item.pack_veh_americar=Auto-Bewaffneter Ford Americar
item.pack_veh_americar.page=68
item.pack_veh_americar.desc=Der Ford Americar ist eine allgegenwärtige Limousine, was ihn zu einem nützlichen Werkzeug macht, wenn man nicht auffallen will. Warum also nicht eine kleine Überraschung installieren, wie zum Beispiel eine Panther XXL im Kofferraum? Der schwierigste Teil daran, sie zu besitzen, besteht darin, der Versuchung zu widerstehen, sie gegen jeden Idioten einzusetzen, der im Verkehr deine Stoßfänger touchiert.

item.pack_veh_westwind=Auto-Bewaffneter Eurocar Westwind
item.pack_veh_westwind.page=68
item.pack_veh_westwind.desc=Dieses Paket ist verdammt teuer, aber es ist auch der krasseste Sportwagen auf dem Markt, der durch den installierten Raketenwerfer auch noch verdammt tödlich ist. Neue Munition ist sehr teuer, also stell sicher, dass das Ziel auch so viele Nuyen wert ist. Abgesehen davon ist dieses Auto auf Geschwindigkeit ausgelegt, nicht auf Haltbarkeit im Kampf. Etwas hochzujagen, bevor es auf dich schießen kann, könnte überlebenswichtig sein. Der Westwind ist mit einem hinreichend kompetenten Pilotprogramm ausgestattet und kann sich einigermaßen selbst fahren. Anmerkung: Der Pilot kann nur zwei Autosofts gleichzeitig laufen lassen. Du kannst mit einer Nebenhandlung rekonfigurieren, welche Autosofts geladen sind.

item.pack_veh_bulldog=Vans-Bewaffneter GMC Bulldog
item.pack_veh_bulldog.page=68
item.pack_veh_bulldog.desc=Der Bulldog ist so allgegenwärtig wie der Ford Americar. Außerdem ist er groß, stabil und hat serienmäßig eine starke Panzerung. Er ist allerdings nicht sehr schnell und kommt mit plötzlichen Manövern, egal ob auf der Straße oder abseits davon, nicht besonders gut zurecht. Dieser hier hat einen ausfahrbaren Turm mit einem mächtigen Maschinengewehr. Perfekt, um ein Runnerteam herumzu-fahren, und in der Lage, sowohl ordentlich einzustecken als auch auszuteilen. Außerdem ist er recht günstig.

item.pack_veh_rover=Vans-Bewaffneter Range Rover
item.pack_veh_rover.page=68
item.pack_veh_rover.desc=Das natürliche Upgrade des Bulldogs ist der Range Rover Model 2080. Dieses teurere Fahrzeug ist stabil und hat den Stil und die Anmut, die dem Bulldog fehlen. Besser in fast jeder Hinsicht - außer beim Preis natürlich. Einer seiner Vorteile ist eine recht kompetente Pilotstufe, wodurch er nötigenfalls selbst fahren kann. Dieses Paket ist mit drei Waffenhalterungen, die mit einem Raketenwerfer, einer Panther Sturmkanone und einem Sturmgewehr ausgestattet sind, bis an die Zähne bewaffnet. Anmerkung: Der Pilot kann nur zwei Autosofts gleichzeitig laufen lassen. Du kannst mit einer Nebenhandlung rekonfigurieren, welche Autosofts geladen sind.

item.pack_veh_roadmaster=Vans-Bewaffneter Ares Roadmaster
item.pack_veh_roadmaster.page=68
item.pack_veh_roadmaster.desc=Ein riesiger, schwer gepanzerter Lastwagen, bewaffnet mit dem größten Maschinengewehr auf dem Markt. Erwarte nur nicht, dass du anderen damit entwischen kannst. Aber hey, dafür sind die Panzerung und die Waffenhalterung schließlich da!

item.pack_veh_otter=Boote-Bewaffnetes Samuvani Criscraft Otter
item.pack_veh_otter.page=69
item.pack_veh_otter.desc=Dieses kleine Motorboot ist perfekt für kleine Fahrten auf offenem Wasser, sei es ein Ozean, ein See, ein Fluss oder ein Kanal. Wenn du in Schwierigkeiten gerätst, wirst du damit aber wahrscheinlich keinen ernsthaften Schaden wegstecken. Deswegen haben wir einen Raketenwerfer hinzugefügt. Wenn der dein Problem nicht löst, solltest du besser abhauen!

item.pack_veh_nightrunner=Boote-Bewaffneter Aztechnology Nightrunner
item.pack_veh_nightrunner.page=69
item.pack_veh_nightrunner.desc=Der Nightrunner ist das ultimative Schmugglerboot. Weil du keine Aufmerksamkeit auf dich ziehen willst, ist ein sehr mächtiges, aber schallgedämpftes Scharfschützengewehr die Waffe der Wahl.

item.pack_veh_riverine=Boote-Bewaffnetes GMC Riverine
item.pack_veh_riverine.page=69
item.pack_veh_riverine.desc=Das Riverine ist ein schweres Patrouillenboot, das häufig von Sicherheitskräften und der Küstenwache, aber auch von Runnern, Piraten und Schmugglern verwendet wird. Die Pilotstufe ist ganz ordentlich, wodurch du dich auf andere Dinge konzentrieren kannst, während das Boot sein eigenes Steuer übernimmt. Es ist außerdem mit einem Raketenwerfer und einem Maschinengewehr bewaffnet und stabil genug, um leichtes feindliches Feuer zu überstehen. Anmerkung: Der Pilot kann nur zwei Autosofts gleichzeitig laufen lassen. Du kannst mit einer Nebenhandlung rekonfigurieren, welche Autosofts geladen sind.

item.pack_veh_delfin=U-Boote-Bewaffnetes YNT Delfin
item.pack_veh_delfin.page=69
item.pack_veh_delfin.desc=Dieses kleine, für Privatkunden gemachte U-Boot wird manchmal von Schmugglern und Runnern verwendet. Und anders als die serienmäßige Version kann sich diese Variante auch verteidigen. Standardmäßig operiert der Raketenwerfer nur unter Wasser als Torpedorohr. Wenn du willst, kann stattdessen ein Überwasser-Raketenwerfer installiert werden, aber der ist unter Wasser dann nutzlos. Anmerkung: Du musst auswählen, ob der Raketenwerfer für Torpedos oder Standardraketen gebaut ist. Torpedos funktionieren wie Raketen, können aber nur unter Wasser abgefeuert werden. Das U-Boot muss auftauchen, um normale Raketen abfeuern zu können.

item.pack_veh_pursuit=Drohnen, Klein-Bewaffnete Raddrohne
item.pack_veh_pursuit.page=69
item.pack_veh_pursuit.desc=einer großen Bandbreite an Modellen, die sie wie Miniaturversionen verschiedener beliebter Autos aussehen lassen. Diese hier ist allerdings nicht für Drohnenrennen gemacht. Eine Waffenhalterung mit einer schallgedämpften Flechettepistole verwandelt sie in eine tödliche Stealth-Drohne. Pass nur auf, dass niemand auf sie tritt!

item.pack_veh_crawler=Drohnen, Klein-Bewaffneter Läufer
item.pack_veh_crawler.page=70
item.pack_veh_crawler.desc=Die Aztechnology Crawler ist eine vierbeinige Läuferdrohne, die bei Sicherheitskräften als preiswerte Patrouillendrohne beliebt ist. Diese Variante hier ist mit einer schallgedämpften schweren Pistole und viel Munition ausgestattet, was sie zu einem sehr nützlichen Werkzeug für heiklere Operationen macht, bei denen eine größere Drohne mit einer größeren Waffe zu viel Aufmerksamkeit auf sich ziehen würde.

item.pack_veh_quadrotor=Drohnen, Klein-Bewaffnete Rotordrohne
item.pack_veh_quadrotor.page=70
item.pack_veh_quadrotor.desc=Diese Quadrokopter-Drohne ist serienmäßig mit einer luftdruckgetriebenen Armbrust ausgestattet, was unter den meisten Umständen keine besonders effektive Waffe ist. Bewaffnet mit Narcoject-Injektionsbolzen und gesteuert von einem fähigen Rigger wird sie jedoch unglaublich gefährlich.

item.pack_veh_doberman_stealthy=Drohnen, Mittel-Raddrohne Heimlich
item.pack_veh_doberman_stealthy.page=70
item.pack_veh_doberman_stealthy.desc=Die preisgünstige Dobermann ist bei Sicherheitskräften und Shadowrunnern sehr beliebt. Wenn du so wenig Lärm wie möglich machen willst, ist eine Ingram Smartgun mit ihrem integrierten Schalldämpfer und dem Smartgunsystem die perfekte Wahl für die Waffenhalterung der Drohne.

item.pack_veh_doberman_loud=Drohnen, Mittel-Raddrohne Laut
item.pack_veh_doberman_loud.page=70
item.pack_veh_doberman_loud.desc=Sicherheitskräfte montieren wahrscheinlich eine größere Waffe, wie etwa eine Mossberg CMDT Kampfschrotflinte, an einer Dobermann. Diese Waffe ist gefährlich und preisgünstig, also warum machst du es nicht genauso?

item.pack_veh_nissan_samurai=Drohnen, Mittel-Anthroform
item.pack_veh_nissan_samurai.page=70
item.pack_veh_nissan_samurai.desc=Die Nissan Samurai ist ein menschengroßer Roboter mit Katana-Armen, der eine Maschinenpistole in jeder Hand montiert hat. Außerdem ist die Drohne spottbillig, also sei nicht überrascht, wenn ein Sicherheitsreaktionsteam dir eine Welle nach der anderen von diesen Dingern entgegenwirft, wenn du das nächste Mal einen Alarm auslöst. Aber keine Panik. Die Dinger sind nicht sehr robust. Abgesehen davon sind sie billig genug, dass ein gerissener Rigger sie als Ablenkung verwenden könnte.

item.pack_veh_nissan_oni=Drohnen, Groß-Anthroform
item.pack_veh_nissan_oni.page=70
item.pack_veh_nissan_oni.desc=Die Nissan Oni ist die schwerere Version der Samurai, mit Sturmgewehren und Katanas als Händen und robust genug, um eine ernsthafte Bedrohung zu sein. Ihr relativ niedriger Preis macht sie zur beliebten Wahl bei Sicherheitskräften, Gangern und Runnern.

item.pack_veh_roto_assault=Drohnen, Mittel-Rotodrohne Angriff
item.pack_veh_roto_assault.page=70
item.pack_veh_roto_assault.desc=Die MCT-Nissan Roto-Drohne ist eine der beliebtesten Luftkampfdrohnen aller Zeiten. Sie ist preisgünstig und kann schwerere Waffen aufnehmen, als man erwarten würde. Dieses Paket enthält eine Waffenhalterung mit einer Kampfschrotflinte, die auf viele Reichweiten nützlich ist. Dies ist eine besonders beliebte Option für Sicherheitsdrohnen.

item.pack_veh_roto_support=Drohnen, Mittel-Rotodrohne Feuerunterstützung
item.pack_veh_roto_support.page=71
item.pack_veh_roto_support.desc=Eine weitere Variante der Roto-Drohne, diesmal mit einem schallgedämpften Sturmgewehr, was sie für Feuerunterstützung auf größere Reichweite und als Scharfschützendrohne nützlich macht.

item.pack_veh_roto_rocket=Drohnen, Mittel-Rotodrohne Raketenwerfer
item.pack_veh_roto_rocket.page=71
item.pack_veh_roto_rocket.desc=Dieses Paket ist für dich, wenn du es krachen lassen willst und dafür Nuyen verbrennen kannst. Es ist teuer, aber du kannst einen Raketenwerfer an eine dieser Drohnen montieren. Der beste Teil ist immer ihr Gesichtsausdruck, wenn sie sehen, dass die Rakete auf dem Weg ist.

item.pack_veh_roto_grenade=Drohnen, Mittel-Rotodrohne Granatensperrfeuer
item.pack_veh_roto_grenade.page=71
item.pack_veh_roto_grenade.desc=Wenn du das Konzept magst, Raketen von einer Roto-Drohne aus abzuschießen, aber nicht so viele Nuyen hast, solltest du deine Aufmerksamkeit auf Granatwerfer richten! Sie haben den zusätzlichen Vorteil, dass sie Rauch- und Betäubungsgranaten verwenden können, statt nur alles in Stücke zu schießen - was sie natürlich auch können!

item.pack_veh_blackhawk=Drohnen, Mittel-Luftschlag
item.pack_veh_blackhawk.page=71
item.pack_veh_blackhawk.desc=Acht Raketen an einer Drohne mit kleinem Profil, was will man mehr?

item.pack_veh_lynx_ultimate=Drohnen, Groß-Ultimative Kampfdrohne
item.pack_veh_lynx_ultimate.page=71
item.pack_veh_lynx_ultimate.desc=Die Steel Lynx ist wie ein kleiner Panzer, aber mit Beinen, die an ihren Enden Räder haben. So viel Panzerung, und so unglaublich robust, und sie kann eine lächerlich große Menge an Feuerkraft aufnehmen. Sie ist vielleicht teuer, aber das ist es wert, wenn man dafür ein schweres Maschinengewehr und einen Granatwerfer zur Verfügung hat.

item.pack_veh_lynx_budget=Drohnen, Groß-Günstige Schwere Kampfdrohne
item.pack_veh_lynx_budget.page=71
item.pack_veh_lynx_budget.desc=Wenn du deinen eigenen Minipanzer haben, aber nicht so viel Geld für eine einzige Drohne ausgeben willst, nimm dieses Paket. Die Drohne hat ein Ares Alpha, das seinen eigenen Unterlauf-Granatwerfer hat. Sicher, du musst die Granaten manuell nachladen, aber wenn du mehr als sechs Granaten in einem Kampf brauchst, solltest du dich vielleicht doch für die teurere Version entscheiden.

item.pack_veh_lynx_crowd=Drohnen, Groß-Aufstandsbekämpfung
item.pack_veh_lynx_crowd.page=72
item.pack_veh_lynx_crowd.desc=Diese Variante der Steel Lynx ist bei Sicherheitskräften beliebt, mit einer Kampfschrotflinte, die für gewöhnlich mit Gelmunition geladen ist, einer Squirtgun mit Narcoject-Ladung und einem Granatwerfer, der mit Rauch- und Betäubungsgranaten geladen ist.

item.pack_veh_dalmatian=Drohnen, Groß-Luftpatrouillendrohne
item.pack_veh_dalmatian.page=72
item.pack_veh_dalmatian.desc=Diese Drohne wird von Sicherheitskräften häufig als Luftunterstützung bei der Kontrolle von Metamenschenmengen verwendet.

item.pack_veh_blacksky=Drohnen, Groß-Elite-Luftschlagdrohne
item.pack_veh_blacksky.page=72
item.pack_veh_blacksky.desc=Die Ares Black Sky ist wie dein eigener privater Kampfjet. Wenn du einen Luftschlag anfordern musst, kann diese Drohne ihn möglich machen. Aber halt die Drohne in Bewegung für schnelle Luftüberfälle. Sie ist zu teuer und empfindlich für schwere Kämpfe.

item.pack_rcc_backup=Riggerkonsolen-Reserve
item.pack_rcc_backup.page=72
item.pack_rcc_backup.desc=Diese Riggerkonsole ist eher für Hobbydrohnenpiloten als für echte Rigger. Sie ist besser als nichts, wenn du eine Reserve- oder Ersatzkonsole brauchst und knapp bei Kasse bist, oder wenn du hauptsächlich ein Fahrer ist, der sich nur nebenbei mit Drohnen beschäftigt. Ansonsten investiere mehr Nuyen in etwas mit einer besseren Firewall, das mehr Software laufen lassen kann. Anmerkung: Die Dronemaster kann bis zu 4 Programme gleichzeitig laufen lassen (Autosofts und Programme zählen gegen dieses Limit) und bis zu 9 Drohnen als Slaves führen.

item.pack_rcc_basic=Riggerkonsolen-Einfach
item.pack_rcc_basic.page=72
item.pack_rcc_basic.desc=Die Spider ist eine recht preisgünstige Riggerkonsole mit ordentlichen Fähigkeiten für ihren Preis. Ein ernsthafter Drohnenrigger wird eher etwas Besseres nehmen, aber wenn Drohnen für dich zweitrangig sind, ist die Spider eine vernünftige Wahl für dich. Sie ist auch sehr beliebt bei Gangs und einfachen Sicherheitskräften. Anmerkung: Die Spider kann bis zu 4 Programme gleichzeitig laufen lassen (Autosofts und Programme zählen gegen dieses Limit) und bis zu 12 Drohnen als Slaves führen.

item.pack_rcc_professional=Riggerkonsolen-Professionell
item.pack_rcc_professional.page=72
item.pack_rcc_professional.desc=Diese Riggerkonsole ist das, was die meisten ernsthaften Drohnenrigger nehmen würden. Sie ist teuer, aber nicht so teuer, dass man kein Geld mehr für Drohnen übrig hat - was wichtig ist. Anmerkung: Die Poseidon kann bis zu 5 Programme gleichzeitig laufen lassen (Autosofts und Programme zählen gegen dieses Limit) und bis zu 15 Drohnen als Slaves führen.

item.pack_rcc_elite=Riggerkonsolen-Elite
item.pack_rcc_elite.page=73
item.pack_rcc_elite.desc=Die Ares Red Dog ist eine der besten Investitionen, die ein Rigger tätigen kann. Ihre starke Firewall macht deine Drohnen sehr resistent gegen Hacker, und die Konsole kann viele Programme gleichzeitig laufen lassen. Wenn eine Drohnenarmee dein Ding ist, wirst du es nicht bereuen, die zusätzlichen Nuyen für dieses Paket ausgegeben zu haben. Anmerkung: Die Red Dog kann bis zu 7 Programme gleichzeitig laufen lassen (Autosofts und Programme zählen gegen dieses Limit) und bis zu 18 Drohnen als Slaves führen.

item.pack_autosoft_recon2=Autosofts-Aufklärung 2
item.pack_autosoft_recon2.page=73
item.pack_autosoft_recon2.desc=Die Aufklärungs-Autosoftpakete sind für Drohnen gedacht, die zur heimlichen Beobachtung eines Gebiets oder Ziels verwendet werden. Dabei handelt es sich für gewöhnlich um kleinere Flugdrohnen.

