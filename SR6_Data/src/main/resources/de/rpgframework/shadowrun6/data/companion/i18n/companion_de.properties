item.pack_actioneer=Panzerung-Actioneer Geschäftsanzug
item.pack_actioneer.page=61
item.pack_actioneer.desc=Kein Shadowrunner verlässt das Haus ohne seine Panzerung, und nur Gossenpunks und Lohnsklaven tragen Panzerung, die nicht mit zusätzlichem Schutz gegen Kälte, Stromstöße oder Feuer ausgestattet ist. Diese Pakete enthalten die Schutzupgrades, die du haben willst.

