qpath.vendetta=Vendetta
qpath.vendetta.page=152
qpath.vendetta.desc=Du kannst diesen emotionalen Pfad beginnen, wenn deine Fahndungsstufe 15 oder mehr beträgt. Du musst dann entweder den Nachteil Kopfgeld (S. 148) oder den Nachteil Gejagt (S. 148) auf Stufe 2 wählen. Du erhältst vorerst keinen Karmabonus für diese Nachteile.
qpath.vendetta.step.vendetta_start=Vendetta
qpath.vendetta.step.vendetta_start.page=152
qpath.vendetta.step.vendetta_start.desc=Nachdem du zum ersten Mal die Konsequenzen des gewählten Nachteils erleiden musstest, wähle eine der folgenden Optionen:
qpath.vendetta.step.vendetta_lielow=Kopf Runter!
qpath.vendetta.step.vendetta_lielow.page=152
qpath.vendetta.step.vendetta_lielow.desc=Wirst du dich bedeckt halten und hoffen, dass diese außergewöhnliche Aufmerksamkeit für deine Person vorübergeht? Falls dem so ist, dann besteht dein Weg aus dieser Situation darin, deine persönliche Fahndungsstufe auf null zu bekommen, und zwar mit allen dir zur Verfügung stehenden Mitteln. Du wirst so lange unter den Auswirkungen des gewählten Nachteils leiden, bis deine persönliche Fahndungsstufe auf null sinkt. Sobald deine Fahndungsstufe auf null gesunken ist, verschwindet der gewählte Nachteil wieder. Du kannst einen Vorteil zu den regulären Karmakosten kaufen (anstatt der verdoppelten Kosten, wie es üblicherweise bei der Charakterentwicklung der Fall ist). Der emotionale Pfad endet an dieser Stelle.
qpath.vendetta.step.vendetta_shutdown=Ausschalten
qpath.vendetta.step.vendetta_shutdown.page=152
qpath.vendetta.step.vendetta_shutdown.desc=Kannst du herausfinden, wer deine Nummer hat? Herauszufinden, wer hinter dir her ist, wird die Hilfe deiner Connections und ein Bestechungsgeld von mindestens 1.000 Nuyen erfordern. Sobald du weißt, wer hinter dir her ist, musst du entscheiden, ob du versuchen willst, einen Deal auszuhandeln, oder ob du es ihnen heimzahlen willst. Das wird vermutlich statt der regulären Shadowruns das Thema für ein oder zwei Spielsitzungen sein. Wenn du versuchst, deine Verfolger zu befrieden, musst du einen kostenlosen Run für sie durchziehen oder aber 1.000 Nuyen für jeden Punkt deiner Fahndungsstufe zahlen. Falls du deine Verfolger zwingen willst, einen Rückzieher zu machen, musst du einen Run durchziehen, um ein Druckmittel gegen sie in die Hände zu bekommen, sie einzuschüchtern oder sie in die Knie zu zwingen. Falls dieser Run scheitert, erhältst du den Nachteil Kopfgeld oder den Nachteil Gejagt auf Stufe 2 (denjenigen der beiden Nachteile, den du zuvor nicht gewählt hast). Falls du bereits beide Nachteile hast, erhöhe Gejagt auf Stufe 3. Falls der Run erfolgreich ist, wird der Nachteil entfernt, und deine persönliche Fahndungsstufe wird um 5 gesenkt. Der emotionale Pfad endet an dieser Stelle.
qpath.vendetta.step.vendetta_fine=Ist das okay für dich?
qpath.vendetta.step.vendetta_fine.page=153
qpath.vendetta.step.vendetta_fine.desc=Akzeptierst du diese Situation als weiteren Teil deines neuen Normalzustandes? Falls dem so ist, wird der Nachteil dauerhaft wirksam, bis du dich entscheidest, ihn für 20 Karma zu entfernen. Du erhältst allerdings auch 10 Karma, das du verwenden kannst, um einen einzelnen Vorteil zu kaufen oder einen deiner Nachteile zu entfernen. Du zahlst dabei nur die unmodifizierten Karmakosten (anstatt der doppelten Kosten). Karma aus diesen 10 Karma, das du nicht zu diesem Zweck einsetzt, geht verloren.

qpath.sinners_path=Pfad des SIN-Menschen
qpath.sinners_path.page=153
qpath.sinners_path.desc=Du kannst diesen emotionalen Pfad beginnen, wenn du bei der Charaktererschaffung den Nachteil SIN-Mensch (SR6, S. 81) gewählt hast. Wenn deine persönliche Fahndungsstufe jemals auf 10 ansteigt, erhältst du den Nachteil Fahndungsakte.
qpath.sinners_path.step.sinners_path_record=Fahndungsakte
qpath.sinners_path.step.sinners_path_record.page=153
qpath.sinners_path.step.sinners_path_record.desc=Zu deinem Pech wurden einige Beweise deiner Vergehen zusammengetragen und ein Profil in einer Datenbank der Strafverfolgungsbehörden angelegt. <br/>Auswirkung: Immer, wenn du versuchst, eine gefälschte SIN oder eine gefälschte Lizenz zu verwenden, gilt deren Stufe als um 1 niedriger als normal. Immer, wenn deine Fahndungsstufe steigt, steigt sie um 1 Punkt extra (aber maximal um 1 Punkt extra pro Spielsitzung). Falls deine Fahndungsstufe jemals 17 erreicht, haben die Strafverfolgungsbehörden genug Informationen gesammelt, um dir deine Verbrechen nachzuweisen. Dein Nachteil SIN-Mensch wird zum Nachteil Kriminelle SIN. Du erhältst 5 Karma, die du nach deiner Wahl ausgeben kannst.
qpath.sinners_path.step.sinners_path_criminal=Kriminelle SIN
qpath.sinners_path.step.sinners_path_criminal.page=153
qpath.sinners_path.step.sinners_path_criminal.desc=Entweder wurde deine ursprüngliche SIN durch deine kriminellen Vergehen als kriminell gekennzeichnet, oder man hat dir eine kriminelle SIN verpasst, nachdem du bei einem Verbrechen erwischt wurdest. <br/>Auswirkung: Immer, wenn du eine gefälschte SIN oder eine gefälschte Lizenz verwendest, ist es sehr viel wahrscheinlicher, dass du mit deiner kriminellen SIN in Verbindung gebracht und erwischt wirst. Alle deine gefälschten SINs und Lizenzen funktionieren nur mit ihrer halben Stufe (aufgerundet), und du kannst kein Edge erhalten oder ausgeben, um ihre Überprüfung zu beeinflussen. Falls die Fahndungsstufen-Probe am Ende eines Runs nicht zu einer Erhöhung der Fahndungsstufe führt, steigt deine persönliche Fahndungsstufe dennoch um 1. Der Nachteil Fahndungsakte wird in diesem Fall nicht angewendet.
qpath.sinners_path.step.sinners_path_shadows=Weg in die Schatten
qpath.sinners_path.step.sinners_path_shadows.page=153
qpath.sinners_path.step.sinners_path_shadows.desc=Deine echte SIN belastet dich schwer, also musst du einen Weg finden, um in die Schatten abzutauchen. Dieser Schritt des emotionalen Pfades wird von der Spielleitung eingeleitet, aber er sollte eine Reaktion darauf sein, dass der Charakter endlich etwas wegen des wachsenden Drucks tun möchte. <br/>Auswirkung: Ein Schieber oder eine Connection, die IDs herstellen kann, benötigt 10.000 Nuyen plus 1.000 Nuyen pro Punkt deiner persönlichen Fahndungsstufe, um deine ursprüngliche, echte SIN aus der Matrix zu entfernen. Dadurch wird deine persönliche Fahndungsstufe auf die Hälfte (abgerundet) gesenkt. Du kannst den Nachteil SIN-Mensch oder Kriminelle SIN für 8 Karma entfernen. Zu einem beliebigen Zeitpunkt danach kannst du den Nachteil Fahndungsakte für 10 Karma entfernen. Der emotionale Pfad endet an dieser Stelle.
quality.sinners_path_record=Fahndungsakte
quality.sinners_path_record.page=153
quality.sinners_path_record.desc=Zu deinem Pech wurden einige Beweise deiner Vergehen zusammengetragen und ein Profil in einer Datenbank der Strafverfolgungsbehörden angelegt. <br/>Auswirkung: Immer, wenn du versuchst, eine gefälschte SIN oder eine gefälschte Lizenz zu verwenden, gilt deren Stufe als um 1 niedriger als normal. Immer, wenn deine Fahndungsstufe steigt, steigt sie um 1 Punkt extra (aber maximal um 1 Punkt extra pro Spielsitzung). Falls deine Fahndungsstufe jemals 17 erreicht, haben die Strafverfolgungsbehörden genug Informationen gesammelt, um dir deine Verbrechen nachzuweisen. Dein Nachteil SIN-Mensch wird zum Nachteil Kriminelle SIN. Du erhältst 5 Karma, die du nach deiner Wahl ausgeben kannst.
quality.sinners_path_criminal=Kriminelle SIN
quality.sinners_path_criminal.page=153
quality.sinners_path_criminal.desc=Entweder wurde deine ursprüngliche SIN durch deine kriminellen Vergehen als kriminell gekennzeichnet, oder man hat dir eine kriminelle SIN verpasst, nachdem du bei einem Verbrechen erwischt wurdest. <br/>Auswirkung: Immer, wenn du eine gefälschte SIN oder eine gefälschte Lizenz verwendest, ist es sehr viel wahrscheinlicher, dass du mit deiner kriminellen SIN in Verbindung gebracht und erwischt wirst. Alle deine gefälschten SINs und Lizenzen funktionieren nur mit ihrer halben Stufe (aufgerundet), und du kannst kein Edge erhalten oder ausgeben, um ihre Überprüfung zu beeinflussen. Falls die Fahndungsstufen-Probe am Ende eines Runs nicht zu einer Erhöhung der Fahndungsstufe führt, steigt deine persönliche Fahndungsstufe dennoch um 1. Der Nachteil Fahndungsakte wird in diesem Fall nicht angewendet.
quality.sinners_path_shadows=Weg in die Schatten
quality.sinners_path_shadows.page=153
quality.sinners_path_shadows.desc=Deine echte SIN belastet dich schwer, also musst du einen Weg finden, um in die Schatten abzutauchen. Dieser Schritt des emotionalen Pfades wird von der Spielleitung eingeleitet, aber er sollte eine Reaktion darauf sein, dass der Charakter endlich etwas wegen des wachsenden Drucks tun möchte. <br/>Auswirkung: Ein Schieber oder eine Connection, die IDs herstellen kann, benötigt 10.000 Nuyen plus 1.000 Nuyen pro Punkt deiner persönlichen Fahndungsstufe, um deine ursprüngliche, echte SIN aus der Matrix zu entfernen. Dadurch wird deine persönliche Fahndungsstufe auf die Hälfte (abgerundet) gesenkt. Du kannst den Nachteil SIN-Mensch oder Kriminelle SIN für 8 Karma entfernen. Zu einem beliebigen Zeitpunkt danach kannst du den Nachteil Fahndungsakte für 10 Karma entfernen. Der emotionale Pfad endet an dieser Stelle.

#Metaechos

metaecho.transhumanism=Transhumanismus
metaecho.transhumanism.page=159
metaecho.transhumanism.desc=Verwendet diese Regel, um mundanen Charakteren durch die Möglichkeit, immer mehr Implantate aufzunehmen, dieselben Optionen für die potenziell unbegrenzte Anhäufung von Kräften zu ermöglichen, wie sie magische Charaktere genießen. <br/>Mit dieser Regel können sich mundane Charaktere weiterentwickeln, sodass sie mehr Bodytech-Implantate verwenden können, als ein unausgebildetes Bewusstsein jemals aufnehmen könnte. Dieser Prozess dauert eine Woche, ist das weltliche Gegenstück zur Initiation und wird wie sie in Graden gemessen. Die Karmakosten für einen neuen Transhumanistengrad betragen 10 + neuer Grad. Für jeden Grad erhält ein Transhumanist ein Essenzloch (s. Kasten Essenzlöcher) mit 1,0 Essenz oder erweitert ein vorhandenes Essenzloch um 1,0, ohne dafür ein Implantat entfernen zu müssen. Beachte, dass die erweiterte Essenzkapazität es dem Charakter nicht ermöglicht, mehr als zwei Arme, zwei Beine, einen Kopf und einen Torso zu haben – es sei denn, sein Metatyp hat entsprechend mehr Gliedmaßen.

