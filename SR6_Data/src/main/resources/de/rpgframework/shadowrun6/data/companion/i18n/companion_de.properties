item.pack_desert1=Gewehr-Ares Desert Strike
item.pack_desert1.page=60
item.pack_desert1.desc=Das Ares Desert Strike und das Crockett EBR gehören zu den effektivsten tragbaren Feuerwaffen, die man kaufen kann.

item.pack_desert2=Gewehr-Ares Desert Strike Schallgedämpft
item.pack_desert2.page=60
item.pack_desert2.desc=Das Ares Desert Strike und das Crockett EBR gehören zu den effektivsten tragbaren Feuerwaffen, die man kaufen kann.

item.pack_crockett=Gewehr-Cavalier Arms Crockett EBR
item.pack_crockett.page=60
item.pack_crockett.desc=Das Ares Desert Strike und das Crockett EBR gehören zu den effektivsten tragbaren Feuerwaffen, die man kaufen kann. Der Grund dafür, dass das Crockett sowohl einen Lasermarkierer als auch ein Smartgunsystem hat, liegt darin, dass man normalerweise den Vorteil eines Smartlinks haben will. Aber wenn Heimlichkeit wichtig ist, ist es nützlich, drahtlose Geräte abzuschalten, um einer Entdeckung zu entgehen. Es schadet nie, etwas in Reserve zu haben.

item.pack_valiant=Maschinengewehre-Ingram Valiant
item.pack_valiant.page=60
item.pack_valiant.desc=Über diese dicken Knarren gibt es nicht viel zu sagen. Aufgrund ihrer hohen Feuerrate ist in diesen Paketen etwas mehr Munition enthalten – außer bei der Panther natürlich, die Sturmkanonenmunition verwendet.

