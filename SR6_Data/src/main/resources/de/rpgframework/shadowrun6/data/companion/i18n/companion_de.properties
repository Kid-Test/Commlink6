step.favored_weapon_customization.choice.favored_weapon_custom.fav_weapon_extra_acc.desc=Wähle eine Halterung für Waffenzubehör (auf dem Lauf, am Lauf, unter dem Lauf). An dieser Stelle darfst du zwei Zubehöroptionen anbauen.
