quality.critter_goodbye.page=151
quality.critter_goodbye.desc=An einem bestimmten Punkt endet die Bindung zwischen einem Charakter und seinem Critter. Ob es der Tod, die Entfernung oder ein anderer Einfluss ist, der zu einer Trennung führt, die Verbindung zwischen den beiden ist dauerhaft getrennt.<br/>Auswirkung: Falls dein gebundener Critter für mindestens einen Monat verloren ging, kannst du alle Hoffnung fahren lassen und dich neu orientieren. Falls dein gebundener Critter gestorben ist, muss mindestens ein Monat vergangen sein, bevor du versuchen kannst, eine neue Bindung zu einem anderen Critter aufzubauen. Während dieses Monats kannst du für Proben auf Selbstbeherrschung kein Edge erhalten oder ausgeben. Die Karmakosten für das erste Band und die Große Bindung deines neuen Critters werden um 50 Prozent gesenkt (abgerundet). Alle Vor- und Nachteile, die du bei deinem emotionalen Pfad erhalten hast, werden entfernt, und zwar ohne Karmakosten oder Karmaboni.

qpath.obsession=Obsession
qpath.obsession.page=151
qpath.obsession.desc=Shadowrunner können sich genau wie andere Leute übermäßig in einem bestimmten Ziel oder einem bestimmten Grundsatz verlieren. Dieser emotionale Pfad zeigt einen Weg durch ihre Obsession auf.
qpath.obsession.step.obsession_consumed=Verzehrt
qpath.obsession.step.obsession_consumed.page=151
qpath.obsession.step.obsession_consumed.desc=Ein persönliches Ziel ist die wichtigste Sache auf der Welt für dich. Du kannst nicht aufhören, daran zu denken, und jeder Augenblick, den du nicht darauf verwendest, dieses Ziel zu verwirklichen, ist eine Qual für dich. <br/>Auswirkung: Wähle mit dem Einverständnis der Spielleitung ein bestimmtes Ziel. Dieses Ziel sollte schwer, teuer oder gefährlich zu erreichen sein, aber es muss erreichbar sein. Im Allgemeinen sollte es drei oder mehr Spielsitzungen dauern, dieses Ziel zu erreichen. Du erhältst erst dann das Bonuskarma aus diesem Nachteil, wenn du dieses Ziel erreicht hast. Immer, wenn du die Verwirklichung deines Ziels nicht aktiv vorantreibst, kannst du bei keiner Probe Edge erhalten oder ausgeben. Wenn du dein Ziel erreichst, führe den emotionalen Pfad mit Erfüllt fort. Wenn dein Ziel unerreichbar wird oder du dich entscheidest, das Ziel aufzugeben, führe den emotionalen Pfad mit Anhaltende Pechsträhne fort. Der Charakter bekommt keine Karmabelohnung mehr für Aktivitäten, die der Erreichung seiner Obsession dienen, wohl aber können andere Spielercharaktere Karma erhalten, die dem obsessiven Charakter helfen.
qpath.obsession.step.obsession_fulfilled=Erfüllt
qpath.obsession.step.obsession_fulfilled.page=151
qpath.obsession.step.obsession_fulfilled.desc=Du hast das Ziel deiner Obsession erreicht, aber war das auch befriedigend? Fühlst du dich jetzt besser? Was wirst du jetzt, da du endlich hast, was du dir so sehr gewünscht hast, mit dem Rest deines Lebens anfangen? <br/>Auswirkung: Sobald du das Ziel deiner Obsession erreicht hast, erhältst du die 15 Karma des Bonus aus dem Nachteil Verzehrt. Du kannst es nun dabei belassen und den emotionalen Pfad der Obsession verlassen. Alternativ kannst du auch entscheiden, den emotionalen Pfad bei Zwanghaft veranlagt oder Zielorientiert fortzusetzen.
qpath.obsession.step.obsession_obsessive=Zwanghaft veranlagt
qpath.obsession.step.obsession_obsessive.page=151
qpath.obsession.step.obsession_obsessive.desc=Entweder hast du bekommen, was du wolltest, und es hat deine Welt nicht in Ordnung gebracht, oder aber du bist gescheitert und weißt nicht, was du als Nächstes tun sollst. Egal, wie du an diesen Punkt gekommen bist, du versuchst verzweifelt, eine neue Ausrichtung zu finden, die deinem Leben wieder Sinn gibt. <br/>Auswirkung: Wenn dies das erste Mal ist, dass du diesen emotionalen Pfad beschreitest, darfst du den Karmabonus des Nachteils Zwanghaftes Verhalten ausgeben oder für später aufsparen. Bis du ein neues Ziel für deine Obsession definiert hast, kannst du kein Edge erhalten oder ausgeben. Sobald du ein neues Ziel festgelegt hast, kannst du wie gewohnt Edge erhalten und ausgeben, aber nur, während du aktiv das Ziel deiner Begierde zu verwirklichen versuchst. Dieser Kreislauf endet nie. Du erhältst kein weiteres Karma von diesem emotionalen Pfad. Nach Entscheidung der Spielleitung kannst du aber Karma für das Erreichen deiner Ziele erhalten.
qpath.obsession.step.obsession_goal=Zielorientiert
qpath.obsession.step.obsession_goal.page=151
qpath.obsession.step.obsession_goal.desc=Du hast dein Ziel erreicht und einen gesünderen Weg gefunden, um deine Ambitionen in neue Bahnen zu lenken. Du darfst den Vorteil Brennender Ehrgeiz zu reduzierten Kosten von 8 Karma erwerben (üblicherweise würde der Vorteil im Spiel seine doppelten Basiskosten, also 12 Karma, kosten). Diese Kosten dürfen aus dem Bonus für die Erfüllung deiner Obsession stammen. Der emotionale Pfad endet an dieser Stelle.
qpath.obsession.step.obsession_misfortune=Anhaltende Pechsträhne
qpath.obsession.step.obsession_misfortune.page=151
qpath.obsession.step.obsession_misfortune.desc=Wenn dein Ziel unerreichbar geworden ist, ersetzt dieser Nachteil die anderen Nachteile dieses emotionalen Pfades. Egal, ob es am grausamen Schicksal lag oder an deinem eigenen Versagen, du hast alle Hoffnung fahren lassen, das zu erlangen, was dein Verlangen so sehr befeuert hatte. Du erhältst nicht den Karmabonus des Pfad-Nachteils Verzehrt. Dein Selbstvertrauen ist am Boden. Dieser Nachteil ersetzt alle anderen, die du durch diesen Pfad erlangt hast. Deine Unzufriedenheit beeinflusst deine Einstellung, sodass der Schwellenwert für alle Proben auf Selbstbeherrschung um 1 erhöht ist. Du darfst diesen Nachteil jederzeit für 25 Karma entfernen. Der emotionale Pfad endet an dieser Stelle.
quality.obsession_consumed=Verzehrt
quality.obsession_consumed.page=151
quality.obsession_consumed.desc=Ein persönliches Ziel ist die wichtigste Sache auf der Welt für dich. Du kannst nicht aufhören, daran zu denken, und jeder Augenblick, den du nicht darauf verwendest, dieses Ziel zu verwirklichen, ist eine Qual für dich. <br/>Auswirkung: Wähle mit dem Einverständnis der Spielleitung ein bestimmtes Ziel. Dieses Ziel sollte schwer, teuer oder gefährlich zu erreichen sein, aber es muss erreichbar sein. Im Allgemeinen sollte es drei oder mehr Spielsitzungen dauern, dieses Ziel zu erreichen. Du erhältst erst dann das Bonuskarma aus diesem Nachteil, wenn du dieses Ziel erreicht hast. Immer, wenn du die Verwirklichung deines Ziels nicht aktiv vorantreibst, kannst du bei keiner Probe Edge erhalten oder ausgeben. Wenn du dein Ziel erreichst, führe den emotionalen Pfad mit Erfüllt fort. Wenn dein Ziel unerreichbar wird oder du dich entscheidest, das Ziel aufzugeben, führe den emotionalen Pfad mit Anhaltende Pechsträhne fort. Der Charakter bekommt keine Karmabelohnung mehr für Aktivitäten, die der Erreichung seiner Obsession dienen, wohl aber können andere Spielercharaktere Karma erhalten, die dem obsessiven Charakter helfen.
quality.obsession_fulfilled=Erfüllt
quality.obsession_fulfilled.page=151
quality.obsession_fulfilled.desc=Du hast das Ziel deiner Obsession erreicht, aber war das auch befriedigend? Fühlst du dich jetzt besser? Was wirst du jetzt, da du endlich hast, was du dir so sehr gewünscht hast, mit dem Rest deines Lebens anfangen? <br/>Auswirkung: Sobald du das Ziel deiner Obsession erreicht hast, erhältst du die 15 Karma des Bonus aus dem Nachteil Verzehrt. Du kannst es nun dabei belassen und den emotionalen Pfad der Obsession verlassen. Alternativ kannst du auch entscheiden, den emotionalen Pfad bei Zwanghaft veranlagt oder Zielorientiert fortzusetzen.
quality.obsession_obsessive=Zwanghaft veranlagt
quality.obsession_obsessive.page=151
quality.obsession_obsessive.desc=Entweder hast du bekommen, was du wolltest, und es hat deine Welt nicht in Ordnung gebracht, oder aber du bist gescheitert und weißt nicht, was du als Nächstes tun sollst. Egal, wie du an diesen Punkt gekommen bist, du versuchst verzweifelt, eine neue Ausrichtung zu finden, die deinem Leben wieder Sinn gibt. <br/>Auswirkung: Wenn dies das erste Mal ist, dass du diesen emotionalen Pfad beschreitest, darfst du den Karmabonus des Nachteils Zwanghaftes Verhalten ausgeben oder für später aufsparen. Bis du ein neues Ziel für deine Obsession definiert hast, kannst du kein Edge erhalten oder ausgeben. Sobald du ein neues Ziel festgelegt hast, kannst du wie gewohnt Edge erhalten und ausgeben, aber nur, während du aktiv das Ziel deiner Begierde zu verwirklichen versuchst. Dieser Kreislauf endet nie. Du erhältst kein weiteres Karma von diesem emotionalen Pfad. Nach Entscheidung der Spielleitung kannst du aber Karma für das Erreichen deiner Ziele erhalten.
quality.obsession_goal=Zielorientiert
quality.obsession_goal.page=151
quality.obsession_goal.desc=Du hast dein Ziel erreicht und einen gesünderen Weg gefunden, um deine Ambitionen in neue Bahnen zu lenken. Du darfst den Vorteil Brennender Ehrgeiz zu reduzierten Kosten von 8 Karma erwerben (üblicherweise würde der Vorteil im Spiel seine doppelten Basiskosten, also 12 Karma, kosten). Diese Kosten dürfen aus dem Bonus für die Erfüllung deiner Obsession stammen. Der emotionale Pfad endet an dieser Stelle.
quality.obsession_misfortune=Anhaltende Pechsträhne
quality.obsession_misfortune.page=151
quality.obsession_misfortune.desc=Wenn dein Ziel unerreichbar geworden ist, ersetzt dieser Nachteil die anderen Nachteile dieses emotionalen Pfades. Egal, ob es am grausamen Schicksal lag oder an deinem eigenen Versagen, du hast alle Hoffnung fahren lassen, das zu erlangen, was dein Verlangen so sehr befeuert hatte. Du erhältst nicht den Karmabonus des Pfad-Nachteils Verzehrt. Dein Selbstvertrauen ist am Boden. Dieser Nachteil ersetzt alle anderen, die du durch diesen Pfad erlangt hast. Deine Unzufriedenheit beeinflusst deine Einstellung, sodass der Schwellenwert für alle Proben auf Selbstbeherrschung um 1 erhöht ist. Du darfst diesen Nachteil jederzeit für 25 Karma entfernen. Der emotionale Pfad endet an dieser Stelle.

qpath.favored_weapon=Lieblingswaffe
qpath.favored_weapon.page=151
qpath.favored_weapon.desc=Beachte: Die Karmakosten für diese Vorteile werden nicht verdoppelt, da keiner der hier genannten Vorteile bei der Charaktererschaffung gewählt werden kann.
qpath.favored_weapon.step.favored_weapon_extension=Eine Erweiterung deines Körpers
qpath.favored_weapon.step.favored_weapon_extension.page=151
qpath.favored_weapon.step.favored_weapon_extension.desc=Du hast dich daran gewöhnt, eine spezielle Waffe zu benutzen, und nun ist sie Teil deiner Identität. <br/>Auswirkung: Wähle eine bestimmte Waffe, für die du eine entsprechende Expertise besitzt. Du musst mindestens 10 Karma bei Runs verdient haben, bei denen du diese Waffe in deinem Besitz hattest. Du erhältst einen Würfelpoolbonus von +1 auf alle Proben mit dieser Waffe. Außerdem steigt der Angriffswert der Waffe um 2, wenn du sie führst.
qpath.favored_weapon.step.favored_weapon_customization=Einzigartige Anpassung
qpath.favored_weapon.step.favored_weapon_customization.page=152
qpath.favored_weapon.step.favored_weapon_customization.desc=Deine Waffe ist besonders, aber in diesem Schritt des emotionalen Pfades kannst du sie sogar noch mehr zu deiner eigenen Waffe machen. <br/>Auswirkung: Wenn du Zugriff auf einen Mechanik-Laden hast, darfst du deine Waffe mit einer Ausgedehnten Probe auf Mechanik (Waffenbau) + Logik (6, 1 Woche) verbessern. Du kannst deine Waffe bis zu dreimal verbessern, aber der Schwellenwert der Ausgedehnten Probe steigt für die zweite Anpassung auf 12 und für die dritte Anpassung auf 18. Die Anpassungen sind nicht nur rein technische Modifikationen, sondern vielmehr ein Zeichen deiner Geisteshaltung und deiner Vertrautheit mit dieser Waffe. Sie wirken nur, solange du diese Waffe führst, und dürfen nicht mehr geändert werden, sobald sie einmal vorgenommen wurden. Jeder andere, der deine Waffe verwendet, erhält diese Boni nicht und kann bei Angriffen mit der Waffe kein Edge erhalten oder ausgeben. Für jede Anpassung der Waffe wählst du eine der folgenden Optionen:
qpath.favored_weapon.step.favored_weapon_attachment=Ungesunde Bindung
qpath.favored_weapon.step.favored_weapon_attachment.page=152
qpath.favored_weapon.step.favored_weapon_attachment.desc=Wenn du den Nachteil Ungesunde Bindung für deine Waffe wählst, darfst du gratis eine Anpassung (s.o.) wählen. <br/>Auswirkung: Wenn du eine Waffe verwendest, die mit derselben Fertigkeit geführt wird wie deine Lieblingswaffe, kannst du bei Angriffen mit dieser Waffe kein Edge erhalten oder ausgeben.
qpath.favored_weapon.step.favored_weapon_lost=Verloren!
qpath.favored_weapon.step.favored_weapon_lost.page=152
qpath.favored_weapon.step.favored_weapon_lost.desc=Wenn deine Lieblingswaffe verloren geht, darfst du sie für mindestens einen Monat nicht ersetzen. Falls du dich dazu entscheidest, keine neue Waffe zu deiner Lieblingswaffe zu machen, bleibt der Nachteil Bindung bestehen, bis du ihn für 10 Karma entfernst. Falls du eine neue Lieblingswaffe wählst, musst du deine Ungesunde Bindung auf diese übertragen. Falls du bisher keine Ungesunde Bindung hattest, musst du den Nachteil jetzt wählen. Es kostet kein Karma, eine neue Lieblingswaffe zu wählen, obwohl die einzigartigen Anpassungen natürlich neu erworben werden müssen.
quality.favored_weapon_extension=Eine Erweiterung deines Körpers
quality.favored_weapon_extension.page=151
quality.favored_weapon_extension.desc=Du hast dich daran gewöhnt, eine spezielle Waffe zu benutzen, und nun ist sie Teil deiner Identität. <br/>Auswirkung: Wähle eine bestimmte Waffe, für die du eine entsprechende Expertise besitzt. Du musst mindestens 10 Karma bei Runs verdient haben, bei denen du diese Waffe in deinem Besitz hattest. Du erhältst einen Würfelpoolbonus von +1 auf alle Proben mit dieser Waffe. Außerdem steigt der Angriffswert der Waffe um 2, wenn du sie führst.
