item.pack_panther=Maschinengewehre-Panther XXL
item.pack_panther.page=60
item.pack_panther.desc=Über diese dicken Knarren gibt es nicht viel zu sagen. Aufgrund ihrer hohen Feuerrate ist in diesen Paketen etwas mehr Munition enthalten – außer bei der Panther natürlich, die Sturmkanonenmunition verwendet.

item.pack_mgl6=Werfer-ArmTech MGL-6
item.pack_mgl6.page=60
item.pack_mgl6.desc=Granaten und Raketen sind als Flächenwaffen und zur Ablenkung nützlich, und wenn man es schafft, sein Ziel am Detonationspunkt zu erwischen, ist der verursachte Schaden extrem. Aber denk noch nicht mal darüber nach, sie bei einer heimlichen Operation zu verwenden – außer vielleicht als Ablenkung. Denk daran, dass Munition für diese Waffen teuer ist: 150 Nuyen für die meisten Granaten. Verschwende keine Schüsse!

item.pack_mgl12=Werfer-ArmTech MGL-12
item.pack_mgl12.page=60
item.pack_mgl12.desc=Granaten und Raketen sind als Flächenwaffen und zur Ablenkung nützlich, und wenn man es schafft, sein Ziel am Detonationspunkt zu erwischen, ist der verursachte Schaden extrem. Aber denk noch nicht mal darüber nach, sie bei einer heimlichen Operation zu verwenden – außer vielleicht als Ablenkung. Denk daran, dass Munition für diese Waffen teuer ist: 150 Nuyen für die meisten Granaten. Verschwende keine Schüsse!

item.pack_striker=Werfer-Aztechnology Striker
item.pack_striker.page=61
item.pack_striker.desc=Granaten und Raketen sind als Flächenwaffen und zur Ablenkung nützlich, und wenn man es schafft, sein Ziel am Detonationspunkt zu erwischen, ist der verursachte Schaden extrem. Aber denk noch nicht mal darüber nach, sie bei einer heimlichen Operation zu verwenden – außer vielleicht als Ablenkung. In diesen Paketen sind nur Raketen enthalten, keine Lenkraketen, weil die Zusatzkosten angesichts des minimalen Vorteils zu hoch sind. Denk daran, dass Munition für diese Waffen teuer ist: Über 2.000 Nuyen pro Rakete. Verschwende keine Schüsse!

item.pack_interceptor=Werfer-Onotari Interceptor
