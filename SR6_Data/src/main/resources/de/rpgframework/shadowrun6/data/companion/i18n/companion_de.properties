metatype.valkyrie=Walküre
metatype.valkyrie.page=83
metatype.valkyrie.desc=<b> • ⌀ Größe:</b> 1.76 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 115 kg<br/>\
 Also an alle: Ja, wir haben „Engel“ unter uns. Das sind Individuen mit voll funktionsfähigen Flügeln, die sie zusammen mit ihren angeborenen magischen Kräften in die Lage versetzen, tatsächlich zu fliegen. In Indien und der SAW sind sie nicht als Walküren bekannt, sondern als Garuda ke Santaan (Kinder von Garuda) oder auch einfach als Garudan.<br/>\
 Im Durchschnitt haben Walküren von den Zehen bis zum Schädel eine normale menschliche Körpergröße, wobei sich ihre Flügel um einen weiteren halben Meter bis Meter darüber erheben. Weibliche Walküren weisen an ihren Flügeln helle Farben und Schattierungen auf, die von weiß bis weizenfarben reichen, manchmal aber auch orangefarben oder rot sind. Bei männlichen Walküren tendieren die Flügel farblich zu grau, einschließlich dunkelviolett, blau und schwarz. Nichtbinäre Individuen können sich einer dieser Farbgebungen anpassen oder aber eine Mischung kreieren oder einfach ihr eigenes Ding machen. Bei manchen wurde sogar schon Dunkelgrün als Flügelfarbe gesehen. Beobachtungen von Individuen in der Skandinavischen und der Indischen Union zeigen, dass die Fortpflanzung von Walküren im Wesentlichen die Gleiche wie beim Homo sapiens sapiens ist. Anders als die Raptoren leiden Walküren nicht unter einer Veränderung ihrer Knochenstruktur oder Knochendichte. Sie haben einen Daumenfortsatz in Form einer Klaue am obersten Punkt ihrer Flügel, der in der Lage ist, erheblichen Schaden zu verursachen
metatype.hobgoblin=Hobgoblin
metatype.hobgoblin.page=84
metatype.hobgoblin.desc=<b> • ⌀ Größe:</b> 1.8 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 98 kg<br/>\
 Hobgoblins haben dieselbe Restlichtverstärkung wie die Stammlinie Homo sapiens robustus, ansonsten aber nicht viel mit ihr gemeinsam. Sie weisen grünliche Hauttöne auf, die von einem matten Ocker bis hin zu kräftigem Waldgrün reichen. Sie besitzen einen schlankeren Körperbau, sind nicht so muskulös wie die Stammlinie, und auch ihre Kieferstruktur ist anders: Es fehlen die vergrößerten unteren Eckzähne. Stattdessen haben sie einen schmaleren Kiefer mit spitzen Zähnen. Ihre Augen sind vollständig schwarz, sodass man Sklera, Pupille und Hornhaut nicht voneinander unterscheiden kann. Ein letzter Unterschied ist die in aller Regel weniger ausgeprägte Körperbehaarung.<br/>\
 Hobgoblins gehören zu den von Natur aus wilderen und entschlosseneren aller Metavarianten. Als entdeckt wurde, dass ihre Temperamentausbrüche und Stimmungsschwankungen mit häufigen Veränderungen ihres Hormonspiegels einhergehen, wurden Behandlungsmöglichkeiten gesucht, um Mitgliedern dieser Metavariante zu helfen. Und auch wenn viele Repräsentanten ihrer Gemeinschaften und Clans diese Medikamente verwenden, wenn sie mit Außenstehenden zu tun haben, gilt es unter ihnen als eine Frage des Stolzes und der Ehre, einfach so zu sein, wie man ist, mit all ihrer emotionalen und ausdrucksstarken Art. Mithilfe dieser Medikamente konnten sie allerdings Verhandlungen vorantreiben, um endlich eigene Ländereien in der Mongolei und der nördlichen Mandschurei ihr Eigen nennen zu können.
metatype.ogre=Oger
metatype.ogre.page=85
metatype.ogre.desc=<b> • ⌀ Größe:</b> 1.7 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 101 kg<br/>\
 Oger besitzen größtenteils dieselben körperlichen Charakteristika wie die Stammlinie Homo sapiens robustus, einschließlich der Restlichtverstärkung, der muskulösen Statur, der vergrößerten unteren Eckzähne und der spitz zulaufenden Ohrmuscheln. Die Angehörigen dieser Metavariante, die in größerer Zahl erstmals in Europa und Zentralasien dokumentiert wurde, sind etwas kleiner als der durchschnittliche Ork, haben eine glattere Haut, einen hervortretenden Kiefer und einen breiteren Mund. Sie haben einen leistungsfähigeren Verdauungstrakt, der es ihnen ermöglicht, auch Dinge zu essen, die eigentlich keine Nahrung sind, wie etwa Blechdosen und andere Abfälle (auch wenn diese sehr wenig echten Nährwert bieten). In den 2040ern wurden Oger des Kannibalismus bezichtigt, aber das wurde widerlegt.<br/>\
 In den Jahrzehnten, die auf die Abklärung der Natur ihres Verdauungstraktes folgten, machten Oger einige Fortschritte bei der Verringerung ihrer sozialen Ausgrenzung, aber viele treffen immer noch auf Hindernisse n Gebieten, in denen die Denkweisen noch von den älteren Geschichten geprägt sind. Die Tatsache, dass sie vom Aussehen her nicht weit von der menschlichen Erscheinung entfernt sind, hilft ihnen, auch wenn ihr muskulöser Körperbau oft dazu führt, dass sie Beschäftigung in Branchen finden, in denen körperliche Arbeit gefragt ist. <br/>\
 Oger machen einen wachsenden Prozentsatz der europäischen Orkpopulationen aus und haben sich damit arrangiert, dass man ihnen oft mit viel Voreingenommenheit entgegentritt. Viele von ihnen haben in der Trollrepublik Schwarzwald eine Heimat und ein neues Leben gefunden, wo sie die Rollen von Sprechern und Dolmetschern ausfüllen. Dies wiederum hat auch eine gewisse Anzahl von ihnen als Repräsentanten nach Seattle verschlagen.
metatype.oni=Oni
metatype.oni.page=86
metatype.oni.desc=<b> • ⌀ Größe:</b> 1.9 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 128 kg<br/>\
 Wie die Korobokuru traten auch die Oni zuerst im Japanischen Kaiserreich auf. Als eine Variante der Robustus-Stammlinie wurden sie zum Ziel von Hass, Angst und sogar Völkermord. In den ersten Jahren der Goblinisierung war es in der Tat schockierend, mitzuerleben, wie sich ein Individuum plötzlich und heftig in einen Oni verwandelte. Oni teilen die verbesserte Sehkraft und stärker entwickelten Muskeln ihrer Robustus-Stammlinie, aber das war es dann auch schon mit den Ähnlichkeiten. Der Hautton eines Oni ist einer von drei leuchtenden Farbtönen: leuchtend rot, blau oder orangefarben. In Kombination mit einer sehr kantigen Augenstruktur verleiht ihnen das ein wildes und oft unvergessliches Gesicht. Ihre Ohren stehen seitlich am Schädel ab, was ihnen nach Meinung einiger Beobachter einen elfischen Einschlag verleiht. Dieser ohnehin eindrückliche Schädel wird dann noch einprägsamer durch die Hörner, die aus den Schläfen emporwachsen.<br/>\
 Bis zum heutigen Tag entwickelt sich die Expression des Oni nur bei Leuten japanischer Herkunft oder Abstammung; nirgendwo auf dem Planeten wurden weitere Varianten dokumentiert. Oni kommen auf den japanischen Inseln in großer Zahl vor, was natürlich auch bedeutet, dass sie die vorherrschende Ork-Unterart auf der Insel Yomi sind. Das Wort Oni hat japanische Wurzeln und bezieht sich auf die Dämonen der japanischen Folklore. Frühere Forschungen und Dokumentationen haben bestätigt, dass die auf die Insel Yomi verbannten Oni trotz ihrer Absonderung und Unterwerfung durch die japanische Regierung und die japanischen Megakons in der Lage waren, eine eigene kulturelle Identität zu entwickeln. Das begann mit einer Struktur ähnlich dem feudalen Japan, wobei die meisten Oni dem Kodex des Bushido folgten, sich als Samurai zusammenschlossen und den verschiedenen Herrschern die Treue schworen, die sich auf der Insel etabliert hatten. In den darauffolgenden Jahren versuchten viele Oni, ihre Art zu befreien und aufzuklären, indem sie ihre Form des Bushido an andere Oni weitergaben, die in Japan und auf der ganzen Welt leben.
metatype.satyr=Satyr
metatype.satyr.page=87
metatype.satyr.desc=<b> • ⌀ Größe:</b> 1.6 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 69 kg<br/>\
 Satyrn sind die vielleicht auffälligste und gesellschaftlicheinprägsamste Unterart des Robustus. Sie haben die Restlichtverstärkung ihrer Stammlinie und etwas zusätzliche Muskelmasse, unterscheiden sich von ihr aber hinsichtlich ihrer Gesichtsform, des Aufbaus ihrer Beine und ihrer Gesamtkörpermasse. Außerdem haben sie kurze Hörner, die oft nach hinten gebogen sind und sich über die Schläfen erstrecken, obwohl es auch Varianten gibt, die widder- oder stierartige Stoßhörner ausbilden. Satyrn haben verlängerte Kiefer mit schmalen Nasenzügen und Wangenknochen. Ihnen fehlen die vergrößerten unteren Eckzähne der anderen Robustus-Ausprägungen.<br/>\
 Satyrn passen sich normalerweise an die Kulturen an, in denen sie leben. Es gibt stabile Populationen dieser Metavariante in ganz Europa, wobei größere Zahlen in der Ägäis, im Ostseeraum, der Trollrepublik Schwarzwald und in Nordfrankreich vorkommen. In den nördlichen Ausläufern der Rocky Mountains innerhalb der Sioux-Nation und des Salish-Shidhe-Rats wurden ebenfalls neue Expressionen der Satyrn kontaktiert.<br/>\
 Die Gewalt gegen Satyrn, die in der zweiten Hälfte der 70er-Jahre einsetzte, nimmt immer noch zu, und fast alle hochkarätigen Satyrn des öffentlichen Lebens haben inzwischen Leibwächter. Satyr-Gemeinschaften haben damit begonnen, Sicherheitsanbieter zu engagieren, wenn sie es sich leisten können, und manchmal übernehmen einige Hooder diesen Job für wenig Geld.
metatype.cyclops=Zyklop
metatype.cyclops.page=90
metatype.cyclops.desc=<b> • ⌀ Größe:</b> 2.7 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 421 kg<br/>\
 Die Zyklopen sind eine Metavariante, die zuerst in der Ägäis beobachtet wurde. Sie sind sogar noch massiger gebaut als Trolle und haben wenig Kopf- und Körperbehaarung. Am bekanntesten sind sie für ihr großes einzelnes Auge, das direkt über der Nasenwurzel liegt. Ihre mediterrane Herkunft hat ihnen eine gut gebräunte Haut verliehen, ganz ohne die Dermalablagerungen der trollischen Stammlinie. Üblicherweise haben sie ein einzelnes Horn, wenn sie überhaupt Hörner haben. Ein paar wenige Exemplare haben mehrere Hörner, die ungleichmäßig auf dem Schädel verteilt sind. Da diese Hörner jedoch sehr unbequem sind, entfernen einige Zyklopen sie.<br/>\
 Einige Mediziner hatten die Theorie, dass ein zusätzliches implantiertes Cyberauge Zyklopen in die Lage versetzen könnte, stereoskop wahrzunehmen, aber das hat nicht funktioniert. Selbst wenn sie dann den nötigen Aufbau der Augen haben, fehlen ihnen die neuralen Voraussetzungen, Signale von zwei Augen zu verarbeiten. Statt ihnen eine Verbesserung des Sehvermögens zu geben, verursacht ein zweites Auge lediglich Kopfschmerzen. Dank seiner Größe verleiht ihnen ihr Einzelauge aber eine hinreichende Tiefenwahrnehmung.
metatype.fomorian=Fomori
metatype.fomorian.page=88
metatype.fomorian.desc=<b> • ⌀ Größe:</b> 2.35 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 224 kg<br/>\
 Fomori weisen dieselben Sichtfähigkeiten wie der primäre Ingentis-Metatyp auf, ebenso die starke Muskulatur, die ausgeprägten Hörner und die vergrößerten unteren Eckzähne. Im Vergleich zur Stammlinie haben sie allerdings eine kleinere Statur und weniger Dermalablagerungen. Ihre Hörner sind schmaler als die der meisten Trolle, was dabei hilft, die Vorurteile zu zerstreuen, mit denen sich andere Trolle häufig konfrontiert sehen. Eine ungewöhnliche Eigenschaft der Fomori ist, dass sie beim Erreichen des Erwachsenenalters alle eine ähnliche Größe erreichen, normalerweise innerhalb eines Toleranzbereichs von zehn Zentimetern.
metatype.giant=Riese
metatype.giant.page=89
metatype.giant.desc=<b> • ⌀ Größe:</b> 3.0 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 467 kg<br/>\
 Auch wenn die meisten Leute denken, Trolle seien groß, gibt es eine Metavariante, die die anderen buchstäblich um einen Kopf überragt. Riesen haben eine durchschnittliche Körpergröße von drei Metern, wobei auch ein paar Individuen dokumentiert sind, die zwischen dreieinhalb und vier Metern groß sind. Ihnen fehlen die Hörner und die Dermalablagerungen der Trolle, aber sie teilen mit ihnen den stämmigen Körperbau und die ausgeprägte Muskulatur. Riesen haben eine üppige Gesichtsbehaarung (zumindest die Männer) und eine rindenartige, ledrige Haut, was ihr raues, wettergegerbtes Aussehen noch betont. Wegen ihrer Größe ist ihre Muskulatur über einen größeren Bereich verteilt, was ihnen eine schlankere Erscheinung verleiht als bei anderen Angehörigen der Ingentis-Subspezies.<br/>\
 Riesen sind darüber hinaus eine der wenigen Metavarianten, die eine ungewöhnliche Tendenz zur genetischen Umkehrung haben – etwa eine von vier weiblichen Nachkommen von Riesen ist menschlich (<i>Homo sapiens sapiens</i>). Diese seltsame genetische Umkehrung passiert am häufigsten in der Pubertät, wurde aber auch schon bei einem weiblichen Individuum beobachtet, das Ende dreißig war. Die Gründe dafür werden noch untersucht, aber bisherige Forschungsergebnisse deuten nicht darauf hin, dass externe Reize wie die Geografie, verminderte astrale Hintergrundstrahlung (also Manablasen oder -hohlräume) oder eine Umkehr in der Familie der Eltern Einfluss hätten.
metatype.minotaur=Minotaur
metatype.minotaur.page=86
metatype.minotaur.desc=<b> • ⌀ Größe:</b> 2.4 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 285 kg<br/>\
 Minotauren tragen keine Stier-DNA in sich, aber sie haben Hörner, weit auseinanderstehende Augen und breite, flache Nasen, die rinderartig aussehen. So sind sie auch zu ihrem Namen gekommen. Ihr Körperbau ist kürzer und stämmiger als bei anderen Trollen, was sie nicht weniger stierähnlich macht.<br/>\
 Minotauren tauchten zuerst auf den griechischen Inseln und in Teilen der Ägäis auf, wobei sich die zweite Generation bis nach Konstantinopel, Zypern und Barcelona ausbreitete. Auch wenn ihr gebräuchlicher Name die Leute denken lässt, dass sie großartig darin sind, Höhlensysteme zu erkunden, haben sie tatsächlich stark in der Schifffahrt und anderen maritimen Berufen Fuß gefasst, und viele von ihnen sind – zusammen mit ihren Verwandten, den Riesen – Konzernbürger von Mærsk geworden. Spinrad International, Saeder-Krupp und (natürlich) Evo bieten Minotauren ebenfalls Konzernbürgerschaften und Beschäftigungsmöglichkeiten an.
metatype.centaur=Zentaur
metatype.centaur.page=87
metatype.centaur.desc=<b> • ⌀ Größe:</b> 2.1 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 435 kg<br/>\
 Ursprünglich wurden die Zentauren fast ausschließlich im griechischen Hochland gefunden und erst später auch in den großen Ebenen Nordamerikas und den Pampas Südamerikas entdeckt. Diese Wesen kommen in einer eindrucksvollen Vielfalt vor. Sie haben typischerweise einen Pferdekörper (obwohl auch Varianten anderer Vierbeiner bekannt sind) und Rumpf, Kopf und Arme eines Metamenschen. Normalerweise ist der Oberkörper menschlich, obwohl auch Ork- und Elfenvarianten bekannt sind.
metatype.merrow=Merrow
metatype.merrow.page=95
metatype.merrow.desc=<b> • ⌀ Größe:</b> 2.85 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 375 kg<br/>\
 Merrow sind eine Spezies der Meere. Sie haben einen orkähnlichen Oberkörper, häufig mit Zierflossen und Kämmen an ihren Ohrmuscheln und entlang ihres Rückens, die manchmal bis an ihre untere Körperhälfte heranreichen. Der Unterkörper ähnelt dem Leib eines geschuppten Wals.<br/>\
 Ihre Augen sind um fast die Hälfte größer als die eines Metamenschen. Die größere Fläche der Iris in Kombination mit einer erhöhten Dichte von Stäbchen und Zapfen verleiht ihnen ein breites Sichtspektrum, das bis ins Ultraviolett reicht. Ihr Schädel hat eine ausgeprägte Kieferpartie, die 38 Zähne enthält – sechs mehr als metamenschliche Schädel –, und sie haben verlängerte Nasengänge, die ihnen in Verbindung mit den Kiemenklappen an der oberen Brust manchmal eine gewisse Ähnlichkeit mit Seepferdchen verleihen.<br/>\
 Sie sind zu Sprache und anderen komplexen Lautäußerungen fähig – was sie fast so lange geheim gehalten haben wie die Nagas, damit sie Gelegenheit hatten, uns Oberflächenbewohner und unsere vielen Eigenarten besser verstehen zu können, ohne sich mit der Notwendigkeit einer Antwort herumschlagen zu müssen.
metatype.naga=Naga
metatype.naga.page=96
metatype.naga.desc=<b> • ⌀ Größe:</b> 6.9 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 245 kg<br/>\
 Der Körper der Nagas sieht aus wie der Körper einer großen Schlange mit physischen Variationen, die den weltlicheren Formen von Schlangen, Giftnattern, Vipern, Würgeschlangen und sogar Kobras ähneln. Nagas besitzen häufig aktive magische Fähigkeiten, die den meisten Metamenschen ebenbürtig oder sogar überlegen sind. Ihre Infiltrationsoperation in alle Aspekte der Konzerne unserer Welt ist so weit fortgeschritten, dass in den ohnehin offenen Armen von Evo nun eine Naga als aktuelle CEO sitzt. Nagas werden bis zu zehn Meter lang, mit einem Umfang von knapp einem Meter, obwohl bekannt ist, dass die „Lords der Nagas“ in Amazonien, die anscheinend auf Anakondas basieren, dreizehn bis vierzehn Meter lang werden können, mit anderthalb Metern Umfang oder sogar mehr.<br/>
 Im Kampf verlassen sich Nagas ganz auf ihre natürlichen Stärken – für einige von ihnen ist das Schnelligkeit, für andere Stärke. Viele Nagas verfügen über dasselbe Gift, das in den zugrunde liegenden weltlichen Arten vorgefunden wird, aber bei den Nagas ist das Gift dank ihrer inhärenten Magie weitaus stärker. Ihre weltweite Gesamtbevölkerung wird heute auf mehr als eine Viertelmillion Exemplare geschätzt. Die größten Bevölkerungszentren befinden sich in Kambodscha, Amazonien und der Indischen Union. Sie sind in den Großen Zehn, mehreren AA-Kons und Nationen wie dem Bangla Commonwealth, Laos, Malaysia, der Mandschurei, dem Salish-Shidhe-Rat, Sichuan, Singapur, Sri Lanka und Vietnam zum Erwerb einer SIN berechtigt.
metatype.naga.item.bite=Biss
metatype.naga.item.bite.page=98
metatype.naga.item.bite.desc=Natürliche Waffe (Biss: Schaden 3K, 8/-/-/-/-)
metatype.pixie=Pixie
metatype.pixie.page=96
metatype.pixie.desc=<b> • ⌀ Größe:</b> 0.6 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 19 kg<br/>\
 Von Pixies glaubt man im Allgemeinen, dass sie von den Feen abstammen, was eine korrekte Klassifizierung schwierig gemacht hat. Ihre seltsame Angewohnheit, bei ihrem Tod zu verschwinden, stellt die Gelehrten ebenfalls vor ein Rätsel. Jüngst haben ausgewählte Anthropologen und Parabiologen die Erlaubnis erhalten, zum Seelie-Hof zu reisen, um mehr über die atemberaubende Vielfalt metaplanarer Lebewesen zu lernen. Und obwohl weder Biopsien noch Nekropsien erlaubt oder durchgeführt wurden, konnte mit unterschiedlichen Werkzeugen und der Unterstützung durch den Seelie-Hof in zwei Jahren Arbeit in Kooperation mit zwei Renraku-Tochterfirmen, Genecraft Biodesigns und dem Australischen Institut für Magische Forschung, eine vollständige, nutzbare Taxonomie erstellt werden.<br/>\
 Wie sich herausgestellt hat, stammt der größte Teil der Pixie-Population ursprünglich aus einem Gebiet, das als die Wilden Feenlande bekannt ist. Diese Populationen kommen mittels versteckter Portale und übernatürlicher Brücken in unsere Welt, die gut gehütete Geheimnisse sind. Die Korrigan, eine Koalition von paranormalen Wesen, Geistern und Feenwesen, feiern immer noch die Gründung der unabhängigen Nation des Waldes von Brocéliande in Frankreich und haben begonnen, andere Teile der Welt auf der Suche nach weiteren geeigneten Plätzen zum Siedeln zu erkunden. Die Pixies sind eine der Hauptkräfte in dieser Gruppierung, stellen deren Führung und geben Richtungsimpulse (soweit dieser lose Zusammenschluss überhaupt zulässt, geführt zu werden).
metatype.sasquatch=Sasquatch
metatype.sasquatch.page=97
metatype.sasquatch.desc=<b> • ⌀ Größe:</b> 2.4 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 244 kg<br/>\
 Normalerweise werden Sasquatche volle drei Meter groß, mit einem Körper, der dicht mit Haar bedeckt ist, dessen Farbe meist Töne ihrer Herkunftsgebiete annimmt und eine Bandbreite von Dunkelbraun und Schwarz über Hellbraun und Blond bis hin zu tiefem Rostrot und dem Elfenbeinweiß des Himalaja abdeckt. <br/>\
 Sasquatche kommunizieren aufgrund von Beschränkungen ihres Stimmapparats mit Gebärdensprache, auch wenn sie die Fähigkeit haben, hohe Töne zu erzeugen, mit denen sie oft die Vogelwelt ihrer Heimatregionen imitieren.<br/>\
 Sasquatche werden von den meisten Megakonzernen als vernunftbegabte Lebewesen anerkannt, wobei Aztechnology, Ares, Evo, Horizon, Saeder-Krupp und Wuxing ihnen auch den Erwerb der Konzernbürgerschaft ermöglichen. Nationen wie die NAN, die Tírs, Aztlan, Amazonien, Jakutien und die Konföderierte Allianz Australien und Neuseeland bieten ihnen eine vollwertige Staatsbürgerschaft an. Die CAS prüft derzeit Petitionen und Verfahren zur Anerkennung, was den Gemeinschaften der Sasquatche in den Bundesstaaten Georgia, Tennessee sowie North und South Carolina Grund zur Hoffnung gibt. Normalerweise beschränken sie sich bei der Wahl ihrer Lebensräume auf natürliche oder ökologisch gesunde Orte.<br/>\
 Obwohl die meisten Sasquatche formell als ungebildet gelten müssen, können sie lernen und sich anpassen. Ihre Kommunikationsmöglichkeiten können mit speziellen Geräten in Form von Handschuhen verbessert werden, die Gebärdensprache in Text oder hörbare Wörter umwandeln.
metatype.sasquatch.item.kick=Tritt
metatype.sasquatch.item.kick.page=98
metatype.sasquatch.item.kick.desc=Natürliche Waffe (Tritt: Schaden 3B, 10/-/-/-/-)

critterpower.vanishing=Verschwinden
critterpower.vanishing.page=98
critterpower.vanishing.desc=Diese Fähigkeit wird häufig mit Wesen von den Meta­ebenen der Feen in Verbindung gebracht. Lebewesen mit dieser Kraft können im wahrsten Sinne des Wortes aus der physischen Welt verschwinden, ohne eine Spur zu hinterlassen. Wenn das Lebewesen verschwindet, verschwindet auch die persönliche Ausrüstung, die es am Körper trägt oder in den Händen hält (die Spiel­ leitung entscheidet, was alles mit dem Lebewesen verschwindet). In den meisten Fällen wird das Ver­schwinden durch den Tod des Feenwesens ausgelöst. In manchen Fällen kann das Verschwinden auch willentlich herbeigeführt werden, aber der Wiedereintritt in die physische Welt kann nur an Orten erfolgen, die eine starke Feennatur haben (auch hier liegt die Entschei­dung bei der Spielleitung).

quality.astral_perception=Astrale Wahrnehmung
quality.astral_perception.page=98
quality.bandersnatch=Bandersnatch
quality.bandersnatch.page=120
quality.bandersnatch.desc=Der Bandersnatch war der erste dokumentierte nichtmetamenschliche Infizierte, ist die klassische Bestie und verhält sich dementsprechend animalisch. Obwohl sie das Fleisch von Sasquatchen bevorzugen (tatsächlich ist dies der Ursprung der sogenannten Bandersnatch-Gleichung in akademischen Kreisen), sind Bandersnatche in der Lage, ihren unersättlichen Appetit mit jeder vernunftbegabten Beute zu stillen. Sie können sich untereinander vermehren und sind sehr territorial, sodass eine Gruppe von ihnen ein Gebiet problemlos dauerhaft unter ihrer Kontrolle halten kann, insbesondere angesichts ihrer adaptiven Tarnung, die sie, abgesehen von einem verräterischen Schimmern sowohl im visuellen als auch im thermischen Spektrum, fast völlig unsichtbar macht. Mit ihrer von den Sasquatchen verbleibenden Fähigkeit zur Nachahmung von Geräuschen stellen sie einfache, aber überzeugende Fallen auf, die das Ziel in eine ideale Position für einen Angriff locken. Bandersnatche sind vor allem deshalb bemerkenswert, weil in letzter Zeit ein Anstieg ihrer theoretisch möglichen Intelligenz beobachtet wurde. Einige Exemplare haben in den vergangenen Monaten sogar mit Metamenschen kommuniziert. Dies scheint dem Trend zu folgen, der schon bei anderen vormalig wilden Arten von Infizierten beobachtet wurde. Möglicherweise zeigt sich hier ein Anlass zur Hoffnung für diese Infizierten, weg vom Parasitismus und hin zur Symbiose einen Weg in die metamenschliche Gesellschaft zu finden. Und tatsächlich sieht ein Bandersnatch ohne seine Tarnung fast wie ein Sasquatch aus – abgesehen von den Reißzähnen und Klauen. Es ist denkbar, dass sie mithilfe einer synthetischen Ersatznahrung ihr altes Leben wiederaufnehmen können.
quality.banshee=Banshee
quality.banshee.page=120
quality.banshee.desc=Die elfische Expression von Stamm I erscheint mager und gespenstisch, da sie die übernatürliche Fähigkeit erlangt, Furcht in ihren Opfern hervorzurufen, was ihrem bevorzugten emotionalen Zustand beim Fressen entspricht. Zum größten Teil ähneln Banshees ansonsten den Vampiren, obwohl sie schon immer noch empfindlicher auf Sonnenlicht reagiert haben und zusätzlich eine Verwundbarkeit gegenüber Silber haben. Es scheint, dass sie durch die Infektion mit einer höheren Wahrscheinlichkeit Erwachen, aber das ist noch nicht bestätigt. Ihre Vorlieben machen sie tendenziell zu soziopathischen Raubtieren, die nur in Begriffen der Angst denken, obwohl einige es hinbekommen, ihren Hunger und die dann auftretenden violetten Augen unter Kontrolle zu halten.
quality.chiron=Chiron
quality.chiron.page=120
quality.chiron.desc=Unter den nichtmetamenschlichen Sapienten, die mit Stamm I infiziert werden können, sind die Chirons sicher die sozialsten, ernähren sie sich doch von der Freude des zügellosen Feierns, wie sich Wendigos von kannibalischen Impulsen ernähren. Ihr zauberhafter Charme ist unglaublich, vor allem in Kombination mit ihrer Fähigkeit, die Gefühle einer ganzen Metamenschenmenge gleichzeitig zu manipulieren. Körperlich sind sie schlank und muskulös, mit dunklem, glänzendem Haar und Fell. Hufe und Nägel werden spitzer und erlangen eine höhere Dichte, und obwohl ihre spitzen, einziehbaren Eckzähne eine hämovore Ernährung wie bei Vampiren plausibel erscheinen lassen, bevorzugen sie den Verzehr von Fleisch ihrer noch lebenden Beute, wobei ihre Augen in allen Schattierungen des Waldes von gelb bis grün leuchten.
quality.dzoo_noo_qua=Dzoo-Noo-Qua
quality.dzoo_noo_qua.page=120
quality.dzoo_noo_qua.desc=Mit Stamm I infizierte Trolle machen eine dramatische Veränderung durch. Sie erhalten ausgedehnte regenerative Fähigkeiten, bis zu dem Punkt, an dem sie an Größe zunehmen und extreme Hornplatten in den Schichten der Oberhaut ausbilden. Ihre Hörner wachsen sowohl in der Größe als auch in der Anzahl, und die normale Hautpanzerung, von der Trolle profitieren, wird zu dicken Panzerplatten, die den Großteil ihres Körpers bedecken und mit zufälligen zusätzlichen Wucherungen bedeckt sind. Dzoo-Noo-Quas sind weniger anfällig für Sonnenlicht als andere Infizierte und haben eine angeborene Resistenz gegen Magie. Tatsächlich scheint ihre gesamte evolutionäre Agenda darauf zu beruhen, dass Verteidigung auch gut für den Angriff ist. Unglücklicherweise führt ihr massives Erscheinungsbild nicht zu verlangsamten Bewegungen, und ein Dzoo-Noo-Qua ist in der Lage, sein Opfer mit hoher Geschwindigkeit und kränklich gelb leuchtenden Augen zu verfolgen, es zu Boden zu reißen und sein Fleisch zu verzehren, während es sich vor Schmerzen windet – denn Schmerzen sind die bevorzugte „Geschmacksrichtung“ von Dzoo-Noo-Quas.
quality.fomoraig=Fomóraig
quality.fomoraig.page=120
quality.fomoraig.desc=Eine verwirrende Mischung aus Fähigkeiten verwandelt einen Troll, der mit Stamm II infiziert wurde, in einen beeindruckenden, cleveren Jäger. Seine Gliedmaßen werden länger und kräftiger, wobei die Oberschicht der Epidermis zu dicken Hornplatten verkalkt, die den Tastsinn fast ausschalten. Dabei bilden sich auch subkutane, kastanienförmige Drüsen, aus denen ätzende Säure hervorquillt. Das macht spezielle Kleidung erforderlich, wenn der Fomóraig überhaupt irgendetwas trägt. Kiemenstrukturen an Hals und Nacken ermöglichen den dauerhaften Aufenthalt im Wasser, was in ländlichen Gegenden oft zum Lauern auf Beute benutzt wird. Überhaupt ziehen Fomóraigs aufgrund ihrer natürlichen Intoleranz gegen Luftverschmutzung ländliche Umgebungen vor. Auch wenn sie in der Regel einen taktischen Hinterhalt und ungewöhnliche Methoden bevorzugen, sind sie dank ihrer Beweglichkeit und Stärke mehr als dazu in der Lage, ein Ziel zu jagen, bis es vor Erschöpfung zusammenbricht oder in die Enge getrieben ist.
quality.ghoul_human=Ghul
quality.ghoul_human.page=121
quality.ghoul_human.desc=Stamm III ist der vielleicht berühmteste Virenstamm der Welt, da er außergewöhnlich ansteckend und deshalb weltweit verbreitet ist. Er hat eine um mehrere Größenordnungen höhere Anzahl an Virenträgern als alle anderen Infizierten zusammen. Die Rede ist von Ghulen. Überall auf der Welt und in jedem Metroplex sind Ghule unabhängig vom Metatyp des Wirtes die einzige Expression von Stamm III. Ghule sind körperlich blind. Dies ist allerdings nicht auf eine Beeinträchtigung des Okzipitallappens zurückzuführen. Durch ihre duale Natur sind sie sehr wohl in der Lage, Auren zu „sehen“, und sie können mithilfe von Cyberaugen ihr normales Sehvermögen wiederherstellen. In Verbindung mit ihrem verbesserten Gehör und Geruchssinn sind sie fähige Jäger, die sich gut an ihre Beute heranpirschen können. Um zu überleben, müssen sie metamenschliches Fleisch verzehren. Sie sind leicht an ihren blassen, schorfigen, haarlosen Körpern und den gehärteten schwarzen Nägeln zu erkennen, die ihnen im Kampf und beim Graben im Untergrund - ihrem primären Lebensraum, wo sie vor dem Sonnenlicht geschützt sind – gute Dienste leisten.
quality.ghoul_dwarf=Ghul (Zwerg)
quality.ghoul_dwarf.page=121
quality.ghoul_dwarf.desc=Stamm III ist der vielleicht berühmteste Virenstamm der Welt, da er außergewöhnlich ansteckend und deshalb weltweit verbreitet ist. Er hat eine um mehrere Größenordnungen höhere Anzahl an Virenträgern als alle anderen Infizierten zusammen. Die Rede ist von Ghulen. Überall auf der Welt und in jedem Metroplex sind Ghule unabhängig vom Metatyp des Wirtes die einzige Expression von Stamm III. Ghule sind körperlich blind. Dies ist allerdings nicht auf eine Beeinträchtigung des Okzipitallappens zurückzuführen. Durch ihre duale Natur sind sie sehr wohl in der Lage, Auren zu „sehen“, und sie können mithilfe von Cyberaugen ihr normales Sehvermögen wiederherstellen. In Verbindung mit ihrem verbesserten Gehör und Geruchssinn sind sie fähige Jäger, die sich gut an ihre Beute heranpirschen können. Um zu überleben, müssen sie metamenschliches Fleisch verzehren. Sie sind leicht an ihren blassen, schorfigen, haarlosen Körpern und den gehärteten schwarzen Nägeln zu erkennen, die ihnen im Kampf und beim Graben im Untergrund - ihrem primären Lebensraum, wo sie vor dem Sonnenlicht geschützt sind – gute Dienste leisten.
quality.ghoul_elf=Ghul (Elf)
quality.ghoul_elf.page=121
quality.ghoul_elf.desc=Stamm III ist der vielleicht berühmteste Virenstamm der Welt, da er außergewöhnlich ansteckend und deshalb weltweit verbreitet ist. Er hat eine um mehrere Größenordnungen höhere Anzahl an Virenträgern als alle anderen Infizierten zusammen. Die Rede ist von Ghulen. Überall auf der Welt und in jedem Metroplex sind Ghule unabhängig vom Metatyp des Wirtes die einzige Expression von Stamm III. Ghule sind körperlich blind. Dies ist allerdings nicht auf eine Beeinträchtigung des Okzipitallappens zurückzuführen. Durch ihre duale Natur sind sie sehr wohl in der Lage, Auren zu „sehen“, und sie können mithilfe von Cyberaugen ihr normales Sehvermögen wiederherstellen. In Verbindung mit ihrem verbesserten Gehör und Geruchssinn sind sie fähige Jäger, die sich gut an ihre Beute heranpirschen können. Um zu überleben, müssen sie metamenschliches Fleisch verzehren. Sie sind leicht an ihren blassen, schorfigen, haarlosen Körpern und den gehärteten schwarzen Nägeln zu erkennen, die ihnen im Kampf und beim Graben im Untergrund - ihrem primären Lebensraum, wo sie vor dem Sonnenlicht geschützt sind – gute Dienste leisten.
quality.ghoul_ork=Ghul (Ork)
quality.ghoul_ork.page=121
quality.ghoul_ork.desc=Stamm III ist der vielleicht berühmteste Virenstamm der Welt, da er außergewöhnlich ansteckend und deshalb weltweit verbreitet ist. Er hat eine um mehrere Größenordnungen höhere Anzahl an Virenträgern als alle anderen Infizierten zusammen. Die Rede ist von Ghulen. Überall auf der Welt und in jedem Metroplex sind Ghule unabhängig vom Metatyp des Wirtes die einzige Expression von Stamm III. Ghule sind körperlich blind. Dies ist allerdings nicht auf eine Beeinträchtigung des Okzipitallappens zurückzuführen. Durch ihre duale Natur sind sie sehr wohl in der Lage, Auren zu „sehen“, und sie können mithilfe von Cyberaugen ihr normales Sehvermögen wiederherstellen. In Verbindung mit ihrem verbesserten Gehör und Geruchssinn sind sie fähige Jäger, die sich gut an ihre Beute heranpirschen können. Um zu überleben, müssen sie metamenschliches Fleisch verzehren. Sie sind leicht an ihren blassen, schorfigen, haarlosen Körpern und den gehärteten schwarzen Nägeln zu erkennen, die ihnen im Kampf und beim Graben im Untergrund - ihrem primären Lebensraum, wo sie vor dem Sonnenlicht geschützt sind – gute Dienste leisten.
quality.ghoul_troll=Ghul (Troll)
quality.ghoul_troll.page=121
quality.ghoul_troll.desc=Stamm III ist der vielleicht berühmteste Virenstamm der Welt, da er außergewöhnlich ansteckend und deshalb weltweit verbreitet ist. Er hat eine um mehrere Größenordnungen höhere Anzahl an Virenträgern als alle anderen Infizierten zusammen. Die Rede ist von Ghulen. Überall auf der Welt und in jedem Metroplex sind Ghule unabhängig vom Metatyp des Wirtes die einzige Expression von Stamm III. Ghule sind körperlich blind. Dies ist allerdings nicht auf eine Beeinträchtigung des Okzipitallappens zurückzuführen. Durch ihre duale Natur sind sie sehr wohl in der Lage, Auren zu „sehen“, und sie können mithilfe von Cyberaugen ihr normales Sehvermögen wiederherstellen. In Verbindung mit ihrem verbesserten Gehör und Geruchssinn sind sie fähige Jäger, die sich gut an ihre Beute heranpirschen können. Um zu überleben, müssen sie metamenschliches Fleisch verzehren. Sie sind leicht an ihren blassen, schorfigen, haarlosen Körpern und den gehärteten schwarzen Nägeln zu erkennen, die ihnen im Kampf und beim Graben im Untergrund - ihrem primären Lebensraum, wo sie vor dem Sonnenlicht geschützt sind – gute Dienste leisten.
quality.gnawer=Nager
quality.gnawer.page=122
quality.gnawer.desc=Nager sind seit über einem Jahrzehnt als Infizierte bekannt, aber ihre Fähigkeiten haben sich seitdem beständig weiterentwickelt. Im Vergleich zu vielen anderen Stamm-II-Infizierten sind sie geistig stabil und rotten sich zu Gruppen zusammen, insbesondere da sich ihr Nahrungsbedarf an Knochen und Mark von Vernunftbegabten sehr gut mit den Bedürfnissen von Blutsaugern und Kannibalen, insbesondere Ghulen, ergänzt, unter denen sie bekanntermaßen häufig leben. Wenn sie jedoch von der zivilisierten Gesellschaft abgeschieden leben, arrangieren sie sich mit Rudeln, Schwärmen oder Rotten verschiedener Tierarten, zu denen sie eine übernatürliche Affinität haben. Ihre raue, felsartige Haut bietet einen bemerkenswerten Schutz. Im Gegensatz zu den meisten anderen Infizierten haben sie verstärkte Zähne, die darauf ausgelegt sind, Knochen zu knacken und zu zermalmen, statt Fetzen aus Fleisch zu reißen oder Wunden zu verursachen.
quality.goblin=Goblin
quality.goblin.page=123
quality.goblin.desc=Zwerge, die sich mit Stamm I infizieren, verlieren die meisten ihrer Haare und ihr Körperfett, wodurch sie so ausgemergelt sind, dass man ihre Knochen unter der grün gefärbten Haut sieht. Ihre Finger - häufig auch die Zehen - werden länger, und die Ohren nehmen oft elfische Proportionen an. Wenn Goblins hungrig sind, nehmen ihre Augen einen kränklichen, grünen Glanz an. Anders als Vampire trachten sie nicht so sehr nach Blut, sondern eher nach Fleisch, was bedeutet, dass es weniger „Überlebende“ ihrer Angriffe gibt, die selbst zu Infizierten werden. Wie Ghule können sie ihre kannibalischen Bedürfnisse ersatzweise mit anderen Quellen von rohem Fleisch besänftigen. Ihre geistigen Fähigkeiten werden durch die Verwandlung stark vermindert, aber in den letzten Jahren haben sie eine größere Vernunftbegabung gezeigt, was in der UNO die Debatte über dieses Thema beendete. Aufgrund ihrer – im Vergleich zu anderen Infizierten weniger starken – Allergie gegen Sonnenlicht und ihrer Verwundbarkeit gegenüber Eisen suchen Goblins eher verlassene und gefährliche Orte auf, insbesondere angesichts ihrer Immunität gegen Feuer. Sie scheinen keine Präferenzen zu haben, wenn es um emotionale Verbindungen geht, aber Angst und Qual sind wahrscheinlich ihre bevorzugte Wahl, wenn man den Zustand ihrer Opfer durch die von ihnen gewählte Ernährungsmethode berücksichtigt.
quality.grendel=Grendel
quality.grendel.page=121
quality.grendel.desc=Grendels gehören vielleicht zu den bemitleidenswerteren Infizierten. Sie hausen im Allgemeinen als scheue, einsame Aasfresser in ihren Verstecken unter der Erde. Ihr Jagdinstinkt ist nur schwach ausgeprägt. Ähnlich wie bei einigen Menschenaffen können sie ihre langen, starken Arme für eine schnelle vierbeinige Fortbewegung nutzen. Auf ihrer Haut wächst ein dickes, verfilztes Fell. Das Sprechen wird ihnen durch überentwickelte Hauer erschwert, aber ähnlich wie andere Infizierte haben sie einen Zuwachs an Vernunftbegabung und Kommunikationsfähigkeit erkennen lassen, zumindest soweit sie es uns demonstrieren wollten. Durch ihre anspruchslose omnivore Ernährung, die größtenteils aus Abfall mit einer Beimischung aus metamenschlichen Überresten besteht (wie sie auf Friedhöfen und in Nekropolen gefunden werden können), sind Grendels für das Überleben an vielen der am wenigsten gastfreundlichen Orte in städtischen Umgebungen optimiert.
quality.harvester=Schnitter
quality.harvester.page=123
quality.harvester.desc=Schnitter wurden erstmals 2069 in Houston gesichtet und sind gewalttätige Vertreter der Stamm-II-Infizierten. Die elfischen Wirte werden zu verdrehten, albtraumhaften Gestalten, hager und kantig mit überentwickelten Fingern, die zu knochigen Rasierklingen deformiert sind. Sie jagen mit erbarmungslosem Hunger, brutaler Geschwindigkeit und animalischer Wildheit, wobei sie ihrer Beute das Fleisch Streifen um Streifen herunterreißen, um es dann Stück für Stück zu fressen. Ihre Geschwindigkeit ist vergleichbar mit höherstufigen Reflexboostern, durch eine erhöhte Muskeldichte sind sie viel stärker als vor der Infektion, und ihre jüngst berichtete Fähigkeit passt gut zu ihrem territorialen Wesen. Dabei handelt es sich um die Fähigkeit, eine Halluzination der Umgebung zu erzeugen und so ihre Beute zu verwirren. Obwohl bereits der Verdacht geäußert wurde, dass auch die Schnitter in den letzten Jahren eine Vernunftbegabung entwickelt haben, gibt es deshalb noch lange keine konkreten Beweise dafür, dass sie dies zu möglicherweise kooperativen oder auch nur vernünftigen Wesen gemacht hat.
quality.jabbawock=Jabberwock
quality.jabbawock.page=121
quality.jabbawock.desc=Wenn ein Sasquatch mit Stamm I des MMVV infiziert wird und zum Jabberwock wird, macht er nur eine recht milde Form der Verwandlung durch. Sein Pelz wird schwarz, und seine Zähne werden etwas länger und deutlich spitzer. Ähnlich wie bei den Vampiren leuchten seine Augen bei Hunger rot. Auch ernähren sich Jabberwocky ausschließlich hämovor und können ebenfalls keine feste Nahrung oder Alkohol zu sich nehmen. Mit ähnlichen Tarnfähigkeiten wie ein Bandersnatch und der Fähigkeit, wie eine Banshee Angst heraufzubeschwören, sind Jabberwocky – egal, wo sie ihr Revier beanspruchen - die unangefochtenen Spitzenprädatoren. Ihre Jagd scheint sich auf eine emotionale Verbindung zu der Verzweiflung zu konzentrieren, die sie in ihrer Beute hervorrufen, und angesichts des Arsenals an Tarnung und emotionaler Manipulation, über das sie verfügen, ist dies eine vergleichsweise einfache Aufgabe.
quality.lamia=Lamie
quality.lamia.page=121
quality.lamia.desc=Nagas, die durch eine Infektion mit Stamm I zu Lamien werden, werden in ihrer Erscheinung viel monströser, mit längeren Fangzähnen, die in der Lage sind, ein potentes, lusterzeugendes Lähmungsgift zu injizieren, das trotz seiner potenziell tödlichen, lähmenden Wirkung auf dem Schwarzmarkt gehandelt und als Freizeitdroge missbraucht wird. Um die Schnauze bilden sich Stacheln und Zacken, und die Schuppen werden dicker und dunkler. Ihre emotionale Nahrungsvorliebe ist recht spezifisch und dreht sich um die Wunscherfüllung ihrer Beute. Um das zu erreichen, haben sie die Fähigkeit, auf das tiefste Verlangen ihres Ziels zuzugreifen und es auf sich zu projizieren, ob es nun ein sentimentales oder sexuelles Verlangen sein mag, also ähnlich wie ein Sukkubus. Sobald sie zu fressen beginnen, werden ihre Augen vollständig mattschwarz und scheinen jegliches Licht zu absorbieren, anstatt selbst zu leuchten.
quality.loup_garou=Werwolf
quality.loup_garou.page=123
quality.loup_garou.desc=Die Verwandlung in einen Werwolf ist schmerzhaft und quälend. Der Wirt wird zu einer ähnlichen Erscheinung wie der klassische Werwolf der Legende verdreht. Ein kurzes, grauschwarzes Fell, spitze Zähne, lange Krallen und tiefschwarze Augen sind nur das, was man von außen sieht. Im Inneren wachsen die Muskeln, verdichten sich und verleihen dem Werwolf eine erstaunliche Geschwindigkeit und Stärke. Das Gehirn ist oft von einer Überentwicklung oder einer schlechten Anpassung der Amygdala und des Hypothalamus betroffen, was zu einer alles beherrschenden Aggression führt, die noch den letzten Rest geistiger Gesundheit ausradiert, der die Qual der Verwandlung überlebt haben mag. Diese Regionen des Gehirns sind es auch, die nach einem grob festgelegten Zeitplan verschiedene Neurochemikalien und Adrenalin ausstoßen, wodurch der Infizierte für etwa vier bis sechs Tage in einem Zyklus von 28 Tagen zu einem heulenden Monster wird. Dieser Zyklus ist an die Mondphasen gekoppelt. Während dieser vier bis sechs Tage sind Werwölfe weitaus gefährlicher, unterliegen einem Drang, zu töten und zu fressen, und haben die zusätzliche Geschwindigkeit und Kraft, um diesem Drang nachzugeben. Durch die Fähigkeit, selbst senkrechte Oberflächen zu erklimmen, und ihre außergewöhnliche Geschwindigkeit und ihre Reflexe können einzelne Exemplare und erst recht ganze Rudel eine gravierende Bedrohung für jede Region darstellen, in der sie auf Streifzug gehen.
quality.mutaqua_mundane=Mutaqua (Mundan)
quality.mutaqua_mundane.page=122
quality.mutaqua_mundane.desc=Gerüchten zufolge soll es sich beim Mutaqua um das Ergebnis eines Experiments von unbekannten Parteien handeln, aber tatsächlich ist der Mutaqua ein Troll, der mit Stamm Ia infiziert wurde. Vergleichbar mit einem Dzoo-Noo-Qua erlangt auch diese Variante eine charakteristische Resistenz gegen Magie und entwickelt eine ausgeprägte Dermalpanzerung, die sich oft als bleiche Dornen ausbildet. Mutaqua scheinen auch die Fähigkeit zu haben, Angst hervorzurufen, haben den üblichen Hunger auf Fleisch und Blut und eine außergewöhnliche Intelligenz. Wenn ihre Augen leuchten, dann in einem reinen, strahlenden Weiß.
quality.mutaqua_awakened=Mutaqua (Erwacht)
quality.mutaqua_awakened.page=122
quality.mutaqua_awakened.desc=Gerüchten zufolge soll es sich beim Mutaqua um das Ergebnis eines Experiments von unbekannten Parteien handeln, aber tatsächlich ist der Mutaqua ein Troll, der mit Stamm Ia infiziert wurde. Vergleichbar mit einem Dzoo-Noo-Qua erlangt auch diese Variante eine charakteristische Resistenz gegen Magie und entwickelt eine ausgeprägte Dermalpanzerung, die sich oft als bleiche Dornen ausbildet. Mutaqua scheinen auch die Fähigkeit zu haben, Angst hervorzurufen, haben den üblichen Hunger auf Fleisch und Blut und eine außergewöhnliche Intelligenz. Wenn ihre Augen leuchten, dann in einem reinen, strahlenden Weiß.
quality.nibiinaabe=Nibiinaabe
quality.nibiinaabe.page=122
quality.nibiinaabe.desc=Obwohl die Merrow schon für sich genommen mysteriös genug sind, sind die Nibiinaabe ein wahrhaft furchterregender Anblick in aquatischer Umgebung. Mit einem ausgeprägteren Rückenkamm, der in spitzen Zacken endet, sowie verlängerten Fingern und einem verlängerten Schwanz sind sie in der Lage, einen unglaublichen Druck auf ihre Opfer auszuüben und sie zu zerquetschen, während sie ihr Blut mit ihren nadelartigen Zähnen saugen. Auf ihren dunkleren und dickeren Schuppen und ihrer Haut entwickeln sie manchmal aschgraue und weiße Streifen, die einen überlegenen natürlichen Schutz und Tarnung bieten, obwohl ihre Fähigkeit, Zonen von übernatürlicher Dunkelheit und Stille zu schaffen, dies überflüssig zu machen scheint. Ihre Augen leuchten während der Nahrungsaufnahme grün bis blau, wenn sie die extreme Panik ihrer Opfer spüren, normalerweise durch das Zerquetschen oder weil ihr Opfer ertrinkt. Ihre Anfälligkeit für Schallangriffe bietet ein breites Spektrum, um ihre Angriffe abzuwehren.
quality.nosferatu_mundane=Nosferatu (mundan)
quality.nosferatu_mundane.page=122
quality.nosferatu_mundane.desc=Nosferatu entstehen ausschließlich aus Menschen und werden oft als eine Art „Super-Vampir“ bezeichnet, da sie dafür bekannt sind, dass sowohl ihre körperlichen als auch ihre magischen Fähigkeiten anwachsen. Gleichzeitig entwickeln sie häufig psychologische Zwänge und andere Störungen. Bemerkenswert darunter ist vor allem ein Hang zu Paranoia und Größenwahnsinn. Das hat zur Folge, dass viele von ihnen die Einsamkeit wählen – eine Option, die sie nur haben, weil sie die Fähigkeit haben, geraubte Lebenskraft viel langsamer zu verbrauchen als alle anderen Infizierten. Wie Vampire haben sie für ihre Beute keine bevorzugte emotionale Befindlichkeit, aber die meisten ihrer Opfer sterben vor Panik, wenn ihnen der Nosferatu noch den letzten Tropfen Blut und die gesamte Seele aussaugt. Nosferatu verlieren fast ihre gesamte Körperbehaarung, und die Haare, die sie nicht verlieren, werden schlohweiß. Ihre Ohren werden manchmal spitz, und ihre Finger verlängern sich. Die mittleren Schneidezähne verwandeln sich zu hakenartigen Fangzähnen, und ihre bleiche Haut spannt sich über unglaublich dichte Knochen. Wenn sie erregt sind, leuchten ihre Augen hellblau oder weiß, manchmal auch mattrot.
quality.nosferatu_awakened=Nosferatu (erwacht)
quality.nosferatu_awakened.page=122
quality.nosferatu_awakened.desc=Nosferatu entstehen ausschließlich aus Menschen und werden oft als eine Art „Super-Vampir“ bezeichnet, da sie dafür bekannt sind, dass sowohl ihre körperlichen als auch ihre magischen Fähigkeiten anwachsen. Gleichzeitig entwickeln sie häufig psychologische Zwänge und andere Störungen. Bemerkenswert darunter ist vor allem ein Hang zu Paranoia und Größenwahnsinn. Das hat zur Folge, dass viele von ihnen die Einsamkeit wählen – eine Option, die sie nur haben, weil sie die Fähigkeit haben, geraubte Lebenskraft viel langsamer zu verbrauchen als alle anderen Infizierten. Wie Vampire haben sie für ihre Beute keine bevorzugte emotionale Befindlichkeit, aber die meisten ihrer Opfer sterben vor Panik, wenn ihnen der Nosferatu noch den letzten Tropfen Blut und die gesamte Seele aussaugt. Nosferatu verlieren fast ihre gesamte Körperbehaarung, und die Haare, die sie nicht verlieren, werden schlohweiß. Ihre Ohren werden manchmal spitz, und ihre Finger verlängern sich. Die mittleren Schneidezähne verwandeln sich zu hakenartigen Fangzähnen, und ihre bleiche Haut spannt sich über unglaublich dichte Knochen. Wenn sie erregt sind, leuchten ihre Augen hellblau oder weiß, manchmal auch mattrot.
quality.vampire_human=Vampir
quality.vampire_human.page=123
quality.vampire_human.desc=Neben den Ghulen ist diese Expression die bekannteste Infizierten-Art, nicht zuletzt, weil sie die namensgebende Art ist. Die große Mehrheit der Vampire entwickelt sich aus menschlichen Wirten, mit ein paar wenigen metamenschlichen Ausnahmen. Die körperliche Erscheinung bleibt weitgehend unverändert, nur die Haut wird etwas blasser, allerdings können extreme Emotionen und Hunger zu rot leuchtenden Augen und verlängerten, spitzeren Eckzähnen führen. Da Vampire unter außergewöhnlichen Allergien gegen Sonnenlicht und Holz leiden, empfinden sie städtische Umgebungen als optimal. Anders als die meisten anderen Infiziertenvarianten verlieren Vampire fast nie ihre kognitive Leistungsfähigkeit und Vernunftbegabung, was dazu führt, dass sie sich im Guten wie im Bösen mit ihrer Beute identifizieren können. Ihre Ernährungsgewohnheiten variieren im Vergleich zu den anderen Stamm I-Varianten am meisten. Wichtig ist nur, dass eine starke, emotionale Bindung besteht, sei es nun Ekstase, Schrecken oder Hass.
quality.wendigo_mundane=Wendigo (mundan)
quality.wendigo_mundane.page=123
quality.wendigo_mundane.desc=Wendigos durchleben eine der dramatischeren Verwandlungen aller Infizierten. Ihnen wächst an ihrem ganzen, nun trollgroßen Körper ein dichter, räudiger Pelz aus weißem Haar. Ohne Ausnahme Erwachen sie und werden zu Schamanen, selbst wenn sie zuvor einer anderen Tradition gefolgt sind. Fast immer folgen sie dann toxischen Schutzgeistern, was ihnen ihre bevorzugte Fressmethode ermöglicht. Und das ist keine angenehme Methode: Wendigos bevorzugen den Geschmack des Fleisches anderer Kannibalen. Zu diesem Zweck scharen sie Anhänger um sich und bilden Kulte, um andere zu jagen. Und so, wie ihre Anhänger ihre Opfer verspeisen, werden diese im Gegenzug zum Opfer ihres Wendigo-Meisters, dessen Augen wie orangefarbene Kohlen leuchten. Ihre Allergie gegen Eisenmetalle ist kaum ein Vorteil für potenzielle Jäger, denn in der Regel wird der Wendigo von seinen fanatischen Anhängern begleitet. Schlimmer noch, Wendigos neigen auch selbst dazu, sich mit anderen ihrer Art in kultischen Zirkeln zusammenzurotten.
quality.wendigo_awakened=Wendigo (erwacht)
quality.wendigo_awakened.page=123
quality.wendigo_awakened.desc=Wendigos durchleben eine der dramatischeren Verwandlungen aller Infizierten. Ihnen wächst an ihrem ganzen, nun trollgroßen Körper ein dichter, räudiger Pelz aus weißem Haar. Ohne Ausnahme Erwachen sie und werden zu Schamanen, selbst wenn sie zuvor einer anderen Tradition gefolgt sind. Fast immer folgen sie dann toxischen Schutzgeistern, was ihnen ihre bevorzugte Fressmethode ermöglicht. Und das ist keine angenehme Methode: Wendigos bevorzugen den Geschmack des Fleisches anderer Kannibalen. Zu diesem Zweck scharen sie Anhänger um sich und bilden Kulte, um andere zu jagen. Und so, wie ihre Anhänger ihre Opfer verspeisen, werden diese im Gegenzug zum Opfer ihres Wendigo-Meisters, dessen Augen wie orangefarbene Kohlen leuchten. Ihre Allergie gegen Eisenmetalle ist kaum ein Vorteil für potenzielle Jäger, denn in der Regel wird der Wendigo von seinen fanatischen Anhängern begleitet. Schlimmer noch, Wendigos neigen auch selbst dazu, sich mit anderen ihrer Art in kultischen Zirkeln zusammenzurotten.

quality.pelage_camouflage=Tarnfell
quality.pelage_camouflage.page=137
quality.pelage_camouflage.desc=Der Charakter ist mit einem dunklen oder gemusterten Fell bedeckt. Er erhält einen Würfelpoolbonus von +1 auf Heimlichkeits-Proben bei schlechten Lichtverhältnissen und in Umgebungen, die zu seinem Fellmuster passen (Streifen helfen in hohem Gras, Flecken im Wald oder Dschungel). Dieser Vorteil ist nicht mit anderen natürlichen oder künstlichen Haar- oder Hautveränderungen kompatibel.
quality.insulating_coat=Isolierendes Fell
quality.insulating_coat.page=136
quality.insulating_coat.desc=Hierbei handelt es sich um einen dichten Pelz, der den gesamten Körper bedeckt. Er ist wärmeisolierend und schützt den Charakter bei Kälte und dem Eintauchen ins Wasser, wodurch der Charakter in kalten Umgebungen (z.B. in den Polarregionen) 1 Edge für Proben auf Natur (Survival) erhält. Außerdem gewährt dieser Vorteil einen Bonus von +4 auf den Verteidigungswert gegen kältebasierte Angriffe. In extrem heißen Umgebungen kosten den Charakter Edge-Boosts und -Handlungen für Proben auf Natur (Survival) 1 Edge mehr als normal. Kleidung und Panzerung können über dem Fell normal getragen werden. Dieser Vorteil ist nicht mit anderen natürlichen oder künstlichen Haar- oder Hautveränderungen kompatibel.
quality.quills=Stacheln
quality.quills.page=137
quality.quills.desc=Diese dicken Hornplatten aus Keratin ähneln dem Borstenkleid eines Stachelschweins. Die Stacheln sind mit Borsten, Fell und Haaren durchsetzt und ersetzen ungefähr einen von hundert Haarfollikeln. Die Stacheln sind im Allgemeinen kürzer als 30 Zentimeter. Sie erhöhen den Verteidigungswert des Charakters im Nahkampf um 2. Außerdem muss ein Angreifer 2K Schaden widerstehen, wenn er mit dem Charakter ringt oder ihn festhält. Dieser Schaden wird durch die Nettoerfolge des Angreifers erhöht.\nDie Stacheln können mit der Fertigkeit Exotische Waffen (Stacheln) im Nahkampf eingesetzt werden (Schaden 3K, Angriffswerte 6/–/–/–/–). Die Arme, die Beine oder der Rücken des Charakters müssen dafür frei von Kleidung sein. Dieser Vorteil ist nicht mit anderen natürlichen oder künstlichen Haar- oder Hautveränderungen kompatibel.
quality.quills.item.metagenetic_quills=Stacheln
quality.corrosive_spit=Ätzender Speichel
quality.corrosive_spit.page=136
quality.corrosive_spit.desc=Wie bei der Critterkraft Ätzender Speichel (SR6, S. 222) kann der Charakter einen Fernkampfangriff durchführen. Dazu legt er eine Probe auf Exotische Waffen (Spucken) + Geschicklichkeit ab. Der Schadenswert des Angriffs beträgt (Stufe des Vorteils x 2)K (Chemisch), die Angriffswerte betragen 4/6/–/–/–. Wenn der Angriff Schaden verursacht, erhält das Ziel zusätzlich den Status Verätzt (SR6, S. 55) mit einer Stufe gleich der Stufe des Vorteils.
quality.corrosive_spit.item.metagenetic_corrosive_spit=Ätzender Speichel
quality.defensive_secretion=Abwehrsekret
quality.defensive_secretion.page=136
quality.defensive_secretion.desc=Ähnlich wie bei Fröschen sondert die Haut des Charakters eine Abwehrflüssigkeit ab, wenn er sich aufregt oder bedroht wird. Dieses Sekret ist säurehaltig und verursacht bei Berührung ein brennendes Gefühl oder (nach Maßgabe der Spielleitung) eine andere nachteilige Hautreaktion. Falls jemand ohne Schutz die nackte Haut des Charakters berührt, wenn dieser aufgeregt ist, erleidet er einen Würfelpoolmalus von -1 auf alle Proben innerhalb der nächsten 24 Stunden oder bis er mit einem Medkit und einer gelungenen Probe auf Biotech (Medizin) + Logik (2) behandelt wurde. Dieser Vorteil wirkt nur gegen Lebewesen. Eine mehrfache Berührung erhöht den Würfelpoolmalus entsprechend, bis zu einem Maximum von -4.
quality.greasy_skin=Ölige Haut
quality.greasy_skin.page=136
quality.greasy_skin.desc=Die Haut des Charakters enthält Schweißdrüsen, die in stressigen oder ermüdenden Situationen eine ölige Flüssigkeit absondern und den Körper mit einem schmierigen Ölfilm einhüllen, der ihm einen feuchten Glanz verleiht. Dieser Gleitfilm beeinträchtigt nicht die regulären Handlungen des Charakters, erhöht aber seinen Verteidigungswert gegen Ringen-Angriffe um 4, falls mindestens die Hälfte des Körpers unbedeckt ist. Dieser Vorteil ist nicht mit starker Körperbehaarung oder natürlichen oder künstlichen Hautveränderungen kom-patibel (mit Ausnahme des Vorteils Abwehrsekret, s.o.).
quality.natural_venom=Natürliches Gift
quality.natural_venom.page=136
quality.natural_venom.desc=Der Charakter produziert ein körpereigenes Gift, wie es auch viele andere Spezies tun. Die Karmakosten und Auswirkungen des Giftes sind der Auflistung unten zu entnehmen. Die Wirkung umfasst immer die Status Benommen (SR6, S. 53) und Vergiftet (SR6, S. 55). Der Status Vergiftet wirkt mit einer Stufe gleich der Kraft des Giftes. Ob Betäubungsschaden oder Körperlicher Schaden verursacht wird, hängt von der Wahl der Wirkung ab.
quality.natural_venom.choice.vector=Vektor
quality.natural_venom.choice.vector.contact=Kontakt
quality.natural_venom.choice.vector.contact.desc=Der Vektor Kontakt benötigt einen erfolgreichen waffenlosen Nahkampf-Angriff zum Berühren. Alternativ kann er mit den Vorteilen Dornen (S. 129), Froschzunge (S. 131), Messerklauen (S. 132) oder Stacheln (S. 137) kombiniert werden.
quality.natural_venom.choice.vector.exhaled=Ausatmen
quality.natural_venom.choice.vector.exhaled.desc=Atemgift
quality.natural_venom.choice.vector.injected=Injektion
quality.natural_venom.choice.vector.injected.desc=Der Vektor Injektion benötigt den Vorteil Reißzähne (S. 132).
quality.natural_venom.choice.vector.spat=Spucken
quality.natural_venom.choice.vector.spat.desc=Der Vektor Spucken erfordert einen Angriff mit der Fertigkeit Exotische Waffen (Spucken) (Angriffswerte 5/–/–/–/–).
quality.natural_venom.choice.speed=Geschwindigkeit
quality.natural_venom.choice.speed.turn=1 Runde
quality.natural_venom.choice.speed.turn.desc=Wirkt am Ende der nächsten Runde
quality.natural_venom.choice.speed.immediate=Sofort
quality.natural_venom.choice.speed.immediate.desc=Wirkt am Ende der Runde
quality.natural_venom.choice.power=Kraft
quality.natural_venom.choice.power.2=Kraft 2
quality.natural_venom.choice.power.2.desc=Kraft 2
quality.natural_venom.choice.power.4=Kraft 4
quality.natural_venom.choice.power.4.desc=Kraft 4
