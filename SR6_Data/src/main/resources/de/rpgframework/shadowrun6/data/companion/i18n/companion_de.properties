# Lifemods
lifemod.it_support=IT Spezialistin
lifemod.it_support.page=39
lifemod.it_support.desc=Diesem Lebensmodul sollte das Lebensmodul Technische Hochschule vorangegangen sein. <br>Technische Probleme kosten die Megakons unfassbar viele Nuyen. Deswegen ist es keine Überraschung, dass gut ausgebildete Fachkräfte allein dafür angestellt werden, diese Probleme zu lösen, sobald sie auftauchen. Hier hast du deine Kenntnisse der Matrix weiterentwickelt und nebenbei gutes Geld verdient.
lifemod.it_support.maintenance_procedures=Wartungsprozeduren
lifemod.it_support.security_systems=Sicherheitssysteme
lifemod.it_support.tech_companies=Technologieunternehmen
lifemod.ganger=Gangmitglied
lifemod.ganger.page=38
lifemod.ganger.desc=Ob es dem schieren Überleben dient, dem Profit durch kriminelle Machenschaften oder nur dem Nervenkitzel, die Mitgliedschaft in einer Gang ist in der Sechsten Welt keine ungewöhnliche Wahl. Du hast diese Wahl ebenfalls aus einem dieser Gründe getroffen. Dazu kommt noch, dass es immer gut ist, Kumpel zu haben, die dir den Rücken freihalten. Es wäre schön gewesen, wenn das auch gestimmt hätte.
