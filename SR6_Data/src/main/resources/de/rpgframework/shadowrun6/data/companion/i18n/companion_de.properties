item.evo_landtreader=Evo Landläufer
item.evo_landtreader.page=96
item.evo_landtreader.desc=Der Landläufer wurde mit einem strapazierfähigen Elektromotor und einem modifizierten Fahrgestell gebaut, das an die Entwürfe der Segways aus früheren Zeiten erinnert. Das Design basiert auf einem Chassis mit drei Rädern, das eine aufrechte Liegevorrichtung mit einem Wasseraufbereitungssystem für Kiemenatmer trägt, die für längere Zeit über Land reisen wollen. Das Wasseraufbereitungssystem kann fast 24 Stunden lang arbeiten, ohne dass Inhalt oder Filter getauscht werden müssen.

#Metatypes
#metatypes.xml
metatype.duende=Duende
metatype.duende.page=91
metatype.duende.desc=<b> • ⌀ Größe:</b> 1,1 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 55 kg<br/>\
 Bei der Analyse von Daten aus mehreren zuvor nicht verfügbaren Quellen wurde eine neue Metavariante der Sechsten Welt bestätigt. Sie ist Teil der Pumilionis-Subspezies und hat den Namen „Duende“ erhalten. Die größte Bevölkerungsgruppe dieser Metavariante entstammt den Philippinen, aber weitere Gemeinschaften wurden in den afrikanischen Nationen Mali-Foso und Niger sowie auf dem südamerikanischen Kontinent in Peru bestätigt. Sie sind für ihre fast ebenholzschwarze glatte Haut, ihr nahezu weißes oder blondes Haar und ihre durchdringend violetten Augen bekannt und sind der Pumilionis-Subtyp, der unter weitreichenden genetischen Veränderungen leiden musste. Die Duende besitzen rekombinante RNA, die der MMVV-Variante ähnelt, wie sie die Goblins aufweisen, eine Variante MMVV-infizierter Zwerge.<br/>\
 Duende leiden allesamt unter Urticaria solaris, der sogenannten Sonnenkrankheit, und zwar in einer extrem gefährlichen Ausprägung, was sie daran hindert, bei Tageslicht nach draußen zu gehen, sofern der Himmel nicht gerade sehr stark bewölkt ist. Sie besitzen dieselbe Widerstandskraft gegen Gifte wie die Pumilionis-Stammlinie und verfügen nicht nur über deren Infrarotsicht, sondern auch über Restlichtverstärkung. Sie sind darüber hinaus außergewöhnlich flink, nicht nur in Bezug auf Bewegungen, sondern auch bezüglich ihrer Reaktionszeit. Dieses Detail hat vielen ihrer Gegner einen ordentlichen Anteil an gebrochenen Knochen und zerschmetterten Kiefern eingebracht. Duende haben außerdem einen triebhaften Hunger auf fleischliche Proteine: Rind, Geflügel, Fisch usw.<br/>\
 Was unter ihren Eigenschaften allerdings wirklich herausragt, ist die Tatsache, dass sie eine gewisse natürliche Immunität gegen alle bekannten Formen des menschlich-metamenschlichen vampirischen Virus haben, einschließlich des Krieger-Stamms, der Ghule erschafft.
metatype.gnome=Gnome
metatype.gnome.page=91
metatype.gnome.desc=<b> • ⌀ Größe:</b> 0,8 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 37 kg<br/>\
 Gnome sind kleiner als Zwerge und haben viel weniger Körperbehaarung, teilen aber die Fähigkeit zur Infrarotsicht mit ihrer Stammlinie. Ihre vielleicht fesselndste Eigenschaft ist ihre angeborene Widerstandskraft gegen jede Art von Magie.<br/>\
 Gnome leben weit verstreut über die gesamte Welt, wobei eine große Anzahl davon auf Mitteleuropa und Kleinasien entfällt. Das Fehlen großer Populationszentren bedeutet auch, dass Gnome oft keine eigene Kultur ausbilden, sondern stattdessen die Gebräuche des Gebietes annehmen, in dem sie geboren wurden
metatype.hanuman=Hanuman
metatype.hanuman.page=93
metatype.hanuman.desc=<b> • ⌀ Größe:</b> 1.2 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 49 kg<br/>\
 Bei ihrer ersten Begegnung mit der zivilisierten Welt wurden die Hanuman fälschlicherweise als Erwachte Affen (Macaca mulatta; Rhesusaffe) klassifiziert, die hauptsächlich auf dem indischen Subkontinent vorkommen. Spätere Studien bestätigten sie aber als Metavariante der Pumilionis-Stammlinie. Hanuman besitzen die Infrarotsicht und die verringerte Größe der Zwerge, verfügen aber über weitere Eigenschaften, die stark vom zwergischen Metatyp abweichen. Sie sind nach Hanuman, einem Gott der Hindu, benannt und weisen mehrere affenartige Eigenschaften auf, wie zum Beispiel verlängerte Gliedmaßen, einen üppigen Haarwuchs am Unterkörper, das Fehlen von Gesichtsbehaarung, vergrößerte Ohrmuscheln und einen Greifschwanz. Das alles kombiniert sich zu einer agilen Spezies, deren Vertreter oft meisterliche Kletterer und Akrobaten sind.<br/>\
 Die Populationen der Hanuman auf der Welt haben angefangen, sich über ihre kleinen Kollektive hinaus zu verbreiten. Viele Hanuman haben die Welt der Megakonzerne betreten, was nicht nur an Evo liegt, sondern auch an Regency MegaMedia und Horizon.
metatype.koborokuru=Korobokuru
metatype.koborokuru.page=93
metatype.koborokuru.desc=<b> • ⌀ Größe:</b> 1.1 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 42 kg<br/>\
 Die Variante der Korobokuru hat die Infrarotsicht, die verringerte Körpergröße, die scharf gezeichneten, markanten Gesichtszüge und die Giftresistenz der zwergischen Stammlinie. Sie weisen eine größere Vielfalt bezüglich der Augen, der Körperbehaarung und der gesamten Muskulatur auf. Ihre Augen sind häufig mandelförmig, und ihre Körperbehaarung und Gesichtsbehaarung ist im Vergleich zu den anderen Pumilionis-Typen weniger üppig, was sich oft in weniger oder kürzeren Bärten und kürzerem und dünnerem Haar äußert. Die Muskeldichte – wie auch ihre Körpermasse insgesamt – ist geringer als beim gewöhnlichen Zwerg. Sie weisen einen schlankeren, muskulöseren Körpertonus und einen beschleunigten Metabolismus auf.<br/>\
 Die Metavariante der Korobokuru ist in Japan am häufigsten, insbesondere unter dem Volk der Ainu auf Hokkaido. Sie hatten ihre Schwierigkeiten, in Japan akzeptiert zu werden, sodass viele in tolerantere Länder wie die NAN, den Freistaat Kalifornien, Indien, Jakutien, Ecuador, Amazonien und den Vatikanstaat ausgewandert sind. Bei Letzterem liegt das daran, dass der Vatikan Korobokuru-Kindern kurz nach dem Erwachen eine sichere Zuflucht zur Verfügung stellte.
metatype.menehune=Menehune
metatype.menehune.page=94
metatype.menehune.desc=<b> • ⌀ Größe:</b> 1.1 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 42 kg<br/>\
 Diese Metavariante besitzt ebenfalls Infrarotsicht und erreicht vergleichbare Körpergrößen wie die zwergische Stammlinie, hat dabei aber ein eher spitzes Gesicht. Ihre Körperbehaarung ist dichter als bei gewöhnlichen Zwergen, und sie haben bemerkenswert dichte, volle Augenbrauen. Ihre Nasenflügel sind im Allgemeinen breit und flach und besitzen einen Muskellappen in den Nasenlöchern, der sich schließen lässt und so verhindert, dass Wasser eindringt. Sie haben lange Füße mit Schwimmhäuten und zusätzlichen Hautschichten, sodass ihre Füße Schwimmflossen ähneln. Ihre Gesamtmuskeldichte ist geringer als bei der Pumilionis-Stammlinie, und sie haben eine zusätzliche dünne Schicht aus kälteisolierendem Fett am gesamten Körper. Kombiniert man all das mit den Nickhäuten über ihren Augen, hat sich diese Spezies extrem gut an das Leben im Wasser angepasst.<br/>\
 Ursprünglich wurde angenommen, dass Menehune in den Gewässern rund um das Königreich Hawai'i beheimatet sind, aber sie stammen tatsächlich von den transozeanischen Küsten. Heutzutage kann man sie überall auf der Welt antreffen. Viele Menehune-Gemeinden teilen ihre Territorien mit anderen intelligenten Meeresbewohnern wie den Merrow, den Meistersingern oder Seedrachen. Mehreren Gerüchten zufolge dienen sie als Spione und Baumeister an Orten, die von der Seedrachin unterstützt werden.
metatype.dalakitnon=Dalakitnon
metatype.dalakitnon.page=78
metatype.dalakitnon.desc=<b> • ⌀ Größe:</b> 1.7 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 80 kg<br/>\
 Dalakitnon stammen ursprünglich von den philippinischen Inseln und ähneln Charakteren der lokalen Legenden. Sie sind hellhäutig, fast schon Albinos, haben hellblondes oder weißes Haar, und ihnen fehlt das Philtrum – die vertikale Rinne zwischen Nase und Oberlippe. Sie weisen außerdem eine sehr ungewöhnliche Allergie gegen Gewürze, hauptsächlich gegen Knoblauch, Senf, Salbei und Zimt, auf.<br/>\
 Dalakitnon besitzen eine einzigartige Eigenschaft, die bisher bei keiner anderen metamenschlichen oder metavariaten Spezies beobachtet werden konnte. Das ist die geschlechtliche Transmorphose, was bedeutet, sie können ihre äußeren Geschlechtsorgane zu bestimmten Zeiten ändern.
metatype.dryad=Dryade
metatype.dryad.page=78
metatype.dryad.desc=<b> • ⌀ Größe:</b> 1.75 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 63 kg<br/>\
 Diese Metavariante des nobilis hat bemerkenswert viele Ähnlichkeiten mit ihrer genetischen Stammlinie, ist allerdings etwas kleiner, schlanker und hat blonde Haare. Über Jahre hinweg war es sehr schwierig, sie zu identifizieren, zu studieren und zu verstehen. Dies lag an ihren übernatürlichen Kräften, die sie häufig benutzten, um sich ebenjener Beobachtung zu entziehen oder die Beobachter zu stören. Diese Hindernisse konnten überwunden werden, als finanzielle Zuwendungen des Apex-Konsortiums es Teams ermöglichten, mit einer Dryadenpopulation auf den Inseln von Papua-Neuguinea dauerhafteren Kontakt aufzunehmen.<br/>\
 Dryaden besitzen oft starke übernatürliche Fähigkeiten. Aufgrund ihrer stark symbiotischen Lebensweise haben sie oft eine enge Bindung zu natürlichen Umgebungen, die sie entschlossen verteidigen. Ein paar Dryaden haben angefangen, sich immer weiter in die Welt vorzuwagen, doch irgendwann zieht es sie alle wieder in ihre Heimatgebiete zurück.
metatype.nocturna=Nocturnen
metatype.nocturna.page=78
metatype.nocturna.desc=<b> • ⌀ Größe:</b> 1.9 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 80 kg<br/>\
 Die Nächtlichen. Schwarzherzen. Dunkelelfen. Diese Nobilis-Metavariante hat in vielen Gesellschaften stark gelitten, besonders in denen mit stark ausgeprägtem Aberglauben. Nocturnen haben fast dieselben phänotypischen Ausprägungen wie die Nobilis-Stammlinie, allerdings mit stärkerer Körperbehaarung, einem empfindlicheren Gehör und einer starken Überempfindlichkeit gegen helles Licht. Letzteres führt dazu, dass die meisten Nächtlichen – nun – nachtaktiv sind. Ihre Körperbehaarung besteht aus einer Deckschicht aus kurzem, dunklem Fell, das üblicherweise auch das Gesicht bedeckt. Nur auf den Handflächen, den Fußsohlen, den Augenlidern und den Genitalien wächst dieses Fell nicht. Es ist häufig schwarz, manchmal auch violett oder dunkelrot. Noch seltenere Farben sind ein tiefdunkles Orange, Dunkelgrün und die Farbe von angelaufener Bronze.<br/>\
 Der Biorhythmus der Nocturnen ist direkt mit dem Tag- und Nachtzyklus gekoppelt, und sie bevorzugen nächtliche Aktivitäten. Die Gründe dafür werden noch untersucht, aber selbst Gentherapien haben keinen Erfolg, wenn es darum geht, den Biorhythmus der Nocturnen für einen längeren Zeitraum zu ändern. Wenn Nocturnen durch Notwendigkeit oder freiwillig tagsüber wach sind, zeigen sie ähnliche Auswirkungen, wie es bei anderen Individuen bei Schlafentzug der Fall wäre, also erhöhte Müdigkeit und Stress.
metatype.wakyambi=Wakyambi
metatype.wakyambi.page=79
metatype.wakyambi.desc=<b> • ⌀ Größe:</b> 2.3 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 145 kg<br/>\
 Früher einmal waren die Wakyambi die vielleicht isolierteste aller Metavarianten. Sie besitzen die gleiche Restlichtverstärkung und Langlebigkeit wie Elfen, haben aber eine bemerkenswerte Körpergröße. Wakyambi können wie Trolle bis zu drei Meter groß werden. Die meisten haben eine dunkle Haut und krauses Haar, wie es in Afrika häufig ist, aber mittlerweile gibt es auch zwei bestätigte Personen mit Albinismus.<br/>\
 Bei Wakyambi treten magische Fähigkeiten häufiger auf als bei den meisten anderen Metatypen. Die meisten von ihnen leben immer noch in eng verbundenen Stammesgemeinschaften in Azanien, und viele ihrer Jugendlichen wagen sich während ihrer normalerweise etwa fünf Jahre dauernden „Traumreise“ in die Welt hinaus. Die Vereinbarung von Evo MetaErgonomics mit der Zulu-Nation hat die Wakyambi-Stämme dazu ermutigt, sich langsam mit einigen Elementen der Welt zu arrangieren, doch das gelang nur in Kombination mit einem tieferen Verständnis, das mit Zeit und Geduld erarbeitet werden musste. Die Wakyambi übernahmen Errungenschaften der Umwelttechnik wie Solar- und Windgeneratoren und neuere Wasserrückgewinnungstechnologien und entwickelten sie weiter. Sie verwenden keine brennbaren Kraftstoffe und hinterlassen keine giftigen Abfälle.
metatype.xapiri_thepe=Xapiri Thëpë
metatype.xapiri_thepe.page=79
metatype.xapiri_thepe.desc=<b> • ⌀ Größe:</b> 1.7 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 57 kg<br/>\
 Von allen Nobilis-Metavarianten isolieren sich die Xapiri Thëpë immer noch am stärksten. Auch sie besitzen die Restlichtverstärkung, die Langlebigkeit und das helle Haar der Nobilis-Stammlinie, aber ihre Haut ist ihr auffälligstes Merkmal. Sie produziert Chlorophyll in Bereichen mit Zellen, die Chloroplasten enthalten, wodurch die Xapiri Thëpë in der Lage sind, mittels Fotosynthese aus Sonnenlicht Energie zu erzeugen. Die Haut beginnt an den Ohren, am Schädel und am Rücken damit, diese Bereiche auszubilden, die sich weiter ausbreiten, wenn das Individuum älter wird. Wenn es das Erwachsenenalter erreicht (was ungefähr im Alter von 45 Jahren der Fall ist), haben sich diese Bereiche schließlich auf den gesamten Körper ausgebreitet.<br/>\
 Xapiri Thëpë geben sich große Mühe, ihre Abgeschiedenheit zu erhalten, vor allem seit entdeckt wurde, dass ihre Haut in bestimmten Wellenlängen von ultraviolettem Licht leicht zu entdecken ist, weil das Licht eine fotoreaktive Reaktion auf ihrer Haut erzeugt. Da sie somit leichter zu entdecken sind, entschieden sie, dass sie zusätzliche Anstrengungen unternehmen sollten, um außer Sicht zu bleiben.
metatype.nartaki=Nartaki
metatype.nartaki.page=82
metatype.nartaki.desc=<b> • ⌀ Größe:</b> 1.75 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 86 kg<br/>\
 Die früheste bekannte Metavariante des H. sapiens sapiens, die zum jetzigen Zeitpunkt wissenschaftlich dokumentiert ist, wurde zuerst in der Indischen Union bestätigt, und zwar während der Jahre kurz vor und während des Vorbeiflugs des Halleyschen Kometen 2061 und wieder 2077 beim Vorbeiflug des McNaught-Kometen. Während der Holi-Feierlichkeiten 2076 gab es einen zusätzlichen Anstieg des Mananiveaus am Ganges, der dazu führte, dass fünfhundert Individuen – alle weiblichen Geschlechts – plötzlich als Nartaki exprimierten.<br/>\
 Nartaki können leicht anhand ihrer zusätzlichen Arme identifiziert werden – sie haben ein oder mehrere zusätzliche Armpaare. Das und die variierenden Haut farben und -töne lassen Nartaki aus fast jeder Menge herausstechen. Durch ihre zusätzlichen Gliedmaßen gehören Nartaki zu den wenigen natürlich vorkommenden Säugetieren mit sechs oder gar acht Gliedmaßen.<br/>\
 Nartaki besitzen außerdem überdurchschnittliche Stärke. Das lässt sich auf eine Vielzahl von Einzelfaktoren in ihrem Körper zurückführen, darunter angepasste Muskelstrukturen, ein spezieller Aufbau des Skeletts und sogar unterstützende hämatologische Eigenschaften.
metatype.nartaki2=Nartaki 2
metatype.nartaki2.page=82
metatype.nartaki2.desc=<b> • ⌀ Größe:</b> 1.75 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 86 kg<br/>\
 Die früheste bekannte Metavariante des H. sapiens sapiens, die zum jetzigen Zeitpunkt wissenschaftlich dokumentiert ist, wurde zuerst in der Indischen Union bestätigt, und zwar während der Jahre kurz vor und während des Vorbeiflugs des Halleyschen Kometen 2061 und wieder 2077 beim Vorbeiflug des McNaught-Kometen. Während der Holi-Feierlichkeiten 2076 gab es einen zusätzlichen Anstieg des Mananiveaus am Ganges, der dazu führte, dass fünfhundert Individuen – alle weiblichen Geschlechts – plötzlich als Nartaki exprimierten.<br/>\
 Nartaki können leicht anhand ihrer zusätzlichen Arme identifiziert werden – sie haben ein oder mehrere zusätzliche Armpaare. Das und die variierenden Haut farben und -töne lassen Nartaki aus fast jeder Menge herausstechen. Durch ihre zusätzlichen Gliedmaßen gehören Nartaki zu den wenigen natürlich vorkommenden Säugetieren mit sechs oder gar acht Gliedmaßen.<br/>\
