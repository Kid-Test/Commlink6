quality.favored_weapon_custom.page=152
quality.favored_weapon_custom.desc=Deine Waffe ist besonders, aber in diesem Schritt des emotionalen Pfades kannst du sie sogar noch mehr zu deiner eigenen Waffe machen. <br/>Auswirkung: Wenn du Zugriff auf einen Mechanik-Laden hast, darfst du deine Waffe mit einer Ausgedehnten Probe auf Mechanik (Waffenbau) + Logik (6, 1 Woche) verbessern. Du kannst deine Waffe bis zu dreimal verbessern, aber der Schwellenwert der Ausgedehnten Probe steigt für die zweite Anpassung auf 12 und für die dritte Anpassung auf 18. Die Anpassungen sind nicht nur rein technische Modifikationen, sondern vielmehr ein Zeichen deiner Geisteshaltung und deiner Vertrautheit mit dieser Waffe. Sie wirken nur, solange du diese Waffe führst, und dürfen nicht mehr geändert werden, sobald sie einmal vorgenommen wurden. Jeder andere, der deine Waffe verwendet, erhält diese Boni nicht und kann bei Angriffen mit der Waffe kein Edge erhalten oder ausgeben. Für jede Anpassung der Waffe wählst du eine der folgenden Optionen:
quality.favored_weapon_attachment=Ungesunde Bindung
quality.favored_weapon_attachment.page=152
quality.favored_weapon_attachment.desc=Wenn du den Nachteil Ungesunde Bindung für deine Waffe wählst, darfst du gratis eine Anpassung (s.o.) wählen. <br/>Auswirkung: Wenn du eine Waffe verwendest, die mit derselben Fertigkeit geführt wird wie deine Lieblingswaffe, kannst du bei Angriffen mit dieser Waffe kein Edge erhalten oder ausgeben.
quality.favored_weapon_lost=Verloren!
quality.favored_weapon_lost.page=152
quality.favored_weapon_lost.desc=Wenn deine Lieblingswaffe verloren geht, darfst du sie für mindestens einen Monat nicht ersetzen. Falls du dich dazu entscheidest, keine neue Waffe zu deiner Lieblingswaffe zu machen, bleibt der Nachteil Bindung bestehen, bis du ihn für 10 Karma entfernst. Falls du eine neue Lieblingswaffe wählst, musst du deine Ungesunde Bindung auf diese übertragen. Falls du bisher keine Ungesunde Bindung hattest, musst du den Nachteil jetzt wählen. Es kostet kein Karma, eine neue Lieblingswaffe zu wählen, obwohl die einzigartigen Anpassungen natürlich neu erworben werden müssen.
