item.pack_smg_cobra=Maschinenpistole-Colt Cobra TZ-120
item.pack_smg_cobra.page=60
item.pack_smg_cobra.desc=Die Praetor und die Ingram Smartgun sind ideal, wenn du eine smartlinkfähige MP brauchst, aber die Colt Cobra und Uzi V wurden so modifiziert, dass sie nicht mit der Matrix interagieren (und deswegen nicht gehackt werden) können. Beachte, dass sowohl die HK-227 als auch die Ingram Smartgun serienmäßig mit Schalldämpfern ausgestattet sind und die Ingram außerdem über ein Gasventilsystem zur Rückstoßkompensation verfügt.

