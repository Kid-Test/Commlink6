Um diesen Vorteil zu erhalten, musst du einen Monat mit der Ausbildung deines Critters verbringen und sie mit einer Ausbildungsprobe abschließen. Gelingt die Probe, darfst du dein eigenes Karma verwenden, um eines der Attribute oder eine der Fertigkeiten deines Critters zu verbessern oder einen Vorteil für ihn zu erwerben. Jede Fertigkeit und jeder Vorteil muss zum Wesen des Critters passen. Es ist schlichtweg unmöglich, Barghests beizubringen, Saxofon zu spielen.
