step.favored_weapon_customization.choice.favored_weapon_custom.fav_weapon_extra_mod=Zusätzliche Modifikationen (Nahkampf)
step.favored_weapon_customization.choice.favored_weapon_custom.fav_weapon_extra_mod.desc=Die Waffe kann bis zu 3 Modifikationen aufnehmen.
