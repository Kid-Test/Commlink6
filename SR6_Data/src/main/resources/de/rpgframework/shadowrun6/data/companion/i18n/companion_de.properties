quality.natural_venom.choice.power.6.desc=Kraft 6
quality.natural_venom.choice.power.8=Kraft 8
quality.natural_venom.choice.power.8.desc=Kraft 8
quality.natural_venom.choice.effect=Wirkung
quality.natural_venom.choice.effect.stun=Betäubungsschaden
quality.natural_venom.choice.effect.stun.desc=Betäubungsschaden
quality.natural_venom.choice.effect.physical=Körperlicher Schaden
quality.natural_venom.choice.effect.physical.desc=Körperlicher Schaden
quality.natural_venom.item.metagenetic_venom_spittle=Gift Spucke
quality.arcane_arrester=Arkaner Blitzableiter
quality.arcane_arrester.page=130
quality.arcane_arrester.desc=Siehe Magieresistenz, SR6, Seite 75.
quality.climate_adaption=Klimatische Anpassung
quality.climate_adaption.page=130
quality.climate_adaption.desc=Ein Charakter mit diesem Vorteil ist besser an das Überleben unter extremen Klimabedingungen (heiß oder kalt; wähle eine) angepasst. Jede Stufe dieses Vorteils gewährt 1 Edge auf alle Proben auf Natur (Survival) und senkt den Status Erschöpft durch die Einwirkung der klimatischen Bedingungen um 1 Stufe. Der Vorteil in einem klimatischen Extrem ist gleichzeitig ein Nachteil im anderen klimatischen Extrem, was darin resultiert, dass alle Edgekosten sowie der Status Erschöpft um 1 pro Stufe in diesem Vorteil steigen, wenn sich der Charakter in einer für ihn gegenteiligen Klimazone befindet. Dieser Vorteil ist nicht mit Dermalpanzerung oder Hautmodifikationen kompatibel. Falls sich der Charakter solche Implantate einbauen lässt, verliert er alle Auswirkungen dieses Vorteils, ohne dass das investierte Karma zurückerstattet wird.
quality.gills=Kiemen
quality.gills.page=130
quality.gills.desc=Unterschiedliche Arten von Kiemen erlauben dem Charakter, in einer anderen als seiner natürlichen Umgebung zu atmen. Üblicherweise bedeutet das, dass Landlebewesen auch unter Wasser atmen können, aber manchmal ist es auch andersherum. Dieser Vorteil kann für Süßwasser oder für Salzwasser erworben werden. Kiemen können am Nacken, im oberen Bereich des Brustkorbs oder unter den Armen angebracht sein (bei einem Nartaki unter dem oberen Armpaar).
quality.gills.choice.type=Art
quality.gills.choice.type.air=Luft
quality.gills.choice.type.air.desc=Charaktere, die normalerweise unter Wasser atmen, können mit diesen Kiemen normale Luft atmen. Sie benötigen eine stärker mit Sauerstoff gesättigte Luft, weswegen sie unter dem Status Erschöpft I (SR6, S. 54) leiden, wenn sie Luft atmen. In größeren Höhen oder bei dünnerer Luft (nach Maßgabe der Spielleitung) erhalten sie den Status Erschöpft II.
quality.gills.choice.type.freshwater=Frischwasser
quality.gills.choice.type.freshwater.desc=Charaktere mit diesen Kiemen können in Süßwasser bis zu einer Tiefe von [Konstitution x 20] Metern ohne Geräte tauchen.
quality.gills.choice.type.saltwater=Salzwasser
quality.gills.choice.type.saltwater.desc=Charaktere mit diesen Kiemen können in Salzwasser bis zu einer Tiefe von [Konstitution x 20] Metern ohne Geräte tauchen.
quality.glamour=Feenglanz
quality.glamour.page=130
quality.glamour.desc=In der Wahrnehmung aller vernunftbegabten Wesen bewegt sich ein Charakter mit diesem Vorteil mit überirdischer Anmut. Sein Gesichtsausdruck wirkt immer strahlend, und seine Stimme berührt die Seelen der Zuhörer mit ihrer emotionalen Botschaft. Wer mit dem Charakter spricht, fühlt sich bewegt und inspiriert: Der Charakter erhält 1 Edge für alle sozialen Proben, die nicht aggressiv sind. Ein Charakter mit diesem Vorteil bleibt anderen besonders gut im Gedächtnis, was beim Versuch, sich an ihn oder seine Worte und Handlungen zu erinnern, 1 Edge für die Probe auf Erinnerungsvermögen gewährt.
quality.metagenetic_attribute_improvement=Metagenetische Verbesserung
quality.metagenetic_attribute_improvement.page=130
quality.metagenetic_attribute_improvement.desc=Ein Charakter mit einer metagenetischen Verbesserung besitzt eine genetische Expression, die die Gene verstärkt, die mit der Entwicklung eines bestimmten geistigen oder körperlichen Attributs in Verbindung stehen. Regeltechnisch heißt das, dass der Maximalwert für das entsprechende Attribut des Charakters (wie in der Tabelle Attribute nach Metatyp, SR6, S. 66, angegeben) um 1 steigt. Dieser Vorteil kann nur einmal pro Attribut gewählt werden und ist kumulativ mit dem Vorteil Außergewöhnliches Attribut (SR6, S. 74).
quality.metahuman_traits=Metamenschliche Merkmale
quality.metahuman_traits.page=131
quality.metahuman_traits.desc=Siehe Menschliches Aussehen, SR6, Seite 75.
quality.nasty_vibe=Böse Ausstrahlung
quality.nasty_vibe.page=130
quality.nasty_vibe.desc=Charaktere mit diesem Vorteil strahlen das ultimativ Böse oder sogar Gefahr aus. Dieses Gefühl wird oft als unangenehm, bedrohlich oder beklemmend beschrieben. Dieser Vorteil gewährt 1 Edge auf alle Proben auf Einfluss (Einschüchtern).
quality.photometabolism=Photometabolismus
quality.photometabolism.page=131
quality.photometabolism.desc=Die Epidermis des Charakters und seine Haarfollikel haben sich so verändert, dass dort Organellen mit Chloroplasten eingelagert werden, die seine Energieversorgung durch Fotosynthese unterstützen. Dadurch erhält der Charakter einen Modifikator von -1 LP auf seine Grundversorgungskosten (S. 193). Außerdem erhält er für alle Einfluss- und Überreden-Proben 1 Edge, wenn er sich zumindest teilweise im Tageslicht befindet. Dafür erhält er auf dieselben Proben einen Würfelpoolmalus von -2, wenn er sich im tiefen Schatten oder in Dunkelheit befindet. Dieser Vorteil ist weder mit dem Nachteil Nachtaktiv (S. 137) noch mit anderen natürlichen oder künstlichen Haar- oder Hautveränderungen kompatibel.
quality.tough_gut=Zäher Magen
quality.tough_gut.page=131
quality.tough_gut.desc=Dieser Vorteil war ursprünglich unter dem Begriff „Ogermagen“ bekannt. Der gesamte Verdauungstrakt des Charakters hat sich dahingehend angepasst, dass der Charakter eine Vielzahl von Substanzen verdauen kann, die normalerweise nicht als Nahrung gelten. Nur organisches Material kann auf diese Weise verwertet werden. Ein Charakter mit diesem Vorteil erhält einen Modifikator von -1 LP auf seine Grundversorgungskosten (S. 193). Außerdem ist er resistenter gegen Toxine mit dem Vektor Einnahme und erhält für entsprechende Toxinwiderstandsproben 1 Edge.
quality.bark=Rindenhaut
quality.bark.page=129
quality.bark.desc=Die Haut des Charakters nimmt die Erscheinung von rauer Baumrinde an. Dieser Vorteil gewährt einen Bonus von +2 auf den Verteidigungswert, der mit anderer Panze-rung kumulativ ist. Durch die Hautbeschaffenheit steigen die Kosten für Kleidung und Panzerung um 10 Prozent.
quality.blubber=Walhaut
quality.blubber.page=130
quality.blubber.desc=Dicke Schichten aus isolierendem Fett und durchblutetem Gewebe wirken als Wärmeisolierung. Dieser Vorteil gewährt 1 Edge bei Widerstandsproben gegen kältebasierte Angriffe und kältebasierten Schaden. Außerdem hebt er den Status Unterkühlt (SR6, S. 55) aus allen nichtmagischen Quellen auf.
quality.camouflage=Tarnmuster
quality.camouflage.page=129
quality.camouflage.desc=Nachdem der Charakter 5 Minuten einem Hintergrund mit harten Kontrasten und verschiedenen Farbaletten ausgesetzt war, kann sich seine Haut innerhalb von 1 Minute an die Musterung des Hintergrundes anpassen. Die Farbgebung kann für bis zu 4 Stunden beibehalten werden. Wenn sich der Charakter (mit mehr als 1 Meter pro Kampfrunde) bewegt, kehrt die normale Hautpigmentierung für die Dauer der Bewegung zurück. Solange die Tarnung aktiv ist, gewährt sie einen Würfelpoolbonus von +1 auf alle Heimlichkeits-Proben, solange mehr als 40 Prozent der Haut des Charakters unbedeckt sind. Sind mindestens 80 Prozent der Haut unbedeckt, erhöht sich dieser Bonus auf +2.
quality.camouflage.choice.variant=Art
quality.camouflage.choice.variant.basic=Statisch
quality.camouflage.choice.variant.basic.desc=Nachdem der Charakter 5 Minuten einem Hintergrund mit harten Kontrasten und verschiedenen Farbaletten ausgesetzt war, kann sich seine Haut innerhalb von 1 Minute an die Musterung des Hintergrundes anpassen. Die Farbgebung kann für bis zu 4 Stunden beibehalten werden. Wenn sich der Charakter (mit mehr als 1 Meter pro Kampfrunde) bewegt, kehrt die normale Hautpigmentierung für die Dauer der Bewegung zurück. Solange die Tarnung aktiv ist, gewährt sie einen Würfelpoolbonus von +1 auf alle Heimlichkeits-Proben, solange mehr als 40 Prozent der Haut des Charakters unbedeckt sind. Sind mindestens 80 Prozent der Haut unbedeckt, erhöht sich dieser Bonus auf +2.
quality.camouflage.choice.variant.dynamic=Dynamisch
quality.camouflage.choice.variant.dynamic.desc=Wie das statische Tarnmuster verändert auch das dynamische Tarnmuster Hautton und -farbe entsprechend dem Hintergrund der Umgebung, nur eben dauerhaft. Der Charakter erhält dieselben Boni auf Heimlichkeits-Proben wie bei der statischen Variante, aber der Bonus bleibt so lange bestehen, wie sich der Charakter nicht schneller als mit seiner halben abgerundeten Bewegungsrate bewegt.
quality.dragon=Drachenhaut
quality.dragon.page=129
quality.dragon.desc=Ein üppiges Schuppenkleid wächst auf der Haut des Charakters, das in der Lage ist, Hitze und Flammen abzuleiten. Dieser Vorteil gewährt 1 Edge bei Widerstandsproben gegen feuerbasierte Angriffe. Außerdem hebt er den Status Brennend (SR6, S. 53) aus allen nichtmagischen Quellen auf.
quality.granite=Granithaut
quality.granite.page=129
quality.granite.desc=Ausgeprägte Ablagerungen aus Kalk und Keratin lassen die Haut des Charakters grau erscheinen und hart wie Stein werden. Dieser Vorteil gewährt einen Bonus von +4 auf den Verteidigungswert sowie die Kraft Verstärkter Panzer (SR6, S. 227) auf Stufe 2. Granithaut ist nicht kumulativ mit getragener Panzerung. Außerdem erhält der Charakter einen Würfelpoolmalus von -1 auf alle Proben, bei denen es um die feinmotorische Manipulation kleiner Gegenstände geht.
quality.rhino=Elefantenhaut
quality.rhino.page=
quality.rhino.desc=Die lederartige Haut des Charakters ist dicker und widerstandsfähiger als Rindenhaut und gewährt ihm einen Bonus von +3 auf seinen Verteidigungswert, der kumulativ mit anderer Panzerung ist.
quality.thorns=Dornen
quality.thorns.page=129
quality.thorns.desc=Die Haut des Individuums ist von spitzen Dornen durchsetzt, die etwa einen Zentimeter lang sind und Pflanzendornen – wie etwa denen einer Rose – ähneln. Diese Dornen wachsen aus einer subdermalen Schicht und wachsen innerhalb weniger Tage nach, wenn sie splittern oder abbrechen. Im waffenlosen Nahkampf erhöhen die Dornen den Angriffswert um 1 und ermöglichen es, mit Angriffen Körperlichen statt Betäubungsschaden zuzufügen. Der Nachteil dabei ist, dass sich der Charakter in einem anhaltenden Zustand des Unbehagens befindet, der zu einem Würfelpoolmalus von -1 auf alle anderen körperlichen Proben führt. Jegliche Kleidung und Panzerung des Charakters muss maßgefertigt werden, wodurch sie um 20 Prozent teurer wird.
quality.broadened_auditory_spectrum=Erweitertes Gehörspektrum
quality.broadened_auditory_spectrum.page=135
quality.broadened_auditory_spectrum.desc=Dieser Vorteil ermöglicht es dem Charakter, auch Geräusche im Ultraschallbereich oder im Infraschallbereich wahrzunehmen (nach Wahl des Spielenden; der Vorteil kann zweimal gewählt werden, einmal für Ultra-, einmal für Infraschall). Der Charakter hat nicht die Fähigkeit, diese(n) Frequenzbereich(e) bewusst an- und abzuschalten. Da diese Art des Hörens immer aktiv ist, können Geräusche, die für andere nicht hörbar sind, für den Charakter ablenkend sein oder ihn zeitweise sogar taub machen. Dieser Vorteil führt zu kleineren, aber sichtbaren Veränderungen der Größe und des Aufbaus des Außenohrs. Er ist inkompatibel mit jeder Form von Ohren-Cyberware, abgesehen vom Dämpfer (SR6, S. 287), wenn dieser als Einzelimplantat eingebaut wird.
quality.broadened_auditory_spectrum.choice.range=Bereich
quality.broadened_auditory_spectrum.choice.range.ultrasonic=Ultraschall
quality.broadened_auditory_spectrum.choice.range.ultrasonic.desc=
quality.broadened_auditory_spectrum.choice.range.infrasonic=Infraschall
quality.broadened_auditory_spectrum.choice.range.infrasonic.desc=
quality.biosonar=Biosonar
quality.biosonar.page=134
quality.biosonar.desc=Wie eine Fledermaus oder ein Delfin besitzt auch der Charakter alle nötigen natürlichen Organe für ein biologisches Echoortungssystem. Indem er Ultraschall in seinem Kehlkopf, Brustkorb oder sogar in den Nasengängen erzeugt, kann er gedanklich ein Bild des umgebenden Raums erzeugen, das durch die reflektierten Echos des Ultraschalls erzeugt wird. Mit einer Nebenhandlung kann der Charakter feste Oberflächen in einer Reichweite von bis zu 50 Metern in der Luft, 200 Metern in Süßwasser und 300 Metern in Salzwasser wahrnehmen. Wenn die Fähigkeit des Vorteils aufrechterhalten wird, kann der Charakter mit einer Nebenhandlung pro Kampfrunde eine Vielzahl von Vorgängen in seinem Umfeld verfolgen. Wenn das Biosonar verwendet wird, hebt es im Kampf und bei der Navigation den Status Geblendet (SR6, S. 54) unabhängig von dessen Stufe auf. Der Charakter kann jederzeit den Status Ertaubt (SR6, S. 54) erhalten, wenn er hochfrequenten Geräuschen ausgesetzt ist, und er kann kein Edge verwenden, um den Auswirkungen dieser Geräusche zu widerstehen. Mit geeigneter Ausrüstung ist es möglich, einen Charakter mit diesem Vorteil zu verfolgen, vorausgesetzt, er sendet aktiv Ultraschall aus.
quality.electrosense=Elektrosinn
quality.electrosense.page=135
quality.electrosense.desc=Der Charakter kann elektrische Felder erspüren, zum Beispiel von elektrischen Geräten, Maschinen oder Sicherheitssystemen. Dieser metagenetische Sinn hat eine Reichweite von [Konstitution + Intuition] Metern. Um den Sinn einzusetzen, muss der Charakter eine Probe auf Wahrnehmung + Intuition ablegen. Die Erfolge werden mit der Tabelle Elektrosinn verglichen. Dieser Vorteil ist eine passive Fähigkeit, der Charakter sendet also selbst keine Signale aus. \nCharaktere mit Wissen über Elektrotechnik, Matrixabläufe oder einem ähnlichen Hintergrund können die Wissensfertigkeit Technosinn entwickeln, mit der sie die zusätzlichen Informationen erhalten können, die in der Tabelle Elektrosinn jeweils hinter dem Schrägstrich angegeben sind.
quality.low-light_vision_metagenetic=Restlichtverstärkung
quality.low-light_vision_metagenetic.page=135
quality.low-light_vision_metagenetic.desc=Siehe SR6, Seite 76.
quality.magnetosense=Magnetsinn
quality.magnetosense.page=135
quality.magnetosense.desc=Ein Charakter mit diesem Vorteil kann Magnetfelder wahrnehmen, wodurch er ihre Anwesenheit, ihre Stärke und die Richtung, in der sie sich befinden, erspüren kann. Dafür muss er eine Probe auf Wahrnehmung + Intuition (3) ablegen, mit einer Reichweite von [Konstitution + Intuition] Metern. Charaktere mit diesem Vorteil können sich auch sehr gut orientieren und erhalten 1 Edge für alle Proben auf Natur (Navigation).
quality.manasense=Manasinn
quality.manasense.page=135
quality.manasense.desc=Der Charakter besitzt die Fähigkeit, jede beliebige Art von aktiver oder passiver magischer Energie – einschließlich der Verwendung von Zaubern – in der Umgebung zu erspüren. Dazu legt er eine Probe auf Astral + Intuition ab und verwendet für die Bestimmung des Ergebnisses die Tabelle Ergebnisse von Wahrnehmungszaubern (SR6, S. 143). Die Reichweite dieses Sinns beträgt [Magie + Intuition] Meter. Sie kann mit einer Willenskraft-Probe erhöht werden. Jeder Erfolg bei dieser Probe erhöht die Reichweite des Sinns um 1 Meter.
quality.balance_receptor=Gleichgewichtsrezeptor
quality.balance_receptor.page=135
quality.balance_receptor.desc=Dieser Vorteil verbessert verschiedene innere Organe, die den Gleichgewichtssinn des Charakters regulieren, und führt zu einer Verbesserung des Gleichgewichtsempfindens. Dadurch erhält der Charakter 1 Edge für alle Athletik-Proben, die mit dem Gleichgewichtssinn zu tun haben.
quality.thermographic_vision_metagenetic=Infrarotsicht
quality.thermographic_vision_metagenetic.page=135
quality.thermographic_vision_metagenetic.desc=Siehe SR6, Seite 75.
quality.thermal_sense=Wärmesinn
quality.thermal_sense.page=136
quality.thermal_sense.desc=Charaktere mit dieser Sinnesanpassung können Infrarotstrahlung (Wärme) wahrnehmen. Die Reichweite dieses Sinns beträgt [Intuition] Meter und ist nichtvisuell. Umgebungsfaktoren, Barrieren oder andere Hindernisse können diesen Sinn beeinflussen. Abhängig von der Anzahl der Nettoerfolge bei einer Probe auf Wahrnehmung + Intuition (2) erhält der Charakter Informationen zur Entfernung, Bewegung, Wärmeabstrahlung und Position einer Wärmequelle. Der Wärmesinn kann nicht durch manabasierte Illusionszauber getäuscht werden. Außerdem senkt er die Stufe des Status Geblendet um eine Stufe.
quality.underwater_vision=Unterwassersicht
quality.underwater_vision.page=136
quality.underwater_vision.desc=Der Charakter besitzt eine besonders angepasste Membran über dem Auge. Dadurch kann er unter Wasser genauso gut wie mit einer Taucherbrille oder Tauchermaske sehen.
quality.vomeronasal_gland=Jacobson-Organ
quality.vomeronasal_gland.page=135
quality.vomeronasal_gland.desc=Ein Charakter mit diesem Vorteil entwickelt zusätzliche olfaktorische Organellen (oder Riechzellen), die seinen Geruchssinn auf eine Ebene mit dem Geruchssinn eines Bluthundes bringen. Außerdem hat er eine erweiterte Amygdala und einen erweiterten Hypothalamus, um die Gerüche, die er jetzt riechen kann, auch zu identifizieren. Das wiederum verbessert nicht nur seinen reinen Geruchssinn, sondern auch die Fähigkeit, Personen anhand ihres Geruchs (wieder) zu erkennen. Außerdem kann der Charakter viele der niederen emotionalen Reaktionen (Anziehung, Angst usw.) besser erkennen und darauf reagieren. Regeltechnisch erhält der Charakter 1 Edge auf alle geruchsbasierten Wahrnehmungsproben sowie auf soziale Proben, wenn er das Ziel riechen kann. Starker Gestank und intensive Umgebungsgerüche verursachen den Status Übelkeit (SR6, S. 55), falls dem Charakter eine Probe auf Konstitution + Willenskraft (2) misslingt.
quality.degree_sight_360=Rundumsicht
quality.degree_sight_360.page=133
quality.degree_sight_360.desc=Dieser Vorteil verleiht dem Charakter eine 360-Grad-Rundumsicht. Dies gelingt durch eine Umpositionierung der Augen oder ein alternatives Zusammenspiel von Sehorganen (nach Wahl des Spielenden). Konkret kann sich dieser Vorteil zum Beispiel in Facettenaugen wie bei Insekten oder einer voneinander unabhängigen Bewegung der Augen wie bei manchen Echsen äußern. Charaktere mit diesem Vorteil erhalten 1 Edge für alle sichtbasierten Wahrnehmungsproben und Überraschungsproben. Die Basisvariante für 5 Karma enthält keine neurologische Anpassung an das Sehen, die nötig ist, damit das sonst stereoskop arbeitende Gehirn die neuen visuellen Informationen auch richtig verarbeitet. Der Charakter erhält einen Würfelpoolmalus von -1 auf alle Proben, wenn er sich schneller als mit seiner Gehbewegungsrate bewegt, sowie einen Malus von -1 auf alle Angriffswerte jenseits der Reichweite Nah. Außerdem kann er keine Bodytech für die Augen erhalten. Mit der Variante für 10 Karma erleidet der Charakter diese Malus nicht und kann sich Implantate für die Augen einbauen lassen. Allerdings ist der Preis dieser Implantate wegen der nötigen Anpassungen 5-mal höher als normal, und die Essenzkosten werden gegenüber der Standardversion der entsprechenden Implantate verdoppelt.
quality.degree_sight_360.choice.neurological=Neurologische Anpassung
quality.degree_sight_360.choice.neurological.unadapted=Rundumsicht (inkl. neurol. Anpassung)
quality.degree_sight_360.choice.neurological.unadapted.desc=Die Basisvariante für 5 Karma enthält keine neurologische Anpassung an das Sehen, die nötig ist, damit das sonst stereoskop arbeitende Gehirn die neuen visuellen Informationen auch richtig verarbeitet. Der Charakter erhält einen Würfelpoolmalus von -1 auf alle Proben, wenn er sich schneller als mit seiner Gehbewegungsrate bewegt, sowie einen Malus von -1 auf alle Angriffswerte jenseits der Reichweite Nah. Außerdem kann er keine Bodytech für die Augen erhalten.
quality.degree_sight_360.choice.neurological.adapted=Rundumsicht (ohzne. neurol. Anpassung)
quality.degree_sight_360.choice.neurological.adapted.desc=Mit der Variante für 10 Karma erleidet der Charakter diese Malus nicht und kann sich Implantate für die Augen einbauen lassen. Allerdings ist der Preis dieser Implantate wegen der nötigen Anpassungen 5-mal höher als normal, und die Essenzkosten werden gegenüber der Standardversion der entsprechenden Implantate verdoppelt.
quality.beak=Schnabel
quality.beak.page=133
quality.beak.desc=Ein normaler Schnabel ist nicht für den Kampf geeignet, der Raubvogelschnabel aber schon. Er kann mit der Fertigkeit Nahkampf (Waffenlos) verwendet werden und hat die folgenden Werte: Schaden 2K, Angriffswerte 6/–/–/–/–.
quality.beak.choice.variant=Art
quality.beak.choice.variant.standard=Standard
quality.beak.choice.variant.standard.desc=Statt eines Mundes und einer Nase hat ein Charakter mit diesem Vorteil einen Schnabel mit Nasenlöchern. Der Schnabel kann in Größe, Form und Funktion wie bei den natürlichen Vorbildern variieren. Der Schnabel ist nicht der einzige vogelartige Vorteil, den der Charakter erhält. Da man mit einem Schnabel nicht kauen kann, muss Nahrung im Ganzen heruntergeschluckt werden. Sie wird dann durch einen Kaumagen aus dicken, kräftigen Wänden zermahlen. Deshalb haben Charaktere mit dem Vorteil Schnabel (gilt auch für Charaktere mit dem Vorteil Raubvogelschnabel) auch immer den regeltechnischen Nutzen des Vorteils Zäher Magen (S. 131).
quality.beak.choice.variant.raptor=Raubvogel
quality.beak.choice.variant.raptor.desc=Statt eines Mundes und einer Nase hat ein Charakter mit diesem Vorteil einen Schnabel mit Nasenlöchern. Der Schnabel kann in Größe, Form und Funktion wie bei den natürlichen Vorbildern variieren. Der Schnabel ist nicht der einzige vogelartige Vorteil, den der Charakter erhält. Da man mit einem Schnabel nicht kauen kann, muss Nahrung im Ganzen heruntergeschluckt werden. Sie wird dann durch einen Kaumagen aus dicken, kräftigen Wänden zermahlen. Deshalb haben Charaktere mit dem Vorteil Schnabel (gilt auch für Charaktere mit dem Vorteil Raubvogelschnabel) auch immer den regeltechnischen Nutzen des Vorteils Zäher Magen (S. 131).<br/><br/>\
 Ein normaler Schnabel ist nicht für den Kampf geeignet, der Raubvogelschnabel aber schon. Er kann mit der Fertigkeit Nahkampf (Waffenlos) verwendet werden und hat die folgenden Werte: Schaden 2K, Angriffswerte 6/–/–/–/–.
quality.beak.item.metagenetic_beak=Schnabel
quality.bicardiac=Zweites Herz
quality.bicardiac.page=134
quality.bicardiac.desc=Ein Charakter mit diesem Vorteil hat ein zweites Herz, das sich in der rechten Hälfte des Brustkorbs befin det und das erste Herz bei der Aufrechterhaltung des kardiovaskulären Systems unterstützt. Der Charakter kann anstrengende Tätigkeiten länger durchführen und für einen längeren Zeitraum einen hohen Blutfluss gewährleisten, der bei normalen Leuten zu Tachykardie führen würde. Ein eventueller Status Erschöpft, den der Charakter erleidet, wird um eine Stufe gesenkt. Dieser Vorteil ist kompatibel mit der Bioware Synthacardium (SR6, S. 294), die aber in diesem Fall 50 Prozent mehr kostet und auch um 50 Prozent höhere Essenzkosten hat.
quality.bone_spikes=Knochenlanzen
quality.bone_spikes.page=132
quality.bone_spikes.desc=Messerscharfe Knocheneinlagerungen wachsen aus der Skelettstruktur des Charakters hervor und durchstoßen seine Haut. Diese Knochenlanzen können nicht eingezogen werden, weshalb Charaktere mit diesem Vorteil keine Panzerung oder einschränkende Kleidung tragen können. Kleidung und Panzerung kann speziell für den Charakter maßgefertigt werden, wodurch die Kosten um 50 Prozent gegenüber dem Listenpreis steigen. Im Kampf gelten die Regeln für Sporne (SR6, S. 292).
quality.bone_spikes.item.metagenetic_spurs=Knochenlanzen
quality.celerity=Schnelligkeit
quality.celerity.page=134
quality.celerity.desc=Dieser Vorteil resultiert aus einer Kräftigung der Muskulatur, die für das Laufen zuständig ist. Dadurch werden die Beinmuskeln ausgeprägter und straffer. Die Bewegungsrate des Charakters erhöht sich um +3/+6/+1. Ein Mensch mit diesem Vorteil hätte also eine Bewegungsrate von 13/21/+2. Dieser Vorteil ist kompatibel mit dem Vorteil Satyrbeine.
quality.claws=Klauen
quality.claws.page=132
quality.claws.desc=Bei den Vorteilen in dieser Gruppe verhärten und verlängern sich die Finger- und die Zehennägel zu Klauen, die ganz unterschiedlichen Zwecken dienen können.
quality.claws.choice.variant=
quality.claws.choice.variant.digging=Graben
quality.claws.choice.variant.digging.desc=Grabklauen gewähren 1 Edge und einen Würfelpoolbonus von +1 auf alle Proben für das Graben ohne Werkzeug oder das Bewegen von Erde. Im Nahkampf sind diese Klauen nur begrenzt nützlich, können aber mit der Fertigkeit Nahkampf (Waffenlos) verwendet werden und haben die folgenden Werte: Schaden 1K, Angriffswerte 4/–/–/–/–.
quality.claws.choice.variant.razor=Messer
quality.claws.choice.variant.razor.desc=Diese Klauen können mit der Fertigkeit Nahkampf (Waffenlos) eingesetzt werden und haben die folgenden Werte: Schaden 3K, Angriffswerte 7/–/–/–/–.
quality.claws.choice.variant.retractable=Einziehbar
quality.claws.choice.variant.retractable.desc=Einziehbare Klauen funktionieren wie Messerklauen, können aber in eine Hautfalte zurückgezogen werden und sind damit auf den ersten Blick nicht zu erkennen. Um sie zu bemerken, ist eine erfolgreiche Probe auf Wahrnehmung + Intuition (2) erforderlich. Grabklauen können keine einziehbaren Klauen sein.
quality.claws.item.claws_digging=Klauen (Graben)
quality.claws.item.claws_razor=Klauen (Messer)
quality.dermal_deposits_metagenetic=Dermalablagerungen
quality.dermal_deposits_metagenetic.page=131
quality.dermal_deposits_metagenetic.desc=Siehe Dermalablagerungen, SR6, Seite 74.
quality.elongated_limbs=Verlängerte Gliedmassen
quality.elongated_limbs.page=134
quality.elongated_limbs.desc=Siehe Große Reichweite, SR6, Seite 74.
quality.fangs=Reisszähne
quality.fangs.page=132
quality.fangs.desc=Die Eckzähne des Charakters sind vergrößert und zugespitzt wie bei einem Fleischfresser. Die Reißzähne können im Kampf mit der Fertigkeit Nahkampf (Waffenlos) eingesetzt werden und haben die folgenden Werte: Schaden 2K, Angriffswerte 5/–/–/–/–.
quality.fangs.item.metagenetic_fangs=Reisszähne
quality.frog_tongue=Froschzunge
quality.frog_tongue.page=131
quality.frog_tongue.desc=Ein Charakter mit diesem Vorteil hat eine lange, klebrige Zunge, die wie mit einer Sprungfeder aus dem Mund geschossen werden, auf ein Ziel zuschießen, es treffen und anschließend wieder eingezogen werden kann. Die Zunge ist stark genug, um einen Gegenstand von maximal 250 Gramm zu schnappen, aber nicht zum koordinierten Greifen geeignet, jedenfalls nicht in einer Weise, die eine Werkzeugverwendung möglich machen würde. Durch das klebrige Sekret der Zunge haftet der Gegenstand an der Zunge, bis man ihn von Hand löst, was eine Probe auf Konstitution + Stärke (2) erfordert. Falls der Charakter auch den Vorteil Natürliches Gift (S. 136) besitzt, kann er die Zunge verwenden, um dieses Gift auf dem Ziel aufzutragen. Dazu ist eine erfolgreiche Angriffsprobe mit Exotische Waffen (Zunge) + Geschicklichkeit (Angriffswerte 8/–/–/–/–) erforderlich.
quality.functional_tail=Funktionaler Schwanz
quality.functional_tail.page=131
quality.functional_tail.desc=In dieser Gruppe von Vorteilen ist die Gemeinsamkeit, dass dem Charakter ein Schwanz aus dem Steißbein wächst. Dieser Schwanz kann geschuppt sein wie bei einer Echse, haarig wie bei einem Affen oder nackt wie bei einem Opossum. Der Schwanz ist voll entwickelt und funktional. Die Kleidung des Charakters muss an den Schwanz angepasst sein, um ihn nutzen zu können. Längeres Sitzen in bestimmten Positionen kann unbequem sein und verursacht einen Würfelpoolmalus von -1 auf alle Handlungen, solange der Charakter auf seinem Schwanz sitzt. Dieser Vorteil ist inkompatibel mit allen anderen natürlichen oder künstlichen Veränderungen sowie Vor- und Nachteilen, die den Schwanz betreffen.
quality.functional_tail.choice.variant=Art
quality.functional_tail.choice.variant.balance=Balance
quality.functional_tail.choice.variant.balance.desc=Diese Form des Schwanzes ist üblicherweise 1 bis 2 Meter lang. Ein Balanceschwanz unterliegt nicht der bewussten Kontrolle des Charakters. Stattdessen bewegt er sich instinktiv und zuckt dabei, wedelt oder wickelt sich unwillkürlich um Haltemöglichkeiten, um die Balance des Charakters zu verbessern. Charaktere mit einem Balanceschwanz erhalten 1 Edge für alle Athletik-Proben, die mit dem Halten des Gleichgewichts, dem Klettern, Turnen oder Springen zu tun haben.
quality.functional_tail.choice.variant.paddle=Ruder
quality.functional_tail.choice.variant.paddle.desc=Dieser breite, geschuppte, biberartige Schwanz kann zum Paddeln und Steuern verwendet werden, wenn der Charakter schwimmt, und gewährt dann einen Würfelpoolbonus von +2 auf alle Proben auf Athletik (Schwimmen).
quality.functional_tail.choice.variant.prehensile=Greif
quality.functional_tail.choice.variant.prehensile.desc=Diese Form des Schwanzes funktioniert wie ein Ba-
lanceschwanz, aber der Charakter kann den Schwanz bewusst kontrollieren, als wäre er eine zusätzliche Glied­ maße. Der Schwanz kann Gegenstände aufnehmen, hat aber Probleme mit feinmotorischen Manipulationen. Einfache Aufgaben, die normalerweise keine Proben erfordern – wie etwa das Drücken eines Knopfes oder das Ziehen eines Auslösers –, erfordern eine gelungene Probe auf Konstitution + Geschicklichkeit (3). Der Schwanz hat eine effektive Stärke gleich der halben abgerundeten Stärke des Charakters, kann aber das gesamte Körpergewicht des Charakters halten, wenn dieser sich an ihm herabhängen lässt.
quality.functional_tail.choice.variant.thagomizer=Stachel
quality.functional_tail.choice.variant.thagomizer.desc=Dieser ausgesprochen muskulöse Schwanz endet in einer Quaste aus Stacheln. Er kann im Nahkampf mit der Fertigkeit Exotische Waffen (Stachelschwanz) eingesetzt werden und hat die folgenden Werte: Schaden 3K, Angriffswerte 8/–/–/–/–.
quality.functional_tail.choice.variant.whip=Peitsche
quality.functional_tail.choice.variant.whip.desc=Ein Schwanz dieser Art ist normalerweise drei Meter lang. Der Charakter kann ihn bewusst kontrollieren und ihn mit der Fertigkeit Exotische Waffen (Peitschenschwanz) wie eine Bullenpeitsche (SR6, S. 249) einsetzen. Außerdem hat der Schwanz dieselben motorischen Fähigkeiten wie ein Greifschwanz.
quality.functional_wings=Funktionale Flügel
quality.functional_wings.page=131
quality.functional_wings.desc=Die wissenschaftliche und die mythologische Welt haben schon lange auf Flügel als Expression bei einem vernunftbegabten Wesen gewartet. Der Einsatz von Flügeln erfordert die Fertigkeit Athletik (Fliegen) und das Attribut Magie, um vernünftig eingesetzt zu werden. Im Flug hat ein Charakter mit diesem Vorteil eine Bewegungsrate von 10/40/+3 mit Flügeln vom Typ 1 und 10/30/+3 mit Flügeln vom Typ 2.
quality.functional_wings.choice.variant=Art
quality.functional_wings.choice.variant.type1=Typ 1
quality.functional_wings.choice.variant.type1.desc=Diese Flügel verwandeln die Arme des Charakters zu Flügeln, wobei das Handgelenk zum mittleren Gelenk des Flügels wird und der Daumen eine geschärfte Kralle (Schaden 1K, Angriffswerte 4/–/–/–/–) aufweist. Dieses mittlere Gelenk ist nicht so gut einsetzbar wie eine normale Hand, weshalb sich die Edge-Kosten jeder körperlichen Handlung, die den Einsatz von Händen benötigt, um 1 erhöhen. Die Flügel sind normalerweise gefiedert, aber einige Expressionen haben fledermausartige oder sogar reptilienartige Flügel. Außerdem hat das Individuum eine veränderte Knochenstruktur und erleidet einen Würfelpoolmalus von -2 auf alle Widerstandsproben gegen Körperlichen Schaden.
quality.functional_wings.choice.variant.type2=Typ 2
quality.functional_wings.choice.variant.type2.desc=Statt die Arme in ein Paar Flügel zu verwandeln, verleiht Typ 2 dem Charakter ein zusätzliches Paar Gliedmaßen, das als Flügel ausgebildet ist, die aus den unteren Schultern und dem oberen Rücken wachsen. Diese Flügel haben ebenfalls einen „Daumen“ im mittleren Gelenk, der zu einer Kralle gebogen ist, mit der der Charakter im Nahkampf angreifen kann (Schaden 3K, Angriffswerte 6/–/–/–/–). Im Gegensatz zur Expression des Typs 1 verändert diese Version nicht die Knochenstruktur des Charakters, wodurch er keinen Würfelpoolmalus auf Widerstandsproben gegen Körperlichen Schaden erleidet.
quality.functional_wings.item.claws1=Flügelklaue
quality.functional_wings.item.claws2=Flügelklaue
quality.goring_horns=Spitze Hörner
quality.goring_horns.page=134
quality.goring_horns.desc=Diese Hörner können mit der Fertigkeit Nahkampf (Waffenlos) eingesetzt werden und haben die folgenden Werte: Schaden 3K, Angriffswerte 7/–/–/–/–. Falls die Stärke des Charakters 6 oder höher ist, erhöhen sich die Angriffswerte auf 9/–/–/–/–.
quality.goring_horns.item.metagenetic_goring_horns=Spitze Hörner
quality.keen_eared=Hellhörig
quality.keen_eared.page=132
quality.keen_eared.desc=Durch übermäßig große Ohren (Aussehen nach Wahl des Spielenden) erhält der Charakter 1 Edge für gehörbasierte Wahrnehmungsproben.
quality.larger_tusks=Verlängerte Hauer
quality.larger_tusks.page=134
quality.larger_tusks.desc=Die verlängerten Hauer sind größere Varianten der normalen metamenschlichen Hauer und ähneln den Stoßzähnen von Elefanten bzw. den Hauern von Warzenschweinen oder Walrössern. Wie Spitze Hörner können sie mit der Fertigkeit Nahkampf (Waffenlos) eingesetzt werden und haben die folgenden Werte: Schaden 2K, Angriffswerte 6/–/–/–/–.
quality.larger_tusks.item.metagenetic_tusks=Hauer
quality.marsupial_pouch=Beuteltiertasche
quality.marsupial_pouch.page=131
quality.marsupial_pouch.desc=Der Charakter bildet einen taschenartigen Beutel auf seiner Brust oder seinem Bauch aus, genau wie die Beuteltasche, die ein Känguru verwendet, um seinen Nachwuchs zu transportieren. Dieser Beutel funktioniert wie ein Schmuggelbehälter (SR6, S. 289).
quality.monkey_paws=Affenfüsse
quality.monkey_paws.page=131
quality.monkey_paws.desc=Ein Charakter mit diesem Vorteil hat affen- oder chamäleonartige Füße mit verlängerten, greiffähigen Zehen, die es ihm ermöglichen, besser zu klettern, solange er barfuß ist. Dieser Vorteil gewährt 1 Edge für alle Athletik-Proben, die mit dem Klettern oder Turnen zu tun haben. Zusätzlich erhält der Charakter einen Würfelpoolbonus von +2 auf alle Bewegungs-Proben in der Schwerelosigkeit.
quality.probosics=Rüssel
quality.probosics.page=133
quality.probosics.desc=Der Charakter hat eine Greifnase oder einen elefantenartigen Rüssel statt einer normalen Nase und Oberlippe. Der Rüssel bietet mehr Möglichkeiten als ein Greifschwanz (S. 132) und kann beispielsweise für kleinere taktile Manipulationen oder sogar für einen Hieb (unter Verwendung der Fertigkeit Exotische Waffen (Rüssel), Schaden 2B, Angriffswerte [Geschicklichkeit + Stärke]/–/–/–/–) verwendet werden. Beim Greifen mit dem Rüssel wird die Stärke des Charakters verwendet, aber Stärkeverbesserungen werden nur angewendet, wenn die entsprechenden Implantate auf den gesamten Körper wirken (wie z.B. bei Kunstmuskeln). Feinmotorische Manipulationen von Gegenständen verwenden das Attribut Geschicklichkeit.
quality.probosics.item.metagenetic_probosics=Rüssel
quality.satyr_legs=Satyrbeine
quality.satyr_legs.page=133
quality.satyr_legs.desc=Die Beine des Charakters sind behaart und enden in gespaltenen Hufen. Die Bewegungsrate des Charakters erhöht sich um +1/+2/+1. Satyrbeine gewähren außerdem einen Bonus von +2 auf den Angriffswert, wenn sie im Kampf zum Treten verwendet werden, und einen Würfelpoolbonus von +4 auf alle Athletik-Proben zum Springen.
quality.setae=Haftlamellen
quality.setae.page=132
quality.setae.desc=Ein Charakter mit diesem Vorteil hat haarähnliche Strukturen auf den Handflächen und Fußsohlen. Mit ihnen kann er sich wie eine Echse oder ein Insekt an senkrechten Oberflächen entlangbewegen. Der Charakter erhält einen Würfelpoolbonus von +2 auf Athletik-Proben zum Klettern, der sich auf +4 erhöht, wenn er barfuß ist. Er kann an einer Oberfläche senkrecht oder kopfüber hängen bleiben, wenn er sich mit wenigstens zwei Paar Gliedmaßen festhält.
quality.shiva_arms=Shiva-Arme
quality.shiva_arms.page=134
quality.shiva_arms.desc=Dieser Metamorphismus ist bei seltenen Transformierten und bei Nartaki (S. 82) anzutreffen. Jede Stufe verleiht dem Charakter ein Paar zusätzlicher Arme, das komplett mit den nötigen Knochen- und Muskelstrukturen in den Torso integriert ist. Jedes Paar Arme erhöht das Maximum für Konstitution und Stärke des Charakters um 1 und gewährt im Kampf eine zusätzliche Nebenhandlung. Ist der Charakter Rechtshänder, so ist er mit allen Armpaaren Rechtshänder. Dasselbe gilt analog für Linkshänder. Falls der Charakter auch den Vorteil Beidhändigkeit (SR6, S. 74) haben soll, werden dessen Karmakosten mit der Stufe der Shiva-Arme + 1 multipliziert. Die Kosten für alle angepassten Ausrüstungsteile (SR6, S. 247) erhöhen sich für einen Charakter mit diesem Vorteil um [Stufe x 10] Prozent. Außerdem kann er nicht angepasste Ausrüstung gar nicht verwenden, statt nur einen Würfelpoolmalus von -2 zu erhalten. Cyberglied maßen unterliegen ebenfalls dieser Kostensteigerung. Ein Charakter mit Shiva-Armen kann insgesamt so viele Cybergliedmaßen haben, wie sein neuer Körperbauplan Arme hat (ein Charakter mit 6 Armen könnte also insgesamt 6 Cybergliedmaßen haben). Die erhöhten Kosten betreffen nur die Cybergliedmaße selbst, nicht aber eventuelle Modifi-kationen.
quality.webbed_digits=Schwimmhäute
quality.webbed_digits.page=134
quality.webbed_digits.desc=Der Charakter hat Schwimmhäute zwischen den Fingern und Zehen wie ein Seehund, eine Ente oder ein Frosch. Dadurch erhält er einen Würfelpoolbonus von +2 auf alle Athletik-Proben zum Schwimmen, erleidet aber auch einen Würfelpoolmalus von -1 bei allen feinmotorischen Manipulationen mit den Händen.
quality.avian=Vogelschädel
quality.avian.page=137
quality.avian.desc=Schädel und Gesicht sind bei einem Charakter mit diesem Nachteil so geformt, dass sie denen eines Vogels ähneln. Dazu gehören eine stark betonte, schmale Kieferpartie (aber noch kein echter Schnabel), vergrößerte, zu den Seiten hin versetzte Augenhöhlen und ähnliche Merkmale.
quality.canine_feline=Hunde- oder Katzenschädel
quality.canine_feline.page=137
quality.canine_feline.desc=Diese Eigenschaft ist vergleichsweise häufig und kommt in verschiedenen hunde- und katzenartigen Varianten vor. Die Kinnlinie wird prägnanter und ähnelt einer Schnauze, die Zähne verändern sich (aber nicht so weit, dass sie über das metamenschliche Maß hinaus als Waffe verwendet werden können), und sogar die Ohren sind eher oben und hinten am Kopf positioniert.
quality.cephalopod=Kopffüsser
quality.cephalopod.page=137
quality.cephalopod.desc=Dieser Nachteil führt zu einer dramatischen Verän-derung der Erscheinung. Der Schädel wird krakenartig, und Muschelkalkschalen ersetzen die Knochen. Eine weiche, gallertige Epidermis überzieht den Kopf, und kleine Tentakel bedecken die Schultern und den oberen Brustkorb. Schädel und Oberkörper sind weicher, was zu einem Würfelpoolmalus von -2 bei Widerstandsproben gegen Schaden in dieser Körperregion führt.
quality.pachy=Dickhäuterschädel
quality.pachy.page=137
quality.pachy.desc=Charaktere mit diesem Nachteil haben vergrößerte Ohrmuscheln, oft mit einer leicht angepassten Position der Ohren. Außerdem zeigen sie Ansätze verkümmerter Hörner (Nashornschädel), eines Stummelrüssels (Elefantenschädel) oder verbreiterte Kiefer mit ausgeprägten Eckzähnen (Flusspferdschädel). Die Haut an Kopf und Oberkörper sieht oft ledrig aus.
quality.asymmetric_deformity=Asymmetrische Verformung
quality.asymmetric_deformity.page=138
quality.asymmetric_deformity.desc=Die Nachteile in dieser Kategorie umfassen nachteilige Veränderungen am Körper des Charakters. All diese Nachteile machen es leichter, den Charakter mit einer Matrixsuche zu identifizieren oder sich mit einer Probe auf Erinnerungsvermögen an ihn zu erinnern. Solche Proben erhalten einen Würfelpoolbonus von +2.
quality.asymmetric_deformity.choice.variant=Stufe
quality.asymmetric_deformity.choice.variant.picasso=Leicht, Picasso
quality.asymmetric_deformity.choice.variant.picasso.desc=Dem Körper des Charakters fehlt es an der Symmetrie anderer Wesen, auch wenn die Auswirkungen eher leicht sind. Üblicherweise ist die Gesichts- oder Kopfform betroffen – zum Beispiel durch ungleiche Ohren, versetzte Augenhöhlen oder eine hervortretende Nase. Das hat oft negative Auswirkungen auf die Empfindlichkeit des betroffenen Sinns und verursacht einen Würfelpoolmalus von -1 auf Proben, die mit diesem Sinn zu tun haben.
quality.asymmetric_deformity.choice.variant.quasimodo=Schwer, Quasimodo
quality.asymmetric_deformity.choice.variant.quasimodo.desc=Ein Charakter mit diesem Nachteil hat schwerwiegende Fehlbildungen oder eine Fehlstellung der Knochen oder wichtiger Muskelgruppen. Dies hat direkten Einfluss auf alle körperlichen Aktivitäten und verursacht einen Würfelpoolmalus von -2 auf entsprechende Proben.
quality.broad_feet=Breite Füsse
quality.broad_feet.page=138
quality.broad_feet.desc=Der Charakter hat breite, flache Füße ohne erkennbaren Spann oder abgesetzte Ferse. Das führt zu einer Einschränkung bei Athletik-Proben, die mit dem Springen, Klettern, Ausweichen, Turnen oder Sprinten zu tun haben. Entsprechende Edge-Handlungen und Edge-Boosts kosten 1 Edge mehr als üblich. Schuhwerk muss für den Charakter maßgefertigt werden, wodurch sich die Kosten dafür um 25 Prozent erhöhen.
quality.cyclopean_eye=Zyklopenauge
quality.cyclopean_eye.page=139
quality.cyclopean_eye.desc=Ein Charakter mit diesem Nachteil hat nur ein einzelnes Auge. Dies erschwert die Hand-Auge-Koordination, was bedeutet, dass der Charakter kein Edge bei Handlungen erhalten kann, in denen Athletik-Proben für Objekte, die durch die Luft fliegen, eine wesentliche Rolle spielen. Dazu gehören zum Beispiel Angriffsproben mit Wurfwaffen, das Ausweichen gegen Fernkampfangriffe oder der Versuch, etwas zu fangen. Wird das Zyklopenauge durch ein Cyberauge ersetzt, verschwindet dieser Nachteil (das funktioniert allerdings wegen der fehlenden neuralen Voraussetzungen nicht bei den namensgebenden Zyklopen).
quality.third_eye=Drittes Auge
quality.third_eye.page=138
quality.third_eye.desc=Der Charakter hat ein drittes Auge in der Mitte der Stirn. Dieses Auge entspricht in jeder Hinsicht den Augen, die ein Vertreter der Spezies des Charakters naturgemäß besitzt. Sogar wenn das Auge geschlossen ist, kann es ein Betrachter mit einer gelungenen Probe auf Wahrnehmung + Intuition (2) bemerken. Dieser Nachteil ist inkompatibel mit dem Nachteil Zyklopenauge (S. 139).
quality.reflective_eyes=Reflektierende Augen
quality.reflective_eyes.page=139
quality.reflective_eyes.desc=Die Augen des Charakters reflektieren Licht, das direkt auf die Augen strahlt, wie man es von Katzen, Ratten und einigen Reptilien kennt. Das macht es leichter, ihn in der Dunkelheit zu entdecken, sodass ein Beobachter einen Würfelpoolbonus von +1 bei entsprechenden Wahrnehmungs-Proben erhält.
quality.astral_beacon_metagenetic=Astrales Leuchtfeuer
quality.astral_beacon_metagenetic.page=139
quality.astral_beacon_metagenetic.desc=Siehe SR6, Seite 78.
quality.astral_hazing_non_awakened=Astrale Verunreinigung (Nicht erwacht)
quality.astral_hazing_non_awakened.page=139
quality.astral_hazing_non_awakened.desc=Ein Charakter mit diesem Nachteil hat Metagene ausgebildet, die seine negativen Emotionen katalysieren oder sich sogar von ihnen ernähren und dadurch das Mana in ihrer Umgebung stören. Der Charakter befindet sich immer in der Mitte einer schwachen Manablase (Arkane Kräfte, S. 185), die auf ihn ausgerichtet ist. Die Manablase hat einen Radius von [Essenz des Charakters + 1] Metern. Verbringt der Charakter mindestens 10 Stunden am Tag an einem Ort, dehnt sich die Blase pro Woche um 2 Meter aus, bis zu einer maximalen Vergrößerung von 10 Metern. Mundane Charaktere erhalten für diesen Nachteil einen Bonus von 8 Karma.
quality.astral_hazing_awakened=Astrale Verunreinigung (erwacht)
quality.astral_hazing_awakened.page=139
quality.astral_hazing_awakened.desc=Ein Charakter mit diesem Nachteil hat Metagene ausgebildet, die seine negativen Emotionen katalysieren oder sich sogar von ihnen ernähren und dadurch das Mana in ihrer Umgebung stören. Der Charakter befindet sich immer in der Mitte einer schwachen Manablase (Arkane Kräfte, S. 185), die auf ihn ausgerichtet ist. Die Manablase hat einen Radius von [Essenz des Charakters + 1] Metern. Verbringt der Charakter mindestens 10 Stunden am Tag an einem Ort, dehnt sich die Blase pro Woche um 2 Meter aus, bis zu einer maximalen Vergrößerung von 10 Metern. Erwachte Charaktere erhalten für diesen Nachteil einen Bonus von 15 Karma. Bei ihnen hat die Manablase einen Radius von [Magie] Metern.
quality.critter_spook=Tierschreck
quality.critter_spook.page=140
quality.critter_spook.desc=Irgendetwas an der Präsenz oder am Geruch des Charakters wirkt auf Tiere und paranormale Critter bedrohlich. Innerhalb von 5 Metern um den Charakter herum reagieren sie mit Furcht und Feindseligkeit. Alle Versuche, sie zu kontrollieren oder zu beruhigen, erhalten einen Würfelpolmalus von -2 auf entsprechende Proben. Falls es zum Kampf kommt, werden Critter sich alle Mühe geben, den Charakter zuerst anzugreifen.
quality.bioluminescence=Biolumineszenz
quality.bioluminescence.page=139
quality.bioluminescence.desc=Ein Charakter mit diesem Nachteil erzeugt an verschiedenen Teilen seines Körpers Licht. Häufig sind mehr als sechzig Prozent des Körpers und der Haare davon betroffen. Das Licht ist nicht intensiv genug, um bei normaler Beleuchtung gesehen zu werden, aber bei Teilbeleuchtung und in Dunkelheit ist es sichtbar. Die Stärke des Lichts hebt zwei Erfolge jeder physischen Illusion auf, die zum Ziel hat, den Charakter zu verbergen, einschließlich Verbesserter Unsichtbarkeit. Bei schlechten Lichtverhältnissen oder in absoluter Dunkelheit kann der Charakter von anderen unabhängig von ihren Sichtfähigkeiten ohne Malus angegriffen werden. Positiv an diesem Nachteil ist, dass das ausgestrahlte Licht es anderen Charakteren mit Restlichtverstärkung erlaubt, innerhalb eines Umkreises von 5 Metern um den Charakter herum normal zu sehen.
quality.mad_eyes=Augen des Wahnsinns
quality.mad_eyes.page=139
quality.mad_eyes.desc=Dieser Nachteil ist auch als Insektenaugen oder Oni-Augen bekannt. Er lässt die Augen des Charakters hervorquellen. Die Augenhöhlen sind weniger tief, und die Iris ist entweder blutrot, kürbisfarben, neongelb oder schwarz. Die Augen sind anfälliger für Reizungen. Alle Malus, die von Rauch, Asche oder anderen schwebenden Partikeln herrühren, werden um 1 erhöht.
quality.mood_hair=Stimmungshaar
quality.mood_hair.page=139
quality.mood_hair.desc=Stimmungshaar verändert seine Farbe in Abhängigkeit vom Gemütszustand des Charakters, was einem Beobachter einen Würfelpoolbonus von +2 auf Menschenkenntnis-Proben (SR6, S. 37) gegen den Charakter gewährt. Stimmungshaar ist weder mit anderen natürlichen oder künstlichen Haarmodifikationen noch mit den Nachteilen Federn und Schuppen kompatibel.
quality.striking_skin=Auffällige Hautpigmentierung
quality.striking_skin.page=139
quality.striking_skin.desc=Die Haut des Charakters weist eine ungewöhnliche Färbung auf, oft mit lebhaften Farben und Mustern. Dieser Nachteil lässt den Charakter herausstechen und gewährt anderen einen Würfelpoolbonus von +1 bei Matrixsuchen und Proben auf Erinnerungsvermögen, die sich auf ihn beziehen. Dieser Nachteil ist nicht mit anderen künstlichen oder natürlichen Hautmodifikationen kompatibel.
quality.symbiosis=Symbiose
quality.symbiosis.page=139
quality.symbiosis.desc=Dieser Nachteil ähnelt dem Vorteil Vertrautes Terrain (SR6, S. 76), aber mit einem unheilvolleren Potenzial. Zusätzlich zu den Boni durch Vertrautes Terrain wird die Verbindung zwischen dem Charakter und dem Ort immer stärker und schließlich zu etwas fast Mystischem. Die Gesundheit des Charakters ist direkt vom Wohlergehen des Ortes abhängig. So wie die soziale und umweltbasierte „Gesundheit“ des Ortes zu- oder abnimmt, so geht es auch dem Charakter im Laufe der Zeit besser oder schlechter. \nDie Biomechanik des Charakters spiegelt diese Natur wider. Wenn es dem Terrain besser geht, geht es auch dem Charakter besser. Er kann leichter mit Rückschlägen umgehen und sich seinen Sorgen und Ängsten besser stellen (Würfelpoolbonus von +1 auf Widerstandsproben gegen Manipulations- und Illusionszauber, die versuchen, diese Gefühle zu vermitteln) und heilt sogar schneller (Würfelpoolbonus von +1 auf alle Heilungs- und Genesungsproben, einschließlich magischer Heilung). Wenn das Terrain aber kränklich, heruntergekommen oder verdorben ist, fällt es dem Charakter schwerer, optimistisch zu sein. Er wird leichter zur Beute seiner inneren Dämonen und erholt sich schlechter von mentaler Erschöpfung und Stress (Würfelpoolmalus von -2 auf alle Heilungs- und Genesungsproben sowie auf Widerstandsproben gegen Manipulations- und Illusionszauber, die diese Gefühle ausnutzen). Außerdem fällt es dem Charakter dann immer schwerer, die Gegend zu verlassen. Eine gelungene Probe auf Selbstbeherrschung (3) ist erforderlich, um die Komfortzone der vertrauten Umgebung zu verlassen. Auch dem Gebiet für längere Zeit fernzubleiben, erfordert täglich eine Selbstbeherrschungs-Probe, wobei der Schwellenwert für jede Woche fern der Heimat um +1 steigt. Misslingt die Probe, wird der Charakter unruhig und unsicher, was sich in einem Würfelpoolmalus von -2 auf alle Proben äußert, bei denen Willenskraft Teil des Würfelpools ist. Soziale Veränderungen in der Nachbarschaft, wie plötzliche Gang-Aktivitäten oder ein Großbrand, erzeugen psychosomatische Symptome und Stimmungsschwankungen. Über das genaue Ausmaß entscheidet die Spielleitung.
quality.unusual_hair=Ungewöhnliches Haar
quality.unusual_hair.page=140
quality.unusual_hair.desc=Dieser Nachteil umfasst alle ungewöhnlichen Farben, Texturen oder Muster, die das Haar eines Charakters haben kann. Der Charakter kann sogar vollständig von einem weichen Flaum bedeckt sein, wie es bei den Nocturnen (S. 79) oder den Hanuman (S. 93) der Fall ist. Dieser Nachteil ist nicht mit anderen natürlichen oder künstlichen Haarmodifikationen kompatibel.
quality.impaired_metagenetic=Eingeschränktes Attribut
quality.impaired_metagenetic.page=141
quality.impaired_metagenetic.desc=Siehe SR6, Seite 79.
quality.neoteny=Neotenie
quality.neoteny.page=141
quality.neoteny.desc=Ein Charakter mit diesem Nachteil ist in seiner Entwicklung stehen geblieben und behält die körperlichen Merkmale eines Kindes oder Heranwachsenden. An diesen Zustand sind gleich mehrere Probleme gebunden: Der Körperliche Zustandsmonitor des Charakters hat nur [6 + (Konstitution / 2, abgerundet)] Kästchen. Die Maxima seiner Körperlichen Attribute sind um 1 niedriger als normal. Und wenn ein gewisses (augenscheinliches) Alter erforderlich ist, erhält der Charakter einen Würfelpoolmalus von -1 auf soziale Proben. Falls er keine SIN hat, kann er sein Alter auch nicht beweisen, falls dies erforderlich sein sollte. Die Preise aller getragenen Ausrüstungsgegenstände – einschließlich Panzerung – werden um 10 Prozent erhöht, weil sie maßgefertigt werden müssen.
quality.poor_healer=Schlechtes Heilfleisch
quality.poor_healer.page=141
quality.poor_healer.desc=Der Körper eines Charakters mit diesem Nachteil kann nicht mit der normalen Geschwindigkeit genesen oder sich erholen. Alle Zeitspannen zur Heilung, Genesung und Erholung, inklusive der Erholung von Erschöpfung, werden verdoppelt. Magische Heilung ist möglich, aber dafür gilt die Essenz des Charakters als um 2 niedriger, als sie eigentlich ist (bis zu einem Minimum von 0). Alle Heilzauber, die auf den Charakter gewirkt werden, haben einen um 1 höheren Entzug.
quality.progeria=Progerie
quality.progeria.page=141
quality.progeria.desc=Die Progerie ist ein extrem seltenes Phänomen, bei dem manche Aspekte des Alterns stark beschleunigt ablaufen, was die Lebensdauer verkürzt. Obwohl sich die Lebenszeit eines Betroffenen durch Fortschritte in der Gen- und der Biotechnologie erhöht hat, haben Charaktere mit diesem Nachteil immer noch weniger Jahre zu leben als andere. Die einzige bekannte Lösung, um das Fortschreiten der Alterung zu stoppen, ist eine Infektion mit MMVV. Die Progerie beeinflusst auch das Aussehen. Betroffene sehen wie „uralte Kinder“ aus, mit einem kleineren Körperwuchs, kindhaften Gesichtszügen und faltiger Haut. Wegen der Entwicklungsprobleme ihres Körpers erleiden Charaktere mit diesem Nachteil einen Würfelpoolmalus von -2 auf alle Proben, bei denen Konstitution, Geschicklichkeit, Reaktion oder Stärke Teil des Würfelpools sind. Außerdem sinkt ihre Initiative um 2.
quality.scent_gland=Duftdrüse
quality.scent_gland.page=141
quality.scent_gland.desc=Überaktive Duftdrüsen produzieren einen überwältigenden Geruch, der nur schwer aus Kleidung entfernt oder ohne magische Hilfe überdeckt werden kann. Der Geruch bleibt für 24 Stunden an einem Gegenstand haften, was einen Charakter mit diesem Nachteil leichter aufgrund seines Geruchs aufspürbar macht. Proben auf Natur (Spurenlesen) erhalten einen Würfelpoolbonus von +1 und 1 Edge innerhalb der ersten Stunde, seit der Charakter da war. Personen, die mit dem Charakter
sozial interagiert haben, erhalten einen Würfelpoolbonus von +2 auf alle Proben auf Erinnerungsvermögen und auf Einfluss (Unterrichten), um ihn zu beschreiben.
quality.stubby_arms=Stummelarme
quality.stubby_arms.page=141
quality.stubby_arms.desc=Wegen einer Fehlbildung des Skeletts hat ein Charakter mit diesem Nachteil kürzere Arme, als für seinen Metatyp typisch ist. Im Nahkampf führt diese verminderte Reichweite zu einem Malus von -1 auf alle Angriffswerte, auch beim Führen von Waffen. Der Nachteil verursacht außerdem einen Würfelpoolmalus von -1 auf alle Athletik-, Feuerwaffen-, Heimlichkeits- und Natur-Proben, wenn dabei die Arme zum Einsatz kommen.
quality.cold_blooded=Wechselwarm
quality.cold_blooded.page=141
quality.cold_blooded.desc=Der Charakter ist wechselwarm, wie es auch bei vielen Reptilien und Fischen der Fall ist. Das heißt, seine Körpertemperatur entspricht im Wesentlichen der Umgebungstemperatur, was jegliche Vorteile von Infrarotsicht, um ihn zu sehen, negiert. Bei Temperaturen unter 10 Grad Celsius wird der Charakter dafür träge. Regeltechnisch gilt diese Trägheit, als hätte der Charakter den Status Erschöpft I (SR6, S. 54). Bei Temperaturen unter 0 Grad Celsius wird er lethargisch, was als Status Erschöpft III gilt. Bei Temperaturen unter -20 Grad Celsius erhält der Charakter den Status Bewegungsunfähig (SR6, S. 53) und tritt in einen Zustand des Winterschlafs ein. Charaktere mit diesem Nachteil erhalten einen Würfelpoolmalus von -2 auf alle Widerstandsproben gegen kältebasierte Angriffe.
quality.feathers=Federn
quality.feathers.page=140
quality.feathers.desc=Alle Haare auf Kopf und Körper des Charakters werden durch Federn ersetzt, wie die eines Huhns oder eines anderen ähnlich großen Vogels. Diese Federn können fein und flaumig (und teilweise wasserabweisend, wie die einer Ente) oder flauschig und farbenfroh sein, aber sie bieten keinen wirklichen Wert oder Nutzen. Dieser Nachteil ist nicht mit den Nachteilen Ungewöhnliches Haar und Schuppen kompatibel.
quality.hairless=Haarlos
quality.hairless.page=140
quality.hairless.desc=Es ist eine Sache, eine Glatze zu haben, aber eine ganz andere, komplett haarlos zu sein. Ein Charakter mit diesem Nachteil hat am gesamten Körper keinerlei Haare oder Haarfollikel mehr (obwohl Hautporen vorhanden sind). Das Schwitzen ist schwieriger, und soziale Interaktionen mit Metamenschen können unangenehm sein. Bei der ersten Begegnung mit einem bislang unbekannten Metamenschen erleidet der Charakter einen Würfelpoolmalus von -1 auf alle sozialen Proben. Der Charakter ist auch leichter auf Infrarotbildern und Wärmesensoren zu sehen, was Betrachtern 1 Edge für Wahrnehmungs-Proben gewährt.
quality.insectoid_features=Insektoide Merkmale
quality.insectoid_features.page=140
quality.insectoid_features.desc=Ein Charakter mit diesem Nachteil weist insektoide Merkmale auf, wie etwa Facettenaugen, Chitinpanzer oder sogar verkümmerte Flügel. Diese Merkmale sind rein kosmetischer Natur und haben keinerlei Nutzen - außer für ein wirklich gutes Halloween-Kostüm. Das heißt, die Facettenaugen verändern die Sicht des Individuums nicht wesentlich, Chitinpanzer haben keine Auswirkungen auf den Verteidigungswert, und Flügel ermöglichen kein Fliegen, noch nicht mal ein Gleiten. Der Charakter ähnelt der Mischgestalt eines Insektengeistes, sodass er in den meisten sozialen Gruppen mit Misstrauen oder gar Feindseligkeit behandelt wird. Er kann in solchen sozialen Situationen weder Edge erhalten noch ausgeben. Einige Leute könnten sogar hasserfüllt und blind vor Wut reagieren und müssen eine Probe auf Selbstbeherrschung (4) ablegen, um den Charakter nicht verbal oder körperlich anzugreifen. Diese Modifikatoren gelten nicht, wenn der Charakter Insektengeistern begegnet oder versucht, einen Insektengeister-Bau oder ein Nest zu infiltrieren.
quality.scales=Schuppen
quality.scales.page=140
quality.scales.desc=Ein Charakter mit diesem Nachteil hat eine schuppige Haut wie die einer Eidechse, einer Schlange oder eines Fischs. Diese Schuppenhaut bedeckt mindestens 60 Prozent der Körperoberfläche, einschließlich der offensichtlichsten und am meisten verwendeten Körperteile (Hände, Gesicht usw.). Die übliche Hauterneuerung ist meist mit viel Jucken und Hautreizungen verbunden, was einem Beobachter schnell ins Auge fällt. Einmal pro Monat wirft der Charakter sein gesamtes Schuppenkleid ab. Während dieser Phase, die etwa 24 Stunden dauert, ist er sehr abgelenkt und erleidet bei allen Handlungen einen Würfelpoolmalus von -2. Die Schuppen können eine Vielzahl von Farben und Mustern annehmen, auch wenn die Muster keinen nützlichen Zweck erfüllen. Wegen des spektakulären Anblicks des Schuppenkleids des Charakters erhalten alle Proben auf visuelle Wahrnehmung gegen ihn einen Würfelpoolbonus von +2. Dieser Nachteil nicht mit anderen natürlichen oder künstlichen Hautveränderungen oder Vor- und Nachteilen kompatibel, die die Haut betreffen.
quality.vestigial_tail=Stummelschwanz
quality.vestigial_tail.page=141
quality.vestigial_tail.desc=Einem Charakter mit diesem Nachteil wächst ein normaler oder Stummelschwanz aus dem Steißbein. Der Schwanz kann geschuppt sein wie bei einer Echse, haarig wie bei einem Hund oder einer Katze oder haarlos wie bei einer Ratte. Der Schwanz kann Aufschluss über die Stimmung des Charakters geben, wenn dieser besonders starke Gefühle wie Freude, Traurigkeit oder Furcht empfindet. Um die unterbewussten Bewegungen des Schwanzes zu kontrollieren, muss dem Charakter eine Probe auf Willenskraft + Charisma (2) gelingen. Dieser Nachteil ist inkompatibel mit dem Vorteil Funktionaler Schwanz (S. 131) sowie jeglicher Bioware. Ein Cyberware-Ersatz kann die Einschränkungen des Nachteils überwinden, aber nur, wenn der Nachteil mit Karma entfernt wird.
quality.berserker=Berserker
quality.berserker.page=137
quality.berserker.desc=Der Charakter hat eine kurze Zündschnur. Es fehlt ihm an Selbstbeherrschung, und er läuft Gefahr, seiner Wut in einem geistlosen, nahezu instinktiven Anfall freien Lauf zu lassen. Wenn so ein Anfall erst einmal angefangen hat, hat der Charakter keinerlei Kontrolle mehr darüber. Er fällt dann genauso wahrscheinlich über seine Freunde oder unschuldige Unbeteiligte her wie über seine Gegner. Immer, wenn der Charakter 3 oder mehr Kästchen Körperlichen Schaden oder Betäubungsschaden erleidet, muss er eine Selbstbeherrschungs-Probe (SR6, S. 37) ablegen oder verfällt in blinde Wut. Während der Charakter in Rage ist, sind all seine Körperlichen Attribute um 1 erhöht (aber nicht über sein Metatypmaximum hinaus), alle Geistigen Attribute hingegen sind um 1 gesenkt (bis zu einem Minimum von 1). Dieser Wutanfall dauert [1W6 + aktueller Verletzungsmodifikator] Kampfrunden. Falls der Charakter eine Adrenalinpumpe (SR6, S. 292) hat, aktiviert diese sich automatisch.
quality.neuralgia=Neuralgie
quality.neuralgia.page=138
quality.neuralgia.desc=Ein Charakter mit diesem Nachteil leidet an wiederkehrenden Schmerzen. Diese können überall entlang der Nervenstränge auftreten, meist jedoch im Kopf oder im Gesicht. Wenn die Schmerzen auftreten, lenken sie den Charakter stark ab. Meist beginnen Schmerzattacken in Momenten der Ruhe und Entspannung. Aus diesem Grund erhalten alle Genesungsproben einen Würfelpoolmalus von -2.
quality.nocturnal=Nachtaktiv
quality.nocturnal.page=137
quality.nocturnal.desc=Ein veränderter Wach-Schlaf-Rhythmus macht den Charakter nachts aktiv und lässt ihn tagsüber schlafen. Wenn er gezwungen wird, außerhalb seiner bevorzugten Zeiten aktiv zu sein, erleidet er den Status Verwirrt 2 (SR6, S. 55). Bei Aktivitäten bei vollem Tageslicht werden alle Geistigen Attribute um 1 gesenkt (bis zu einem Minimum von 1).

quality.augmentation_acclimation=Bodytech-Gewöhnung
quality.augmentation_acclimation.page=144
quality.augmentation_acclimation.desc=Dein Körper hat sich besonders gut an deine Bodytech angepasst, sodass zukünftige Upgrades weniger Essenz kosten.<br/><br/>\
 <b>Voraussetzungen:</b> Deine Essenz darf maximal 3 betragen.<br/>\
 <b>Kosten:</b> 2 Karma pro Stufe (bis maximal Stufe 10)<br/>\
 <b>Auswirkung:</b> Pro Stufe dieses Vorteils werden 0,1 Essenzpunkte für weitere Bodytech frei. Dieser Vorteil erzeugt ein Essenzloch. Er erhöht also nicht deine tatsächliche Essenz. Stattdessen werden die Essenzkosten für neue Bodytech zuerst mit diesem Essenzloch verrechnet, statt deine tatsächliche Essenz weiter zu senken.
quality.bravado=Draufgänger
quality.bravado.page=144
quality.bravado.desc=Einmal pro Spielsitzung kannst du 1 Edge für eine beliebige, von dir durchgeführte Handlung erhalten, aber nur, wenn du dabei ordentlich angibst. Wenn du das tust, erhältst du außerdem +1 auf deinen persönlichen Fahndungsstufen-Modifikator (S. 205).
quality.critter_dominator=Critter-Herrschaft
quality.critter_dominator.page=144
quality.critter_dominator.desc=Du darfst eine Haupthandlung für den Versuch verwenden, einen nicht vernunftbegabten Critter deinem Willen zu unterwerfen. Dazu legst du eine Vergleichende Probe auf Einfluss (Einschüchtern) + Charisma gegen Willenskraft + Intuition des Critters ab. Gelingt die Probe, erlangst du die Kontrolle über den Critter, als ob du die Critterkraft Tierbeherrschung (SR6, S. 226) besitzt. Dieser Zustand hält [Nettoerfolge] Minuten lang an. Danach nimmt der Critter sein natürliches Verhalten wieder auf, und du erhältst 1 Edge bei allen Proben gegen diesen Critter. Du kannst immer nur einen Critter gleichzeitig zu kontrollieren versuchen.
quality.critter_trainer=Critter-Ausbilder
quality.critter_trainer.page=144
quality.critter_trainer.desc=Falls ein Critter noch nicht gezähmt ist, musst du ihn zuerst zähmen. Dieser Vorgang benötigt einen Zeitaufwand von einer Woche und eine erfolgreiche Ausbildungsprobe. Dazu legst du eine Vergleichende Probe auf Natur + Charisma gegen Willenskraft + Intuition des Critters ab. Sobald der Critter gezähmt wurde, kannst du mit seiner Ausbildung beginnen. Jeder Ausbildungsversuch benötigt ebenfalls eine Woche Zeit und eine weitere Ausbildungsprobe. Gelingt die Probe, kannst du dem Critter ein neues Kommando beibringen. Kommandos können Dinge wie "Hol's", "Fass!", „Bei Fuß“ oder ähnliche Kommandos sein, die ein nicht vernunftbegabter Critter zu verstehen in der Lage ist. Critter können maximal [Logik x 2] verschiedene Kommandos lernen. Definiere für jedes Kommando einen Auslöser und eine bestimmte Handlung. Der Auslöser kann ein Geräusch, eine Geste oder eine andere Bedingung sein, aber der Critter muss in der Lage sein, ihn zu bemerken. Wenn der Critter das Kommando erhält, führt er die beabsichtigte Handlung aus. Das Auslösen eines Kommandos bei einem Critter erfordert eine Nebenhandlung.
quality.cyberjack_maximization=Cyberbuchsenoptimierung
quality.cyberjack_maximization.page=144
quality.cyberjack_maximization.desc=Erhöhe die Stufe des niedrigeren Matrixattributs deiner Cyberbuchse (vor dem Austauschen von Matrixattributen, s. SR6, S. 182) um 1.
quality.cyborg=Cyborg
quality.cyborg.page=144
quality.cyborg.desc=Genau wie beim Vorteil Bodytech-Gewöhnung kannst du mit diesem Vorteil pro Stufe 0,1 Punkte Essenz in Form eines Essenzlochs frei werden lassen, um sie für den Einbau weiterer Bodytech zu nutzen.
quality.discreet_smuggler=Vorausschauender Schmuggler
quality.discreet_smuggler.page=146
quality.discreet_smuggler.desc=Wenn du eine Haupthandlung aufwendest, um einen Gegenstand zu verstecken, erhältst du 1 Edge, das direkt bei der Probe zum Verstecken verwendet werden muss und ansonsten verloren geht. Wenn der Gegenstand nicht größer ist als eine schwere Pistole, steigt sein Tarnbarkeits-Schwellenwert 1. Dies funktioniert gegen gewöhnliche und sensorbasierte Wahrnehmungsproben.
quality.extended_overdrive=Verlängertes Übersteuern
quality.extended_overdrive.page=146
quality.extended_overdrive.desc=Wenn du deine Bodytech übersteuerst (s. SR6, S. 284), hält der Effekt für 1 Kampfrunde pro Stufe in diesem Vorteil an (statt nur für eine einzelne Probe). Du musst während der Wirkungsdauer bei jeder Probe, in der das übersteuerte Attribut verwendet wird, einen der Probenwürfel durch den Schicksalswürfel ersetzen.
quality.focused_ambition=Brennender Ehrgeiz
quality.focused_ambition.page=144
quality.focused_ambition.desc=Wähle mit dem Einverständnis der Spielleitung ein bestimmtes Ziel. Wenn eine Probe direkt zum Erreichen deines Ziels beiträgt, kannst du für diese Probe jederzeit entscheiden, einen deiner Würfel aus dem Pool für die Probe durch zwei Schicksalswürfel zu ersetzen. Wenn du dein Ziel erreicht hast, darfst du ein neues Ziel wählen. Falls du ein Ziel aufgibst, darfst du für mindestens einen Monat kein neues Ziel definieren.
quality.inspire_competence=Inspirierende Persönlichkeit
quality.inspire_competence.page=144
quality.inspire_competence.desc=Du kannst mit einer Haupthandlung eine Probe auf Einfluss (Führen) + Charisma ablegen, um einen anderen Charakter bei einer Teamworkprobe für eine beliebige Fertigkeit zu unterstützen. Zusätzlich wählst du, ob du selbst oder der Charakter, den du unterstützt, 1 Edge bekommt.
quality.many_talents=Viele Begabungen
quality.many_talents.page=146
quality.many_talents.desc=Dieser Vorteil darf nur bei der Charaktererschaffung gewählt werden. Du darfst dann bis zu zwei Attribute auf die für deinen Metatyp maximale Stufe bringen.
quality.many_skills=Viele Fertigkeiten
quality.many_skills.page=146
quality.many_skills.desc=Dieser Vorteil darf nur bei der Charaktererschaffung gewählt werden. Du darfst dann bis zu zwei Fertigkeiten auf die maximale Stufe bringen. Falls du den Vorteil Talentiert (SR6, S. 76) hast, bedeutet das, dass du eine Fertigkeit auf Stufe 7 und eine weitere auf Stufe 6 haben darfst.
quality.martial_arts_prodigy=Kampfkunstwunderkind
quality.martial_arts_prodigy.page=145
quality.martial_arts_prodigy.desc=Du erlernst neue Kampfkunststile und -techniken (s. Feuer frei, S. 109ff.) für 2 Karma weniger als normal. Außerdem darfst du mehrere Kampfkunststile und -techniken gleichzeitig im selben Trainingszeitraum erlernen.
quality.maximum_overdrive=Maximales Übersteuern
quality.maximum_overdrive.page=145
quality.maximum_overdrive.desc=Wenn du deine Bodytech übersteuerst (s. SR6, S. 284), erhältst du 1 Edge. Falls du dabei deine Bodytech mit einem Patzer oder kritischen Patzer überlastest, senke den Zeitraum, in dem deine Bodytech ausfällt, um eine Runde (bis zu einem Minimum von 1 Runde).
quality.more_machine_than_metahuman=Mehr Maschine als Metamensch
quality.more_machine_than_metahuman.page=145
quality.more_machine_than_metahuman.desc= Wenn bei dir Erste Hilfe eingesetzt wird, wird Biotech (Cybertechnologie) statt Biotech (Erste Hilfe) verwendet. Der Schwellenwert für die Erste-Hilfe-Probe entspricht deiner abgerundeten Essenz. Dieser Vorteil sollte nur dann gewählt werden, wenn deine Gruppe nicht mit den optionalen Erste-Hilfe-Regeln für stark modifizierte Charaktere (S. 158) spielt.
quality.muscles=Muskeln
quality.muscles.page=145
quality.muscles.desc=Du darfst bei Proben auf soziale Fertigkeiten Charisma durch Stärke ersetzen, aber nur dann, wenn du auch in der Lage bist, deine eindrucksvolle Erscheinung zur Geltung zu bringen.
quality.polyglot=Mehrsprachig
quality.polyglot.page=145
quality.polyglot.desc=Du darfst die erste Stufe in neuen Sprachfertigkeiten für 2 Karma erwerben und danach weiter für 2 Karma pro Stufe steigern. Außerdem darfst du deine Sprachfertigkeiten bis auf Stufe 4 (Muttersprache) steigern.
quality.relentless_tracker=Gnadenloser Verfolger
quality.relentless_tracker.page=145
quality.relentless_tracker.desc=Du erhältst 1 Edge, wenn du die Spezialisierung Spurenlesen der Fertigkeit Natur einsetzt.
quality.rote_alchemist=Routinierter Alchemist
quality.rote_alchemist.page=145
quality.rote_alchemist.desc=Wenn du bei der Herstellung eines alchemistischen Erzeugnisses Erfolge kaufst, statt zu würfeln (s. SR6, S. 38), erhältst du für jeweils 3 Würfel im Würfelpool (abgerundet) einen Erfolg. Für den Würfelpool für die Entzugsprobe des Erzeugnisses muss die Spielleitung dann ebenfalls Erfolge kaufen, statt zu würfeln, allerdings wie gewohnt im Verhältnis von 4 Würfeln je Erfolg (mindestens aber 1 Erfolg). Wenn du bei deinem Entzugswiderstand ebenfalls Erfolge kaufst, erhältst du auch hier einen Erfolg für je 3 Würfel.
quality.software_optimization=Softwareoptimierung
quality.software_optimization.page=145
quality.software_optimization.desc=Du darfst auf jedem deiner Geräte ein Programm mehr als normal laufen lassen. Du erhältst 1 Edge, wenn du dieses Programm verwendest.
quality.soothing_static=Beruhigendes Rauschen
quality.soothing_static.page=144
quality.soothing_static.desc=Immer, wenn du von Rauschen beeinträchtigt wirst, sinken die Kosten aller Edge-Boosts und Edge-Handlungen um 1 (bis zu einem Minimum von 1). Dies gilt nur für Matrixhandlungen. Das Rauschen darf teilweise gesenkt werden, aber wenn es komplett unterdrückt wird, wirkt dieser Vorteil nicht mehr.
quality.spell_components=Zauberkomponenten
quality.spell_components.page=146
quality.spell_components.desc=Wenn du einen Zauber wirkst, darfst du eine Nebenhandlung darauf verwenden, Reagenzien für die Entzugswiderstandsprobe einzusetzen. Du erhältst pro Dram Reagenzien, das du einsetzt, einen zusätzlichen Würfel für den Entzugswiderstand. Du kannst maximal so viele Zusatzwürfel erhalten, wie dein Wert in der Fertigkeit Verzaubern beträgt. Danach sind die Reagenzien verbraucht und können nicht erneut verwendet werden.
quality.team_player=Teamplayer
quality.team_player.page=145
quality.team_player.desc= Du darfst Edge für andere Charaktere im Verhältnis eins zu eins ausgeben. Du darfst dein eigenes Edge mit ihrem Edge zusammen verwenden, um damit einen Edge-Boost oder eine Edge-Handlung zu bezahlen. Du darfst auch die gesamten Kosten für einen anderen Charakter aus deinem Edgepool bezahlen. Es darf allerdings auch hier nur ein Edge-Boost oder eine Edge-Handlung pro Probe verwendet werden, unabhängig davon, wer die Kosten bezahlt.
quality.teflon_coated=Teflonhaut
quality.teflon_coated.page=145
quality.teflon_coated.desc=Wenn die Spielleitung am Ende eines Runs für die Fahndungsstufe würfelt, darfst du die Spielleitung zwingen, noch einmal zu würfeln. Das neue Würfelergebnis beeinflusst nur deine persönliche Fahndungsstufe (S. 205). Falls mehrere Runner diesen Vorteil besitzen, gibt es nur einen neuen Würfelwurf, der dann für alle gilt.

quality.all_business=Rein Geschäftlich
quality.all_business.page=148
quality.all_business.desc=Keine deiner Connections darf eine Loyalität von mehr als 3 haben. Wenn du mit einem professionellen Kunden zu tun hast (wie zum Beispiel einem Mr Johnson), erhältst du 1 Edge für Proben auf Einfluss (Gebräuche).
Nähe zuzulassen.
quality.bad_back=Schlimmer Rücken
quality.bad_back.page=149
quality.bad_back.desc=Immer, wenn du einen Verletzungsmodifikator erleidest, erhältst du den Status Humpelnd (SR6, S. 54). Der Status endet, sobald der Verletzungsmodifikator abgebaut wurde.
quality.borrowed_time=Geborgte Zeit
quality.borrowed_time.page=147
quality.borrowed_time.desc=Du bist in einem Zustand, der unwiederbringlich zu deinem Tod führt. Das könnte eine Cortexbombe sein, heimtückische Naniten, eine seltene Krankheit oder sogar ein Preis, der auf dein Leben ausgesetzt ist. Am Anfang jeder Spielsitzung (nachdem dein Edge aufgefrischt wurde) legst du eine Probe auf Konstitution oder Willenskraft (den höheren der beiden Werte) + Edge gegen einen Schwellenwert von 1 ab. Erhöhe diesen Schwellenwert nach jeder Spielsitzung um 1. Du darfst Edge für diese Probe verwenden. Misslingt diese Probe jemals, wirst du in der entsprechenden Spielsitzung sterben. Die allererste für dich potenziell tödliche Situation … ist tödlich für dich! Murphys Gesetz in seiner schlimmsten Form. Wenn während der Spielsitzung kein potenziell tödliches Ereignis eintritt, wirst du am Ende der Spielsitzung unspektakulär zusammenbrechen und sterben. Du kannst dich entscheiden, 1 Punkt deines Edge-Attributs zu verheizen, um dem Tod noch einmal zu entgehen (der Schwellenwert für die Probe zu Beginn einer Spielsitzung wird dadurch nicht zurückgesetzt), aber wenn du diesen Nachteil nicht mit Karma entfernst, wird dein Überleben mit jeder Spielsitzung unwahrscheinlicher.
quality.bounty=Kopfgeld
quality.bounty.page=148
quality.bounty.desc=Wenn deine persönliche Fahndungsstufe 12 oder mehr beträgt, ziehen die Kopfgeldjäger ihre Schlinge enger um dich. Du bist gezwungen, ihnen zu entwischen, musst immer über deine Schulter blicken, darfst niemals in deiner Wachsamkeit nachlassen. Wenn deine persönliche Fahndungsstufe 12 oder mehr beträgt, beginnst du jede Spielsitzung ohne einen einzigen Punkt Edge in deinem Pool. Darüber hinaus sollte dieser Nachteil auch im Rollenspiel umgesetzt und von der Spielleitung in die Erzählung eingebaut werden.
quality.chronic_pain=Chronische Schmerzen
quality.chronic_pain.page=147
quality.chronic_pain.desc=Am Anfang jeder Spielsitzung (nachdem dein Edge aufgefrischt wurde) legst du eine Probe auf Konstitution + Willenskraft gegen einen Schwellenwert von 3 plus der Anzahl an Spielsitzungen ab, in denen du schmerzfrei warst. Misslingt die Probe, flammt dein Schmerz auf. Für die gesamte Spielsitzung erhältst du einen Würfelpoolmodifikator von -1 auf alle Proben außer Schadenswiderstandsproben. Medikamente, Zauber, Adeptenkräfte und andere Wirkungen (einschließlich eines Schmerzeditors), die den Verletzungsmodifikator senken, haben keine Auswirkungen auf deine chronischen Schmerzen.
quality.combat_junkie=Kampfsüchtig
quality.combat_junkie.page=148
quality.combat_junkie.desc=Wenn jemand versucht, dich zur Gewalt zu verleiten, erhält er 1 Edge für seine Einfluss- oder Überreden-Probe gegen dich. Du darfst während des Kampfes für Menschenkenntnis-Proben kein Edge erhalten oder ausgeben. Erst wenn du auf deinem Körperlichen und Betäubungs-Zustandsmonitor insgesamt mindestens 6 Kästchen Schaden erlitten hast, kannst du dich ohne Malus aus einem Kampf zurückziehen. Wenn du vorher vor einem Kampf davonläufst, darfst du erst dann wieder Edge erhalten oder ausgeben, wenn du an einem Kampf teilnimmst oder die nächste Spielsitzung beginnt.
quality.cyber_psychosis=Cyberpsychose
quality.cyber_psychosis.page=147
quality.cyber_psychosis.desc=Immer, wenn dein Edgepool auf null sinkt, verlierst du den Bezug zur Realität und deiner Umgebung. Entweder verlierst du den Bezug zu deinem Körper und wirst antriebslos, oder du wirst aus dem Nichts von einem heftigen Gefühlsausbruch erschüttert. Bis du wieder Edge erhältst, hast du pro Stufe in diesem Nachteil in jeder Kampfrunde eine Nebenhandlung weniger. Falls die Stufe dieses Nachteils höher ist als die Anzahl der dir zur Verfügung stehenden Nebenhandlungen, wird deine Haupthandlung in vier Nebenhandlungen aufgeteilt, von denen die restlichen Nebenhandlungen abgezogen werden. Dieser Nachteil sollte auch im Rollenspiel umgesetzt werden.
quality.finesse=Finesse
quality.finesse.page=147
quality.finesse.desc=Du kannst kein Edge für Handlungen erhalten oder ausgeben, die einen positiven Fahndungsstufen-Modifikator erzeugen. Falls du selbst in einer Spielsitzung keinen Fahndungsstufen-Modifikator erzeugst, wende einen Modifikator von -1 auf die Fahndungsstufe deines Teams an.
quality.gear_acquisition_syndrome=Ausrüstungsfanatiker
quality.gear_acquisition_syndrome.page=147
quality.gear_acquisition_syndrome.desc= Du bist gezwungen, für jede Stufe in diesem Nachteil 1.000 Nuyen pro Monat für Ausrüstung auszugeben. Wenn du diesem Verlangen nicht nachkommen kannst, wirst du unruhig oder traurig. Du erhältst erst dann wieder die zusätzlichen Würfel aus deinen Spezialisierungen und Expertisen, wenn du dein Einkaufsbedürfnis befriedigen kannst. Die Menge an Nuyen, die du pro Monat ausgeben musst, erhöht sich nicht, wenn du in Rückstand gerätst.
quality.glitchy=Ungeschickt
quality.glitchy.page=149
quality.glitchy.desc= Immer, wenn du bei einer Probe einen Patzer erzielst, zählt dies als kritischer Patzer, unabhängig davon, wie viele Erfolge du eigentlich erzielt hast.
quality.gourmand=Gourmet
quality.gourmand.page=148
quality.gourmand.desc=Immer, wenn du Lebensmittel isst, die nicht mindestens dem Standard eines Oberschicht-Lebensstils entsprechen, erhältst du für 1 Stunde den Status Übelkeit (SR6, S. 55). Fast Food, Essen aus dem Stuffer Shack, Fertigmahlzeiten und überhaupt alles, was weniger als 20 Nuyen pro Portion kostet, bereitet dir Unbehagen.
quality.hooder=Hooder
quality.hooder.page=148
quality.hooder.desc=Du musst pro Stufe in diesem Nachteil mindestens 1.000 Nuyen pro Monat spenden. Diese Spende darf nicht an Familienmitglieder oder Mitglieder deines Teams gehen, aber du darfst die Nuyen nutzen, um dir von deinen Connections Gefallen zu kaufen oder durch Dienst am Volk (siehe S. 167) Karma zu erhalten. Wenn du diesem Bedürfnis nicht nachkommen kannst, wirst du unruhig oder fühlst dich schuldig. Deine Gegner erhalten für jede Vergleichende Probe gegen dich 1 Edge. Die unbezahlten Nuyen betragen immer maximal 1.000 Nuyen pro Stufe des Nachteils. Mehrere unbezahlte Monate summieren sich nicht auf. Darüber hinaus sollte dieser Nachteil auch im Rollenspiel umgesetzt werden.
quality.hunted=Gejagt
quality.hunted.page=148
quality.hunted.desc=Wann immer deine Fahndungsstufe 12 oder mehr beträgt, holen dich die Attentäter ein. Du scheinst immer wieder knapp zu entkommen, aber du kommst nie mit heiler Haut davon. Am Anfang jeder Spielsitzung (nachdem dein Edge aufgefrischt wurde) legst du eine Probe auf Konstitution ab, um (Stufe dieses Nachteils + 7)K Schaden zu widerstehen. Du darfst diese Verletzung mit allen verfügbaren kurzfristigen Heilungsoptionen (Erste Hilfe, Medkit, Heilzauber usw.) behandeln (lassen), aber du kannst vor Beginn der Spielsitzung keinen Vorteil aus langfristigen Heilungen oder natürlicher Genesung erhalten. Darüber hinaus sollte dieser Nachteil auch im Rollenspiel umgesetzt werden und von der Spielleitung in die Erzählung eingebaut werden.
quality.indecisive=Unentschlossen
quality.indecisive.page=149
quality.indecisive.desc=Falls du nicht wenigstens 5 Punkte Edge verfügbar hast, darfst du keine Nebenhandlungen eintauschen, um eine zusätzliche Haupthandlung zu bekommen. Darüber hinaus sollte dieser Nachteil auch im Rollenspiel umgesetzt werden.
quality.injury_prone=Verletzungsanfällig
quality.injury_prone.page=149
quality.injury_prone.desc=Immer, wenn du – egal wodurch – Schaden erleidest, erhältst du 1 Kästchen Schaden dieses Typs (Körperlich oder Betäubung) zusätzlich.
quality.killer=Mordlust
quality.killer.page=148
quality.killer.desc=Wenn du einen Angriff oder Zauber einsetzt, der Betäubungsschaden verursacht, kannst du dafür kein Edge erhalten oder ausgeben.
quality.limited_attributes=Eingeschränkte Attribute
quality.limited_attributes.page=147
quality.limited_attributes.desc=Dieser Nachteil darf nur bei der Charaktererschaffung gewählt werden und kommt auch nur dort zum Tragen. Du darfst kein einziges Attribut auf das Maximum für deinen Metatyp bringen. Wenn du zur Charaktererschaffung das Lebenspfad-System (S. 31) verwendest, musst du das maximierte Attribut um 1 senken und diesen Punkt einem anderen Attribut zuweisen (ohne dieses Attribut dadurch auf sein Maximum zu bringen).
quality.limited_skills=Eingeschränkte Fertigkeiten
quality.limited_skills.page=147
quality.limited_skills.desc=Dieser Nachteil darf nur bei der Charaktererschaffung gewählt werden und kommt auch nur dort zum Tragen. Du darfst keine einzige Fertigkeit auf die maximale Stufe bei Spielbeginn bringen. Wenn du zur Charaktererschaffung das Lebenspfad-System (S. 31) verwendest, musst du die maximierte Fertigkeit um 1 senken und diesen Punkt einer anderen Fertigkeit zuweisen (ohne diese Fertigkeit dadurch auf das Maximum zu bringen).
quality.momentous_misfortune=Anhaltende Pechsträhne
quality.momentous_misfortune.page=147
quality.momentous_misfortune.desc=Du kannst pro Kampfrunde maximal 1 Edge erhalten.
quality.non_lethal=Sanftmütig
quality.non_lethal.page=149
quality.non_lethal.desc=Wenn du einen Angriff oder Zauber einsetzt, der Körperlichen Schaden verursacht, kannst du dafür kein Edge erhalten oder ausgeben.
quality.stim_patch_allergy=Stimpatch-Allergie
quality.stim_patch_allergy.page=149
quality.stim_patch_allergy.desc=Wenn du unter der Wirkung eines Stimpatches stehst, erhältst du den Status Benommen (SR6, S. 53), bis die Wirkung nachlässt.
quality.toxin_susceptibility=Anfälligkeit für (Toxin)
quality.toxin_susceptibility.page=147
quality.toxin_susceptibility.desc= Wähle ein Toxin, wie zum Beispiel Brechreiz-Gas, CS-/Tränengas, Gamma-Skopolamin, Narcoject, Neuro-Stun (alle Arten), Pepper Punch oder Seven-7. Wenn du unter der Wirkung des Toxins leidest, für das du anfällig bist, erhöhe die Kraft des Toxins um 2. Außerdem kannst du bei Toxinwiderstandsproben gegen dieses Toxin kein Edge erhalten oder ausgeben
quality.trust_issues=Vertrauensprobleme
quality.trust_issues.page=149
quality.trust_issues.desc=Du darfst bei Proben auf Einfluss (Gebräuche oder Einschüchtern) und Menschenkenntnis kein Edge erhalten oder ausgeben. Keine deiner Connections darf eine Loyalität von mehr als 3 haben. Wenn du einer magischen Gruppe beitrittst, darf deren Loyalität maximal 3 betragen (s. Arkane Kräfte, S. 144).
quality.twitchy=Unruhig
quality.twitchy.page=149
quality.twitchy.desc=Für jeden Initiativewürfel, den du würfeln darfst, erleidest du bei Proben auf Selbstbeherrschung einen Würfelpoolmalus von -1.

#Quality Paths

qpath.critter_bond=Critterbindung
qpath.critter_bond.page=149
qpath.critter_bond.desc=Dieser Pfad behandelt den Aufbau einer Beziehung zu einem Critter und schaut sich an, wie diese Beziehung einen Shadowrunner und sein Gefühlsleben beeinflusst.<br/>Der Pfad beginnt, wenn du eine enge Bindung zu einem einzelnen Critter aufbaust. Vielleicht ist es ein streunender Hund, den du zu füttern angefangen hast und der dann einfach nicht mehr wegging. Vielleicht ist es dein treues Pferd. Oder es ist eine Teufelsratte, die im selben Abschnitt der Kanalisation abhing, und schließlich habt ihr euch gegenseitig irgendwie akzeptiert und euch daran gewöhnt, in der Nähe des jeweils anderen zu sein. Was auch immer der Fall ist, es gibt diesen Critter, den du als deinen Critter betrachtest. Und du hast die Verantwortung für diesen Critter übernommen.
qpath.critter_bond.step.critter_initial_bond=Ein erstes Band
qpath.critter_bond.step.critter_initial_bond.page=149
qpath.critter_bond.step.critter_initial_bond.desc=Der Pfad beginnt, wenn du eine enge Bindung zu einem einzelnen Critter aufbaust. Vielleicht ist es ein streunender Hund, den du zu füttern angefangen hast und der dann einfach nicht mehr wegging. Vielleicht ist es dein treues Pferd. Oder es ist eine Teufelsratte, die im selben Abschnitt der Kanalisation abhing, und schließlich habt ihr euch gegenseitig irgendwie akzeptiert und euch daran gewöhnt, in der Nähe des jeweils anderen zu sein. Was auch immer der Fall ist, es gibt diesen Critter, den du als deinen Critter betrachtest. Und du hast die Verantwortung für diesen Critter übernommen.<br/>Auswirkung: Du musst den Vorteil Critter-Ausbilder (S. 144) haben, um diesen emotionalen Pfad zu beginnen. Sobald du einem deiner Critter seine maximale Anzahl an Kommandos beigebracht hast, darfst du entscheiden, eine Bindung mit ihm einzugehen. Verbring eine Woche damit, eine Bindung mit dem Critter einzugehen, und lege dann eine Ausbildungsprobe ab. Sobald die Bindung aufgebaut wurde, wird die maximale Anzahl an Kommandos, die der Critter erlernen kann, um deinen Wert in Einfluss erhöht. Immer, wenn du eine Nebenhandlung aufwendest, um deinem gebundenen Critter ein Kommando zu geben, darfst du zwei Kommandos gleichzeitig erteilen. Immer, wenn dein Critter auf dein Kommando hin eine Handlung durchführt, erhältst du 1 Edge, das direkt für die Probe des Critters verwendet werden muss, sonst geht es verloren. Du darfst auch dein eigenes Edge für die Proben des Critters ausgeben, aber nur, wenn er auf deinen Befehl hin handelt. Als Bestandteil dieses Vorteils erhältst du den Nachteil Verpflichtungen ( SR6, S. 81) auf Stufe 1 für einen mundanen Pflanzenfresser oder Allesfresser, auf Stufe 2 für einen mundanen Fleischfresser und auf Stufe 3 für einen Erwachten oder Emergenten Critter.
qpath.critter_bond.step.critter_greater_bond=Die Grosse Bindung
qpath.critter_bond.step.critter_greater_bond.page=150
qpath.critter_bond.step.critter_greater_bond.desc=Bindungen neigen dazu, sich im Laufe der Zeit zu vertiefen. Die Große Bindung zeigt eine engere Beziehung zwischen dem Runner und seinem tierischen Freund an.<br/>Auswirkung: Sobald dein gebundener Critter seine maximale Anzahl an Kommandos (inklusive der zusätzlichen Kommandos durch deinen Wert in Einfluss) erlernt hat, vertieft sich eure Bindung. Du darfst die Karmakosten bezahlen, um die Bindung zu vertiefen. Sobald die Große Bindung erfolgt ist, bist du nicht mehr auf vordefinierte Kommandos angewiesen. Du darfst eine Nebenhandlung ausgeben, um deinem Critter eine beliebige Anweisung deiner Wahl zu geben, und er wird sie verstehen und befolgen, so gut er kann. Jede Edge-Handlung und jeder Edge-Boost, die oder den du zugunsten deines gebundenen Critters benutzt, kostet 50 Prozent weniger Edge (abgerundet).
qpath.critter_bond.step.critter_improvement=Dauerhafte Verbesserung
qpath.critter_bond.step.critter_improvement.page=150
qpath.critter_bond.step.critter_improvement.desc=Die Ausbildung eines Critters kann die Möglichkeiten des Critters verbessern und baut seine Fertigkeiten und Fähigkeiten auf.<br/>Auswirkung: Um diesen Vorteil zu erhalten, musst du einen Monat mit der Ausbildung deines Critters verbringen und sie mit einer Ausbildungsprobe abschließen. Gelingt die Probe, darfst du dein eigenes Karma verwenden, um eines der Attribute oder eine der Fertigkeiten deines Critters zu verbessern oder einen Vorteil für ihn zu erwerben. Jede Fertigkeit und jeder Vorteil muss zum Wesen des Critters passen. Es ist schlichtweg unmöglich, Barghests beizubringen, Saxofon zu spielen.
qpath.critter_bond.step.critter_lost=Verloren
qpath.critter_bond.step.critter_lost.page=150
qpath.critter_bond.step.critter_lost.desc=Dein Critter ist verschwunden! An irgendeinem Punkt wird der Charakter von seinem Critter getrennt. Der Critter könnte davonlaufen oder entführt werden oder sonst wie vom Spielercharakter getrennt werden. Die gute Nachricht ist natürlich, dass die Chance besteht, dass der Critter noch lebt und du vielleicht in der Lage bist, ihn wiederzufinden.<br/>Auswirkung: Dieser Nachteil tritt in Kraft, wenn seit dem Verschwinden deines Critters 24 Stunden vergangen sind und du keine Ahnung hast, wo er sich im Moment befindet. Diese Trennung hinterlässt Spuren - du bist in einem schlechten Zustand und wirst alles tun, was du kannst, um deinen besten Freund wiederzufinden. Während der Zeit der Trennung erhältst du 1 Edge für jede Handlung, die direkt zum Aufspüren oder Wiederfinden deines gebundenen Critters beiträgt. Im Gegenzug kostet jede Edge-Handlung und jeder Edge-Boost 1 Edge zusätzlich, die oder der nicht zu deinen Bemühungen beiträgt, deinen Critter zurückzubekommen. Der Nachteil wird entfernt, wenn der Critter wieder mit dem Charakter vereint ist.
qpath.critter_bond.step.critter_broken=Gebrochenes Vertrauen
qpath.critter_bond.step.critter_broken.page=150
qpath.critter_bond.step.critter_broken.desc=Manchmal geht eine Beziehung schief, vor allem wenn eine Seite die andere zu sehr unter Druck setzt und wichtige Grenzen missachtet. Dieser Nachteil tritt in Kraft, falls der Spielercharakter seinen Critter auf grausame Weise misshandelt. Die Spielleitung entscheidet, wo die Grenze verläuft.<br/>Auswirkung: Wenn sich die Beziehung zu einem Critter zu diesem Nachteil verändert hat, wird dein Critter nicht mehr auf deine Kommandos hören. Je nach Entscheidung der Spielleitung könnte er dich sogar angreifen oder davonrennen. Es ist möglich, dass dieses gebrochene Vertrauen zu einer dauerhaften Störung der Beziehung führt. Falls du für länger als einen Monat von deinem Critter getrennt bleibst, bewege dich auf dem emotionalen Pfad weiter zum Aspekt Abschied. Falls du die Bindung wiederaufbauen möchtest, musst du mindestens eine Woche mit der Ausbildung deines Critters verbringen und eine erfolgreiche Ausbildungsprobe ablegen. Du darfst bei dieser Ausbildungsprobe kein Edge erhalten oder ausgeben - und du hast nur eine einzige Chance! Gelingt die Probe, wird die Bindung wiederhergestellt, und dieser Nachteil wird entfernt. Solltest du diesen Nachteil jedoch erneut auslösen, kannst du nicht wieder versuchen, die Bindung erneut herzustellen. Die Bindung ist dann für immer verloren. Du erhältst den Vorteil Critter-Herrschaft (S. 144) ohne Karmakosten, aber alle Vorteile, die du durch diesen emotionalen Pfad erlangt hast, sind verloren. Falls du dich entscheidest, mit einem anderen Critter den Pfad der Critterbindung zu beschreiten, werden alle Karmakosten dafür verdoppelt.
qpath.critter_bond.step.critter_goodbye=Abschied
qpath.critter_bond.step.critter_goodbye.page=151
qpath.critter_bond.step.critter_goodbye.desc=An einem bestimmten Punkt endet die Bindung zwischen einem Charakter und seinem Critter. Ob es der Tod, die Entfernung oder ein anderer Einfluss ist, der zu einer Trennung führt, die Verbindung zwischen den beiden ist dauerhaft getrennt.<br/>Auswirkung: Falls dein gebundener Critter für mindestens einen Monat verloren ging, kannst du alle Hoffnung fahren lassen und dich neu orientieren. Falls dein gebundener Critter gestorben ist, muss mindestens ein Monat vergangen sein, bevor du versuchen kannst, eine neue Bindung zu einem anderen Critter aufzubauen. Während dieses Monats kannst du für Proben auf Selbstbeherrschung kein Edge erhalten oder ausgeben. Die Karmakosten für das erste Band und die Große Bindung deines neuen Critters werden um 50 Prozent gesenkt (abgerundet). Alle Vor- und Nachteile, die du bei deinem emotionalen Pfad erhalten hast, werden entfernt, und zwar ohne Karmakosten oder Karmaboni.
step.critter_initial_bond.choice.crittertype=Critter Art
step.critter_initial_bond.choice.crittertype.mundane_herbivore=Mundaner Pflanzenfresser
step.critter_initial_bond.choice.crittertype.mundane_herbivore.desc=Nachteil Verpflichtungen (SR6, S. 81) auf Stufe 1 für einen mundanen Pflanzenfresser oder Allesfresser.
step.critter_initial_bond.choice.crittertype.mundane_carnivore=Mundaner Fleischfresser
step.critter_initial_bond.choice.crittertype.mundane_carnivore.desc=Nachteil Verpflichtungen (SR6, S. 81) auf Stufe 2 für einen mundanen Fleischfresser.
step.critter_initial_bond.choice.crittertype.awakened_emerged=Erwacht oder Emergent
step.critter_initial_bond.choice.crittertype.awakened_emerged.desc=Nachteil Verpflichtungen (SR6, S. 81) auf Stufe 3 für einen Erwachten oder Emergenten Critter.
