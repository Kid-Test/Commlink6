# Other Packs
# packs-other.xml
item.pack_id_cheap=Gefälschte ID-Billig
item.pack_id_cheap.page=62
item.pack_id_cheap.desc=Ohne eine SIN unterwegs zu sein kann an einigen Orten zu Schwierigkeiten führen. Jeder Runner braucht mindestens eine ordentliche gefälschte ID, und die meisten Runner besitzen mehrere. Ja, sie sind teuer und können leicht verbrannt werden, aber der Vorteil, sich in die Massen der SIN-Menschen einzufügen, ist das Risiko und die Ausgaben fast immer wert.

