item.pack_magical_targeting=Sensor-Magische Zielerfassung
item.pack_magical_targeting.page=61
item.pack_magical_targeting.desc=Wenn deine Sinne nicht gerade auf natürliche, magische oder kybernetische Weise verbessert sind, ist es eine gute Idee, sich etwas zu holen, das dich im Dunkeln und um Ecken sehen lässt, mit dem du smartgunfähige Waffen verwenden kannst, oder mit dem du mit unglaublicher Empfindlichkeit sehen und hören oder Dinge entdecken kannst, für die du ansonsten nicht die Sinne hättest.

