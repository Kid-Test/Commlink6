#Contacts

contacttype.academic=Akademisch
contacttype.academic.page=174
contacttype.academic.desc=Hierzu gehören alle Arten von Ausbildern, Forschern und Intellektuellen ebenso wie Fachleute wie etwa Rechtsanwälte und Buchhalter. Üblicherweise ruft man diese Connections an, um zu sehen, was sie wissen, und nicht unbedingt, was sie für einen tun können – es sei denn, man braucht einen Rechtsanwalt.
contacttype.corporate=Konzern
contacttype.corporate.page=174
contacttype.corporate.desc=Das können Angestellte eines der Großen Zehn sein, oder sie könnten für ein kleineres, örtliches Unternehmen arbeiten. Auf jeden Fall haben sie Insiderwissen über die Konzernwelt. Zusätzlich zu Informationen könnte dieser Connectiontyp Zugriff auf eine Quelle für Produkte des grauen Marktes haben oder in der Lage sein, gewisse Konzerndienstleistungen zur Verfügung zu stellen.
contacttype.criminal=Organisiertes Verbrechen
contacttype.criminal.page=175
contacttype.criminal.desc=Diese Connection könnte ein Mitglied der Mafia, der Triaden, der Yakuza, der Vory oder sogar einer der größeren, landesweit operierenden Gangs sein. Ihre Verbindungen zum organisierten Verbrechen sind es, was diese Connection von gewöhnlichen Straßenkriminellen unterscheidet. Eine solche Connection kann eine gute Quelle für Schwarzmarktwaren und Informationen über Konkurrenten ihres Syndikats sein.
contacttype.engineering=Technik
contacttype.engineering.page=175
contacttype.engineering.desc=Dieser Typ deckt alle Connections ab, die mit Fahrzeugen, Drohnen oder anderen mechanischen Geräten arbeiten oder sie steuern. Fahrzeugausschlachter, Taxifahrer, Drohnenhändler, T-Bird-Piloten und Schrottplatzbetreiber gehören in diese Kategorie, genauso wie Schlosser, Bauarbeiter und sogar Sprengstoffexperten.<br/>Sie sind es, die du anrufen kannst, wenn du eine Transportmöglichkeit brauchst, eine neue Maschine kaufen oder gebaut haben möchtest, Fahrzeugmodifikationen oder Reparaturen erledigt haben möchtest oder sogar, wenn du etwas gesprengt haben möchtest.
contacttype.government=Regierung
contacttype.government.page=175
contacttype.government.desc=Obwohl die Polizei und die städtischen Dienstleistungen heutzutage alle in Unternehmenshand sind, zählen sie immer noch als „für die Regierung arbeitende Personen“, ebenso wie das Militär und tatsächliche öffentliche Bedienstete. Connections in der Regierung sind in der perfekten Position, um etwas Fahndungsdruck von den Runnern zu nehmen oder um Informationen über Einträge in ihrer Strafakte – oder anderer Leute Strafakten – weiterzugeben.
contacttype.magic=Magie
contacttype.magic.page=174
contacttype.magic.desc=Arkanspezialisten, Taliskrämer, Verzauberer und alle anderen, die magische Dienstleistungen anbieten, fallen unter diesen Typ. Diese Connections können Reagenzien, alchemistische Erzeugnisse, Foki und Zauberformeln beschaffen. Zu diesem Connectiontyp gehören auch alle Connections, die durch Magie überhaupt erst möglich sind: freie Geister, Gestaltwandler, Ghule und andere Infizierte.
contacttype.matrix=Matrix
contacttype.matrix.page=174
contacttype.matrix.desc=Deckmeister, Techniker, Programmierer, Systemadmins der verschiedenen Schattenforen und der Barkeeper in deinem Lieblings-Matrix-Nachtclub fallen unter diesen Connectiontyp. Sie können die neuesten Matrixgerüchte weitergeben und eine Quelle für die heißeste Technik sein.
contacttype.media=Medien
contacttype.media.page=175
contacttype.media.desc=icht nur Reporter, Redakteure und Piratensender, sondern jeder, der seinen Lebensunterhalt im Scheinwerferlicht verdient – wie zum Beispiel Sportler, Rocker und Sim-Stars – gehört in diese Kategorie. Typischerweise ruft man sie wegen ihrer Informationen oder wegen dem an, was sie herausfinden können.
contacttype.medical=Medizinisch
contacttype.medical.page=175
contacttype.medical.desc=Sanitäter, Straßendocs, Apothekenangestellte und Cyberchirurgen sind die Leute, die man anruft, wenn man medizinische Dienstleistungen braucht oder nach neuer Bodytech sucht.
contacttype.street=Straße
contacttype.street.page=175
contacttype.street.desc=Alle Arten von SINlosen, die am Rande der Gesellschaft leben, fallen in diese Kategorie: Schmuggler, Ganger, Kojoten, Drogendealer, Betrüger, Kleinkriminelle, Squatter, Prostituierte und andere gescheiterte Existenzen, einschließlich der meisten Shadowrunner.

#Metagenetic Collectives

set.general=Kein Kollektiv
set.general.page=128
set.general.desc=Nicht alle Transformierten lassen sich gut in eines der anerkannten Kollektive einsortieren. Viele Expressionen scheinen vollkommen zufällig zu sein. Würfle in solchen Fällen mit einem W6, um zu bestimmen, ob die metagenetische Eigenschaft ein Vorteil (ungerade) oder ein Nachteil (gerade) ist. Dann würfle erneut mit einem W6, um die Kategorie zu bestimmen, aus der das metagenetische Merkmal stammt.
set.monolith=Monolith
set.monolith.page=128
set.monolith.desc=Monolithen, die oft in den europäischen Alpen und den südamerikanischen Anden anzutreffen sind, scheinen aus Stein geformt und gemeißelt zu sein. Sie können bis zu einem halben Meter größer sein als der zugrunde liegende Metatyp.
set.raptor=Raptor
set.raptor.page=128
set.raptor.desc=Die Raptoren haben die Welt verblüfft, weil sie Merkmale von Kondoren und Harpyien kombinieren. Statt Armen sind ihre oberen Gliedmaßen zu Flügeln mutiert, ähnlich wie bei Fledermäusen oder Gefiederten Schlangen, mit verkümmerten Daumen an den Handgelenken.
set.humboldt=Humboldt
set.humboldt.page=128
set.humboldt.desc=Diese Transformierten exprimieren in allen großen Gewässern der Welt, hauptsächlich in Gebieten mit geringer Verschmutzung. Die Humboldts treten in tropischem oder tiefem Salzwasser auf.
set.merfolk=Nixe/Necker
set.merfolk.page=128
set.merfolk.desc=Diese Transformierten exprimieren in allen großen Gewässern der Welt, hauptsächlich in Gebieten mit geringer Verschmutzung. Nixen und Necker trete in den Großen Seen Nordamerikas und der Region um den Baikalsee in Russland bzw. Jakutien auf.
set.anubis=Anubis
set.anubis.page=128
set.anubis.desc=Diese Transformierten erscheinen im gesamten Einzugsgebiet des Nils, einschließlich des Blauen und des Weißen Nils.
set.bastet=Bastet
set.bastet.page=128
set.bastet.desc=Diese Transformierten erscheinen im gesamten Einzugsgebiet des Nils, einschließlich des Blauen und des Weißen Nils.
set.sobek=Sobek
set.sobek.page=128
set.sobek.desc=Diese Transformierten erscheinen im gesamten Einzugsgebiet des Nils, einschließlich des Blauen und des Weißen Nils.
set.ganesh=Ganesh
set.ganesh.page=128
set.ganesh.desc=Diese Transformierten kommen üblicherweise im Süden des indischen Subkontinents vor, aber auch in den benachbarten Nationen bis hin zum Südchinesischen Meer wurden Sichtungen gemeldet. Diese Kollektive tragen die Namen von Göttern der Hindu.
set.kali_ani=Kali-Ani
set.kali_ani.page=128
set.kali_ani.desc=Diese Transformierten kommen üblicherweise im Süden des indischen Subkontinents vor, aber auch in den benachbarten Nationen bis hin zum Südchinesischen Meer wurden Sichtungen gemeldet. Diese Kollektive tragen die Namen von Göttern der Hindu.
set.rakshasa=Rakshasa
set.rakshasa.page=128
set.rakshasa.desc=Diese Transformierten kommen üblicherweise im Süden des indischen Subkontinents vor, aber auch in den benachbarten Nationen bis hin zum Südchinesischen Meer wurden Sichtungen gemeldet. Diese Kollektive tragen die Namen von Göttern der Hindu.
