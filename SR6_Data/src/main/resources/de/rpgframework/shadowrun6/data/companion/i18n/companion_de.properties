step.favored_weapon_customization.choice.favored_weapon_custom.fav_weapon_offensive.desc=Immer, wenn du mit dieser Waffe angreifst, erhältst du eine zusätzliche Nebenhandlung.
step.favored_weapon_customization.choice.favored_weapon_custom.fav_weapon_wicked=Bedrohliche Erscheinung
