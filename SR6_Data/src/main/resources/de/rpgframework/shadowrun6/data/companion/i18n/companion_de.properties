item.pack_rifle_ak97=Gewehr-AK-97
item.pack_rifle_ak97.page=60
item.pack_rifle_ak97.desc=Das sind die Arbeitspferde der kampflastigen Pakete. Das AK-97 und das FN HAR sind wegen ihrer Feuerkraft ideal, während das Ares Alpha und das Yamaha Raiden serienmäßig mit Granatwerfern und anderen Annehmlichkeiten ausgestattet sind.

