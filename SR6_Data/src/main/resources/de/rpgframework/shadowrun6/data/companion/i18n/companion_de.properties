quality.favored_weapon_custom.choice.variant.fav_weapon_kill=Siegesserie
quality.favored_weapon_custom.choice.variant.fav_weapon_kill.desc=Du erhältst 1 Edge, wenn du einen Gegner mit dieser Waffe besiegst.
quality.favored_weapon_custom.choice.variant.fav_weapon_sighted=Justiertes Visier
quality.favored_weapon_custom.choice.variant.fav_weapon_sighted.desc=Wähle eine Reichweitenkategorie und erhöhe den Angriffswert der Waffe in dieser Kategorie um 2.
quality.favored_weapon_custom.choice.variant.fav_weapon_deadly=Tödlich
quality.favored_weapon_custom.choice.variant.fav_weapon_deadly.desc=Der Schadenswert der Waffe wird um 1 erhöht.
quality.favored_weapon_custom.choice.variant.fav_weapon_extra_mod=Zusätzliche Modifikationen (Nahkampf)
quality.favored_weapon_custom.choice.variant.fav_weapon_extra_mod.desc=Die Waffe kann bis zu 3 Modifikationen aufnehmen.
quality.favored_weapon_custom.choice.variant.fav_weapon_extra_acc=Zusätzliches Zubehör (Fernkampf)
quality.favored_weapon_custom.choice.variant.fav_weapon_extra_acc.desc=Wähle eine Halterung für Waffenzubehör (auf dem Lauf, am Lauf, unter dem Lauf). An dieser Stelle darfst du zwei Zubehöroptionen anbauen.
quality.favored_weapon_custom.choice.variant.fav_weapon_defensive=Defensiv ausgewuchtet (Nahkampf)
quality.favored_weapon_custom.choice.variant.fav_weapon_defensive.desc=Du erhältst 1 Edge für jede Blocken-Handlung, die du mit der Waffe durchführst.
quality.favored_weapon_custom.choice.variant.fav_weapon_offensive=Offensiv ausgewuchtet (Nahkampf)
quality.favored_weapon_custom.choice.variant.fav_weapon_offensive.desc=Immer, wenn du mit dieser Waffe angreifst, erhältst du eine zusätzliche Nebenhandlung.
quality.favored_weapon_custom.choice.variant.fav_weapon_wicked=Bedrohliche Erscheinung
quality.favored_weapon_custom.choice.variant.fav_weapon_wicked.desc=Du erhältst 1 Edge, wenn du Proben auf Einfluss (Einschüchtern) ablegst und dabei offen mit deiner Waffe herumfuchtelst.
step.favored_weapon_customization.choice.favored_weapon_custom=Anpassung
step.favored_weapon_customization.choice.favored_weapon_custom.fav_weapon_kill=Siegesserie
step.favored_weapon_customization.choice.favored_weapon_custom.fav_weapon_kill.desc=Du erhältst 1 Edge, wenn du einen Gegner mit dieser Waffe besiegst.
