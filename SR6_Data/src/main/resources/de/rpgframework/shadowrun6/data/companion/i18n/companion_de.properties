# Complete Character Packs
# packs-complete.xml
item.starterpack=Shadowrunner-Starterkit
item.starterpack.page=51
item.starterpack.desc=Ganz egal, welche Fähigkeiten du hast, das hier sind die grundlegenden Gegenstände, von denen du dir wünschen wirst, sie gekauft zu haben, wenn du es jetzt nicht tust.<br/>In diesem Paket sind weder Waffen noch Panzerung, Fahrzeuge oder Sensoren enthalten. Aber es stattet dich mit einer ordentlichen gefälschten ID, einem für einen Monat bezahlten Unterschicht-Lebensstil, einem ordentlichen Kommlink (und einem Wegwerfkommlink) sowie verschiedenen anderen Gegenständen aus, die sich eher früher als später als nützlich erweisen werden. Jeder Shadowrunner sollte die Sachen in diesem Ausrüstungspaket haben.

item.dirt_poor=Bettelarm
item.dirt_poor.page=52
item.dirt_poor.desc=Wenn du Ressourcen auf das Minimum setzt und kein Individualisierungskarma für zusätzliche Nuyen ausgeben willst, beginnst du im Prioritätensystem mit mageren 8.000 Nuyen. Im Allgemeinen ist das die niedrigste Geldsumme, mit der ein Shadowrun-Charakter starten kann. Du kannst dir keine teure Spezialausrüstung oder auch nur eine vernünftige gefälschte SIN leisten (was wahrscheinlich eines der ersten Dinge ist, das du kaufen solltest, sobald du zu etwas Geld kommst). Also enthält dieses Paket, was du brauchst und dir auch tatsächlich leisten kannst. <br/>Beachte, dass dies das einzige vollständige Charakterpaket ist, das nicht auch das Shadowrunner-Starterkit enthält. Weil du praktisch pleite bist.

item.full_magician=Vollzauberer
item.full_magician.page=52
item.full_magician.desc=Die meisten Zauberer haben kaum Bedarf an teurer Technik oder Bodytech, um ihren Job erledigen zu können. Etwas Ausrüstung ist jedoch hilfreich, und ein magisches Refugium mit einem ordentlichen Vorrat an Reagenzien ist essenziell. Dieses Paket enthält all die Ausrüstung, die du zu Beginn brauchst. Wenn du später etwas Geld übrig hast, solltest du darüber nachdenken, dir einen Fokus zu kaufen.

item.close_combat=Nahkampf-Adept
item.close_combat.page=52
item.close_combat.desc=Adepten sind am besten für ihre Fähigkeiten als Kampfkünstler bekannt, und du bist da keine Ausnahme. Adeptenkräfte sind für Nahkampfspezialisten unglaublich effektiv, und das ist der Bereich, in dem du am besten bist. Du brauchst keine teure Ausrüstung oder Bodytech, aber ein Waffenfokus macht dich auf jeden Fall zu einem noch effektiveren Krieger.

item.face=Unterhändler
item.face.page=52
item.face.desc=Du warst schon immer wortgewandt, und im Laufe der Jahre hast du gelernt, deine sozialen Talente so ähnlich einzusetzen, wie ein Zauberer Zauber wirkt oder ein Hacker Firewalls umgeht. Das meiste von dem, was du tust, basiert auf deinen Attributen und Fertigkeiten, aber die richtigen Klamotten und ein paar Kleinigkeiten helfen dir dabei, den Job zu erledigen.

item.gunslinger=Pistolero-Adept
item.gunslinger.page=53
item.gunslinger.desc=Nicht alle Adepten konzentrieren sich auf den Nahkampf. Wenn du einen Adepten erschaffst, der Schusswaffen verwendet, enthält dieses Paket die Ausrüstung, die du dafür brauchst, aber ohne die ganze magiesenkende Bodytech. Abgesehen davon ist dieses Paket auch eine gute Ausgangsbasis, wenn du einen Charakter baust, der sich auf Schusswaffen konzentriert, aber entweder keine Bodytech haben oder sie selbst aussuchen willst.<br/>Der größte Teil dieses Paket besteht aus einer Vielzahl von Schusswaffen, jede für einen speziellen Zweck. Der Warhawk ist die Leg-dich-nicht-mit-mir-an-Seitenwaffe für offenes Tragen, während die Predator Gelmunition für eine nichttödliche Option lädt. Der Redhawk und die Ares Light Fire in versteckten Springarmen spielen dieselben Rollen mit etwas weniger Feuerkraft, aber mit dem Vorteil der Tarnbarkeit und einer schnellen Möglichkeit, sich in einem Kampf einen Vorteil zu verschaffen. Die Mossberg ist eine Allzweck-Angriffswaffe, und das Crockett EBR ist das perfekte Werkzeug für schallgedämpfte Scharfschützenarbeit. <br/>Dieses Paket geht davon aus, dass du dir kein Smartlink in die Augen implantieren lässt. Wenn du es doch tust, solltest du die Smartlink-Modifikation aus den Kontaktlinsen entfernen und die frei werdenden 2.000 Nuyen in etwas anderes investieren. Mehr Munition ist immer gut.

item.cybered_covered=Vercyberter Spezialist für Geheimoperationen
item.cybered_covered.page=54
item.cybered_covered.desc=Du hast die Fähigkeit, die Bodytech und die Spezialausrüstung, um jede Anlage zu infiltrieren, und die Kampffähigkeiten, um dir deinen Weg hinauszukämpfen, wenn die Sache mal schiefläuft. Dein Cyberarm scheint komplett natürlich zu sein, ist aber mit zwei mächtigen Waffen ausgerüstet, einer tödlichen und einer nichttödlichen.

item.decker=Decker
item.decker.page=54
item.decker.desc=Dieses Charakterpaket ist für Decker, die nicht alles in Ressourcen stecken, oder für diejenigen, die alles in Ressourcen stecken, aber noch weitere Spielzeuge kaufen wollen, die nicht nur für Hacker sind. Dieses Paket stattet dich mit der Bodytech aus, die du brauchst, außerdem mit einem großartigen Cyberdeck, einem Sportwagen und ein paar anderen Sachen, die dir unterwegs helfen.

item.cyborg=Cyborg
item.cyborg.page=56
item.cyborg.desc=Es gibt Straßensamurais und Bottichjobs, und dann gibt es dich. Mit Ausnahme einiger organischer Teile, wie etwa deiner inneren Organe und deines Gehirns, ist praktisch dein gesamter Körper ersetzt worden. Verschwende keine Mühen darauf, in deine natürliche Geschicklichkeit und Stärke zu investieren, denn deine Cybergliedmaßen decken das ab. Konstitution und Reaktion hingegen sind immer noch sehr wichtig für dich. Du ziehst immer die Blicke auf dich und wirst wahrscheinlich nie so etwas Ähnliches wie ein normales Leben führen. Du siehst mehr wie eine gepanzerte Anthrodrohne als wie ein Metamensch aus. Aber das ist okay für dich, denn die Fähigkeiten, die du dadurch erlangt hast, sind beeindruckend.

item.samurai=Strassensamurai
item.samurai.page=54
item.samurai.desc=Wenn du dir einen tödlichen, zuverlässigen und schwer modifizierten Kämpfer bauen willst, bist du hier genau richtig. Dieses Paket hat ein großes Preisschild (sowohl in Nuyen als auch in Essenzkosten), aber du bekommst damit auch alles, was du für einen ordentlichen Straßensamurai brauchst.

item.vat_job=Biowareverstärkter Kampfspezialist
item.vat_job.page=55
item.vat_job.desc=Dieses Paket ist für jemanden, der eine schwer modifizierte Kampfmaschine sein will, ohne dass man es gleich sieht. Jegliche Bodytech ist Bioware, die auch bei genauem Hinsehen nicht zu erkennen ist und von Cyberwarescans nicht entdeckt wird. Die Adrenalinpumpe gewährt dir, wenn sie aktiviert wird, für 2W6 Kampfrunden einen Bonus von +2 auf deine Geschicklichkeit, Reaktion, Stärke und Willenskraft, verursacht danach aber Betäubungsschaden. Alles, was du brauchst, ist in diesem Paket enthalten, von Bodytech bis hin zu Waffen und allem dazwischen.

item.weapons_specialist=Waffenspezialist
item.weapons_specialist.page=55
item.weapons_specialist.desc=Eine bessere Beschreibung für den Waffenspezialisten ist vielleicht Waffengeneralist. Das liegt daran, dass du dich darauf spezialisierst, jede Art von Waffen führen zu können. Du weißt schließlich nie, welches Werkzeug du brauchen wirst, also warum nicht Zugriff auf alle haben? Dieses Paket enthält die Bodytech, die du brauchst, um das Beste aus deinem Arsenal zu machen, aber das Wichtigste hier ist die große Sammlung verschiedenartiger Waffen. Nimm dir etwas Zeit, um dir die Liste durchzulesen, denn jede Waffe dient einem bestimmten Zweck. Jede ist das perfekte Werkzeug für ein bestimmtes Problem. Der Schlüssel liegt darin, zu verstehen, welches Werkzeug für welche Situation am geeignetsten ist. Ach, und übrigens, Sprengstoff ist auch dabei.

item.max_decker=Decker mit maximaler Hardware
item.max_decker.page=56
item.max_decker.desc=Wenn du als Decker mit den maximal möglichen Ressourcen aufs Ganze gehen willst, gibt dieses Paket noch den letzten Nuyen für dich aus und verschafft dir alles, was du brauchst, um mit maximierter Hardware loszulegen. Dein Cyberdeck ist implantiert, zusammen mit deiner Cyberbuchse und ein paar weiteren Modifikationen, um dir den Vorteil zu geben, den du in der Matrix und der Fleischwelt brauchst.

item.transport_rigger=Transportrigger
item.transport_rigger.page=57
item.transport_rigger.desc=Manchmal geht es bei Riggern um die einfache Aufgabe, Dinge von einem Ort zum anderen zu bringen. Das ist allerdings nicht immer so einfach, wie es sich anhört, denn einige dieser Dinge sind Shadowrunner, und wenn Shadowrunner sich bewegen, versuchen andere oft, sie aufzuhalten. Deswegen enthält dieses Paket die Bodytech und Ausrüstung, die ein Rigger braucht, um gut in seinem Job zu sein, sowie etwas Panzerung und eine Seitenwaffe, um sich Schwierigkeiten vom Leib zu halten. Das Paket hat drei voll ausgestattete Fahrzeuge und ein paar Drohnen, die hauptsächlich als Eskorte dienen.

item.drone_rigger=Drohnenrigger
item.drone_rigger.page=57
item.drone_rigger.desc=Dieses Riggerpaket enthält ein Fahrzeug, um den Charakter dorthin zu bringen, wo er sein muss, und eine Staffel schwer bewaffneter Drohnen, um Chaos anzurichten, wo auch immer sie sind. Da Drohnen mit Kanonen häufig beschädigt werden, enthält dieses Paket auch eine Werkzeugkiste und einen Laden, um sie zu reparieren, zusammen mit all den anderen Dingen, die ein Rigger braucht.

item.augmented_for_firearms=Bodytech für Feuerwaffen
item.augmented_for_firearms.page=58
item.augmented_for_firearms.desc=Dieses Charakterpaket ist kein vollständiges Charakterpaket, sondern eine nützliche Ausgangsbasis für mundane Charaktere oder sogar Pistolero-Adepten, die bereit sind, etwas Essenz zu opfern. Die Cyberaugen sind smartlinkfähig und haben eine eingebaute Vergrößerung, um Ziele auf größere Entfernung zu entdecken und zu treffen. Der Reflexrekorder gewährt dir einen Zusatzwürfel auf alle Feuerwaffen-Proben. Jeder waffenschwingende Shadowrunner braucht eine Seitenwaffe und ein paar gut zu verbergende Reservewaffen. Die Ares Predator ist für Heimlichkeit ausgerüstet, aber du kannst Explosivmunition laden, wenn es laut wird. Die anderen Pistolen sind ordentliche Reservewaffen, die du vielleicht an der Sicherheit vorbeischmuggeln kannst. Aber wenn du einen kampfstärkeren Charakter zusammenstellst, solltest du vielleicht noch ein paar der Waffenpakete (s. u.) kaufen. Deine Bodytech arbeitet genauso gut mit großen Waffen zusammen wie mit deinen Seitenwaffen. Und vergiss nicht, dir etwas Panzerung zu kaufen.

# Weapon Packs
# packs-weapons.xml
item.pack_cross_light=Armbrust-Leicht
item.pack_cross_light.page=58
item.pack_cross_light.desc=Armbrüste sind besonders dann effektiv, wenn sie mit Injektionsbolzen geladen sind. Außerdem sind sie recht leise und werden mit der Fertigkeit Athletik abgefeuert, was sie zur perfekten Reservewaffe für einen Charakter macht, der keine anderen Kampffertigkeiten hat.

item.pack_cross_standard=Ambrust-Mittel
item.pack_cross_standard.page=58
item.pack_cross_standard.desc=Armbrüste sind besonders dann effektiv, wenn sie mit Injektionsbolzen geladen sind. Außerdem sind sie recht leise und werden mit der Fertigkeit Athletik abgefeuert, was sie zur perfekten Reservewaffe für einen Charakter macht, der keine anderen Kampffertigkeiten hat.

item.pack_cross_heavy=Armbrust-Schwer
item.pack_cross_heavy.page=58
item.pack_cross_heavy.desc=Armbrüste sind besonders dann effektiv, wenn sie mit Injektionsbolzen geladen sind. Außerdem sind sie recht leise und werden mit der Fertigkeit Athletik abgefeuert, was sie zur perfekten Reservewaffe für einen Charakter macht, der keine anderen Kampffertigkeiten hat.

item.pack_taser_defiance=Taser-Defiance Super Shock
item.pack_taser_defiance.page=58
item.pack_taser_defiance.desc=Die meisten Runner gönnen Tasern keinen zweiten Blick, aber eine verborgene Waffe zu haben, der die meisten Wachen ebenfalls keinen zweiten Blick gönnen, kann sich als nützlich erweisen.

item.pack_taser_pulsar=Taser-Yamaha Pulsar II
item.pack_taser_pulsar.page=58
item.pack_taser_pulsar.desc=Die meisten Runner gönnen Tasern keinen zweiten Blick, aber eine verborgene Waffe zu haben, der die meisten Wachen ebenfalls keinen zweiten Blick gönnen, kann sich als nützlich erweisen.

item.pack_holdout_needler=Holdout-Fichetti Tiffani Needler
item.pack_holdout_needler.page=58
item.pack_holdout_needler.desc=Dies sind einige der am besten zu verbergenden Waffen, die man kaufen kann, aber sie haben nicht viel Feuerkraft. Sieh sie als Reservewaffe oder als Werkzeug, wenn Tarnbarkeit an erster Stelle steht.

item.pack_holdout_streetline=Holdout-Streetline Special
item.pack_holdout_streetline.page=58
item.pack_holdout_streetline.desc=Dies sind einige der am besten zu verbergenden Waffen, die man kaufen kann, aber sie haben nicht viel Feuerkraft. Sieh sie als Reservewaffe oder als Werkzeug, wenn Tarnbarkeit an erster Stelle steht.

item.pack_holdout_palm=Holdout-Walther Palm Pistol
item.pack_holdout_palm.page=59
item.pack_holdout_palm.desc=Dies sind einige der am besten zu verbergenden Waffen, die man kaufen kann, aber sie haben nicht viel Feuerkraft. Sieh sie als Reservewaffe oder als Werkzeug, wenn Tarnbarkeit an erster Stelle steht.

item.pack_light_fire75=Leichte Pistole-Ares Light Fire 75
item.pack_light_fire75.page=59
item.pack_light_fire75.desc=Leichte Pistolen können fast so gefährlich sein wie ihre schwereren Verwandten, aber man kann eine schwere Pistole nicht in einen Springarm einpassen! Sie opfern etwas Feuerkraft für eine bessere Tarnbarkeit, sind aber in einem Feuergefecht viel brauchbarer als eine Holdout-Pistole. Und auch wenn ein offensichtlicher Vorteil des Springarms schon ist, dass man sofort eine Waffe bereit hat, denk daran, dass du auch noch 1 Edge bekommst, nur weil du den Springarm verwendest, um dich zu bewaffnen. Die Ares Light Fire ist eine schallgedämpfte Waffe, die Beretta gibt dir vollautomatisches Feuer, und der Ruger Redhawk ist für seine Größe ein mächtiger Revolver.

item.pack_light_beretta=Leichte Pistole-Beretta 201T
item.pack_light_beretta.page=59
item.pack_light_beretta.desc=Leichte Pistolen können fast so gefährlich sein wie ihre schwereren Verwandten, aber man kann eine schwere Pistole nicht in einen Springarm einpassen! Sie opfern etwas Feuerkraft für eine bessere Tarnbarkeit, sind aber in einem Feuergefecht viel brauchbarer als eine Holdout-Pistole. Und auch wenn ein offensichtlicher Vorteil des Springarms schon ist, dass man sofort eine Waffe bereit hat, denk daran, dass du auch noch 1 Edge bekommst, nur weil du den Springarm verwendest, um dich zu bewaffnen. Die Ares Light Fire ist eine schallgedämpfte Waffe, die Beretta gibt dir vollautomatisches Feuer, und der Ruger Redhawk ist für seine Größe ein mächtiger Revolver.

item.pack_light_redhawk=Leichte Pistole-Ruger Redhawk
item.pack_light_redhawk.page=59
item.pack_light_redhawk.desc=Leichte Pistolen können fast so gefährlich sein wie ihre schwereren Verwandten, aber man kann eine schwere Pistole nicht in einen Springarm einpassen! Sie opfern etwas Feuerkraft für eine bessere Tarnbarkeit, sind aber in einem Feuergefecht viel brauchbarer als eine Holdout-Pistole. Und auch wenn ein offensichtlicher Vorteil des Springarms schon ist, dass man sofort eine Waffe bereit hat, denk daran, dass du auch noch 1 Edge bekommst, nur weil du den Springarm verwendest, um dich zu bewaffnen. Die Ares Light Fire ist eine schallgedämpfte Waffe, die Beretta gibt dir vollautomatisches Feuer, und der Ruger Redhawk ist für seine Größe ein mächtiger Revolver.

item.pack_mp_crusader=Automatikpistole-Ares Crusader II
item.pack_mp_crusader.page=59
item.pack_mp_crusader.desc=Die Ares Crusader ist mit ihrem integrierten Smartgunsystem und dem Gasventilsystem zu einem sehr niedrigen Preis ein unglaublicher Deal. All diese Waffen stecken in Tarnholstern.

item.pack_mp_scorpion1=Automatikpistole-Ceska Black Scorpion Smart
item.pack_mp_scorpion1.page=59
item.pack_mp_scorpion1.desc=Von der Ceska Black Scorpion werden hier zwei Varianten präsentiert. Der Unterschied zwischen den beiden Paketen ist, dass das eine ein Smartgunsystem, das andere einen Lasermarkierer enthält. Die meisten Runner ziehen Smartgunsysteme vor, aber ein Lasermarkierer ist für gegnerische Hacker viel schwerer zu manipulieren und erfordert keine zusätzliche Ausrüstung. All diese Waffen stecken in Tarnholstern.

item.pack_mp_scorpion2=Automatikpistole-Ceska Black Scorpion
item.pack_mp_scorpion2.page=59
item.pack_mp_scorpion2.desc=Von der Ceska Black Scorpion werden hier zwei Varianten präsentiert. Der Unterschied zwischen den beiden Paketen ist, dass das eine ein Smartgunsystem, das andere einen Lasermarkierer enthält. Die meisten Runner ziehen Smartgunsysteme vor, aber ein Lasermarkierer ist für gegnerische Hacker viel schwerer zu manipulieren und erfordert keine zusätzliche Ausrüstung. All diese Waffen stecken in Tarnholstern.

item.pack_mp_tmp=Automatikpistole-Steyr TMP
item.pack_mp_tmp.page=59
item.pack_mp_tmp.desc=Die Steyr TMP ist für ihren vollautomatischen Feuermodus berühmt. All diese Waffen stecken in Tarnholstern.

item.pack_heavy_predator1=Schwere Pistole-Ares Predator VI
item.pack_heavy_predator1.page=59
item.pack_heavy_predator1.desc=Diese Pakete enthalten mehrere Variationen von Zubehör und Modifikationen für einige der beliebtesten Pistolen auf dem Markt. Einige ziehen jeden Vorteil aus modernen technologischen Upgrades, während andere so modifiziert wurden, dass sie nicht zu hacken sind, auch wenn ihnen dadurch ein Smartgunsystem fehlt.

item.pack_heavy_predator2=Schwere Pistole-Ares Predator VI Schallgedämpft
item.pack_heavy_predator2.page=59
item.pack_heavy_predator2.desc=Diese Pakete enthalten mehrere Variationen von Zubehör und Modifikationen für einige der beliebtesten Pistolen auf dem Markt. Einige ziehen jeden Vorteil aus modernen technologischen Upgrades, während andere so modifiziert wurden, dass sie nicht zu hacken sind, auch wenn ihnen dadurch ein Smartgunsystem fehlt.

item.pack_heavy_viper=Schwere Pistole-Ares Viper Slivergun
item.pack_heavy_viper.page=59
item.pack_heavy_viper.desc=Diese Pakete enthalten mehrere Variationen von Zubehör und Modifikationen für einige der beliebtesten Pistolen auf dem Markt. Einige ziehen jeden Vorteil aus modernen technologischen Upgrades, während andere so modifiziert wurden, dass sie nicht zu hacken sind, auch wenn ihnen dadurch ein Smartgunsystem fehlt.

item.pack_heavy_manhunter1=Schwere Pistole-Colt Government 2076
item.pack_heavy_manhunter1.page=59
