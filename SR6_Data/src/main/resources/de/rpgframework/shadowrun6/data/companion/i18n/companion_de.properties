dataset.name.short=KOMP
dataset.name=Schattenkompendium
dataset.desc=<b>Lebe deinen Traum</b><br/><br/>\
Die Sechste Welt ist wild. Sie ist seltsam. Sie ist einzigartig. Und das alles kannst auch du sein. Ob du nun deinen Charakter maximal individualisieren willst, ob du statt Trollen Riesen oder Minotauren spielen möchtest, ob deine Elfin eigentlich eine Dryade oder eine Nächtliche ist: Das Universum von Shadowrun ist bunt genug für alle.<br/><br/>\
Das <em>Schattenkompendium</em> ist ein Regelwerk für <em>Shadowrun 6</em>, das alternative Methoden zur Charaktererstellung, neue Metatypen, eine ganze Reihe von Vor- und Nachteilen und sogar einige Regelvariationen vorstellt. Die deutsche Version enthält zudem eine Alternative zur Charaktergenerierung mit Karma und fast 20 neue Illustrationen der Metatypen. Mit einer Vielzahl an Optionen soll so gewährt werden, dass auf den Spieltisch genau die Shadowrun-Version kommt, die deine Gruppe am liebsten spielt.

