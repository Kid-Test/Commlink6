item.pack_heavy_warhawk1=Schwere Pistole-Ruger Super Warhawk Smart
item.pack_heavy_warhawk1.page=59
item.pack_heavy_warhawk1.desc=Diese Pakete enthalten mehrere Variationen von Zubehör und Modifikationen für einige der beliebtesten Pistolen auf dem Markt. Einige ziehen jeden Vorteil aus modernen technologischen Upgrades, während andere so modifiziert wurden, dass sie nicht zu hacken sind, auch wenn ihnen dadurch ein Smartgunsystem fehlt.

item.pack_heavy_warhawk2=Schwere Pistole-Ruger Super Warhawk
item.pack_heavy_warhawk2.page=59
item.pack_heavy_warhawk2.desc=Diese Pakete enthalten mehrere Variationen von Zubehör und Modifikationen für einige der beliebtesten Pistolen auf dem Markt. Einige ziehen jeden Vorteil aus modernen technologischen Upgrades, während andere so modifiziert wurden, dass sie nicht zu hacken sind, auch wenn ihnen dadurch ein Smartgunsystem fehlt.

item.pack_shot_defiance1=Schrotflinte-Defiance T-250
item.pack_shot_defiance1.page=59
item.pack_shot_defiance1.desc=Schrotflinten sind mächtige und im Allgemeinen günstige Angriffswaffen mit hohen Angriffswerten und einer hohen Reichweite. Mit Ausnahme der kurzläufigen Defiance T-250 und der Remington Roomsweeper kann man sie allerdings nicht verbergen. Und all diese Waffen sind laut.

item.pack_shot_defiance2=Schrotflinte-Defiance T-250 Smart
item.pack_shot_defiance2.page=59
item.pack_shot_defiance2.desc=Schrotflinten sind mächtige und im Allgemeinen günstige Angriffswaffen mit hohen Angriffswerten und einer hohen Reichweite. Mit Ausnahme der kurzläufigen Defiance T-250 und der Remington Roomsweeper kann man sie allerdings nicht verbergen. Und all diese Waffen sind laut.

item.pack_shot_mossberg1=Schrotflinte-Mossberg CMDT
item.pack_shot_mossberg1.page=59
item.pack_shot_mossberg1.desc=Schrotflinten sind mächtige und im Allgemeinen günstige Angriffswaffen mit hohen Angriffswerten und einer hohen Reichweite. Mit Ausnahme der kurzläufigen Defiance T-250 und der Remington Roomsweeper kann man sie allerdings nicht verbergen. Und all diese Waffen sind laut.

