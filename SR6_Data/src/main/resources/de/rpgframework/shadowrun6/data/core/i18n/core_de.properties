quality.allergy.choice.severity.severe=Schwer
quality.allergy.choice.severity.severe.desc=Du erhältst einen Würfelpoolmalus von -4 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. Außerdem erleidest du jede Minute 1 Kästchen Körperlichen Schaden ohne Widerstandsprobe, solange du dem Allergen ausgesetzt bist.
