item.ar_gloves.desc=Diese Handbedeckungen sind in zahlreichen Stilen erhältlich und erlauben die manuelle Interaktion mit der Matrix im AR-Modus, sodass man virtuelle AROs "berühren" und "halten" kann und eine taktile Rückmeldung erhält. AR-Handschuhe können das genaue Gewicht und die Temperatur der berührten oder gehaltenen Gegenstände zurückmelden.
item.biometric_reader.desc=Dieses Handgerät kann für Fingerabdrücke, Retinascans, Stimmmuster und Zungenabdrücke verwendet werden. Ein Charakter kann damit seine Elektronik so blockieren, dass sie nur von ihm (oder einem seiner Körperteile) entsperrt werden kann.
item.electronic_paper.desc=aufrollen kann, gibt es in Größen vom Notizzettel bis zum Poster. Es zeigt Bilder, Text, Daten und Videos an und kann als Touchscreen dienen. Im Grunde ist es nichts anderes als ein ultradünner Monitor. Elektronisches Papier ist WiFi-fähig und kann per WiFi beschrieben oder gelöscht werden.
item.printer.desc=Wenn man mal etwas als Ausdruck braucht, gibt es diesen Farbdrucker, der bereits mit einem Papierbehälter versehen ist.
item.satellite_link.desc=Damit kann sich der User mit Kommunikationssatelliten im niedrigen Orbit verbinden und von den wenigen Orten aus mit der Matrix interagieren, an denen es kein Wi- Fi-Netzwerk gibt. Die Verbindung beschränkt das Rauschen aufgrund von Entfernung auf maximal -5. Eine tragbare Satellitenschüssel ist im Lieferumfang enthalten.
item.sim_module.desc=Dieses interne Upgrade gibt dem Benutzer die volle Simsinn- Erfahrung. Es ermöglicht ihm, Simsinn-Programme, vollsensorische AR und VR direkt zu erleben. Auf ein Sim-Modul muss über ein direktes Neuralinterface zugegriffen werden (Troden, Datenbuchse oder implantiertes Kommlink). Sim-Module können für heißes Sim modifiziert werden, was einem die volle Bandbreite der VR-Erfahrung eröffnet (und das Risiko, sich das Hirn zu rösten).
item.sim_module_hot.desc=Dieses interne Upgrade gibt dem Benutzer die volle Simsinn- Erfahrung. Es ermöglicht ihm, Simsinn-Programme, vollsensorische AR und VR direkt zu erleben. Auf ein Sim-Modul muss über ein direktes Neuralinterface zugegriffen werden (Troden, Datenbuchse oder implantiertes Kommlink). Sim-Module können für heißes Sim modifiziert werden, was einem die volle Bandbreite der VR-Erfahrung eröffnet (und das Risiko, sich das Hirn zu rösten).
item.simrig.desc=Dieser Simsinn-Rekorder kann sensorische und emotionale Daten seines Trägers aufzeichnen. Mit Simrigs werden die meisten Simsinn-Chips aufgezeichnet, die man auf dem Markt findet. Für eine Aufzeichnung braucht man ein funktionierendes Sim-Modul (mit DNI).
item.simrig.variant.cyberware.desc=Dieser Simsinn-Rekorder kann sensorische und emotionale Daten seines Trägers aufzeichnen. Mit Simrigs werden die meisten Simsinn-Chips aufgezeichnet, die man auf dem Markt findet. Für eine Aufzeichnung braucht man ein funktionierendes Sim-Modul (mit DNI).
item.trid_projector.desc=Dieses Gerät projiziert ein Trideohologramm in einen fünf Meter durchmessenden Würfel neben oder über dem Gerät. Das Hologramm kann ziemlich realistisch aussehen, aber wenn es man nicht gerade mit besonderer künstlerischer Sorgfalt erstellt, ist es offensichtlich, dass es nur ein Trideo ist.
item.subvocal_microphone.desc=Dieser hautfarbene Aufkleber, der am Hals befestigt wird, enthält ein Mikrofon, das eine subvokale Kommunikation ohne erkennbare Lippenbewegungen erlaubt. Wer versucht, die Unterhaltung mitzuhören, kann für seine Wahrnehmungsprobe weder Edge erhalten noch ausgeben.
item.trodes.desc=Dieses Netz aus Elektroden und Ultraschallsendern verleiht dem Benutzer ein direktes Neuralinterface (DNI). Es ist als Stirnband, Kappe oder Hut erhältlich, kann aber auch in eine bereits vorhandene Kopfbedeckung - etwa einen Helm oder einen schicken Filzhut - eingebaut werden.
item.standard_tag.desc=Diese winzigen Computerchips stecken mittlerweile in jedem kommerziell erhältlichen Produkt der Sechsten Welt. Viele der integrierten Chips - zum Beispiel in Patronenhülsen - sind mikroskopisch klein, aber kommerziell erhältliche RFID-Chips haben Größen von zwei Quadratmillimetern bis hin zu drei Quadratzentimetern. Sie haben eine selbstklebende Rückseite, und die ganz kleinen sind wirklich schwer zu entdecken. RFID-Chips werden für das Geotagging von Orten und Gegenständen, das Hinterlassen von virtuellen AR-Botschaften für Passanten, das Kontrollieren von Arbeitnehmern, für die Zugangskontrolle, für Besitzer- und Kontaktinformationen für alles von Fahrzeugen bis hin zu Haustieren, für die Fahrzeug- und Waffenregistrierung und für vieles mehr verwendet. Sie können auch als Peilgeräte eingesetzt werden, indem sie periodisch GPS-Daten an die Matrix übermitteln.\n RFID-Chips sind Geräte, die eine oder mehrere Dateien enthalten können, aber nicht viel mehr. Der physische Aufenthaltsort eines Chips kann über die Matrix gefunden werden (s. Icon aufspüren, S. 182). Chipdaten können mit einem RFID-Löscher (S. 271) gelöscht werden oder durch die Matrixhandlung Datei editieren (S. 180) programmiert werden. Wie alle anderen Geräte haben auch RFID-Chips Besitzer, aber anders als bei anderen Geräten kann der Besitzer eines Chips auf "niemand" geändert werden.
item.datachip.desc=Datenchips werden verwendet, um Daten offline zu speichern. Ein einzelner Datenchip kann auf seinen zwei mal sechs Zentimetern Größe eine gewaltige Menge an Daten speichern. Datenchips sind nicht WiFi-fähig, daher muss man sie in einen Universal-Datenport (den jedes Gerät hat) stecken, wenn man sie lesen oder auf sie schreiben will.
item.security_tag.desc=Sicherheits-Chips werden dazu verwendet, Personen oder Dinge zu verfolgen und aufzuspüren; dazu werden sie unter die Haut (oder die Oberfläche) implantiert. Megakons benutzen sie, um ihre Bürger zu tracken (um sie zu schützen und zu überwachen - na ja, meistens, um sie zu überwachen), Gefängniskonzerne überwachen damit inhaftierte Gefangene und Freigänger, und Eltern und Schulen behalten damit Schüler im Auge. Sicherheits-Chips sind gegen EMP geschützt und können deshalb nicht mit einem RFID-Löscher gelöscht werden. Wenn ein Chip unter der Haut implantiert wurde, ist eine Ausgedehnte Probe auf Biotech + Logik (10, 1 Minute) erforderlich, um ihn zu entfernen.
item.security_tag.variant.stealth_tag.desc=Die Variante des Spionage-Chips läuft immer auf Schleichfahrt (siehe S. 178) und würfelt mit 10 Würfeln bei einer Vergleichenden Probe auf Matrixwahrnehmung. Spionage-Chips übertragen ihre Daten nur zu bestimmten voreingestellten Zeiten in einem kurzen Sendeimpuls. Oft werden sie als andere Objekte getarnt oder darin versteckt.
item.sensor_tag.desc=Ein Sensor-Chip zeichnet 24 Stunden lang die Daten eines einzelnen Sensors (der separat gekauft werden muss) mit maximal Stufe 2 auf (s. Sensoren, S. 277). Nach diesen 24 Stunden schaltet er sich entweder ab oder überschreibt Daten, die älter sind als 24 Stunden - je nachdem, wie man ihn programmiert. Abrufen lassen sich die Daten nur innerhalb eines Meters Entfernung zum Chip, es sei denn, seine WiFi-Funktionalität wurde aktiviert.
item.bug_scanner.desc=Dieses Gerät lokalisiert WiFi-Geräte in einem Umkreis von 20 Metern. Der Scanner misst die Stärke eines Signals und kann seine Position punktgenau bestimmen. Um einen Wanzenscanner zu bedienen, ist eine Probe auf Elektronik + Logik erforderlich, die als Vergleichende Matrixwahrnehmungsprobe abgelegt wird. Wenn man mit dem Wanzenscanner Nettoerfolge erzielt, findet man das Gerät.
item.data_tap.desc=Wenn man dieses Hackingwerkzeug an einem Datenkabel befestigt, kann man eine direkte Verbindung zu den Geräten an beiden Enden des Kabels herstellen (und umgekehrt). Rauschen spielt keine Rolle - solange man verbunden bleibt. Die Datenwanze kann entfernt werden, ohne das Kabel zu beschädigen.
item.headjammer.desc=Der Headkom-Blocker dient dazu, implantierte Kommlinks und Cyberdecks zu neutralisieren. Wenn er an dem betreffenden Körperteil befestigt wird, funktioniert er genauso wie jeder andere Störsender, nur dass seine Wirkung auf das implantierte Gerät beschränkt ist. Das Entfernen des Headkom-Blockers durch jemanden, der nicht den richtigen Schlüssel hat, erfordert eine Ausgedehnte Probe auf Elektronik + Logik oder Mechanik + Geschicklichkeit (10, 1 Haupthandlung). Einen Headkom-Blocker bei sich selbst zu entfernen, erfordert eine Probe auf Athletik + Geschicklichkeit (5) und eine Haupthandlung. Misslingt eine dieser Proben, könnten eventuelle zusätzliche Anti-Manipulations- Systeme aktiviert werden, die mit dem Headkom-Blocker gekoppelt sind.
item.jammer.desc=Dieses Gerät flutet den Äther mit elektromagnetischen Störsignalen, um WiFi- und Funkkommunikation zu blockieren. Der Störsender erzeugt Rauschen in Höhe seiner Stufe. Wände und andere Hindernisse können das Störsignal an der Ausbreitung hindern oder seine Wirkung abschwächen (nach Maßgabe der Spielleiterin). Ein Störsender wirkt nur auf Geräte, die sich innerhalb seines Störbereichs befinden, aber in diesem Bereich wirkt er auf alle Geräte.
item.jammer.variant.area.desc=Der Bereichsstörsender beeinflusst einen kugelförmigen Bereich; seine Stufe sinkt alle 10 Meter vom Zentrum des Bereichs aus um 1.
item.jammer.variant.direct.desc=Der zielgerichtete Störsender beeinflusst einen kegelförmigen Bereich mit einem Winkel von 30 Grad; seine Stufe sinkt alle 30 Meter vom Zentrum aus um 1.
item.micro-transceiver.desc=Dieses kurzreichweitige Kommunikationsgerät macht eigentlich nichts Besonderes - es lässt einen lediglich per Stimme mit anderen Mikro-Transceivern und Kommlinks, die zusammengeschaltet wurden, innerhalb eines Kilometers kommunizieren. Der Mikro-Transceiver besteht aus einem Ohrstöpsel und einem selbsthaftenden subvokalen Mikrofon (S. 269). Ein Mikro-Transceiver hat eine Gerätestufe von 2 und arbeitet am besten als Slave eines besseren Gerätes, wenn man ihn für sichere Kommunikation verwenden will.
item.tag_eraser.desc=Dieses Handgerät erzeugt einen starken elektromagnetischen Impuls, der RFID-Chips und andere ungeschützte Elektronik ausbrennen kann. Um ihn einzusetzen, bringt man den Löscher in eine Entfernung von maximal 5 Millimetern zum betreffenden Chip oder Gerät und drückt auf den Schalter, wodurch augenblicklich 10 Kästchen Matrixschaden angerichtet werden (denen normal widerstanden wird). Aufgrund seiner sehr kurzen Reichweite kann man den Löscher nicht gegen Zielobjekte wie Fahrzeuge, die meisten Drohnen, Magschlösser und Cyberware einsetzen. Der RFID-Löscher enthält 1 Ladung, die am Stromnetz innerhalb von zehn Sekunden voll aufgeladen werden kann.
item.white_noise_generator.desc=Dieses Gerät erzeugt ein Feld zufälligen Rauschens und verhindert oder stört auf diese Weise eine Audioüberwachung. Alle Wahrnehmungsproben, um eine Unterhaltung innerhalb von [Stufe] Metern von einem White-Noise-Generator mitzuhören, erhalten einen Würfelpoolmalus in Höhe der Stufe des Generators. Werden mehrere Generatoren eingesetzt, zählt nur die höchste Stufe. In einer lauten Umgebung (etwa einem Nachtclub oder bei einer Schießerei) ist ein White-Noise-Generator überflüssig.

