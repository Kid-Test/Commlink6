item.reaction_enhancers.page=288
item.reaction_enhancers.wifi=Reaktionsverbesserung ist kompatibel mit einem kabellosen Reflexbooster. In diesem Fall ist auch eine Erhöhung der Reaktion um mehr als +4 möglich.
item.skillwires=Talentleitungen
item.skillwires.page=289
item.skillwires.wifi=Mit dem erweiterten Speicher der Talentleitungen erhalten alle Fertigkeiten, die man damit nutzt, einen Würfelpoolbonus von +1.
