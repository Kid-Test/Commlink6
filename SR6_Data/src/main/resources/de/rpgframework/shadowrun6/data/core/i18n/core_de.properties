npc.barghest.desc=Der Barghest ist eine Metavariante des Mastiffs, mit einer Schulterhöhe von etwa 85 cm und einem Gewicht von 90 kg. Sein kurzes, glattes Fell ist entweder vollständig weiß oder komplett schwarz und liegt so eng an seinem massigen, muskulösen Körper an, dass der Anschein von nackter Haut erweckt wird. Spitze Stacheln ragen entlang seines Rückgrats hervor. Seine Augen sind rotglühend, und seine Zähne leuchten schwach in der Dunkelheit, da sein Speichel lumineszierende Bakterien enthält. Während der Paarungszeit jagt er einzeln oder in Paaren, ansonsten in Rudeln von zwölf oder mehr Tieren. Eine Reihe von Konzernen hat - mit unterschiedlichem Erfolg - versucht, Barghests als Wachtiere einzusetzen, vor allem wegen ihres Heulens. <br/><b>Natürlicher Lebensraum/Verbreitung:</b> Urbane Regionen in Nordamerika und Nordeuropa, vor allem auf den Britischen Inseln. Auch in Australien, Ostasien und Nairobi und an fast allen Orten, die einmal zum Britischen Empire gehörten, wurden Barghests beobachtet.
npc.barghest.item.barghest_claws.desc=Klauen des Barghest
npc.basilisk.desc=Diese Metavariante des Komodowarans misst von der Schnauze bis zur Schwanzspitze durchschnittlich 260 cm und wiegt um die 100 kg. Seine Schulterhöhe beträgt etwa 50 cm, er ist etwas breiter als sein weltlicher Verwandter und hat einen stacheligen Rückenfächer, der an der höchsten Stelle etwa 30 cm hoch ist und über das gesamte Rückgrat verläuft. Die Schuppen sind sehr schwer und von schwarzer und leuchtend gelber Farbe, Schnauze und Schwanzspitze sind tiefschwarz. Er besitzt scharfe sägezahnartige Zähne, die nachwachsen, wenn sie verloren gehen. Der Basilisk ist ein aggressiver Fleischfresser, der sich überwiegend von Fischen und kleinen Säugetieren ernährt. Aber er frisst auch fröhlich alles andere, das er zu packen kriegt, gelegentlich sogar Metamenschen. Basilisken sind sehr territorial, relativ leicht abzurichten und werden von zahlreichen Megakonzernen der ganzen Welt als Wachcritter eingesetzt, allerdings lassen sie sich in der Regel nur schwer davon abhalten, alles zu fressen, was sie töten. <br/><b>Natürlicher Lebensraum/Verbreitung:</b> Der in Indonesien heimische Basilisk hat sich in gemäßigten bis tropischen Waldregionen der ganzen Welt ausgebreitet - durch Tiere, die aus Konzernhaltung oder absurden Versuchen, sie als Haustiere zu halten, entflohen sind. Als ausgezeichnete Schwimmer siedeln sich Basilisken gern in der Nähe fließender Gewässer an.

