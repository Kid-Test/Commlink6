item.stun_grenade.desc=Diese auch als Schockgranaten bezeichneten Granaten explodieren mit einem blendend grellen Lichtblitz und einer lauten Druckwelle, die jeden innerhalb ihrer Reichweite betäubt und ins Straucheln bringt. Zusätzlich zum Schaden erleidet jeder innerhalb der Sprengwirkung einer Betäubungsgranate die Status Benommen, Ertaubt I und Geblendet I.
item.fragmentation_grenade.desc=Die klassische Splittergranate verteilt tödliche Schrapnellsplitter über einen weiten Bereich.
item.high_explosive_grenade.desc=Diese Granaten verursachen eine heftige Explosion, vor allem in geringer Entfernung.
item.gas_grenade.desc=Mit diesen Granaten können Chemikalien oder Toxine verteilt werden (s. Toxine und Drogen, S. 124). Die Gaswolke hat einen Anfangsradius von 5 Metern und hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.smoke_grenade.desc=Ähnlich wie eine Gasgranate gibt eine Rauchgranate eine Wolke ab, die jedoch aus Rauch besteht statt aus giftigem Gas. Die Wolke schränkt die Sicht ein und verursacht den Status Geblendet I bei jedem, der etwas durch die Wolke hindurch tun will (etwa feuern), und Geblendet II bei jedem, der sich innerhalb der Wolke befindet. Rauchgranaten schränken normale Sicht (inklusive Restlichtverstärkung) ein. Die Wolke hat einen Anfangsradius von 5 Metern und hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.smoke_grenade_thermal.desc=Ähnlich wie eine Gasgranate gibt eine Rauchgranate eine Wolke ab, die jedoch aus Rauch besteht statt aus giftigem Gas. Die Wolke schränkt die Sicht ein und verursacht den Status Geblendet I bei jedem, der etwas durch die Wolke hindurch tun will (etwa feuern), und Geblendet II bei jedem, der sich innerhalb der Wolke befindet. IR-Rauchgranaten schränken normale Sicht (inklusive Restlichtverstärkung) und Infrarotsicht ein. Die Wolke hat einen Anfangsradius von 5 Metern und hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.

item.stun_grenade.variant.mini.desc=Diese auch als Schockgranaten bezeichneten Granaten explodieren mit einem blendend grellen Lichtblitz und einer lauten Druckwelle, die jeden innerhalb ihrer Reichweite betäubt und ins Straucheln bringt. Zusätzlich zum Schaden erleidet jeder innerhalb der Sprengwirkung einer Betäubungsgranate die Status Benommen, Ertaubt I und Geblendet I.
item.fragmentation_grenade.variant.mini.desc=Die klassische Splittergranate verteilt tödliche Schrapnellsplitter über einen weiten Bereich.
item.high_explosive_grenade.variant.mini.desc=Diese Granaten verursachen eine heftige Explosion, vor allem in geringer Entfernung.
item.gas_grenade.variant.mini.desc=Mit diesen Granaten können Chemikalien oder Toxine verteilt werden (s. Toxine und Drogen, S. 124). Die Gaswolke hat einen Anfangsradius von 5 Metern und hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.smoke_grenade.variant.mini.desc=Ähnlich wie eine Gasgranate gibt eine Rauchgranate eine Wolke ab, die jedoch aus Rauch besteht statt aus giftigem Gas. Die Wolke schränkt die Sicht ein und verursacht den Status Geblendet I bei jedem, der etwas durch die Wolke hindurch tun will (etwa feuern), und Geblendet II bei jedem, der sich innerhalb der Wolke befindet. Rauchgranaten schränken normale Sicht (inklusive Restlichtverstärkung) ein. Die Wolke hat einen Anfangsradius von 5 Metern und hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.smoke_grenade_thermal.variant.mini.desc=Ähnlich wie eine Gasgranate gibt eine Rauchgranate eine Wolke ab, die jedoch aus Rauch besteht statt aus giftigem Gas. Die Wolke schränkt die Sicht ein und verursacht den Status Geblendet I bei jedem, der etwas durch die Wolke hindurch tun will (etwa feuern), und Geblendet II bei jedem, der sich innerhalb der Wolke befindet. IR-Rauchgranaten schränken normale Sicht (inklusive Restlichtverstärkung) und Infrarotsicht ein. Die Wolke hat einen Anfangsradius von 5 Metern und hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.

item.flash_pak.desc=Ein Flash-Pack ist ein kleines elektronisches Gerät, etwa 10 mal 10 mal 2 Zentimeter groß, das an allen Seiten Mikro-Blitzlichter aufweist, die in einer zufälligen, stroboskopartigen Sequenz aufblitzen, um Gegner zu verwirren. Jeder innerhalb der Reichweite eines Flash-Packs, der normale Sicht verwendet, gelangt in den unter der jeweiligen Reichweite in der Tabelle Granaten angegebenen Status Geblendet (S. 54) und erleidet die entsprechenden Modifikatoren bei allen Proben, die Sehen erfordern. Die Verwendung von Restlichtverstärkung verstärkt den Status um eine Stufe, Blitzkompensation schwächt ihn um eine Stufe ab. Das Flash-Pack hat 10 Ladungen und verbraucht eine Ladung pro Kampfrunde. Am Stromnetz lädt es sich mit einer Geschwindigkeit von 1 Ladung pro 10 Sekunden wieder auf.

