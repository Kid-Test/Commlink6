item.smuggling_compartment.wifi=Einen Gegenstand hineinzulegen oder herauszunehmen, erfordert nur eine Nebenhandlung.
item.smuggling_compartment.variant.cyberlimb=implantiert
item.wired_reflexes=Reflexbooster
item.wired_reflexes.page=289
item.wired_reflexes.wifi=Das System ist kompatibel mit kabelloser Reaktionsverbesserung (in diesem Fall ist auch eine Erhöhung der Reaktion um mehr als +4 möglich). Das Aktivieren oder Deaktivieren erfordert nur eine Nebenhandlung.

item.cybereye.desc=Das Cyberaugen-Basissystem bietet normale Sehstärke für beide Augen, eine Bildverbindung und eine eingebaute Kamera sowie je nach Stufe eine unterschiedlich hohe Kapazität für Sichtverstärkungen.
item.ocular_drone.desc=Dieses Zubehör wird pro Kauf nur in einen Augapfel eingebaut. Dabei wird eine kleine Drohne (regeltechnisch wie eine Horizon Flying Eye, S. 302) in der Augenhöhle platziert. Die Drohne funktioniert wie ein normales Cyberauge (mit allen relevanten Verstärkungen), bis man sie herausnimmt - dann kann man sie steuern, als wäre sie eine Drohne. Während sie auf diese Weise benutzt wird (und man dann nur ein Auge hat), erleidet man die Auswirkungen des Status Geblendet I bei allem, was man tut. Wenn man beide Augen durch Drohnen ersetzt, erleidet man den Status Geblendet III, solange beide Drohnen außerhalb des Körpers operieren. Eine Augendrohne ist ganz klar als künstliches Auge zu erkennen.
item.retinal_duplication.desc=In diese höchst illegale Modifikation kann die Aufnahme der Retina einer anderen Person geladen werden, um ein fast perfektes Duplikat zu erzeugen. Hierfür ist eine Vergleichende Probe zwischen der Stufe des Retinaduplikats und der Stufe des Retinascanners (s. Sensoren und Scanner, S. 276) erforderlich. Retinamuster auszutauschen dauert 1 Minute.
item.cyberears.desc=Üblicherweise ersetzen Cyberohren nur das Innenohr, aber auf Wunsch kann auch der gesamte Ohrkomplex samt Ohrmuschel ersetzt werden. Cyberohren ermöglichen das Hören innerhalb normaler Reichweiten (ähnlich wie ein omnidirektionales Mikrofon) und enthalten eine Audioverbindung sowie eine je nach Stufe unterschiedliche Kapazität für Modifikationen und Verstärkungen. Alle Cyberohren gewähren 1 Bonus-Edge gegen Zielpersonen, deren Hören durch irgendetwas gestört wird, aber das Edge verfällt, wenn es nicht sofort benutzt wird.
item.balance_augmenter.desc=Der Balanceverstärker verstärkt den natürlichen Gleichgewichtssinn des Innenohrs. Der Charakter erhält einen Würfelpoolbonus von +1 für alle Proben, bei denen es um das Gleichgewicht geht, wie etwa Klettern, das Gehen über einen schmalen Steg, das Landen nach einem Sprung usw.
item.damper.desc=Dieses Implantat schützt den Nutzer sowohl vor plötzlichen Lautstärkeanstiegen als auch vor schädigenden Geräuschpegeln. Wenn der Charakter den Status Ertaubt erleidet, senkt der Dämpfer diesen um 1 Stufe.
item.soundlink.desc=Die Audioverbindung, das Audioäquivalent zur Bildverbindung, kann Audiodaten (Aufnahmen, Soundtracks, Musik usw.) aus Quellen innerhalb des PANs des Benutzers (oder aus einer Datenbuchse) direkt in seine Cyberohren abspielen. Eine Audioverbindung ist eine häufige Komponente von AR-Umgebungen und fügt eine Audiokomponente hinzu.
item.bone_lacing.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit erhöht. Kompositknochen gibt es in drei Varianten: Kunststoff, Aluminium und Titan. Nur eine der drei Varianten kann gleichzeitig implantiert sein. Kompositknochen verleihen zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden, erhöhen den Verteidigungswert und ändern den Schadenswert und Angriffswert für Waffenlosen Kampf - wie in der Tabelle Kompositknochen angegeben. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.bone_lacing.variant.plastic.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit erhöht. Kompositknochen verleihen zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden, erhöhen den Verteidigungswert und ändern den Schadenswert und Angriffswert für Waffenlosen Kampf - wie in der Tabelle Kompositknochen angegeben. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.bone_lacing.variant.aluminium.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit erhöht. Kompositknochen verleihen zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden, erhöhen den Verteidigungswert und ändern den Schadenswert und Angriffswert für Waffenlosen Kampf - wie in der Tabelle Kompositknochen angegeben. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.bone_lacing.variant.titanium.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit erhöht. Kompositknochen verleihen zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden, erhöhen den Verteidigungswert und ändern den Schadenswert und Angriffswert für Waffenlosen Kampf - wie in der Tabelle Kompositknochen angegeben. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.dermal_plating.desc=Hartkunststoff- und Keramikfaserplatten werden in die Haut implantiert. Die Platten sind deutlich sichtbar und noch deutlicher fühlbar, aber sie können im Hinblick auf Farbe und Oberflächenstruktur kosmetisch angepasst werden. Dermalpanzerung gewährt einen Bonus auf den Verteidigungswert in Höhe ihrer Stufe. Dermalpanzerung ist nicht mit anderer Bodytech für die Haut kompatibel, die einen Verteidigungswertbonus gewährt, wie etwa Orthoskin. Durch den Einbau von Dermalpanzerung verlieren Trolle ihre natürlichen Knochenablagerungen in der Haut und damit auch ihren Vorteil Dermalablagerungen.
item.dermal_plating_armor.desc=Hartkunststoff- und Keramikfaserplatten werden in die Haut implantiert. Die Platten sind deutlich sichtbar und noch deutlicher fühlbar, aber sie können im Hinblick auf Farbe und Oberflächenstruktur kosmetisch angepasst werden. Dermalpanzerung gewährt einen Bonus auf den Verteidigungswert in Höhe ihrer Stufe. Dermalpanzerung ist nicht mit anderer Bodytech für die Haut kompatibel, die einen Verteidigungswertbonus gewährt, wie etwa Orthoskin. Durch den Einbau von Dermalpanzerung verlieren Trolle ihre natürlichen Knochenablagerungen in der Haut und damit auch ihren Vorteil Dermalablagerungen.
item.fingertip_compartment.desc=Dieser Behälter ist im ausgehöhlten letzten Glied eines Fingers versteckt. Er hat eine Arretierung, bei der entweder nur der Fingernagel angehoben werden kann, um auf den Behälter zuzugreifen, oder die ganze Fingerspitze entfernt werden kann. Ein Fingerkuppenbehälter kann mikrogroße Gegenstände aufnehmen wie etwa eine Mikrodrohne, einen RFID- oder einen Datenchip. Einen Gegenstand darin zu verstauen oder herauszunehmen, erfordert eine Haupthandlung. Gegenstände, die im Fingerkuppenbehälter verwahrt werden, sind vollständig verborgen, und der Behälter selbst hat eine Tarnbarkeit von 8. Ein beliebter Trick ist es, im Fingerkuppenbehälter eine Monofilamentpeitsche (S. 249) aufzubewahren, wobei die Fingerspitze als beschwerte Schnurspitze dient. Das Ausfahren einer Monofilamentpeitsche aus einem Fingerkuppenbehälter erfordert eine Nebenhandlung, das Einfahren und Aufwickeln eine Haupthandlung.
item.internal_air_tank.desc=Der interne Lufttank ersetzt einen Teil eines Lungenflügels durch eine interne Druckluftreserve, mit der man den Atem für [Stufe] Stunden anhalten kann. Dies erlaubt ausgedehnte Unterwasseroperationen und gewährt einen kompletten Schutz vor Toxinangriffen mit Inhalationsvektor, solange man den Atem anhält. Das Aktivieren oder Deaktivieren des Tanks erfordert eine Nebenhandlung. Das Auffüllen des Lufttanks durch ein Ventil (das sich unter dem Brustkorb befindet) dauert fünf Minuten, aber man kann ihn auch durch sechs Stunden normales Atmen wiederauffüllen.
item.muscle_replacement.desc=Laborgezüchtete synthetische Muskeln ersetzen oder verstärken die eigenen, und Calciumbehandlungen und Skelettverstärkungen tragen zur Gesamtstärke bei. Kunstmuskeln erhöhen sowohl die Stärke als auch die Geschicklichkeit um ihre Stufe. Sie sind nicht kompatibel mit anderer Bodytech für die Muskeln wie etwa der Bioware Muskelverstärkung oder Muskelstraffung.
item.reaction_enhancers.desc=Diese Bodyware beschleunigt die Reaktion, indem bestimmte, isolierte Wirbel in der Wirbelsäule durch supraleitendes Material ersetzt werden. Die Reaktionsverbesserung erhöht das Reaktionsattribut um ihre Stufe (der Initiativewert ändert sich entsprechend). Reaktionsverbesserung ist nicht kompatibel mit anderer Bodytech, die die Reaktion verbessert, wie zum Beispiel einem Reflexbooster.
item.skillwires.desc=Talentleitungen sind ein System von neuromuskulären Steuereinheiten, die das natürliche Nervensystem des Körpers überbrücken. Sie können mithilfe des "Muskelgedächtnisses", das durch eine Talentbuchse (S. 285) eingespielt wird, Muskelbewegungen unterstützen oder vollständig überbrücken. Dieses System erlaubt die Verwendung von Aktionssofts mit einer Stufe, die maximal so hoch sein darf wie die Stufe der Talentleitungen. Die Aktionssoft muss dafür auf einer ebenfalls implantierten Talentbuchse laufen.
item.smuggling_compartment.desc=Für Gegenstände, die nicht in eine Fingerspitze passen, aber trotzdem nicht gefunden werden sollen, kann man Schmuggelbehälter an Stellen im Körper implantieren, die leicht ausgehöhlt oder ersetzt werden können. Dazu gehören die Rippen und der Platz zwischen ihnen, Hüftknochen, Schulterblätter usw. Diese Behälter können kleine und Miniaturgegenstände aufnehmen (normalerweise nichts, was größer ist als eine leichte Pistole; der Spielleiter wird schon Bescheid sagen, wenn etwas zu groß ist). Der Behälter hat eine Tarnbarkeit von 8. Einen Gegenstand hineinzulegen oder herauszunehmen, erfordert eine Haupthandlung.
item.smuggling_compartment.variant.cyberlimb.desc=Funktioniert genauso wie der Schmuggelbehälter (S. 285).
item.wired_reflexes.desc=Diese hochinvasive, schmerzhafte und lebensverändernde Operation implantiert eine Vielzahl von Neuralboostern und Adrenalinstimulatoren an strategischen Stellen im ganzen Körper, um den Benutzer in eine neue Welt zu katapultieren, in der sich alles um ihn herum in Zeitlupe zu bewegen scheint. Das System umfasst sowohl manuelle als auch WiFi-Trigger, um die Reflexbooster ein- und auszuschalten. Den Trigger zu aktivieren oder zu deaktivieren, erfordert eine Haupthandlung. Wenn der Reflexbooster aktiv ist, gewährt er pro Stufe +1 Reaktion (mit einer entsprechenden Erhöhung des Initiativewerts) und 1 zusätzlichen Initiativewürfel (mit der entsprechenden zusätzlichen Nebenhandlung). Reflexbooster können nicht mit irgendeiner anderen Form von Reaktionsoder Initiativeverbesserung kombiniert werden.

item.cyberskull=Cyberschädel
item.cyberskull.page=290
item.cyberskull.desc=Der Cyberschädel ersetzt die Knochen und Muskeln des Kopfes, Gesichts und Halses. Einen Cyberschädel zu haben bedeutet auch, dass man über Cyberkiefer (S. 291) verfügt, die wirklich kraftvoll zubeißen können.
item.cyberskull.variant.synthetic=Synthetisch
item.cyberskull.variant.obvious=Offensichtlich
item.cyberskull.variant.synthetic.desc=Der Cyberschädel ersetzt die Knochen und Muskeln des Kopfes, Gesichts und Halses. Einen Cyberschädel zu haben bedeutet auch, dass man über Cyberkiefer (S. 291) verfügt, die wirklich kraftvoll zubeißen können.
item.cyberskull.variant.obvious.desc=Der Cyberschädel ersetzt die Knochen und Muskeln des Kopfes, Gesichts und Halses. Einen Cyberschädel zu haben bedeutet auch, dass man über Cyberkiefer (S. 291) verfügt, die wirklich kraftvoll zubeißen können.
item.cybertorso=Cybertorso
item.cybertorso.page=290
item.cybertorso.desc=Der Cybertorso ersetzt die Knochen und Muskeln des Körperkerns unterhalb des Halses bis zu den Genitalien. Offensichtliche Cybertorsos entfernen die Genitalien und deren Funktion (bis auf die Ausscheidung). Die inneren Organe werden nicht ersetzt, aber sie sind alle durch abgetrennte Fächer geschützt. Synthetisches Cybertorsodesign gibt sich alle Mühe, so natürlich wie nur möglich auszusehen. Manche Kunden entscheiden sich gegen den geformten Look und wählen eine schlankere, straffere Erscheinung, während andere einen "durchschnittlichen" Körpertypus vorziehen, um weniger aufzufallen.
item.cybertorso.variant.synthetic=Synthetisch
item.cybertorso.variant.obvious=Offensichtlich
item.cybertorso.variant.synthetic.desc=Der Cybertorso ersetzt die Knochen und Muskeln des Körperkerns unterhalb des Halses bis zu den Genitalien. Die inneren Organe werden nicht ersetzt, aber sie sind alle durch abgetrennte Fächer geschützt. Synthetisches Cybertorsodesign gibt sich alle Mühe, so natürlich wie nur möglich auszusehen. Manche Kunden entscheiden sich gegen den geformten Look und wählen eine schlankere, straffere Erscheinung, während andere einen "durchschnittlichen" Körpertypus vorziehen, um weniger aufzufallen.
item.cybertorso.variant.obvious.desc=Der Cybertorso ersetzt die Knochen und Muskeln des Körperkerns unterhalb des Halses bis zu den Genitalien. Offensichtliche Cybertorsos entfernen die Genitalien und deren Funktion (bis auf die Ausscheidung). Die inneren Organe werden nicht ersetzt, aber sie sind alle durch abgetrennte Fächer geschützt. Manche Kunden entscheiden sich gegen den geformten Look und wählen eine schlankere, straffere Erscheinung, während andere einen "durchschnittlichen" Körpertypus vorziehen, um weniger aufzufallen.
