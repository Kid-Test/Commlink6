item.control_rig.variant.quality_pilot_origin=Pilotenerbe
item.control_rig.variant.quality_pilot_origin.desc=Eine KI mit diesem Vorteil ist wahrscheinlich aus einem Drohnenpilotprogramm hervorgegangen und hat ihre Fähigkeiten behalten. Die KI kann in Drohnen und Fahrzeuge springen und sie wie ein Rigger steuern. Jede Stufe dieses Vorteils gewährt den Bonus einer Riggerkontrolle gleicher Stufe. Die KI ist außerdem in der Lage, eine Anzahl von Drohnen-Autosofts gleich ihrer Datenverarbeitung zu laden, zu konvertieren und zu nutzen (KI-gesteuerte Drohnen nutzen die Attribute, Fertigkeiten und Matrix-Initiative der KI). Nebenbei bemerkt handelt es sich hierbei um eine reine Berechnungs- und Datenverarbeitungsfunktion; sie umfasst nicht die Simsinn-Verarbeitungsfähigkeit des Codemods Riggerkontrollen-Integration. Die beiden Methoden sind inkompatibel und lassen sich weder miteinander noch mit Resonanzechos kombinieren.
item.control_rig.variant.control_rig_codemod=Riggerkontrollen-Integration
item.control_rig.variant.control_rig_codemod.desc=Dieser ziemlich invasive Codemod ermöglicht es einer KI, den Echtzeit-Vollspektrum-Simsinn-Input eines Riggerinterfaces zu verarbeiten und die Teile des metamenschlichen Gehirns zu emulieren, die für den sensorischen Input des Körpers, die motorische Kontrolle und die räumliche Navigation in der realen Welt zuständig sind. Dieser Satz von Inputfiltern und Emulatoren ermöglicht das gleiche Maß an Fahrzeug- und Drohnenkontrolle, das normalerweise als Riggen bezeichnet wird. Wenn eine KI die Riggerkontrollen-Integration nutzt, um in eine Drohne oder ein Fahrzeug hineinzuspringen, gewährt dieser Codemod einen Würfelpoolbonus und eine Senkung des Schwellenwerts in Höhe seiner Stufe auf alle Proben zum Betrieb eines Fahrzeugs sowie 1 Edge je Probe. Dieser Codemod ist nicht mit Echos oder dem Vorteil Pilotenerbe kompatibel. Eine Riggerkontrollen-Integration ermöglicht es einer KI, die Sinneseindrücke einer Standard-Simsinn-Unterhaltungsaufzeichnung oder sogar eines BTLs in vollem Umfang zu erleben  eine Erfahrung, die die meisten KIs als gleichermaßen berauschend und erschreckend empfinden.
