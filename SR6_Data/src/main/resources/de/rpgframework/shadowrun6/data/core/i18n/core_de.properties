#Complex Forms
complexform.cleaner=Reiniger
complexform.cleaner.page=189
complexform.cleaner.desc=Lege eine Probe auf Elektronik + Resonanz ab. Jeder Erfolg senkt deinen Overwatch-Wert um 1.
complexform.diffusion=(Matrixattribut)-Senkung
complexform.diffusion.page=189
complexform.diffusion.desc=Lege eine Vergleichende Probe auf Elektronik + Resonanz gegen Willenskraft + Firewall des Ziels ab. Jeder Nettoerfolg senkt das betroffene Matrixattribut um 1, bis zum Minimum von 1. Diese Komplexe Form kann mehrmals erworben werden und gilt jeweils für ein anderes Matrixattribut.
complexform.editor=Editor
complexform.editor.page=189
complexform.editor.desc=Du kannst die Handlung Datei editieren durchführen, ohne die passende Zugangsstufe für die betroffene Datei zu haben. Du musst die Datei allerdings entdecken können.
complexform.emulate=(Programm) Emulieren
complexform.emulate.page=189
complexform.emulate.desc=Diese Komplexe Form kann mehrfach erworben werden; sie gilt dann jeweils als ein anderes Programm (siehe S. 184). Sie kann auch für Autosofts erworben werden, deren Stufe dann gleich dem gegenwärtigen Wert des Technomancers in Datenverarbeitung ist (maximal aber Stufe 6). Die Verwendung dieser Komplexen Form erfordert nur eine Nebenhandlung.
complexform.infusion=(Matrixattribut)-Steigerung
complexform.infusion.page=189
complexform.infusion.desc=Lege eine Probe auf Elektronik + Resonanz (4) ab. Jeder Nettoerfolg erhöht das betroffene Attribut um 1, bis maximal zum Doppelten des Ausgangswerts (maximal aber um +4). Diese Komplexe Form kann mehrmals erworben werden und gilt jeweils für ein anderes Matrixattribut.
complexform.mirrored_persona=Spiegelpersona
complexform.mirrored_persona.page=191
complexform.mirrored_persona.desc=Du erschaffst eine Pseudo-Persona, die in der Matrix so aussieht und sich genauso verhält wie du. Lege eine Probe auf Elektronik + Resonanz ab; die Werte der Matrixattribute der zusätzlichen Persona, die du erschaffst, entsprechen der Anzahl der Erfolge bei dieser Probe. Die Anzahl der Erfolge dient außerdem als Schwellenwert für Matrixwahrnehmungsproben von anderen, um dich von deiner Spiegelpersona unterscheiden zu können.<br/>Wenn dem Gegner die Probe misslingt, wählt er als Ziel seiner Matrixhandlungen die Spiegelpersona, woraufhin die Komplexe Form endet.
complexform.pulse_storm=Signalsturm
complexform.pulse_storm.page=190
complexform.pulse_storm.desc=Lege eine Vergleichende Probe auf Elektronik + Resonanz gegen Logik + Datenverarbeitung des Ziels ab. Jeder Nettoerfolg erhöht den Rauschenwert für das Ziel um 1.
complexform.puppeteer=Puppenspieler
complexform.puppeteer.page=189
complexform.puppeteer.desc=Du kannst die Handlung Gerät steuern benutzen, ohne die passende Zugangsstufe für das betroffene Gerät zu haben. Du musst das Gerät allerdings entdecken können.
complexform.resonance_channel=Resonanzkanal
complexform.resonance_channel.page=190
complexform.resonance_channel.desc=Lege eine Probe auf Elektronik + Resonanz ab. Jeder Erfolg senkt den Rauschenwert für dich um 1.
complexform.resonance_spike=Resonanzspike
complexform.resonance_spike.page=190
complexform.resonance_spike.desc=Lege eine Probe auf Cracken + Resonanz gegen Willenskraft + Firewall des Ziels ab; jeder Nettoerfolg verursacht beim Ziel 1 Kästchen Matrixschaden, dem nicht widerstanden werden kann.
complexform.resonance_veil=Resonanzillusion
complexform.resonance_veil.page=190
complexform.resonance_veil.desc=Du erschaffst eine Illusion von Matrixaktivität, die optisch, akustisch und allgemein sensorisch wie ein echter Matrix vorgang erscheint. Lege eine Vergleichende Probe auf Elektronik + Resonanz gegen Intuition + Datenverarbeitung des Ziels ab. Selbst wenn das Ziel gute Gründe hat, das, was es sieht, nicht für real zu halten, muss ihm eine Probe auf Matrixwahrnehmung mit einem Schwellenwert gleich der Anzahl deiner Nettoerfolge gelingen, um die Illusion zu durchschauen.
complexform.static_bomb=Resonanznebel
complexform.static_bomb.page=190
complexform.static_bomb.desc=Lege eine einzelne Vergleichende Probe auf Elektronik + Resonanz gegen Intuition + Datenverarbeitung gegen alle Ziele ab, die dich entdecken können. Ein Ziel, das keine Nettoerfolge erzielt, nimmt dich nicht mehr wahr und muss eine Matrixwahrnehmungsprobe ablegen, um dich wieder zu lokalisieren, bevor es irgendwelche Handlungen gegen dich unternehmen kann.
complexform.static_veil=Signalschleier
complexform.static_veil.page=190
complexform.static_veil.desc=Lege eine Vergleichende Probe auf Elektronik + Resonanz gegen Willenskraft + Firewall oder Firewall × 2 des Hosts ab. Solange diese Komplexe Form aufrechterhalten wird, erhöht sich der Overwatch-Wert des Ziels nicht durch illegalen Zugang zu einem Host. Der OW steigt aber weiterhin durch illegale Handlungen.
complexform.stitches=Zusammenflicken
complexform.stitches.page=191
complexform.stitches.desc=Lege eine Probe auf Elektronik + Resonanz ab. Jeder Erfolg repariert 1 Kästchen Matrixschaden. Diese Komplexe Form wirkt nur gegen Objekte, die sich ausschließlich in der Matrix aufhalten, nicht gegen Hardware.
complexform.tattletale=Petze
complexform.tattletale.page=189
complexform.tattletale.desc=Lege eine Probe auf Elektronik + Resonanz ab. Jeder Erfolg erhöht den Overwatch-Wert des Ziels um 1.

#Critter Powers - Sprites
critterpower.camouflage=Tarnung
critterpower.camouflage.page=194
critterpower.camouflage.desc=Das Sprite kann eine Datei in einer anderen Datei verbergen, sodass sie für Matrixsuchen unsichtbar wird. Getarnte Dateien können nur mit einer Matrixwahrnehmungsprobe gefunden werden, die speziell nach dieser Datei sucht. Selbst das Sprite muss diese Probe ablegen, um die Datei wiederzufinden und zu extrahieren.
critterpower.cookie=Cookie
critterpower.cookie.page=193
critterpower.cookie.desc=Ein Sprite kann diese Kraft benutzen, um eine Persona mit einem Cookie zu "markieren" und deren Aktivität in der Matrix zu verfolgen. Dazu muss ihm eine Vergleichende Probe auf Cracken + Resonanz gegen Intuition + Firewall des Ziels gelingen. Gelingt die Probe, wird das Ziel mit dem Cookie belegt, ohne es zu bemerken. Das Cookie läuft auf Schleichfahrt und ist mit der Stufe des Sprites verschlüsselt. Es zeichnet alles auf, was das Icon tut: zum Beispiel jeden Host, den es betritt, mit wem es wann kommuniziert (aber nicht den Inhalt), Programme, die das Icon benutzt, und so weiter. Verwende die Nettoerfolge als Messgröße der Informationstiefe (1 Nettoerfolg liefert grobe Umrisse, 4 oder mehr liefern einen detaillierten Bericht). Am Ende der Laufzeit, die von Sprite oder Besitzer beim Einsatz der Kraft bestimmt wird, transferiert sich das Cookie mit den gesammelten Daten zum Sprite. Sobald das Sprite es hat, kann es das Cookie an den Technomancer übermitteln. Wenn das Sprite zum Zeitpunkt des Transfers nicht in der Matrix ist, löscht sich das Cookie. Man kann Cookies mit einer erfolgreichen Matrixwahrnehmungsprobe auf der Zielpersona entdecken. Sobald es identifiziert wurde, kann es nach dem Entfernen seiner Verschlüsselung (s. Datei cracken, S. 180) gelöscht werden.
critterpower.diagnostics=Diagnose
critterpower.diagnostics.page=194
critterpower.diagnostics.desc=Mit dieser Kraft kann ein Sprite das Innenleben eines elektronischen Geräts analysieren. Das Sprite kann jemanden bei Benutzung oder Reparatur des Geräts unterstützen. Dazu legt es eine Probe auf Elektronik + Resonanz ab. Gelingt die Probe, erhält der Charakter pro Erfolg einen Würfelpoolbonus von +1 bei der Benutzung (nur mit den Fertigkeiten Elektronik, Mechanik und Steuern) oder der Reparatur des Geräts. Der Einsatz dieser Kraft erfordert die ganze Konzentration des Sprites. Die Wirkung bleibt bestehen, bis es die Kraft beendet oder etwas anderes tut.
critterpower.electron_storm=Elektronensturm
critterpower.electron_storm.page=194
critterpower.electron_storm.desc=Dieser Angriff hüllt die Zielpersona in einen Strom von korrumpierenden Daten. Wenn dem Sprite eine Vergleichende Probe auf Cracken + Resonanz gegen Intuition + Firewall des Ziels gelingt, wird das Ziel von einer Flut digitaler Impulse überschwemmt. Mit dem ersten erfolgreichen Angriff und bei jeder folgenden Handlung, die das Sprite durchführt, solange es die Kraft aufrechterhält, verursacht es [Resonanz] Kästchen Matrixschaden, dem normal widerstanden wird. Der Elektronensturm erhöht auch den Rauschenwert für das Ziel um 2. Wenn das Sprite Matrixschaden erleidet, enden all seine Elektronenstürme sofort.
critterpower.hash=Hash
critterpower.hash.page=194
critterpower.hash.desc=Mit dieser Kraft kann das Sprite eine Datei temporär mit einzigartigen Resonanz-Algorithmen schützen, sodass nur das Sprite selbst den Schutz entfernen kann. Wenn das Sprite die Datei nicht mehr bei sich trägt, kehrt sie in ihren Normalzustand zurück. Wenn das Sprite zerstört wird, während es die Datei trägt, wird diese korrumpiert und wertlos. Die Maximalzeit, für die das Sprite diese Kraft einsetzen kann, beträgt [Spritestufe × 10] Kampfrunden.
critterpower.override=Übernehmen
critterpower.override.page=194
critterpower.override.desc=Mit dieser Kraft kann das Sprite die Kontrolle über ein Gerät übernehmen, das per Autopilot gesteuert wird. Das Sprite legt eine Vergleichende Probe auf Elektronik + Resonanz gegen Gerätestufe + Firewall des Geräts ab. Gelingt die Probe, erhält das Sprite die vollständige Kontrolle über das Gerät und kann seine Spritestufe statt der Pilotstufe des Geräts benutzen.
critterpower.phantom=Spuk
critterpower.phantom.page=194
critterpower.phantom.desc=Das Sprite kann eine Persona oder ein Gerät verbergen, sodass sie oder es für Matrixsuchen unsichtbar wird. Verborgene Personas oder Geräte können nur mit einer Matrixwahrnehmungsprobe gefunden werden, die speziell nach dem versteckten Icon sucht. Selbst dann kann das Sprite noch eine Probe auf Elektronik + Resonanz ablegen, deren Erfolge zum Schwellenwert dieser Matrixwahrnehmungsprobe werden.
critterpower.stability=Stabilität
critterpower.stability.page=194
critterpower.stability.desc=Ein Sprite kann diese Kraft auf eine Persona oder ein Gerät anwenden, bei der oder dem es User- oder Admin-Zugang hat. Stabilität verhindert normale Fehlfunktionen oder Unfälle beim Ziel (sowohl gewöhnliche Patzer als auch Patzer durch die den Nachteil Gremlins oder die Kraft Unfall). Normale Patzer werden ignoriert, Kritische Patzer werden zu normalen Patzern.
critterpower.suppression=Unterdrücken
critterpower.suppression.page=194
critterpower.suppression.desc=Sprites sind im besten Fall verwirrend, aber ein Sprite, das diese Kraft nutzt, ist - vor allem für Hosts - vollkommen bizarr. Wenn ein Sprite in einem Host ist und diese Kraft einsetzt, wenn der Host IC startet, wird das Starten des IC um [Spritestufe ÷ 2] Kampfrunden verzögert. Verzögertes IC kann nicht handeln und nicht Ziel von Handlungen sein.
critterpower.trap=Falle
critterpower.trap.page=194
critterpower.trap.desc=Mit diesem Angriff kann ein Sprite ein Ziel ausschalten und daran hindern, Handlungen durchzuführen. Das Sprite legt eine Probe auf Cracken + Resonanz gegen Willenskraft + Firewall des Ziels ab. Gelingt die Probe, kann das Ziel keine Handlung durchführen, solange die Kraft aufrechterhalten wird. Der Einsatz dieser Kraft braucht die ganze Konzentration des Sprites. Sobald das Sprite etwas anderes tut, kann das Ziel handeln.
critterpower.watermark=Wasserzeichen
critterpower.watermark.page=194
critterpower.watermark.desc=Das Sprite kann ein Icon mit einer unsichtbaren Markierung ähnlich einer Matrixsignatur kennzeichnen, die nur Resonanzwesen sehen können. Dadurch kann es geheime Botschaften auf Matrixobjekten hinterlassen. Ein Sprite kann ein bestehendes Wasserzeichen mit einem neuen überschreiben. Ein Wasserzeichen kann mit der Handlung Matrixsignatur löschen gelöscht werden. Sonst bleibt es bestehen, solange das Icon bestehen bleibt.

#Critter Powers
critterpower.accident=Unfall
critterpower.accident.page=227
critterpower.accident.desc=Critter mit dieser Kraft können scheinbar normale Unfälle verursachen. Die genaue Art des Unfalls bleibt der Spielleiterin überlassen und hängt davon ab, was das Opfer gerade tut und was um es herum vorgeht. Diese Kraft ist von Haus aus nicht unbedingt gefährlich, kann aber je nach Umständen und Umgebung gefährliche Folgen haben. Wenn einem beispielsweise vor einem heranrasenden Sattelzug ein Reifen platzt und der eigene Wagen ins Schleudern gerät, könnte sich das durchaus gesundheitsschädlich auswirken. Wenn ein Critter diese Kraft auf jemanden anwendet, wird eine Vergleichende Probe auf Willenskraft + Magie des Critters gegen Reaktion + Charisma des Opfers abgelegt. Gewinnt der Critter, wird die Situation so behandelt, als hätte der Charakter bei einer Probe einen Patzer gewürfelt - die Spielleiterin kann dabei gerne auf die Tabelle Ideen für Patzer (S. 233) zurückgreifen. Gelingen dem Critter gar 4 oder mehr Nettoerfolge, so entspricht der Unfall einem Kritischen Patzer - er ist nicht nur ein peinlicher Ausrutscher, sondern eine potenzielle Katastrophe.
critterpower.animal_control=Tierbeherrschung
critterpower.animal_control.page=226
critterpower.animal_control.desc=Einige Critter können andere Critter manipulieren, vor allem (aber nicht nur) mundane. Das Verhalten muss für das beherrschte Tier natürlich sein. Ein Schwarm Vögel beispielsweise kann kein Motorrad stehlen, aber die Tiere könnte ihre Därme darüber entleeren, es verfolgen oder in Massen darauf landen. Neue Befehle können nur erteilt werden, solange sich der Zielcritter innerhalb des Blickfeldes des beherrschenden Critters befindet, aber bereits erteilten Befehlen folgt der Zielcritter für eine Anzahl Minuten, die dem Charismaattribut des beherrschenden Critters entspricht. Ein Critter kann so viele kleine Tiere (Katzen, Ratten usw.) beherrschen, wie seinem Charisma × 5 entspricht, oder so viele größere Tiere (Wölfe, Löwen, Bären usw.), wie seinem Charisma entspricht, oder einen einzigen paranormalen Critter. Diese Kraft kann nicht gegen Critter mit der Kraft Bewusstsein eingesetzt werden.
critterpower.armor=Panzer
critterpower.armor.page=226
critterpower.armor.desc=Schuppen, dermale Knochenablagerungen, eine dicke Haut oder eine kräftige Schicht Fell und Fett bieten einem Critter mit dieser Kraft einen gewissen Schutz gegen physische Angriffe. Der natürliche Panzer des Critters erhöht seinen Verteidigungswert und ist kumulativ zur Schutzwirkung getragener Panzerung.
critterpower.astral_form=Astrale Gestalt
critterpower.astral_form.page=221
critterpower.astral_form.desc=Ein Critter mit dieser Kraft existiert nur auf der Astralebene. Nur astrale Angriffe und Manazauber oder -kräfte können ihn verletzen; physische Angriffe haben keine Wirkung. Umgekehrt kann ein astraler Critter auch nur auf Dualwesen oder Wesen einwirken, die sich (durch astrale Projektion oder astrale Wahrnehmung) auf der Astralebene befinden. Critter mit dieser Kraft können sich auf der physischen Ebene auf die gleiche Weise manifestieren wie astral projizierende Zauberer (S. 162).
critterpower.binding=Bindung
critterpower.binding.page=222
critterpower.binding.desc=Mittels einer Art Spinnennetz, einer klebrigen Substanz, einer klebrigen Zunge oder irgendeiner Art magischer Wirkung kann ein Critter mit dieser Kraft sein Opfer dazu bringen, an einer Oberfläche, die es gerade berührt, kleben zu bleiben (das kann auch der Critter selbst sein).<br/>\
Die Reichweite dieser Kraft hängt davon ab, wie der Critter sein Opfer bindet; er kann etwas abschießen (Reichweite: BF), einen klebrigen Körper haben (Reichweite: B) oder einfach selbst gut an anderen Dingen kleben (Reichweite: Selbst).<br/>\
Bei der Reichweite BF legt der Critter eine Angriffsprobe auf Geschicklichkeit + Magie gegen Athletik + Reaktion ab. Ein Erfolg reicht aus, um das Opfer in den Status Bewegungsunfähig zu versetzen. Das Opfer muss, sobald es wieder an der Reihe ist, eine Haupthandlung aufwenden, um einen Befreiungsversuch zu starten.<br/>\
Bei der Reichweite Berührung legt der Critter eine Angriffsprobe auf Geschicklichkeit + Magie gegen Nahkampf + Reaktion seines Opfers ab. Wieder reicht ein Erfolg, um das Opfer in den Status Bewegungsunfähig zu versetzen, allerdings mit einer kleinen Änderung. In diesem Fall klebt das Opfer am Critter und kann sich nicht entfernen, ohne sich zunächst zu befreien, aber der Critter kann sich zusammen mit seinem Opfer bewegen, sofern seine Stärke mindestens die Hälfte der Konstitution des Opfers beträgt. Ein Befreiungsversuch erfolgt wie gehabt mittels einer Haupthandlung.<br/>\
Bei der Reichweite Selbst erfolgt keine Probe, und der Critter kann sich an senkrechten Flächen oder kopfüber mit seiner normalen Bewegungsrate bewegen. Um sich zu befreien, ist eine Haupthandlung erforderlich. Das Opfer legt eine Probe auf Konstitution + Stärke gegen Willenskraft + Magie des Critters ab. Ist das Opfer erfolgreich, kann es sich befreien. Scheitert es, bleibt es bis zu seinem nächsten Befreiungsversuch im Status Bewegungsunfähig.
critterpower.compulsion=Zwang
critterpower.compulsion.page=228
critterpower.compulsion.desc=Diese Kraft ermöglicht einem Critter, ein Opfer zu einer bestimmten Handlung zu zwingen, auch wenn diese Handlung nicht zum Vorteil des Opfers, ja sogar schädlich für das Opfer oder andere ist. Der Critter legt eine Vergleichende Probe auf Charisma + Magie gegen Willenskraft + Logik des Opfers ab. Verliert das Opfer, muss es den Zwang in seiner nächsten verfügbaren Handlung ausführen, bevor es irgendetwas anderes tut. Der Critter muss die Kraft aufrechterhalten, bis die Handlung ausgeführt ist, kann sie aber auch jederzeit fallen lassen, wodurch das Opfer aus dem Zwang entlassen wird. Sobald diese Kraft angewendet wurde, ist dem Opfer unmittelbar bewusst, dass es einem Zwang unterlag. Die Kraft kann nicht dazu verwendet werden, dem Opfer zukünftige erzwungene Handlungen einzupflanzen. Sobald die Kraftwirkung endet oder die erzwungene Handlung ausgeführt wurde, gehört der Verstand des Opfers wieder ihm selbst - zusammen mit dem Entsetzen über das, was es gerade getan hat.
critterpower.concealment=Verschleierung
critterpower.concealment.page=227
critterpower.concealment.desc=Ein Critter mit dieser Kraft kann sich selbst, andere oder Dinge, die von anderen gesucht werden, auf mysteriöse Weise verstecken. Diese Kraft aktiviert den Status Unsichtbar (Verbessert) in Höhe des Magieattributs des Critters. Im Kampf muss eine Haupthandlung Genau beobachten durchgeführt werden, um eine Wahrnehmungsprobe ablegen zu dürfen, mit der versucht werden kann, die Verschleierung zu überwinden. Eine erfolgreiche Probe bedeutet, dass das versteckte Ziel von diesem Charakter gesehen wird, bis der Critter es wieder verstecken kann oder der Charakter das nächste Mal an der Reihe gewesen ist (je nachdem, was später kommt).<br/>\
Die Verschleierung kann gleichzeitig auf eine Anzahl Ziele von durchschnittlicher Metamenschengröße (Konstitution bis 5; Konstitution über 5 zählt als zwei Zielobjekte) angewendet werden, die dem Magieattribut des Critters entspricht, oder auf eine Anzahl sehr viel kleinerer Objekte (Katzen, Babys, Ratten usw.), die dem Magieattribut × 5 des Critters entspricht. Verschleierte Zielobjekte können einander sehen, wenn der Critter es erlaubt. Die Wirkung hält an, bis der Critter aufhört, die Kraft aufrechtzuerhalten.
critterpower.confusion=Verwirrung
critterpower.confusion.page=227
critterpower.confusion.desc=Diese Kraft sorgt dafür, dass das Opfer unentschlossen, vergesslich und verwirrt wird. Der Critter legt eine Vergleichende Probe auf Willenskraft + Magie gegen Willenskraft + Logik des Opfers ab. Erzielt der Critter Nettoerfolge, so erhält das Opfer den Status Verwirrt mit einer Stufe in Höhe der Nettoerfolge sowie den Status Benommen.
critterpower.corrosive_spit=Ätzender Speichel
critterpower.corrosive_spit.page=222
critterpower.corrosive_spit.desc=Der Critter stößt als Angriff eine extrem ätzende Substanz aus. Dazu legt er eine Fernkampfangriffsprobe auf Geschicklichkeit + Magie ab. Der Angriff hat einen Schadenswert von (Magie) K (Chemisch) mit den Angriffswerten Magie × 2/(Magie × 2) - 2/(Magie × 2) - 8/(Magie × 2) - 10/-. Sinkt der Angriffswert auf 0, kann der Ätzende Speichel diese Reichweite nicht erreichen.
critterpower.dual_natured=Dualwesen
critterpower.dual_natured.page=222
critterpower.dual_natured.desc=Duale Critter existieren gleichzeitig auf der Astralebene und der physischen Ebene. Sie können sowohl auf astrale als auch auf physische Wesen einwirken, genauso wie sowohl astrale als auch physische Wesen auf duale Critter einwirken können. Sie können die Astralebene wahrnehmen und mit ihr interagieren wie ein Charakter, der astrale Wahrnehmung benutzt (s. Die Astralebene, S. 161). Ein Dualwesen zu sein, unterscheidet sich jedoch von der astralen Wahrnehmung insofern, als ein dualer Critter immer die physische und die astrale Welt gleichzeitig wahrnimmt. Sein Gehirn ist es gewohnt, gleichzeitig astrale und physische Wahrnehmungen zu verarbeiten, daher erleiden duale Critter keinen Würfelpoolmalus von -2 für Handlungen in der physischen Welt, während sie astral wahrnehmen.
critterpower.elemental_attack=Elementarer Angriff
critterpower.elemental_attack.page=223
critterpower.elemental_attack.desc=Ein Critter mit dieser Kraft kann einen tödlichen Strahl elementarer Energie projizieren, der aus einem Flammenstoß, einem Eisspeer, einem Lichtblitz, einem glibbrigen Klumpen ätzender Substanz oder Ähnlichem bestehen kann. Die Kraft entspricht immer einem bestimmten Element: Elektrizität, Feuer, Chemie oder Kälte. Der Critter legt eine Fernkampfangriffsprobe auf Geschicklichkeit + Magie ab. Der Angriff hat einen Schadenswert von (Magie)K (Schadensart), die Angriffswerte sind Magie × 2/(Magie × 2) - 2/(Magie × 2) - 8/(Magie × 2) - 10/-. Fällt der Angriffswert auf 0 oder weniger, kann der Elementare Angriff diese Reichweite nicht erreichen. Das Opfer gelangt in den Status, der der Angriffs- und damit Schadensart (siehe S. 112) entspricht: Gebrutzelt (Elektrizität), Brennend (Feuer), Verätzt(Chemisch) oder Unterkühlt (Kälte).
critterpower.energy_aura=Energieaura
critterpower.energy_aura.page=223
critterpower.energy_aura.desc=Der Critter ist von einem Feld zerstörerischer Energie umgeben, die die Form von Feuer, Kälte, Elektrizität oder einer ätzenden chemischen Substanz haben kann. Die Kraft bezieht sich immer auf ein bestimmtes Element. Der Critter erhöht den Schadenswert jedes Nahkampfangriffs, den er ausführt, um sein halbes Magieattribut (aufgerundet). Die Schadensart (S. 112) der Energieaura versetzt das Opfer in den entsprechenden Status - Gebrutzelt (Elektrizität), Brennend (Feuer), Verätzt (Chemisch) oder Unterkühlt (Kälte) - und erhöht den Angriffswert um das Magieattribut des Critters. Erfolgreiche waffenlose Nahkampfangriffe gegen einen Critter mit einer Energieaura fügen dem Angreifer ebenfalls Schaden zu. Der Angreifer legt eine Schadenswiderstandsprobe gegen einen Schadenswert von (Magie des Critters)K ab und erhält den Status, der der Schadensart entspricht. Sofern in der Beschreibung des Critters nicht anders angegeben, ist diese Kraft immer wirksam und kann nicht deaktiviert werden.
critterpower.engulf=Verschlingen
critterpower.engulf.page=227
critterpower.engulf.desc=Diese Kraft ermöglicht einem Critter, ein Opfer in sich selbst oder in das von ihm beherrschte Terrain hineinzuziehen, es zu verschlingen oder zu ersticken und ihm dadurch Schaden zuzufügen. Es handelt sich um einen Nahkampfangriff mit einem Schadenswert von (Magie)K (Schadensart) sowie speziellen Auswirkungen je nach Element; der Angriffswert erhöht sich um die Magie des Critters, und der Critter hält das Opfer fest umschlungen. Nettoerfolge bei der Nahkampfprobe erhöhen den Schaden wie üblich, und das Opfer kann eine normale Schadenswiderstandsprobe ablegen. Aber selbst wenn das Opfer sämtlichen Schaden abwendet, bleibt es trotzdem umschlungen und befindet sich im Status Bewegungsunfähig. Immer, wenn der Critter in einer Kampfrunde an der Reihe ist, verursacht er automatisch den gleichen Schaden wie oben am umschlungenen Opfer, und das Opfer kann jedes Mal eine Schadenswiderstandsprobe ablegen. Ist das Opfer an der Reihe, kann es eine Haupthandlung aufwenden, um einen Befreiungsversuch zu unternehmen, indem es eine Vergleichende Probe auf Athletik + Stärke gegen Konstitution + Magie des Critters ablegt. Ist das Opfer erfolgreich, kann es sich befreien und erleidet keinen weiteren Schaden durch den Angriff. Einige Verschlingen-Kräfte verursachen einen anderen Schaden und haben sekundäre Effekte:<br/>\
 <b>Verschlingen durch Erde:</b> Das Opfer leistet Widerstand gegen (Magie + 2)K Schaden. Es erhält den Status Erschöpft I.<br/>\
 <b>Verschlingen durch Feuer:</b> Das Opfer leistet Widerstand gegen (Magie + 2)K Schaden und erhält den Status Brennend, solange es umschlungen ist, sowie noch eine weitere Kampfrunde lang.<br/>\
 <b>Verschlingen durch Luft:</b> Das Opfer leistet Widerstand gegen (Magie + 2)B Schaden. Wird das Opfer durch den Schaden bewusstlos, erleidet es weiter Schaden, wobei der überzählige Betäubungsschaden wie üblich zu Körperlichem Schaden wird. Das Opfer erhält den Status Erschöpft I.<br/>\
 <b>Verschlingen durch Wasser:</b> Das Opfer leistet Widerstand gegen (Magie + 2)B Schaden. Dies ist übler als normales Ertrinken, denn der Critter kann großen Druck auf das Opfer ausüben. Wird das Opfer durch den Betäubungsschaden bewusstlos, erleidet es weiter Schaden, wobei der Betäubungsschaden wie üblich in Körperlichen Schaden überfließt. Das Opfer erhält die Status Nass und Erschöpft I.
critterpower.enhanced_sense=Gesteigerte Sinne
critterpower.enhanced_sense.page=224
critterpower.enhanced_sense.desc=Diese Kraft umfasst alle verbesserten oder geschärften Sinne, die über die normale menschliche Wahrnehmungsbandbreite hinausgehen. Dazu gehören Restlichtverstärkung und Infrarotsicht, verbessertes Hören und Sehen, wärmeempfindliche Organe, natürliches Sonar und einiges mehr. Der Sinn, der tatsächlich gesteigert ist, wird in der Beschreibung des Critters mit angegeben. Die Auswirkungen der gesteigerten Sinne entsprechen denen ihrer technologischen Entsprechungen im Kapitel Ausrüstung (S. 275/277).
critterpower.essence_drain=Essenzentzug
critterpower.essence_drain.page=223
critterpower.essence_drain.desc=Diese Kraft ermöglicht einem Critter, einem anderen Lebewesen permanent Essenz zu rauben und zu seiner eigenen hinzuzufügen. Essenzentzug kann nur physische, intelligente Lebewesen betreffen (Charaktere oder nicht astrale Critter mit der Kraft Bewusstsein). Das Opfer muss von Natur aus über Bewusstsein verfügen, nicht durch irgendeine andere Kraft, Magie oder Technologie damit ausgestattet worden sein. Essenz kann nicht entzogen werden, wenn das Opfer sich aktiv körperlich wehrt. Es muss entweder freiwillig teilnehmen oder unterworfen werden (gefesselt, gelähmt, unter geistiger Kontrolle usw.). Der Essenztransfer kann nur über eine starke emotionale Verbindung erfolgen, das kann Leidenschaft, Hass oder Entsetzen sein. Und die Emotion muss sich auf den Critter konzentrieren, der die Kraft einsetzt. Abstraktes Entsetzen reicht nicht; das Opfer muss speziell vor seinem Angreifer Todesangst haben, damit ihm Essenz entzogen werden kann. Bei einem Essenzentzug-Angriff wird zwar oft körperliches Material übertragen (wenn ein Vampir zum Beispiel das Blut seines Opfers trinkt), doch für das Wirken der Kraft ist im Grunde nur die emotionale Verbindung erforderlich. Einen Punkt Essenz zu entziehen, erfordert eine Ausgedehnte Probe auf Charisma + Magie (10 - Essenz des Opfers, 1 Minute). Das Opfer erhält den Status Erschöpft, dessen Stufe der Anzahl der entzogenen Essenzpunkte entspricht.<br/>\
Wird der Critter vor Beendigung der Probe gestört oder unterbrochen, so wird keine Essenz entzogen. Verlorene Essenz wirkt sich auf das Magie- oder Resonanzattribut des Opfers aus (s. Essenz, S. 40). Sinkt die Essenz des Opfers auf 0, so stirbt es.<br/>\
Ein Critter kann seine Essenz maximal auf das Doppelte seines natürlichen Maximums erhöhen. Jede Essenz, die darüber hinaus entzogen wird, geht verloren.<br/>\
Ein Critter, der Essenz entzieht, kann mit einer Nebenhandlung die gestohlene Lebenskraft in andere Attribute pumpen, auch in sein Magieattribut. Jeder so verwendete Punkt Essenz kann ein Körperliches oder Geistiges Attribut oder die Magie vorübergehend um +1 steigern. Auf diese Weise können auch mehrere Essenzpunkte in ein und dasselbe Attribut gepumpt werden, aber immer nur ein Punkt pro Nebenhandlung. Die maximale Steigerung, die ein Attribut auf diese Weise erfahren kann, beträgt +4. Der Steigerungseffekt hält 12 Stunden lang an, und die eingesetzten Essenzpunkte sind anschließend verloren.
critterpower.fear=Grauen
critterpower.fear.page=224
critterpower.fear.desc=Diese Kraft ermöglicht einem Critter, seine Opfer mit einem überwältigenden Entsetzen zu erfüllen. Das Opfer flieht voller Panik und bleibt nicht eher stehen, bis es in Sicherheit und außer Sicht des Critters ist; es erhält die Status Panisch und Verängstigt. Der Critter legt eine Vergleichende Probe auf seine Willenskraft + Magie gegen Willenskraft + Logik des Opfers ab. Das Grauen hält 1 Kampfrunde pro Nettoerfolg des Critters an, die Status halten doppelt so lange an. Und auch wenn das Entsetzen verflogen ist, muss dem Opfer eine Probe auf Willenskraft + Logik (halbe Magie des Critters; aufgerundet) gelingen, um genug Mut zu haben, dem Critter erneut gegenüberzutreten.
critterpower.guard=Schutz
critterpower.guard.page=226
critterpower.guard.desc=Mit dieser Kraft kann der Critter sich und andere gegen die Critterkraft Unfall sowie gegen die Auswirkungen von Patzern schützen. Die Kraft kann gegen eine Anzahl Ziele eingesetzt werden, die dem Magieattribut des Critters entspricht. Unter Einwirkung der Kraft Schutz sind Kritische Patzer nur einfache Patzer, und Patzer sind lediglich misslungene Proben, es sei denn, die Kraft Unfall wird eingesetzt. In diesem Fall neutralisiert die Kraft Schutz nur die Auswirkungen von Unfall, und alles läuft normal.
critterpower.hardened_armor=Verstärkter Panzer
critterpower.hardened_armor.page=227
critterpower.hardened_armor.desc=Diese Kraft ist der Grund, weshalb man sich nicht mit einer Pistole auf Drachenjagd begibt. Sie erhöht den Verteidigungswert des Critters um ihre Stufe. Außerdem liefert sie automatische Erfolge bei der Schadenswiderstandsprobe in Höhe ihrer Stufe. Und wenn der modifizierte Schadenswert eines Angriffs kleiner ist als die Stufe des Verstärkten Panzers, richtet der Angriff überhaupt keinen Schaden an. Der Critter muss in dem Fall keine Schadenswiderstandsprobe ablegen, da der Angriff wirkungslos von seinem Panzer abprallt. Dem Angreifer steht es frei, seinem Unmut verbal Luft zu machen.
critterpower.hardened_mystic_armor=Verstärkter Mystischer Panzer
critterpower.hardened_mystic_armor.page=227
critterpower.hardened_mystic_armor.desc=Diese Kraft bietet Schutz gegen alle Angriffe auf der Astralebene wie etwa Zauber oder andere Critterkräfte. Ansonsten funktioniert sie genauso wie die Kraft Verstärkter Panzer.
critterpower.immunity=Immunität
critterpower.immunity.page=224
critterpower.immunity.desc=Ein Critter mit der Kraft Immunität besitzt eine verstärkte Resistenz gegen bestimmte Arten von Angriffen oder sonstigen Beeinträchtigungen. Die Wirkung entspricht einem Verstärkten Panzer mit einer Stufe in Höhe der Essenz des Critters (aber nur gegen diese bestimmte Art von Schaden). Siehe Verstärkter Panzer, S. 227.<br/><br/>\
 <b>Immunität gegen Alter:</b> Diese Immunität stoppt die Auswirkungen des Alterns und macht den Critter praktisch unsterblich - es sei denn, er lebt ein gefährliches Leben.<br/>\
 <b>Immunität gegen Normale Waffen:</b> Gilt für alle Angriffe, die nicht magischer Natur sind; Waffenfoki, Zauber, Adepten- und Critterkräfte funktionieren wie gehabt. Hat der Critter gleichzeitig die Schwäche Allergie oder Verwundbarkeit, dann wirkt die Immunität auch nicht gegen nichtmagische Angriffe mittels des Allergens oder der Verwundbarkeit.
critterpower.infection=Infektion
critterpower.infection.page=224
critterpower.infection.desc=Diese Kraft ist der Vektor, durch den das Menschlich-Metamenschliche Vampirische Virus (MMVV) übertragen wird. Wenn ein Critter, der die Kraft Infektion besitzt, mittels der Kraft Essenzentzug die Essenz eines Opfers auf 0 senkt, so versucht diese Kraft, die Infektion des Critters auf das Opfer zu übertragen. Um festzustellen, ob das Opfer infiziert wird, ist eine Vergleichende Probe auf Magie + Magie des Critters gegen Konstitution + Willenskraft des Opfers erforderlich. Gewinnt der Critter, so ist das Opfer infiziert und fällt in einen komaartigen Zustand, während das Virus das Opfer körperlich, geistig und seelisch verändert. 24 Stunden später erhebt sich das Opfer als neuer Infizierter Critter (entsprechend seiner ursprünglichen Metaspezies) mit einem einzigen Punkt Essenz und einem unstillbaren, bestialischen Hunger nach mehr. Der neue Infizierte Critter muss sofort alles in seiner Macht Stehende tun, um einem anderen Lebewesen Essenz zu entziehen. Spielercharaktere, die durch die Kraft Infektion transformiert werden, mutieren, wenn sie ins Koma fallen, automatisch zu NSC und werden fortan von der Spielleiterin kontrolliert (jedenfalls für den Augenblick, muahahahahaha!).
critterpower.influence=Einfluss
critterpower.influence.page=223
critterpower.influence.desc=Diese Kraft verleiht einem Critter die Fähigkeit, Suggestionen in den Geist eines Opfers zu projizieren. Dazu wird eine Vergleichende Probe auf Charisma + Magie des Critters gegen Willenskraft + Logik des Opfers abgelegt. Ist der Critter erfolgreich, verhält sich das Opfer, als wäre die Suggestion sein eigener Gedanke. Wird dem Opfer klargemacht, dass es im Begriff steht, etwas Schlimmes zu tun ("Schieß deinem Ehepartner ins Gesicht!"), kann es versuchen, die Suggestion mittels einer Probe auf Willenskraft + Logik (Magie des Critters) zu überwinden. Nettoerfolge bei dieser Probe liefern einen Würfelpoolmalus auf die Handlungen, die unter dem Suggestionszwang ausgeführt werden müssen. Misslingt die Willenskraftprobe, kann noch Edge ausgegeben werden, also etwa 4 Edge, um Edge vom Würfelpool abzuziehen, oder 5 Edge, um ein Ereignis herbeizuführen wie vielleicht eine Ladehemmung. Grundsätzlich kann das Opfer mit dieser Kraft nicht dazu gebracht werden, etwas zu tun, was es offensichtlich in Gefahr bringt.
critterpower.innate_spell=Natürlicher Zauberspruch
critterpower.innate_spell.page=225
critterpower.innate_spell.desc=Diese Kraft erlaubt es einem Critter, einen ganz bestimmten Zauber zu wirken. Um die Kraft effektiv einsetzen zu können, sollte der Critter die Fertigkeit Hexerei besitzen, aber wenn er sie nicht hat, kann er auch ohne Malus auf Magie würfeln. Der Natürliche Zauberspruch stammt aus der Liste der Zauber, die Zauberern zur Verfügung stehen, und er kann durch eine Handlung Antimagie gekontert werden. Natürliche Zaubersprüche verursachen normalen Entzug und einen Würfelpoolmalus von -2, wenn sie aufrechterhalten werden. Critter und Geister leisten mit Willenskraft + Intuition Widerstand (statt Intuition kann auch Charisma verwendet werden, wenn dieses Attribut das höhere ist).
critterpower.innate_spell.choice.spell=Natürlicher Zauberspruch
critterpower.materialization=Materialisierung
critterpower.materialization.page=225
critterpower.materialization.desc=Diese Kraft ermöglicht astralen Wesen, in der physischen Welt Gestalt anzunehmen und einen vorübergehenden "Körper" zu erschaffen, den sie während ihres Aufenthalts bewohnen. Dadurch können sie mit der physischen Welt interagieren. Ihre körperliche Gestalt setzt sich aus vor Ort befindlichen Materialien zusammen, die der Art des Geistes entsprechen - aber man beachte, dass dadurch keine Regelschlupflöcher möglich sind: Man kann beispielsweise nicht einen Geist beschwören, um ein Loch in einer Wand zu erzeugen, aus deren Material er sich zusammensetzt. Ein Critter mit dieser Kraft erlangt zudem eine Immunität gegen Normale Waffen (siehe S. 224), solange er materialisiert ist. Die Materialisierung erfordert eine Haupthandlung, das Entmaterialisieren zur Rückkehr auf die Astralebene hingegen nur eine Nebenhandlung. Während der Critter materialisiert ist, ist er ein Dualwesen.
critterpower.mimicry=Mimicry
critterpower.mimicry.page=225
critterpower.mimicry.desc=Mit dieser Kraft kann ein Critter Geräusche exakt imitieren, inklusive menschlicher Sprache und der Jagdrufe anderer Kreaturen, die er schon einmal gehört hat. Um zu erkennen, dass ein nachgeahmtes Geräusch falsch ist, ist eine Vergleichende Probe auf Wahrnehmung + Intuition gegen Charisma + Magie erforderlich.
critterpower.mindspeech=Gedankensprache
critterpower.mindspeech.page=223
critterpower.mindspeech.desc=Einige intelligente Critter, insbesondere Drachen, besitzen keine komplexen Stimmbänder. Diese Critter sind mittels dieser Kraft in der Lage, auf telepathischem Wege mit anderen Lebewesen innerhalb ihres Blickfelds zu kommunizieren. Für diese Kraft existieren keine Sprachbarrieren. Diese telepathische Kommunikation kann nicht mit technischen Mitteln übertragen werden, wenn diese Critter also mithilfe moderner Technologie kommunizieren wollen, müssen sie einen Metamenschen als "Übersetzer" verwenden. Die Kraft ermöglicht einem Critter, Sprache zu projizieren, die Zielperson kann jedoch nicht auf gleiche Weise antworten, ohne selbst telepathisch begabt zu sein.
critterpower.mist_form=Nebelgestalt
critterpower.mist_form.page=225
critterpower.mist_form.desc=Diese Kraft ermöglicht einem Critter, sich in eine Nebelwolke zu verwandeln. Die Verwandlung und die Rückverwandlung kosten jeweils eine Haupthandlung. Bei der Verwandlung in die Nebelgestalt transformiert der Critter seinen gesamten Körper und alle gebundenen Foki, die er trägt, ob aktiv oder nicht. Die Nebelgestalt hat eine Bewegungsrate von 5 Metern pro Bewegungs-Handlung, das entspricht etwa 6 Kilometern pro Stunde. Der Critter kann seine Fortbewegung in dieser Gestalt prinzipiell kontrollieren, wird aber von Windgeschwindigkeiten, die größer sind als seine Bewegungsgeschwindigkeit, stark beeinflusst. Das kann den Nebel umlenken oder zerreißen, was zur vorübergehenden Desorientierung des Critters führt. Die Nebelgestalt kann durch alle nicht luftdichten Spalten und Risse dringen. Abwehrsysteme gegen Gase, Bakterien oder Viren können auch einen Critter in Nebelgestalt aufhalten. In seiner Nebelgestalt besitzt der Critter die Kraft Immunität gegen Normale Waffen (siehe S. 224), aber auch eine Mittlere Allergie gegen Feuer. Wird er einer Substanz ausgesetzt, gegen die er allergisch oder durch die er verwundbar ist, so verwandelt er sich sofort in seine normale Gestalt zurück. In der Nebelgestalt kann der Critter normal wahrnehmen, aber keine seiner anderen Kräfte einsetzen, bis er sich zurückverwandelt hat.
critterpower.movement=Bewegung
critterpower.movement.page=222
critterpower.movement.desc=Mit dieser Kraft kann der Critter die Bewegungsrate eines Ziels erhöhen oder senken. Die Kraft wirkt nur auf Ziele, die fähig sind, sich zu bewegen: Fahrzeuge, Charaktere, Critter. Der Critter kann die Bewegungsrate des Ziels mit einem Wert bis zu seinem Magieattribut multiplizieren. Gegen Lebewesen, die nicht von dieser Kraft beeinflusst werden wollen, muss der Critter eine Vergleichende Probe auf Willenskraft + Magie gegen Willenskraft + Logik ablegen. Gelingt die Probe, erhält das Ziel für [Nettoerfolge des Critters] Runden den Status Humpelnd (S. 54).<br/>\
Diese Kraft gegen Fahrzeuge einzusetzen, ist schwieriger als gegen Critter oder Charaktere. Ist das Ziel ein Fahrzeug, legt der Critter eine Probe auf Willenskraft + Magie mit einem Schwellenwert ab, der der Hälfte des Rumpfwertes des Fahrzeugs (aufgerundet) entspricht und mindestens 2 beträgt. Gelingt die Probe, werden die Nettoerfolge mit der Beschleunigung des Fahrzeugs multipliziert und das Ergebnis in der nächsten Kampfrunde zur Fahrzeuggeschwindigkeit hinzuaddiert (oder davon subtrahiert), als würde das Fahrzeug normal beschleunigen oder abbremsen. Der Critter kann weiter in jeder Kampfrunde, in der er die Kraft aufrechterhält, Proben auf Willenskraft + Magie ablegen, um das Fahrzeug zu beschleunigen oder zu verlangsamen, solange es sich in seiner Domäne/seinem Territorium befindet. Je nach Situation können die plötzlichen Geschwindigkeitsänderungen eine Crashprobe (S. 200) oder eine Steuern-Probe für das Fahrzeug erforderlich machen.
critterpower.mystic_armor=Mystischer Panzer
critterpower.mystic_armor.page=225
critterpower.mystic_armor.desc=Diese Kraft funktioniert genauso wie die Kraft Panzer, mit dem Unterschied, dass sie nur Schutz gegen Angriffe auf der Astralebene gewährt.
critterpower.natural_weapon=Natürliche Waffe
critterpower.natural_weapon.short=Natürliche Waffe
critterpower.natural_weapon.page=225
critterpower.natural_weapon.desc=Zähne, Klauen, ein stacheliger Schwanz - der Critter ist von der Natur mit einem Werkzeug ausgestattet worden, mit dem er anderen Körperlichen Schaden zufügen kann. Die Art des Angriffs sowie sein Schadenswert, sein Angriffswert und weitere Angaben werden jeweils in der Beschreibung der Kraft genauer spezifiziert. Natürliche Waffen können entweder für Nah- oder für Fernkampfangriffe verwendet werden, und es gelten die üblichen Kampfregeln. Ein Critter verwendet die Fertigkeit Nahkampf für eine natürliche Nahkampfwaffe und die Fertigkeit Exotische Waffen, um mit einer natürlichen Fernkampfwaffe anzugreifen. Die meisten Natürlichen Waffen gelten für die Kraft Immunität gegen Normale Waffen als normal; Ausnahmen werden in der Beschreibung des Critters erwähnt.<br/>\
Ein dualer Critter mit einer Natürlichen Nahkampfwaffe kann diese Kraft gegen astrale Ziele innerhalb seiner Reichweite einsetzen. Dabei werden die Nahkampffertigkeit des Critters und der normale körperliche Schadenswert (üblicherweise Stärke ÷ 2, sofern nicht anders angegeben) verwendet. Natürliche Fernkampfwaffen wirken, wie alle Fernkampfangriffe, nicht im Astralraum. Auch Critter ohne Natürliche Waffe können einen Nahkampfangriff unternehmen. Sie verwenden dabei ihre Attribute.
critterpower.noxious_breath=Gifthauch
critterpower.noxious_breath.page=224
critterpower.noxious_breath.desc=Ein Critter mit dieser Kraft kann seine Opfer mit einem ekelerregenden Gestank außer Gefecht setzen. Spieltechnisch ist dies eine Sprühangriffsprobe (S. 121) auf Geschicklichkeit + Magie des Critters mit den Angriffswerten Magie × 2/Magie/-/-/-. Für den Giftangriff gilt: Vektor: Inhalation; Geschwindigkeit: Sofort; Kraft: Magie des Critters; Wirkung: Betäubungsschaden, Benommen, Übelkeit. Panzerung ist nutzlos, aber eine aktive Chemische Versiegelung funktioniert normal.
critterpower.paralyzing_howl=Lähmendes Heulen
critterpower.paralyzing_howl.page=225
critterpower.paralyzing_howl.desc=Diese Kraft bewirkt, dass ein Opfer langsamer oder ganz bewegungsunfähig wird. Sie wirkt gegen jeden, der sie hört, innerhalb eines Radius von [Magie × 15] Metern um die heulende Kreatur herum, mit Ausnahme anderer Critter mit dieser Kraft. Der Critter legt eine Vergleichende Probe auf Charisma + Magie gegen Willenskraft + Intuition des Opfers ab. Die Stufe eventueller flächenwirksamer Schallschutzgeräte oder persönlichen Schallschutzes (z. B. Cyberware oder Ohrstöpsel mit Dämpfer) sowie Erfolge durch Zauber wie Schweigen oder Stille werden dabei zum Würfelpool des Opfers addiert, wobei bei mehreren Modifikatoren nur der höchste angewendet wird. Gewinnt das Opfer, erleidet es keinerlei negative Auswirkungen. Gewinnt der Critter, erhält das Opfer den Status Bewegungsunfähig. Erzielt der Critter 4 oder mehr Nettoerfolge, erhält das Opfer den Status Erstarrt.
critterpower.paralyzing_touch=Lähmende Berührung
critterpower.paralyzing_touch.page=224
critterpower.paralyzing_touch.desc=Diese Kraft ist die Berührungsversion des Lähmenden Heulens. Der Critter muss das Opfer berühren. Wird das Opfer überrascht oder ist es nicht in der Lage, den Critter zu bemerken, ist die Berührung automatisch erfolgreich. <br/>\
Bemerkt das Opfer den Critter, wird die Berührung wie ein Nahkampfangriff behandelt, der keinen Schaden verursacht. Der Critter legt dann eine Vergleichende Probe auf Geschicklichkeit + Magie gegen Reaktion + Willenskraft des Opfers ab. Die Auswirkungen sind die gleichen wie beim Lähmenden Heulen.
critterpower.petrification=Versteinerung
critterpower.petrification.page=228
critterpower.petrification.desc=Mit dieser Kraft kann ein Critter sein Opfer buchstäblich versteinern. Der Critter legt eine Vergleichende Probe auf Intuition + Magie gegen Reaktion + Willenskraft des Opfers ab. Gewinnt der Critter, erhält das Opfer den Status Bewegungsunfähig. Erzielt der Critter 4 oder mehr Nettoerfolge, erhält das Opfer den Status Versteinert. Durch wiederholte Angriffe mit dieser Kraft können zwischen den Angriffen Nettoerfolge angesammelt werden. Solange das Opfer verwandelt ist, bekommt es nichts von seiner Umgebung und allem, was dort geschieht, mit. Diese Kraft wird häufig mehrmals nacheinander eingesetzt, um ein Opfer so lange zu verlangsamen, bis es schließlich versteinert ist.
critterpower.psychokinesis=Psychokinese
critterpower.psychokinesis.page=226
critterpower.psychokinesis.desc=Diese Kraft ermöglicht einem Critter, ein Objekt mittels Geisteskraft zu bewegen. Die unsichtbare "Hand" hat eine Stärke und Geschicklichkeit in Höhe der erzielten Erfolge bei einer Probe auf Willenskraft + Magie, sie kann sich 10 Meter pro Kampfrunde bewegen und einen Nah- oder Fernkampfangriff mittels einer passenden Fertigkeit des Critters ausführen.
critterpower.regeneration=Regeneration
critterpower.regeneration.page=226
critterpower.regeneration.desc=Diese Kraft ermöglicht die schnelle Heilung von Schäden, die der Critter erlitten hat. Wenn der Critter am Ende einer Kampfrunde Schaden auf seinem Zustandsmonitor vermerkt hat, legt er eine Probe auf Konstitution + Magie ab, addiert seine Konstitution zu den erzielten Erfolgen und heilt entsprechend viele Schadenskästchen, zuerst Überzähligen Schaden, dann Körperlichen Schaden und schließlich Betäubungsschaden. Wenn der Critter seinen maximalen Überzähligen Schaden überschreitet, ist er noch nicht tot; er kann noch eine Regenerationsprobe ablegen. Wenn danach der Überzählige Schaden immer noch seine Konstitution × 2 übersteigt, ist er wirklich tot.<br/>\
Regeneration kann nicht alles heilen. Schäden am Gehirn durch einen angesagten Schuss in den Kopf (Ziel ansagen, S. 44, oder Angesagtes Ziel - Lebenswichtige Organe, S. 48), magischer Schaden durch Waffenfoki, Schaden durch eine Verwundbarkeit und Schaden durch Entzug können durch Regeneration nicht geheilt werden. Wenn der Critter durch etwas Schaden erleidet, gegen das er eine Allergie besitzt, so kann er zwar mit dieser Kraft den Schaden heilen, darf die Regenerationsprobe aber erst ablegen, sobald er nicht mehr in Kontakt mit dem Allergen ist.<br/>\
Regeneration ist inkompatibel mit Bodytech. Ein Critter mit dieser Kraft kann keine Körpermodifikationen erhalten; chirurgische Schnitte schließen sich zu schnell, um irgendetwas zu implantieren. Ein Critter, der bereits Modifikationen hat und in den Besitz dieser Kraft gerät, stößt seine Implantate ab, sobald die Kraft beginnt, das ursprüngliche genetische Muster seines Körpers wiederherzustellen.
critterpower.sapience=Bewusstsein
critterpower.sapience.page=222
critterpower.sapience.desc=Critter mit der Kraft Bewusstsein sind sich ihrer selbst bewusst, werden nicht mehr primär vom Instinkt getrieben und besitzen im Allgemeinen eine ähnliche Intelligenz wie der Homo sapiens. Die meisten Critter gelten als ahnungslos, was bedeutet, dass sie keine Proben auf Fertigkeiten ablegen können, die sie nicht besitzen. Critter mit der Kraft Bewusstsein hingegen sind nur ungeübt (siehe S. 95); außerdem sind sie in der Lage, neue Fertigkeiten zu erlernen, wenn sie wollen.<br/>\
Die meisten Critter mit Bewusstsein sind mundan, aber sie können durchaus Erwacht oder Digital Erwacht sein und ein Magie- bzw. Resonanzattribut besitzen. Solche Critter sind fähig, auf Magie bzw. Resonanz basierende Fertigkeiten zu erlernen, und unterliegen denselben Regeln wie normale Charaktere.
critterpower.search=Suche
critterpower.search.page=226
critterpower.search.desc=Mit dieser Kraft verliert man nie wieder seine Hausschlüssel. Um ein Ziel zu finden, legt der Critter eine Ausgedehnte Probe auf Intuition + Magie (5, 10 Minuten) ab. Vieles kann die Probe erschweren; in der Tabelle Suchmodifikatorensind einige mögliche Modifikatoren angegeben.<br/>\
Der Critter muss das, das er sucht, vor Beginn der Suche gesehen haben. Geister können nach allem suchen, von dem ihr Beschwörer ihnen ein geistiges Bild liefern kann. Critter, die den Astralraum betreten können, können dort diese Kraft einsetzen, aber sie müssen sich materialisieren, wenn sie nach einem unbelebtem Objekt auf der physischen Ebene suchen wollen. Lebende Objekte mit Auren können von der Astralebene aus gesucht werden.
critterpower.venom=Gift
critterpower.venom.page=224
critterpower.venom.desc=Der Critter sondert ein Toxin (siehe S. 125) ab, das für andere gefährlich und schädlich ist. Die typischen Attribute eines solchen Giftes sind: Vektor: Injektion; Geschwindigkeit: 1 Kampfrunde; Kraft: Magie; Wirkung: Benommen, Vergiftet (Magie)K. Einige Critter besitzen Gifte mit anderen Charakteristika - etwa den Vektor Kontakt -, die dann in der Beschreibung des Critters angegeben werden.
critterpower.weather_control=Wetterbeherrschung
critterpower.weather_control.page=228
critterpower.weather_control.desc=Mit dieser Kraft kann ein Critter in gewissem Ausmaß die örtlichen Wetterbedingungen manipulieren. Das gewünschte Wetter muss unter normalen Bedingungen in der Umgebung möglich sein. Das Wetter verändert sich allmählich und erreicht seinen Höhepunkt, wenn der Critter seine Ausgedehnte Probe auf Willenskraft + Magie (10, 30 Minuten) vollendet. Genau genommen beherrscht der Critter nicht wirklich das Wetter, er beschwört es nur und schiebt es in die gewünschte Richtung. Ein Critter kann beispielsweise ein Gewitter heraufbeschwören, aber nicht die Blitze gezielt einsetzen.

#Echos
metaecho.living_network=Lebendes Netzwerk
metaecho.living_network.page=195
metaecho.living_network.desc= Deine Lebende Persona kann Teil eines PANs sein. Dieses Echo kann nur einmal gewählt werden.
metaecho.machine_mind=Maschinenbeherrschung
metaecho.machine_mind.page=195
metaecho.machine_mind.desc=Du erhältst die Vorteile einer Riggerkontrolle der Stufe 1 (S. 285). Dieses Echo kann nur einmal gewählt werden.
metaecho.attack_upgrade=Angriffs-Upgrade
metaecho.attack_upgrade.page=195
metaecho.attack_upgrade.desc=Du kannst eines der Matrixattribute deiner Lebenden Persona um 1 erhöhen. Dieses Echo kann mehrmals gewählt werden, aber jedes Matrixattribut darf höchsten zweimal gesteigert werden.
metaecho.data_processing_upgrade=Data Processing Upgrade
metaecho.data_processing_upgrade.page=195
metaecho.data_processing_upgrade.desc=Du kannst eines der Matrixattribute deiner Lebenden Persona um 1 erhöhen. Dieses Echo kann mehrmals gewählt werden, aber jedes Matrixattribut darf höchsten zweimal gesteigert werden.
