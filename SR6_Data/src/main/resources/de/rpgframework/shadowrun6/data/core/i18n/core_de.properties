item.fingertip_compartment.wifi=Das Verstauen oder Herausnehmen eines Gegenstandes erfordert nur eine Nebenhandlung; das schließt auch das Aufspulen einer Monofilamentpeitsche ein.
item.internal_air_tank=Interner Lufttank
item.internal_air_tank.page=288
item.internal_air_tank.wifi=Der Charakter erhält eine zusätzliche Nebenhandlung, wenn er an der Reihe ist und den Tank aktiviert oder deaktiviert. Er ist immer über den genauen Luftstand und die Luftreinheit des Tanks im Bilde.
item.muscle_replacement=Kunstmuskeln
