ammotype.regular.desc=Die klassische Kugel bzw. das moderne Vollmantelgeschoss.
ammotype.apds.desc="Armor-Piercing Discarding Sabot" macht einem einen Knoten in die Zunge, deshalb benutzt jeder nur die Abkürzung APDS. Diese Patronen haben eine Treibhülse, die eine höhere Mündungsgeschwindigkeit ermöglicht, mit der ein panzerbrechendes Geschoss abgefeuert wird, das in der Lage ist, Körperpanzerung zu durchdringen. APDS-Munition wird selten hülsenlos hergestellt, da die Treibhülsen ohnehin ausgeworfen werden.
ammotype.explosive.desc=Diese Kugeln enthalten eine Hohlladung, die beim Aufprall explodiert. Explosivmunition zündet bei einem Kritischen Patzer fehl. Wenn das passiert, muss der Schütze Widerstand gegen den normalen Schadenswert der Waffe leisten (und vergiss dabei nicht den Schadensmodifikator für die Explosivmunition). Der eigentliche Angriff verfehlt sein Ziel, und die Waffe wird zerstört.
ammotype.flechette.desc=Die Ladung von Flechettemunition besteht aus winzigen, dicht gepackten Metallsplittern oder Metallkügelchen (je nach Waffe). Sie streuen auf ihrer Flugbahn leicht, was es wahrscheinlicher macht, eine ungeschützte Stelle zu treffen, aber sie sind im Vergleich zu anderer Munition klein und übertragen weniger kinetische Energie auf das Ziel.
ammotype.gel.desc=Diese Gelgeschosse sehen beim Aufprall wie plattgedrückte Heidelbeeren aus. Sie werden häufig bei der Aufruhrbekämpfung oder als nichttödliche Option verwendet und eignen sich hervorragend, um eine Zielperson aus den Latschen zu hauen - wobei man nicht erwarten sollte, dass das auch bei Trollen funktioniert. Gelmunition verursacht Betäubungsschaden. Jemandem, der von Gelmunition getroffen wird, muss eine sofortige Probe auf Geschicklichkeit (2) oder Konstitution (4) (der Getroffene hat die Wahl) gelingen, ansonsten gerät er in den Status Liegend (S. 54). Salvenfeuer und vollautomatisches Feuer erhöhen den Schwellenwert dieser Probe um 1.
ammotype.stick_n_shock.desc=Schockermunition macht aus jeder normalen Waffe einen Taser. Die Kugeln verursachen Betäubungsschaden und versetzen das Ziel für 2 Kampfrunden in den Status Gebrutzelt, aber sie sind längst nicht so durchschlagskräftig wie normale Kugeln.
ammotype.apds_caseless.desc="Armor-Piercing Discarding Sabot" macht einem einen Knoten in die Zunge, deshalb benutzt jeder nur die Abkürzung APDS. Diese Patronen haben eine Treibhülse, die eine höhere Mündungsgeschwindigkeit ermöglicht, mit der ein panzerbrechendes Geschoss abgefeuert wird, das in der Lage ist, Körperpanzerung zu durchdringen. APDS-Munition wird selten hülsenlos hergestellt, da die Treibhülsen ohnehin ausgeworfen werden.
ammotype.explosive_caseless.desc=Diese Kugeln enthalten eine Hohlladung, die beim Aufprall explodiert. Explosivmunition zündet bei einem Kritischen Patzer fehl. Wenn das passiert, muss der Schütze Widerstand gegen den normalen Schadenswert der Waffe leisten (und vergiss dabei nicht den Schadensmodifikator für die Explosivmunition). Der eigentliche Angriff verfehlt sein Ziel, und die Waffe wird zerstört.
ammotype.flechette_caseless.desc=Die Ladung von Flechettemunition besteht aus winzigen, dicht gepackten Metallsplittern oder Metallkügelchen (je nach Waffe). Sie streuen auf ihrer Flugbahn leicht, was es wahrscheinlicher macht, eine ungeschützte Stelle zu treffen, aber sie sind im Vergleich zu anderer Munition klein und übertragen weniger kinetische Energie auf das Ziel.
ammotype.gel_caseless.desc=Diese Gelgeschosse sehen beim Aufprall wie plattgedrückte Heidelbeeren aus. Sie werden häufig bei der Aufruhrbekämpfung oder als nichttödliche Option verwendet und eignen sich hervorragend, um eine Zielperson aus den Latschen zu hauen - wobei man nicht erwarten sollte, dass das auch bei Trollen funktioniert. Gelmunition verursacht Betäubungsschaden. Jemandem, der von Gelmunition getroffen wird, muss eine sofortige Probe auf Geschicklichkeit (2) oder Konstitution (4) (der Getroffene hat die Wahl) gelingen, ansonsten gerät er in den Status Liegend (S. 54). Salvenfeuer und vollautomatisches Feuer erhöhen den Schwellenwert dieser Probe um 1.
ammotype.stick_n_shock_caseless.desc=Schockermunition macht aus jeder normalen Waffe einen Taser. Die Kugeln verursachen Betäubungsschaden und versetzen das Ziel für 2 Kampfrunden in den Status Gebrutzelt, aber sie sind längst nicht so durchschlagskräftig wie normale Kugeln.
ammotype.regular_caseless.desc=Die klassische Kugel bzw. das moderne Vollmantelgeschoss.

