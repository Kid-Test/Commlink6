item.datasoft.desc=Datensofts sind vergleichbar mit den Abteilungen von Mini- Bibliotheken. Jede Datensoft enthält eine Datenbank zu einem bestimmten Thema (will heißen: einer bestimmten Wissensfertigkeit). Eine Datensoft versorgt den Benutzer mit einer etwas eingeschränkten Version einer Wissensfertigkeit - Beispiel: Da "Gangs in Seattle" eine Wissensfertigkeit ist, kann eine Datensoft Informationen über die Ancients oder die Halloweeners enthalten, aber sie kann sich auch auf Gangs in Puyallup konzentrieren. Eine Datensoft wird genauso eingesetzt wie eine Wissensfertigkeit (S. 100).
item.mapsoft.desc=Kartensofts sind heruntergeladene Daten, die detaillierte Informationen über ein bestimmtes Gebiet von etwa 5.000 Quadratkilometern enthalten. Diese Daten umfassen so ziemlich alles: Straßen, Geschäfte und Wohnblöcke, topografische, statistische, GPS- und Umweltdaten. Ein interaktives Interface erlaubt es, schnell die besten Routen zu bestimmen, den nächsten Ort der Wahl zu lokalisieren oder eigene maßgeschneiderte Karten zu erstellen. Mit einer WiFi-Verbindung aktualisiert sich die Karte automatisch mit den neuesten Daten von GridGuide. Das heißt natürlich auch, dass die Kartensoft von anderen genutzt werden kann, um die eigene Position aufzuspüren. Kartensofts gewähren einen Würfelpoolbonus von +1 auf Proben, um den richtigen Weg zu finden.
item.shopsoft.desc=Shopping-Apps wie Clothes Horse, Caveat Emptor oder Guns Near Me bieten Preisvergleiche und Käuferbewertungen für alle Arten von Standardwaren. Eine passende Shopsoft - es gibt eine für jede Art von Produkt wie Elektronik, Feuerwaffen, Nahkampfwaffen, Panzerung usw. - gewährt einen Würfelpoolbonus von +1 auf Einflussproben, um solche Gegenstände zu kaufen oder zu verkaufen.
item.knowsoft.desc=Wissenssofts replizieren Wissensfertigkeiten und überschreiben aktiv das Wissen des Anwenders durch ihre eigenen Daten. Auf Wissenssofts muss mit einer Talentbuchse zugegriffen werden, und die Anzahl der Wissenssofts, die man gleichzeitig nutzen kann, entspricht der Stufe der Talentbuchse. Wissenssofts haben - wie Wissensfertigkeiten - keine Stufe.
item.linguasoft.desc=Linguasofts replizieren Sprachfertigkeiten und ermöglichen es dem Anwender, eine fremde Sprache zu sprechen. Auf Linguasofts muss mit einer Talentbuchse zugegriffen werden, und die Anzahl der Linguasofts, die man gleichzeitig nutzen kann, entspricht der Stufe der Talentbuchse. Linguasoftstufen entsprechen folgenden Sprachfertigkeiten: Stufe 1 - Grundkenntnisse; 2 - Sprachspezialist; 3 - Sprachexperte; 4 - Sprachexperte. Diese Stufen funktionieren wie Sprachfertigkeiten (siehe S. 100): Mit Stufe 1 kann man einzelne Fetzen der Sprache verstehen und die Sprachfertigkeit wie eine normale Wissensfertigkeit verwenden. Die höheren Stufen gewähren auf alle Proben, die mit dem Verstehen der Sprache zusammenhängen, einen Würfelpoolbonus in Höhe ihrer Stufe. Linguasofts können keine höhere Stufe haben als 4.
item.tutorsoft.desc=Diese virtuellen Privatlehrer helfen beim Lernen einer bestimmten Fertigkeit (siehe S. 96). Die Lehrsoft legt Unterrichtenproben mit einem Würfelpool in Höhe ihrer Stufe × 2 ab. Lehrsofts können keine Fertigkeiten lehren, die auf Magie oder Resonanz basieren, und sie können Stufen von 1 bis 6 haben.
item.activesoft.desc=Aktionssofts ersetzen körperliche Aktionsfertigkeiten, also im Wesentlichen jede Aktionsfertigkeit, die nicht auf Magie oder Resonanz basiert. Um die Aktionssoft in nutzbares Muskelgedächtnis zu übersetzen, sind eine Talentbuchse und Talentleitungen (S. 285/289) erforderlich. Die Anzahl an Aktionssofts, die man gleichzeitig nutzen kann, entspricht der Stufe der Talentbuchse.\nAktionssofts gibt es in Stufen von 1 bis 6.

