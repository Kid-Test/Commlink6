item.anti-vehicle.desc=AF-(Lenk-)Raketen enthalten eine Hohlladung, die sich ihren Weg durch ein Fahrzeug oder eine Barriere brennt oder schlägt. Der Aufprall erzeugt zwar eine Sprengwirkung, die aber im Vergleich zu einer Sprengrakete begrenzt ist.
item.fragmentation.desc=Dieser Sprengkopf wird hauptsächlich gegen Personen eingesetzt. Bei der Detonation werden mit hoher Geschwindigkeit Splitter freigesetzt, die sich in ungeschützte Ziele bohren. Diese (Lenk-)Raketen sind hochwirksam gegen ungepanzerte Personen, aber nicht besonders effektiv gegen Barrieren, Gebäude und Fahrzeuge.
item.high_explosive.desc=Spreng-(Lenk-)Raketen richten schweren Schaden in einem kleinen Bereich an. Ihr Sprengmuster ähnelt dem einer Sprenggranate, reicht aber etwas weiter.
item.gas_rocket.desc=Mit diesen Raketen können Chemikalien oder Toxine verteilt werden (s. Toxine und Drogen, S. 124). Die Gaswolke hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.smoke_rocket.desc=Ähnlich wie eine Gasrakete gibt eine Rauchrakete eine Wolke ab, die jedoch aus Rauch besteht statt aus giftigem Gas. Die Wolke schränkt die Sicht ein und verursacht den Status Geblendet I bei jedem, der etwas durch die Wolke hindurch tun will (etwa feuern), und Geblendet II bei jedem, der sich innerhalb der Wolke befindet. Rauchraketen schränken normale Sicht (inklusive Restlichtverstärkung) ein. Die Wolke hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.smoke_rocket_thermal.desc=Ähnlich wie eine Gasrakete gibt eine Rauchrakete eine Wolke ab, die jedoch aus Rauch besteht statt aus giftigem Gas. Die Wolke schränkt die Sicht ein und verursacht den Status Geblendet I bei jedem, der etwas durch die Wolke hindurch tun will (etwa feuern), und Geblendet II bei jedem, der sich innerhalb der Wolke befindet. IR-Rauchraketen schränken normale Sicht (inklusive Restlichtverstärkung) und auch Infrarotsicht ein. Die Wolke hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.

