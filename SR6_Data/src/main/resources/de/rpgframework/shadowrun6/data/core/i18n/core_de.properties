item.glue_solvent.desc=Diese Spraydose enthält genug Lösungsmittel, um etwa 1 Quadratmeter schnelltrocknenden Aerosol-Superkleber zu entfernen.
item.glue_sprayer.desc=Dieser schnelltrocknende Aerosol-Superkleber erlaubt es, zwei Oberflächen schnell aneinanderzukleben, und enthält genug Kleber für ungefähr 1 Quadratmeter (genug, um eine Außentür oder ein Panoramafenster zuzukleben). Der Kleber braucht 1 Kampfrunde, um auszuhärten. Er hat eine Konstitution und Stärke von jeweils 5 für den Fall, dass man ihn aufbrechen will (was mittels einer Vergleichenden Probe auf Konstitution + Stärke erfolgt).
item.thermit_burning_bar.desc=Thermit ist ein entzündliches Material, das mit einer extrem hohen Temperatur brennt. Appliziert wird es mithilfe eines Brennstabs - einer Stange aus Thermit und Sauerstoff mit einem Griff und in einer Halterung -, der verwendet werden kann, um Löcher in Eisen, Stahl und sogar Plasstahl zu brennen. Der Thermit-Brennstab verursacht Feuerschaden mit einem Schadenswert von 10K. Er muss sehr vorsichtig gehandhabt werden und kann deshalb nicht als Waffe verwendet werden - es sei denn, die Zielperson ist bewusstlos oder gefesselt oder Ähnliches, aber so grausam ist ja wohl niemand.
item.chemsuit.desc=Dieser undurchlässige Ganzkörperanzug wird über Kleidung oder Panzerung getragen und gewährt chemische Isolierung (S. 266) in Höhe seiner Stufe - nicht zu verwechseln mit einem kompletten Hazmat-Anzug, da der Chemoanzug nicht vakuumversiegelt ist.
item.climbing_gear.desc=Dies ist ein Rucksack mit 100 Metern Seil (Tragkraft 400 kg), einem Klettergeschirr, Handschuhen, Karabinern, Steigeisen, Kletterhaken und weiteren Dingen, die für das Klettern mit Ausrüstung benötigt werden (s. Klettern, S. 95).
item.diving_gear.desc=In der Taucherausrüstung sind ein Neoprenanzug, eine Gesichtsmaske mit Schnorchel, ein Atemregler, ein Lufttank für 2 Stunden Luft (Ersatztanks kosten 50 ¥) und eine aufblasbare Weste für das Treiben an der Wasseroberfläche enthalten. Der Atemregler und der Lufttank schützen wie eine Gasmaske gegen Toxine mit Inhalationsvektor. Der Neoprenanzug gewährt Kälteresistenz (S. 267) der Stufe 2.
item.flashlight.desc=Im Jahr 2080 haben die meisten Taschenlampen eine sehr lange Lebensdauer und sind superhell. Es gibt sie auch in Versionen für Restlichtverstärkung und Infrarot, die eine noch bessere Sicht bei Restlichtverstärkung bzw. Infrarotsicht erlauben. Eine Taschenlampe kann auf oder unter dem Lauf einer Waffe montiert werden (s. Waffenzubehör, S. 259).
item.gas_mask.desc=Dieses Atemgerät mit Sauerstoffversorgung bedeckt das Gesicht vollständig und macht immun gegen Toxinangriffe mit Inhalationsvektor (s. Toxine und Drogen, S. 124). Die Gasmaske hat eine Luftversorgung für eine Stunde (Ersatz kostet 40 ¥) und kann an größere Lufttanks angeschlossen werden. Sie kann nicht mit einer normalen Atemschutzmaske kombiniert werden.
item.gecko_tape_gloves.desc=Die äußere Schicht dieser Handschuhe besteht aus einem speziellen Trockenklebstoff, in dem Millionen von mikroskopisch feinen Haaren enthalten sind, die an anderen Oberflächen haften. Einzeln sind diese Haftkräfte vernachlässigbar, aber zusammen sind sie stark genug, um sogar einen Troll kopfüber an einer Decke haften zu lassen. Geckotape-Handschuhe werden im Set mit Kniepolstern und Überziehsohlen geliefert. Wenn man das Set trägt, gelten die Regeln für Klettern mit Ausrüstung (S. 95). Geckotape-Handschuhe sind nutzlos, wenn sie nass sind.
item.hazmat_suit.desc=Der Hazmat-Anzug bedeckt den ganzen Körper und enthält einen internen Lufttank mit einer Luftversorgung für 4 Stunden. Er bietet eine chemische Versiegelung (S. 266) und schützt vor Toxinangriffen mit Kontakt- und Inhalationsvektor (s. Toxine und Drogen, S. 124). Hazmat-Anzüge sind serienmäßig mit Platz für einen Sensor ausgestattet, der in den meisten Fällen ein Geigerzähler (S. 278) ist. Der Sensor muss separat gekauft werden.
item.light_stick.desc=Wenn man den Leuchtstab knickt und schüttelt, erhält man für 3 Stunden eine sanfte chemische Beleuchtung, die einen Radius von 10 Metern erhellt.
item.magnesium_torch.desc=Die angezündete Fackel liefert für 5 Minuten helles Fackellicht, das 20 Meter weit reicht. Wenn man jemanden mit dem brennenden Ende schlägt, verursacht das 3K Feuerschaden.
item.microflare_launcher.desc=Die Signalraketenkanone kann farbige Leuchtraketen bis zu 200 Meter hoch in die Luft schießen und dadurch ein paar Minuten lang ein Gebiet von der Größe eines Straßenblocks beleuchten, was alle eventuellen Vorteile durch schlechte Beleuchtung eliminiert. Wenn man damit auf jemanden schießt, handelt es sich um eine ungeübte Fertigkeitsprobe (siehe S. 95); die Mini-Signalrakete verursacht 3K Feuerschaden.
item.microflares.desc=Die Mini-Signalrakete verursacht 3K Feuerschaden.
item.rappelling_gloves.desc=Diese Handschuhe bestehen aus einem speziellen Gewebe, das einen besseren Griff am Seil erlaubt und 1 Bonus-Edge für alle Proben gewährt, um sich am Seil festzuhalten. Die Handschuhe sind notwendig, um Microwire oder Camouflageseil (S. 281) zu verwenden, ohne sich brutal die Hände daran aufzuschlitzen, während man herunterrutscht.
item.respirator.desc=Eine Atemschutzmaske ist eine Filtermaske, die über Mund und Nase getragen wird und vor Toxinen mit Inhalationsvektor schützt (s. Toxine und Drogen, S. 124). Sie addiert ihre Stufe als Würfelpoolbonus bei Widerstandsproben gegen Chemikalien mit Inhalationsvektor.
item.survival_kit.desc=Eine Überlebensausrüstung in einer widerstandsfähigen Tasche. Enthält ein Messer, ein Feuerzeug, Streichhölzer, einen Kompass, eine Drahtsäge, eine leichte Rettungsdecke, Nahrungsriegel für 7 Tage, eine Wasserreinigungseinheit, eine Angelschnur mit Haken und diverse andere nützliche Dinge.
item.grapple_gun.desc=Diese Kanone kann einen Enterhaken und ein daran befestigtes Seil bis 100 Meter weit (je nach Art des Seils) abschießen. Der Schwellenwert für die Feuerwaffenprobe, um das gewünschte Ziel zu treffen, beträgt [Entfernung in Metern ÷ 20 (aufgerundet)]. Die Enterhakenkanone ist mit einer kleinen Winde ausgestattet, mit der der Haken zurückgezogen oder kleine Gewichte bis zu 10 Kilogramm hochgezogen werden können. Microwire kann bis zu 100 Meter weit geschossen werden und ein Gewicht bis zu 100 kg tragen; normales und Camouflageseil erreicht nur 60 Meter, kann dafür aber ein Gewicht bis zu 400 kg tragen; myomeres Seil kann bis zu 30 Meter weit geschossen werden und 100 kg tragen. Die Enterhakenkanone kann ungeübt als Waffe verwendet werden (Angriffswert 1, Schaden 1B).
item.grapple_gun.variant.cyberware.desc=Dies ist eine implantierte Version der Enterhakenkanone (S. 280). Ihr interner Stauraum enthält 60 Meter Microwire.
item.microwire.desc=Dieses Seil besteht aus einer extrem dünnen (fast schon monofilamentdünnen) und widerstandsfähigen Polymerfaser; eine große Länge davon kann auf sehr kleinem Raum verstaut werden, und es ist sehr schwer zu sehen (Schwellenwert 6 bei einer Wahrnehmungsprobe). Der Nachteil ist, dass man es nur mit speziellen, schützenden Abseilhandschuhen (S. 280) greifen kann, ohne sich die Hand aufzuschlitzen, was 5K Schaden verursachen würde.
item.myomeric_rope.desc=Dieses Seil besteht aus einer speziellen Myomerfaser und kann (bis zu einer Maximallänge von 30 Metern) ferngesteuert werden. Beispielsweise kann man es dazu bringen, sich wie eine Schlange um ein Hindernis zu winden oder sich an einen Vorsprung zu binden. Das Seil bewegt sich mit einer Geschwindigkeit von 2 Metern pro Kampfrunde.
item.standard_rope.desc=Ein stinknormales Standardseil
item.stealth_rope.desc=Wenn man Camouflageseil mit dem Katalysatorstab berührt, führt eine chemische Reaktion dazu, dass es innerhalb von Sekunden zu Staub zerfällt und fast keine Spuren hinterlässt. Der Katalysatorstab ist wiederverwendbar.
item.catalyst_stick.desc=Wenn man Camouflageseil mit dem Katalysatorstab berührt, führt eine chemische Reaktion dazu, dass es innerhalb von Sekunden zu Staub zerfällt und fast keine Spuren hinterlässt. Der Katalysatorstab ist wiederverwendbar.

