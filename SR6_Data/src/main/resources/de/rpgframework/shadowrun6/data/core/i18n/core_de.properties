item.meta_link.desc=Kommlinks sind universelle Kommunikationsgeräte, die von praktisch jedermann immer und überall verwendet werden. Es gibt sie in einer Vielzahl von Formen und Stilen, teilweise integriert in Bodytech oder sogar in Kleidungsstücke.\nSelbst die einfachsten Kommlinks verfügen über AR-Fähigkeit, Telefon, Videofon, Textkommunikation, Musikplayer, Mikro-Trideoprojektoren, Touchscreen-Displays, hochauflösende Kameras für Videos und Bilder, Bild/Text- und RFID-Scanner, eingebaute GPS-Systeme, Chip-Player, Credstickleser, einen biometrischen Scanner, einziehbare Ohrhörer, Sprachsteuerung und Text-to-Speech- sowie Speech-to-Text-Technologie. Und sie können noch mit jeder Menge weiterem Zubehör ausgestattet werden.\nKommlinks können eine Maximalzahl an Slaves haben, die ihrer Stufe in Datenverarbeitung entspricht.
