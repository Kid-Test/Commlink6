item.credstick_standard.desc=Das Bargeld des späten 21. Jahrhunderts. Ein beglaubigter Credstick ist nicht auf eine bestimmte Person registriert. Die darauf kodierten Geldbeträge gehören dem Besitzer und erfordern keine spezielle ID oder Authentifizierung, was natürlich auch bedeutet, dass sie gestohlen werden können. Aber wer wagt es schon, einen Runner auszurauben? Man muss einen Credstick in einen Universal-Datenport stecken, um Geld von ihm oder auf ihn zu transferieren. Das macht diese Zahlungsmittel so unglaublich beliebt bei Shadowrunnern und den Mr Johnsons, die sie anheuern. Die Farbe eines Credsticks gibt an, wie viel Geld auf ihm gespeichert werden kann - das ist der Maximalbetrag, den der Stick enthalten kann, nicht der Betrag, der darauf ist. Die einzige externe Identifizierungsmöglichkeit eines Credsticks ist ein schmales farbiges Band auf dem Gehäuse, das auf der Straße häufig abgekratzt wird, um bei Transaktionen zu verbergen, um welche Sorte Stick es sich handelt.
