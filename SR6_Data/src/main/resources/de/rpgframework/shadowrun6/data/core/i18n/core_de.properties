action.assist.desc=Der Charakter kann Helfer bei einer Teamworkprobe werden, um einen seiner Teamgefährten bei einer Aufgabe zu unterstützen (s. Teamworkproben, S. 38).
action.astral_projection.desc=Ein Charakter, der der astralen Projektion mächtig ist (ein Vollzauberer oder Aspektzauberer), kann sein Bewusstsein in einer Haupthandlung auf die Astralebene oder zurück verlagern. Dieser Prozess erfolgt in dem Augenblick, in dem die Handlung angekündigt wird, der Charakter befindet sich also augenblicklich auf der Astralebene (bzw. wieder zurück), insbesondere auch für den Rest der Kampfrunde.
action.attack.desc=Mit dieser Haupthandlung kann der Charakter eine große Auswahl an Angriffen durchführen. Näheres im Kapitel Kampf (S. 107).
action.banish_spirit.desc=Ein Charakter kann mit dieser Haupthandlung den Versuch unternehmen, einen Geist zu verbannen (s. Verbannen, S. 149).
action.cast_spell.desc=Mit dieser Haupthandlung kann ein Charakter einen Zauber wirken. Näheres dazu unter Zauber (S. 133).
action.cleanse.desc=Erwachte Charaktere können mithilfe dieser Handlung die Spuren ihrer magischen Aktivitäten tilgen (siehe S. 161).
action.full_defense.desc=Der Charakter kann bis zum Ende der Kampfrunde seine Willenskraft zu allen Verteidigungsproben hinzuaddieren. Kann im physischen und im Astralkampf eingesetzt werden, für den Matrixkampf gibt es Volle Matrixabwehr (S. 184).
action.manifest.desc=Ein Charakter, der sich astral projiziert, kann mit dieser Handlung in geisterhafter Gestalt erscheinen (siehe S. 162).
action.observe_in_detail.desc=Ein Charakter kann mittels dieser Haupthandlung etwas
genau beobachten oder betrachten. Diese Handlung ermöglicht ihm eine Wahrnehmungsprobe (s. Wahrnehmung, S. 99) oder eine Askennenprobe (S. 161). Der Charakter kann Details wahrnehmen, die aufgrund der Hektik und Ablenkung des Kampfes normalerweise unbeachtet bleiben. Wir gehen davon aus, dass in einer Kampfsituation jeder Beteiligte sich der Anwesenheit aller anderen bewusst ist - abgesehen vom Einsatz von Heimlichkeit oder täuschender Magie -, aber nicht notwendigerweise der Details ihrer Ausrüstung und unter besonders hektischen Umständen möglicherweise auch ihrer Identität. Im Kampfgetümmel ist die Siegerin eines unübersichtlichen Zweikampfes, die gerade auf den Charakter zugerannt kommt, manchmal nur mit einer Handlung Genau beobachten zu identifizieren.
action.pick_updown.desc=Ein Charakter kann einen Gegenstand innerhalb seiner Reichweite aufheben oder einen, den er in der Hand hält, ablegen. Dabei lässt er eine gewisse Sorgfalt walten. Handelt es sich bei dem aufgehobenen Gegenstand um eine Waffe, so wird sie zugleich bereit gemacht.
action.ready_weapon.desc=Mit dieser Handlung kann ein Charakter seine Waffe für den Kampf bereit machen. Das kann bedeuten: eine Schusswaffe ziehen und entsichern; eine Nahkampfwaffe aus einer Tasche oder Scheide ziehen; eine Granate oder ein Wurfmesser ziehen und bereit machen; jede andere Form der Waffenvorbereitung. Fast alle Waffen benötigen diese Handlung, bevor sie einsatzbereit sind, sofern sie nicht schon vor Beginn des Kampfes bereit gemacht wurden. <br/> Kleine Waffen wie Wurfmesser oder Shuriken können zu mehreren bereit gemacht werden, wobei eine Maximalzahl, die dem halben Geschicklichkeitsattribut des Charakters (aufgerundet) entspricht, mit einer einzigen Handlung Waffe bereit machen in die Nebenhand des Charakters genommen werden kann.
action.reload_weapon.desc=Waffen ohne Smartgunsystem oder Waffen, bei denen das Smartgunsystem gegenwärtig deaktiviert ist, benötigen eine Haupthandlung, um sie nachzuladen. Durch diese Handlung wird die Waffe voll geladen, sofern der Charakter noch genug Ersatzmunition hat.
action.rigger_jump_in.desc=Ein Charakter mit einer Riggerkontrolle, der in einem Fahrzeug mit Riggerinterface sitzt oder eine Drohne mit einer Riggerkonsole steuert, kann mit dieser Haupthandlung in das Fahrzeug/die Drohne springen und es/sie direkt steuern. Möchte er einer Drohne nur einen Befehl erteilen, geschieht das über die Nebenhandlung Drohne befehligen (S. 43).
action.sprint.desc=Mit dieser Haupthandlung kann ein Charakter eine bestimmte Strecke sprinten. Die Mindeststrecke beträgt 15 Meter und steigt pro Erfolg bei einer Probe auf Athletik + Geschicklichkeit um 1 Meter. Nur eine Handlung Sprinten ist erlaubt, wenn der Spieler an der Reihe ist, und sie kann nicht zur gleichen Zeit wie eine Handlung Bewegen oder Weghechten durchgeführt werden.
action.summon_spirit.desc=Ein Charakter, der die Fertigkeit Beschwören beherrscht, kann mit dieser Haupthandlung einen Geist zu seiner Unterstützung herbeirufen. Ein Geist, der bereits herbeigerufen wurde, wird mit der Nebenhandlung Geist befehligen (S. 43) kontrolliert.
action.use_simple.desc=Mit dieser Haupthandlung kann der Charakter ein einfaches Gerät benutzen. Einfache Geräte sind solche, die mit einer einfachen Bewegung aktiviert werden können, etwa mit einem Daumenschalter, einem einfachen Tastendruck oder dem Antippen eines Icons. Die Bedienung komplexerer Geräte dauert länger, wobei die benötigte Zeit vom Spielleiter bestimmt wird oder in der Beschreibung des Gerätes angegeben ist. Man beachte, dass ein Gerät, das über ein direktes Neuralinterface (S. 175) kontrolliert wird, mit einer Nebenhandlung aktiviert werden kann.
action.use_skill.desc=Ein Charakter kann mit dieser Haupthandlung eine seiner Fertigkeiten einsetzen (s. Fertigkeiten, S. 94).
action.boosted_defense.desc=Das ist eine prophylaktische Art der Verteidigung, bei der ein Zauberer versucht, einen eintreffenden Zauber zu blockieren. Um sie aufzubauen, führt der Charakter die Haupthandlung Antimagie durch und legt eine Probe auf Hexerei + Magie ab. Die Grundform dieser Handlung wirkt auf eine Kugel im Blickfeld des Zaubernden mit zwei Metern Radius. Pro Dram Reagenzien (siehe S. 155), die eingesetzt werden, kann dieser Radius um 1 Meter erhöht werden. Die Erfolge dieser Probe werden zum Würfelpool aller Ziele addiert, die sich innerhalb des Wirkungsbereichs gegen Zauber verteidigen müssen. Die Zauberabwehr hält für eine Anzahl von Kampfrunden gleich dem Magieattribut des Zaubernden an.
action.dispelling.desc=Diese Methode wird gegen aufrechterhaltene Zauber oder andere Zauber verwendet, die eine länger anhaltende Wirkung haben. Der Charakter führt die Haupthandlung Antimagie durch und legt dann eine Vergleichende Probe auf Hexerei + Magie gegen den Entzug des gegnerischen Zaubers × 2 ab (dabei werden alle Entzugserhöhungen durch Anpassungen mitgezählt). Nettoerfolge bei dieser Probe negieren Nettoerfolge bei der ursprünglichen Probe der Gegenseite im Verhältnis eins zu eins. Wenn diese Nettoerfolge auf 0 gesenkt sind, ist der Zauber vollständig gebannt. Unabhängig vom Ausgang muss der Charakter nach dem Bannen einem Entzug widerstehen, als hätte er den Zauber selbst gewirkt.

