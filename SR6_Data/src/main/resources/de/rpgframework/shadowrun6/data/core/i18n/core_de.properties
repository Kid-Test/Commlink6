item.atmosphere_sensor.desc=Wettervorhersagen sind (dank der Umweltverschmutzung und des Erwachens und je nachdem, welche Drachen gerade wo mit den Flügeln schlagen) notorisch unzuverlässig, aber Atmosphärensensoren bewahren einen mit einer sekundengenauen Analyse der Geschehnisse in der Luft um einen herum davor, von schlechtem Wetter überrascht zu werden.
item.cyberware_scanner.desc=Dieser Millimeterwellenscanner ist hauptsächlich für die Entdeckung von Cyberware gedacht, kann aber auch andere Konterbande finden. Er lokalisiert das betreffende System oder Gerät, kann aber nicht identifizieren, um was es sich dabei handelt. Die maximale Reichweite beträgt 15 Meter.
item.geiger_counter.desc=Dieser Sensor misst die Menge der Radioaktivität, die ihn umgibt. Je schneller er klickt, desto näher ist man dem Strahlentod.
item.laser_range_finder.desc=Dieser Sensor sendet einen Laserstrahl aus, der von der Oberfläche eines Ziels reflektiert und von einem Detektor erfasst wird, um die genaue Entfernung zum Ziel zu berechnen.
item.mad_scanner.desc=Der MAD-Scanner (Magnetanomaliedetektion) wird für die Entdeckung von Waffen und anderen Metallkonzentrationen verwendet. Er hat eine maximale Reichweite von 5 Metern.
item.motion_sensor.desc=Dieser Sensor verwendet eine Mischung aus Ultraschall und niederenergetischem Infrarot, um Bewegungen und drastische Veränderungen in der Umgebungstemperatur zu entdecken. Die maximale Reichweite beträgt 25 Meter.
item.olfactory_sensor.desc=Der Geruchsscanner fängt die Moleküle der Luft ein und scannt sie. Er funktioniert genauso wie Geruchsbooster-Cyberware (S. 285).
item.ultrasound.desc=Der Ultraschallsensor besteht aus einem Emitter, der kontinuierlich Ultraschallimpulse ausstrahlt, und einem Empfänger, der die Echos der Impulse aufnimmt, um daraus eine topografische Ultraschallkarte zu erstellen. Ultraschall eignet sich hervorragend, um Oberflächenstrukturen zu erfassen, Entfernungen zwischen Objekten zu berechnen und Dinge wahrzunehmen, die für das nackte Auge unsichtbar sind (nimm das, Unsichtbarkeitszauber!). Der Sensor kann weder Farben noch Helligkeitsstufen unterscheiden, funktioniert dafür aber auch bei absoluter Dunkelheit. Er kann auch keine Materialien wie Glas durchdringen, die für optische Sensoren transparent sind. Man kann ihn in den passiven Modus schalten, sodass er keine Ultraschallimpulse emittiert, sondern nur Ultraschall aus anderen Quellen aufnimmt, wie etwa von Bewegungsmeldern oder anderen Ultraschallsensoren im aktiven Modus (oder von Fledermäusen).
item.camera_function.desc=Kameras sind recht weit verbreitet. Sie können Fotos, Videos oder Trideos aufnehmen und mit Sicht- und Au-dioverstärkungen ausgestattet werden.
item.directional_microphone_function.desc=Mit diesem Mikrofon kann man Unterhaltungen in bis zu 100 Metern Entfernung belauschen. Das Mikrofon muss auf das gewünschte Abhörziel gerichtet sein, und feste Objekte oder laute Geräusche innerhalb der Abhörlinie stören den Effekt.
item.laser_microphone_function.desc=Dieser Sensor wirft einen Laserstrahl gegen eine dünne, feste Oberfläche (z. B. eine Fensterscheibe), liest die Vibrationen auf der Oberfläche und übersetzt sie in die Geräusche, die auf der anderen Seite der Oberfläche ertönen. Die maximale Reichweite beträgt 100 Meter.
item.omni_directional_microphone_function.desc=Ein normales omnidirektionales Audioaufnahmegerät, für gewöhnlich eingebaut in oder (drahtlos oder per Kabel) verbunden mit einem Kommlink oder einem anderen Aufnahmegerät. Die maximale Reichweite beträgt 100 Meter. Mikroversionen sind mit einer Kapazität von 1 erhältlich, haben aber nur eine Reichweite von 5 Metern.
item.matrix_signal_scanner.desc=Der Signaldetektor zeigt die Matrix-Signalstärke des Objektes an, auf das man zielt.

