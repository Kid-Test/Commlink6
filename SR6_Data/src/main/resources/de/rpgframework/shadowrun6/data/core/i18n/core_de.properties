item.binoculars.desc=Ferngläser werden üblicherweise in der Hand gehalten und sind mit eingebauter Sichtvergrößerung ausgestattet. Sie sind in optischen (die lediglich mit einer Bildverbindung ausgestattet werden können) und elektronischen Versionen erhältlich (die eine Vielzahl von Sichtverstärkungen aufnehmen können). Spruchzauberer können ein optisches Fernglas verwenden, um Zauber gegen ferne Ziele zu wirken.
item.binoculars.variant.electronic.desc=Ferngläser werden üblicherweise in der Hand gehalten und sind mit eingebauter Sichtvergrößerung ausgestattet. Elektronische Versionen können eine Vielzahl von Sichtverstärkungen aufnehmen.
item.binoculars.variant.optical.desc=Ferngläser werden üblicherweise in der Hand gehalten und sind mit eingebauter Sichtvergrößerung ausgestattet. Optischen Versionen können lediglich mit einer Bildverbindung ausgestattet werden. Spruchzauberer können ein optisches Fernglas verwenden, um Zauber gegen ferne Ziele zu wirken.
item.camera.desc=Kameras sind recht weit verbreitet. Sie können Fotos, Videos oder Trideos aufnehmen und mit Sicht- und Audioverstärkungen ausgestattet werden. Es gibt auch Mikrokameras mit Kapazität 1.
item.microcamera.desc=Kameras sind recht weit verbreitet. Sie können Fotos, Videos oder Trideos aufnehmen und mit Sicht- und Audioverstärkungen ausgestattet werden. Es gibt auch Mikrokameras mit Kapazität 1.
item.contacts.desc=Kontaktlinsen werden direkt auf dem Auge getragen und sind praktisch nicht zu entdecken, doch dafür bieten sie auch nur wenig Raum für Sichtverstärkungen. Kontaktlinsen sind immer kabellos.
item.endoscope.desc=Dieses Glasfaserkabel ist mindestens einen Meter lang, wobei die ersten 20 Zentimeter auf jeder Seite aus myomerem Seil (S. 281) und einer optischen Linse bestehen. Es erlaubt dem Benutzer, um die Ecke, unter Türspalten hindurch oder in enge Spalte zu schauen. Endoskope sind in mehreren Längen erhältlich, allerdings können längere Segmente unhandlich sein.
item.glasses.desc=Brillen sind Linsen in einem Leichtbaurahmen, der auf der Nase getragen wird. Sie sind in zahlreichen Stilen erhältlich, und eine Brille mit Sichtverstärkungen ist auf den ersten Blick nur schwer von einer normalen Brille oder Sonnenbrille zu unterscheiden.
item.goggles.desc=Ein Sichtgerät ist relativ groß und wuchtig und wird am Kopf befestigt, wodurch es nicht so leicht zu entfernen ist. Dank ihrer Größe können Sichtgeräte eine Vielzahl an Sichtverstärkungen aufnehmen.
item.imaging_scope_single.desc=Dies sind Sichtvergrößerer und Anzeigegeräte, die für gewöhnlich auf Waffen montiert werden (s. Waffenzubehör, S. 261).
item.monocle.desc=Ein Monokel wird an einem Stirnband oder Helm mit einem herunterklappbaren Arm oder (für den altmodischen Look) an einer Kette getragen. Die Kettenversion ist mit einem leichten Adhäsivstoff versehen, sodass man nicht die ganze Zeit das Auge zusammenkneifen muss.
item.mage-sight-goggles.desc=Dieses schwere Sichtgerät ist mit einem myomerem Seil (S. 281) verbunden, das um ein Glasfaserkabel gewunden ist, welches in einer optischen Linse endet. Das Seil ist in Längen von 10, 20 oder 30 Metern erhältlich und erlaubt einem Spruchzauberer, Sichtkontakt aufrechtzuerhalten, während er selbst nicht zu sehen ist.
item.periscope.variant.standalone.desc=Diese L-förmige Röhre mit zwei Spiegeln ermöglicht es dem Benutzer, um Ecken herum zu sehen, zu schießen oder Zauber zu wirken (s. Waffenzubehör, S. 260).

item.flare_compensation.desc=Dieses Zubehör schützt sowohl vor blendenden Lichtblitzen als auch vor einfachem grellem Licht. Blitzkompensation gewährt 1 Bonus-Edge, wenn die Gegenseite keine Sichtverstärkung gegen grelles Licht hat, und hilft gegen Lichtblitze, wie sie etwa von einem Flash-Pack (S. 263) hervorgerufen werden.
item.image_link.desc=Die Bildverbindung zeigt visuelle Informationen (Text, Bilder, Filme, die aktuelle Uhrzeit usw.) im Blickfeld des Benutzers an. Üblicherweise geschieht dies mithilfe von AROs, aber man kann im Prinzip alles darauf anzeigen, was man will. Ein Team kann die Bildverbindung nutzen, um taktische und Lageinformationen in Echtzeit zu teilen. Man braucht eine Bildverbindung, um die AR wirklich zu sehen und an der modernen Welt teilzuhaben. Cyberware Version siehe Seite 286.
item.low_light_vision.desc=Dieses Zubehör erlaubt es einem, sogar dann noch normal zu sehen, wenn die Sterne die einzige Lichtquelle am Himmel sind. Restlichtverstärkung gewährt 1 Bonus-Edge, wenn die Gegenseite keine Sichtverstärkung hat, die schwaches Licht ausgleicht.
item.smartlink.desc=Dies ist die benutzerseitige Komponente des Smartgunsystems (S. 260). Ein Smartlink zeigt die Entfernung zu verschiedenen Zielen sowie den Munitionsstand (und die Art der Munition) an, und sie projiziert einen Zielpunkt an die Stelle, auf die die Waffe gerichtet ist, sofern der Punkt innerhalb des Sichtfelds des Benutzers liegt.
item.thermographic_vision.desc=Diese Sichtverstärkung ermöglicht das Sehen im infraroten Spektrum, wodurch man Hitzemuster erkennen kann. Das ist eine sehr praktische Methode, um Lebewesen in völliger Dunkelheit zu entdecken, um zu prüfen, ob ein Motor oder eine Maschine vor Kurzem gelaufen ist, und für ähnliche Zwecke. Infrarotsicht gewährt 1 Bonus-Edge, wenn die Gegenseite keine Sichtverstärkung hat, um schwaches Licht oder sogar völlige Dunkelheit auszugleichen.
item.ultrasound_link.desc=Dieses Zubehör liefert eine visuelle Darstellung der Daten eines Ultraschallsensors. Siehe Ultraschall, Seite 278.
item.vision_enhancement.desc=Dieses Zubehör schärft die Sicht eines Charakters auf alle Entfernungen und bietet ihm eine Sehschärfe, die eher der eines durchschnittlichen Falken als der eines durchschnittlichen Metamenschen ähnelt. Das System gewährt einen Würfelpoolbonus von +1 auf alle visuellen Wahrnehmungsproben.
item.vision_magnification.desc=Diese Zoomfunktion vergrößert die Sicht digital um das bis zu 50-Fache, wodurch man weit entfernte Ziele besser sehen kann. Die Angriffswerte für die Entfernungen Mittel, Weit und Sehr weit erhöhen sich um 2, sofern der verwendete Angriff überhaupt einen Angriffswert in der betreffenden Entfernung hat.

item.flare_compensation.variant.cybereye.desc=Dieses Zubehör schützt sowohl vor blendenden Lichtblitzen als auch vor einfachem grellem Licht. Blitzkompensation gewährt 1 Bonus-Edge, wenn die Gegenseite keine Sichtverstärkung gegen grelles Licht hat, und hilft gegen Lichtblitze, wie sie etwa von einem Flash-Pack (S. 263) hervorgerufen werden.
item.image_link.variant.cybereye.desc=Die Bildverbindung zeigt visuelle Informationen (Text, Bilder, Filme, die aktuelle Uhrzeit usw.) im Blickfeld des Benutzers an. Üblicherweise geschieht dies mithilfe von AROs, aber man kann im Prinzip alles darauf anzeigen, was man will. Ein Team kann die Bildverbindung nutzen, um taktische und Lageinformationen in Echtzeit zu teilen. Man braucht eine Bildverbindung, um die AR wirklich zu sehen und an der modernen Welt teilzuhaben. Cyberware Version siehe Seite 286.
