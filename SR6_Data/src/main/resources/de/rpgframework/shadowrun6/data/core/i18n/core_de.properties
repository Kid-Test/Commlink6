item.commlink.desc=Die implantierte Version des Kommlinks (S. 268) ist ohne zusätzliche Kosten mit einem Sim-Modul ausgestattet. Ein fest eingebautes Headware-Kommlink ist besonders bei Konzernagenten, Geschäftsleuten und Sararileuten beliebt, die häufig auf Reisen sind. Im Allgemeinen werden Kommlinks mit einer Gerätestufe von weniger als 5 aus Sicherheitsgründen nicht im Schädel eingebaut. Ein lahmgelegtes Headware-Kommlink verursacht 6K Schaden, gegen den mit Konstitution Widerstand geleistet wird.
item.commlink.variant.bodyware.desc=Die implantierte Version des Kommlinks (S. 268) ist ohne zusätzliche Kosten mit einem Sim-Modul ausgestattet. Ein fest eingebautes Headware-Kommlink ist besonders bei Konzernagenten, Geschäftsleuten und Sararileuten beliebt, die häufig auf Reisen sind. Im Allgemeinen werden Kommlinks mit einer Gerätestufe von weniger als 5 aus Sicherheitsgründen nicht im Schädel eingebaut. Ein lahmgelegtes Headware-Kommlink verursacht 6K Schaden, gegen den mit Konstitution Widerstand geleistet wird.
item.control_rig.desc=Dieses Implantat macht sich die Datenkoordinierungs- und Synchronisierungsfähigkeit des Mittelhirns zunutze, um geriggte Fahrzeuge und Drohnen (und andere Geräte mit einem Riggerinterface, wie etwa Geschütztürme) zu steuern. Die Riggerkontrolle hat ein eingebautes Sim-Modul, daher kann sie auch als DNI für andere Geräte genutzt werden. Außerdem ist sie mit einem Universal-Datenport und einem einziehbaren Kabel von etwa einem Meter Länge ausgestattet (als hätte man eine kostenlose Datenbuchse).\n Wenn man in ein Fahrzeug oder eine Drohne hineingesprungen ist, gewährt die Riggerkontrolle einen Würfelpoolbonus in Höhe ihrer Stufe auf alle Proben, bei denen es um das Steuern eines Fahrzeugs geht, sowie 1 Punkt Bonus-Edge.
item.control_rig.variant.echo_machine_mind.desc=Du erhältst die Vorteile einer Riggerkontrolle der Stufe 1 (S. 285). Dieses Echo kann nur einmal gewählt werden.
item.cortex_kink_bomb.desc=Diese illegale Methode der Nötigung gibt es in drei Geschmacksrichtungen: als Spleen-, Mikro- und Flächenbombe. Spleenbomben sollen nur einen Teil des Kopfes des Opfers beschädigen und damit entweder spezielle Headware nutzlos machen oder das Hirn schädigen, um Blindheit, Stottern, Gehörverlust oder andere Behinderungen hervorzurufen (5K Schaden, Widerstandsprobe auf Konstitution; das Opfer erhält den entsprechenden Status). Aber wenn irgendwo etwas im Kopf explodiert, laufen die Dinge natürlich nicht immer ganz nach Plan, und das Ergebnis kann etwas  heftig sein. Die Mikrobombe ist gerade groß genug, um ihren unglückseligen Träger zu töten (18K Schaden; Widerstandsprobe mit Konstitution). Flächenbomben töten das Opfer (Schaden für Opfer wie Mikrobombe) und beeinflussen einen Sprengbereich wie eine Splittergranate (S. 263), wogegen separat Widerstand geleistet werden muss. Die Bomben können fern- oder zeitgesteuert gezündet oder sogar so eingestellt werden, dass sie durch Geräuscherkennung losgehen. Wenn sie in Cybergliedmaßen eingebaut werden, sollen sie spezielle Komponenten (Spleenbombe) oder die ganze Gliedmaße (Mikrobombe) zerstören oder den Träger verletzen und einen Bereich in die Luft sprengen (Flächenbombe).
item.cortex_microbomb.desc=Diese illegale Methode der Nötigung gibt es in drei Geschmacksrichtungen: als Spleen-, Mikro- und Flächenbombe. Spleenbomben sollen nur einen Teil des Kopfes des Opfers beschädigen und damit entweder spezielle Headware nutzlos machen oder das Hirn schädigen, um Blindheit, Stottern, Gehörverlust oder andere Behinderungen hervorzurufen (5K Schaden, Widerstandsprobe auf Konstitution; das Opfer erhält den entsprechenden Status). Aber wenn irgendwo etwas im Kopf explodiert, laufen die Dinge natürlich nicht immer ganz nach Plan, und das Ergebnis kann etwas  heftig sein. Die Mikrobombe ist gerade groß genug, um ihren unglückseligen Träger zu töten (18K Schaden; Widerstandsprobe mit Konstitution). Flächenbomben töten das Opfer (Schaden für Opfer wie Mikrobombe) und beeinflussen einen Sprengbereich wie eine Splittergranate (S. 263), wogegen separat Widerstand geleistet werden muss. Die Bomben können fern- oder zeitgesteuert gezündet oder sogar so eingestellt werden, dass sie durch Geräuscherkennung losgehen. Wenn sie in Cybergliedmaßen eingebaut werden, sollen sie spezielle Komponenten (Spleenbombe) oder die ganze Gliedmaße (Mikrobombe) zerstören oder den Träger verletzen und einen Bereich in die Luft sprengen (Flächenbombe).
item.cortex_area_bomb.desc=Diese illegale Methode der Nötigung gibt es in drei Geschmacksrichtungen: als Spleen-, Mikro- und Flächenbombe. Spleenbomben sollen nur einen Teil des Kopfes des Opfers beschädigen und damit entweder spezielle Headware nutzlos machen oder das Hirn schädigen, um Blindheit, Stottern, Gehörverlust oder andere Behinderungen hervorzurufen (5K Schaden, Widerstandsprobe auf Konstitution; das Opfer erhält den entsprechenden Status). Aber wenn irgendwo etwas im Kopf explodiert, laufen die Dinge natürlich nicht immer ganz nach Plan, und das Ergebnis kann etwas  heftig sein. Die Mikrobombe ist gerade groß genug, um ihren unglückseligen Träger zu töten (18K Schaden; Widerstandsprobe mit Konstitution). Flächenbomben töten das Opfer (Schaden für Opfer wie Mikrobombe) und beeinflussen einen Sprengbereich wie eine Splittergranate (S. 263), wogegen separat Widerstand geleistet werden muss. Die Bomben können fern- oder zeitgesteuert gezündet oder sogar so eingestellt werden, dass sie durch Geräuscherkennung losgehen. Wenn sie in Cybergliedmaßen eingebaut werden, sollen sie spezielle Komponenten (Spleenbombe) oder die ganze Gliedmaße (Mikrobombe) zerstören oder den Träger verletzen und einen Bereich in die Luft sprengen (Flächenbombe).
item.cyberdeck.desc=Als die Konzerne die Matrix neu einrichteten und alles daransetzten, illegale Nutzungsmöglichkeiten ihres schönen neuen Systems zu verhindern, erlebte das Cyberdeck seine Wiederauferstehung als Werkzeug der Wahl, um sich an den Innereien der Matrix zu schaffen zu machen. In den Händen eines talentierten Deckers ist ein Cyberdeck eine mächtige Waffe. Die neuesten Modelle sehen ein bisschen aus wie mittelalterliche Armschützer, nur weniger klobig. Sie werden am Handgelenk getragen und können Tastaturen (oder was auch immer für ein Interface der User bevorzugt) auf den Arm des Users, irgendeine Oberfläche in der Nähe oder einfach nur in die Luft projizieren. Einige Modelle haben Monitore, die meisten nicht. Oft sehen sie aus wie ein unscheinbarer Geräteblock mit mehreren Anschlüssen, obwohl sich viele Decker drahtlos mit ihrem Deck verbinden. Weitere Informationen dazu findest du unter Geräte auf Seite 174. Alle Cyberdecks enthalten Sim-Module für heißes Sim.
item.cyberdeck.variant.bodyware.desc=Einfach gesagt hat man ein Deck in seinem Kopf. Das ist für Hacker, die viel unterwegs sind, sehr praktisch und wird deshalb oft von G-Men und Militärdeckern verwendet. Das Lahmlegen eines Headware-Decks verursacht 8K Schaden, gegen den mit Konstitution Widerstand geleistet wird.
item.cyberjack.desc=Während die Matrixprotokolle immer steifer und strenger wurden, blieb auch die Hackercommunity nicht untätig. Das jüngste Hilfsmittel, dass sich schnell von "ganz praktisch" zu "unverzichtbar" weiterentwickelt hat, ist die Cyberbuchse, die eine jener Gelegenheiten repräsentiert, bei denen die Shadowrunner das Wissen der Konzerne gegen diese verwendet haben. Basierend auf Konzernforschungen an Technomancern macht sich die Cyberbuchse die gewaltige Rechenkapazität des Gehirns zunutze, um Matrixprotokolle und Verschlüsselungsalgorithmen auszuhebeln. Mittlerweile gilt ein Decker ohne Cyberbuchse als in etwa so effektiv wie ein Decker ohne Cyberdeck. Die Cyberbuchse ist der wichtigste Schutz des Deckers gegen Hacking und bietet die Datenverarbeitungs- und Firewallstufen, die Cyberdecks heutzutage nicht mehr besitzen, und natürlich funktioniert sie auch als Standarddatenbuchse. Cyberbuchsen ermöglichen außerdem spezielle Matrix- Edge-Handlungen ( siehe S. 176).
item.datajack.desc=Eine Datenbuchse verleiht dem Benutzer ein direktes Neuralinterface (siehe S. 175). Außerdem ist sie mit einer einziehbaren Spule Mikrokabel (etwa einen Meter lang) ausgestattet, mit dem man sich über einen Universal-Datenport direkt mit jedem elektronischen Gerät verbinden kann. Datenbuchsen sind mit ihrem eigenen Speicher ausgestattet, um Dateien herunterzuladen oder zu speichern. Zwei Datenbuchsenbesitzer können sich mit einem Glasfaserkabel verbinden, um eine private mentale Unterhaltung zu führen, die nicht abgehört werden kann.
item.datalock.desc=Diese spezielle Datenbuchse ist bei Kurieren, Spionen, Diplomaten und Verbindungsleuten beliebt. Das Datenschloss verwandelt den Charakter praktisch in einen wandelnden Datensafe. Es hat eine Gerätestufe in Höhe seiner Stufe und schützt die Daten vor allen Unbefugten (was auch den Träger des Datenschlosses selbst einschließen kann). Datenschlösser sind nicht WiFi-fähig; auf sie kann nur über den Universal-Datenport zugegriffen werden. Tatsächlich hat auch der Träger des Implantats keinen mentalen Zugriff auf die Daten - er ist nur der Überbringer.
item.olfactory_booster.desc=Diese Cybernase verstärkt, identifiziert und zeichnet Gerüche auf und kann sie später wiedergeben. Die extrem verstärkten Geruchsfähigkeiten dieses Schnüfflers eröffnen einem eine ganz neue Welt sensorischer Daten - man kann Dinge wahrnehmen, die sonst nur ein Bluthund riechen würde. Man kann die Emotionen von Leuten in ihrem Schweiß riechen (und, sofern vorhanden, die Herstellermarkierung ihrer maßgeschneiderten Pheromone), Spuren von Munitionstreibladungen, Sprengstoffen oder biologischen und chemischen Kampfmitteln - die Liste ließe sich praktisch endlos fortführen. Eine Abschaltfunktion erlaubt es, intensive Gerüche komplett zu ignorieren - im täglichen Leben vielleicht die nützlichste Eigenschaft des Implantats. Der Geruchsbooster kann sogar in der VR verwendet werden, um eine noch eindringlichere Erfahrung zu schaffen. Der Benutzer erhält 1 Bonus-Edge für alle auf Geruch basierenden Wahrnehmungsproben, das jedoch verfällt, wenn er es bei der Probe nicht verwendet.
item.skilljack.desc=Diese Headware interpretiert Wissens- und Linguasofts für das Gehirn, sodass man sie nutzen kann, als wären es die eigenen Fähigkeiten. Sie kann auch Aktionssofts laufen lassen, die aber nur als Wissensfertigkeiten funktionieren, solange man keine Talentleitungen (S. 289) hat. Die Summe aller gleichzeitig laufenden Fertigkeiten auf der Talentbuchse kann das Doppelte ihrer Stufe nicht überschreiten, und die maximale Stufe einer darauf laufenden Fertigkeit ist gleich der Stufe der Talentbuchse. Das Starten von Fertigkeiten aus dem Speicher und das Anhalten von Fertigkeiten erfordern keine Handlung. Für Fertigkeiten, die man durch eine Talentbuchse hat, kann man kein Edge einsetzen.
item.taste_booster.desc=Der Geschmacksbooster erfüllt dieselbe Funktion wie der Geruchsbooster, außer dass er die Geschmacksknospen verstärkt. Er lässt einen außerdem Geschmacksdaten in der AR und VR mit einer "Geschmacksspur" erleben - aber ohne Gewähr, Chummer! Der Benutzer erhält 1 Bonus-Edge für alle auf Geschmack basierenden Wahrnehmungsproben, das aber verfällt, wenn es nicht für die Probe eingesetzt wird.
item.tooth_compartment.desc=Diese hohlen Zähne sind die älteste Cyberware auf dem Markt, und es gibt sie als Lager- und als zerbrechliches Modell. Das Lagermodell wird verwendet, um wirklich winzige Konterbande mit einem Seitenmaß von nicht mehr als 5 Millimetern zu schmuggeln. Die Gegenstände können über ein WiFi-Signal oder eine versteckte Arretierung entfernt werden. Das zerbrechliche Modell löst eine damit verbundene Wirkung (wie etwa die Aktivierung eines Peilsignals oder das Freisetzen eines tödlichen Giftes in den Mund - immer schön im Kopf behalten, was was ist!) durch ein WiFi-Signal aus oder dadurch, dass man hart auf den Zahn beißt.
item.ultrasound_sensor.desc=Diese implantierte Version des Ultraschallsensors (S. 278) ersetzt im aktiven Zustand die normale Sicht. Mit einer Nebenhandlung kann zwischen aktivem Sonar, passivem Sonar und deaktiviertem Zustand hin- und hergeschaltet werden.
item.voice_modulator.desc=Dieses Implantat verleiht eine perfekte Stimmbeherrschung und eine enorme stimmliche Flexibilität und Verzerrungsfähigkeit. Man kann ohne Anstrengung mit erhöhter Lautstärke (bis zu 100 Dezibel) sprechen oder die Stimme verändern, um perfekte Vogelrufe, lieblichen Gesang oder unheimliche stimmliche Eindrücke hervorzubringen. Der Modulator kann außerdem eine aufgezeichnete Stimme wiedergeben (und mehr oder weniger perfekt imitieren). Der Benutzer erhält 1 Bonus-Edge für alle auf Schall basierenden Überredenproben, das aber verfällt, wenn es nicht für die Probe eingesetzt wird.

