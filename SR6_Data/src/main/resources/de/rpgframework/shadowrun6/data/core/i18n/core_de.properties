lifestyle.street.desc=Du hast keinen Ort, an dem du dein müdes Haupt betten kannst. Du pennst bei irgendjemandem auf dem Sofa oder draußen unter den Sternen, und du schläfst, wenn sich die Gelegenheit bietet, und isst, was du findest. Du kannst nirgends deine Sachen unterbringen - wenn du es nicht bei dir trägst, wird es sehr wahrscheinlich gestohlen worden sein, sobald du dorthin zurückkehrst, wo du es zurückgelassen hast. Es ist ein hartes Leben, aber es ist billig! Wenn du keinen Lebensstil für den laufenden Monat bezahlt hast, lebst du auf der Straße. Üblich in E-Zonen.
lifestyle.squatter.desc=Die Sechste Welt hat eine Menge mitgemacht - Krankheiten, Katastrophen, Kriege und wirtschaftliche Aufschwünge und Zusammenbrüche. Viele der Leute, die diese Welt verlassen haben, haben ihren Lebensraum zurückgelassen, leer stehende Gebäude, die zur Benutzung freistehen, wenn man es schafft, hineinzugelangen - und sich mit unzulänglichen Bedingungen zufriedengibt (Gebäude stehen nicht ohne Grund leer). Sicherheit ist minimal bis nichtexistent - du kannst versuchen, eine verschließbare Tür zu finden, aber oft sind die Wände so wackelig und bröckelig, dass ein potenzieller Einbrecher die Tür einfach umgehen kann. Von Sanitärinstallationen und Heizung kannst du nur träumen. Aber wenn du Glück hast, ist deine Bude halbwegs trocken, und vielleicht kannst du deinen Nachbarn ein paar Nuyen zustecken, damit sie ein Auge auf deine Sachen haben (schließlich müssen die Unterprivilegierten der Welt ja zusammenhalten). Squatteressen ist nur eine Spur besser als beim Leben auf der Straße, da man es sich (meistens) nicht aus der Mülltonne sucht, aber es besteht zum größten Teil aus Soy-Fertiggerichten und anderem geschmacklosem Mist - dem modernen Äquivalent zum Waisenhaus-Haferschleim. Üblich in D-Zonen.
lifestyle.low.desc=So langsam wird es was. Im Unterschichtlebensstil wohnt man zumindest in einem Bau, der tatsächlich als Wohnung vorgesehen war. Gut, es mag ursprünglich ein Transportcontainer gewesen sein, aber irgendwann wurde er zu einer Wohnung umgebaut und es gibt Strom, fließendes Wasser (obwohl das an manchen Tagen und zu bestimmten Stunden abgeschaltet sein mag) und gerade genug Heizung, um nicht zu erfrieren. Die Türen lassen sich abschließen, und es gibt eine offizielle Adresse, und meistens kann man die Fastfoodlieferanten dazu bringen, einem ein paar McHugh's-Soyburger zu liefern. Die man sich manchmal tatsächlich leisten kann! Viele Shadowrunner haben diesen Lebensstil, ebenso wie die meisten der billigen Arbeiter, die von den Reichen dieser Welt im Allgemeinen ignoriert werden. Üblich in C-Zonen.
lifestyle.middle.desc=Allmählich kommt das gute Leben in Reichweite. Strom und fließendes Wasser rund um die Uhr, Polizisten, die mehr tun als nur verächtlich zu grienen, wenn man ein Verbrechen meldet, Mahlzeiten mit Geschmackszusätzen, die tatsächlich nach etwas schmecken, und nur ein geringes Risiko, in der Nähe der eigenen Wohnung überfallen zu werden. Ist das spektakulär? Nein, aber es ist sicher, und das ist in der Sechsten Welt immerhin selten genug, dass viele Leute zu so einigen Zugeständnissen bereit sind, um es zu bekommen. Üblich in B-Zonen.
lifestyle.high.desc=Beim Flug in einem Flugzeug in der Economy-Klasse kommt man in den Genuss, Trideosendungen zu sehen, die alle fünf bis zehn Minuten von Werbespots unterbrochen werden, bei denen man sich fragt, wer zum Teufel denn diesen ganzen Mist kauft. Aromatherapie-Fußmassierer? Schalterlose Weinflaschenöffner? Gartenfeuerstellen aus gespaltenen Felssteinen? Leute mit einem Oberschichtlebensstil sind die Zielgruppe dieser Werbung. Sie haben Geld zum Ausgeben und Platz, um die Sachen, die sie kaufen, auch hinzustellen. Und sie haben diesen tief sitzenden Drang, nicht zuzulassen, dass die Häuser ihrer Nachbarn beeindruckender sind als ihr eigenes. Sie essen gut, schlafen erholsam und haben Probleme, Leute zu verstehen, die sich über den Zustand der Welt beschweren, denn aus ihrer Sicht ist alles prima. Unter diesen Leuten zu leben, ist ein sicheres Anzeichen dafür, dass man es geschafft hat, aber man sollte sich nicht zu sehr auf seinen Lorbeeren ausruhen - die Toleranz dieser Leute für Eindringlinge ist gering, und sie haben Mittel und Wege, jene auszustoßen, von denen sie das Gefühl haben, dass sie nicht dazugehören. Die zusätzliche Sicherheit, für die man zahlt, könnte sich durchaus als notwendig erweisen. Üblich in A-Zonen.
lifestyle.luxury.desc=Die Spitze. Die Crème de la Crème. Leute mit diesem Lebensstil geben in einem Monat mehr aus als Squatter und Leute auf der Straße in mehreren Jahren oder gar ihrem ganzen Leben. Sie tun all die Dinge, von denen alle mit einem niedrigeren Lebensstil nur träumen können. Sie essen regelmäßig richtiges Essen. Sie schippern mit Jachten in die Karibik und tauchen in dem leuchtend blauen Wasser. Sie logieren in Hotels, in denen ihnen ganze Armeen von Bediensteten die Wünsche von den Augen ablesen. Trideoproduzenten stehen Schlange in der Hoffnung, Touren durch ihre Anwesen filmen zu können. Ihre alltägliche Realität ist surreal, aber jegliche Existenzangst, die womöglich aufkommen mag, lässt sich mit den exotischsten Alkoholika, den weichsten Kissen und den schönsten Aussichten, die man für Geld kaufen kann, einlullen. Und das fundamentale Prinzip der Sechsten Welt ist ja, dass man für Geld alles kaufen kann. Üblich in AA-Zonen.
lifestyle.z_zone.desc=Es gibt nur eines, das schlimmer ist, als auf der Straße zu leben... in einem urbanen Kriegsgebiet auf einer Straße zu leben.
lifestyle.aaa_zone.desc=Der goldene Käfig, in dem die Konzerne ihre wertvollsten Mitarbeiter gefangen halten.

