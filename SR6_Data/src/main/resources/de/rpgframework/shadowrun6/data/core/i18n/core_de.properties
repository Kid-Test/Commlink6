item.cyber_slide.desc=Funktioniert genauso wie das Waffenzubehör Springarm(S. 260).
item.cyber_holster.desc=Ein Cyberholster dient dem Verwahren einer Waffe - um sie leicht ziehen zu können, nicht um sie zu verstecken. Die Größe des Holsters hängt von der Größe der Gliedmaße ab.
item.external_clip_port.desc=Externer Munitionsport für Cyberwaffen
item.hydraulic_jacks.desc=Damit die Sprunghydraulik sinnvoll eingesetzt werden kann, braucht man eine in jedem Bein, und beide müssen die gleiche Stufe haben. Der Benutzer kann Sprungproben (S. 95) ablegen, wobei die Stufe der Sprunghydraulik als Würfelpoolbonus hinzuaddiert wird. Jeder Erfolg verlängert einen vertikalen Sprung um 0,1 Meter und einen horizontalen Sprung um 0,2 Meter. Die maximale Sprungweite bzw. -höhe erhöht sich um 20 %.
item.cyberjaw.desc=Ein Cyberkiefer sorgt für Extrabisskraft, wenn man seinem Gegner gerne sehr nahe kommt.
item.cyberjaw_augment.desc=Ein Cyberkiefer sorgt für Extrabisskraft, wenn man seinem Gegner gerne sehr nahe kommt.
item.hardening.desc=Durch diesen Prozess wird die Haut/Gliedmaße gehärtet, damit man effektiver zuschlagen kann. Bei einem waffenlosen Angriff hat der Benutzer einen Schadenswert von 3K (4K, wenn das Stärkeattribut 7 oder höher ist) und einen Angriffswert (Sehr nah) von 6.
item.hardening_augment.desc=Durch diesen Prozess wird die Haut/Gliedmaße gehärtet, damit man effektiver zuschlagen kann. Bei einem waffenlosen Angriff hat der Benutzer einen Schadenswert von 3K (4K, wenn das Stärkeattribut 7 oder höher ist) und einen Angriffswert (Sehr nah) von 6.
item.shock_limb.desc=An strategischen Punkten werden Elektroden eingebaut, die einer Zielperson taserartige Stromstöße versetzen können. Normalerweise wird dazu die Hand benutzt, aber in letzter Zeit erfreut sich der Schocktritt bei einigen Straßenkämpfern zunehmender Beliebtheit, und es gibt Geschichten von Kämpfern, die ihren Gegnern elektrisierende Kopfstöße verpassen.
item.shock_limb_augment.desc=An strategischen Punkten werden Elektroden eingebaut, die einer Zielperson taserartige Stromstöße versetzen können. Normalerweise wird dazu die Hand benutzt, aber in letzter Zeit erfreut sich der Schocktritt bei einigen Straßenkämpfern zunehmender Beliebtheit, und es gibt Geschichten von Kämpfern, die ihren Gegnern elektrisierende Kopfstöße verpassen.
item.handblade.desc=Die Handklinge ist eine einfache Klinge, die an der dem Daumen gegenüberliegenden Handkante implantiert wird.
item.handblade.variant.retractable.desc=Die einziehbare Handklinge ist eine einfache Klinge, die an der dem Daumen gegenüberliegenden Handkante implantiert wird. Die einziehbare Version hat im eingezogenen Zustand eine Tarnbarkeit von 8.
item.handrazors.desc=Nagelmesser sitzen unter den Fingernägeln oder ersetzen sie ganz und können wie Krallen eingesetzt werden.
item.handrazors.variant.retractable.desc=Nagelmesser sitzen unter den Fingernägeln oder ersetzen sie ganz und können wie Krallen eingesetzt werden. Wie bei der Handklinge hat das einziehbare Modell eine Tarnbarkeit von 8.
item.spurs.desc=Sporne werden im Handgelenk oder in den Handknöcheln implantiert und verleihen einem Faustschlag oder einer Ohrfeige eine schneidende Schärfe.
item.spurs.variant.retractable.desc=Sporne werden im Handgelenk oder in den Handknöcheln implantiert und verleihen einem Faustschlag oder einer Ohrfeige eine schneidende Schärfe. Die einziehbare Version hat eine Tarnbarkeit von 8.

