item.handheld_housing.desc=Sensoren können in Geräten installiert werden, die eine Kapazität haben. Die meisten Fahrzeuge und Drohnen sind serienmäßig mit einem Sensorarray ausgestattet (dessen Stufe in ihren Spielwerten angegeben ist). Auch wandmontierte Sensorgehäuse und solche für den Handbetrieb sind erhältlich.\n Nicht jede Art von Sensorpaket ist in der Lage, jeden Sensor aufzunehmen. Welche Sensorstufe in welcher Art von Gehäuse bzw. Gerät eingebaut werden kann, hängt zum einen von den Kapazitätskosten (s. Tabelle Sensoren, S. 277), zum anderen vom Gerätetyp (s. Tabelle Sensorpakete, S. 277) ab. Zum Beispiel könnte ein tragbares Gehäuse entweder ein Sensorarray der Stufe 3 oder bis zu drei Einzelsensoren aufnehmen, die aber ebenfalls maximal Stufe 3 haben dürfen. Ein stationäres Gehäuse wiederum könnte zum Beispiel entweder ein Sensorarray der Stufe 4 und zwei Einzelsensoren mit maximal Stufe 4 oder bis zu sechs Einzelsensoren mit maximal Stufe 4 aufnehmen. Sensorarrays und Einzelsensoren mit höheren Stufen können gemäß der Tabelle Sensorpakete nur in größeren Ausrüstungsgegenständen verbaut werden.
item.wall-mounted_housing.desc=Sensoren können in Geräten installiert werden, die eine Kapazität haben. Die meisten Fahrzeuge und Drohnen sind serienmäßig mit einem Sensorarray ausgestattet (dessen Stufe in ihren Spielwerten angegeben ist). Auch wandmontierte Sensorgehäuse und solche für den Handbetrieb sind erhältlich.\n Nicht jede Art von Sensorpaket ist in der Lage, jeden Sensor aufzunehmen. Welche Sensorstufe in welcher Art von Gehäuse bzw. Gerät eingebaut werden kann, hängt zum einen von den Kapazitätskosten (s. Tabelle Sensoren, S. 277), zum anderen vom Gerätetyp (s. Tabelle Sensorpakete, S. 277) ab. Zum Beispiel könnte ein tragbares Gehäuse entweder ein Sensorarray der Stufe 3 oder bis zu drei Einzelsensoren aufnehmen, die aber ebenfalls maximal Stufe 3 haben dürfen. Ein stationäres Gehäuse wiederum könnte zum Beispiel entweder ein Sensorarray der Stufe 4 und zwei Einzelsensoren mit maximal Stufe 4 oder bis zu sechs Einzelsensoren mit maximal Stufe 4 aufnehmen. Sensorarrays und Einzelsensoren mit höheren Stufen können gemäß der Tabelle Sensorpakete nur in größeren Ausrüstungsgegenständen verbaut werden.
item.sensor_array.desc=Dieses Sensorpaket kann so viele der unter Sensorfunktionen (S. 278) aufgelisteten Funktionen enthalten, wie seiner Stufe entspricht. Diese Funktionen müssen beim Kauf des Sensorarrays festgelegt werden, ihr Preis ist aber bereits in dem des Sensorarrays enthalten. Wenn man ein Sensorarray für Wahrnehmungsproben verwendet, kann man die Sensorstufe anstelle der Fertigkeit Wahrnehmung einsetzen. Sensorarrays haben eine Stufe von 2 bis 8.
item.single_sensor.desc=Ein Einzelsensor kann nur eine der unter Sensorfunktionen (S. 278) aufgelisteten Funktionen enthalten. Diese Funktion muss beim Kauf des Sensors festgelegt werden, ihr Preis ist aber bereits im Preis des Sensors enthalten. Einzelsensoren haben eine Stufe von 1 bis 8.

