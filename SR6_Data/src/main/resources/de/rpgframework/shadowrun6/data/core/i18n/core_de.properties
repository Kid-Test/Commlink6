action.reroll_one.desc=Nimm einen Würfel und wirf ihn neu. Es kann einer von deinen sein oder einer deines Gegners, aber das neue Ergebnis gilt auf jeden Fall, was auch immer du wirfst. Dieser Boost wird ausgeführt, nachdem alle Proben abgelegt wurden.
action.plus_3_ini.desc=Diese Wirkung setzt normalerweise ein, bevor der Kampf überhaupt begonnen hat. Du kannst 1 Punkt Edge ausgeben, um dein Initiativeergebnis um 3 zu erhöhen. Du kannst den Boost aber auch während eines Kampfes einsetzen, wenn du für den Rest des Kampfes in der Initiative-Reihenfolge früher an der Reihe sein willst.
action.plus_1_roll.desc=Du kannst das Ergebnis eines Würfels um +1 erhöhen, etwa um aus einer 4 eine 5 zu machen (und einen zusätzlichen Erfolg zu erzielen) oder um eine 1 in eine 2 zu verwandeln (um einen Patzer zu vermeiden).
action.give_ally_1_edge.desc=Du tust irgendetwas, das einem anderen Mitglied deines Teams einen Vorteil verschafft. Gib 2 Edge aus und schenke einem Teamgefährten 1 Punkt davon.
action.negate_1_edge.desc=Warum den Bösen einen Vorteil lassen, wenn es nicht nötig ist? Du gibst 2 Edge aus, aber ein Gegner deiner Wahl verliert ebenfalls 1 Edge.
action.buy_auto_hit.desc= Du erhältst einen automatischen Erfolg, den du zu den Erfolgen deiner Probe hinzuaddierst. Es bedeutet nicht, dass deine Probe automatisch erfolgreich ist, sondern es ist nur ein Erfolg, der zu den erwürfelten hinzukommt.
action.heal_1_stun.desc=Du reißt dich zusammen und radierst ein gefülltes Kästchen auf deinem Zustandsmonitor für Betäubungsschaden aus.
action.add_edge_pool.desc=Erhöhe deinen Würfelpool um dein Edge-Attribut und lass die 6en explodieren. "Explodieren" bedeutet, dass eine 6 als Erfolg zählt und noch einmal gewürfelt werden kann, um möglicherweise einen weiteren Erfolg zu erzielen. Gibt es einen Erfolg (also eine 5 oder 6), so notiere ihn; fällt wieder eine 6, kann der Würfel erneut geworfen werden. Wird nach einer 6 eine 1 gewürfelt, so zählt sie nicht für die Ermittlung eines Patzers mit.
action.heal_1_physic.desc=Du radierst ein gefülltes Kästchen auf deinem Körperlichen Zustandsmonitor aus - du bist deinen Gegnern so überlegen, dass sie dich doch nicht so hart getroffen haben wie zunächst gedacht.
action.reroll_failed.desc= Nach einem Würfelwurf kannst du alle Würfel, die keinen Erfolg erzielt haben, neu werfen. Allerdings kann dieser Edge-Boost nicht eingesetzt werden, wenn du einen Patzer oder Kritischen Patzer erzielt hast.
action.count_2_glitch.desc= Es wird Zeit, zum Gegenangriff überzugehen! Wenn ein Gegner würfelt, zählen sowohl seine 1en als auch seine 2en bei der Bestimmung eines Patzers oder Kritischen Patzers.
action.create_special.desc= Setze deine Kreativität ein! Gib 5 Edge aus, und etwas Spektakuläres geschieht. Was genau das ist, bleibt dir und dem Spielleiter überlassen, aber es sollte das Glück auf jeden Fall leicht zu deinen Gunsten wenden. Ein platzendes Wasserrohr, näher kommende Sirenen, ein plötzlich auftauchender DocWagon, ein wütender Geist, irgendetwas, das deiner Seite einen kleinen Vorteil verschafft oder die Gegner etwas aus dem Konzept bringt.

