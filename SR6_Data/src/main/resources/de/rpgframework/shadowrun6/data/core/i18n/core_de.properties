skill.perception.skillspec.desert=Umgebung Wüste
skill.perception.skillspec.urban=Umgebung Stadt
skill.perception.skillspec.other=Umgebung Sonstige
skill.piloting=Steuern
skill.piloting.page=98
skill.piloting.desc=Steuern kommt immer dann zum Einsatz, wenn ein Charakter ein anspruchsvolles Manöver mit einem Fahrzeug durchführen möchte (und ist deshalb eine essenzielle Fähigkeit für alle Rigger). Generell sind Steuernproben Einfache Proben auf Steuern + Reaktion. Der Schwellenwert ist im Regelfall gleich dem Handlingwert des gesteuerten Fahrzeugs, kann aber in Abhängigkeit von der Komplexität des jeweiligen Manövers auch höher sein (Spielleiterentscheid). Manchmal werden Steuernproben auch eingesetzt, um Verfolger abzuschütteln, jemanden zu verfolgen oder andere Aktionen abzuhandeln, die mehr als ein Fahrzeug betreffen.
skill.piloting.skillspec.ground_craft=Bodenfahrzeuge
skill.piloting.skillspec.aircraft=Luftfahrzeuge
skill.piloting.skillspec.watercraft=Wasserfahrzeuge
skill.sorcery=Hexerei
skill.sorcery.page=98
skill.sorcery.desc=Die Anwendungsmöglichkeiten der Fertigkeit Hexerei sind vielfältig - zu vielfältig, um sie hier abdecken zu können. Im Kapitel Magie findest du genauere Informationen zu Zaubern (S. 133), Antimagie (S. 145) und anderen Einsatzgebieten.
skill.sorcery.skillspec.counterspelling=Antimagie
skill.sorcery.skillspec.ritual_spellcasting=Ritualzauberei
skill.sorcery.skillspec.spellcasting=Spruchzauberei
skill.stealth=Heimlichkeit
skill.stealth.page=97
skill.stealth.desc=Wie der Name schon sagt, sollten Shadowrunner möglichst auf Unauffälligkeit bedacht sein. Das macht Heimlichkeit zu einer sehr wertvollen Fertigkeit. Sie deckt alle Aktivitäten ab, die Charaktere unbemerkt von anderen durchführen möchten: Wenn du in eine Forschungsanlage einbrechen oder einem Mafia-Don einen Credstick unter der Nase wegstehlen möchtest, dann kommt Heimlichkeit zum Einsatz. In der Regel wird zu Beginn eines solchen Unterfangens eine Probe auf Heimlichkeit + Geschicklichkeit abgelegt. Die dabei erzielten Erfolge bestimmen den Schwellenwert für andere, die bemerken wollen, was der Charakter im Schilde führt. Manchmal versucht ein Charakter auch spontan, sich möglichst heimlich zu verhalten. In diesem Fall wird eine Vergleichende Probe auf Heimlichkeit + Geschicklichkeit gegen Wahrnehmung + Intuition abgelegt.
skill.stealth.skillspec.camouflage=Tarnung
skill.stealth.skillspec.disguise=Verkleiden
skill.stealth.skillspec.palming=Fingerfertigkeit
skill.stealth.skillspec.sneaking=Schleichen
skill.tasking=Tasken
skill.tasking.page=98
skill.tasking.desc=Diese Fertigkeit wird von Technomancern für ihre Technomanceraktivitäten verwendet. Weitere Informationen dazu findest du im Abschnitt Technomancer auf Seite 188.
skill.tasking.skillspec.compiling=Kompilieren
skill.tasking.skillspec.decompiling=Dekompilieren
skill.tasking.skillspec.registering=Registrieren
skill.language=Sprache
skill.language.page=100
skill.language.desc=Die Sechste Welt ist die Heimat einer Vielzahl von Sprachen. Alle Sprachen, die wir aus unserer Welt kennen, existieren auch weiterhin, aber dazu kommen noch einige neue, beispielsweise Sperethiel, die Sprache der Elfen, Or'zet, die Sprache der Orks, und Stadtsprech, die Sprache der Straßen. Zu wissen, welche Sprache man wählen muss, kann entscheidend sein, wenn man jemandem eine geheime Information entlocken oder eine gute Beziehung zu einer wichtigen Connection aufbauen möchte.\nSprachfertigkeiten sind Wissensfertigkeiten mit Spezialisierungsstufen.
skill.knowledge=Wissen
skill.knowledge.page=100
skill.knowledge.desc=Da auf Wissensfertigkeiten keine direkten Fertigkeitsproben abgelegt werden, verfügen sie nicht über Fertigkeitswerte. Stattdessen kommen sie zum Einsatz, wenn ein Charakter die Chance hat, im Zuge anderer Proben zusätzliche Informationen zu erhalten. Verfügt ein Charakter beispielsweise über die Wissensfertigkeit Sicherheitssysteme und legt dann eine Wahrnehmungsprobe ab, um den Außenbereich einer Konzernanlage genauer unter die Lupe zu nehmen, dann kann er mit dieser Probe vielleicht erkennen, wo sich Kameras befinden und wann Streifen vorbeikommen. Wenn ein Charakter die Wissensfertigkeit Seattler Gangs besitzt, wird ihm eine erfolgreiche Wahrnehmungsprobe vielleicht verraten, dass die Personen, die sich ihm gerade nähern, Mitglieder der Gang der Halloweeners sind. Die Wissensfertigkeit Straßen von Seattle könnte sich bei Naturproben im Raum Seattle als hilfreich erweisen. Die Spieler können zudem Proben auf Erinnerungsvermögen (S. 37) ablegen, um sich an bestimmte Fakten aus Themengebieten zu erinnern, die durch ihre Wissensfertigkeiten abgedeckt sind.\nGrundsätzlich dürfen Wissensfertigkeiten nicht ungeübt eingesetzt werden.

