item.kit.desc=Eine Kiste ist tragbar und enthält das grundlegende Werkzeug für Standardreparaturen. Ohne zumindest eine Kiste ist eine Fertigkeit unter Umständen gar nicht anwendbar.
item.shop.desc=Einen Laden kann man hinten in einem Lieferwagen transportieren. Er enthält kompliziertere Werkzeuge für Bau und Reparatur. Ein Laden gewährt einen Würfelpoolbonus von +1 für entsprechende Proben vor Ort und enthält die wichtigsten Standardersatzteile.
item.facility.desc=Eine Werkstatt muss in einem Gebäude untergebracht werden und ist wegen der schweren und unhandlichen Maschinen, die sie enthält, nicht transportabel, aber dafür kann sie auch für sehr komplizierte Bauten und Modifikationen verwendet werden. Eine Werkstatt bietet den gleichen Bonus und die gleichen Ersatzteile wie ein Laden, dazu 1 Bonus-Edge für Bauen/Reparieren-Proben, und bei Ausgedehnten Proben innerhalb der Werkstatt kann Edge eingesetzt werden.

