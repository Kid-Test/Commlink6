item.scratch_built_junk.desc=Riggerkonsolen sind für jeden Rigger wichtig, der mit Drohnen oder ferngesteuerten Fahrzeugen arbeitet - also für fast jeden Rigger. Mit ihr kann man mehrere Drohnen oder Fahrzeuge gleichzeitig steuern. Eine Riggerkonsole kann gleichzeitig mit [Gerätestufe × 3] Slave-Drohnen verbunden werden. Mit einer Haupthandlung kann der Rigger beliebig vielen Drohnen, die gerade als Slaves mit der Riggerkonsole verbunden sind, den gleichen Befehl erteilen. Die Drohnen führen den Befehl anschließend aus, sobald sie in der Initiative an der Reihe sind.\nEine Riggerkonsole ermöglicht dem Rigger jedoch nicht nur die gleichzeitige Steuerung mehrerer Drohnen - sie schützt seine Drohnen auch vor Hacking-Angriffen. Jeder Hacker, der sich Zugriff auf die Drohnen-Slaves verschaffen will, muss dazu zuerst die Riggerkonsole hacken. Zur Verteidigung gegen Hacking-Angriffe verfügen Riggerkonsolen über eine eigene Datenverarbeitungs- und Firewallstufe. Ihr Datenverarbeitungsattribut wird auch zur Berechnung der Initiative herangezogen, wenn die Riggerkonsole in der VR genutzt wird.
