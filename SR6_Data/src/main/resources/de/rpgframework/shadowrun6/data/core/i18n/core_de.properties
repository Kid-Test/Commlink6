action.de_activate_focus.desc=Ein Charakter kann mit einer Nebenhandlung einen gebundenen Fokus, den er bei sich führt, aktivieren oder deaktivieren.
action.avoid_incoming.desc=Ein Charakter kann diese Handlung ausführen, wenn er nicht an der Reihe ist, um sich vor einem Spreng- oder Gas angriff in Sicherheit zu bringen. Für diese Handlung legt der Spieler eine Probe auf Athletik + Reaktion - Ausweichenmalus (s. Kasten Ausweichenmalus) ab. Der Charakter kann sich so viele Meter, wie er Erfolge bei der Probe erzielt, in eine Richtung seiner Wahl bewegen, wobei er das Ergebnis der Richtungsabweichung des Angriffs erst erfährt, nachdem er sich für eine Fluchtrichtung entschieden hat. Bewegt er sich mehr als 2 Meter weit, wirft er sich am Ende der Bewegung zu Boden und befindet sich fortan im Status Liegend. Diese Handlung kann nicht ausgeführt werden, wenn der Charakter in dieser Kampfrunde bereits eine Handlung Weghechten, Bewegen oder Sprintenausgeführt hat, und er kann danach nicht noch einmal in dieser Kampfrunde eine Handlung Weghechten, Bewegenoder Sprinten ausführen.
action.block.desc=Der Charakter kann seine Nahkampf-Fertigkeit zu einer einzelnen Verteidigungsprobe im Nahkampf hinzuaddieren. Die Verteidigungsprobe muss zur selben Zeit erfolgen, zu der die Handlung ausgeführt wird.
action.call_a_shot.desc=Durch diese Handlung erhöht man den Schaden eines Angriffs um 2, indem man einen Würfelpoolmalus von -4 auf die Angriffsprobe hinnimmt. Diese Handlung muss mit der Handlung Angriff kombiniert werden. Durch Einsatz von Edge kann der Malus verringert oder völlig aufgehoben werden (siehe S. 48).
action.change_device_mode.desc=Ein Charakter kann eine Nebenhandlung aufwenden, um eines Cyberdecks auf versteckten Modus, das Abschalten der WiFi-Funktion eines Gerätes usw.
action.command_drone.desc=Ein Charakter kann einen Befehl an eine Drohne übermitteln, die er kontrolliert. Werden mehrere Drohnen über eine Drohnen erteilt werden. Soll jede Drohne einen eigenen Befehl erhalten, muss diese Handlung mehrfach durchgeführt werden (was jedes Mal eine eigene Nebenhandlung ist).
action.command_spirit.desc=Mit dieser Handlung befiehlt der Charakter einem einzelnen Geist oder einer Gruppe von Geistern unter seiner Kontrolle einen Dienst oder entlässt sie. Der Dienst muss für alle Geister der gleiche sein. Sollen verschiedene Geister verschiedene Dienste leisten, muss diese Handlung mehrfach durchgeführt werden (was jedes Mal eine eigene Nebenhandlung ist).
action.dodge.desc=Ein Charakter kann seine Athletik-Fertigkeit zu einer einzelnen Verteidigungsprobe (S. 108) im Kampf hinzuaddieren. Die Verteidigungsprobe muss zur selben Zeit erfolgen, zu der die Handlung ausgeführt wird.
action.drop_object.desc=Der Charakter kann einen Gegenstand, den er in der Hand hält, in einer Nebenhandlung fallen lassen. Der Gegenstand (oder die Gegenstände) fällt zu Boden und kann dabei je nach Fallhöhe und Bodenbeschaffenheit beschädigt werden (Entscheidung des Spielleiters).
action.drop_prone.desc=Ein Charakter kann sich in einer Nebenhandlung auf den Boden werfen. Er gelangt in den Status Liegend (S. 54), bis er die Handlung Aufstehen ausführt.
action.hit_the_dirt.desc=Ein Charakter kann sich zu Defensivzwecken flach auf den Boden fallen lassen, was ihm einen Würfelpoolbonus von +2 für die Verteidigungsprobe gegen einen gegen ihn gerichteten Angriff verschafft. Er gelangt in den Status Liegend (S. 54) und erleidet wegen der überstürzten Deckungnahme bis zum Ende der folgenden Runde, oder bis er die Handlung Aufstehen ausführt, einen Würfelpoolmalus von -2 auf jede Probe mit Aktionsfertigkeiten.
action.intercept.desc=Wenn sich ein Gegner in Nahkampfdistanz am Charakter vorbeibewegt, kann der Charakter mit der Handlung Abfangen die Initiativereihenfolge verlassen und eine Handlung Angriff ausführen, sofern ihm für diese Runde noch eine Nebenhandlung und eine Haupthandlung zur Verfügung stehen (weil er entweder erst nach dem Gegner an der Reihe ist oder entsprechende Handlungen aufgespart/umgewandelt hat). Ist das nicht der Fall, kann er Abfangen nicht durchführen. Abfangen ist nicht für einen Angriff mit Fernkampfwaffen einsetzbar.
action.move.desc=Ein Charakter kann diese Nebenhandlung ausführen, um sich bis zu 10 Meter weit zu bewegen. Diese Handlung ist nur einmal pro Kampfrunde möglich.
action.multiple_attacks.desc=Ein Charakter kann mehr als einen Gegner angreifen, sofern Munition, Reichweite und Feindpositionen es zulassen. Dabei teilt der Spieler seinen Würfelpool gleichmäßig auf die Gegner auf. Verwendet er zwei verschiedene Angriffsarten, weist er jeder die Hälfte des jeweiligen Würfelpools (abgerundet) zu. Diese Handlung muss zusammen mit einer Haupthandlung Angriff ausgeführt werden. Details findest du auf Seite 114.
action.quick_draw.desc=Mit dieser Nebenhandlung kann ein Charakter schnell eine Pistole, eine pistolengroße Waffe oder eine kleine Wurfwaffe ziehen und sofort damit angreifen. Diese Handlung muss zusammen mit einer Haupthandlung Angriff ausgeführt werden. Der Charakter muss die nötige Ausrüstung oder Bodytech oder einen entsprechenden Vorteil besitzen, die oder der diese Handlung ermöglicht - hat er so etwas nicht, steht ihm diese Handlung nicht zur Verfügung.
action.reload_smartgun.desc=Ein Charakter mit einer schussbereiten Smartgun kann einen gedanklichen Befehl erteilen, das Magazin der Waffe auszuwerfen, während er gleichzeitig mit einer schnellen Bewegung ein neues einlegt, vorausgesetzt, die neue Munition ist griffbereit verfügbar.
action.shift_perception.desc=Ein Charakter, der der astralen Wahrnehmung mächtig ist, kann seine Wahrnehmung in den Astralraum oder zurück verlagern.
action.stand_up.desc=Egal, ob ein Charakter sich freiwillig zu Boden geworfen hat oder niedergeschlagen wurde, mit dieser Handlung kann er wieder auf die Beine kommen und sich des Status Liegend (S. 54) entledigen.
action.take_aim.desc=Durch diese Handlung erhält der Charakter einen Würfelpoolbonus von +1. Die Handlung kann nur einmal pro Kampfrunde ausgeführt werden, aber wenn der Bonus nicht verwendet wird, wird er auf die nächste Kampfrunde übertragen; dadurch ist es möglich, Boni über mehrere Kampfrunden anzusammeln. Kommt der Charakter in einer Kampfrunde an die Reihe und führt keine Handlung Zielen oder Angriff aus, verfallen Boni aus früheren Runden. Der maximale Würfelpool, der durch diese Handlung angesammelt werden kann, ist gleich der Willenskraft des Charakters. Ein Charakter kann mit einer schussbereiten Feuerwaffe, einer Armbrust, einem Bogen, einer exotischen Fernkampfwaffe oder einer Wurfwaffe zielen.<br/> Verwendet der Charakter eine Sichtvergrößerung oder ein Zielfernrohr, dient die Handlung Zielen dazu, das Ziel zu erfassen, um den Bonus des Gerätes oder der Modifikation nutzen zu können. In diesem Fall bringt die erste Handlung Zielen noch keinen zusätzlichen Bonus, sondern aktiviert nur das Gerät oder die Modifikation.
action.take_cover.desc=Der Charakter nutzt irgendetwas in seiner Umgebung, um Deckung zu suchen, muss dafür aber auch die Einschränkungen beachten, die die Deckung mit sich bringt. Durch diese Handlung gelangt der Charakter in den Status Deckung I, II, III oder IV (siehe S. 54).
action.trip.desc=Diese Handlung ist mehr darauf ausgerichtet, das Ziel zu Boden zu bringen, als Schaden anzurichten. Sie kann nur bei einem Nahkampfangriff ausgeführt werden und nur zusammen mit einer Haupthandlung Angriff. Der Schaden des Angriffs sinkt um 2. Ist der Angriff erfolgreich, legt das Ziel eine Probe auf Athletik + Geschicklichkeit mit einem Schwellenwert ab, der dem modifizierten Schaden des Angriffs entspricht. Misslingt die Probe, gelangt es in den Status Liegend.
action.augmentation_overdrive.desc=Ein Charakter kann mit einer Nebenhandlung ein einzelnes attributssteigerndes Cyberwaresystem übersteuern, sodass die Stufe der betreffenden Cyberware für eine einzige Handlung um 2 erhöht wird (wodurch das betroffene Attribut auch um mehr als +4 gesteigert werden kann). Einer der Bonuswürfel muss ein Schicksalswürfel sein. Ein Patzer beim Übersteuern führt dazu, dass sich das betroffene System für [Stufe] Kampfrunden aufhängt und abschaltet. Bei einem Kritischen Patzer verkrampft sich der betreffende Muskel, und das Attribut fällt für [Stufe] Kampfrunden auf 0. Das Übersteuern ist für jede Cyberware möglich, die ein Körperliches oder Geistiges Attribut steigert, nicht aber für andere Bodytech.

