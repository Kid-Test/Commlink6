item.data_tap.wifi=Die Datenwanze kann mit einer Nebenhandlung per WiFi angewiesen werden, sich selbst zu vernichten, wodurch sofort die direkte Verbindung getrennt wird. Der Benutzer kann entscheiden, ob dabei das Kabel beschädigt und die Kabelverbindung zwischen den Geräten unterbrochen wird oder ob das Kabel intakt bleibt und lediglich die Verbindung zur Wanze getrennt wird, von der nur kleines Häufchen Asche übrig bleibt.
