item.feedback_feature.desc=Diese haptische Kleidung ermöglicht es, die taktile Komponente einer AR-Erfahrung zu erleben.
item.electrochromic_feature.desc=Elektrochrome Fäden können bei unterschiedlicher Spannung die Farbe wechseln, womit man die Farbe seiner Kleidung verändern oder Texte, Bilder oder Muster anzeigen kann. Das ist allein schon aus modischen Gesichtspunkten praktisch, aber noch besser eignet es sich dazu, in einer Menschenmenge zu verschwinden, wenn man einen schnellen Kostümwechsel braucht. Man kann selbst Panzerkleidung in elektrochromer Ausführung bekommen. Das Verändern der Einstellungen von elektrochromer Kleidung erfordert eine Nebenhandlung, aber der Farbwechsel ist erst nach zwei Kampfrunden komplett.
item.chemical_protection.desc=Diese Modifikation schützt den Träger vor chemischen Angriffen mit einem Kontaktvektor (s. Toxine und Drogen, S. 124). Die Spezialbeschichtung neutralisiert den Status Verätzt für eine Anzahl von Angriffen, die ihrer Stufe entspricht. Danach ist die Beschichtung so abgenutzt, dass sie keine chemische Isolierung mehr bietet.
item.chemical_seal.desc=Die chemische Versiegelung ist nur für Ganzkörperpanzerungen erhältlich. Sie besteht aus einer luftdichten Umweltsteuerung, die mit einer Haupthandlung aktiviert werden kann. Die Versiegelung schützt den Träger vor jedem Status, der von Chemikalien mit Kontakt- oder Inhalationsvektor Die chemische Versiegelung ist nur für Ganzkörperpanzerungen erhältlich. Sie besteht aus einer luftdichten Umweltsteuerung, die mit einer Haupthandlung aktiviert werden kann. Die Versiegelung schützt den Träger vor jedem Status, der von Chemikalien mit Kontakt- oder Inhalationsvektor
item.cold_resistance.desc=Thermalfasern und hitzehaltende Materialien schützen den Träger. Diese Modifikation neutralisiert den Status Unterkühlt so viele Male, wie ihrer Stufe entspricht; danach ist die spezielle Beschichtung so abgenutzt, dass sie keine Kälteresistenz mehr bietet.
item.fire_resistance.desc=Feuerdämmende, nicht brennbare Materialien schützen den Träger. Diese Modifikation neutralisiert den Status Brennend so viele Male, wie ihrer Stufe entspricht; danach ist die spezielle Beschichtung so angegriffen, dass sie keine Feuerresistenz mehr bietet.
item.electricity_resistance.desc=Elektrische Isolierung und nichtleitende Materialien schützen den Träger. Diese Modifikation neutralisiert den Status Gebrutzelt so viele Male, wie ihrer Stufe entspricht; danach ist die spezielle Beschichtung so angegriffen, dass sie keine Resistenz gegen Elektrizität mehr bietet.

