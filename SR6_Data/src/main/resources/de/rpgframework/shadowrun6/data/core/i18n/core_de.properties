action.anticipation.desc=Du führst diesen Kampf wie eine Schachpartie und bist deinen Gegnern mehrere Züge voraus. Wenn du diese Edge-Handlung mit einem Mehrfachangriff durchführst, verdoppelst du deinen Würfelpool und teilst ihn dann so gleichmäßig wie möglich zwischen den einzelnen Zielen auf.
action.big_speech.desc=Ein Strom von Worten verlässt deinen Mund und schwingt sich zu Höhen der Beredsamkeit und Inspiration auf, wie man es bei Sterblichen selten findet. Lege zweimal eine Probe auf Einfluss + Charisma ab; die erste Probe gilt als Teamworkprobe, d. h. du kannst deine Erfolge als Würfelpoolbonus bei der zweiten Probe verwenden. Das Ergebnis der zweiten Probe liefert die Erfolge deiner Probe.
action.bring_the_drama.desc=Während du deine Überredungskünste einsetzt, gelangst du an einen Punkt, an dem ein bisschen zusätzliches Drama angebracht wäre - und du lieferst es! Vielleicht ist es eine dramatische Rede, vielleicht sind es ein paar Tränen oder herzergreifende Schauspielkunst, aber was es auch ist, du appellierst direkt an das Herz des Ziels und ziehst es auf deine Seite. Bei einer spontanen Darbietung kann dir das 200 Nuyen von den Umstehenden einbringen. Wird diese Edge-Handlung als Teil einer größer angelegten Überredungsaktion eingesetzt, kannst du den verlangten Preis um 20 Prozent erhöhen, und das Ziel wird einverstanden sein.
action.called_shot_disarm.desc=Ein erfolgreicher Treffer fügt der Zielperson keinen Schaden zu, sondern reißt ihr die Waffe aus der Hand.
action.called_shot_vitals.desc= Der Angriff geht gezielt gegen die lebenswichtigen Organe und fügt bei Erfolg 3 Punkte zusätzlichen Schaden zu (zusätzlich zu den Nettoerfolgen der Probe).
action.fire_from_cover.desc=Du feuerst aus dem Hinterhalt und behältst deine Deckung bei. Für Angriffe aus der Deckung muss keine Nebenhandlung ausgegeben werden.
action.knockout_blow.desc=Du nutzt deinen Vorteil, um deinen Gegner mit einem Schlag auszuschalten. Ist der zugefügte (Körperliche oder Betäubungs-)Schaden größer als die Willenskraft des Ziels, wird dessen Zustandsmonitor für Betäubungsschaden sofort vollständig ausgefüllt. Das Ziel ist bewusstlos. Auf den Körperlichen Zustandsmonitor fließt kein Schaden über.
action.shank.desc=Beim Angriff mit einer Klingenwaffe landest du einen gezielten Treffer. Der Würfelpoolmalus für Ziel ansagenverringert sich auf -2. Kosten
action.sudden_insight.desc=Führe ohne Malus eine Handlung aus, in der du keinen Fertigkeitswert hast. Das ermöglicht dir nicht, Fertigkeiten einzusetzen, die nicht ohne Übung verwendet werden können.
action.tactical_roll_htd.desc=Du lässt dich zu Boden fallen, um einem Kugelhagel zu entgehen, und rollst dich dabei so geschickt ab, dass du gleichzeitig einen Angriff ausführen kannst. Wenn du in der gleichen Kampfrunde einen Nahkampf-Angriff ausführst, erhältst du nicht den Würfelpoolmalus durch die Handlung Volle Deckung (S. 44) oder den Status Liegend (S. 54). In der nächsten Runde erleidest du nicht den Würfelpoolmalus von -2 auf Verteidigungsproben für Sehr nahe und Nahe Angriffe aus dem Status Liegend.
action.tumble.desc=Du kannst deinen Gegner nicht nur verletzen, sondern auch zu Fall bringen. Wenn der Schaden, den du deinem Ziel zufügst, vor der Schadenswiderstandsprobe größer ist als die Konstitution des Ziels, fällt es hin und gelangt in den Status Liegend.
action.wrest.desc=Wenn du im Nahkampf einen Angriff erfolgreich blockst, kannst du mit dieser Handlung dem Gegner die Waffe aus der Hand winden. Lege eine Probe auf Nahkampf + Geschicklichkeit ab, mit der Stärke des Gegners als Schwellenwert. Gelingt die Probe, schlägst du ihm die Waffe aus der Hand und sie fällt zu Boden. Erzielst du Nettoerfolge, nimmst du ihm die Waffe ab. Misslingt die Probe, behält der Gegner die Waffe.
action.emergency_boost.desc=Erhöhe vorübergehend ein Matrixattribut um 1 für eine Probe.
action.hog.desc= Überschwemme einen Host oder eine Persona mit rekursiven Anfragen, wodurch wertvolle Ressourcen ausgelastet werden und bei der Gegenseite das Attribut Datenverarbeitung um 2 und die aktiven Programmslots um 1 sinken. Dies hält (Angriffswert des Angreifers) Kampfrunden lang an.
action.signal_scream.desc=Bei der nächsten Handlung kannst du alle Modifikatoren durch Rauschen ignorieren.
action.technobabble.desc=Kann nur von Technomancern benutzt werden. Verwende bei der nächsten Matrixhandlung Charisma statt Logik.
action.under_the_radar.desc=Die nächste illegale Handlung, die du in dieser Kampfrunde durchführst, lässt deinen OW nicht ansteigen. Das bedeutet nicht, dass die Handlung oder folgende Handlungen dadurch legal würden. Es heißt nur, dass der OW nicht steigt.

