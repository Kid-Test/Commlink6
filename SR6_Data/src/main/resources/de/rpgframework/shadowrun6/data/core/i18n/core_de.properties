npc.goon.desc=Das sind diese muskelbepackten Schlägertypen, die in ihrem Leben nicht viel anderes gelernt haben, als sich auf ihre Größe und ihre Wut zu verlassen, um andere um ihr Geld zu erleichtern oder ihre wie auch immer geartete Sache zu fördern. Sie sind der typische "wütende Mob", der sich bei Demonstrationen zusammenrottet, um sich auf die eine oder andere Seite zu stürzen. Oft gekleidet im Straßenabschaum-Stil von Humanis oder der Allerweltslässigkeit von TerraFirst!, sind sie nur so lange stark und mutig, bis ihnen jemand ernsthaft Paroli bietet. Jeder echte Kämpfer, sogar ein Decker mit ein bisschen Straßenerfahrung, kann es normalerweise leicht mit diesen Trotteln aufnehmen.
npc.shaman.desc=Das sind diese muskelbepackten Schlägertypen, die in ihrem Leben nicht viel anderes gelernt haben, als sich auf ihre Größe und ihre Wut zu verlassen, um andere um ihr Geld zu erleichtern oder ihre wie auch immer geartete Sache zu fördern. Sie sind der typische "wütende Mob", der sich bei Demonstrationen zusammenrottet, um sich auf die eine oder andere Seite zu stürzen. Oft gekleidet im Straßenabschaum-Stil von Humanis oder der Allerweltslässigkeit von TerraFirst!, sind sie nur so lange stark und mutig, bis ihnen jemand ernsthaft Paroli bietet. Jeder echte Kämpfer, sogar ein Decker mit ein bisschen Straßenerfahrung, kann es normalerweise leicht mit diesen Trotteln aufnehmen.
npc.go_ganger.desc=Eye-Fivers. Rock Lobsters. Brain Eaters. Red Rovers. Straßengangs und Go-Gangs kultivieren ein gewisses Maß an Kooperation, aber letztlich setzen sie sich meistens doch nur aus Brutalos zusammen. Sie stehen eine Stufe über einem zusammengewürfelten Straßenmob, aber nur gerade eben. Die Knochenbrecher und Schuldeneintreiber der Verbrechersyndikate sind auch nicht viel besser. Sie haben einen Ruf, sie sind in der Lage, Befehle auszuführen, und sie haben einen gewissen Einfluss hinter sich, der ihnen sagt, wo es langgeht.
npc.go_ganger.item.gang_leathers.desc=Lederkluft in Gangfarben
npc.debt_collector.desc=Eye-Fivers. Rock Lobsters. Brain Eaters. Red Rovers. Straßengangs und Go-Gangs kultivieren ein gewisses Maß an Kooperation, aber letztlich setzen sie sich meistens doch nur aus Brutalos zusammen. Sie stehen eine Stufe über einem zusammengewürfelten Straßenmob, aber nur gerade eben. Die Knochenbrecher und Schuldeneintreiber der Verbrechersyndikate sind auch nicht viel besser. Sie haben einen Ruf, sie sind in der Lage, Befehle auszuführen, und sie haben einen gewissen Einfluss hinter sich, der ihnen sagt, wo es langgeht.
npc.brute.desc=Ancients. Cutters. Söhne Saurons. Halloweeners. Diese Namen sind zu Recht gefürchtet, weil hinter ihnen mehr als nur wahllose Gewalt steckt (na gut, die Halloweeners werden vielleicht genau deshalb gefürchtet). Es sind professionelle Gangs oder Organisationen, die als militanter Arm der etwas netteren Policlubs agieren. Sie haben schon ein bisschen mehr Kampferfahrung, auch wenn sie keine Profikämpfer sind, und sie alle haben genug Ego und Reputation, um sich im Kampf ein bisschen mehr zusammenzureißen.
