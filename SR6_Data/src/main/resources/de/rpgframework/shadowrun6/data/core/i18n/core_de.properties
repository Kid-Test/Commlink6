skill.firearms.page=97
skill.firearms.desc=Du willst auf irgendetwas schießen? Dann ist eine Probe auf diese Fertigkeit fällig. Grundsätzlich legst du eine Probe auf Feuerwaffen + Geschicklichkeit gegen Reaktion + Intuition des Gegners ab. Alle weiteren Details findest du im Kapitel Kampf auf Seite 107.
