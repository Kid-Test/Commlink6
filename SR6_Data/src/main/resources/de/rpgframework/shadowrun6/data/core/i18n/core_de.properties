item.biomonitor.desc=Dieses kleine Gerät überwacht ständig Herzfrequenz, Blutdruck und Körpertemperatur. Außerdem kann es Blut-, Schweiß- und Hautproben analysieren. Der Vitalmonitor wird von medizinischen Dienstleistern und von Patienten verwendet, die ihren Gesundheitszustand überwachen müssen, und kann als Armband getragen oder in Kleidung oder Kommlinks integriert werden.
item.docwagon_contract.desc=Geh niemals ohne ihn aus dem Haus! DocWagon bietet erstklassige medizinische Notfalldienste rund um die Uhr, und sie kommen zu dir! Es gibt vier Vertragsarten: Standard, Gold, Platin und Superplatin.\nEin DocWagon-Vertrag erfordert die Abgabe einer Gewebeprobe (verwahrt in einem sicheren Tresorraum, der streng von Wachleuten, Sicherheitsdeckern und Magiern bewacht wird) und beinhaltet einen Vitalmonitor, der als Armband getragen oder als RFID-Chip implantiert wird und aktiviert werden kann, um einen Notruf abzusetzen. Dieser Vitalmonitor dient den bewaffneten Rettungswagen und Hubschraubern von DocWagon auch als Peilsignal. Falls das Armband reißt, wird DocWagon ebenfalls alarmiert.
item.docwagon_contract.variant.monthly.desc=DocWagon Vertrag (1 Monat)
item.docwagon_contract.variant.yearly.desc=DocWagon Vertrag (1 Jahr)
item.docwagon_basic_year.desc=Geh niemals ohne ihn aus dem Haus! DocWagon bietet erstklassige medizinische Notfalldienste rund um die Uhr, und sie kommen zu dir! Es gibt vier Vertragsarten: Standard, Gold, Platin und Superplatin.\nEin DocWagon-Vertrag erfordert die Abgabe einer Gewebeprobe (verwahrt in einem sicheren Tresorraum, der streng von Wachleuten, Sicherheitsdeckern und Magiern bewacht wird) und beinhaltet einen Vitalmonitor, der als Armband getragen oder als RFID-Chip implantiert wird und aktiviert werden kann, um einen Notruf abzusetzen. Dieser Vitalmonitor dient den bewaffneten Rettungswagen und Hubschraubern von DocWagon auch als Peilsignal. Falls das Armband reißt, wird DocWagon ebenfalls alarmiert.
item.docwagon_gold_year.desc=Der Goldvertrag enthält eine kostenlose Reanimation pro Jahr, einen 50-prozentigen Nachlass auf die HTR-Gebühr und einen zehnprozentigen Nachlass auf die stationäre Behandlung.
item.docwagon_platinum_year.desc=Der Platinvertrag enthält vier kostenlose Reanimationen pro Jahr und einen 50-prozentigen Rabatt auf die stationäre Behandlung; HTR-Dienste sind kostenlos, aber Kompensationszahlungen für getötete Mitarbeiter müssen immer noch gezahlt werden
item.docwagon_superplatinum_year.desc=Kunden, die den Superplatinvertrag abgeschlossen haben, erhalten fünf kostenlose Reanimationen pro Jahr und müssen weder für HTR-Dienste noch für getötete DocWagon-Mitarbeiter zahlen.
item.disposable_syringe.desc=Spritzen bestehen aus Kunststoff mit einer Metallnadel und sind für den einmaligen Gebrauch gedacht. Sie können verwendet werden, um Toxine mit Injektionsvektor zu verabreichen. Ein unkooperatives Opfer muss eventuell zuerst immobilisiert oder zumindest festgehalten werden.
item.first_aid_kit.desc=Alles, was man für die Notfall-Wundversorgung braucht, in einer handlichen Tasche. Dieses Set enthält Wundschnellverbände, Kompressen, eine Rettungsdecke, Sicherheitsnadeln, Pinzette und Schere, Einmalhandschuhe, Klebepflaster, eine Pflasterspule und Desinfektionsspray. Das Erste-Hilfe-Set ist notwendig, um nach einem Kampf Erste Hilfe (S. 122) leisten zu können. Danach ist es aufgebraucht und muss durch ein neues Erste-Hilfe-Set ersetzt werden.
item.medkit.desc=Das Medkit enthält Medikamente, Verbände, Werkzeuge und ein (redseliges) Arzt-Expertensystem, das den Nutzer bezüglich der Behandlung der gängigsten medizinischen Notfälle (etwa Knochenbrüche, Schussverletzungen, chemische Wunden oder Vergiftung sowie der Behandlung von Schock und Blutverlust und natürlich Wiederbelebungen) beraten kann. Das Medkit gilt als Werkzeug-Kiste für Biotechproben. Die Regeln für seine Anwendung finden sich auf Seite 122.
item.medkit_supplies.desc=Ein Medkit-Nachfüllpack muss nach jeder Verwendung des Medkits gekauft werden; es ist auch möglich, Nachfüllpacks auf Vorrat zu kaufen. Bis zu fünf Nachfüllpacks können in der Medkitbox verwahrt werden. Weitere Packs müssen woanders aufbewahrt werden.
item.antidote_patch.desc=Das Antidot-Patch neutralisiert oder hebt den Status Vergiftet für eine große Auswahl an Toxinen auf. Ist ein Toxin oder eine Droge besonders selten, kann der Spielleiter verlangen, dass ein spezielles Antidot-Patch nur für dieses Toxin oder diese Droge verwendet wird (s. Toxine und Drogen, S. 124).
item.chem_patch.desc=Dies ist ein leeres Slap-Patch. Man kann es mit einer Dosis einer Chemikalie oder eines Toxins (S. 124) füllen und später bei einem Patienten (oder sich selbst) anwenden.
item.stim_patch.desc=Dieses Patch entfernt eine Anzahl Kästchen Betäubungsschaden in Höhe seiner Stufe und hebt den Status Benommen auf. Die Wirkung hält für [Stufe × 10] Minuten an - nach dieser Zeit erleidet der Patient (Stufe + 1)B Schaden, dem nicht widerstanden werden kann (und der auch auf den Körperlichen Zustandsmonitor überlaufen kann). Während ein Stim-Patch wirkt, kann der Charakter sich nicht ausruhen.
item.tranq_patch.desc=Dieses Patch verursacht Betäubungsschaden in Höhe seiner Stufe, gegen den mit Konstitution Widerstand geleistet wird.
item.trauma_patch.desc=Wird dieses Patch bei einem Patienten mit Überzähligem Schaden angewendet, wird er augenblicklich stabilisiert und heilt 1W6 + 1 Kästchen Überzähligen Schaden (und nur Überzähligen Schaden). Diese Patches sind immer Wi- Fi-fähig und verbinden sich automatisch mit der Matrix, sobald sie appliziert werden.

