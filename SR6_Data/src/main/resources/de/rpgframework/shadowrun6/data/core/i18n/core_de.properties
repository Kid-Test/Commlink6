item.ammo_injection_bolt.desc =Der Injektionsbolzen verursacht seinen Basisschaden und injiziert gleichzeitig eine Dosis des enthaltenen Medikaments oder Giftes. Ein erfolgreicher Treffer muss mindestens ein Kästchen Schaden (nach der Schadenswiderstandsprobe) verursachen.
item.ammo_injection_bolt.wifi=Die Injektion kann verzögert werden, bis ein WiFi-Signal ausgeschickt wird. Außerdem benötigt die Injektion kein Kästchen Schaden; es ist nur mindestens 1 Nettoerfolg bei der Angriffsprobe erforderlich.
item.ammo_injection_arrow =Injektionspfeil
item.ammo_injection_arrow.page = 250
item.ammo_injection_arrow.desc=Der Injektionspfeil verursacht seinen Basisschaden und injiziert gleichzeitig eine Dosis des enthaltenen Medikaments oder Giftes. Ein erfolgreicher Treffer muss mindestens ein Kästchen Schaden (nach der Schadenswiderstandsprobe) verursachen. Injektionspfeile haben üblicherweise eine Stufe von 8. Höherstufige Modelle sind für schwerere Bögen erhältlich, aber Pfeile oder Bolzen mit geringerer Stufe sind nicht stabil genug, um die schwere Nutzlast zuverlässig ins Ziel zu bringen.
item.ammo_injection_arrow.wifi=Die Injektion kann verzögert werden, bis ein WiFi-Signal ausgeschickt wird. Außerdem benötigt die Injektion kein Kästchen Schaden; es ist nur mindestens ein Nettoerfolg bei der Angriffsprobe erforderlich.

