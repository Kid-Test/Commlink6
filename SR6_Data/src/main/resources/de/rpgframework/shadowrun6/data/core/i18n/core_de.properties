item.synthleather_jacket.desc=Kunstleder ist die Norm auf der Straße, und diese Art der Oberbekleidung (von hüftlang bis zum Mantel) kommt nie aus der Mode. Sie bietet sogar ein Mindestmaß an Schutz.
item.actioneer_business.desc=Dieser modische gepanzerte Anzug ist besonders bei Mr Johnsons, Unterhändlern und Schiebern beliebt, die nach ein bisschen Schutz, gepaart mit Stil, suchen. Er enthält ein Tarnholster (siehe S. 261) im Jackett.
item.armor_clothing.desc=Durch ihr leichtes ballistisches Gewebe sind diese Kleidungsstücke fast unmöglich als Panzerung zu erkennen. Sie bieten zwar nicht so viel Schutz wie echte Panzerung, aber dafür sind sie in so ziemlich jedem Stil erhältlich, den man sich wünscht.
item.armor_jacket.desc=Sie ist in einer Vielzahl von Stilen erhältlich und bietet guten Schutz, ohne zu sehr aufzufallen. Aber denk nicht mal dran, sie bei einer Dinnerparty oder in einem Regierungsgebäude zu tragen.
item.armor_vest.desc=Diese moderne, flexible Weste wurde dafür entwickelt, unter normaler Kleidung getragen zu werden, ohne dass sie dabei aufträgt.
item.chameleon_suit.desc=Dieser Ganzkörperanzug hat eine Rutheniumpolymerbeschichtung, die mit einem Sensorsystem verbunden ist. Die Sensoren scannen die Umgebung und replizieren die Bilder in der richtigen Perspektive auf die Beschichtung. Ein Charakter erhält ein Bonus- Edge für Heimlichkeitsproben, wenn er einen aktiven Chamäleonanzug trägt.
item.full_body_armor.desc=Diese Panzerung wird von Militär- und Sicherheitseinheiten auf der ganzen Welt bei besonders gefährlichen Einsätzen getragen. Sie ist speziell so designt, dass sie einschüchternd wirkt, enthält aber auch eine Vielzahl an taktischen Holstern, Taschen und Gurten, die ihr eine tödliche Effizienz verleihen. Und sie fällt auf - nur damit ihr es wisst. Die Panzerung kann mit Umweltanpassung (an heiße oder kalte Umgebungen) ausgestattet oder chemisch versiegelt werden, um den Träger vollständig vor toxischen Umgebungen und Angriffen zu schützen.
item.full_body_armor_with_helmet.desc=Diese Panzerung wird von Militär- und Sicherheitseinheiten auf der ganzen Welt bei besonders gefährlichen Einsätzen getragen. Sie ist speziell so designt, dass sie einschüchternd wirkt, enthält aber auch eine Vielzahl an taktischen Holstern, Taschen und Gurten, die ihr eine tödliche Effizienz verleihen. Und sie fällt auf - nur damit ihr es wisst. Die Panzerung kann mit Umweltanpassung (an heiße oder kalte Umgebungen) ausgestattet oder chemisch versiegelt werden, um den Träger vollständig vor toxischen Umgebungen und Angriffen zu schützen. Der Helm der Panzerung hat eine Kapazität von 6 und kann mit Sicht- und Audioverstärkungen ausgestattet werden.
item.lined_coat.desc=Dieser Mantel im Wildweststil ist seit 50 Jahren auf den rauen Straßen der Sprawls dieser Welt beliebt. Neben seinen Schutzeigenschaften gewährt der gepanzerte Mantel 1 Bonus-Edge gegen Proben, um unter ihm versteckte Gegenstände zu entdecken.
item.urban_explorer_jumpsuit.desc=Dieses speziell für Kuriere, Athleten und Freerunner entwickelte Kleidungsstück ist die gepanzerte Version der "Automatenkleidung", aber erhältlich in einer Vielzahl schriller Stile. Und weil er so hip ist, enthält der Overall einen eingebauten Musikplayer und einen Vitalmonitor.

