skill.influence=Einfluss
skill.influence.page=96
skill.influence.desc=Diese Fertigkeit ist neben Überreden die zweite Möglichkeit, die Meinung anderer Leute zu beeinflussen. Man könnte sagen, dass Einfluss die "ehrlicheren" Varianten dieses Vorhabens in sich vereint, aber das würde vielen aufrechten Betrügern unrecht tun und die Integrität von Verhandlungsführern aus der Wirtschaftswelt weit über ihren Scheffel stellen. Letztlich gilt: Wann immer du versuchst, deinen Runnerkollegen Mut zu machen, Mr Johnson noch ein paar Nuyen mehr abzuluchsen oder jemandem unmissverständlich klarzumachen, dass er dir besser nicht in die Quere kommen sollte, wenn er nicht ganz neue Dimensionen von Schmerz kennenlernen möchte, dann ist Einfluss die richtige Fertigkeit.
skill.influence.skillspec.etiquette=Gebräuche
skill.influence.skillspec.instruction=Unterrichten
skill.influence.skillspec.intimidation=Einschüchtern
skill.influence.skillspec.leadership=Führen
skill.influence.skillspec.negotiation=Verhandeln
skill.outdoors=Natur
skill.outdoors.page=98
skill.outdoors.desc=Es gibt schlechtere Dinge, als die eigenen vier Wände nie zu verlassen, vor dem Trideo zu sitzen und WhompSnappers in sich hineinzustopfen, aber manchmal lassen sich Ausflüge in die Außenwelt nicht vermeiden. Für diese Gelegenheiten gibt es die Fertigkeit Natur. Sie kommt zum Einsatz, wenn du einer Spur folgst, Nahrung auftreiben willst oder den kürzesten Weg zu deinem Ziel finden möchtest. Normalweise werden Naturproben als Einfache Probe auf Natur + Intuition abgelegt. Der Schwellenwert wird mithilfe der Richtlinien für Schwellenwerte (S. 37) festgelegt. Alternativ kann der Schwellenwert für Spurenlesenproben auch anhand der Anstrengungen bestimmt werden, die beim Verbergen der Spuren unternommen wurden.
skill.outdoors.skillspec.navigation=Navigation
skill.outdoors.skillspec.survival=Survival
skill.outdoors.skillspec.tracking=Spurenlesen
