item.directional_microphone.desc=Mit diesem Mikrofon kann man Unterhaltungen in bis zu 100 Metern Entfernung belauschen. Das Mikrofon muss auf das gewünschte Abhörziel gerichtet sein, und feste Objekte oder laute Geräusche innerhalb der Abhörlinie stören den Effekt. 276
item.earbuds.desc=Diese ergonomischen Ohrstöpsel sind schwer zu entdecken und noch schwerer von den normalen Ohrstöpseln zu unterscheiden, die Bestandteil jedes Musikplayers und Kommlinks sind.
item.headphones.desc=Ein komplettes Headset mit verstellbaren Kopfriemen. Dank ihrer Größe haben sie eine größere Kapazität für Audioverstärkungen als Ohrstöpsel.
item.laser_microphone.desc=Dieser Sensor wirft einen Laserstrahl gegen eine dünne, feste Oberfläche (z. B. eine Fensterscheibe), liest die Vibrationen auf der Oberfläche und übersetzt sie in die Geräusche, die auf der anderen Seite der Oberfläche ertönen. Die maximale Reichweite beträgt 100 Meter.
item.omni_directional_microphone.desc=Ein normales omnidirektionales Audioaufnahmegerät, für gewöhnlich eingebaut in oder (drahtlos oder per Kabel) verbunden mit einem Kommlink oder einem anderen Aufnahmegerät. Die maximale Reichweite beträgt 100 Meter. Mikroversionen sind mit einer Kapazität von 1 erhältlich, haben aber nur eine Reichweite von 5 Metern.

item.audio_enhancement.desc=Eine Audioverbesserung erlaubt es dem Anwender, ein breiteres Spektrum an Audiofrequenzen zu hören, einschließlich Infra- und Ultraschall, die außerhalb des normalen metamenschlichen Hörspektrums liegen. Der Anwender erkennt außerdem feinste Nuancen und kann ablenkende Hintergrundgeräusche ausblenden. Dieses System gewährt einen Würfelpoolbonus von +1 für alle Wahrnehmungsproben zum Hören.
item.select_sound_filter.desc=Dieses Zubehör filtert Hintergrundgeräusche aus und erlaubt dem Anwender, sich auf bestimmte Geräusche oder Geräuschmuster zu konzentrieren. Darüber hinaus bietet es Sprach-, Wort- und Geräuschmustererkennung. Das System kann eine Anzahl an ausgewählten Geräuschgruppen bis zu seiner Stufe laden (etwa die Schritte einer patrouillierenden Wache, ein bestimmtes Wort oder die Rotorgeräusche eines näher kommenden Hubschraubers). Man kann immer nur einer Geräuschgruppe aktiv zuhören, aber die anderen kann man für späteres Playback aufzeichnen oder sie so einstellen, dass sie einen Alarm auslösen, wenn sie aktiviert werden. Das System kann eine Stufe von 1 bis 3 haben.
item.spatial_recognizer.desc=Dieses Audiozubehör lokalisiert die Quelle eines Geräusches. Der Benutzer erhält 1 Bonus-Edge für seine Wahrnehmungsprobe, um die Quelle eines bestimmten Geräusches auszumachen, aber wenn er das Edge nicht sofort ausgibt, verfällt es.

item.audio_enhancement.variant.cyberear.desc=Eine Audioverbesserung erlaubt es dem Anwender, ein breiteres Spektrum an Audiofrequenzen zu hören, einschließlich Infra- und Ultraschall, die außerhalb des normalen metamenschlichen Hörspektrums liegen. Der Anwender erkennt außerdem feinste Nuancen und kann ablenkende Hintergrundgeräusche ausblenden. Dieses System gewährt einen Würfelpoolbonus von +1 für alle Wahrnehmungsproben zum Hören.
item.select_sound_filter.variant.cyberear.desc=Dieses Zubehör filtert Hintergrundgeräusche aus und erlaubt dem Anwender, sich auf bestimmte Geräusche oder Geräuschmuster zu konzentrieren. Darüber hinaus bietet es Sprach-, Wort- und Geräuschmustererkennung. Das System kann eine Anzahl an ausgewählten Geräuschgruppen bis zu seiner Stufe laden (etwa die Schritte einer patrouillierenden Wache, ein bestimmtes Wort oder die Rotorgeräusche eines näher kommenden Hubschraubers). Man kann immer nur einer Geräuschgruppe aktiv zuhören, aber die anderen kann man für späteres Playback aufzeichnen oder sie so einstellen, dass sie einen Alarm auslösen, wenn sie aktiviert werden. Das System kann eine Stufe von 1 bis 3 haben.
item.spatial_recognizer.variant.cyberear.desc=Dieses Audiozubehör lokalisiert die Quelle eines Geräusches. Der Benutzer erhält 1 Bonus-Edge für seine Wahrnehmungsprobe, um die Quelle eines bestimmten Geräusches auszumachen, aber wenn er das Edge nicht sofort ausgibt, verfällt es.

item.audio_enhancement.variant.bodyware.desc=Eine Audioverbesserung erlaubt es dem Anwender, ein breiteres Spektrum an Audiofrequenzen zu hören, einschließlich Infra- und Ultraschall, die außerhalb des normalen metamenschlichen Hörspektrums liegen. Der Anwender erkennt außerdem feinste Nuancen und kann ablenkende Hintergrundgeräusche ausblenden. Dieses System gewährt einen Würfelpoolbonus von +1 für alle Wahrnehmungsproben zum Hören.
item.select_sound_filter.variant.bodyware.desc=Dieses Zubehör filtert Hintergrundgeräusche aus und erlaubt dem Anwender, sich auf bestimmte Geräusche oder Geräuschmuster zu konzentrieren. Darüber hinaus bietet es Sprach-, Wort- und Geräuschmustererkennung. Das System kann eine Anzahl an ausgewählten Geräuschgruppen bis zu seiner Stufe laden (etwa die Schritte einer patrouillierenden Wache, ein bestimmtes Wort oder die Rotorgeräusche eines näher kommenden Hubschraubers). Man kann immer nur einer Geräuschgruppe aktiv zuhören, aber die anderen kann man für späteres Playback aufzeichnen oder sie so einstellen, dass sie einen Alarm auslösen, wenn sie aktiviert werden. Das System kann eine Stufe von 1 bis 3 haben.
