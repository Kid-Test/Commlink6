item.attribute_increase.desc=Cybergliedmaßen können dazu verwendet werden, die Geschicklichkeit, Panzerung oder Stärke des Besitzers zu erhöhen. Auch hier gilt die maximale Erhöhung von 4 der natürlichen Attribute, also sollte man lieber gleich darauf verzichten, eine Attributserhöhung zu kaufen, die eins der natürlichen Attribute um mehr als 4 erhöht, denn das wäre Geldverschwendung.\n Eine Erhöhung der Panzerung erhöht dauerhaft den Verteidigungswert des Charakters - die Cybergliedmaße ist Teil der allgemeinen Schutzmechanismen des Charakters, die sich im Verteidigungswert widerspiegeln. Erhöhungen von Geschicklichkeit oder Stärke kommen nur zum Tragen, wenn die Gliedmaße auch tatsächlich eingesetzt wird. Beispiel: Wenn ein Cyberarm die Stärke eines Charakters erhöht, so erhöht das den Schaden, den er bei einem waffenlosen Angriff mit diesem Arm verursacht, aber nicht, wenn er tritt. Wenn eine Aktivität dem gesunden Menschenverstand zufolge im Allgemeinen den ganzen Körper beansprucht (z. B. Rennen, Klettern, Schwimmen), dann kommt die Attributserhöhung der Cybergliedmaße nicht zur Anwendung.\n Übrigens haben Stärke- und Geschicklichkeitserhöhungen keine Wirkungen, wenn sie in einem Cyberschädel enthalten sind.
item.armor_increase.desc=Cybergliedmaßen können dazu verwendet werden, die Geschicklichkeit, Panzerung oder Stärke des Besitzers zu erhöhen. Auch hier gilt die maximale Erhöhung von 4 der natürlichen Attribute, also sollte man lieber gleich darauf verzichten, eine Attributserhöhung zu kaufen, die eins der natürlichen Attribute um mehr als 4 erhöht, denn das wäre Geldverschwendung.\n Eine Erhöhung der Panzerung erhöht dauerhaft den Verteidigungswert des Charakters - die Cybergliedmaße ist Teil der allgemeinen Schutzmechanismen des Charakters, die sich im Verteidigungswert widerspiegeln. Erhöhungen von Geschicklichkeit oder Stärke kommen nur zum Tragen, wenn die Gliedmaße auch tatsächlich eingesetzt wird. Beispiel: Wenn ein Cyberarm die Stärke eines Charakters erhöht, so erhöht das den Schaden, den er bei einem waffenlosen Angriff mit diesem Arm verursacht, aber nicht, wenn er tritt. Wenn eine Aktivität dem gesunden Menschenverstand zufolge im Allgemeinen den ganzen Körper beansprucht (z. B. Rennen, Klettern, Schwimmen), dann kommt die Attributserhöhung der Cybergliedmaße nicht zur Anwendung.\n Übrigens haben Stärke- und Geschicklichkeitserhöhungen keine Wirkungen, wenn sie in einem Cyberschädel enthalten sind.
item.cyber_holdout.desc=Es gibt Implantate für verschiedene Klassen von Feuerwaffen; das Implantat sorgt dabei nur für den notwendigen Platz, die Waffe muss separat gekauft werden. Bei allen Arten von Pistolen erhöht sich ihre Tarnbarkeit um 2, wenn sie implantiert werden. Bei größeren Waffen ändert sich die Tarnbarkeit nicht, da sie auch in implantiertem Zustand recht auffällig sind. Gewehre und Scharfschützengewehre können nicht implantiert werden. Alle implantierten Feuerwaffen können mit der Nebenhandlung Schnellziehen bereit gemacht werden.\n Die einzigen Modifikationen, mit denen implantierte Waffen ausgestattet werden können, sind Lasermarkierer und Schalldämpfer.
item.cyber_light_pistol.desc=Es gibt Implantate für verschiedene Klassen von Feuerwaffen; das Implantat sorgt dabei nur für den notwendigen Platz, die Waffe muss separat gekauft werden. Bei allen Arten von Pistolen erhöht sich ihre Tarnbarkeit um 2, wenn sie implantiert werden. Bei größeren Waffen ändert sich die Tarnbarkeit nicht, da sie auch in implantiertem Zustand recht auffällig sind. Gewehre und Scharfschützengewehre können nicht implantiert werden. Alle implantierten Feuerwaffen können mit der Nebenhandlung Schnellziehen bereit gemacht werden.\n Die einzigen Modifikationen, mit denen implantierte Waffen ausgestattet werden können, sind Lasermarkierer und Schalldämpfer.
