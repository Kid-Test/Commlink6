mentorspirit.bear.desc=Dieser Schutzgeist steht für Schutz und Stärke. Er ist ein Heiler, kann niemanden im Stich lassen, ohne einen guten Grund dafür zu haben, und verteidigt die Wesen, die unter seinem Schutz stehen. Bär hat auch eine wilde Seite: Er ist ein passionierter Verteidiger und achtet im Kampf nicht auf die eigene Sicherheit, wenn er oder ein Schutzbefohlener verwundet wird.\n\nVorteile\nALLGEMEIN: Edge-Boosts beim Schadenswiderstand kosten 1 Edge weniger als normal (nicht beim Entzugswiderstand)\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Heilung kosten 1 Edge weniger als normal\nADEPT: 1 Stufe Beschleunigte Heilung gratis
mentorspirit.bear.disadvantage=Du kannst im Kampf zum Berserker werden, wenn du Körperlichen Schaden erleidest oder jemand, den du beschützt, schwer verletzt wird. Lege (mit Verletzungsmodifikatoren) eine Probe auf Willenskraft + Charisma ab. Du verfällst für 3 Runden minus 1 Runde pro Erfolg in einen Berserkerrausch. Drei oder mehr Erfolge können diesen komplett verhindern. Wenn du bereits im Berserkerrausch bist, erhöht sich die Dauer entsprechend. In diesem Zustand stürzt du dich, ohne auf deine eigene Sicherheit zu achten, auf die Angreifer. Wenn du diese vor Ablauf des Berserkerrauschs kampfunfähig machst, endet dieser vorzeitig.
mentorspirit.cat.desc=Katze wird in Kulturen auf der ganzen Welt hoch geachtet. Man betrachtet Katze oft als Hüterin mystischer Geheimnisse - auch jener über das Leben nach dem Tod. Sie kennt viele Geheimnisse, teilt sie aber nur selten und weiht niemals jemanden ein, den sie (nach ihren eigenen Maßstäben) nicht für würdig hält. Sie ist verstohlen, hinterlistig und arrogant. Katze spielt mit ihren Opfern - bedroht sie, verfolgt und verwirrt sie -, bevor sie dann erbarmungslos zuschlägt.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Athletik- oder Heimlichkeits- Proben (nach Wahl der Spielerin) kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Illusion kosten 1 Edge weniger als normal\nADEPT: Kraft Spurloser Schritt gratis
mentorspirit.cat.disadvantage=Katzenzauberer spielen mit ihren Opfern. Wenn dir zu Kampfbeginn eine Probe auf Willenskraft + Charisma (3) misslingt, kannst du keine Angriffe durchführen, die dein Ziel handlungsunfähig machen würden. Wenn du Körperlichen Schaden erleidest, hört dieses Herumspielen allerdings sofort auf.
mentorspirit.coyote.desc=Kojote ist ein Meister der Streiche: der Geist, der nie dort ist, wo man ihn sucht, und einem immer einen Schritt voraus ist. Die besten Streiche sind die, von denen niemand weiß, dass er sie gespielt hat. Sie sind perfekte Betrügereien, bei denen das Opfer das Gefühl hat, einfach Pech zu haben, und nicht weiß, wie übel man ihm mitgespielt hat. Die Streiche von Kojote sind nicht immer bösartig, aber auch nicht immer unschuldig. Sie sind das, was er haben will, und seine Trickkiste ist unerschöpflich.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Überreden-Proben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Manipulation kosten 1 Edge weniger als normal \ADEPT: Kraft Stimmkontrolle gratis
mentorspirit.coyote.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um das Unglück anderer nicht zu deinem Vorteil nutzen zu wollen oder um dir einen schlauen Trick oder Scherz zu verkneifen, selbst wenn dieser deinen Freunden zum Nachteil gereichen würde.
mentorspirit.dog.desc=Hund ist ein loyaler Freund. Er kämpft heldenhaft für den Schutz der Seinen und seines Heims. Hund schützt andere vor schädlichen Zaubern und gefährlichen Geistern. Er ist loyal, großzügig und hilft Personen, die freundlich zu ihm sind. Außerdem ist er zielstrebig, oft bis zur Sturheit hin.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Natur-Proben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Wahrnehmung kosten 1 Edge weniger als normal\nADEPT: 2 Geschärfte Sinne gratis
mentorspirit.dog.disadvantage=Hund ist unverbrüchlich loyal. Du kannst niemanden im Stich lassen, deine Freunde verraten oder zulassen, dass jemand sich für dich opfert, wenn dir keine Probe auf Willenskraft + Charisma (3) gelingt.
mentorspirit.dragonslayer.desc=Dieser heldenhafteste aller Schutzgeister ist zugleich der lebenslustigste. Er kämpft natürlich, um die Seinen vor allen Gefahren zu schützen, schätzt aber Partys und Vergnügen noch viel mehr. Er ist ein großer Bruder, der sich freundlich für alles interessiert, was seine Familie macht. Manchmal ist er ein wenig naiv, aber er ist ein verlässlicher Freund und ein tödlicher Gegner. Die Drachen, die er tötet, haben sich mit der Zeit verändert: Im Moment sind seine bestialischen Feinde das Verbrechen, die Umweltverschmutzung, Korruption - und natürlich echte Drachen. Drachentöter kämpft und spielt mit harten Bandagen. Wenn er einmal einen Eid geleistet hat, wird er ihn niemals brechen. Drachentöter verhält sich ehrenvoll und höflich und verlangt das auch von seiner Umgebung.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Einfluss-Proben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf kosten 1 Edge weniger als normal\nADEPT: Kraft Gefahrensinn gratis
mentorspirit.dragonslayer.disadvantage=Wenn du (absichtlich oder unabsichtlich) ein Versprechen brichst, erhältst du einen Würfelpoolmalus von -1 auf alle Handlungen, bis du es wiedergutgemacht hast.
mentorspirit.eagle.desc=Adler ist ein hoch fliegender Vogel und wird in vielen Kulturen als edelster aller Himmelsbewohner betrachtet. Er ist ein stolzer Einzelgänger, der alles, was in der Welt geschieht, von oben betrachtet. Adler ist ein edler Verteidiger der Reinheit der Natur. Er ist gegenüber anderen Meinungen intolerant und misstraut der Technologie und ihren Erzeugnissen zutiefst. Wer die Natur schädigt, ist Adlers Feind, und Adler wird großen Gefahren die Stirn bieten, um die Verschmutzer und andere Übeltäter zu besiegen.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Wahrnehmungsproben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts beim Herbeirufen von Luftgeistern kosten 1 Edge weniger als normal\nADEPT: 1 Stufe Kampfsinn gratis
mentorspirit.eagle.disadvantage=Du erhältst eine Allergie (Schadstoffe, Leicht) (S. 78) ohne Karmabonus.
mentorspirit.firebringer.desc=Feuerbringer hat das Geheimnis des Feuers aus dem Himmel gestohlen und der Metamenschheit zum Geschenk gemacht. Er ist eine gütige und achtsame Gestalt, aber seine guten Absichten bringen ihn oft in Schwierigkeiten, und seine Pläne entwickeln sich oft anders, als er sich das dachte. Er ist ein Schöpfer und Gestalter, der aus dem Urschlamm Neues schafft und ihm den feurigen Atem des Lebens einhaucht. Feuerbringer widmet sich der Verbesserung des Lebens für andere, auch auf eigene Kosten. Die meisten seiner Anhänger verschreiben sich mit ganzem Herzen einem großen Ziel.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Mechanik- oder Verzaubern-Proben (nach Wahl des Spielers) kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Manipulation kosten 1 Edge weniger als normal\nADEPT: 1 Stufe Verbesserte Fertigkeit (Fertigkeit); nicht für Kampffertigkeiten
mentorspirit.firebringer.disadvantage=Wenn jemand dich eindringlich um Hilfe bittet, kannst du diese nur verweigern, wenn dir eine Probe auf Willenskraft + Charisma (3) gelingt.
mentorspirit.mountain.desc=Berg ist im Herzen der Erde verwurzelt und wächst zugleich in den Himmel. Er hat unendliche Kraft und Ausdauer, ist aber wenig flexibel. Berg ist stur und unnachgiebig und lässt sich, wenn er sich einmal eine Meinung gebildet hat, nur schwer vom Gegenteil überzeugen.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Natur-Proben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Antimagieproben und Verankerten Ritualen kosten 1 Edge weniger als normal\nADEPT: 2 Stufen Mystischer Panzer gratis
mentorspirit.mountain.disadvantage=Wenn Berg einen Plan gefasst hat, bleibt er dabei. Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um ein geplantes Vorgehen aufzugeben und einem neuen Plan zu folgen. Wenn die Probe misslingt, musst du dem ursprünglichen Plan folgen - wenn nötig auch alleine. Außerdem muss dir eine Probe auf Willenskraft + Charisma (3) gelingen, wenn du ganz ohne Plan vorgehen willst.
mentorspirit.rat.desc=Ratte lebt überall, wo Metamenschen leben und ihren Abfall abladen, weil sie sich davon ernährt. Ratte ist ein Aasfresser, ein verstohlener Dieb, der sich nimmt, was er zum Überleben braucht. Sie hasst es, offen aufzutreten, und hält sich lieber im Schatten. Ratte vermeidet Kämpfe, wann immer es geht. Wenn sie kämpfen muss, will sie schnell töten und schnell wieder verschwinden.\n\nVORTEILE\nALLGEMEIN: Edge-Boosts bei Heimlichkeits-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Verzaubern-Proben zum Sammeln von Reagenzien kosten 1 Edge weniger als normal, und du kannst Reagenzien jeder Tradition ohne Einschränkung einsetzen \nADEPT: 1 Stufe Schmerzresistenz gratis
mentorspirit.rat.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um im Kampf nicht sofort zu fliehen oder in Deckung zu gehen. Wenn du nicht fliehen kannst, musst du kämpfen.
mentorspirit.sea.desc=Meer ist die Wiege allen Lebens. Meer ist undurchschaubar und unberechenbar - ruhig und angenehm im einen Moment, furchterregend und zerstörerisch im nächsten. Obwohl Meer unendlich reich ist, wacht es eifersüchtig über alles, was es in die Finger bekommt. Meer kann ein mächtiger Verbündeter sein, der aber ständig mit großer Vorsicht umworben werden will. \n\nVorteile\nALLGEMEIN: Edge-Boosts bei Athletik-Proben zum Schwimmen kosten 1 Edge weniger als normal; die Bewegungsrate beim Schwimmen steigt um 1 Meter pro Kampfrunde \nZAUBERER: Edge-Boosts beim Herbeirufen von Wassergeistern kosten 1 Edge weniger als normal \nADEPT: 1 Stufe Verbesserte Fertigkeit (Athletik) gratis
mentorspirit.sea.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um etwas herzugeben, das dir gehört, oder um auf irgendeine Weise wohltätig zu sein.
mentorspirit.seducer.desc=Der Verführer ist die Verkörperung des Verlangens. Er hat etliche Laster, die er häufig befriedigen muss. Er stachelt zu Eifersucht und Gier an und strebt danach, auch in anderen das Verlangen zu wecken. Direkte Konfrontationen vermeidet er, liebt es aber, wenn andere für oder um ihn kämpfen. Er lebt dafür, Schwächen auszunutzen, und zögert nicht, andere zu opfern, die ihm im Weg stehen. \n\nVorteile\nALLGEMEIN: Edge-Boosts bei Überreden-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Illusion kosten 1 Edge weniger als normal \nADEPT: 1 Stufe Verbesserte Fertigkeit (Überreden) oder (Einfluss) (nach Wahl des Spielers)
mentorspirit.seducer.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um einem Laster oder einer Neigung (Drogen, BTL, Sex usw.) nicht bei erster Gelegenheit nachzugeben.
mentorspirit.shark.desc=Hai ist ein gnadenloser, kalter Jäger. Alle, die am Meer leben, kennen seine Macht. Wenn Hai zuschlägt, tut er das ohne Gnade und wird vom Blut seiner Beute in Raserei versetzt. Haizauberer sind ruhelose Wanderer, die immer in Bewegung bleiben. Sie sind wilde, tödliche Kämpfer. Ein Haizauberer findet, dass nur ein toter Feind ein guter Feind ist. Wenn Hai herausgefordert wird, hält er sich nicht mit Drohungen auf, sondern schlägt zu, um zu töten.\n\nVorteile\nALLGEMEIN: Edge-Boosts für Nahkampf-Proben ohne Waffen und mit Klingenwaffen kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf kosten 1 Edge weniger als normal\nADEPT: Kraft Todeskralle gratis
mentorspirit.shark.disadvantage=Wenn du im Kampf Körperlichen Schaden erleidest, kannst du in einen Berserkerrausch verfallen. Lege (mit Verletzungsmodifikatoren) eine Probe auf Willenskraft + Charisma ab. Du verfällst für 3 Runden minus 1 Runde pro Erfolg in einen Berserkerrausch. Drei oder mehr Erfolge können diesen komplett verhindern. Wenn du bereits im Berserkerrausch bist, erhöht sich die Dauer entsprechend. In diesem Zustand stürzt du dich, ohne auf deine eigene Sicherheit zu achten, auf die Angreifer. Wenn deine Ziele kampfunfähig sind, bevor die Zeit abgelaufen ist, attackierst du ihre leblosen Körper
mentorspirit.snake.desc=Schlange ist weise und kennt viele Geheimnisse. Sie gibt klugen Rat, verlangt dafür aber immer einen Preis. Schlange kämpft nur, um sich und andere zu schützen. Sie ist besessen vom Entdecken von Geheimnissen und nimmt dafür auch große Risiken in Kauf. Schlange tauscht ihr Wissen mit anderen gegen alles, was sie dafür bekommen kann. \n\nVorteile\nALLGEMEIN: Zwei magiebezogene Wissensfertigkeiten gratis\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Wahrnehmung kosten 1 Edge weniger als normal \nADEPT: Kraft Körpersprache gratis
mentorspirit.snake.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um Hinweise auf Geheimnisse oder Wissen, die nur wenigen Leuten bekannt sind, nicht zu verfolgen.
mentorspirit.thunderbird.desc=Donnervogel ist die majestätische Verkörperung des Sturms. Seine Schwingen sind dunkle Wolken, sein Schnabel und seine Krallen sind Blitze, und sein Schrei ist Donnergrollen. Donnervogel ist eine Urgewalt - oft wild, aber nötig für das Überleben des Landes und das Aufrechterhalten des Lebenskreislaufs. Man muss diese Gewalt respektieren und sich ihr vorsichtig nähern, um nicht ihren Zorn zu wecken.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Einfluss-Proben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts beim Herbeirufen von Luftgeistern kosten 1 Edge weniger als normal\nADEPT: 1 Stufe Kritischer Schlag gratis
mentorspirit.thunderbird.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um auf eine Beleidigung nicht scharf zu reagieren.
mentorspirit.wise_warrior.desc=Der Weise Krieger beherrscht die Kriegskunst, weil für ihn die Schlacht eine Übung für Geist und Körper ist. Er studiert die Taktik seiner Feinde und besiegt sie durch eine Mischung aus überlegener Strategie und Kampfkraft. Der Weise Krieger handelt nicht aus Barbarei oder Kriegslust, sondern aus Weisheit und Wissen. Weise Krieger müssen einem Krieger-Ehrenkodex folgen und sich entsprechend benehmen, um die Gunst des Schutzgeistes zu behalten. \n\nVorteile\nALLGEMEIN: Edge-Boosts bei Einfluss-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf kosten 1 Edge weniger als normal \nADEPT: 1 Stufe Verbesserte Fertigkeit für eine Kampffertigkeit
mentorspirit.wise_warrior.disadvantage=Wenn du dich (absichtlich oder unabsichtlich) ehrlos oder unhöflich verhältst, erhältst du einen Würfelpoolmalus von -1 auf alle Handlungen, bis du dein Verhalten gesühnt hast.
mentorspirit.wolf.desc=Wolf wird auf der ganzen Welt als Jäger und Krieger geachtet. Er widmet sich hingebungsvoll seinem Rudel. Wolf gewinnt jeden Kampf seines Lebens - außer den, in dem er stirbt. Wolfszauberer sind ihrer Familie und ihren Freunden gegenüber bis in den Tod loyal. Sie zeigen im Kampf niemals Feigheit und halten immer ihr Wort. \n\nVorteile \nALLGEMEIN: Edge-Boosts bei Antimagie-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf kosten 1 Edge weniger als normal \nADEPT: 2 Stufen Attributsschub (Geschicklichkeit) gratis
mentorspirit.wolf.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um dich aus einem Kampf zurückzuziehen.

#Metatypes
metatype.dwarf = Zwerg
metatype.dwarf.page = 58
metatype.dwarf.desc = <b>• ⌀ Größe:</b> 1.2 Meter<br/>\
 <b>• ⌀ Gewicht:</b> 54 kg<br/>\
 <b>• Ohren:</b> leicht spitz<br/>\
 <b>• Charakteristika:</b> geringe Größe; stämmiger Körperbau; große Ausdauer<br/>\
 <b>• Spezifische Vorteile:</b> Zwerge besitzen die Vorteile Infrarotsicht (S. 75) und Toxinresistenz (S. 76).<br/><br/>\
 Die Zwerge der Sechsten Welt werden im Großen und Ganzen von der etablierten Gesellschaft akzeptiert, ohne jedoch in vollem Umfang wertgeschätzt zu werden. Die größeren Metatypen scheinen sich am wohlsten zu fühlen, wenn Zwerge sich in die Rollen fügen, die man am ehesten mit ihnen assoziiert – Handlanger, Fahrer, Mechaniker und solche Sachen. Und das wird auch dadurch nicht gerade besser, dass sie sich aufgrund ihrer geringen Größe oft in Fahrzeuge quetschen können, in die Orks, Menschen und Elfen nur mit größter Mühe hineinpassen und Trolle schon mal gar nicht. Trotzdem finden sie relativ leicht Arbeit und stoßen nur auf wenig direkten Hass. Sie werden einigermaßen gut behandelt, können aber nicht das Gefühl abschütteln, dass man sie nicht ganz für voll nimmt.<br/>
 Überall auf der Welt ist es den Zwergen ein Anliegen, den anderen zu demonstrieren, dass man sie nicht ignorieren sollte. Zwergische Decker, Straßensamurai, Spezialisten für verdeckte Operationen und Unterhändler gewinnen in den internationalen Schatten immer mehr an Einfluss, und wer sie unterschätzt, tut dies auf eigene Gefahr.<br/>\
 Das Fehlen einer übertriebenen Antipathie gegenüber Zwergen hat sehr dazu beigetragen, dass sie sich besser in menschliche Gemeinschaften einfügen konnten als andere Metatypen. Aus diesem Grund haben sie nicht so viele eigene Enklaven gegründet wie einige der anderen Metatypen (wobei es natürlich auch eine Rolle spielt, dass ihnen nicht diese mysteriösen Einkommensquellen zur Verfügung stehen, dank derer sich die Elfen ihre eigenen Reiche aufbauen konnten). Seit der Gründung des auf Zwerge fokussierten Biloxi Technical Institute entwickelt sich das südliche Mississippi in der CAS zunehmend zu einem Anlaufpunkt für Zwerge. Was daraus werden wird und wie sich das auf den Rest der Welt auswirken wird, bleibt abzuwarten.
metatype.elf = Elf
metatype.elf.page = 55
metatype.elf.desc = <b>• ⌀ Größe:</b> 1,90 m<br/>\
 <b>• ⌀ Gewicht:</b> 80 kg<br/>\
 <b>• Ohren:</b> spitz<br/>\
 <b>• Charakteristika:</b> schlanker, geschmeidiger Körperbau; wirken attraktiv auf andere Metatypen und wissen das auch <br/>\
 <b>• Spezifische Vorteile:</b> Elfen besitzen den Vorteil Restlichtverstärkung (S. 76).<br/><br/>\
 Das vielleicht Nervigste an Elfen ist, dass man sich über sie ärgern und aufregen kann, so viel man will, und es ihnen schnurzegal ist. Sie haben zwei florierende Nationen – Tír na nÓg (vormals Irland) und Tír Tairngire (im Westen Nordamerikas) –, sie haben Leute in einigen der einflussreichsten Positionen der Welt, und sie haben Prominente, deren MeFeed-Klicks in die Milliarden gehen. Sie werden beneidet, nicht verachtet.<br/>
 Aber viele Elfen wissen, dass sich dieser Neid nicht auf jeden Elfen erstreckt. Wenn man ein Elf ist, der nicht reich ist, der nicht elegant oder anmutig ist, wird man oft als Versager betrachtet, als jemand, der mit allen Geschenken des Lebens gesegnet wurde und es irgendwie vermasselt hat. Und es sind nicht nur Nicht-Elfen, die dieser Ansicht sind. Egal ob man in Armut aufgewachsen ist, egal welche Hindernisse einem auch in den Weg gelegt wurden – die Leute gehen automatisch davon aus, dass man es immer leicht hatte, weil man ja ein Elf ist. Aber das Überleben in der elfischen Gesellschaft ist nicht einfach. Die oberste Schicht kann absolut rücksichtslos sein, wenn es um die Erhaltung ihres Status quo geht, und alle, die sich nicht anpassen, werden als Unzufriedene beschimpft, für die man immer Mittel und Wege findet, sich ihrer zu entledigen. In den Barrens der Megastädte dieser Welt findet man zahlreiche Elfen, die ausgestoßen wurden, weil sie nicht bereit waren, sich dem zu fügen, was die Gesellschaft für sie vorgesehen hatte. Ihre Wut könnte die ganze Erde verbrennen.
metatype.human = Mensch
metatype.human.page = 56
metatype.human.desc = <b>• ⌀ Größe:</b> 1,75 m<br/>\
 <b>• ⌀ Gewicht:</b> 78 kg<br/>\
 <b>• Ohren:</b> rund<br/>\
 <b>• Charakteristika:</b> mittelgroß; mittelschwer; schlecht auf Leute zu sprechen, die nicht ihrem Mittelmaß entsprechen<br/>\
 <b>• Spezifisische Vorteile:</b> Menschen haben keine spezifischen metatypischen Vorteile.<br/><br/>\
 Als die Mehrheit der intelligenten Bewohner des Planeten stellen die Menschen die Definition des Begriffes „normal“ dar – und natürlich haben einige von ihnen nichts Besseres zu tun, als diese Definition nach bestem Wissen und Gewissen zu missbrauchen. Diese Menschen wissen, dass ihnen die körperliche Kraft und der soziale Zusammenhalt einiger der anderen Metatypen fehlt, deshalb formen sie sich die Welt auf eine Weise, die jene Individuen, die sie nicht mögen, davon abhält zu erkennen, wozu sie in der Lage sind und was sie aus sich machen könnten.<br/>\
 Der Nebeneffekt dessen ist natürlich, dass sich viele Menschen in der demoralisierenden Maschinerie, die die herrschende Konzernklasse aufgebaut hat, verfangen, weil sie nicht in dieses künstliche Mittelmaß passen. Sie sind das Korn, das in dieser Mühle gemahlen wird, sie sind diejenigen, die durchgekaut und ausgespuckt werden, damit die Leute an der Spitze noch mehr Reichtum und Macht anhäufen können. Denn sie sind ja nur Menschen, und es gibt so viele von ihnen – wem wird es da schon auffallen, wie sie verheizt werden, und wer wird sie vermissen, wenn sie nicht mehr da sind?<br/>\
 Die Schatten sind voll mit Menschen, die keinen Weg gefunden haben, normal oder mittelmäßig zu sein.
metatype.ork = Ork
metatype.ork.page = 57
metatype.ork.desc = <b>• ⌀ Größe:</b> 1,90 m<br/>\
 <b>• ⌀ Gewicht:</b> 128 kg<br/>\
 <b>• Ohren:</b> spitz<br/>\
 <b>• Charakteristika:</b> kräftiger, bulliger Körperbau; Hauer; gelten ständig als Außenseiter<br/>\
 <b>• Spezifische Vorteile:</b> Orks besitzen die Vorteile Restlichtverstärkung (S. 76) und Robust Gebaut 1 (S. 76).<br/><br/>\
 Orks machen die Leute nervös, und die Leute sind nicht gerne nervös. Ihre Hauer, ihre Knochenstruktur und ihre spitzen Ohren markieren sie als etwas durch und durch anderes, und ihre Stärke und Größe lassen deutlich den Schaden erahnen, den sie anrichten können. Wie sie es schon seit Jahrhunderten getan haben, reagieren die Menschen auf das, was sie fürchten, indem sie es ausstoßen, indem sie dafür sorgen, dass die Orks ihre Kräfte nicht bündeln können, und sie durch ihre zahlenmäßige Überlegenheit unterdrücken.<br/>\
 Das funktioniert so lange, wie man es schafft, die Angst zu schüren und sie auszunutzen, um die Massen zu mobilisieren. Da aber immer mehr Leute ihre Angst überwinden können und allmählich begreifen, mit welcher Ungerechtigkeit manche Bevölkerungsgruppen behandelt werden, sondern sie sich von dieser Unterdrückungsmaschinerie ab, und die Zahl derjenigen, die sich dafür instrumentalisieren lassen, nimmt stetig ab. Unterdrücker sind nicht unbedingt besonders geschickt darin, neue Lösungen für solche Probleme zu finden – ihre übliche Reaktion besteht aus noch mehr Unterdrückung. Und deshalb, während sich die Erkenntnis der Ungerechtigkeiten immer mehr ausbreitet, bereiten sich die Orks überall in der Sechsten Welt darauf vor, dass es zunächst einmal noch schlimmer werden wird, und sie ergreifen Maßnahmen, um zu überleben und daran zu arbeiten, das Leben besser zu machen. Sie haben sich bereits einige eigene Enklaven geschaffen – den Seattler Untergrund, Sweetwater Creek in Atlanta, Dharavi in der Indischen Union – und hoffen, dass diese Orte einmal die Keimzellen für Gesellschaften werden können, die Orks integrieren, statt sie zu fürchten.
metatype.troll = Troll
metatype.troll.page = 57
metatype.troll.desc = <b>• ⌀ Größe:</b> 2,50 m<br/>\
 <b>• ⌀ Gewicht:</b> 300 kg<br/>\
 <b>• Ohren:</b> leicht spitz, oft versteckt von Hörnern<br/>\
 <b>• Charakteristika:</b> groß; echt groß; und Hörner<br/>\
 <b>• Spezifische Vorteile:</b> Trolle besitzen die Vorteile Dermalablagerungen (S. 74), Infrarotsicht (S. 75) und Robust Gebaut 2 (S. 76).<br/><br/>\
 Es ist nicht leicht, in einer Gesellschaft zu leben, wenn man wie das wandelnde Abbild eines Albtraums aussieht. Und zwei- bis dreimal so groß zu sein wie alle anderen hilft auch nicht gerade. Es ist nun einmal keine Trollwelt, und die meisten anderen Bewohner dieser Welt sind auch nicht geneigt, das zu ändern. Wer möchte schon Platz machen für furchterregende Monster? Trolle werden sich ihren Weg zu einem Platz in der Welt erzwingen müssen – und wenn sie sich den Weg irgendwo hinein erzwingen, bezeichnet man sie unweigerlich als Vandalen und Zerstörer.<br/>\
 Eine nicht unbeträchtliche Anzahl Trolle hat sich angesehen, wie die Karten gegen sie gezinkt sind, und beschlossen, dieses Spiel nicht mehr länger mitzuspielen. Sie halten sich raus und sehen zu, wie die Welt brennt – und werfen vielleicht noch hier und da ein gelegentliches zusätzliches Streichholz hinein. Die Trollrepublik im Schwarzwald ist eine der bedeutendsten Trollgemeinschaften der Welt. Sie gilt als leuchtendes Beispiel und Vorbild dafür, wie eine Trollgemeinschaft sein kann, während sie gleichzeitig einen gewissen Abstand zum Rest der Welt wahrt. Die Frage ist nur, ob sie sich integrieren oder eine höhere Mauer bauen werden.<br/>\
 Trolle haben die größten Schwierigkeiten damit, sich anderen Metatypen anzupassen, da ihre Körper sich so sehr von denen der anderen unterscheiden. Es sind nicht nur die Größe und die Hörner – sie haben am ganzen Körper Dermalablagerungen, die Knoten, Buckel und andere Gebilde formen. Damit beschädigen sie Möbel und Kleidung, und die meisten Leute überlegen es sich zweimal, ob sie einen Troll umarmen wollen. Zumal es auch nur wenige gibt, die ihre Arme um einen Troll herum bekommen.

#Magic Resonance Choices
mor.mundane=Mundan
mor.mundane.page=67
mor.mundane.desc=Mundan bedeutet keinen Zugang zu Magie oder Resonanz. Ganz einfach. Deine Anpassungspunkte musst du anderswo ausgeben.
mor.adept=Adept
mor.adept.page=158
mor.adept.desc=Adepten konzentrieren ihre Magie nach innen und unterstützen ihre Fähigkeiten mit der natürlichen Gabe, Mana in sich hinein statt nach außen zu kanalisieren. Wegen dieser physischen Verbundenheit mit der Magie können Adepten nicht astral projizieren und erhalten die Fähigkeit zur astralen Wahrnehmung nur durch Ausbildung.
mor.aspectedmagician=Aspektzauberer
mor.aspectedmagician.page=160
mor.aspectedmagician.desc=Aspektzauberer können nur einen der drei Aspekte der Magie betreiben: Hexerei, Beschwören oder Verzaubern. Sie können die Astralebene mit astraler Wahrnehmung und Projektion erreichen.
mor.magician=Magier
mor.magician.page=130
mor.magician.desc=Vollzauberer erhalten Zugriff auf alle magischen Fertigkeiten (Hexerei, Beschwören und Verzaubern) und vollen Zugang zur Astralebene mit astraler Wahrnehmung (S. 161) und astraler Projektion (S. 162).
mor.mysticadept=Magieradept
mor.mysticadept.page=160
mor.mysticadept.desc=Magieradepten nutzen eine Mischung aus nach innen und nach außen gerichteter Magie. Sie können Zauber wirken, Geister beschwören und Gegenstände verzaubern, aber auch einen Teil ihrer Magie nach innen kanalisieren, um Adeptenkräfte zu nutzen. Sie können wegen der verankernden Wirkung ihrer Adeptenkräfte nicht astral projizieren, können aber mit der entsprechenden Ausbildung astral wahrnehmen. Sie müssen ihre Magie zwischen Zaubern und Adeptenkräften aufteilen.
mor.technomancer=Technomancer
mor.technomancer.page=188
mor.technomancer.desc=Technomancer haben eine besondere Verbindung mit der Matrix, die mit einem Attribut namens Resonanz gemessen wird. Sie haben die Fähigkeit, in kürzester Zeit Programme und Sprites zu erschaffen, und können die Energien der Matrix manipulieren und ihrem Willen unterwerfen.

