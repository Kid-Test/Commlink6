spell.acid_stream.desc=Dieser Zauber schießt Säure auf ein Ziel ab und verursacht Chemischen Schaden (S. 112). Das Ziel erhält den Status Verätzt (S. 55) mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe.
spell.toxic_wave.desc=Dieser Zauber ist die Flächenversion von Säurestrahl. Dieser Zauber schießt Säure auf ein Ziel ab und verursacht Chemischen Schaden (S. 112). Das Ziel erhält den Status Verätzt (S. 55) mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe.
spell.clout.desc=Ein kniffliger kleiner Zauber: Die Magie trifft nicht das Ziel, sondern verursacht plötzlichen Luftdruck in dessen Richtung. Die Macht des Windes, Bäume auszureißen, wird eindrucksvoll am Kopf des Ziels vorgeführt.
spell.blast.desc=Dieser Zauber ist die Flächenversion von Stoß (S. 139). Ein kniffliger kleiner Zauber: Die Magie trifft nicht das Ziel, sondern verursacht plötzlichen Luftdruck in dessen Richtung. Die Macht des Windes, Bäume auszureißen, wird eindrucksvoll am Kopf des Ziels vorgeführt.
spell.flamestrike.desc=Ein Klassiker. Wenn man daran denkt, Leuten mit Magie wehzutun, fällt einem als Erstes ein, ihnen Feuer ins Gesicht zu schleudern. Dies ist der Zauber, der das möglich macht. Flammenstoß verursacht Feuerschaden (S. 112). Das Ziel erhält den Status Brennend (S. 53) mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe.
spell.fireball.desc=Dieser Zauber ist die Flächenversion von Flammenstoß. Ein Klassiker. Wenn man daran denkt, Leuten mit Magie wehzutun, fällt einem als Erstes ein, ihnen Feuer ins Gesicht zu schleudern. Dies ist der Zauber, der das möglich macht. Feuerball verursacht Feuerschaden (S. 112). Das Ziel erhält den Status Brennend (S. 53) mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe.
spell.ice_spear.desc=Wenn so langsam alle Konzernsicherheitsschergen, denen man begegnet, brandhemmende Unterwäsche tragen, wird es Zeit für andere Mittel - und dafür, sie mit dem anderen Temperaturextrem anzugreifen. Dieser Zauber trifft seine Ziele mit Eiseskälte und verursacht Kälteschaden (S. 113).
spell.ice_storm.desc=Dieser Zauber ist die Flächenversion von Eisspeer. Wenn so langsam alle Konzernsicherheitsschergen, denen man begegnet, brandhemmende Unterwäsche tragen, wird es Zeit für andere Mittel - und dafür, sie mit dem anderen Temperaturextrem anzugreifen. Dieser Zauber trifft seine Ziele mit Eiseskälte und verursacht Kälteschaden (S. 113).
spell.lightning_bolt.desc=So haben Gottheiten von Zeus bis Thor die Unbotmäßigen zerschmettert, also sollte das auch für dich gut genug sein. Blitzstrahl trifft ein einzelnes Ziel mit Elektrizität. Der Zauber verursacht Elektrizitätsschaden (S. 112).
spell.lightning_ball.desc=Dieser Zauber ist die Flächenversion von Blitzstrahl (S. 138). So haben Gottheiten von Zeus bis Thor die Unbotmäßigen zerschmettert, also sollte das auch für dich gut genug sein. Blitzstrahl trifft ein einzelnes Ziel mit Elektrizität. Der Zauber verursacht Elektrizitätsschaden (S. 112).
spell.manabolt.desc=Eine grundlegende Technik der Spruchzauberei: Man benutzt Mana, um Schädel einzuschlagen. Wer könnte etwas gegen diese reine Eleganz sagen?
spell.manaball.desc=Dieser Zauber ist die Flächenversion von Manablitz. Eine grundlegende Technik der Spruchzauberei: Man benutzt Mana, um Schädel einzuschlagen. Wer könnte etwas gegen diese reine Eleganz sagen?
spell.powerbolt.desc=Energieblitz ist die härtere Version von Betäubungsblitz und trifft ein einzelnes Ziel mit Körperlichem Schaden.
spell.powerball.desc=Dieser Zauber ist die Flächenversion von Energieblitz. Energieblitz ist die härtere Version von Betäubungsblitz und trifft ein einzelnes Ziel mit Körperlichem Schaden.
spell.stunbolt.desc=Manchmal will man ein wenig Tempo rausnehmen und den Gegner überraschen. Dieser Zauber kanalisiert Mana, um jemandem wehzutun, aber nur zur Betäubung.
spell.stunball.desc=Dieser Zauber ist die Flächenversion von Betäubungsblitz. Manchmal will man ein wenig Tempo rausnehmen und den Gegner überraschen. Dieser Zauber kanalisiert Mana, um jemandem wehzutun, aber nur zur Betäubung.
spell.analyze_device.desc=Natürlich weißt du, wie ein Kommlink aussieht, aber das heißt nicht, dass du die Funktion der seltsamen schwarzen Box mit der einzelnen Buchse identifizieren kannst. Und die Geister mögen dir beistehen, wenn es um eine Maschine aus den 50ern oder Ähnliches geht. Gerät Analysieren verschafft dir, basierend auf den Nettoerfolgen (gegen den Objektwiderstand), Informationen über das unbekannte Gerät. Wenn ein Charakter ein Gerät zum ersten Mal benutzt, während dieser Zauber aufrechterhalten wird, erhält er Edge in Höhe der Anzahl der Nettoerfolge bei der Hexereiprobe (wobei natürlich die übliche Grenze von höchstens 2 Edge pro Kampfrunde gilt).
spell.analyze_magic.desc=Manchmal will man wissen, was ein bestimmter magischer Vorgang bewirkt, ohne die Astralebene zu nutzen. Dieser Zauber bietet dieselben Informationen wie das Askennen (siehe S. 161), nur dass man dazu nicht astral wahrzunehmen braucht. Bei der Vergleichenden Probe für diesen Zauber kommt als Würfelpool der Gegenseite die doppelte Anzahl der Erfolge (nicht Nettoerfolge) bei der ursprünglichen Probe (Beschwören, Verzaubern oder Hexerei) zum Einsatz, die den zu analysierenden magischen Effekt erschaffen hat.
spell.analyze_truth.desc=Der Beobachter erhält ein Gespür dafür, ob ein Ziel die Wahrheit sagt - oder wenigstens glaubt, die Wahrheit zu sagen. Mit mindestens 1 Nettoerfolg wird diese Einsicht möglich. Der Beobachter muss die fragliche Aussage selbst hören. Geschriebenes, Aufzeichnungen oder Übertragungen können dazu nicht benutzt werden - was natürlich daran liegt, dass es sich um einen Manazauber handelt.
spell.clairaudience.desc=Der Beobachter erhält die Fähigkeit, weit entfernte Geräusche zu hören. Er kann den betroffenen Punkt, an den er sein Gehör schickt, innerhalb der Reichweite des Zaubers auswählen und mit einer Nebenhandlung bewegen. An diesem Punkt hat sein Gehör dasselbe Hörvermögen wie normal. Solange der Zauber aufrechterhalten wird, kann der Beobachter nur Geräusche im Bereich des Zielpunktes hören (keine in seiner unmittelbaren Umgebung), und eventuelle Gehörverbesserungen haben keine Wirkung.
spell.clairvoyance.desc=Dieser Zauber ist dem Hellhören sehr ähnlich, betrifft aber die optische Wahrnehmung. Der Beobachter erhält die Fähigkeit, weit entfernte optische Eindrücke zu sehen. Er kann den betroffenen Punkt, an den er seinen Gesichtssinn schickt, innerhalb der Reichweite des Zaubers auswählen und mit einer Nebenhandlung bewegen. An diesem Punkt hat sein Gesichtssinn dasselbe Sehvermögen wie normal. Solange der Zauber aufrechterhalten wird, kann der Beobachter nur Dinge im Bereich des Zielpunktes sehen (keine in seiner unmittelbaren Umgebung), und eventuelle Sichtverbesserungen haben keine Wirkung.
spell.combat_sense.desc=Der Beobachter erhält ein besseres Gefühl für mögliche Gefahren und die Fähigkeit, schneller darauf zu reagieren. Erfolge bei der Hexereiprobe werden zu seinem Verteidigungswert und dem Würfelpool für Überraschungsproben (siehe S. 110) addiert, solange der Zauber aufrechterhalten wird.
spell.detect_enemies.desc=Dieser Zauber lässt den Beobachter wissen, ob jemand innerhalb der Sinnesreichweite ihm gegenüber feindliche Absichten hegt. Das funktioniert nur in Bezug auf Lebewesen - nicht bei Gegenständen. Der Zauber deckt auch nur Feindseligkeit auf, die sich spezifisch gegen den Beobachter richtet, nicht einen generellen Hass auf die gesamte Metamenschheit (wäre das so, müsste jeder in einem Slum hell aufleuchten). Großartig für das Entdecken von Hinterhalten.
spell.detect_life.desc=Verstecken sich Leute in diesem Geröllhaufen? Oder im Wald? Dieser Zauber zeigt sie dir. Trotz des allgemein klingenden Namens entdeckt er nicht jedes Lebewesen, sondern zielt auf Wesen mit Bewusstsein ab.
spell.detect_magic.desc=Niemand will eine ganze Deponie durchsuchen, um den magischen Ring in all dem Müll zu finden, aber manchmal ist es nötig. Deswegen hat ein unternehmungslustiger Magier diesen Zauber entwickelt, der den Beobachter auf alle Formen aktiver Magie innerhalb der Sinnesreichweite aufmerksam macht. Das umfasst Foki, Reagenzien, aktive Zauber, Hüter, alchemistische Erzeugnisse, Geister, Ritualwirkungen und Magische Refugien, aber keine Erwachten Personen, Critter, astralen Signaturen, alchemistischen Erzeugnisse, die bereits ausgelöst wurden oder ihre Wirksamkeit verloren haben, oder die Wirkung permanenter Zauber, wenn diese bereits permanent geworden sind.
spell.mindlink.desc=Kommlinks und Textnachrichten? Wie altmodisch. Wirf deine Gedanken einfach in jemandes Geist, und du erhältst das Optimum an schneller Kommunikation! Solange mindestens ein Erfolg bei der Hexereiprobe erzielt wurde, besteht eine Verbindung, über die du mentale Kommunikation in jeder Weise betreiben kannst, die für dich und das Ziel verständlich ist. Die Probe muss nicht als Vergleichende Probe abgelegt werden, weil das Ziel der Telepathie freiwillig mitmachen muss. Zaubernder und Ziel müssen innerhalb der Reichweite bleiben, damit die Verbindung funktioniert. Wenn sie sich zu weit auseinanderbewegen und danach wieder in Reichweite kommen, können sie die Kommunikation wieder aufnehmen, sofern der Zauber aufrechterhalten wurde.
spell.mind_probe.desc=Der Beobachter kann in den Geist eines Ziels eindringen und versuchen, möglichst viele von dessen Gedanken zu erkennen - und dabei auch herauszufinden, was davon wahr und was reine Selbsttäuschung ist. Lege eine Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab. Die Nettoerfolge legen fest, ob der Beobachter überhaupt in Reichweite des Ziels ist und wie viele Informationen er aus dem Kopf des Ziels holen kann. Die Tabelle Ergebnisse der Geistessonde (S. 144) gibt die Art von Informationen an, die durch den Zauber gewonnen wird.
spell.antidote.desc=Dieser Zauber lässt Mana durch den Körper des Ziels jagen, um Toxine zu finden und zu neutralisieren. Lege eine Ausgedehnte Probe auf Hexerei + Magie (Kraft des Toxins, 1 Kampfrunde) ab. Jeder Erfolg senkt die Kraft des Toxins um 1. Sobald die Kraft auf 0 oder darunter gesunken ist, werden alle noch aktiven Wirkungen des Toxins beseitigt.
spell.cleansing_heal.desc=Dieser Zauber hat die gleiche Heilwirkung wie der Zauber Heilen. Lege eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Jeder Nettoerfolg heilt 1 Kästchen Überzähligen, Körperlichen oder Betäubungsschaden.\nAußerdem besitzt diese Variante des Zaubers ein neutralisierendes Element, das den Status Verätzt beim Ziel beendet. Ein Satz Verletzungen kann nur einmal mit einem Heilen-Zauber behandelt werden.
spell.cooling_heal.desc=Dieser Zauber hat die gleiche Heilwirkung wie der Zauber Heilen. Lege eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Jeder Nettoerfolg heilt 1 Kästchen Überzähligen, Körperlichen oder Betäubungsschaden.\nAußerdem besitzt diese Variante des Zaubers ein kühlendes Element, das den Status Brennend beim Ziel beendet. Ein Satz Verletzungen kann nur einmal mit einem Heilen-Zauber behandelt werden.
spell.decrease_attribute.desc=Die Berührung des Zauberers schwächt das Ziel, verlangsamt es oder macht es benommen, was dazu führt, dass eines seiner Attribute vorübergehend sinkt. Der Zaubernde entscheidet vor dem Wirken des Zaubers, welches Attribut gesenkt werden soll, und legt dann eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + betroffenes Attribut des Ziels ab. Er kann entscheiden, wie viele Nettoerfolge er wirklich benutzen will, um das Attribut um jeweils 1 Punkt pro Nettoerfolg zu senken. Für jeden Nettoerfolg ab dem zweiten, der für die Senkung benutzt wird, steigt der Entzug des Zaubers kumulativ um 1. Der Zauber senkt weder Edge noch Essenz, Magie oder Resonanz.
spell.heal.desc=In einem Runnerleben kommt es immer wieder zu Schrammen, Blessuren und Schusswunden, und Magie ist wahrscheinlich die schnellste und effektivste Heilungsmöglichkeit dafür. Lege zum Wirken dieses Zaubers eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Für jeden Nettoerfolg kannst du 1 Kästchen Überzähligen, Körperlichen oder Betäubungsschaden heilen. Ein Satz Verletzungen kann nur einmal mit einem Heilen-Zauber (inklusive Kühlendes Heilen, Neutralisierendes Heilen und Wärmendes Heilen) behandelt werden
spell.increase_attribute.desc=Die Berührung des Zauberers stärkt, beschleunigt oder erleuchtet das Ziel, was dazu führt, dass eines seiner Attribute vorübergehend steigt. Der Zaubernde entscheidet vor dem Wirken des Zaubers, welches Attribut gesteigert werden soll, und legt dann eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Er kann entscheiden, wie viele Nettoerfolge er wirklich benutzen will, um das Attribut (unter Berücksichtigung des maximalen Bonus von +4) um jeweils 1 Punkt pro Nettoerfolg zu steigern. Für jeden Nettoerfolg ab dem zweiten, der für die Steigerung benutzt wird, steigt der Entzug des Zaubers kumulativ um 1. Der Zauber steigert weder Edge noch Essenz, Magie oder Resonanz.
spell.increase_reflexes.desc=Die Reaktionszeit des Ziels nimmt ab und seine Schnelligkeit zu, wodurch es Situationen besser vorausahnen und darauf reagieren kann. Der Zaubernde legt eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Er kann entscheiden, wie viele Nettoerfolge er wirklich benutzen will, um pro Nettoerfolg sowohl den Initiativewert um 1 Punkt als auch die Anzahl der Initiativewürfel um 1 Würfel zu steigern. Für jeden Nettoerfolg ab dem zweiten, der für die Steigerung benutzt wird, steigt der Entzug des Zaubers kumulativ um 1. Ein Charakter kann insgesamt niemals mehr als 5W6 Initiativewürfel haben.
spell.resist_pain.desc=Dieser Zauber gewährt zwar keine Heilung, erlaubt dem Ziel aber, die Auswirkungen von Schaden zu ignorieren und weiterzumachen, als gäbe es keinen Grund für Schmerzen. Lege eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Für jeden Nettoerfolg kann das Ziel seinen Verletzungsmodifikator um 1 senken.
spell.stabilize.desc=Dieser Zauber wird benutzt, wenn jemand Überzähligen Schaden erlitten hat. Lege eine Probe auf Hexerei + Magie mit einem Schwellenwert in Höhe der Anzahl der Kästchen an Überzähligem Schaden des Ziels ab. Gelingt die Probe, werden sa?mtliche Ka?stchen des U?berza?hligen Schadens entfernt.
spell.warming_heal.desc=Dieser Zauber hat die gleiche Heilwirkung wie der Zauber Heilen. Lege eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Jeder Nettoerfolg heilt 1 Kästchen Überzähligen, Körperlichen oder Betäubungsschaden.\nAußerdem besitzt diese Variante des Zaubers ein wärmendes Element, das den Status Unterkühlt beim Ziel beendet. Ein Satz Verletzungen kann nur einmal mit einem Heilen-Zauber behandelt werden.
spell.agony.desc=Dieser Zauber verursacht Schmerzen, aber keinen Schaden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab. Jeder Nettoerfolg erzeugt ein zusätzliches illusorisches Kästchen Schaden - und zwar jeweils auf beiden Zustandsmonitoren -, das sich nur auf die Bestimmung von Verletzungsmodifikatoren auswirkt. Wenn einer oder beide Zustandsmonitore dadurch voll werden, bleibt das Ziel zwar bei Bewusstsein, leidet aber unter so starken Schmerzen, dass es keine Handlungen mehr durchführen kann. Wenn der Zauber fallen gelassen wird, endet die Wirkung des Schmerzes sofort.\nDer einfache Zauber wirkt nur gegen ein einzelnes Ziel, aber die Anpassung Fläche Vergrößern kann verwendet werden, um ihm eine Flächenwirkung zu verleihen (beginnend mit 2 Metern Radius für +1 Entzug).
spell.confusion.desc=Verwirrung trifft das Ziel mit einem Wirbel von Bildern und Emotionen, die es desorientieren und verwirren. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab. Das Ziel erhält den Status Verwirrt mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe. Das Ziel erhält einen Würfelpoolmalus in Höhe dieser Zahl bei allen Proben außer Schadenswiderstandsproben.\nDer einfache Zauber wirkt nur gegen ein einzelnes Ziel, aber die Anpassung Fläche Vergrößern kann verwendet werden, um ihm eine Flächenwirkung zu verleihen (beginnend mit 2 Metern Radius für +1 Entzug). Wenn der Zauber eine Flächenwirkung erhalten hat, kann auch die Anpassung Fläche Verschieben benutzt werden.
spell.chaos.desc=Chaos trifft das Ziel mit einem Wirbel von Bildern und Emotionen, die es desorientieren und verwirren. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab. Das Ziel erhält den Status Verwirrt mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe. Das Ziel erhält einen Würfelpoolmalus in Höhe dieser Zahl bei allen Proben außer Schadenswiderstandsproben.\nDer einfache Zauber wirkt nur gegen ein einzelnes Ziel, aber die Anpassung Fläche Vergrößern kann verwendet werden, um ihm eine Flächenwirkung zu verleihen (beginnend mit 2 Metern Radius für +1 Entzug). Wenn der Zauber eine Flächenwirkung erhalten hat, kann auch die Anpassung Fläche Verschieben benutzt werden. Im Gegensatz zu Verwirrung wird dieser Zauber auch gegen Kameras, Mikrofone und andere Arten von Technologie.
spell.hush.desc=Magische Stille senkt sich auf das Ziel und macht es ihm unmöglich, ein Geräusch zu verursachen, selbst wenn es das versucht. Das kann für Leute sehr praktisch sein, die sich an jemandem vorbeischleichen wollen - oder es kann eine gute Möglichkeit sein, um die Kommunikation von anderen zu stören, die auf Sprechen angewiesen sind. Schweigen verleiht dem Ziel den Status Geräuschlos (siehe S. 54) mit einer Stufe gleich der Anzahl der Erfolge bei der Hexereiprobe. Diese Zahl dient als Schwellenwert für alle Versuche, das Ziel zu hören.
spell.silence.desc=Magische Stille senkt sich auf das Ziel und macht es ihm unmöglich, ein Geräusch zu verursachen, selbst wenn es das versucht. Das kann für Leute sehr praktisch sein, die sich an jemandem vorbeischleichen wollen - oder es kann eine gute Möglichkeit sein, um die Kommunikation von anderen zu stören, die auf Sprechen angewiesen sind. Stille verleiht dem Ziel den Status Geräuschlos (Verbessert, siehe S. 54) mit einer Stufe gleich der Anzahl der Erfolge bei der Hexereiprobe. Diese Zahl dient als Schwellenwert für alle Versuche, das Ziel zu hören und im Gegensatz zu Schweigen können auch Mikrofone und andere Technologie das Ziel nicht hören.
spell.invisibility.desc=Das Ziel verschwindet aus dem Blick und wird durchsichtig, sodass es sich ungesehen bewegen kann. Unsichtbarkeit verleiht dem Ziel den Status Unsichtbar (siehe S. 55) mit einer Stufe gleich der Anzahl der Erfolge bei der Hexereiprobe. Diese Zahl dient als Schwellenwert für alle Versuche, das Ziel zu sehen.
spell.improved_invisibility.desc=Das Ziel verschwindet aus dem Blick und wird durchsichtig, sodass es sich ungesehen bewegen kann. Unsichtbarkeit verleiht dem Ziel den Status Unsichtbar (verbessert, siehe S. 55) mit einer Stufe gleich der Anzahl der Erfolge bei der Hexereiprobe. Diese Zahl dient als Schwellenwert für alle Versuche, das Ziel zu sehen. Auch Kameras und andere Technologie können das Ziel nicht sehen.
spell.mask.desc=Manchmal will man nicht gesehen werden. Und manchmal will man als jemand gesehen werden, der man nicht ist. Maske dient dem zweiten Zweck. Der Zauber verändert wichtige Merkmale der Person: ihr Erscheinungsbild, ihren Klang, ihren Geruch und so weiter. Lege eine Probe auf Hexerei + Magie ab und notiere die Anzahl der Erfolge. Diese Zahl bildet den Schwellenwert, wenn andere versuchen, mit einer Probe auf Willenskraft + Intuition die Illusion zu durchschauen. Maske wirkt nur gegen Lebewesen mit Bewusstsein.
spell.physical_mask.desc=Manchmal will man nicht gesehen werden. Und manchmal will man als jemand gesehen werden, der man nicht ist. Physische Maske dient dem zweiten Zweck. Der Zauber verändert wichtige Merkmale der Person: ihr Erscheinungsbild, ihren Klang, ihren Geruch und so weiter. Lege eine Probe auf Hexerei + Magie ab und notiere die Anzahl der Erfolge. Diese Zahl bildet den Schwellenwert, wenn andere versuchen, mit einer Probe auf Willenskraft + Intuition die Illusion zu durchschauen. Im Gegensatz zmm Zauber Maske wirkt diese Version auch gegen Kameras, Mikrofone und andereTechnologie.
spell.phantasm.desc=Mit diesem Zauber projizierst du ein bestimmtes Bild (begleitet von dazugehörigen Geräuschen und Gerüchten) in einen bestimmten Wirkungsbereich. Vielleicht ist es das Bild eines angreifenden Drachen, eines friedlichen Gartens oder einer bestimmten Person. Jedenfalls muss es etwas darstellen, was du bereits gesehen hast, und das Trugbild muss in deiner Sichtlinie bleiben. Lege eine Probe auf Hexerei + Magie ab und notiere die Anzahl der Erfolge. Diese Zahl bildet den Schwellenwert, wenn andere versuchen, mit einer Probe auf Willenskraft + Intuition die Illusion zu durchschauen.\nTrugbild wirkt gegen jedes Lebewesen, das das Bild sieht.
spell.trid_phantasm.desc=Mit diesem Zauber projizierst du ein bestimmtes Bild (begleitet von dazugehörigen Geräuschen und Gerüchten) in einen bestimmten Wirkungsbereich. Vielleicht ist es das Bild eines angreifenden Drachen, eines friedlichen Gartens oder einer bestimmten Person. Jedenfalls muss es etwas darstellen, was du bereits gesehen hast, und das Trugbild muss in deiner Sichtlinie bleiben. Lege eine Probe auf Hexerei + Magie ab und notiere die Anzahl der Erfolge. Diese Zahl bildet den Schwellenwert, wenn andere versuchen, mit einer Probe auf Willenskraft + Intuition die Illusion zu durchschauen.\nTrideo-Trugbild wirkt gegen jedes Lebewesen, das das Bild sieht und auch gegen Kameras, Mikrofone und andere Technologie.
spell.sensor_sneak.desc=Verbesserte Unsichtbarkeit, Physische Maske und ähnliche Zauber sind hervorragend dazu geeignet, sowohl neugierige Augen als auch Technologie zu täuschen, aber was ist mit einer Situation, in der keine Lebewesen präsent sind, sondern nur Kameras, Sensoren und Ähnliches? Sensortäuschung ist genau der richtige Zauber dafür. Durch ihn erhält das Ziel eine Version des Status Unsichtbar (Verbessert) mit einer Stufe gleich der Anzahl der Erfolge der Hexereiprobe, aber der Zauber hat keine Wirkung auf Lebewesen, sondern nur auf technologiebasierte Sensoren.
spell.animate_metal.desc=Ein Stück Material der betroffenen Art wird zum Leben erweckt und bewegt sich auf Befehl des Zaubernden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand des zu belebenden Materials/Objekts ab. Verwende die Tabelle Beispiele für Volumina, um zu bestimmen, wie viel Material belebt wird. Das Material kann sich entsprechend seiner Form bewegen, sollte aber im Allgemeinen nicht schneller als 5 Meter pro Kampfrunde sein, wenn es sich nicht um ein Fahrzeug mit Rädern oder etwas anderes mit einer innewohnenden Geschwindigkeit handelt. Das Objekt kann sich im Allgemeinen nicht koordiniert bewegen, daher kann man Angriffen von belebten Objekten leicht ausweichen, weil sie langsam sind. Das Objekt könnte aber einem bewegungslosen oder unaufmerksamen Ziel einen Schlag versetzen, der bei Metall 4K, bei Stein 3K, bei Holz 2B und bei Kunststoff 1B Schaden verursacht.\nDas Kommandieren der belebten Substanz erfordert eine Nebenhandlung. Wenn jemand versucht, das Objekt am Ausführen der Befehle zu hindern, wird eine Vergleichende Probe mit den Nettoerfolgen der Hexereiprobe + [4 (für Metall), 3 (für Stein), 2 (für Holz), 1 (für Kunststoff)] gegen Konstitution + Stärke des Gegners abgelegt, um zu bestimmen, ob das Objekt wirklich daran gehindert werden kann.\nEs kann knifflig sein, den richtigen Zauber zu wählen, weil viele Objekte nicht vollständig aus nur einem Material bestehen - Tische zum Beispiel können Holz- oder Kunststoffplatten und Metallbeine haben. Wähle das vorherrschende Material innerhalb des Objekts aus und belebe es mit dem dazugehörigen Zauber. Die Magie, die auf den Großteil des Materials wirkt, schafft es, den Rest einfach mit auf die Reise zu nehmen.
spell.animate_plastic.desc=Ein Stück Material der betroffenen Art wird zum Leben erweckt und bewegt sich auf Befehl des Zaubernden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand des zu belebenden Materials/Objekts ab. Verwende die Tabelle Beispiele für Volumina, um zu bestimmen, wie viel Material belebt wird. Das Material kann sich entsprechend seiner Form bewegen, sollte aber im Allgemeinen nicht schneller als 5 Meter pro Kampfrunde sein, wenn es sich nicht um ein Fahrzeug mit Rädern oder etwas anderes mit einer innewohnenden Geschwindigkeit handelt. Das Objekt kann sich im Allgemeinen nicht koordiniert bewegen, daher kann man Angriffen von belebten Objekten leicht ausweichen, weil sie langsam sind. Das Objekt könnte aber einem bewegungslosen oder unaufmerksamen Ziel einen Schlag versetzen, der bei Metall 4K, bei Stein 3K, bei Holz 2B und bei Kunststoff 1B Schaden verursacht.\nDas Kommandieren der belebten Substanz erfordert eine Nebenhandlung. Wenn jemand versucht, das Objekt am Ausführen der Befehle zu hindern, wird eine Vergleichende Probe mit den Nettoerfolgen der Hexereiprobe + [4 (für Metall), 3 (für Stein), 2 (für Holz), 1 (für Kunststoff)] gegen Konstitution + Stärke des Gegners abgelegt, um zu bestimmen, ob das Objekt wirklich daran gehindert werden kann.\nEs kann knifflig sein, den richtigen Zauber zu wählen, weil viele Objekte nicht vollständig aus nur einem Material bestehen - Tische zum Beispiel können Holz- oder Kunststoffplatten und Metallbeine haben. Wähle das vorherrschende Material innerhalb des Objekts aus und belebe es mit dem dazugehörigen Zauber. Die Magie, die auf den Großteil des Materials wirkt, schafft es, den Rest einfach mit auf die Reise zu nehmen.
spell.animate_stone.desc=Ein Stück Material der betroffenen Art wird zum Leben erweckt und bewegt sich auf Befehl des Zaubernden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand des zu belebenden Materials/Objekts ab. Verwende die Tabelle Beispiele für Volumina, um zu bestimmen, wie viel Material belebt wird. Das Material kann sich entsprechend seiner Form bewegen, sollte aber im Allgemeinen nicht schneller als 5 Meter pro Kampfrunde sein, wenn es sich nicht um ein Fahrzeug mit Rädern oder etwas anderes mit einer innewohnenden Geschwindigkeit handelt. Das Objekt kann sich im Allgemeinen nicht koordiniert bewegen, daher kann man Angriffen von belebten Objekten leicht ausweichen, weil sie langsam sind. Das Objekt könnte aber einem bewegungslosen oder unaufmerksamen Ziel einen Schlag versetzen, der bei Metall 4K, bei Stein 3K, bei Holz 2B und bei Kunststoff 1B Schaden verursacht.\nDas Kommandieren der belebten Substanz erfordert eine Nebenhandlung. Wenn jemand versucht, das Objekt am Ausführen der Befehle zu hindern, wird eine Vergleichende Probe mit den Nettoerfolgen der Hexereiprobe + [4 (für Metall), 3 (für Stein), 2 (für Holz), 1 (für Kunststoff)] gegen Konstitution + Stärke des Gegners abgelegt, um zu bestimmen, ob das Objekt wirklich daran gehindert werden kann.\nEs kann knifflig sein, den richtigen Zauber zu wählen, weil viele Objekte nicht vollständig aus nur einem Material bestehen - Tische zum Beispiel können Holz- oder Kunststoffplatten und Metallbeine haben. Wähle das vorherrschende Material innerhalb des Objekts aus und belebe es mit dem dazugehörigen Zauber. Die Magie, die auf den Großteil des Materials wirkt, schafft es, den Rest einfach mit auf die Reise zu nehmen.
spell.animate_wood.desc=Ein Stück Material der betroffenen Art wird zum Leben erweckt und bewegt sich auf Befehl des Zaubernden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand des zu belebenden Materials/Objekts ab. Verwende die Tabelle Beispiele für Volumina, um zu bestimmen, wie viel Material belebt wird. Das Material kann sich entsprechend seiner Form bewegen, sollte aber im Allgemeinen nicht schneller als 5 Meter pro Kampfrunde sein, wenn es sich nicht um ein Fahrzeug mit Rädern oder etwas anderes mit einer innewohnenden Geschwindigkeit handelt. Das Objekt kann sich im Allgemeinen nicht koordiniert bewegen, daher kann man Angriffen von belebten Objekten leicht ausweichen, weil sie langsam sind. Das Objekt könnte aber einem bewegungslosen oder unaufmerksamen Ziel einen Schlag versetzen, der bei Metall 4K, bei Stein 3K, bei Holz 2B und bei Kunststoff 1B Schaden verursacht.\nDas Kommandieren der belebten Substanz erfordert eine Nebenhandlung. Wenn jemand versucht, das Objekt am Ausführen der Befehle zu hindern, wird eine Vergleichende Probe mit den Nettoerfolgen der Hexereiprobe + [4 (für Metall), 3 (für Stein), 2 (für Holz), 1 (für Kunststoff)] gegen Konstitution + Stärke des Gegners abgelegt, um zu bestimmen, ob das Objekt wirklich daran gehindert werden kann.\nEs kann knifflig sein, den richtigen Zauber zu wählen, weil viele Objekte nicht vollständig aus nur einem Material bestehen - Tische zum Beispiel können Holz- oder Kunststoffplatten und Metallbeine haben. Wähle das vorherrschende Material innerhalb des Objekts aus und belebe es mit dem dazugehörigen Zauber. Die Magie, die auf den Großteil des Materials wirkt, schafft es, den Rest einfach mit auf die Reise zu nehmen.
spell.armor.desc=Deine Magie füllt den Körper des Ziels, härtet ihn und lässt ihn Schaden besser wegstecken. Lege eine Probe auf Hexerei + Magie ab und addiere die Erfolge zum Verteidigungswert des Ziels.
spell.control_actions.desc=Der Zaubernde wird zum Marionettenspieler, übernimmt die Herrschaft über eine andere Person und lässt sie nach seiner Pfeife tanzen. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab. Das Ziel weiß, was geschieht, kann aber wenig dagegen tun. Der Zaubernde verwendet für seine Befehle dieselben Handlungen, die er dem Ziel befiehlt, also ist es für ihn eine Nebenhandlung, dem Ziel eine Bewegung zu befehlen, und ein Angriffsbefehl ist eine Haupthandlung. Das heißt auch, dass der Zaubernde keine eigenen Handlungen durchführen kann, während er das Ziel steuert.\nDieser Zauber kann durch die Anpassung Fläche Vergrößern zu einem Zauber mit Flächenwirkung gemacht werden (beginnend mit 2 Metern Radius für +1 Entzug). Wenn der Zauber gewirkt ist, bleibt seine Wirkung bei Personen bestehen, die dem Zauber nicht widerstehen konnten, selbst wenn sie sich nach außerhalb des ursprünglichen Bereichs bewegen.
spell.control_thoughts.desc=Dieser Zauber ist Handlungen Beherrschen ähnlich, aber noch hinterhältiger, weil er den Zaubernden in den Kopf des Ziels eindringen lässt und ihn entscheiden lässt, was es zu denken hat. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab.\nAnders als bei Handlungen Beherrschen ist es nicht sicher, dass das Ziel sich dieser Einflussnahme bewusst ist. Je näher die befohlenen Gedanken der normalen Gedankenwelt des Ziels sind, desto weniger wahrscheinlich ist es, dass es das Eindringen erkennt. Wenn der Spielleiter es beschließt, kann das Ziel eine Probe auf Logik + Intuition ablegen, wenn der Zauber endet, um zu erkennen, dass es unter der Wirkung des Zaubers stand. Der Schwellenwert ist davon abhängig, wie fremd die eingegebenen Gedanken seiner normalen Denkweise waren.\nDer Zaubernde spielt zwar eine mächtige Rolle dabei, die Gedanken des Ziels zu formen, aber gewisse Instinkte sind sehr schwer zu überwinden. Gedanken wie "Ich sollte von diesem Gebäude springen" oder "Ich sollte meinen besten Freund/Partner/ein Familienmitglied angreifen" wird meistens widerstanden. Bei solchen Gedanken kann der Spielleiter dem Ziel eine Probe auf Willenskraft + Logik zugestehen, um ihnen zu widerstehen. Das Ziel kann Edge für diese Probe erhalten, wenn der Gedanke seinen grundlegenden Instinkten zuwiderläuft oder einfach zu weit von seinem üblichen Denken entfernt ist.
spell.darkness.desc=Umgebung nach deinen Vorstellungen. Für jeden Erfolg kannst du die Beleuchtung der Umgebung um eine Abstufung (s. Tabelle Umgebung und Lichtverhältnisse, S. 108) senken, was dabei helfen kann, durch Umgebung und Lichtverhältnisse Edge zu erhalten. Es handelt sich um einen Zauber mit Flächenwirkung, der mit Fläche Vergrößern und Fläche Verschieben angepasst werden kann.
spell.light.desc=Dieser Zauber verändert die Lichtverhältnisse deiner Umgebung nach deinen Vorstellungen. Für jeden Erfolg kannst du die Beleuchtung der Umgebung um eine Abstufung (s. Tabelle Umgebung und Lichtverhältnisse, S. 108) erhöhen, was dabei helfen kann, durch Umgebung und Lichtverhältnisse Edge zu erhalten. Es handelt sich um einen Zauber mit Flächenwirkung, der mit Fläche Vergrößern und Fläche Verschieben angepasst werden kann.
spell.elemental_armor.desc=Deine Magie füllt den Körper des Ziels, härtet ihn und lässt ihn Schaden besser wegstecken. Lege eine Probe auf Hexerei + Magie ab und addiere die Erfolge zum Verteidigungswert des Ziels.\nWenn du den Zauber wirkst, wählst du außerdem einen Elementareffekt aus, gegen den der Zauber schützen soll. Abhängig von dieser Auswahl kann das Ziel bestimmte Status nicht erhalten, die in der Tabelle Elementarpanzerung angegeben sind. Das Ziel kann zwar Schaden durch eine Waffe oder einen Zauber erleiden, durch die oder den Schaden der betreffenden Art verursacht wird - zum Beispiel kann es mit kühlender Panzerung Schaden durch einen Feuerball erhalten, wenn es ihm nicht vollständig widersteht -, erhält aber nicht den Status (in diesem Fall Brennend), der dadurch verursacht würde.
spell.fling.desc=Wenn du jemals "Hätte ich magische Kräfte, würde ich ganz sicher Dinge in den Himmel katapultieren, nur ohne Katapult" dachtest, ist dieser Zauber genau für dich gemacht. Lege eine Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Du kannst pro Nettoerfolg ein halbes Kilo Material in die Luft schleudern, und die Nettoerfolge bilden auch den Schwellenwert für potenzielle Opfer, die mit Reaktion + Intuition diesen Geschossen ausweichen wollen. Ein geschleudertes Objekt hat die folgenden Angriffswerte: Sehr nah: Magie; Nah: Magie + 2; Mittel: Magie + 1; Weit: Magie - 2; Sehr weit: -. Das Objekt verursacht Betäubungsschaden in Höhe seines (aufgerundeten) Gewichts in Kilogramm.
spell.focus_burst.desc=Fokus-Foki können für Zauberer eine mächtige Unterstützung sein, aber wer wollte noch nie ab und zu ein bisschen mehr Macht aus ihnen herausquetschen? Mit Fokus-Boost kannst du ein wenig mehr aus deinem Fokus herausholen oder den Fokus eines anderen unterstützen. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Kraftstufe × 2 des Fokus ab. Wenn du Nettoerfolge erzielst, steigt die Kraftstufe des Fokus um 1. Ein Kritischer Patzer bei der Hexereiprobe senkt die Kraftstufe des Fokus permanent um 2.
spell.levitate.desc=Vielleicht nicht ganz dasselbe wie Fliegen, aber immerhin überwindet man die Schwerkraft - und es macht Spaß! Lege eine Probe auf Hexerei + Magie ab. Jeder Erfolg ermöglicht dir das Levitieren von 50 Kilogramm Material oder Personen. Wenn es sich um Personen handelt und diese nicht besonders viel Lust auf das Levitieren haben, können sie eine Probe auf Konstitution + Stärke ablegen, wobei jeder Erfolg die Anzahl deiner Erfolge um 1 senkt.\nDas Ziel muss in Sicht bleiben, wenn es in der Luft bleiben soll; sobald es außer Sicht gerät, beginnt der Absturz. Das hat - neben einer gewissen Vorsicht, weil der Zauber unterbrochen werden könnte - dazu geführt, dass sich die maximale Höhe, die Personen mit diesem Zauber erreichen, von selbst begrenzt.\nDas Ziel muss nicht auf der Stelle schweben. Es kann vom Zaubernden mit einer Bewegungsrate von [Magie des Zaubernden] Metern pro Runde bewegt werden. Diese Bewegung ist eine Nebenhandlung.
spell.mana_barrier.desc=Du möchtest einen geisterfreien Raum? Du möchtest, dass "Keine Foki!" in deiner Bar wirklich gilt? Dann empfiehlt sich eine Manabarriere. Diese unsichtbare (nur auf der Astralebene sichtbare) Wand schränkt die körperliche Bewegung von Lebewesen oder mundanen Gegenständen nicht ein, hält aber Geister, aktivierte Foki, Dualwesen, alchemistische Erzeugnisse, Reagenzien und Zauber auf der Ebene auf, auf der sie gewirkt wurde (physisch oder astral). Wenn die Barriere im Astralraum gewirkt wird, hält sie dort auch astrale Gestalten auf und behindert die Sicht. Lege eine Probe auf Hexerei + Magie ab. Die Strukturstufe der Wand, die dadurch entsteht, ist gleich Magie + Erfolge bei der Hexereiprobe.\nDer einfache Zauber erschafft eine Barriere von zwei mal zwei Metern. Der Zauber kann mit Fläche Vergrößern angepasst werden, was jeweils zwei Meter Breite und Höhe hinzuaddiert (aber nicht mehr Dicke). Die Barriere kann vom Zaubernden nach Belieben geformt werden. Näheres zu Manabarrieren findest du auf Seite 163.
spell.mystic_armor.desc=Deine Magie füllt die Astralgestalt des Ziels, härtet diese und lässt sie Schaden besser wegstecken. Lege eine Probe auf Hexerei + Magie ab und addiere die Erfolge zum Verteidigungswert des Ziels im Astralkampf und gegen Mana-Kampfzauber
spell.overclock.desc=Magie und Technologie kommen nicht immer gut miteinander aus, aber manchmal können sie ihre Kräfte vereinen. Mit diesem Zauber kann man für kurze Zeit die Macht eines elektronischen Geräts verstärken, sodass es schneller und besser läuft. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Jeder Nettoerfolg erhöht ein Attribut des Geräts (Gerätestufe, Angriff, Datenverarbeitung, Firewall oder Schleicher) um 1. Der Zaubernde kann einige der Nettoerfolge auch nicht einsetzen, wenn er das Gerät nicht überfordern will.\nDieser Zauber beansprucht ein Gerät stark. Nachdem der Zauber fallen gelassen wurde, erleidet das Gerät Matrixschaden in Höhe der Anzahl der benutzten Nettoerfolge, dem mit Firewall widerstanden wird.
spell.physical_barrier.desc=Manchmal willst du Magie von dir fernhalten, und manchmal willst du absolut alles auf der physischen Ebene von dir fernhalten, was du kannst. Lege eine Probe auf Hexerei + Magie ab. Dadurch entsteht auf der physischen Ebene eine Wand dort, wo du sie willst, mit einer Strukturstufe gleich Magie + Erfolge bei der Hexereiprobe. Der Zauber erschafft eine Barriere von zwei mal zwei Metern mit einer Dicke von zwei Zentimetern. Der Zauber kann mit Fläche Vergrößern angepasst werden, was jeweils zwei Meter Breite und Höhe hinzuaddiert (aber nicht mehr Dicke). Die Barriere kann vom Zaubernden nach Belieben geformt werden.
spell.shape_metal.desc=Dieser Zauber gibt dir die Möglichkeit, Metall formbar - buchstäblich zu Wachs in deinen (mentalen) Händen - zu machen. Du kannst es formen, solange der Zauber aufrechterhalten wird. Nach dem Fallenlassen behält es die Form bei, die du ihm gegeben hast. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Die Menge an Metall, das du formen kannst, wird von den Nettoerfolgen bestimmt. Du kannst 1 Kubikmeter Material pro Nettoerfolg formen (s. Tabelle Beispiele für Volumina, S. 139). Um diesen Zauber auf ein Objekt wirken zu können, muss es nicht zur Gänze aus Metall bestehen; es genügt, wenn es überwiegend daraus besteht.
spell.shape_plastic.desc=Dieser Zauber gibt dir die Möglichkeit, Kunststoff formbar - buchstäblich zu Wachs in deinen (mentalen) Händen - zu machen. Du kannst es formen, solange der Zauber aufrechterhalten wird. Nach dem Fallenlassen behält es die Form bei, die du ihm gegeben hast. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Die Menge an Kunststoff, das du formen kannst, wird von den Nettoerfolgen bestimmt. Du kannst 1 Kubikmeter Material pro Nettoerfolg formen (s. Tabelle Beispiele für Volumina, S. 139). Um diesen Zauber auf ein Objekt wirken zu können, muss es nicht zur Gänze aus Kunststoff bestehen; es genügt, wenn es überwiegend daraus besteht.
spell.shape_stone.desc=Dieser Zauber gibt dir die Möglichkeit, Stein formbar - buchstäblich zu Wachs in deinen (mentalen) Händen - zu machen. Du kannst es formen, solange der Zauber aufrechterhalten wird. Nach dem Fallenlassen behält es die Form bei, die du ihm gegeben hast. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Die Menge an Stein, das du formen kannst, wird von den Nettoerfolgen bestimmt. Du kannst 1 Kubikmeter Material pro Nettoerfolg formen (s. Tabelle Beispiele für Volumina, S. 139). Um diesen Zauber auf ein Objekt wirken zu können, muss es nicht zur Gänze aus Stein bestehen; es genügt, wenn es überwiegend daraus besteht.
spell.shape_wood.desc=Dieser Zauber gibt dir die Möglichkeit, Holz formbar - buchstäblich zu Wachs in deinen (mentalen) Händen - zu machen. Du kannst es formen, solange der Zauber aufrechterhalten wird. Nach dem Fallenlassen behält es die Form bei, die du ihm gegeben hast. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Die Menge an Holz, das du formen kannst, wird von den Nettoerfolgen bestimmt. Du kannst 1 Kubikmeter Material pro Nettoerfolg formen (s. Tabelle Beispiele für Volumina, S. 139). Um diesen Zauber auf ein Objekt wirken zu können, muss es nicht zur Gänze aus Holz bestehen; es genügt, wenn es überwiegend daraus besteht.
spell.strengthen_wall.desc=Ob du eine Wand verstärken willst, durch die Gegner durchbrechen wollen, oder den Lärm der Leute dämpfen willst, die nebenan Krach machen - es kann jedenfalls nützlich sein, eine bestehende Wand ein bisschen stärker zu machen. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand der Wand ab, die du verstärken willst. Pro Nettoerfolg steigt die Strukturstufe um 1. Mit der Grundversion des Zaubers kannst du vier Quadratmeter Wand verstärken. Mit der Anpassung Fläche Vergrößern kannst du diesen Bereich um vier Quadratmeter pro Punkt höherem Entzug vergrößern. Die Anpassung Fläche Verschieben kann für diesen Zauber verwendet werden.
spell.thunder.desc=Eine große, laute Ablenkung kann nützlich sein, und dieser Zauber bietet genau das. Der Zaubernde verändert Schallwellen zu einem Lärm seiner Wahl: Er kann wie der Name des Zaubers klingen, das Rauschen des Verkehrs zur Stoßzeit nachahmen, aber auch wie das ferne Durcheinander von Schreien oder andere verstörende Geräusche klingen. Die Grundversion des Zaubers betrifft einen kugelförmigen Bereich mit zwei Metern Radius; dieser kann durch die Anpassung Fläche Vergrößern vergrößert werden. Pro Erfolg bei der Probe auf Hexerei + Magie hält der Lärm für 1 Kampfrunde weiter an, nachdem der Zauber fallen gelassen wurde. Die Erfolge dienen auch als Würfelpoolmalus für Personen, die versuchen, andere Geräusche im Wirkungsbereich zu hören.
spell.vehicle_armor.desc=Viele Runner lernen zu spät, dass Autotüren keine undurchdringlichen Schilde gegen Kugeln sind. Aber mit diesem Zauber können sie es sein! Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand des Fahrzeugs ab. Der Panzerungswert des Fahrzeugs steigt um 1 pro Nettoerfolg.

spellfeature.area=Flächenwirkung
spellfeature.area.page=133
spellfeature.area.desc=Blickfeld mit Flächenwirkung (BF (F)) bedeutet, dass der Zauber die Reichweite Blickfeld hat und eine Flächenwirkung besitzt, die ohne Anpassung 2 Meter Radius hat. Blickfeld (BF) bedeutet, dass der Zaubernde eine physische Sichtlinie zu seinem Ziel haben muss (optische Linsen wie die von Ferngläsern zählen als physische Sichtlinie; magische Effekte und digitale Bilder wie etwa durch ein Infrarot-Sichtgerät zählen nicht)
spellfeature.direct=Direkter Kampfzauber
spellfeature.direct.page=138
spellfeature.direct.desc=Direkte Kampfzauber beruhen darauf, dass du Mana in einer Weise formst, die direkt den Gegner schädigt - die Magie ist der Schaden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Intuition (gegen Pilot bei Drohnen) des Ziels ab. Erzielt das Ziel mehr Erfolge als du, verpufft der Zauber wirkungslos (aber du musst natürlich immer noch dem Entzug widerstehen). Gelingt dein Zauber, ist sein Schaden gleich deinen Nettoerfolgen und wird zu eventuellem zusätzlichem Schaden durch Hochdrehen des Zaubers addiert. Ist der Zauber erfolgreich, aber du erzielst keine Nettoerfolge, ist der Schaden des Zaubers gleich dem Schaden durch Hochdrehen (sofern du diese Anpassung zuvor gewählt hast). Dem Schaden durch direkte Kampfzauber kann nicht widerstanden werden.
spellfeature.indirect=Indirekter Kampfzauber
spellfeature.indirect.page=138
spellfeature.indirect.desc=Statt die Magie den Schaden direkt verursachen zu lassen, erschaffen indirekte Kampfzauber einen Effekt, der den Schaden verursacht - indem sie zum Beispiel einen Feuerball oder einen Blitzstrahl loslassen. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Reaktion + Willenskraft (gegen Pilot bei Drohnen) des Ziels ab. Erzielt das Ziel mehr Erfolge als du, trifft der Zauber nicht (aber du musst natürlich immer noch dem Entzug widerstehen). Ist dein Zauber erfolgreich, ist der Schaden gleich deiner Magie ÷ 2 (aufgerundet) + Nettoerfolge + Schaden durch Hochdrehen. Ziele widerstehen dem Schaden wie im physischen Kampf mit Konstitution. Indirekte Kampfzauber verursachen oft elementaren Schaden (siehe S. 112), wie zum Beispiel Feuerschaden.
spellfeature.sense_single=Monosensorisch
spellfeature.sense_single.page=136
spellfeature.sense_single.desc=Illusionszauber können monosensorisch sein, also nur einen Sinn betreffend.
spellfeature.sense_multi=Vollsensorisch
spellfeature.sense_multi.page=136
spellfeature.sense_multi.desc=Illusionszauber können vollsensorisch sein, also mehrere oder alle Sinne betreffend.

tradition.hermetic = Hermetische Tradition
tradition.hermetic.page = 131
tradition.hermetic.title = Hermetische Tradition
tradition.shaman = Schamanische Tradition
tradition.shaman.page = 128
tradition.shaman.title = Schamanische Tradition

tradition.hermetic.desc=Die Interpretationen der Hermetik haben sich im Laufe der Jahrhunderte leicht verändert, aber die hermetischen Glaubenssätze der Sechsten Welt fußen auf einer einzigen gemeinsamen Grundlage: Magie ist zwar noch nicht vollständig verstanden, sie kann aber verstanden werden. Hermetiker wählen einen wissenschaftlichen Zugang zur Magie. Sie führen einen Versuch und ein Laborexperiment nach dem anderen durch, um die logischen Grundlagen besser begreifen zu können. Es sollte nicht überraschen, dass die Fakultäten der prominentesten thaumaturgischen Universitäten der Welt vor allem Hermetiker als Lehrende beschäftigen. Hermetiker sehen sich als Angehörige einer langen, stolzen Tradition des Strebens nach dem Begreifen der grundlegenden Gesetze der Welt und der Möglichkeiten ihrer Manipulation. Sie weisen nur zu gerne darauf hin, dass die alchemistischen Studien von Isaac Newton viel mehr von seiner Lebenszeit beansprucht haben als seine Studien der Physik, und dass Leute wie John Dee und Aleister Crowley, die an die Ränder der akademischen Welt gedrängt wurden, nach dem Erwachen eine verspätete Rehabilitierung erfuhren. Weil Hermetiker meinen, dass sie die Magie verstehen, glauben sie, dass sie dadurch allen anderen Akademikern überlegen sind, weil deren Verständnis nur in der physischen Welt begründet ist. Das trägt viel zu ihrem Ruf als arrogante Snobs bei - ein Ruf, den sie gerne akzeptieren, denn schließlich ist es keine Arroganz, wenn man wirklich so gut ist.
tradition.shaman.desc=Schamanen empfinden den Wunsch der Hermetiker danach, alles in eine kalte, berechnende Ordnung zu pressen, abwechselnd als amüsant und als äußerst ärgerlich. Sie übernehmen in leicht abgewandelter Form eine alte Weisheit, indem sie sagen, dass das Schreiben über Magie so ist, als würde man über Architektur tanzen. Magie soll gefühlt und erlebt, nicht in spartanischen Labors und langweiligen Schulungsräumen studiert werden. Sie weisen darauf hin, dass allein die Existenz verschiedener Traditionen zeigt, dass Magie höchst individuell ist, und sie sagen, dass die kalten Gleichungen der Hermetiker niemals die Verschiedenheit und Macht unterschiedlicher magischer Ausdrucksformen beschreiben könnten. Die Anhänger der schamanischen Tradition glauben, dass man Magie wirken und erleben muss, statt sie unter Glas zu stellen. Das führt manchmal zu inkonsistenten Ergebnissen oder Unfällen mit Verletzungen, aber das kann in der Kunst, der Liebe und so vielen anderen Lebensbereichen genauso passieren. Warum sollte Magie da anders sein? Hermetiker sehen Schamanen als schlampig und undiszipliniert, und genau so mögen die Schamanen das.

