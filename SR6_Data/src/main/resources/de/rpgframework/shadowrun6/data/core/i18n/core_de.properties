action.backdoor_entry.desc=Diese Handlung ist mit dem Attribut Schleicher verbunden. <br/>Du versuchst, eine Hintertür zu benutzen, die du zuvor eingerichtet hast, um dir Zugang zu einem Host, Gerät oder anderen Bereich der Matrix zu verschaffen. Diese Handlung kann nur nach erfolgreicher Durchführung der Handlung Sondieren bei diesem Ziel benutzt werden. Die Nettoerfolge des Sondierens zählen als Würfelpoolbonus für diese Probe. Gelingt die Probe, erhältst du einen Admin-Zugang zum Ziel, der nicht als illegaler Zugang gilt. Das Durchführen illegaler Matrixhandlungen erhöht deinen Overwatch-Wert allerdings wie üblich. <br/>Misslingt die Probe, wurde die Hintertür entdeckt und entfernt, und du kannst die Handlung Hintertür benutzen im selben System erst wieder durchführen, wenn du mit der Handlung Sondieren eine neue Hintertür eingerichtet hast. Ein Misslingen der Probe löst nicht sofort Alarm aus, aber dein OW steigt wie üblich.
action.brute_force.desc=Diese Handlung ist mit dem Attribut Angriff verbunden.<br/>Du greifst ein Gerät direkt an und überflutest es mit Anfragen, Befehlen, Abfragen und anderem Müllcode, um eine Sicherheitslücke zu schaffen, über die du Zugang erhalten kannst. Brute Force ist mit Abstand der schnellste Weg, um illegalen Zugang zu einem Gerät zu erhalten, aber auch ziemlich riskant. Der Einsatz von Brute Force alarmiert immer das Gerät, zu dem du Zugang zu erhalten versuchst, daher steigt dein Overwatch-Wert mit jeder Brute- Force-Probe. Solltest du bei einem Versuch scheitern, mit Brute Force Zugang zu erhalten, kannst du in der nächsten Kampfrunde einen neuen unternehmen.<br/>Wenn du versuchst, als Gast einen User-Zugang oder als User einen Admin-Zugang zu erhalten, besteht der Würfelpool der Gegenseite aus Willenskraft + Firewall. Wenn du versuchst, einen Admin-Zugang zu erhalten, ohne zuvor einen User-Zugang erhalten zu haben, besteht der Würfelpool der Gegenseite aus Willenskraft + Firewall + 2, und der Verteidigungswert des Ziels wird für diese Probe um 4 erhöht.
action.change_icon.desc=Du veränderst das Icon des Ziels zu einem, von dem du eine Kopie hast oder das du selbst entworfen hast. Das Verändern eines Icons ändert nichts an den Ergebnissen einer Handlung Matrixwahrnehmung, kann aber Personas täuschen, die sich nicht die Zeit nehmen, genau nachzusehen. Du kannst auch dein eigenes Icon verändern, wenn du das willst.
action.check_os.desc=Gelingt die Probe, wirst du über deinen gegenwärtigen Overwatch-Wert informiert.
action.control_device.desc=Diese Handlung erlaubt eine erweiterte Fernsteuerung eines Geräts. Du behältst die Kontrolle über das Gerät, bis du sie abgibst oder aus dem System geworfen wirst. Solange du die Kontrolle hast, kannst du das Gerät mit gewöhnlichen Proben benutzen, als wärst du der Besitzer. Wenn du einen Admin-Zugang hast, kannst du es sogar ausschalten. Wenn mit dem Gerät, das du verwenden möchtest, keine Probe verbunden ist, verwendest du Cracken + Logik gegen Willenskraft + Firewall. Diese Handlung geht davon aus, dass du das Gerät direkt verwendest und nicht einem Gerät befiehlst, ein anderes zu benutzen (z. B. einer Drohne befiehlst, ihre Waffe abzufeuern). Die Handlung Gerät steuern schlägt bei einem Gerät, in das ein Rigger hineingesprungen ist, automatisch fehl.<br/>Wenn du Gerät steuern verwendest, kannst du mit dem Gerät jede Handlung durchführen, die mit deiner gegenwärtigen Zugangsstufe möglich ist. Ein gehackter User-Zugang gestattet dir alle Handlungen, die normalerweise einen legalen User-Zugang voraussetzen. Handlungen, für die man einen legalen Admin-Zugang braucht, setzen einen gehackten Admin-Zugang voraus.
action.crack_file.desc=Du entfernst den Schutz einer Datei, wodurch sie lesbar wird.
action.crash_program.desc=Du überlastest einen Teil des Hauptspeichers des Ziels und bringst damit ein laufendes Programm zum Absturz. Du musst ansagen, welches Programm du abstürzen lassen willst. Du kannst mit Matrixwahrnehmung herausfinden, welche Programme das Ziel laufen hat - oder indem du das Programm in Aktion siehst. Gelingt die Probe, stürzt das Programm ab: Es wird beendet und kann erst wieder gestartet werden, wenn das zugehörige Gerät neu gestartet wird.
action.data_spike.desc=Diese Handlung ist mit dem Attribut Angriff verbunden.<br/>Du schickst Schadcode gegen eine Persona oder ein Gerät, was beim Ziel zu Matrixschaden führt. Dein Angriff hat einen Schadenswert in Höhe deines Angriffsattributs ÷ 2 (aufgerundet); pro Nettoerfolg erhöht sich der Schaden um 1. Ihm wird mit Firewall Widerstand geleistet.
action.disarm_data_bomb.desc=Du versuchst, eine Datenbombe zu entschärfen, die du (meistens als Ergebnis einer Matrixwahrnehmung) entdeckt hast. Wenn du Nettoerfolge erzielst, wird die Datenbombe entschärft und entfernt. Wenn nicht, wird sie aktiviert, verursacht Schaden und löscht wahrscheinlich die Datei, in die sie eingepflanzt wurde (sofern das in ihrem Code vorgesehen war).
action.edit_file.desc=Datei editieren erlaubt es, Dateien zu erstellen, zu ändern, zu kopieren oder zu löschen. Der Verteidiger ist entweder der Host, auf dem die Datei liegt, oder der Besitzer der Datei (wenn sie nicht auf einem Host liegt). Mit jeder Handlung kann ein Detail der Datei verändert werden: ein kurzer Absatz Text, ein Detail eines Bilds oder zwei bis drei Sekunden Video oder Audio (du musst gemeinsam mit der Spielleiterin festlegen, was genau "ein Detail" bedeutet). Die Spielleiterin kann einen Würfelpoolmalus für diese Probe festlegen, wenn du komplizierte oder schwierige Änderungen vornehmen willst. Wenn du eine Datei fortlaufend ändern (also etwa dein Team aus einer Videoübertragung entfernen) willst, musst du diese Handlung einmal pro Kampfrunde durchführen, solange du diese Änderungen laufen lassen willst. Wenn du diese Handlung benutzt, um eine Datei zu kopieren, wirst du zum Besitzer der neuen Datei. Wenn die Datei, die du kopieren willst, geschützt ist (s. Datei cracken), misslingt die Handlung automatisch. Wenn die Datei eine Datenbombe enthält, wird diese gezündet (denk also daran, Dateien zu überprüfen, bevor du sie öffnest).
action.encrypt_file.desc=Die Erfolge bei dieser Probe erzeugen eine Verschlüsselungsstufe, die bei zukünftigen Versuchen mit der Handlung Datei cracken den Würfelpool der Verteidigung festlegt.
action.enter_host.desc=Du betrittst oder verlässt einen Host. Dazu ist keine Probe nötig, aber verschiedene Hosts haben unterschiedliche Zugangsstufen, also braucht man den richtigen Zugang, um reinzukommen. Um einen Host zu verlassen, ist keine Zugangsstufe nötig, weil die Matrix Eindringlinge immer gerne wieder verschwinden sieht.
action.erase_matrix_signature.desc=Du löschst eine Matrixsignatur, die von einem Resonanzwesen wie einem Technomancer oder Sprite hinterlassen wurde. Gelingt die Probe, verschwindet die Signatur. Du musst das Attribut Resonanz besitzen, um diese Handlung durchführen zu können. Anders als andere Handlungen, die Resonanz voraussetzen, ist dies eine echte Matrixhandlung, die auch noch illegal ist, also kann dabei der Overwatch-Wert steigen.
action.format_device.desc=Du schreibst den Bootsektor eines Geräts neu. Beim nächsten Neustart schaltet sich das Gerät einfach dauerhaft aus, bis seine Software ersetzt wurde. Ein Gerät, das sich auf diese Weise ausgeschaltet hat, verliert all seine WiFi-Vorteile, kann aber weiter als normaler Mechanismus benutzt werden (eine Tür mit Klinke kann geöffnet werden, eine Waffe mit Abzug kann abgefeuert werden usw.). Außerdem ist es nicht mehr über die Matrix erreichbar. Das Reparieren eines formatierten Geräts folgt denselben Regeln wie das Reparieren eines lahmgelegten Geräts (s. Lahmgelegte Geräte, S. 175). Bei dieser Probe ist eine Anzahl von Erfolgen gleich der Gerätestufe des Geräts nötig, um den beschädigten Bootcode zu ersetzen.
action.full_matrix_defense.desc=Diese Handlung ist das Matrix-Äquivalent zu Volle Abwehr (S. 46). Addiere bis zum Ende der Kampfrunde deine Firewall zu allen Verteidigungsproben in der Matrix. Dies ist eine Jederzeit-Handlung, die du auch durchführen kannst, wenn du nicht am Zug bist.
action.hash_check.desc=Diese Handlung ist eine spezialisierte Matrixsuche, die dadurch illegal wird, dass sie nach einer verschlüsselten Datei sucht, indem sie diese mit einer Prüfsumme vergleicht (und GOD mag es nicht, wenn sich jemand an einer Verschlüsselung vorbeischmuggeln will). Du kannst durch die Suche nach einer bestimmten Prüfsumme ein verschlüsseltes Dokument in einem Host oder Gerät finden, ohne zuvor alle Dokumente entschlüsseln zu müssen, um das Richtige zu finden. Das funktioniert am besten, wenn Mr Johnson die Prüfsumme zur Verfügung stellt, aber wenn es nicht anders geht, kannst du auch versuchen, diese zu schätzen. Der Schwellenwert beträgt 1, wenn du eine Prüfsumme von Mr Johnson oder aus einer anderen Quelle hast, und 4, wenn du es alleine versuchen musst. Das Erreichen des Schwellenwerts bedeutet, dass du die Zahl potenziell übereinstimmender Dateien auf 32 begrenzen kannst. Jeder Nettoerfolg halbiert diese Anzahl (auf 16 Dateien mit 1 Nettoerfolg, auf 8 mit 2 Nettoerfolgen usw.). Wenn die Anzahl an potenziellen Treffern nach der ersten Probe noch zu groß erscheint, kann die Probe mit einem Würfelpoolmalus von -2 für einen neuen Versuch (siehe S. 38) wiederholt werden. Wenn diese folgende Probe gelingt, wird die Anzahl der potenziellen Treffer halbiert; Nettoerfolge halbieren wie üblich weiter.
action.hide.desc=Diese Handlung ist mit dem Attribut Schleicher verbunden.<br/>Wenn du in der Matrix herumlungerst, wirst du wahrscheinlich von einem anderen Icon entdeckt - selbst wenn du auf Schleichfahrt läufst. Du kannst diese Handlung durchführen, damit ein Ziel deine Spur verliert. Gelingt die Probe, kann das Ziel dich nicht mehr sehen und muss eine neue Handlung Matrixwahrnehmung durchführen, um dich wiederzufinden. Du kannst dich nicht vor einem Icon verstecken, das bei irgendeinem Gerät in deinem PAN User- oder Admin-Zugang erhalten hat.
action.jack_out.desc=Durch diese Handlung wirst du von der Matrix getrennt, und dein Zugangsgerät wird neu gestartet. Wenn du in der VR warst und nicht zuerst in die AR gewechselt hast, erleidest du Auswurfschock. Die Probe ist nur dann eine Vergleichende Probe, wenn du von jemandem mit einer Linksperre belegt wurdest; die Gegenseite bildet in diesem Fall das Icon, das dafür verantwortlich ist. Wenn dich mehr als eine Persona mit einer Linksperre belegt hat, musst du alle Gegner besiegen: Du legst eine einzelne Probe ab, und jeder der Gegner verteidigt sich einzeln dagegen. Du kannst nur dich selbst ausstöpseln. Du kannst niemand anderen auswerfen, außer wenn du ihn durch Matrixschaden außer Gefecht setzt.
action.jam_signals.desc=Diese Handlung verwandelt das Gerät, das du benutzt, in einen kleinen Störsender. Solange du das Gerät nicht für andere Matrixhandlungen benutzt, addiert es alle Erfolge, die du bei der Probe erzielst, zum Rauschenwert für Matrixhandlungen mit oder gegen Geräte in einem Umkreis von 100 Metern. Wenn du nur bestimmte Frequenzen oder Ziele stören willst, kauf dir einen Störsender - dafür sind die da.
action.jump_rigged.desc=Du kannst in ein Gerät mit Riggerinterface springen (meist ein Fahrzeug oder eine Drohne). Es gibt allerdings einige Voraussetzungen, die du dafür erfüllen musst: Du musst die passende Zugangsstufe für das betreffende Gerät haben, du musst in der VR sein, das Gerät muss ein Riggerinterface haben, und du selbst musst eine Riggerkontrolle haben. Wenn du der Besitzer des Geräts bist oder der Besitzer es dir erlaubt hat, ist für das Hineinspringen keine Probe nötig. In der Matrix wird das Icon des Geräts, in das du hineingesprungen bist, zum Teil deiner Persona, und es kann nicht das Ziel von Matrixhandlungen sein, solange du hineingesprungen bleibst. Wenn bereits jemand anderer in das Gerät gesprungen ist, kannst du diese Handlung nicht durchführen.
action.matrix_perception.desc=Eine erfolgreiche Probe gibt dir Informationen über das Ziel. Bei einem Unentschieden kannst du das Icon des Ziels wahrnehmen. Ein einzelner Nettoerfolg gibt dir grundlegende Informationen, wie zum Beispiel die Gerätestufe oder den Namen, den das Gerät oder Icon sich gibt. Zwei Nettoerfolge geben dir genauere Informationen, darunter Werte einzelner Attribute und welche Programme beim Ziel gerade laufen. Zusätzliche Nettoerfolge geben dir noch mehr Informationen, je nachdem, was der Spielleiter enthüllen will.<br/>Diese Handlung kann auch verwendet werden, um Icons in der Nachbarschaft zu finden, die auf Schleichfahrt laufen.Matrixwahrnehmung erfordert normalerweise eine Haupthandlung, aber wenn sie von jemandem durchgeführt wird, der sich per VR in der Matrix befindet, erfordert sie nur eine Nebenhandlung.
action.matrix_search.desc=Du suchst in der öffentlich zugänglichen Matrix nach Informationen. Abhängig von der Anzahl der Erfolge erhältst du unterschiedlich viele Informationen über das Thema. Verwende die Tabelle Beinarbeit (S. 53) als allgemeine Richtlinie für die enthüllten Informationen.
action.probe.desc=Diese Handlung ist mit dem Attribut Schleicher verbunden.<br/>Du suchst nach Schwachpunkten bei einem Gerät, Host oder PAN, um einen Zugang zu erhalten. Du lässt dir Zeit, um möglichst unauffällig zu sein, keinen Alarm auszulösen und unauffällig eine Hintertür zu schaffen, die du später benutzen kannst. Das heißt, dass du für diese Handlung etwa 1 Minute brauchst (in der Matrix eine halbe Ewigkeit). Sondieren ist nicht so schnell wie Brute Force, löst dafür aber auch nicht automatisch Alarm aus. Selbst wenn du mit dem ersten Versuch scheiterst, wird kein Alarm ausgelöst, wenn dir keine schweren Fehler (lies: ein Patzer) unterlaufen. Systeme und Geräte erkennen deine Gegenwart erst, wenn du Zugang zu ihnen erhalten hast. Indem du bei einem Gerät Sondieren einsetzt, kannst du eine bleibende Hintertür ins System einrichten.<br/>Sobald du die Hintertür geschaffen hast, kannst du später die Handlung Hintertür benutzen durchführen. Nettoerfolge beim Sondieren zählen als Würfelpoolbonus auf die zukünftige Handlung Hintertür benutzen, wenn diese gegen das betroffene Gerät abgelegt wird. Wie lange diese Hintertür erhalten bleibt, hängt von dem Gerät oder Host ab: Im Allgemeinen bleibt sie für [10 - Host-/Gerätestufe] Stunden bestehen, oder bis das Gerät/der Host neu gestartet wird (je nachdem, was eher passiert).
action.reboot_device.desc=Das Zielgerät, -PAN oder die Zielpersona geht offline und ist am Ende der folgenden Kampfrunde wieder online. Der Overwatch-Wert des Ziels und jeglichen Zugriff, den es hatte, wird zurückgesetzt. Durch den Neustart wird kein Auswurfschock verursacht. Du kannst nicht neu starten, wenn du Opfer einer Linksperre bist.
action.reconfigure.desc=Du kannst die Werte zweier Matrixattribute deiner Persona (die nicht 0 betragen) austauschen, selbst wenn diese Werte von verschiedenen Geräten erzeugt werden. Näheres zu Matrixattributen findest du unter Personas und Attribute (S. 174); zur Veränderung von Matrixattributen siehe den Beispielkasten Verteilen von Matrixattributen.
action.send_message.desc=Du sendest eine Text- oder Audionachricht (einen kurzen Satz), ein Bild oder eine Datei über die Matrix zu einem User, dessen Kommcode du hast. Wenn du die Matrix über ein DNI benutzt, kannst du sogar in der AR längere und kompliziertere Botschaften versenden (etwa einen Absatz an Text). Außerdem kannst du diese Handlung benutzen, um eine Live-Übertragung für einen oder mehrere Empfänger zugänglich zu machen, die von einem digitalen Aufzeichnungsgerät aufgezeichnet wird, das du hast.
action.set_data_bomb.desc=Du platzierst eine Datenbombe in einer Datei. Lege die Stufe der Datenbombe fest, die maximal so hoch sein kann wie die Anzahl deiner Nettoerfolge. Außerdem musst du festlegen, ob die Datenbombe die verminte Datei löschen soll, wenn sie aktiviert wird. Und du musst ein Passwort für die Deaktivierung festlegen. Eine Datei kann nur eine Datenbombe gleichzeitig haben.<br/>Die Datenbombe wird ausgelöst, wenn jemand ohne Benutzung des Passworts versucht, die Datei zu lesen, zu editieren, zu kopieren, zu verschlüsseln, zu löschen oder eine andere Datenbombe darin zu platzieren, ohne die bereits existierende Datenbombe zu entschärfen. Wenn eine Datenbombe hochgeht, verursacht sie [Stufe × 2] Kästchen Matrixschaden (dem mit Firewall widerstanden wird) beim auslösenden Icon, löscht die Datei (wenn sie so eingestellt ist) und anschließend sich selbst. Wenn das Passwort benutzt wird, wird die Datenbombe nicht aktiviert. Stattdessen bleibt sie in der Datei und wartet auf den nächsten Zugriff.<br/>Eine Datenbombe kann mit der Handlung Matrixwahrnehmung entdeckt werden. Wenn sie entdeckt ist, kann sie mit der Handlung Datenbombe entschärfen unschädlich gemacht werden. Eine entschärfte Datenbombe wird gelöscht.
action.snoop.desc=Diese Handlung lässt dich Matrixübertragungen, die von und zu deinem Ziel gesendet werden, abfangen, solange du Zugang hast. Du kannst zusehen, zuhören, mitlesen oder die Übertragung abspeichern, wenn du ein Gerät zum Speichern hast (wofür dein Deck oder Kommlink ausreicht).
action.spoof_command.desc=Du sendest einem Gerät ein Signal mit einem Befehl, von dem es glaubt, er käme von seinem Besitzer. Das Gerät versucht dann automatisch, die befohlene Handlung als seine nächste verfügbare Haupthandlung durchzuführen.
action.switch_ifmode.desc=Du schaltest deinen Interfacemodus von AR auf VR oder umgekehrt.
action.tarpit.desc=Diese Handlung ist mit dem Attribut Angriff verbunden.<br/>Manchmal willst du so viel Schmerz zufügen wie möglich. Und manchmal willst du nur ein bisschen Schmerz zufügen und den Gegner ein bisschen verlangsamen, damit deine nächsten Schläge leichter treffen. Wenn dir dieser Angriff gelingt, fügst du dem angegriffenen Icon 1 + Nettoerfolge Matrixschaden zu (dem mit Firewall widerstanden wird) und senkst das Attribut Datenverarbeitung des Icons um dieselbe Summe. Wenn das Attribut Datenverarbeitung eines Geräts auf 0 gesenkt wird, kann der Benutzer erst wieder Matrixhandlungen durchführen, wenn es mindestens wieder einen Wert von 1 hat. Datenverarbeitung regeneriert sich um 1 am Ende jeder Kampfrunde, beginnend mit der Kampfrunde nach derjenigen, in der der Angriff durchgeführt wurde.
action.trace_icon.desc=Diese Handlung ist mit dem Attribut Schleicher verbunden.<br/>Du spürst den physischen Aufenthaltsort eines Geräts oder einer Persona auf. Wenn du mit dieser Handlung Erfolg hast, kennst du den Aufenthaltsort des Ziels, solange du Zugriff darauf hast. Diese Handlung funktioniert nicht bei IC oder Hosts ohne physischen Ort.
action.compile_sprite.desc=Um ein Sprite zu kompilieren - also seine Realität aus der Resonanz der Matrix herauszuziehen -, musst du zuerst die Stufe und Art des Sprites festlegen. Die maximale Stufe eines Sprites, das du kompilieren kannst, ist gleich deiner Resonanz × 2. Dann legst du mit einer Haupthandlung eine Vergleichende Probe auf Tasken + Resonanz gegen Spritestufe × 2 ab. Alle Nettoerfolge zählen als Aufgaben des Sprites. Nach dem Kompilieren musst du Schwund (siehe S. 189) in Höhe der Erfolge (nicht Nettoerfolge) des Sprites bei der Probe widerstehen.
action.register_sprite.desc=Wenn du ein Sprite vor den Versuchen der Matrix schützen willst, es zu zerquetschen, und wenn du mehr als ein Sprite haben willst, musst du Sprites registrieren. Das ist ein aufwendiger, zeitraubender Prozess, der eine Anzahl von Stunden gleich der Spritestufe dauert. Weder der Technomancer noch das Sprite können während dieser Zeit irgendwelche anderen Handlungen durchführen.<br/>Die gute Nachricht ist, dass der Overwatch-Wert des Sprites währenddessen nicht steigt (und auch der des Technomancers nicht). Am Ende dieser Zeitspanne legst du eine Vergleichende Probe auf Tasken + Resonanz gegen Spritestufe × 2 ab. Das Registrieren verursacht Schwund (siehe S. 189) in Höhe von Erfolge × 2 (nicht Nettoerfolge × 2) des Sprites, mindestens aber 2.<br/>Wenn du mindestens einen Nettoerfolg bei dieser Probe erzielst, ist das Sprite erfolgreich registriert und wird als legitimer Teil der Matrix angesehen. Außerdem addieren sich die Nettoerfolge bei dieser Probe zu den Aufgaben des Sprites, und die Lebenszeit des Sprites ist nicht mehr begrenzt. Sein Overwatch-Wert wird auf null zurückgesetzt, kann aber wieder steigen, wenn das Sprite illegale Handlungen durchführt. Außerdem kannst du jetzt mehr als ein Sprite haben: Die maximale Anzahl deiner registrierten Sprites ist gleich deiner Resonanz; zusätzlich kannst du noch ein unregistriertes Sprite haben. Außerdem können registrierte Sprites besondere Aufgaben erfüllen, wie unten angegeben.
action.decompile_sprite.desc=Alles hat ein Ende. Was kompiliert wurde, kann dekompiliert werden. Technomancer können versuchen, die Sprites anderer Technomancer (oder ihre eigenen, wenn sie das aus irgendeinem Grund wollen) zu dekompilieren. Dazu legst du mit einer Haupthandlung eine Vergleichende Probe auf Tasken + Resonanz gegen die Spritestufe (+ Resonanz des Technomancers, der es kompiliert hat, wenn es registriert ist) ab. Jeder Nettoerfolg entfernt eine offene Aufgabe des Sprites. Wenn die Zahl der offenen Aufgaben auf null sinkt, ist das Sprite dekompiliert und kehrt in die Resonanz zurück, die es geboren hat. Das Dekompilieren verursacht Schwund (siehe S. 189) in Höhe der Erfolge × 2 (nicht Nettoerfolge × 2) des Sprites, mindestens aber 2.

